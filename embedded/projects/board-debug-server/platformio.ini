; PlatformIO Project Configuration File
;
; Boardsesh Board Debug Server
; Test rig firmware for the 7" Waveshare panel: emulates a Kilter / Tension /
; MoonBoard board over BLE so the phone apps can be developed against it
; without dragging out a real board. When the phone places a climb, the
; firmware fetches the rendered PNG from boardsesh.com and shows it on screen.
;
; Build env:
;   waveshare-7inch-debug - Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB)

[platformio]
default_envs = waveshare-7inch-debug

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    aurora-protocol=symlink://../../libs/aurora-protocol
    nordic-uart-ble=symlink://../../libs/nordic-uart-ble
    moonboard-protocol=symlink://../../libs/moonboard-protocol
    moonboard-uart-ble=symlink://../../libs/moonboard-uart-ble
    led-controller=symlink://../../libs/led-controller
    config-manager=symlink://../../libs/config-manager
    log-buffer=symlink://../../libs/log-buffer
    wifi-utils=symlink://../../libs/wifi-utils
    esp-web-server=symlink://../../libs/esp-web-server
    display-base=symlink://../../libs/display-base
    waveshare-display=symlink://../../libs/waveshare-display
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    h2zero/NimBLE-Arduino@^1.4.1
    lovyan03/LovyanGFX@^1.1.12
    ricmoo/QRCode@^0.0.1

extra_scripts =
    pre:scripts/load_env.py
    pre:scripts/run_gen_data.py

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_INIT_LENGTH=512

[env:waveshare-7inch-debug]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb_app.csv

build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ENABLE_WAVESHARE_DISPLAY=1
    -D DEBUG_FIRMWARE=1
    -D FIRMWARE_BUILD_ENV=\"waveshare-7inch-debug\"
    ; PSRAM required: image buffer + RGB framebuffer (800*480*2 = 768KB)
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; LovyanGFX feature flags
    -D LGFX_USE_V1
    ; FastLED kept off main RMT channels to avoid conflict with display
    -D FASTLED_RMT_MAX_CHANNELS=2
    ; Unused by debug rig but referenced by waveshare-display lib symbols
    -D WAVESHARE_LED_PIN=43
