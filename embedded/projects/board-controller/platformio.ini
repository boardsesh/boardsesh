; PlatformIO Project Configuration File
;
; Boardsesh Board Controller Firmware
; Supports ESP32 and ESP32-S3 development boards
;
; Build variants:
;   esp32s3dev       - Standard board controller (LEDs only)
;   esp32s3dev-proxy - Board controller with BLE proxy
;   tdisplay-s3      - T-Display-S3 with display + BLE proxy
;   waveshare-7inch  - Waveshare 7" touch LCD with display + BLE proxy
;   waveshare-amoled-216 - Waveshare ESP32-S3-Touch-AMOLED-2.16 dev board
;   esp32dev         - Standard ESP32 (legacy)

[platformio]
default_envs = esp32s3dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Shared local libraries (symlink)
lib_deps =
    aurora-protocol=symlink://../../libs/aurora-protocol
    led-controller=symlink://../../libs/led-controller
    config-manager=symlink://../../libs/config-manager
    log-buffer=symlink://../../libs/log-buffer
    wifi-utils=symlink://../../libs/wifi-utils
    graphql-ws-client=symlink://../../libs/graphql-ws-client
    nordic-uart-ble=symlink://../../libs/nordic-uart-ble
    esp-web-server=symlink://../../libs/esp-web-server
    graphql-types=symlink://../../libs/graphql-types
    ; External libraries from PlatformIO registry
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0
    tzapu/WiFiManager@^2.0.17
    h2zero/NimBLE-Arduino@^2.5.0

; Pre-build script for GraphQL type generation
extra_scripts = pre:../../scripts/prebuild.py

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_INIT_LENGTH=512
    -Isrc

; ============================================
; ESP32-S3 Development Board (recommended)
; Standard LED controller without proxy/display
; ============================================
[env:esp32s3dev]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv

build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D FIRMWARE_BUILD_ENV=\"esp32s3dev\"

; ============================================
; ESP32-S3 with BLE Proxy Mode
; LED controller + BLE proxy (no display)
; ============================================
[env:esp32s3dev-proxy]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv

lib_deps =
    ${env.lib_deps}
    ble-proxy=symlink://../../libs/ble-proxy
    climb-history=symlink://../../libs/climb-history

build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ENABLE_BLE_PROXY=1
    -D FIRMWARE_BUILD_ENV=\"esp32s3dev-proxy\"

; ============================================
; LilyGo T-Display-S3 (170x320 LCD)
; Display + BLE proxy + LED controller
; ============================================
[env:tdisplay-s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb_app.csv

lib_deps =
    ${env.lib_deps}
    ble-proxy=symlink://../../libs/ble-proxy
    climb-history=symlink://../../libs/climb-history
    display-base=symlink://../../libs/display-base
    lilygo-display=symlink://../../libs/lilygo-display
    ; Display libraries
    lovyan03/LovyanGFX@^1.1.12
    ricmoo/QRCode@^0.0.1

build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ENABLE_BLE_PROXY=1
    -D ENABLE_DISPLAY=1
    -D FIRMWARE_BUILD_ENV=\"tdisplay-s3\"
    ; PSRAM support
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; LilyGo T-Display S3 specific
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    ; Move LED pin to avoid conflict with LCD_RST (GPIO 5)
    -D TDISPLAY_LED_PIN=43
    ; Use fewer RMT channels to avoid conflict with display
    -D FASTLED_RMT_MAX_CHANNELS=2

; ============================================
; Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, portrait)
; 7" touch display + BLE proxy + LED controller
; ============================================
[env:waveshare-7inch]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb_app.csv

lib_deps =
    ${env.lib_deps}
    ble-proxy=symlink://../../libs/ble-proxy
    climb-history=symlink://../../libs/climb-history
    display-base=symlink://../../libs/display-base
    waveshare-display=symlink://../../libs/waveshare-display
    board-data=symlink://../../libs/board-data
    lovyan03/LovyanGFX@^1.1.12
    ricmoo/QRCode@^0.0.1

build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ENABLE_BLE_PROXY=1
    -D ENABLE_WAVESHARE_DISPLAY=1
    -D ENABLE_BOARD_IMAGE=1
    -D FIRMWARE_BUILD_ENV=\"waveshare-7inch\"
    ; PSRAM support (required for RGB framebuffer: 800x480x2 = 768KB)
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; LED pin for Waveshare board
    -D WAVESHARE_LED_PIN=43
    ; Use fewer RMT channels to avoid conflict with display
    -D FASTLED_RMT_MAX_CHANNELS=2

; ============================================
; Waveshare ESP32-S3-Touch-AMOLED-2.16 (480x480 QSPI AMOLED)
; Dev-board firmware with BLE proxy + local climb preview rendering
; ============================================
[env:waveshare-amoled-216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb_app.csv

lib_deps =
    ${env.lib_deps}
    ble-proxy=symlink://../../libs/ble-proxy
    climb-history=symlink://../../libs/climb-history
    display-base=symlink://../../libs/display-base
    waveshare-amoled-display=symlink://../../libs/waveshare-amoled-display
    board-data=symlink://../../libs/board-data
    moononournation/GFX Library for Arduino@^1.6.4
    bitbank2/JPEGDEC@^1.8.2

build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ENABLE_BLE_PROXY=1
    -D ENABLE_WAVESHARE_AMOLED_DISPLAY=1
    -D ENABLE_BOARD_IMAGE=1
    -D FIRMWARE_BUILD_ENV=\"waveshare-amoled-216\"
    ; PSRAM support (used by WiFi/TLS buffers and decoded image allocations)
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Dev default uses GPIO41/SD_CS; override if the SD socket is needed.
    -D WAVESHARE_AMOLED_LED_PIN=41
    ; Use fewer RMT channels to avoid display peripheral conflicts
    -D FASTLED_RMT_MAX_CHANNELS=2

; ============================================
; Isolated gym fixture. EXT_ADV changes NimBLE's advertising API, so legacy
; controller/proxy sources and libraries must not enter this target's graph.
; ============================================
[env:waveshare-amoled-gym]
extends = env:waveshare-amoled-216
board_build.partitions = partitions_16mb_gym.csv
build_src_filter = -<*> +<gym_fixture.cpp>
extra_scripts =
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0
    fastled/FastLED@^3.6.0
    moononournation/GFX Library for Arduino@^1.6.4
    bitbank2/JPEGDEC@^1.8.2
    aurora-protocol=symlink://../../libs/aurora-protocol
    moonboard-protocol=symlink://../../libs/moonboard-protocol
    led-controller=symlink://../../libs/led-controller
    config-manager=symlink://../../libs/config-manager
    log-buffer=symlink://../../libs/log-buffer
    wifi-utils=symlink://../../libs/wifi-utils
    esp-web-server=symlink://../../libs/esp-web-server
    display-base=symlink://../../libs/display-base
    waveshare-amoled-display=symlink://../../libs/waveshare-amoled-display
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_BT_NIMBLE_EXT_ADV=1
    -D CONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -D ENABLE_GYM_FIXTURE=1
    -include src/gym/provisioned_defaults.h
    -D ENABLE_BOARD_IMAGE=1
    -I../../libs/board-data/src
    -Wl,--wrap=esp_bt_controller_init
    -D FIRMWARE_BUILD_ENV=\"waveshare-amoled-gym\"

; Synthetic identities exist only in this explicit radio proof build.
[env:waveshare-amoled-gym-proof]
extends = env:waveshare-amoled-gym
build_flags =
    ${env:waveshare-amoled-gym.build_flags}
    -D GYM_FIXTURE_BLE_PROOF=1

; ============================================
; Standard ESP32 Development Board (legacy)
; ============================================
[env:esp32dev]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv

build_flags =
    ${env.build_flags}
    -D FIRMWARE_BUILD_ENV=\"esp32dev\"

; ============================================
; GLEDOPTO GL-C-015WL-D (classic ESP32, 4MB, WLED-style controller)
; Standalone LED controller for a Kilter WS2811 pixel-node string.
; Data output on GPIO16 (GL-C-015WL-D's primary "D1" channel).
; Flash over the controller's USB/UART download port.
; ============================================
[env:gledopto-c015]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv

build_flags =
    ${env.build_flags}
    ; GL-C-015WL-D primary data output. Try 2 (the "D2" channel) if no output.
    -D GLEDOPTO_LED_PIN=16
    ; The board gates the LED output V+ terminal behind a high-side MOSFET.
    ; Drive the enable pin high or output V+ reads ~0V and the strip must be
    ; powered directly from the PSU. GPIO18 verified on real hardware via a
    ; pin sweep (12V when high, ~0.6V when low); GPIO12 is what the GLEDOPTO
    ; manual documents ("Relay GPIO 12") for other revisions — drive both.
    -D LED_POWER_ENABLE_PIN=18
    -D LED_POWER_ENABLE_PIN_2=12
    ; WS2811 pixel nodes. Override to WS2812B or SK6812 if the string differs.
    -D LED_CHIPSET=WS2811
    ; RGB confirmed on hardware (Setter-Closet 12V WS2811 string). GRB shows
    ; red/green swapped. Override to GRB if a different string needs it.
    -D LED_COLOR_ORDER=RGB
    -D FIRMWARE_BUILD_ENV=\"gledopto-c015\"
