[package]
name = "board-renderer-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM board overlay renderer for Boardsesh climbing app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tiny-skia = "0.11"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render_bench"
harness = false

[profile.release]
opt-level = 3 # Optimize for speed (rendering perf > binary size)
lto = true

# wasm-opt mangled the externref table exports on the fill_opacity binary
# (shipping an __wbindgen_externrefs export pointing at the funcref table,
# which has a fixed size — Table.grow(4) in __wbindgen_init_externref_table
# then blows up at module init). Skip wasm-opt so the committed pkg/ matches
# what rustc + wasm-bindgen produce directly and the binary is correct.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
