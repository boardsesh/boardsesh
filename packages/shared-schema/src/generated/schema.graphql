Result of a smart playlist query.
"""
type SmartPlaylistResult {
  "Playlist metadata"
  meta: SmartPlaylistMeta!
  "Page of climbs with full data"
  climbs: [Climb!]!
  "Total number of climbs (matches meta.climbCount)"
  totalCount: Int!
  "Whether more pages are available"
  hasMore: Boolean!
}

