plugins {
  id 'com.android.library'
  // Canonical Expo local-module plugin: applies Kotlin + provides
  // expo-modules-core (Module/ModuleDefinition API) on the compile classpath,
  // version-proof. Groovy (not .kts) so the library defaultConfig
  // versionCode/versionName the plugin requires can be set.
  id 'expo-module-gradle-plugin'
}

group = 'com.boardsesh'
version = '1.0.0'

android {
  namespace 'com.boardsesh.sprayeditorinput'
  compileSdk 36

  defaultConfig {
    minSdk 24
    // Required by expo-module-gradle-plugin's publication setup.
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // JVM unit tests for the key matcher (SprayShortcutMatcher). Run via
  // :…:testDebugUnitTest in .github/workflows/android-pr-rn.yml; the repo's
  // `vp` flow has no Kotlin test runner.
  testImplementation 'junit:junit:4.13.2'
}
