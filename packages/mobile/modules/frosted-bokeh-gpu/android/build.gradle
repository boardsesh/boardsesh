plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.boardsesh'
version = '1.0.0'

android {
  namespace 'com.boardsesh.frostedbokeh'
  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Expo keeps React Android as an implementation dependency; our view uses
  // its lifecycle API directly, so it must be on this module's classpath too.
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
