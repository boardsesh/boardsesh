<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="application-name" content="Boardsesh" />
    <meta name="theme-color" content="#000000" />
    <!-- Dev/Metro-proxy value; every export rewrites it from its own baseUrl.
         Don't hand-edit: docs/expo-web-deployment.md, "PWA manifest". -->
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="icon" href="https://www.boardsesh.com/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="https://www.boardsesh.com/icons/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #000000;
        color-scheme: dark;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #000000;
      }

      /* Boot paint. Everything below draws the loading state that #boot-paint
         renders, and none of it survives first commit: Expo's web entry takes
         the createRoot() branch (hydrate is only set by static rendering, and
         this app is web.output 'single'), and createRoot clears the container's
         existing children before it mounts. So this is a pure placeholder — no
         teardown code, no script, no extra request.

         Why it exists: the shell paints #000000 and #root was empty, so the page
         was a black rectangle for as long as the JS bundle took to arrive and
         evaluate. On a cold cache over mobile data that is tens of seconds, and
         it reads as a broken app rather than a loading one. The shell is ~2 KB
         and deliberately not immutable-cached, so it lands in one round trip. */
      #boot-paint {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #boot-paint b {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f4f1fb;
      }
      #boot-paint i {
        display: block;
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background-color: #2f234a;
        overflow: hidden;
      }
      #boot-paint i::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background-color: #a78bfa;
        animation: boot-paint-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-paint-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(330%);
        }
      }
      /* An indeterminate bar that never resolves is a vestibular trigger, and
         this one can run for half a minute on a cold load. Hold it still and let
         the wordmark carry the "loading" signal instead. */
      @media (prefers-reduced-motion: reduce) {
        #boot-paint i::after {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. Its children are the pre-JS loading
         state (see #boot-paint in the stylesheet above); React drops them on
         first commit. -->
    <div id="root">
      <div id="boot-paint">
        <b>Boardsesh</b>
        <i></i>
      </div>
    </div>
  </body>
</html>
