appId: ${APP_ID}
name: android login + board + climbs (no-freeze)
---
# Conclusive no-freeze proof on a cold start: sign in with a real account, select a
# board, and swipe the climbs list — all by touch. The cold-start touch-freeze would
# make every one of these a no-op (you can't type, submit, tap a board, or scroll a
# frozen hit-region), so reaching the end proves touch is alive. Credentials come
# via -e (EMAIL/PASSWORD); deep links only move between screens — the sign-in, the
# board tap, and the list swipe are real touch.

- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: 'auth-email-input'
    timeout: 60000
- takeScreenshot: 01-login-mounted

# --- Sign in via the app's own focus/submit path ---
# Synthetic taps don't focus the password field or fire the custom Sign-in button,
# so drive the app's IME actions: email "next" → passwordRef.focus(); password
# "done" → onSubmitEditing → onSubmit().
- tapOn:
    id: 'auth-email-input'
- inputText: ${EMAIL}
- pressKey: Enter
- inputText: ${PASSWORD}
- takeScreenshot: 02-credentials-entered
- pressKey: Enter
# Login succeeded once the login form is gone (a fresh login with no board lands on
# the "now on the wall" board-onboarding, not the home tab).
- extendedWaitUntil:
    notVisible:
      id: 'auth-email-input'
    timeout: 120000
- takeScreenshot: 03-logged-in

# --- Select a board (touch on a board card) ---
# Dismiss the board-presence onboarding if it's up so navigation isn't gated.
- tapOn:
    text: 'Look around first'
    optional: true
- waitForAnimationToEnd
- openLink: com.boardsesh.app://boards
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'board-card'
    timeout: 60000
- takeScreenshot: 04-boards
- tapOn:
    id: 'board-card'
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 05-board-selected

# --- Climbs list + swipe (touch gesture on the list) ---
- openLink: com.boardsesh.app://climbs
- extendedWaitUntil:
    visible:
      id: 'climb-list'
    timeout: 60000
- takeScreenshot: 06-climbs
- scroll
- scroll
- takeScreenshot: 07-climbs-scrolled
