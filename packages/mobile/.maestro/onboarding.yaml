appId: com.boardsesh.app
name: issue 6360 native session settings
---
- setOrientation: PORTRAIT
- openLink: com.boardsesh.app://record?screenshot6360=record
- tapOn:
    text: 'Open'
    optional: true
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'pre-session-footer'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'qa-6360-rest-card'
    visibilityPercentage: 40
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 01-record-rest-settings
- swipe:
    start: '50%,78%'
    end: '50%,38%'
    duration: 700
- waitForAnimationToEnd:
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'qa-6360-visibility-card'
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 03-record-live-visibility
- openLink: com.boardsesh.app://record?screenshot6360=sheet
- tapOn:
    text: 'Open'
    optional: true
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'rest-timer-hero-clock'
    timeout: 60000
- takeScreenshot: 04-rest-timer-sheet
- scrollUntilVisible:
    element:
      text: 'Turn off rest timer'
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- runFlow:
    when:
      true: ${QA_CAPTURE_CONTENT_SIZE === 'accessibility-extra-large'}
    commands:
      - takeScreenshot: 05-rest-timer-sheet-lower-controls
