appId: com.boardsesh.app
name: onboarding illustrations
---
# Captures real app screens intended as onboarding-card illustrations (the cards
# fall back to SF Symbol / MDI glyphs when no image is present — see
# onboarding-cards.ts).
#
# NOTE: the orchestrator writes these as raw, full-device PNGs to
# app-stores/<store>/screenshots/<device>/ (same path as the app-store flow — it
# does NOT crop). Turning them into card assets is a manual follow-up: crop to
# the card content region, move into packages/mobile/assets/onboarding/, and wire
# them up in onboarding-cards.ts. This flow is also unvalidated end-to-end (see
# the a11y caveat in README.md re: matching `climb-list`).
#
# Card -> screen mapping (welcome/connect/find/play):
#   welcome -> climbs list   (the browse hero)
#   play    -> discover      (playlists)
# TODO(connect): BLE device picker — needs screenshot-mode demo BLE devices
#   (the simulator has no Bluetooth). Mirror web's e2e-bluetooth-picker flag.
# TODO(find): board/climb detail — needs a deterministic deep link to a seeded
#   climb (com.boardsesh.app://climbs/<uuid>) or a stable climb-row testID to tap.
#
# The .app is a Debug dev-client that auto-loads Metro on launch (build bakes
# DEV_CLIENT_DEFAULT_LAUNCHER_URL), so the orchestrator just `simctl launch`es it —
# no openurl, no "Open in Boardsesh?" dialog on a fresh CI sim. This flow just waits
# for the auth screen. The orchestrator uninstalled + reinstalled and reset the
# keychain, so this cold-loads signed out.
- runFlow: login.yaml

- openLink: com.boardsesh.app://climbs
- extendedWaitUntil:
    visible:
      id: 'climb-list'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: onboarding-welcome

- openLink: com.boardsesh.app://discover
- waitForAnimationToEnd
- takeScreenshot: onboarding-play
