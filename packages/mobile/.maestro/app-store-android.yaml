appId: ${APP_ID}
name: app-store screenshots android
---
# Play Store screenshots from the standalone screenshot APK. Unlike iOS, this APK already
# contains the screenshot-mode JS bundle (the workflow builds it with
# EXPO_PUBLIC_SCREENSHOT_MODE=1), so launch the app directly instead of opening an
# expo-development-client URL, and there's no "Open in Boardsesh?" deep-link dialog.
#
# Google Play caps phone screenshots at 8. This set leads with lit Tension and Kilter
# walls, followed by the six core app surfaces. Party, playlist, logbook, and session
# detail stay out of the Android listing because there is no room for them here.
#
# WAITING (why this differs from the iOS flow): the CI emulator runs on a software GL
# renderer (swiftshader) against the PROD backend, so it is far slower than the iOS sim,
# and — unlike iOS — there's no Metro `$screen /home` gate before the flow runs (this is a
# release APK; the marker is __DEV__-only). So a bare `waitForAnimationToEnd` captured the
# splash screen and skeleton loaders. Each shot now waits for real content:
#   - testID anchors where they exist (`home-screen` clears the splash; `climb-row` proves
#     the climb list loaded, replacing `climb-list-row-skeleton`).
#   - `waitForAnimationToEnd: { timeout }` everywhere else — it's pixel-diff based, so it
#     blocks on the skeleton shimmer until the data swaps in and the screen goes static,
#     then continues (it never fails the flow, just proceeds on timeout).
#
# Screenshot-mode deep-link params (honoured because the APK is built with
# EXPO_PUBLIC_SCREENSHOT_MODE=1):
#   ://climbs?screenshotOpenFirst=1       -> auto-opens the first climb's board view
#   ://climbs?screenshotBoardIndex=0|1    -> switches to a named screenshot wall first
#   ://climbs?screenshotOpenBoardSheet=1  -> opens the board-presence "now on the wall" sheet
# The board itself is auto-selected on boot in screenshot mode (ScreenshotBoardAutoActivator
# activates SCREENSHOT_BOARDS[0], the wall pinned by name in screenshot-mode.ts), so the
# board-backed shots need no in-flow board-pick step.
#
# The numeric screenshot names set the Play Store display order. Every board-view launch
# names its board explicitly: the screenshot app persists the last active wall between
# launches, so omitting an index could capture the preceding wall twice.

# Tension board view — lead with the second pinned wall (SCREENSHOT_BOARDS[1]) to show
# the app lights more than one board system. A fresh launch keeps the play drawer from a
# preceding capture from leaking into this frame.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=1
- extendedWaitUntil:
    visible:
      id: 'climb-row'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'play-drawer-board-overlay'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 00-tension-board-view

# Kilter board view — explicitly return to SCREENSHOT_BOARDS[0] after the Tension
# capture. The index gate waits for that wall before it opens a climb.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=0
- extendedWaitUntil:
    visible:
      id: 'climb-row'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'play-drawer-board-overlay'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 01-kilter-board-view

# Home — relaunch after the full-screen board-view overlay, then wait for the real feed.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 02-home

# Climbs — the main browse surface. Wait for a real row so the list is not captured
# mid-load with skeleton placeholders.
- openLink: com.boardsesh.app://climbs
- extendedWaitUntil:
    visible:
      id: 'climb-row'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 03-climbs

# Discover — playlist library ("For You" smart playlists + saved/community playlists).
- openLink: com.boardsesh.app://discover
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 04-discover

# Workout generator — the Record screen with a workout pre-selected.
- openLink: com.boardsesh.app://record
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 05-workout-generator

# Profile — progress tab. A plain link clears any screenshot-specific route params.
- openLink: com.boardsesh.app://profile
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 06-profile

# Board sheet — relaunch to keep the prior route from leaking into the sheet, then open it
# deterministically through the screenshot-mode parameter.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- openLink: com.boardsesh.app://climbs?screenshotOpenBoardSheet=1
- waitForAnimationToEnd:
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 07-board-sheet
