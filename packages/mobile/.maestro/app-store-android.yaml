appId: ${APP_ID}
name: app-store screenshots android
---
# Play Store screenshots. In CI the app is the dev-client APK (no bundled JS) loading
# Metro's screenshot-mode bundle (EXPO_PUBLIC_SCREENSHOT_MODE=1 set into Metro's env),
# same as iOS. `launchApp` still cold-starts straight into Metro instead of opening an
# expo-development-client URL: the dev-client's manifest carries
# DEV_CLIENT_DEFAULT_LAUNCHER_URL (added by a plugin on the dev variant) and
# expo-dev-launcher reopens the last bundle, so there's no "Open in Boardsesh?"
# deep-link dialog to dismiss.
#
# The original eight captures remain available with legacy fixture bundles. A
# third pinned board and shared-session fixtures add optional campaign candidates
# below; select up to eight when publishing the Google Play phone listing.
#
# WAITING (why the waits stay generous even though the app is already home): the
# orchestrator's launchDevClientToHome waits for Metro's `$screen /home` marker
# BEFORE this flow runs — the APK is a debug dev-client, not a release build, so
# the __DEV__-only marker fires — so the `launchApp` below is a relaunch of an
# already-Metro-connected, already-home app, same as iOS, not a cold boot. What
# stays slow is the CI emulator's software GL renderer (swiftshader) fetching
# real data from the PROD backend, so a bare `waitForAnimationToEnd` can still
# catch a skeleton loader mid-fetch. Each shot waits for real content instead:
#   - testID anchors where they exist (`home-screen` clears the splash; `climb-row` proves
#     the climb list loaded, replacing `climb-list-row-skeleton`).
#   - `waitForAnimationToEnd: { timeout }` everywhere else — it's pixel-diff based, so it
#     blocks on the skeleton shimmer until the data swaps in and the screen goes static,
#     then continues (it never fails the flow, just proceeds on timeout).
#
# Screenshot-mode deep-link params (honoured because Metro's env carries
# EXPO_PUBLIC_SCREENSHOT_MODE=1 — the dev-client ships no bundled JS of its own,
# so nothing is "built with" it; the running bundle just reads it from Metro):
#   ://climbs?screenshotOpenFirst=1       -> auto-opens the first climb's board view
#   ://climbs?screenshotBoardIndex=0..5  -> switches to a named screenshot wall first
#   ://climbs?screenshotOpenBoardSheet=1  -> opens the board-presence "now on the wall" sheet
# The board itself is auto-selected on boot in screenshot mode (ScreenshotBoardAutoActivator
# activates SCREENSHOT_BOARDS[0], the wall pinned by name in screenshot-mode.ts), so the
# board-backed shots need no in-flow board-pick step.
#
# Numeric names identify the raw captures; presentation recipes choose the listing
# order. Every board-view launch names its board explicitly: the screenshot app
# persists the last active wall, so omitting an index could capture that wall twice.

# Tension board view — lead with the second pinned wall (SCREENSHOT_BOARDS[1]) to show
# the app lights more than one board system. A fresh launch keeps the play drawer from a
# preceding capture from leaking into this frame.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=1
- extendedWaitUntil:
    visible:
      id: 'climb-row'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'play-drawer-board-overlay'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 00-tension-board-view

# Kilter board view — explicitly return to SCREENSHOT_BOARDS[0] after the Tension
# capture. The index gate waits for that wall before it opens a climb.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=0
- extendedWaitUntil:
    visible:
      id: 'climb-row'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'play-drawer-board-overlay'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 01-kilter-board-view

# Home — relaunch after the full-screen board-view overlay, then wait for the real feed.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
# skeleton/spinner is static on swiftshader, so settle-waits return early — anchor on real content
- extendedWaitUntil:
    visible:
      id: 'session-feed-card'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 30000
# The live rail settles independently from the session feed.
- extendedWaitUntil:
    notVisible:
      id: 'live-sessions-skeleton'
    timeout: 90000
- assertNotVisible:
    id: 'live-sessions-error'
- assertNotVisible:
    id: 'live-sessions-offline'
- takeScreenshot: 02-home

# Climbs — the main browse surface. Wait for a real row so the list is not captured
# mid-load with skeleton placeholders.
- openLink: com.boardsesh.app://climbs
- extendedWaitUntil:
    visible:
      id: 'climb-row'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 03-climbs

# Discover — playlist library ("For You" smart playlists + saved/community playlists).
- openLink: com.boardsesh.app://discover
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 04-discover

# Workout generator — the Record screen with a workout pre-selected.
- openLink: com.boardsesh.app://record
- waitForAnimationToEnd:
    timeout: 30000
# Pixel stability alone can still describe the preceding tab.
- extendedWaitUntil:
    visible:
      id: 'pre-session-footer'
    timeout: 90000
# FlashList can preserve a scrolled preview position after rows load.
- scrollUntilVisible:
    element:
      id: 'pre-session-board-summary'
    direction: UP
    timeout: 60000
# Bring the workout choices, target grade, and warm-up controls above the tray.
- repeat:
    times: 2
    commands:
      - swipe:
          start: '15%, 65%'
          end: '15%, 40%'
          duration: 1000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 05-workout-generator

# Profile — progress tab. A plain link clears any screenshot-specific route params.
- openLink: com.boardsesh.app://profile
# skeleton/spinner is static on swiftshader, so settle-waits return early — anchor on real content
- extendedWaitUntil:
    visible:
      id: 'progress-tab-loaded'
    timeout: 90000
# The beta-videos shelf loads separately and disappears when the account has none;
# wait until no shelf on the screen is still showing its first-page spinner.
- extendedWaitUntil:
    notVisible:
      id: 'horizontal-scroll-section-loading'
    timeout: 60000
# Show the all-board history, including the complete chart and its board legend.
- scrollUntilVisible:
    element:
      id: 'profile-board-share-chart'
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 06-profile

# Board sheet — relaunch to keep the prior route from leaking into the sheet, then open it
# deterministically through the screenshot-mode parameter.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- openLink: com.boardsesh.app://climbs?screenshotOpenBoardSheet=1
# The sheet opens before the wall seed lands on a cold launch, so anchor on the stats
# block: it renders only once the seeded history is in, and it sits on screen at the
# top of the sheet (the history rows are virtualized below the fold, so Maestro never
# sees them as visible).
- extendedWaitUntil:
    visible:
      id: 'board-sheet-stats'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 07-board-sheet

# The third pinned selector is the MoonBoard in the campaign fixture bundle.
# Count comes from the effective Metro board list, including explicit --boards.
- runFlow:
    when:
      true: ${SCREENSHOT_SHARED_SESSION_ID != '' && Number(SCREENSHOT_BOARD_COUNT) >= 3}
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 90000
      - openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=2
      - extendedWaitUntil:
          visible:
            id: 'climb-row'
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: 'play-drawer-board-overlay'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - takeScreenshot: 08-moonboard-board-view

# More compatible boards, using the three extra selectors in the campaign bundle.
- runFlow:
    when:
      true: ${SCREENSHOT_SHARED_SESSION_ID != '' && Number(SCREENSHOT_BOARD_COUNT) >= 6}
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 90000
      - openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=3
      - extendedWaitUntil:
          visible:
            id: 'climb-row'
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: 'play-drawer-board-overlay'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - takeScreenshot: 11-woods-board-view
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 90000
      - openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=4
      - extendedWaitUntil:
          visible:
            id: 'climb-row'
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: 'play-drawer-board-overlay'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - takeScreenshot: 12-grasshopper-board-view
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 90000
      - openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=5
      - extendedWaitUntil:
          visible:
            id: 'climb-row'
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: 'play-drawer-board-overlay'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - takeScreenshot: 13-moonboard-2024-view

# The wall stays on the seeded first climb while this climber picks a different
# local queue head. Capture the real live wall-status header before joining a crew.
- runFlow:
    when:
      true: ${SCREENSHOT_SHARED_SESSION_ID != ''}
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 90000
      - openLink: com.boardsesh.app://climbs?screenshotBoardIndex=0
      - extendedWaitUntil:
          visible:
            id: 'climb-row'
          timeout: 60000
      - tapOn: 'Guessing Games'
      - extendedWaitUntil:
          visible:
            id: 'play-drawer-board-overlay'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 10000
      - tapOn: 'Close'
      - extendedWaitUntil:
          notVisible:
            id: 'play-drawer-board-overlay'
          timeout: 60000
      - extendedWaitUntil:
          visible: 'On the wall: Lightest Pair of Shorts, .*'
          timeout: 60000
      - extendedWaitUntil:
          visible: 'Guessing Games'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: 10-wall-status

# This scenario uses sanitized session snapshots supplied with the fixture bundle.
# An empty ID keeps legacy replay and record runs on the original flow.
- runFlow:
    when:
      true: ${SCREENSHOT_SHARED_SESSION_ID != ''}
    commands:
      - launchApp
      - openLink: com.boardsesh.app://home
      - extendedWaitUntil:
          visible:
            id: 'home-screen'
          timeout: 90000
      - openLink: com.boardsesh.app://join/${SCREENSHOT_SHARED_SESSION_ID}
      - extendedWaitUntil:
          visible: 'Join session'
          timeout: 60000
      - tapOn: 'Join session'
      - extendedWaitUntil:
          visible: 'Friday board crew'
          timeout: 60000
      - extendedWaitUntil:
          visible: '[2-9] climbing'
          timeout: 60000
      - tapOn: 'Lightest Pair of Shorts'
      - extendedWaitUntil:
          visible:
            id: 'play-drawer-board-overlay'
          timeout: 60000
      - tapOn: 'Queue, .* climbs'
      - extendedWaitUntil:
          visible: '6 climbs'
          timeout: 60000
      # Drag the header, not a climb row: a row drag reorders the shared queue.
      - swipe:
          from:
            text: 'Up next'
          direction: UP
          duration: 700
      - extendedWaitUntil:
          visible: 'Wax On'
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 10000
      - takeScreenshot: 09-live-queue
