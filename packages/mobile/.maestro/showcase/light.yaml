appId: com.boardsesh.app
name: showcase take - light the wall
---
# Take: light -> .boardsesh/showcase-video/work/footage/light/ (homepage showcase, scene "light")
#
# Records: the first Kilter climb open in the play view, the bulb tap that puts
# it on the wall, then two swipes to the next climb, each one lighting the wall
# as it lands. Callouts on this take: wall-pill, board-surface.
#
# Needs the fake-BLE bundle (EXPO_PUBLIC_SCREENSHOT_FAKE_BLE=1): the bulb lights
# immediately with no device picker, and the pill beside the title swaps from
# "Live" to the driver's avatar ("On the wall" is its a11y label). Screenshot
# mode cuts the board swap without the swipe animation.
#
# The recorder opens ://climbs?screenshotOpenFirst=1&screenshotBoardIndex=0 on a
# freshly launched app BEFORE recording starts, so this flow opens on the lit
# first climb.
#
# Run by `vp run video:record`, never by hand: every step that talks to
# SHOWCASE_SIGNAL_URL needs the recorder's signal server.
#
# Coordinates (iPhone 16 Pro Max portrait, 440x956 pt). Nothing in the play
# view is exposed to Maestro on this RN Fabric build, so every step is a point.
#   87%,84%             the bulb, right end of the action row under the board
#   85%,42% -> 18%,42%  a right-to-left drag across the board = next climb
#
# Percentages must be WHOLE NUMBERS. Maestro has no `sleep`: a pause is an
# optional wait for text that is never on screen.

# The recorder cuts everything before this request (Maestro attaching).
- evalScript: ${http.get(SHOWCASE_SIGNAL_URL + '/mark/flow-start')}

# The seeded climb, already lit, with the "Live" pill.
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 1200
    optional: true

# Put it on the wall.
- tapOn:
    point: '87%,84%'
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 1200
    optional: true

# Next climb: it lights as it lands.
- swipe:
    start: '85%,42%'
    end: '18%,42%'
    duration: 400
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 1200
    optional: true

# And the one after.
- swipe:
    start: '85%,42%'
    end: '18%,42%'
    duration: 400
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 1800
    optional: true
