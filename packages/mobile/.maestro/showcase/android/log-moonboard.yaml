appId: com.boardsesh.app.dev
name: showcase take - moonboard progress
---
- evalScript: ${http.get(SHOWCASE_SIGNAL_URL + '/mark/flow-start')}
- scrollUntilVisible:
    element:
      id: 'profile-progress-filter'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'profile-progress-filter'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: MoonBoard
    direction: DOWN
    timeout: 15000
- tapOn: MoonBoard
- tapOn: '${SHOWCASE_CLOSE_LABEL}'
- waitForAnimationToEnd
- evalScript: ${http.get(SHOWCASE_SIGNAL_URL + '/mark/filter-moonboard')}
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 10000
    optional: true
