appId: com.boardsesh.app.dev
name: showcase teardown - end the live session (Android)
---
# The Android twin of ../session-end.yaml: from the in-session Record tab, Stop
# then "End session". The recorder waits for `Session Ended` in the app log.
#
# Coordinates (1080x2424 emulator, 411x923 dp, portrait):
#   88%,9%   Stop, top right of the in-session Record tab
#   73%,84%  "End session" in the confirmation sheet

- openLink: com.boardsesh.app://home
- waitForAnimationToEnd
- openLink: com.boardsesh.app://record
- waitForAnimationToEnd

- tapOn:
    point: '88%,9%'
- waitForAnimationToEnd
- tapOn:
    point: '73%,84%'
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 4000
    optional: true
