appId: com.boardsesh.app
name: showcase setup - lock-screen, put the climb on the wall
---
# Setup for take: lock-screen (primary phone, NOT recorded), after
# lock-screen-setup.yaml and a relaunch.
#
# Why a relaunch sits between the two: prod pushes Live Activity updates
# through PRODUCTION APNs, and a simulator's push token is a sandbox one, so
# the first push the queue changes trigger comes back BadDeviceToken and the
# backend deletes the token. The island's Next then gets a 401 ("rejected by
# server"). Relaunching restarts the Live Activity with a fresh token after the
# queue is built, so nothing pushes between its registration and the Next tap.
#
# Opens the play view from the now-playing bar and taps the bulb. The fake board
# (EXPO_PUBLIC_SCREENSHOT_FAKE_BLE) connects at once, so the Live Activity
# reports `connectedByMe` and its expanded view shows Prev / relight / Mirror /
# Next instead of "Tap to reconnect".
#
# Coordinates (iPhone 16 Pro Max portrait):
#   40%,88%  the now-playing bar -> play view
#   87%,84%  the bulb

- tapOn:
    point: '40%,88%'
- waitForAnimationToEnd
- tapOn:
    point: '87%,84%'
# Let the Live Activity register its push token before the take.
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 3000
    optional: true
