appId: com.boardsesh.app
name: showcase setup - crew, the second phone joins
---
# Setup for take: crew, SECONDARY phone (not recorded)
#
# The recorder has opened ://join/<sessionId> (the id comes from the invite
# link the primary copied). This taps Join on the confirmation card; the app
# resolves the session's wall against the second account's boards (creating a
# matching one if it has none) and joins. The recorder then opens ://climbs,
# where crew-secondary.yaml swipes a row into the queue.
#
# The latest join card stacks its actions; use the native button's localized
# accessibility label rather than the older left-column coordinate.

- extendedWaitUntil:
    visible: '^(Join session|Unirse a la sesión|Rejoindre la session|Session beitreten)$'
    timeout: 15000
- tapOn:
    text: '^(Join session|Unirse a la sesión|Rejoindre la session|Session beitreten)$'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 3000
    optional: true
