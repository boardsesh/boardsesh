appId: com.boardsesh.app
name: showcase setup - crew, start the session and copy the invite
---
# Setup for take: crew (primary phone, NOT recorded)
#
# Starts the (already hidden, see session-private.yaml) session, opens the invite
# sheet and taps "Copy link". The recorder reads the link back with
# `xcrun simctl pbpaste`, takes the session id from it, and sends the second
# phone to ://join/<id>. The sheet stays open, so recording starts on the QR.
#
# Existing accessibility labels cover all four recording locales. Match the
# controls rather than screen coordinates: InviteSheet actions live in its body
# and move when the native detent or localized content height changes.

- tapOn:
    text: '^(Start|Empezar|Démarrer|Starten)$'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 2000
    optional: true

# Starting a session lands on Climbs; go back to the session screen.
- openLink: com.boardsesh.app://record
- tapOn:
    text: 'Open'
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: '^(Invite climbers|Invitar escaladores|Inviter des grimpeurs|Kletterer\*innen einladen)$'
    index: 0
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: '^(Copy link|Copiar enlace|Copier le lien|Link kopieren)$'
    timeout: 15000
- tapOn:
    text: '^(Copy link|Copiar enlace|Copier le lien|Link kopieren)$'

# Let the "copied" toast fade before the recorder starts filming the QR.
- extendedWaitUntil:
    visible: 'zzz-showcase-pause'
    timeout: 3000
    optional: true
