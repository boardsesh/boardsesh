appId: com.boardsesh.app
name: showcase setup - live session hidden
---
# Setup for every take that starts a live session: crew, workouts, lock-screen
# (primary phone, NOT recorded; the take registry's `privateSession`)
#
# Turns "Show this session live" OFF on the Record tab before the session
# starts, so the recording never shows up in anyone's "Climbing now" rail or a
# board's queue preview. The switch starts ON on every launch (PreSessionView
# holds it in component state), so one tap always means OFF.
#
# The recorder checks the app logged `Session Visibility Changed
# {"isPublic": false, "phase": "pre_session"}` before it runs anything
# that taps Start; without that line it refuses to go on.
#
# The take's deep links end on ://record, on a freshly launched app with no
# session running, so the pre-session view is up (with the now-playing bar, which
# puts Start at 84%,82%).
#
# Match the localized SwiftUI switch's combined title plus subtitle, then tap
# its trailing thumb. The subtitle is required: Maestro picks the deepest match,
# so accepting a bare title targets the child text rather than the Toggle.
# Maestro 2.6.1 treats text + point as an element-relative point (not a screen
# coordinate): YamlFluentCommand.tapCommand -> TapOnElementCommand.relativePoint.

- extendedWaitUntil:
    visible: '${SHOWCASE_SESSION_VISIBILITY_LABEL}'
    timeout: 15000
- tapOn:
    text: '${SHOWCASE_SESSION_VISIBILITY_LABEL}'
    point: '90%,50%'
- waitForAnimationToEnd
