appId: com.boardsesh.app
name: help clip - Put on board starts a timed drive
---
# Start on a tracked preview with a plain Put on board and Always drive off.
# iPhone 16 Pro Max, dark. Fake BLE exercises real control state, not radio delivery.
# The caller navigates before recording; review the clock shrinking and refilling.
- tapOn:
    point: '50%,90%'
- extendedWaitUntil:
    visible:
      id: '^store-driving-.+$'
    timeout: 10000
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 7000
    optional: true
- swipe:
    start: '85%,50%'
    end: '18%,50%'
    duration: 700
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1000
    optional: true
- tapOn:
    point: '50%,90%'
- extendedWaitUntil:
    notVisible:
      id: '^store-driving-.+$'
    timeout: 10000
