appId: com.boardsesh.app
name: help clip - browse climbs in the play drawer
---
# Clip: preview-browsing -> packages/web/public/videos/help/preview-browsing.mp4
#
# Records: a tracked climb-row tap opens the play drawer without changing the
# wall. Swiping across the board opens the next climb as a preview. The back
# chip returns to the climb on the wall, and Put on board offers to light the
# preview. The clip closes with the chevron without pressing that button.
#
# Why a row tap rather than ://climbs?screenshotOpenPreview=1: the preview latch
# opens the drawer with no swipe track ("a preview with no suggestion source"),
# so the wall will not swipe at all. A row tap goes through handleClimbPress,
# whose view-only branch seeds the results as the swipe track (#5402).
# The ://climbs?screenshotOpenFirst=1 latch does the
# same thing, but it is one-shot per active board, so it cannot be re-armed for
# a retake.
#
# One swipe illustrates browsing; it is not a limit on the list's swipe track.
#
# Before recording, stop any live drive by tapping You are driving the wall,
# then turn off Light the board when I tap a climb and Light the board as I swipe
# in Settings > Board. Driving overrides those settings, so both checks matter.
# Keep the fake board connected: Disconnect board is the stopped state, not a
# button this flow presses. It remains frosted after stopping; check the label
# instead of treating frost as driving. Do not use screenshotDrive=1 for this take.
#
# Coordinates, not selectors: nothing in the drawer is exposed to Maestro on
# this RN Fabric build.
#   50%,33%  current wall climb on the Climbs tab (second row in this capture)
#   85%,50% -> 18%,50%  a right-to-left drag across the board = next climb
#   7%,10%   the chevron that closes the drawer
#
# Percentages must be WHOLE NUMBERS — Maestro fails to parse "50%,34.5%".
#
# The caller navigates to ://home then ://climbs BEFORE recording starts.

- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 400
    optional: true

# Open a tracked climb without changing the wall.
- tapOn:
    point: '50%,33%'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1800
    optional: true

# Drag the board sideways: the next climb slides in while the wall stays put.
# Its back chip and Put on board button identify the preview.
- swipe:
    start: '85%,50%'
    end: '18%,50%'
    duration: 700
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 2600
    optional: true

# Close the drawer. Nothing was put on the wall.
- tapOn:
    point: '7%,10%'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 800
    optional: true
