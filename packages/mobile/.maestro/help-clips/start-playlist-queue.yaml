appId: com.boardsesh.app
name: help clip - Start playlist? confirm
---
# Clip: start-playlist-queue -> packages/web/public/videos/help/start-playlist-queue.mp4
#
# Records: opening a playlist from Discover and pressing its header Play. Because
# Up next already has climbs, the app asks "Start playlist?" with three choices
# (Start playlist, Play last, Cancel) and says how many climbs will drop out.
# The clip CANCELS: Cancel opens the first climb as a preview, and the queue
# and the wall stay as they were.
#
# The prompt only appears when Up next already has climbs (see
# src/lib/playlists/use-playlist-activation.ts). With an empty Up next the tap
# loads the list and opens a preview straight away, and this clip records no
# prompt. Seed the queue with a few climbs before recording: on the Climbs tab,
# swipe two or three rows left-to-right.
#
# Switches this take needs: run start-playlist-queue-setup.yaml first (or by hand,
# Settings > Board): turn ON Tapping a playlist loads
# it into my queue, and leave Always drive the wall OFF (the default), so
# nothing drives the wall. The tap then loads the list into Up next, keeps the wall's climb and
# previews the tapped one. With the playlist switch off the tap just previews and
# the sheet never appears.
#
# Coordinates for the app's own pressables, which this RN Fabric build does not
# expose to Maestro:
#   18%,43%  seeded Aurora Circuit 5, compatible with the active Tension board
#   90%,8%   header Play chooses the first compatible climb
# The Start playlist? prompt is a native action sheet, so its Cancel is matched
# by text. Never tap Start playlist: it would replace the queue's Up next.
#
# Percentages must be WHOLE NUMBERS — Maestro fails to parse "50%,34.5%".
#
# The caller navigates to ://home then ://discover BEFORE recording starts.

- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 400
    optional: true

# Open the playlist.
- tapOn:
    point: '18%,43%'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1200
    optional: true

# A cold playlist can settle visually while its rows are still skeletons.
- extendedWaitUntil:
    notVisible:
      id: 'climb-list-row-skeleton'
    timeout: 60000

# Header Play activates the first climb through the same playlist callback.
# Use the native button: row taps on this cached iOS client did not activate.
- tapOn:
    point: '90%,8%'
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 2600
    optional: true

# Cancel: the first climb opens as a preview; the queue and the wall stay as
# they were.
- tapOn:
    text: 'Cancel'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 900
    optional: true
