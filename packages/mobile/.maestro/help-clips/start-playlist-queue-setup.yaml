appId: com.boardsesh.app
name: help clip setup - playlist tap loads queue
---
# Setup for start-playlist-queue.yaml. Run it BEFORE the recording starts; it is
# not a clip and records nothing.
#
# With the 2.7 defaults the "Start playlist?" sheet never appears: a tap in a
# playlist only previews. This turns ON "Tapping a playlist loads it into my
# queue" in Settings > Board and leaves "Always drive the wall" at its default
# (off), so nothing drives the wall. Both taps are optional so a re-run on an already-set phone
# does not fail; check the switch by eye once, since a re-run flips it back OFF
# if it was already on. Starting from a fresh install or a reset Settings is the
# safe path.
- openLink: com.boardsesh.app://settings/board-look
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 'Tapping a playlist loads it into my queue'
    optional: true
- tapOn:
    text: 'Tapping a playlist loads it into my queue'
    optional: true
- waitForAnimationToEnd
