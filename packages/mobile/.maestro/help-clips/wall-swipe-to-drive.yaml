appId: com.boardsesh.app
name: help clip - swipe the wall button to drive
---
# Clip: wall-swipe-to-drive -> packages/web/public/videos/help/wall-swipe-to-drive.mp4
#
# Records the real player: swipe its wall button left to start driving, swipe
# the board to another climb while driving, then tap You are driving the wall
# to stop driving without disconnecting. Review Let go to light every climb,
# You are driving the wall, and the final Disconnect board label in the take.
# Put on board and the stopped Disconnect board are plain; the frost appears
# only once driving is confirmed (frost = driving, wall-control-frost.ts).
# Leave Disconnect Bluetooth when driving ends off (Settings > Board), or the
# stop lets go of the board and the take ends on Put on board.
#
# Before recording, open a tracked climb with screenshotOpenFirst=1 and leave
# screenshotDrive unset. Start with Put on board and chevrons, with no link, or
# Disconnect board and chevrons after stopping an earlier drive. Do not tap
# Put on board first: it starts a timed drive (45 s by default), and the button
# then shows a clock and a shrinking frost instead of the
# full frost this take teaches. A slower drag keeps the release label readable.
# While dragging, a flat amber wipe comes in from the trailing edge; the frost
# appears on release.
#
# Use mobile:ios-shots --backend local. Its existing store-capture environment
# supplies EXPO_PUBLIC_SCREENSHOT_DRIVING=1 and
# EXPO_PUBLIC_SCREENSHOT_FAKE_BLE=1. The simulator has no Bluetooth; this
# records the app's actual state changes using its simulated board adapter,
# not physical BLE delivery. The automatic frost peek stays suppressed.
#
# Captured on Boardsesh Help 7208, iPhone 16 Pro Max, iOS 27.0, dark,
# 1320 x 2868, main source 3b1d9be90c, 2026-11-02:
#   86%,90% -> 15%,90%  swipe the wall button left past its commit point
#   85%,50% -> 18%,50%  swipe the board to the next climb
#   50%,90%             tap the driving button to stop, retaining the link
#
# Percentages must be whole numbers. The caller navigates before recording;
# the flow stays in the player and never presses Disconnect board.

- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 600
    optional: true

- swipe:
    start: '86%,90%'
    end: '15%,90%'
    duration: 2500
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1200
    optional: true

- swipe:
    start: '85%,50%'
    end: '18%,50%'
    duration: 700
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1000
    optional: true

- tapOn:
    point: '50%,90%'
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1000
    optional: true
