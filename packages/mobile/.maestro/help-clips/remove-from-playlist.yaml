appId: com.boardsesh.app
name: help clip - add to and remove from a playlist
---
# Clip: remove-from-playlist -> packages/web/public/videos/help/remove-from-playlist.mp4
#
# Records the lifted menu, Add to Playlist, removing the first climb from a
# seeded local playlist, then restoring it. The seeded Aurora Circuit 5 starts
# checked (8 climbs), becomes unchecked (7), then checked again (8).
# Never use this take against a production account.
# Measured 2026-11-02 on iPhone 16 Pro Max: row 50%,23%; Add to Playlist
# 35%,38%; first playlist 50%,74%; dismissing scrim 50%,7%.
#
# `waitForAnimationToEnd` is used sparingly: each one costs about a second of
# real time, and a 5-state clip runs long fast. The explicit pauses below are
# what a viewer reads each state by.
#
# The caller navigates to ://home then ://climbs BEFORE recording starts.

- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 500
    optional: true

# Long-press the row -> the action card lifts.
- longPressOn:
    point: '50%,23%'
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 600
    optional: true

# Add to Playlist closes the menu and opens the playlist sheet.
- tapOn:
    point: '35%,38%'
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 600
    optional: true

# Untick the seeded list: count drops and the check clears.
- tapOn:
    point: '50%,74%'
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1100
    optional: true

# Restore the seeded membership: count and check return to their starting state.
- tapOn:
    point: '50%,74%'
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 1100
    optional: true

# Back out of the playlist view, then close the overlay.
- tapOn:
    point: '50%,7%'
- tapOn:
    point: '50%,7%'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'zzz-help-clip-pause'
    timeout: 700
    optional: true
