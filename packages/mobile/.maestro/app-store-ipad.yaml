appId: com.boardsesh.app
name: app-store screenshots (iPad)
---
# iPad App Store hero shots against the prod backend + curated test user.
#
# Why this differs from the iPhone flow (app-store.yaml): the iPad CANNOT be driven
# by deep links. On the iPad simulator every `openurl com.boardsesh.app://…` pops the
# "Open in 'Boardsesh'?" scheme-confirm dialog and the URL is never delivered to the
# app's router — navigation just never happens. iPhone remembers the confirm after
# the first prime; iPad does not.
#
# The native iPad sidebar exposes localized accessibility labels and selected
# state. Its UIKit items do not carry the custom React Native sidebar's testIDs.
# Tap the first matching label (the sidebar parent precedes its duplicate text
# child and page headings), then require selected: true on that destination.
# Retry swallowed taps after rotation; keep content readiness gates below.
# UIKit owns Hide Sidebar / Toggle sidebar: capture simulators use English system
# language while the app catalog locale changes separately. Collapse the floating
# sidebar before capture so it cannot cover the screen content; reopen for navigation.
# The orchestrator also rejects byte-identical captures of different scenes.
#
# The wall kiosk seed (the active board's real climbs) is published at the root by
# ScreenshotBoardAutoActivator as soon as the board activates, so the wall shot no
# longer depends on the Climbs screen mounting first. Climbs is still visited first:
# it re-publishes the same seed (idempotent) and gives the wall panel time to render.
# The build auto-signs-in and lands on home — the orchestrator gates on reach-home
# before running this flow.
- setOrientation: ${MAESTRO_DEVICE_ORIENTATION}
- waitForAnimationToEnd
# Each navigation also handles a sidebar left collapsed by a previous run.

# Climbs — the browse list.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
          commands:
            - tapOn: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
      - extendedWaitUntil:
          visible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
          timeout: 15000
      - tapOn:
          text: ${SCREENSHOT_SIDEBAR_CLIMBS_LABEL}
          index: 0
      - extendedWaitUntil:
          visible:
            text: ${SCREENSHOT_SIDEBAR_CLIMBS_LABEL}
            selected: true
          timeout: 5000
- tapOn: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- extendedWaitUntil:
    visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
    timeout: 15000
- assertNotVisible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: 02-climbs

# Home — the "Everyone" feed, with the persistent wall rail showing the lit climb.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
          commands:
            - tapOn: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
      - extendedWaitUntil:
          visible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
          timeout: 15000
      - tapOn:
          text: ${SCREENSHOT_SIDEBAR_HOME_LABEL}
          index: 0
      - extendedWaitUntil:
          visible:
            text: ${SCREENSHOT_SIDEBAR_HOME_LABEL}
            selected: true
          timeout: 5000
- tapOn: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- extendedWaitUntil:
    visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
    timeout: 15000
- assertNotVisible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- waitForAnimationToEnd
# The live rail settles independently from the session feed.
- extendedWaitUntil:
    notVisible:
      id: 'live-sessions-skeleton'
    timeout: 90000
- assertNotVisible:
    id: 'live-sessions-error'
- assertNotVisible:
    id: 'live-sessions-offline'
- takeScreenshot: 01-home

# On the Wall — the wall-mounted kiosk HERO: the lit board + the current climb big
# and readable from across the gym.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
          commands:
            - tapOn: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
      - extendedWaitUntil:
          visible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
          timeout: 15000
      - tapOn:
          text: ${SCREENSHOT_SIDEBAR_WALL_LABEL}
          index: 0
      - extendedWaitUntil:
          visible:
            text: ${SCREENSHOT_SIDEBAR_WALL_LABEL}
            selected: true
          timeout: 5000
- tapOn: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- extendedWaitUntil:
    visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
    timeout: 15000
- assertNotVisible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: 00-wall

# Record — the workout generator (a workout is pre-selected in screenshot mode via
# EXPO_PUBLIC_SCREENSHOT_WORKOUT).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
          commands:
            - tapOn: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
      - extendedWaitUntil:
          visible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
          timeout: 15000
      - tapOn:
          text: ${SCREENSHOT_SIDEBAR_RECORD_LABEL}
          index: 0
      - extendedWaitUntil:
          visible:
            text: ${SCREENSHOT_SIDEBAR_RECORD_LABEL}
            selected: true
          timeout: 5000
- tapOn: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- extendedWaitUntil:
    visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
    timeout: 15000
- assertNotVisible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- waitForAnimationToEnd
# Pixel stability alone can still describe the preceding tab.
- extendedWaitUntil:
    visible:
      id: 'pre-session-footer'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 03-workout-generator

# Discover — the playlist library (smart "Your Picks" + saved playlists).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
          commands:
            - tapOn: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
      - extendedWaitUntil:
          visible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
          timeout: 15000
      - tapOn:
          text: ${SCREENSHOT_SIDEBAR_DISCOVER_LABEL}
          index: 0
      - extendedWaitUntil:
          visible:
            text: ${SCREENSHOT_SIDEBAR_DISCOVER_LABEL}
            selected: true
          timeout: 5000
- tapOn: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- extendedWaitUntil:
    visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
    timeout: 15000
- assertNotVisible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- waitForAnimationToEnd
- takeScreenshot: 04-discover

# Profile — progress / stats (charts).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
          commands:
            - tapOn: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
      - extendedWaitUntil:
          visible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
          timeout: 15000
      - tapOn:
          text: ${SCREENSHOT_SIDEBAR_PROFILE_LABEL}
          index: 0
      - extendedWaitUntil:
          visible:
            text: ${SCREENSHOT_SIDEBAR_PROFILE_LABEL}
            selected: true
          timeout: 5000
- tapOn: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- extendedWaitUntil:
    visible: ${SCREENSHOT_SIDEBAR_TOGGLE_LABEL}
    timeout: 15000
- assertNotVisible: ${SCREENSHOT_SIDEBAR_HIDE_LABEL}
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'horizontal-scroll-section-loading'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'profile-board-overview'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 05-profile
