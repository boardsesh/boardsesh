appId: com.boardsesh.app
name: app-store screenshots (iPad)
---
# iPad App Store hero shots against the prod backend + curated test user.
#
# Why this differs from the iPhone flow (app-store.yaml): the iPad CANNOT be driven
# by deep links. On the iPad simulator every `openurl com.boardsesh.app://…` pops the
# "Open in 'Boardsesh'?" scheme-confirm dialog and the URL is never delivered to the
# app's router — navigation just never happens. iPhone remembers the confirm after
# the first prime; iPad does not.
#
# So the iPad navigates via the persistent left SIDEBAR. Each item is a real
# accessibility element (IpadSidebar sets accessibilityLabel, a locale-independent
# `testID` of ipad-sidebar-<segment>, and accessibilityState.selected on the active
# item), so every step taps by id and then waits for `selected: true` — PROOF the
# navigation took effect, wrapped in a retry that re-taps if it didn't. The previous
# coordinate-tap flow had no such proof: on the 11" iPad the first tap after the
# rotation relayout was silently swallowed, and 02-climbs shipped byte-identical to
# 01-home with a dark wall hero (the orchestrator now also fails the run on
# byte-identical captures).
#
# The wall kiosk seed (the active board's real climbs) is published at the root by
# ScreenshotBoardAutoActivator as soon as the board activates, so the wall shot no
# longer depends on the Climbs screen mounting first. Climbs is still visited first:
# it re-publishes the same seed (idempotent) and gives the wall panel time to render.
# The build auto-signs-in and lands on home — the orchestrator gates on reach-home
# before running this flow.
- setOrientation: ${MAESTRO_DEVICE_ORIENTATION}
- waitForAnimationToEnd
# The sidebar must be mounted and interactive before the first tap — the first tap
# after the rotation relayout is the one that got swallowed in CI.
- extendedWaitUntil:
    visible:
      id: "ipad-sidebar-climbs"
    timeout: 15000

# Climbs — the browse list.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "ipad-sidebar-climbs"
      - extendedWaitUntil:
          visible:
            id: "ipad-sidebar-climbs"
            selected: true
          timeout: 5000
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: 02-climbs

# Home — the "Everyone" feed, with the persistent wall rail showing the lit climb.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "ipad-sidebar-home"
      - extendedWaitUntil:
          visible:
            id: "ipad-sidebar-home"
            selected: true
          timeout: 5000
- waitForAnimationToEnd
# The live rail settles independently from the session feed.
- extendedWaitUntil:
    notVisible:
      id: 'live-sessions-skeleton'
    timeout: 90000
- assertNotVisible:
    id: 'live-sessions-error'
- assertNotVisible:
    id: 'live-sessions-offline'
- takeScreenshot: 01-home

# On the Wall — the wall-mounted kiosk HERO: the lit board + the current climb big
# and readable from across the gym.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "ipad-sidebar-wall"
      - extendedWaitUntil:
          visible:
            id: "ipad-sidebar-wall"
            selected: true
          timeout: 5000
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: 00-wall

# Record — the workout generator (a workout is pre-selected in screenshot mode via
# EXPO_PUBLIC_SCREENSHOT_WORKOUT).
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "ipad-sidebar-record"
      - extendedWaitUntil:
          visible:
            id: "ipad-sidebar-record"
            selected: true
          timeout: 5000
- waitForAnimationToEnd
# Pixel stability alone can still describe the preceding tab.
- extendedWaitUntil:
    visible:
      id: 'pre-session-footer'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 03-workout-generator

# Discover — the playlist library (smart "Your Picks" + saved playlists).
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "ipad-sidebar-discover"
      - extendedWaitUntil:
          visible:
            id: "ipad-sidebar-discover"
            selected: true
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 04-discover

# Profile — progress / stats (charts).
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "ipad-sidebar-profile"
      - extendedWaitUntil:
          visible:
            id: "ipad-sidebar-profile"
            selected: true
          timeout: 5000
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'horizontal-scroll-section-loading'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'profile-board-overview'
    direction: UP
    centerElement: false
    visibilityPercentage: 100
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 05-profile

# ── iPad campaign captures ───────────────────────────────────────────────────
# One board view per board, on top of the six shell screens above. Guarded on the
# campaign fixture exactly as app-store-android.yaml guards its own campaign
# blocks, so a legacy or record run still produces the six-capture set and still
# frames. SCREENSHOT_SHARED_SESSION_ID stands in for "the campaign fixture set is
# loaded" — it and `capture.boards` come from the same manifest.
#
# ALL THREE live in ONE guarded block on purpose: the presentation recipes match
# the capture set by exact filename set, so the iPad set is either six or nine —
# a partial campaign frames as nothing.
#
# There is no live-queue capture. Android joins the shared session with
# `://join/<id>`; the iPad has no deep links, and its only in-app route is the
# home live rail, which the pinned fixture leaves empty (followedLiveSessions is
# [], BoardLiveSessions is null) and nothing in screenshot mode seeds.
#
# Still no deep links (see the header): boards are switched through the real UI —
# the board panel's pinned "Switch board" footer -> the /boards picker -> the
# board's own card, tapped by its NAME (fixture data, so locale-independent).
# Every wait below is a testID or fixture data for the same reason: this flow
# runs in four locales, so the Android flow's English text waits ("Join session",
# "[2-9] climbing") cannot be reused here.
- runFlow:
    when:
      true: ${SCREENSHOT_SHARED_SESSION_ID != ''}
    commands:
      # Kilter — the board the build already boots on (SCREENSHOT_BOARDS[0],
      # activated by ScreenshotBoardAutoActivator), so this one needs no switch.
      # The SECOND climb goes into the detail pane: Climbs auto-lights the FIRST
      # one in screenshot mode, so re-selecting it would ship a frame
      # byte-identical to 02-climbs, which the orchestrator rejects as a duplicate.
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "ipad-sidebar-climbs"
            - extendedWaitUntil:
                visible:
                  id: "ipad-sidebar-climbs"
                  selected: true
                timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "climb-row"
          timeout: 60000
      # Pixel-diff settle: the rows swap in under the skeleton, and tapping mid-swap
      # would select whichever row happened to be there.
      - waitForAnimationToEnd:
          timeout: 30000
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "climb-row"
                index: 1
            - extendedWaitUntil:
                visible:
                  id: "play-drawer-board-overlay"
                timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - takeScreenshot: 06-kilter-board-view

      # Tension. On the campaign iPads (11"/13" Pro in landscape) the "Now on the
      # wall" COLUMN is docked beside the list, so its pinned "Switch board"
      # footer is already on screen and the branch below is a no-op. Where the
      # column is collapsed the board glyph in the Climbs toolbar opens the same
      # panel as a sheet first — never both, or two copies of
      # `board-sheet-switch-board` would make the next tap ambiguous.
      - runFlow:
          when:
            notVisible:
              id: "board-sheet-switch-board"
          commands:
            - retry:
                maxRetries: 2
                commands:
                  - tapOn:
                      id: "board-toolbar-action"
                  - extendedWaitUntil:
                      visible:
                        id: "board-sheet-switch-board"
                      timeout: 15000
      # One retry around the WHOLE switch: re-picking a board that is already
      # active is idempotent, so a restart from the footer costs nothing, while a
      # retry around the card tap alone could re-tap the name after the picker
      # dismissed (the wall column footer then carries it) and reopen /boards.
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "board-sheet-switch-board"
            # The picker is up once the board we are switching TO is on screen: it
            # is not the active board, so its name appears nowhere else yet.
            - extendedWaitUntil:
                visible: "High Point Climbing Orlando.*"
                timeout: 30000
            - tapOn: "High Point Climbing Orlando.*"
            # Proof the bind landed AND the picker dismissed back to Climbs: the
            # board glyph's accessibility label IS the active board's label.
            - extendedWaitUntil:
                visible:
                  id: "board-toolbar-action"
                  text: "High Point Climbing Orlando.*"
                timeout: 90000
      - extendedWaitUntil:
          visible:
            id: "climb-row"
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      # The pane still holds the previous board's climb (the auto-light fires once
      # per mount), so selecting a row here is what re-renders it on this board.
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "climb-row"
                index: 1
            - extendedWaitUntil:
                visible:
                  id: "play-drawer-board-overlay"
                timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - takeScreenshot: 07-tension-board-view

      # MoonBoard — same three hops against the third pinned wall.
      - runFlow:
          when:
            notVisible:
              id: "board-sheet-switch-board"
          commands:
            - retry:
                maxRetries: 2
                commands:
                  - tapOn:
                      id: "board-toolbar-action"
                  - extendedWaitUntil:
                      visible:
                        id: "board-sheet-switch-board"
                      timeout: 15000
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "board-sheet-switch-board"
            - extendedWaitUntil:
                visible: "Test User's MoonBoard 2016 Standard.*"
                timeout: 30000
            - tapOn: "Test User's MoonBoard 2016 Standard.*"
            - extendedWaitUntil:
                visible:
                  id: "board-toolbar-action"
                  text: "Test User's MoonBoard 2016 Standard.*"
                timeout: 90000
      - extendedWaitUntil:
          visible:
            id: "climb-row"
          timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "climb-row"
                index: 1
            - extendedWaitUntil:
                visible:
                  id: "play-drawer-board-overlay"
                timeout: 60000
      - waitForAnimationToEnd:
          timeout: 30000
      - takeScreenshot: 08-moonboard-board-view
