appId: com.boardsesh.app
name: multiboard App Store campaign sources
---
# Opt-in candidate capture: the orchestrator requires the verified seven-board
# replay scenario before launching. Slots: Kilter, Tension, MoonBoard, Woods,
# Decoy, Grasshopper, spray. Keep existing sources for provenance/reframing.
# The orchestrator inlines this flow before rendering orientation placeholders.
- runFlow: app-store.yaml

# Relaunch closes the previous play drawer before selecting another wall.
- launchApp
- openLink: com.boardsesh.app://home
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- assertNotVisible:
    id: 'play-drawer-board-overlay'
- openLink: com.boardsesh.app://climbs?screenshotOpenFirst=1&screenshotBoardIndex=2
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'play-drawer-board-overlay'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: 10-moonboard-board-view

# Relaunch closes the previous play drawer before selecting another wall.
