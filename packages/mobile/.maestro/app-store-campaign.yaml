appId: com.boardsesh.app
name: multiboard App Store campaign sources
---
# Campaign capture: the orchestrator requires the verified seven-board
# replay scenario before launching. Slots: Kilter, Tension, MoonBoard, Woods,
# Decoy, Grasshopper, spray. Keep existing sources for provenance/reframing.
# The orchestrator inlines this flow before rendering orientation placeholders.
# A reused simulator may restore the previous wall. Select the fixture's primary
# board before any Home/Discover/Profile sources, and wait for its own results.
# Close the queue sheet, then the player when present. Keep the loaded native
# client connected to Metro while moving between the capture's app screens.
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: ${SCREENSHOT_CLOSE_LABEL}
          commands:
            - tapOn: ${SCREENSHOT_CLOSE_LABEL}
            - waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'play-drawer-board-overlay'
    timeout: 60000
- openLink: com.boardsesh.app://home
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 90000
- openLink: com.boardsesh.app://climbs?screenshotBoardIndex=0
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible: '.*Lightest Pair of Shorts.*'
    timeout: 90000
- openLink: com.boardsesh.app://home
- runFlow: app-store.yaml

