# Existing simulator BLE adapter supplies local connected state. The replay
# fixture must contain the session registration responses; the native client must
# carry screenshot-sim.entitlements. No fabricated island is accepted: require
# the actual SpringBoard Next control before capturing it.
# Close the queue sheet, then the player when present. Keep the loaded native
# client connected to Metro while moving between the capture's app screens.
- repeat:
