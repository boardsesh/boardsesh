appId: com.boardsesh.app.dev
name: Android queue long press opens actions
---
# Start with Up next open and a non-current queued climb named QUEUED_CLIMB.
# Run this reusable flow twice: once after opening from the root queue bar,
# then separately after opening from the player queue button. The existing
# showcase crew setup provides a real peer-added row; no account data is seeded
# or deleted by this focused gesture regression.
- assertVisible: 'Up next'
- longPressOn:
    text: '${QUEUED_CLIMB}, position .*'
- assertVisible: 'Play next'
- assertVisible: 'Preview'
# A release must leave the menu open; a later short tap is a separate gesture.
- waitForAnimationToEnd
- assertVisible: 'Play next'
