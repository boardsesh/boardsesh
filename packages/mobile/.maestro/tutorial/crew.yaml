appId: com.boardsesh.app.dev
name: Tutorial - your crew builds the queue
---
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/flow-start')}
- assertVisible: 'Invite to this session'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/invite')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- tapOn:
    id: sheet-top-bar-leading
- assertNotVisible: Invite to this session
- openLink: com.boardsesh.app://climbs/00007DA715CE4E7DBF60928D240CE7F2?boardName=kilter&layoutId=1&sizeId=7&setIds=1%2C20&angle=40
- extendedWaitUntil:
    visible:
      id: play-drawer-header-accessibility
      text: 'NuVu, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: 'Queue, [0-9]+ climbs'
    timeout: 20000
- tapOn: 'Queue, [0-9]+ climbs'
- waitForAnimationToEnd
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/set/crew-add')}
- repeat:
    while:
      true: ${http.get(TUTORIAL_SIGNAL_URL + '/signal/crew-added').body != 'go'}
    commands:
      - extendedWaitUntil:
          visible: tutorial-pause
          timeout: 500
          optional: true
- assertVisible: '.*Added by Sam.*'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/contribution')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- longPressOn: '.*Added by Sam.*'
- assertVisible: 'Preview'
- tapOn: 'Preview'
- waitForAnimationToEnd
# Preview changes the player behind the queue. Its actual header button closes
# the queue reliably; Android Back can leave this nested native sheet open.
- tapOn:
    text: Close
    rightOf: Edit queue
- extendedWaitUntil:
    notVisible: Up next
    timeout: 20000
- assertVisible: '.*Board:.*'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/preview')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
# The preview commit bar replaces Queue. Its native accessibility omits the
# measured Back to live control, so use its proven left-button center.
- assertVisible: '.*Board:.*'
- tapOn:
    point: 20%,91%
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: play-drawer-header-accessibility
      text: 'NuVu, .*'
    timeout: 20000
- extendedWaitUntil:
    visible: 'Queue, [0-9]+ climbs'
    timeout: 20000
- tapOn: 'Queue, [0-9]+ climbs'
- waitForAnimationToEnd
- longPressOn: '.*Added by Sam.*'
- assertVisible: 'Play next'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/play-next')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true

- tapOn: 'Play next'
- waitForAnimationToEnd
- tapOn:
    text: Close
    rightOf: Edit queue
- extendedWaitUntil:
    notVisible: Up next
    timeout: 20000
