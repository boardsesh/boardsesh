appId: com.boardsesh.app.dev
name: Tutorial setup - private crew session
---
- runFlow: kilter-ready.yaml
- openLink: com.boardsesh.app://climbs/00007DA715CE4E7DBF60928D240CE7F2?boardName=kilter&layoutId=1&sizeId=7&setIds=1%2C20&angle=40
- extendedWaitUntil:
    visible:
      id: play-drawer-header-accessibility
      text: 'NuVu, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Board:.*'
    timeout: 90000
- runFlow:
    when:
      visible: Switch board
    commands:
      - tapOn: Switch board
      - waitForAnimationToEnd
- assertNotVisible: Switch to Kilter to climb this
- runFlow:
    when:
      visible: '.*Connect.*[Bb]oard.*'
    commands:
      - tapOn: '.*Connect.*[Bb]oard.*'
- extendedWaitUntil:
    visible:
      id: play-drawer-header-accessibility
      text: '.*On the wall.*'
    timeout: 15000
- openLink: com.boardsesh.app://record
- waitForAnimationToEnd
- runFlow: session-private.yaml
- tapOn: Start
- waitForAnimationToEnd
# Starting the session resets its queue. Explicitly commit the real climb so
# Sam becomes the first future row rather than an unanchored first item.
- openLink: com.boardsesh.app://climbs/00007DA715CE4E7DBF60928D240CE7F2?boardName=kilter&layoutId=1&sizeId=7&setIds=1%2C20&angle=40
- extendedWaitUntil:
    visible:
      id: play-drawer-header-accessibility
      text: 'NuVu, .*'
    timeout: 90000
- extendedWaitUntil:
    visible: '.*Board:.*'
    timeout: 90000
# The native hierarchy omits this visible commit-bar button. Its measured center
# is 574,1477 on the dedicated 720x1616 capture screen; JOIN verifies the result.
- tapOn:
    point: '80%,91%'
    waitToSettleTimeoutMs: 500
- back
# Back may close the drawer onto the climb list. Open the actual current climb
# rather than assuming the wall banner exists on that underlying list.
- openLink: com.boardsesh.app://play
- extendedWaitUntil:
    visible:
      id: play-drawer-header-accessibility
      text: 'NuVu, .*'
    timeout: 20000
- extendedWaitUntil:
    # The header's screen-reader stand-in reads the title and then the wall
    # pill, which names the driver. The recorder additionally verifies its
    # exact UUID as the sole joined row.
    visible:
      id: play-drawer-header-accessibility
      text: 'NuVu, .*On the wall\. Alex is lighting the wall\..*'
    timeout: 20000
