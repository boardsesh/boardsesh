appId: com.boardsesh.app.dev
name: Tutorial - choose holds, regions and similar climbs
---
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/flow-start')}
- extendedWaitUntil:
    visible: 'Filters.*'
    timeout: 90000
- tapOn: 'Filters.*'
- assertVisible:
    id: sheet-top-bar-trailing
    text: '(Show.*climbs?|Apply filters)'
- scrollUntilVisible:
    element: Hold types
    direction: DOWN
    timeout: 90000
- tapOn: Hold types
- tapOn: 'Any.*'
# A central hold on the seeded Kilter layout; assert a filter was painted.
- tapOn:
    point: '50%,45%'
- assertVisible: Clear all
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/holds')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- tapOn: Clear all
- back
- scrollUntilVisible:
    element: Board region
    direction: DOWN
    timeout: 90000
- tapOn: Board region
- tapOn: Add a region
- assertVisible: Clear region
- swipe:
    start: '50%,48%'
    end: '50%,37%'
    duration: 800
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/region')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- tapOn: Clear region
- back
- tapOn:
    id: sheet-top-bar-trailing
- assertNotVisible:
    id: climb-filter-column
- openLink: com.boardsesh.app://climbs/0003517a70744dbdbb606f784571f626?boardName=kilter&layoutId=1&sizeId=7&setIds=1%2C20&angle=40
- extendedWaitUntil:
    visible: Phase 2
    timeout: 90000
- scrollUntilVisible:
    element: Similar Climbs
    direction: DOWN
    timeout: 90000
    centerElement: true
# This existing catalogue pair uses the same nine holds. A real result card,
# not the absence of an error, proves the downloaded local similarity query.
- runFlow:
    when:
      notVisible:
        text: 100plus
        below: Similar Climbs
    commands:
      - tapOn: Similar Climbs
- scrollUntilVisible:
    element: 100plus
    direction: DOWN
    timeout: 120000
- extendedWaitUntil:
    visible:
      text: 100plus
      below: Similar Climbs
    timeout: 120000
- assertNotVisible: 'Preparing similar climbs…'
- assertNotVisible: 'No similar climbs found'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/similar')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- back
- openLink: com.boardsesh.app://climbs
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Filters.*'
    timeout: 90000
- tapOn: 'Filters.*'
- assertVisible:
    id: sheet-top-bar-trailing
    text: '(Show.*climbs?|Apply filters)'
- scrollUntilVisible:
    element: Hold types
    direction: DOWN
    timeout: 90000
- tapOn: Hold types
- tapOn: 'Heatmap.*'
- extendedWaitUntil:
    visible:
      id: hold-filter-heatmap-legend
    timeout: 15000
- runFlow: heatmap-ready.yaml
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/heatmap')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
# Return from the hold picker and its Filters sheet after the last readable hold.
- back
- tapOn:
    id: sheet-top-bar-trailing
- assertNotVisible:
    id: climb-filter-column
