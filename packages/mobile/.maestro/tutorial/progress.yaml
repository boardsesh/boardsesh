appId: com.boardsesh.app.dev
name: Tutorial - your grades and combined progress
---
- openLink: com.boardsesh.app://settings
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Use my grades
    direction: DOWN
    timeout: 90000
    centerElement: true
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/flow-start')}
- runFlow:
    when:
      notVisible:
        rightOf: Use my grades
        below: Use my grades
        above: Climb view
        checked: true
    commands:
      - tapOn:
          rightOf: Use my grades
          below: Use my grades
          above: Climb view
          checked: false
- assertVisible:
    rightOf: Use my grades
    below: Use my grades
    above: Climb view
    checked: true
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/personal-grades')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- runFlow: kilter-ready.yaml
- tapOn: 'Filters.*'
- assertVisible: Grade range
- tapOn:
    id: sheet-top-bar-leading
- repeat:
    while:
      notVisible: Set grade filter to V4
    times: 4
    commands:
      - swipe:
          start: '15%,43%'
          end: '80%,43%'
          duration: 1000
      - waitForAnimationToEnd
- tapOn: Set grade filter to V4
- assertVisible: V4 grade filter selected
- tapOn:
    id: sheet-top-bar-trailing
- waitForAnimationToEnd
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/grade-filter')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- openLink: com.boardsesh.app://profile
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: Across your boards
    timeout: 90000
- assertNotVisible: "Couldn't load this"
- scrollUntilVisible:
    element: Your progress
    direction: DOWN
    timeout: 90000
    centerElement: true
- assertVisible:
    id: profile-progress-section
- tapOn:
    id: profile-progress-filter
- tapOn: All boards
- tapOn: All
- back
- scrollUntilVisible:
    element: Across your boards
    direction: UP
    timeout: 90000
- assertVisible: '.*Kilter.*'
- assertVisible: '.*Tension.*'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/multiboard')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- scrollUntilVisible:
    element: Your progress
    direction: DOWN
    timeout: 90000
- tapOn:
    id: profile-progress-filter
- tapOn: Kilter
- back
- scrollUntilVisible:
    element: 'Calendar'
    direction: DOWN
    timeout: 90000
    centerElement: true
- assertVisible: Kilter · All time
- assertVisible: Less
- assertVisible: More
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/calendar')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
