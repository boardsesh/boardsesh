appId: com.boardsesh.app.dev
name: Tutorial setup - require a completed local hold index
---
- runFlow: kilter-ready.yaml
# A real downloaded-board heatmap is the readiness gate. No fixed sleep or
# simulated success can turn an unavailable similarity index into footage.
- extendedWaitUntil:
    visible: 'Filters.*'
    timeout: 90000
- tapOn: 'Filters.*'
- assertVisible:
    id: sheet-top-bar-trailing
    text: '(Show.*climbs?|Apply filters)'
- scrollUntilVisible:
    element: 'Hold types'
    direction: DOWN
    timeout: 90000
- tapOn: 'Hold types'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: hold-filter-heatmap-legend
    commands:
      - runFlow:
          when:
            notVisible:
              id: hold-heatmap-download-line
          commands:
            - tapOn: 'Heatmap.*'
- runFlow:
    when:
      visible:
        id: hold-heatmap-download-line
    commands:
      - tapOn: Download
      - extendedWaitUntil:
          visible: 'Download Tutorial Kilter\?'
          timeout: 90000
      - assertVisible: ".*Downloads all this board's climbs.*"
      # Native hierarchy exposes both the nudge and confirmation as Download.
      # Scope the real dialog button so snapshot size text may change its position.
      - tapOn:
          id: button
          text: Download
          childOf:
            id: modal-surface
      - assertNotVisible: 'Download Tutorial Kilter\?'
# A legend container also exists during loading. Wait for its actual nonzero
# query result, including when a retained download was already enabled.
- extendedWaitUntil:
    visible:
      text: '(Few climbs, Many climbs|Every hold used equally|Easier, Harder), [1-9][0-9,]* climbs?'
    # Privacy-safe snapshots still require real authorized paged replay.
    # Measured cold replay left stats and grades incomplete after five minutes.
    timeout: 1800000
- runFlow: heatmap-ready.yaml
- assertNotVisible:
    id: hold-heatmap-download-line
- tapOn: 'Heatmap.*'
- back
- tapOn:
    id: sheet-top-bar-trailing
- assertNotVisible:
    id: climb-filter-column
- openLink: com.boardsesh.app://climbs
- waitForAnimationToEnd
