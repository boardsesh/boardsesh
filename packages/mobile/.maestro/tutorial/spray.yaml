appId: com.boardsesh.app.dev
name: Tutorial - real photo spray wall
---
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/flow-start')}
- assertVisible: '.*Board:.*'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/photo')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- swipe:
    start: '85%,42%'
    end: '18%,42%'
    duration: 400
- waitForAnimationToEnd
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/highlight')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- openLink: com.boardsesh.app://climbs?screenshotBoardIndex=0&screenshotOpenFirst=1
- waitForAnimationToEnd
- openLink: com.boardsesh.app://settings/board-look
- extendedWaitUntil:
    visible: Aura Outline
    timeout: 90000
- tapOn: Aura Outline
- assertVisible: '.*Aura Outline.*'
- scrollUntilVisible:
    element: Use my look on spray walls
    centerElement: true
    direction: DOWN
    timeout: 90000
- runFlow:
    when:
      notVisible:
        rightOf: Use my look on spray walls
        below: Spray walls
        above: Reset board look
        checked: true
    commands:
      - tapOn:
          rightOf: Use my look on spray walls
          below: Spray walls
          above: Reset board look
          checked: false
- assertVisible:
    rightOf: Use my look on spray walls
    below: Spray walls
    above: Reset board look
    checked: true
- openLink: com.boardsesh.app://climbs?screenshotBoardIndex=3&screenshotOpenFirst=1
- waitForAnimationToEnd
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/look')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- openLink: com.boardsesh.app://boards
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Open details for Tutorial Spray Wall
    direction: DOWN
    timeout: 90000
- tapOn: Open details for Tutorial Spray Wall
- tapOn: Share link
- assertVisible: Share this wall
- assertVisible: QR code for Tutorial Spray Wall
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/share')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
