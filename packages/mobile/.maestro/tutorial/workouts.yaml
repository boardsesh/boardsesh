appId: com.boardsesh.app.dev
name: Tutorial - a workout advances after real rest
---
- runFlow: kilter-ready.yaml
- openLink: com.boardsesh.app://record
- waitForAnimationToEnd
- runFlow: session-private.yaml
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/flow-start')}
- tapOn: 'Workout, Pyramid.*'
- extendedWaitUntil:
    notVisible: 'Building your workout…'
    timeout: 20000
- assertNotVisible: "No climbs found for this grade. Try another."
- extendedWaitUntil:
    visible:
      text: Start
      enabled: true
    timeout: 120000
# Native semantics clip the shelf card bounds, so centering its label does not
# bring the whole selected chart into frame. Swipe the measured shelf itself.
- assertVisible: 'Workout, Pyramid.*'
- swipe:
    start: '90%,60%'
    end: '20%,60%'
    duration: 800
- assertVisible:
    text: 'Workout, Pyramid.*'
    selected: true
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/generated')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- scrollUntilVisible:
    element: 'Rest timer.*'
    direction: DOWN
    centerElement: true
    timeout: 90000
- runFlow:
    when:
      notVisible:
        id: rest-length-pill
    commands:
      - tapOn: 'Rest timer.*'
- extendedWaitUntil:
    visible:
      id: rest-length-pill
    timeout: 20000
- repeat:
    times: 22
    commands:
      - runFlow:
          when:
            notVisible: 'Rest length, 0:30'
          commands:
            - tapOn:
                id: rest-length-pill
- assertVisible: 'Rest length, 0:30'
- tapOn: After each climb
- scrollUntilVisible:
    element: 'Move to the next climb.*'
    direction: DOWN
    centerElement: true
    timeout: 90000
- runFlow:
    when:
      notVisible:
        rightOf: 'Move to the next climb.*'
        above: Only while Boardsesh is open.
        below: Your rest restarts every time you log an attempt or a send.
        checked: true
    commands:
      - tapOn: 'Move to the next climb.*'
- assertVisible:
    rightOf: 'Move to the next climb.*'
    above: Only while Boardsesh is open.
    below: Your rest restarts every time you log an attempt or a send.
    checked: true
- extendedWaitUntil:
    visible:
      text: Start
      enabled: true
    timeout: 120000
- tapOn: Start
- waitForAnimationToEnd
- openLink: com.boardsesh.app://play
- extendedWaitUntil:
    visible: '.*Board:.*'
    timeout: 90000
- runFlow:
    when:
      visible: '.*Connect.*[Bb]oard.*'
    commands:
      - tapOn: '.*Connect.*[Bb]oard.*'
- extendedWaitUntil:
    visible: 'On the wall.*'
    timeout: 15000
- tapOn:
    id: rest-timer-pill
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: rest-timer-hero-clock
      text: '.*Log a climb to start.*'
    timeout: 15000
- assertVisible: 'Rest length, 0:30'
- assertVisible: Your rest restarts every time you log an attempt or a send.
- assertVisible:
    rightOf: 'Move to the next climb.*'
    above: Only while Boardsesh is open.
    below: Your rest restarts every time you log an attempt or a send.
    checked: true
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/rest-configured')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
- back
- tapOn:
    text: Log ascent
    waitToSettleTimeoutMs: 500
- assertTrue: ${http.get(TUTORIAL_SIGNAL_URL + '/set/timer-baseline').body == 'ready'}
- tapOn:
    text: Attempt
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: rest-timer-pill
      text: 'Rest timer, .* left'
    timeout: 15000
- tapOn:
    id: rest-timer-pill
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: rest-timer-hero-clock
      text: 'Rest timer, .* left.*'
    timeout: 15000
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/logged')}
# Wait for the normal 30-second timer; the edit cuts this wait, not the app.
- repeat:
    while:
      true: ${http.get(TUTORIAL_SIGNAL_URL + '/signal/timer-advanced').body != 'go'}
    commands:
      - extendedWaitUntil:
          visible: tutorial-pause
          timeout: 500
          optional: true
- back
- assertNotVisible: "Queue's empty"
- assertVisible: 'On the wall.*'
- evalScript: ${http.get(TUTORIAL_SIGNAL_URL + '/mark/advanced')}
- extendedWaitUntil:
    visible: tutorial-pause
    timeout: 7000
    optional: true
