appId: ${APP_ID}
name: Release this phone's real board connection
---
- assertVisible:
    id: wall-control-.*-self-.*
- longPressOn:
    id: play-drawer-wall-control
- extendedWaitUntil:
    visible:
      id: ble-control-disconnect
    timeout: 10000
- tapOn:
    id: ble-control-disconnect
- extendedWaitUntil:
    notVisible:
      id: wall-control-.*-self-.*
    timeout: 30000
