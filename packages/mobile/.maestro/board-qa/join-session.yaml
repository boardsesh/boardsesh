appId: ${APP_ID}
name: Join through the normal invite confirmation
---
- openLink: ${SESSION_URL}
- extendedWaitUntil:
    visible:
      id: session-join-confirm
    timeout: 30000
- tapOn:
    id: session-join-confirm
- extendedWaitUntil:
    visible:
      id: session-active-${SESSION_ID}
    timeout: 30000
