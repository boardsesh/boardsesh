services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    command: '-d 1'
    volumes:
      - db_data_pg18:/var/lib/postgresql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  db_setup:
    build:
      context: ..
      dockerfile: ./db/Dockerfile
    volumes:
      - ./:/db
      - ./../drizzle:/app/drizzle
      - ./../drizzle.config.ts:/app/drizzle.config.ts
      - ./../app/lib/db/schema.ts:/app/app/lib/db/schema.ts
      - ./../package.json:/app/package.json
      - ./../package-lock.json:/app/package-lock.json
      - ./../node_modules:/app/node_modules
    environment:
      - POSTGRES_URL=postgres://postgres:password@postgres:5432/main
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=main
      - POSTGRES_URL_NON_POOLING=postgres://postgres:password@postgres:5432/main
    depends_on:
      postgres:
        condition: service_healthy
    command: /db/setup-development-db.sh
volumes:
  db_data_pg18:
