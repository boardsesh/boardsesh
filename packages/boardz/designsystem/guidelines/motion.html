<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Fast and functional — 80 / 140 / 220 / 360ms, ease-out" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}@keyframes led{0%,100%{opacity:.35;box-shadow:none}50%{opacity:1;box-shadow:0 0 12px 3px rgba(61,134,255,.6)}}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:14px;align-items:center"><div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-2);padding:12px"><div class="mono" style="font-size:20px;font-weight:300;letter-spacing:-0.04em">80<span style="font-size:11px">ms</span></div><div class="lbl" style="margin-top:8px">--dur-instant</div><div style="font-size:12px;color:var(--fg-3);margin-top:4px">Press</div></div><div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-2);padding:12px"><div class="mono" style="font-size:20px;font-weight:300;letter-spacing:-0.04em">140<span style="font-size:11px">ms</span></div><div class="lbl" style="margin-top:8px">--dur-fast</div><div style="font-size:12px;color:var(--fg-3);margin-top:4px">Hover</div></div><div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-2);padding:12px"><div class="mono" style="font-size:20px;font-weight:300;letter-spacing:-0.04em">220<span style="font-size:11px">ms</span></div><div class="lbl" style="margin-top:8px">--dur-base</div><div style="font-size:12px;color:var(--fg-3);margin-top:4px">LED fade</div></div><div style="border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-2);padding:12px"><div class="mono" style="font-size:20px;font-weight:300;letter-spacing:-0.04em">360<span style="font-size:11px">ms</span></div><div class="lbl" style="margin-top:8px">--dur-slow</div><div style="font-size:12px;color:var(--fg-3);margin-top:4px">Sheet</div></div><div style="height:84px;border-radius:10px;background:var(--board-panel);display:flex;align-items:center;justify-content:center;gap:12px"><span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--led-blue);animation:led 1.6s var(--ease-in-out) infinite"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;color:#8A8C90">LIGHT UP</span></div></div></body></html>
