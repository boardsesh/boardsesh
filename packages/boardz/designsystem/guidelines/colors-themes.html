<!-- @dsCard group="Colors" viewport="700x230" name="Light & dark" subtitle="Same semantic tokens; set data-theme on any ancestor" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Light & dark</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div data-theme="light" style="padding:16px;border-radius:14px;background:var(--bg-app);box-shadow:inset 0 0 0 1px var(--border-2);color:var(--fg-1)"><div class="lbl" style="margin-bottom:10px">light</div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px"><div><div class="sw" style="height:44px;background:var(--bg-app);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">app</div></div><div><div class="sw" style="height:44px;background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">surface</div></div><div><div class="sw" style="height:44px;background:var(--bg-surface-3);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">surface-3</div></div><div><div class="sw" style="height:44px;background:var(--border-2);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">hairline</div></div><div><div class="sw" style="height:44px;background:var(--fg-1);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">fg-1</div></div></div><div style="margin-top:12px;display:flex;gap:14px;font-size:13px"><span style="color:var(--fg-1)">fg-1 Ink</span><span style="color:var(--fg-2)">fg-2 Graphite</span><span style="color:var(--fg-3)">fg-3 Pencil</span></div></div><div data-theme="dark" style="padding:16px;border-radius:14px;background:var(--bg-app);box-shadow:inset 0 0 0 1px var(--border-2);color:var(--fg-1)"><div class="lbl" style="margin-bottom:10px">dark</div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px"><div><div class="sw" style="height:44px;background:var(--bg-app);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">app</div></div><div><div class="sw" style="height:44px;background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">surface</div></div><div><div class="sw" style="height:44px;background:var(--bg-surface-3);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">surface-3</div></div><div><div class="sw" style="height:44px;background:var(--border-2);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">hairline</div></div><div><div class="sw" style="height:44px;background:var(--fg-1);box-shadow:inset 0 0 0 1px var(--border-2)"></div><div class="sv" style="color:var(--fg-2)">fg-1</div></div></div><div style="margin-top:12px;display:flex;gap:14px;font-size:13px"><span style="color:var(--fg-1)">fg-1 Ink</span><span style="color:var(--fg-2)">fg-2 Graphite</span><span style="color:var(--fg-3)">fg-3 Pencil</span></div></div></div></body></html>
