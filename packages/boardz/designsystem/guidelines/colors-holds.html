<!-- @dsCard group="Colors" viewport="700x200" name="Hold LEDs" subtitle="Each board keeps its own LED convention, on an always-dark panel" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Hold LEDs</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="border-radius:12px;background:var(--board-panel);padding:10px 20px"><div style="display:flex;align-items:center;gap:18px;height:44px"><span class="mono" style="width:120px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9AAAD">Moonboard</span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-moon-start);background:color-mix(in srgb,var(--led-moon-start) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-moon-start) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">start</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-moon-hand);background:color-mix(in srgb,var(--led-moon-hand) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-moon-hand) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">hand</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-moon-foot);background:color-mix(in srgb,var(--led-moon-foot) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-moon-foot) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">foot</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-moon-finish);background:color-mix(in srgb,var(--led-moon-finish) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-moon-finish) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">finish</span></span></div><div style="display:flex;align-items:center;gap:18px;height:44px"><span class="mono" style="width:120px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9AAAD">Kilter</span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-kilter-start);background:color-mix(in srgb,var(--led-kilter-start) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-kilter-start) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">start</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-kilter-hand);background:color-mix(in srgb,var(--led-kilter-hand) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-kilter-hand) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">hand</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-kilter-foot);background:color-mix(in srgb,var(--led-kilter-foot) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-kilter-foot) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">foot</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-kilter-finish);background:color-mix(in srgb,var(--led-kilter-finish) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-kilter-finish) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">finish</span></span></div><div style="display:flex;align-items:center;gap:18px;height:44px"><span class="mono" style="width:120px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9AAAD">Tension</span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-tension-start);background:color-mix(in srgb,var(--led-tension-start) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-tension-start) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">start</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-tension-hand);background:color-mix(in srgb,var(--led-tension-hand) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-tension-hand) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">hand</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-tension-foot);background:color-mix(in srgb,var(--led-tension-foot) 16%,transparent);box-shadow:0 0 12px 2px color-mix(in srgb,var(--led-tension-foot) 55%,transparent)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A8C90">foot</span></span><span style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--led-te
