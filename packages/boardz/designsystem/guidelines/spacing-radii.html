<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css">

ex-direction:column;gap:8px;align-items:center"><div style="width:64px;height:56px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--border-strong);background:var(--bg-surface)"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">xl · 20</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:64px;height:56px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--border-strong);background:var(--bg-surface)"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">pill · ∞</span></div></div></body></html>
