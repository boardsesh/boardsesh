<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Muted inks with soft tints — for messages, never decoration" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px"><div style="border-radius:10px;background:var(--success-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--success)">Success · sent</span><span class="mono" style="font-size:10px;color:var(--success)">--success</span></div><div style="border-radius:10px;background:var(--danger-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--danger)">Danger · failed</span><span class="mono" style="font-size:10px;color:var(--danger)">--danger</span></div><div style="border-radius:10px;background:var(--warning-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--warning)">Warning</span><span class="mono" style="font-size:10px;color:var(--warning)">--warning</span></div><div style="border-radius:10px;background:var(--info-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--info)">Info</span><span class="mono" style="font-size:10px;color:var(--info)">--info</span></div></div></body></html>
