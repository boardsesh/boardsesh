<!-- @dsCard group="Spacing" viewport="700x170" name="Hairlines & elevation" subtitle="Hairlines at rest; shadows only for floating layers" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Hairlines & elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
 <div style="height:88px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-1);display:flex;align-items:flex-end;padding:10px"><span class="lbl">Card · border-1</span></div>
 <div style="height:88px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-2);display:flex;align-items:flex-end;padding:10px"><span class="lbl">Control · border-2</span></div>
 <div style="height:88px;border-radius:14px;background:var(--bg-surface);box-shadow:var(--shadow-2);display:flex;align-items:flex-end;padding:10px"><span class="lbl">Popover · shadow-2</span></div>
 <div style="height:88px;border-radius:20px;background:var(--bg-surface);box-shadow:var(--shadow-3);display:flex;align-items:flex-end;padding:10px"><span class="lbl">Sheet · shadow-3</span></div></div></body></html>
