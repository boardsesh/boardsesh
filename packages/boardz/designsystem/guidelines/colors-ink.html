<!-- @dsCard group="Colors" viewport="700x200" name="Ink is the accent" subtitle="Primary actions and selection are ink; no brand hue" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Ink is the accent</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
 <div style="padding:18px;border-radius:14px;background:#F4F3EF;box-shadow:inset 0 0 0 1px #E4E2DC;display:flex;flex-direction:column;gap:14px" data-theme="light">
  <div class="lbl">Light · accent = ink 151618</div>
  <div class="row"><span style="height:44px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--fg-on-accent);display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px"><span style="width:8px;height:8px;border-radius:50%;background:var(--led-blue);box-shadow:0 0 8px 2px rgba(61,134,255,.6)"></span>Light it up</span><span style="display:flex;height:36px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-2);overflow:hidden;font-size:13px;font-weight:500"><span style="padding:0 12px;display:flex;align-items:center;background:var(--accent);color:var(--fg-on-accent)">40°</span><span style="padding:0 12px;display:flex;align-items:center;color:var(--fg-2);border-left:1px solid var(--border-2)">50°</span></span></div>
 </div>
 <div data-theme="dark" style="padding:18px;border-radius:14px;background:var(--bg-app);box-shadow:inset 0 0 0 1px var(--border-2);display:flex;flex-direction:column;gap:14px;color:var(--fg-1)">
  <div class="lbl">Dark · accent = paper EDECE8</div>
  <div class="row"><span style="height:44px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--fg-on-accent);display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px"><span style="width:8px;height:8px;border-radius:50%;background:var(--led-blue);box-shadow:0 0 8px 2px rgba(61,134,255,.6)"></span>Light it up</span><span style="display:flex;height:36px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border-2);overflow:hidden;font-size:13px;font-weight:500"><span style="padding:0 12px;display:flex;align-items:center;background:var(--accent);color:var(--fg-on-accent)">40°</span><span style="padding:0 12px;display:flex;align-items:center;color:var(--fg-2);border-left:1px solid var(--border-2)">50°</span></span></div>
 </div></div></body></html>
