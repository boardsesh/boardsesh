<!-- @dsCard group="Brand" viewport="700x150" name="Icons" subtitle="Lucide outline, 1.75 stroke, 20px default — rendered in ink" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Icons</title><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.g{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.c svg{width:22px;height:22px}.n{font:400 9px/1.2 var(--font-mono);color:var(--fg-3);text-align:center}</style></head><body>
<div class="g"><div class="c"><i data-lucide="layout-grid"></i><span class="n">layout-grid</span></div><div class="c"><i data-lucide="bookmark"></i><span class="n">bookmark</span></div><div class="c"><i data-lucide="trophy"></i><span class="n">trophy</span></div><div class="c"><i data-lucide="history"></i><span class="n">history</span></div><div class="c"><i data-lucide="settings"></i><span class="n">settings</span></div><div class="c"><i data-lucide="lightbulb"></i><span class="n">lightbulb</span></div><div class="c"><i data-lucide="bluetooth-connected"></i><span class="n">bluetooth-connected</span></div><div class="c"><i data-lucide="sliders-horizontal"></i><span class="n">sliders-horizontal</span></div><div class="c"><i data-lucide="heart"></i><span class="n">heart</span></div><div class="c"><i data-lucide="check"></i><span class="n">check</span></div><div class="c"><i data-lucide="search"></i><span class="n">search</span></div><div class="c"><i data-lucide="chevron-left"></i><span class="n">chevron-left</span></div><div class="c"><i data-lucide="play"></i><span class="n">play</span></div><div class="c"><i data-lucide="upload"></i><span class="n">upload</span></div><div class="c"><i data-lucide="zap"></i><span class="n">zap</span></div><div class="c"><i data-lucide="star"></i><span class="n">star</span></div><div class="c"><i data-lucide="share"></i><span class="n">share</span></div><div class="c"><i data-lucide="rotate-ccw"></i><span class="n">rotate-ccw</span></div><div class="c"><i data-lucide="plus"></i><span class="n">plus</span></div><div class="c"><i data-lucide="x"></i><span class="n">x</span></div></div>
<script>lucide.createIcons({attrs:{'stroke-width':1.75}});</script></body></html>
