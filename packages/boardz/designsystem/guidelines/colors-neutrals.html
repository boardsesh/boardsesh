<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Paper & graphite</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div class="lbl" style="margin-bottom:10px">Paper</div><div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px"><div><div class="sw" style="background:var(--paper-0)"></div><div class="sn">0</div><div class="sv">FFFFFF</div></div><div><div class="sw" style="background:var(--paper-25)"></div><div class="sn">25</div><div class="sv">FAFAF8</div></div><div><div class="sw" style="background:var(--paper-50)"></div><div class="sn">50</div><div class="sv">F4F3EF</div></div><div><div class="sw" style="background:var(--paper-100)"></div><div class="sn">100</div><div class="sv">EAE9E4</div></div><div><div class="sw" style="background:var(--paper-150)"></div><div class="sn">150</div><div class="sv">E4E2DC</div></div><div><div class="sw" style="background:var(--paper-200)"></div><div class="sn">200</div><div class="sv">D6D4CD</div></div><div><div class="sw" style="background:var(--paper-300)"></div><div class="sn">300</div><div class="sv">BDBBB4</div></div><div><div class="sw" style="background:var(--paper-400)"></div><div class="sn">400</div><div class="sv">A9A7A0</div></div></div><div class="lbl" style="margin:18px 0 10px">Graphite</div><div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px"><div><div class="sw" style="background:var(--graphite-400)"></div><div class="sn">400</div><div class="sv">8A8C90</div></div><div><div class="sw" style="background:var(--graphite-500)"></div><div class="sn">500</div><div class="sv">686A6E</div></div><div><div class="sw" style="background:var(--graphite-600)"></div><div class="sn">600</div><div class="sv">44464A</div></div><div><div class="sw" style="background:var(--graphite-700)"></div><div class="sn">700</div><div class="sv">2A2C2F</div></div><div><div class="sw" style="background:var(--graphite-750)"></div><div class="sn">750</div><div class="sv">202124</div></div><div><div class="sw" style="background:var(--graphite-850)"></div><div class="sn">850</div><div class="sv">161719</div></div><div><div class="sw" style="background:var(--graphite-950)"></div><div class="sn">950</div><div class="sv">0E0F10</div></div><div><div class="sw" style="background:var(--ink)"></div><div class="sn">Ink</div><div class="sv">151618</div></div></div></body></html>
