<!-- @dsCard group="Colors" viewport="700x130" name="Status LEDs" subtitle="Glowing dots for live state: connection, toasts, the light action" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Status LEDs</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="height:78px;border-radius:12px;background:var(--board-panel);display:grid;grid-template-columns:repeat(4,1fr);align-items:center"><div style="display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:var(--led-green);box-shadow:0 0 10px 2px rgba(43,214,107,.6)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9AAAD">Connected</span></div><div style="display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:var(--led-blue);box-shadow:0 0 10px 2px rgba(61,134,255,.6)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9AAAD">Scanning · lit</span></div><div style="display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:var(--led-amber);box-shadow:0 0 10px 2px rgba(255,197,61,.6)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9AAAD">Low battery</span></div><div style="display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:var(--led-red);box-shadow:0 0 10px 2px rgba(255,74,61,.6)"></span><span class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A9AAAD">Lost the board</span></div></div></body></html>
