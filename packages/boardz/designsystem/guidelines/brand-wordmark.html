<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark" subtitle="No logo supplied — the name set in Geist with a lit LED dot" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Wordmark</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
 <div style="height:120px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-2);display:flex;align-items:center;justify-content:center"><span style="display:inline-flex;align-items:flex-end;gap:5px"><span style="font:600 44px/1 var(--font-sans);letter-spacing:-0.06em">boardz</span><span style="width:9px;height:9px;border-radius:50%;background:var(--led-blue);box-shadow:0 0 10px 2px rgba(61,134,255,.6);margin-bottom:5px"></span></span></div>
 <div data-theme="dark" style="height:120px;border-radius:14px;background:var(--bg-app);display:flex;align-items:center;justify-content:center;color:var(--fg-1)"><span style="display:inline-flex;align-items:flex-end;gap:5px"><span style="font:600 44px/1 var(--font-sans);letter-spacing:-0.06em">boardz</span><span style="width:9px;height:9px;border-radius:50%;background:var(--led-blue);box-shadow:0 0 10px 2px rgba(61,134,255,.6);margin-bottom:5px"></span></span></div></div></body></html>
