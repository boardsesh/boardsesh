<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="2 → 64px; gutters 20 phone · 24 tablet · 32 desktop" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:2px;height:2px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">2</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:4px;height:4px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">4</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:8px;height:8px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">8</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:12px;height:12px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">12</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:16px;height:16px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">16</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:20px;height:20px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">20</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:24px;height:24px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">24</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-7</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:32px;height:32px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">32</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:40px;height:40px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">40</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-9</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:48px;height:48px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">48</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:64px;background:var(--fg-1);border-radius:2px"></div><span class="mono" style="font-size:10px;color:var(--fg-3)">64</span><span class="mono" style="font-size:9px;color:var(--fg-4)">--space-11</span></div></div></body></html>
