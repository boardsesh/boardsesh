<!-- @dsCard group="Brand" viewport="700x220" name="Signature details" subtitle="Crop marks, coordinates, readout strips, mono labels, LED dots" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Signature details</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:grid;grid-template-columns:150px 1fr;gap:28px;align-items:center">
 <div style="position:relative;margin:10px 10px 10px 24px">
  <div style="position:absolute;left:-22px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around" class="mono"><span style="font-size:9px;color:var(--board-label)">3</span><span style="font-size:9px;color:var(--board-label)">2</span><span style="font-size:9px;color:var(--board-label)">1</span></div>
  <div style="height:120px;border-radius:6px;background-color:var(--board-panel);background-image:radial-gradient(circle,var(--board-hole) 1.3px,transparent 1.8px);background-size:20% 33.33%;position:relative"><span style="position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;border:2px solid var(--led-blue);box-shadow:0 0 12px 2px rgba(61,134,255,.55)"></span></div>
  <span style="position:absolute;left:-6px;top:-6px;width:9px;height:9px;border-left:1px solid var(--board-label);border-top:1px solid var(--board-label)"></span><span style="position:absolute;right:-6px;top:-6px;width:9px;height:9px;border-right:1px solid var(--board-label);border-top:1px solid var(--board-label)"></span><span style="position:absolute;left:-6px;bottom:-6px;width:9px;height:9px;border-left:1px solid var(--board-label);border-bottom:1px solid var(--board-label)"></span><span style="position:absolute;right:-6px;bottom:-6px;width:9px;height:9px;border-right:1px solid var(--board-label);border-bottom:1px solid var(--board-label)"></span>
 </div>
 <div style="display:flex;flex-direction:column;gap:16px">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border-2);border-bottom:1px solid var(--border-2)"><div style="padding:10px 0 10px 0px;display:flex;flex-direction:column;gap:6px"><span class="lbl" style="font-size:9px">Sends</span><span class="mono" style="font-size:17px">241</span></div><div style="padding:10px 0 10px 12px;border-left:1px solid var(--border-2);display:flex;flex-direction:column;gap:6px"><span class="lbl" style="font-size:9px">Flash</span><span class="mono" style="font-size:17px">28%</span></div><div style="padding:10px 0 10px 12px;border-left:1px solid var(--border-2);display:flex;flex-direction:column;gap:6px"><span class="lbl" style="font-size:9px">Quality</span><span class="mono" style="font-size:17px">2.9</span></div><div style="padding:10px 0 10px 12px;border-left:1px solid var(--border-2);display:flex;flex-direction:column;gap:6px"><span class="lbl" style="font-size:9px">Beta</span><span class="mono" style="font-size:17px">3</span></div></div>
  <div class="row" style="gap:18px"><span class="mono" style="font-size:10px;letter-spacing:.08em;color:var(--fg-3)">NO. · PROBLEM · MOST SENT ↓</span><span style="display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:13px;box-shadow:inset 0 0 0 1px var(--border-2)" class="mono"><span style="width:6px;height:6px;border-radius:50%;background:var(--led-green);box-shadow:0 0 6px 1px rgba(43,214,107,.7)"></span><span style="font-size:10px;letter-spacing:.08em;color:var(--fg-2)">CONNECTED</span></span></div>
 </div></div></body></html>
