<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><title>Device layouts</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:var(--bg-app);color:var(--fg-1)}.lbl{font:400 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}.mono{font-family:var(--font-mono)}.row{display:flex;gap:10px;align-items:center}.sw{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,22,24,.10)}.sn{font:500 12px/1.2 var(--font-sans);margin-top:7px}.sv{font:400 10px/1.2 var(--font-mono);color:var(--fg-3);margin-top:3px}</style></head><body><div style="display:grid;grid-template-columns:110px 1.4fr 1.8fr;gap:18px;align-items:end">
 <div><div style="height:170px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--border-strong);display:flex;flex-direction:column;overflow:hidden"><div style="flex:1;padding:8px;display:flex;flex-direction:column;gap:4px"><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div></div><div style="height:22px;border-top:1px solid var(--border-strong)"></div></div><div class="lbl" style="margin-top:8px">Phone · tab bar</div></div>
 <div><div style="height:150px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border-strong);display:flex;overflow:hidden"><div style="width:18px;border-right:1px solid var(--border-strong)"></div><div style="width:40%;border-right:1px solid var(--border-2);padding:8px;display:flex;flex-direction:column;gap:4px"><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div></div><div style="flex:1;padding:10px;display:flex;gap:8px"><div style="width:40%;background:var(--board-panel);border-radius:4px"></div></div></div><div class="lbl" style="margin-top:8px">Tablet · rail 76 + split</div></div>
 <div><div style="height:150px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border-strong);display:flex;overflow:hidden"><div style="width:22%;border-right:1px solid var(--border-strong)"></div><div style="width:30%;border-right:1px solid var(--border-2);padding:8px;display:flex;flex-direction:column;gap:4px"><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div><div style="height:10px;border-bottom:1px solid var(--border-2)"></div></div><div style="flex:1;padding:10px;display:flex;gap:8px"><div style="width:36%;background:var(--board-panel);border-radius:4px"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:14px;width:70%;background:var(--fg-1);border-radius:2px"></div><div style="height:22px;border-top:1px solid var(--border-2);border-bottom:1px solid var(--border-2)"></div></div></div></div><div class="lbl" style="margin-top:8px">Desktop · sidebar 248 + split</div></div></div></body></html>
