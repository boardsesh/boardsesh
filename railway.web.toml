# Config-as-code for the Railway `web` service (image
# ghcr.io/boardsesh/boardsesh-web:production, built from Dockerfile.web by
# .github/workflows/production-deploy.yml). The web service's Settings ->
# Config file path must point at this file. Don't add a [build] section here;
# it would put Railway back in charge of building instead of pulling the
# prebuilt GHCR image.
#
# The root railway.toml remains the backend service's config — it is picked
# up by default, so the web service must be pointed at this file explicitly.

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Same reasoning as the backend's railway.toml: Railway's default draining time
# is 0s, so SIGTERM and SIGKILL arrive together and any request still in flight
# on an old replica is severed mid-response rather than finishing. Next's
# standalone server (packages/web/server.js) closes gracefully on SIGTERM, so
# giving it a window is all that is needed. 10s is well above a normal page
# render; Railway only sends SIGTERM once the replacement is already healthy.
# Unquoted on purpose: railway.schema.json types drainingSeconds as
# {"type": "number"}. The prose docs at docs.railway.com show it quoted
# ("drainingSeconds": "10"), which contradicts their own schema — a quoted
# string risks being rejected and silently leaving the default 0s in place.
drainingSeconds = 10
