# Config-as-code for the Railway `web` service (image
# ghcr.io/boardsesh/boardsesh-web:production, built from Dockerfile.web by
# .github/workflows/production-deploy.yml). The web service's Settings ->
# Config file path must point at this file. Don't add a [build] section here;
# it would put Railway back in charge of building instead of pulling the
# prebuilt GHCR image.
#
# The root railway.toml remains the backend service's config — it is picked
# up by default, so the web service must be pointed at this file explicitly.

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Same root cause as the backend's railway.toml: Railway's default draining time
# is 0s, so SIGTERM and SIGKILL arrive together and any request still in flight
# on an old replica is severed mid-response. A window lets those finish.
#
# What this does NOT buy, verified against next@16.3.2: Next's cleanup handler
# (dist/server/lib/start-server.js) calls server.close() and only calls
# server.closeAllConnections() when `isDev` — and the generated standalone
# server.js starts with `isDev: false` (dist/build/utils.js). So in production
# the idle keep-alive sockets the Cloudflare edge holds keep close() pending
# forever, and the steps after it (nextServer.close(), flushAllTraces(),
# process.exit(143)) never run. The old replica is SIGKILLed at the end of the
# window instead of exiting on its own.
#
# That is a real limitation but not this fix: stopping new connections and
# letting in-flight renders complete happens in server.close() regardless, and
# that is the severed-request case. Fixing the clean exit would mean owning the
# entrypoint (NEXT_MANUAL_SIG_HANDLE plus a hand-written server), because the
# standalone server.js is generated at build time and never exposes its http
# server. Not worth that trade for a tidier exit and trace flushing.
drainingSeconds = 10
