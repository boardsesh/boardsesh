[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.backend"
watchPaths = [
  "packages/backend/**",
  "packages/shared-schema/**",
  "packages/crypto/**",
  "packages/db/**",
  "packages/aurora-sync/**",
  # Backend imports these at runtime via @boardsesh/* — keep the rebuild
  # trigger list in sync with Dockerfile.backend's COPY paths.
  "packages/shared/board-config/**",
  "packages/shared/graphql/**",
  "packages/shared/queue/**",
  "package.json",
  "bun.lock",
  "Dockerfile.backend",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
