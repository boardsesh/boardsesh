<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Only these pinned, licensed faces participate in store compositions. -->
  <dir prefix="relative">.</dir>
  <!-- Preserve the Latin faces; use our pinned CJK subset for missing glyphs. -->
  <alias><family>Roboto</family><accept><family>Boardsesh Screenshot CJK</family></accept></alias>
  <alias><family>Inter Tight</family><accept><family>Boardsesh Screenshot CJK</family></accept></alias>
  <alias><family>Instrument Serif</family><accept><family>Boardsesh Screenshot CJK</family></accept></alias>
</fontconfig>
