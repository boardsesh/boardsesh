<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boardsesh showcase stage</title>
    <!--
      The stage for the homepage showcase video. Rendered frame by frame by
      packages/web/scripts/render-showcase-video.ts, which injects the data
      (footage, anchors, copy) through window.showcaseInit and then calls
      window.renderAt(frame). tokens.css is generated by the renderer.
    -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="scenes.css" />
  </head>
  <body>
    <div id="stage" data-format="16x9">
      <div class="bg"></div>
      <div class="glow glow-dark"></div>
      <div class="glow glow-light"></div>

      <svg class="layer motif-back" id="motifBack" aria-hidden="true">
        <defs>
          <pattern id="dotGrid" width="44" height="44" patternUnits="userSpaceOnUse">
            <circle cx="22" cy="22" r="1.5" fill="#A78BFA" fill-opacity="0.12" />
          </pattern>
          <radialGradient id="gridFade">
            <stop offset="0" stop-color="#fff" stop-opacity="1" />
            <stop offset="0.62" stop-color="#fff" stop-opacity="0.85" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <mask id="gridMask" maskUnits="userSpaceOnUse">
            <ellipse id="gridMaskShape" fill="url(#gridFade)" />
          </mask>
          <linearGradient id="lineGradient" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6D28D9" />
            <stop offset="1" stop-color="#C4B5FD" />
          </linearGradient>
        </defs>
        <rect id="grid" width="100%" height="100%" fill="url(#dotGrid)" mask="url(#gridMask)" />
        <path
          id="motifLine"
          fill="none"
          stroke="url(#lineGradient)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <!-- Phones are direct children of #stage so its perspective applies. -->
      <div class="phone-shadow" id="shadowLeft"></div>
      <div class="phone-shadow" id="shadowRight"></div>
      <div class="phone-shadow" id="shadowMain"></div>
      <div class="phone-rig" id="phoneLeft"></div>
      <div class="phone-rig" id="phoneRight"></div>
      <div class="phone-rig" id="phoneMain"></div>

      <svg class="layer motif-front" id="motifFront" aria-hidden="true">
        <defs>
          <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="7" />
          </filter>
          <filter id="sparkGlow" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="9" />
          </filter>
        </defs>
        <g id="rings"></g>
        <path id="sparkTrail" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" pathLength="1" />
        <g id="spark">
          <circle r="24" fill="#FF8A3D" opacity="0.55" filter="url(#sparkGlow)" />
          <circle r="7" fill="#FF8A3D" />
          <circle r="3" fill="#FFE2CC" />
        </g>
      </svg>

      <svg class="layer callouts" id="callouts" aria-hidden="true"></svg>
      <div class="layer pills" id="pills"></div>
      <div class="layer text" id="text"></div>
      <svg class="layer measure" id="measure" aria-hidden="true"></svg>

      <!-- Static grain: rasterised once on its own layer, never animated. -->
      <svg class="layer grain grain-dark" aria-hidden="true">
        <filter id="grainDark" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#grainDark)" />
      </svg>
      <svg class="layer grain grain-light" aria-hidden="true">
        <filter id="grainLight" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#grainLight)" />
      </svg>
    </div>
    <script type="module">
      import { init, renderAt, visibleImages } from './timeline.mjs';
      window.showcaseInit = init;
      window.renderAt = renderAt;
      window.visibleImages = visibleImages;
      window.showcaseStageLoaded = true;
    </script>
  </body>
</html>
