<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spray wall walkthrough stage</title>
    <!--
      The stage for the spray wall walkthrough video on /help/spray-walls.
      Rendered frame by frame by packages/web/scripts/render-spray-walkthrough.ts,
      which injects the data (copy, holds, footage frames) through
      window.walkthroughInit and then calls window.renderAt(frame).
      tokens.css is generated by the renderer.
    -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { init, renderAt, sceneList, totalFrames, visibleImages } from './timeline.mjs';
      window.walkthroughInit = init;
      window.renderAt = renderAt;
      window.totalFrames = totalFrames;
      window.sceneList = sceneList;
      window.visibleImages = visibleImages;
      window.walkthroughStageLoaded = true;
    </script>
  </body>
</html>
