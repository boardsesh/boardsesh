<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boardsesh instructional video</title>
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <main id="stage">
      <div class="glow"></div>
      <div id="brand" data-safe>boardsesh<span> / CLIMB TOGETHER</span></div>
      <h1 id="title" data-safe></h1>
      <div id="phone">
        <img id="screen" alt="Recorded Boardsesh app" />
        <div id="ring"></div>
      </div>
      <div id="label" data-safe></div>
      <p id="caption" data-safe></p>
      <div id="bookend" data-safe>
        <em id="bookend-title"></em>
        <p id="bookend-copy"></p>
      </div>
      <div id="draft"></div>
      <div id="progress"></div>
    </main>
    <script type="module" src="stage.mjs"></script>
  </body>
</html>
