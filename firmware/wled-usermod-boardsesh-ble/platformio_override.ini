; UNBUILT AND UNTESTED. Copy to the root of a WLED checkout as
; platformio_override.ini, next to platformio.ini, and build with
;   pio run -e gledopto_boardsesh_ble
;
; Board: Gledopto GL-C-015WL-D, classic ESP32. Flash size, PSRAM and the factory
; partition table are not published: check them first (README, "Before you build").
; This assumes 4 MB flash and no PSRAM, WLED's plain `esp32dev` environment.

; ---------------------------------------------------------------------------
; WLED after 0.15 (custom_usermods). Put this folder at usermods/boardsesh_ble.
; ---------------------------------------------------------------------------
[env:gledopto_boardsesh_ble]
extends = env:esp32dev
custom_usermods = boardsesh_ble
; The GL-C-015WL-D has a microphone; add audioreactive only if it still fits:
; custom_usermods = boardsesh_ble audioreactive
build_flags = ${env:esp32dev.build_flags}
  -D WLED_RELEASE_NAME=\"GLEDOPTO_BoardseshBLE\"
  ; LED output on GPIO16, as the controller ships (verify in LED Preferences).
  -D DATA_PINS=16
  ; NimBLE: one phone at a time, peripheral role only, a few bonds.
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_MAX_BONDS=4
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  ; Room for the app image next to NimBLE: drop features a Spraywall does not use.
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_LOXONE

; ---------------------------------------------------------------------------
; WLED 0.15.x (usermods_list.cpp). Put this folder at usermods/boardsesh_ble and
; add the three lines from the README to wled00/usermods_list.cpp.
; ---------------------------------------------------------------------------
[env:gledopto_boardsesh_ble_015]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
  -D WLED_RELEASE_NAME=\"GLEDOPTO_BoardseshBLE\"
  -D USERMOD_BOARDSESH_BLE
  -D DATA_PINS=16
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_MAX_BONDS=4
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_LOXONE
lib_deps = ${env:esp32dev.lib_deps}
  h2zero/NimBLE-Arduino@^1.4.3
