name: iOS TestFlight Deploy (React Native)

on:
  push:
    branches: [release/next]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - 'package.json' # root patchedDependencies and linker inputs affect the mobile native graph
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**' # pnpm patches to mobile deps live in root patches/, not under packages/mobile/**
      - '.github/workflows/ios-testflight-rn.yml'
  workflow_dispatch:
    inputs:
      build_number_offset:
        description: 'Added to GH run_number for CFBundleVersion (raise to clear ASC collisions)'
        required: false
        default: '100000'

concurrency:
  # Platform-global so App Store build-number reads/uploads cannot race across a
  # scheduled release build and an emergency manual dispatch.
  group: ios-testflight-rn
  cancel-in-progress: false

# ─── SHARED BUILD ENV (workflow-level) ───────────────────────────────────────
# Declared at the workflow level so the cheap `gate` job (fingerprint resolve)
# and the `build-and-upload` job (expo prebuild) resolve a byte-identical config
# and can't drift. MUST stay identical to android-apk-rn.yml /
# mobile-ota-production.yml — scripts/mobile-ci-env-parity.test.ts fails the
# build if they do. Config-affecting vars (EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID,
# EXPO_UPDATES_URL) move the fingerprint runtimeVersion
# directly; the rest reach it via the hashed .env file the jobs write. Don't add
# other fingerprint-affecting vars here (EAS_BUILD, EAS_BUILD_PROFILE,
# BOARDSESH_APP_VARIANT, …) — they're unset in the native build too.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  # Self-hosted OTA (expo-open-ota). EXPO_UPDATES_URL is the server's manifest
  # endpoint (e.g. https://updates.boardsesh.com/manifest), set as a repo variable
  # so the domain isn't hardcoded; until it's set, app.config.ts falls back to
  # the EAS URL and OTA stays inert (harmless). The production + xprem headers
  # are literals in app.config.ts. See docs/mobile-ota-updates.md.
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  # Read at runtime by src/lib/sentry.ts (Sentry.init) — Sentry is the mobile
  # error + native-crash sink (PostHog is product analytics only). Same DSN/
  # project as web + backend; not secret — already hardcoded in packages/web and
  # packages/backend source. The source-map + dSYM upload (gated on
  # SENTRY_AUTH_TOKEN below) symbolicates the stack traces.
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  # PostHog product analytics. Intentionally the SAME project token as web
  # (vars.NEXT_PUBLIC_POSTHOG_KEY) so a signed-in user's web + mobile activity
  # resolves to one person. EXPO_PUBLIC_* vars are inlined into the JS bundle at
  # build time; without this, analytics.ts sees no key and isAnalyticsEnabled is
  # false, so every track() silently no-ops (the app shipped zero events before).
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Manifest base for the offline snapshot bootstrap (bundle-only, no fingerprint
  # effect). Public Tigris bucket; keep in sync with SNAPSHOT_PUBLIC_BASE_URL in
  # export-board-snapshots.yml.
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://boardsesh-board-snapshots.t3.tigrisfiles.io/board-snapshots/v1-gzip
  # Pin RN's fetch as the global `fetch` (not expo/fetch), which crashes Hermes by
  # tearing down JSI promises off-thread (Sentry 7595562195). Bundle-only flag — it
  # doesn't enter the resolved config, so it never moves the fingerprint. Kept in
  # lockstep with the other mobile fingerprint workflows. See docs/mobile-ota-updates.md.
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  # Fingerprint gate: resolve the iOS runtimeVersion fingerprint on a cheap Linux
  # runner and skip the ~60-min macOS build when a binary with that fingerprint
  # already shipped (a fingerprint-ios-<hash> tag exists). The OTA publish
  # (mobile-ota-production.yml) still delivers the JS to matching binaries. This
  # gate is the ONE canonical resolution: the build job embeds this exact value in
  # the binary via EXPO_UPDATES_FINGERPRINT_OVERRIDE (no macOS re-resolve) and tags
  # it, so binary-rv == tag == the OTA-published rv by construction — no cross-OS
  # divergence to over-build around or strand OTAs over. See docs/mobile-ota-updates.md.
  gate:
    # Automatic uploads come only from the canonical native release train. A
    # manual dispatch may use main for an emergency rebuild, but arbitrary feature
    # refs never receive Native Release credentials.
    if: github.ref == 'refs/heads/release/next' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.fp.outputs.should_build }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies (workspace root)
        run: vp install --frozen-lockfile

      # The .env is hashed into the fingerprint, so it must be byte-identical to
      # the build job's (same heredoc + same workflow env) or the gate would
      # resolve a different fingerprint than the build bakes.
      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF

      - name: Resolve fingerprint and check for an existing native build
        id: fp
        run: |
          set -uo pipefail
          # No GOOGLE_MAPS_API_KEY here: iOS uses Apple Maps, so the iOS binary's
          # fingerprint is resolved without it (the Android gate sets it).
          raw="$(cd packages/mobile && vp exec expo-updates runtimeversion:resolve --platform ios 2>/dev/null || true)"
          fp="$(printf '%s' "$raw" | jq -r '.runtimeVersion // empty' 2>/dev/null || true)"
          if ! printf '%s' "$fp" | grep -qiE '^[0-9a-f]{8,}$'; then
            echo "::warning::Could not resolve the iOS fingerprint — building to be safe."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual dispatch — building iOS regardless of fingerprint $fp."
            exit 0
          fi
          tag="fingerprint-ios-$fp"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS fingerprint $fp already built (tag $tag) — skipping the native build; the OTA delivers the JS."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS fingerprint $fp is new — running the native build."
          fi

  build-and-upload:
    needs: gate
    if: needs.gate.outputs.should_build == 'true' && (github.ref == 'refs/heads/release/next' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read # protected release tags are pushed with the repository App token
    # macos-26 = Xcode 26 + iOS 26 SDK, which App Store Connect now requires
    # for all uploads. Expo SDK 57 / RN 0.86 ships a fmt that compiles cleanly
    # under Xcode 26's strict C++20 constexpr evaluator.
    runs-on: macos-26
    timeout-minutes: 60
    # Native signing/store credentials are isolated from web/OTA production.
    environment: Native Release

    env:
      WORKSPACE_PATH: packages/mobile/ios/Boardsesh.xcworkspace
      SCHEME: Boardsesh
      ARCHIVE_PATH: packages/mobile/ios/build/Boardsesh.xcarchive
      EXPORT_PATH: packages/mobile/ios/build/export
      EXPORT_OPTIONS_PLIST: packages/mobile/ExportOptions.plist
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ github.run_id }}
      # Shared EXPO_PUBLIC_* / EXPO_UPDATES_* env lives at the workflow level
      # (above) so the gate and build jobs resolve a byte-identical fingerprint.
      #
      # Pin the binary's runtimeVersion to the gate's canonical (Linux) fingerprint.
      # app.config.ts reads this and emits it as a LITERAL runtimeVersion, so
      # `expo prebuild` bakes this exact value into Expo.plist and the macOS runner
      # never resolves its own (divergent) fingerprint. Job-level so it's live at
      # prebuild AND the xcodebuild archive phase. See docs/mobile-ota-updates.md.
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.gate.outputs.fingerprint }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Needed by the post-archive `vp run mobile:upload-dsyms` step at the end
      # of this job; the rest of the build shells out to vp exec/xcodebuild directly.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies (workspace root)
        run: vp install --frozen-lockfile

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF

      # The binary embeds the gate's canonical fingerprint via
      # EXPO_UPDATES_FINGERPRINT_OVERRIDE (job env above), so the macOS runner no
      # longer re-resolves its own value — that cross-OS divergence is what
      # stranded iOS OTAs (binary on the macOS hash, publish on the Linux hash).
      # Record the gate value here so the tag step (final) tags exactly what the
      # binary embeds: tag == binary-rv == published-rv by construction.
      - name: Record fingerprint for tagging
        run: |
          set -uo pipefail
          fp="${{ needs.gate.outputs.fingerprint }}"
          if printf '%s' "$fp" | grep -qiE '^[0-9a-f]{8,}$'; then
            echo "FINGERPRINT_IOS=$fp" >> "$GITHUB_ENV"
            echo "::notice::iOS binary embeds gate fingerprint $fp (EXPO_UPDATES_FINGERPRINT_OVERRIDE); tagging that value on a successful upload."
          else
            echo "::warning::Gate produced no usable fingerprint; the binary self-resolves on macOS and no fingerprint-ios tag is pushed (next push rebuilds)."
          fi

      - name: Expo prebuild (generate ios/)
        working-directory: packages/mobile
        run: vp exec expo prebuild --platform ios --clean --no-install

      # Key on the native inputs that decide the Pods, NOT ios/Podfile.lock: there
      # is no committed ios/ (CNG — `expo prebuild` generates it), and this step
      # runs BEFORE `pod install`, so hashFiles('packages/mobile/ios/Podfile.lock')
      # matched nothing and the key collapsed to a constant that froze the cache at
      # its first save. The native deps + plugins + patches are what move the Pods,
      # so hash those (mirrors the gradle key in android-apk-rn.yml and the .app key
      # in mobile-screenshots-ios.yml).
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: packages/mobile/ios/Pods
          # No restore-keys: a prefix fallback would restore the PREVIOUS Pods
          # tree — prebuilt xcframeworks and Manifest.lock included — on exactly
          # the runs where the deps moved, which is when a mixed tree is most
          # likely. There is no committed Podfile.lock to reconcile it against
          # (.gitignore ignores packages/mobile/ios/), so a key miss must mean a
          # clean `pod install`, not a partially-stale one.
          key: ${{ runner.os }}-pods-rn-${{ hashFiles('packages/mobile/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/app.config.ts', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/locales/**', 'packages/mobile/eas.json', 'packages/mobile/assets/icon.png', 'packages/mobile/assets/adaptive-icon.png', 'packages/mobile/assets/splash-icon.png', 'packages/mobile/targets/**', 'patches/**') }}

      - name: Install CocoaPods dependencies
        working-directory: packages/mobile/ios
        run: pod install

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_ID."
            exit 1
          fi

          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_BASE64."
            exit 1
          fi

          mkdir -p ~/.private_keys
          key_path="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"

          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 did not decode to an App Store Connect private key."
            exit 1
          fi

          # Used by the fastlane build-number lane and the archive export below.
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Build number = latest TestFlight build for this marketing version + 1,
      # queried from App Store Connect via fastlane. The ASC key is REQUIRED by
      # this workflow (it uploads to TestFlight), so the "Setup App Store Connect
      # API key" step above fails fast if the secret is missing. If the key is
      # present but the query itself fails (transient ASC/network error), the lane
      # falls back to offset + run_number so a flaky query doesn't break the build.
      - name: Compute build number
        id: build_number
        working-directory: fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          offset=${{ github.event.inputs.build_number_offset || '100000' }}
          export BUILD_NUMBER_FALLBACK=$(( offset + ${{ github.run_number }} ))
          bundle exec fastlane ios next_build_number
          echo "Build number: $(grep '^value=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

      - name: Resolve mobile app version
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const appConfig = fs.readFileSync('packages/mobile/app.config.ts', 'utf8');
          const versionMatch = appConfig.match(/\bversion:\s*['"]([^'"]+)['"]/);
          if (!versionMatch) {
            throw new Error('Could not find version in packages/mobile/app.config.ts');
          }

          const version = versionMatch[1];
          fs.appendFileSync(process.env.GITHUB_ENV, `BOARDSESH_MOBILE_VERSION=${version}\n`);
          NODE

      - name: Set build number
        working-directory: packages/mobile/ios
        run: |
          set -euo pipefail
          build_number=${{ steps.build_number.outputs.value }}
          [ -n "${build_number}" ] || { echo "::error::Computed build number is empty"; exit 1; }
          agvtool new-version -all "${build_number}"

      - name: Import code signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/certificate.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 || secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          install_profile() {
            local secret_name="$1"
            local profile_label="$2"
            local profile_name_env="$3"
            local profile_bundle_id_env="$4"
            local expected_bundle_id="$5"
            local profile_base64="${!secret_name:-}"
            local profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"

            if [ -z "$profile_base64" ]; then
              echo "::error::Missing $secret_name for the $profile_label provisioning profile."
              exit 1
            fi

            mkdir -p "$profiles_dir"

            local profile_file="$RUNNER_TEMP/${profile_label}.mobileprovision"
            local plist_file="$RUNNER_TEMP/${profile_label}.plist"

            printf '%s' "$profile_base64" | base64 --decode > "$profile_file"
            if ! security cms -D -i "$profile_file" > "$plist_file"; then
              echo "::error::$secret_name did not decode to a valid .mobileprovision file."
              exit 1
            fi

            local profile_uuid
            local profile_name
            local application_identifier
            local bundle_id

            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$plist_file")
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$plist_file")
            application_identifier=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$plist_file")
            bundle_id="${application_identifier#*.}"

            if [ "$bundle_id" != "$expected_bundle_id" ]; then
              echo "::error::$profile_label profile is for $bundle_id, expected $expected_bundle_id."
              exit 1
            fi

            cp "$profile_file" "$profiles_dir/$profile_uuid.mobileprovision"
            {
              echo "$profile_name_env=$profile_name"
              echo "$profile_bundle_id_env=$bundle_id"
            } >> "$GITHUB_ENV"

            echo "Installed $profile_label provisioning profile: $profile_name ($bundle_id)"
          }

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          install_profile APP_PROFILE_BASE64 app IOS_APP_PROFILE_NAME IOS_APP_PROFILE_BUNDLE_ID com.boardsesh.app
          install_profile WIDGETS_PROFILE_BASE64 widgets IOS_WIDGETS_PROFILE_NAME IOS_WIDGETS_PROFILE_BUNDLE_ID com.boardsesh.app.widgets
          install_profile SHARE_EXTENSION_PROFILE_BASE64 share-extension IOS_SHARE_EXTENSION_PROFILE_NAME IOS_SHARE_EXTENSION_PROFILE_BUNDLE_ID com.boardsesh.app.share-extension

      - name: Configure per-target code signing
        # `ruby/setup-ruby` makes its freshly-installed Ruby the active one, and
        # that Ruby has no global xcodeproj gem (the macOS runner's system Ruby
        # did). xcodeproj is a fastlane dependency, so run under `bundle exec`
        # with the fastlane Gemfile while keeping the repo root as cwd so the
        # relative project path below still resolves.
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
        run: |
          bundle exec ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('packages/mobile/ios/Boardsesh.xcodeproj')

          profiles = {
            'Boardsesh' => ENV.fetch('IOS_APP_PROFILE_NAME'),
            'BoardseshWidgets' => ENV.fetch('IOS_WIDGETS_PROFILE_NAME'),
            'BoardseshBeta' => ENV.fetch('IOS_SHARE_EXTENSION_PROFILE_NAME'),
          }

          configured_targets = []

          project.targets.each do |target|
            next unless profiles.key?(target.name)

            target.build_configurations.each do |config|
              next unless config.name == 'Release'

              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = '9L3HKPZBH3'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profiles[target.name]
            end

            configured_targets << target.name
          end

          missing_targets = profiles.keys - configured_targets
          unless missing_targets.empty?
            raise "Missing expected Xcode targets for signing: #{missing_targets.join(', ')}"
          end

          project.save
          puts 'Per-target code signing configured for: ' + configured_targets.join(', ')
          RUBY

      - name: Write export options
        run: |
          cat > "$EXPORT_OPTIONS_PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9L3HKPZBH3</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$IOS_APP_PROFILE_BUNDLE_ID</key>
                  <string>$IOS_APP_PROFILE_NAME</string>
                  <key>$IOS_WIDGETS_PROFILE_BUNDLE_ID</key>
                  <string>$IOS_WIDGETS_PROFILE_NAME</string>
                  <key>$IOS_SHARE_EXTENSION_PROFILE_BUNDLE_ID</key>
                  <string>$IOS_SHARE_EXTENSION_PROFILE_NAME</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

      # The @sentry/react-native build phases upload the JS source maps during
      # `xcodebuild archive`. Without a token the upload errors and fails the
      # archive (sentry-xcode.sh exits non-zero), so gate it: only enable the
      # upload when SENTRY_AUTH_TOKEN is present, otherwise skip it and keep the
      # build green. SENTRY_DISABLE_AUTO_UPLOAD is read by both phases, and by
      # the post-archive dSYM upload at the end of this job — the phases run too
      # early to see the real dSYMs (see that step's comment / #4202).
      - name: Configure Sentry source map upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_DISABLE_AUTO_UPLOAD=false" >> "$GITHUB_ENV"
            echo "Sentry auth token present — source maps upload during the archive, dSYMs after it."
          else
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry source map upload."
          fi

      - name: Archive
        env:
          # Consumed by the @sentry/react-native build phases (sentry-cli). The
          # SENTRY_DISABLE_AUTO_UPLOAD gate above (via $GITHUB_ENV) decides whether
          # the upload actually runs.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.value }} \
            DEVELOPMENT_TEAM=9L3HKPZBH3

      # Reads the archived binary, because nothing before this point can. Expo's
      # precompiled modules are on by default, so ExpoModulesCore arrives as a
      # prebuilt xcframework and Xcode never re-links it — its undefined symbols
      # are resolved for the first time by dyld, on a tester's phone. That is how
      # 2.4.0 (2) shipped an ExpoModulesCore built against expo-modules-jsi
      # 57.0.4 next to a locally-compiled jsi 57.0.6 that no longer exported
      # JavaScriptActor.assumeIsolated, and aborted at launch with a green build.
      #
      # Deliberately BEFORE the dSYM upload and the export, for the same reason
      # that step gives below: a failure here ships nothing, pushes no
      # fingerprint tag, and the next push simply builds again.
      - name: Check embedded framework ABI
        run: vp run mobile:abi-check -- --app "$ARCHIVE_PATH/Products/Applications/Boardsesh.app"

      # The @sentry/react-native "Upload Debug Symbols to Sentry" build phase runs
      # INSIDE the app target's build, and the app's dSYM does not exist yet when
      # it does: in run 30781376709 the phase uploaded at 03:32:14.54 and
      # GenerateDSYMFile produced Boardsesh.app.dSYM at 03:32:16.95. So it found
      # only the stripped executables and shipped those — symbol names, no DWARF,
      # hence `(<unknown>)` for file and line on every native frame (#4202). The
      # DWARF for statically linked pods (libRNScreens.a, where BOARDSESH-9K
      # crashed) lives ONLY in the app's dSYM, so nothing that phase uploads can
      # ever produce a line number. Don't move this back into the archive.
      #
      # Deliberately BEFORE the TestFlight export and the fingerprint tag: this
      # step hard-fails, and after either of those a failure would be unfixable
      # without a manual rebuild — the binary is already in TestFlight and the
      # fingerprint tag makes the next push skip the native build, so the missing
      # dSYMs never get a second chance. Here, a failure ships nothing and pushes
      # no tag, so the next push simply builds and uploads again.
      - name: Upload iOS dSYMs to Sentry
        if: env.SENTRY_DISABLE_AUTO_UPLOAD == 'false'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: vp run mobile:upload-dsyms -- --archive "$ARCHIVE_PATH"

      - name: Export archive (uploads to TestFlight)
        id: testflight_upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID."
            exit 1
          fi

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-rn-ios-${{ steps.build_number.outputs.value }}
          path: packages/mobile/ios/build/export/*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Notify deployments channel
        if: steps.testflight_upload.outcome == 'success'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '📱 **iOS RN TestFlight uploaded** on `%s`\n• version: %s\n• build: %s\n<%s>' \
            "${COMMIT_SHA:0:7}" "$BOARDSESH_MOBILE_VERSION" "$BUILD_NUMBER" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Notify deployments channel of failure
        if: failure()
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '🚨 **iOS RN TestFlight failed** on `%s`\n• version: %s\n• build: %s\n<%s>' \
            "${COMMIT_SHA:0:7}" "$BOARDSESH_MOBILE_VERSION" "$BUILD_NUMBER" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Mint repository App token for protected release tags
        id: tag_token
        if: steps.testflight_upload.outcome == 'success' && env.FINGERPRINT_IOS != '' && steps.build_number.outputs.value != '' && env.BOARDSESH_MOBILE_VERSION != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
          permission-contents: write

      # Publish the exact build-number lookup and fingerprint gate. A new
      # fingerprint publishes both atomically; a forced rebuild preserves the
      # existing fingerprint tag and adds only its new build-number tag.
      - name: Tag the uploaded iOS build and fingerprint
        if: steps.tag_token.outcome == 'success'
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          GH_APP_TOKEN: ${{ steps.tag_token.outputs.token }}
        run: |
          set -euo pipefail
          git_auth="$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 | tr -d '\n')"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          shortfp="$(printf '%s' "${FINGERPRINT_IOS:0:12}" | tr '[:upper:]' '[:lower:]')"
          build_tag="build-ios-v${BOARDSESH_MOBILE_VERSION}-${BUILD_NUMBER}-${shortfp}"
          fingerprint_tag="fingerprint-ios-${FINGERPRINT_IOS}"
          remote_target() {
            local tag="$1"
            git ls-remote --tags "$remote" "refs/tags/$tag" "refs/tags/$tag^{}" | \
              awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" \
                '$2 == direct { direct_sha = $1 } $2 == peeled { peeled_sha = $1 } END { print peeled_sha ? peeled_sha : direct_sha }'
          }
          assert_missing_or_exact() {
            local tag="$1"
            local target="$2"
            if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points to $target, expected $GITHUB_SHA."
              exit 1
            fi
          }
          clear_git_auth() {
            git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
          }
          authenticated_push() {
            local push_status
            clear_git_auth
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $git_auth"
            set +e
            git push "$@"
            push_status=$?
            set -e
            clear_git_auth
            return "$push_status"
          }
          publish_build_tag() {
            local target
            target="$(remote_target "$build_tag")"
            assert_missing_or_exact "$build_tag" "$target"
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "::notice::$build_tag already points to this build."
              return 0
            fi
            git tag --force "$build_tag" "$GITHUB_SHA"
            if authenticated_push "$remote" "refs/tags/$build_tag"; then
              echo "::notice::Tagged exact uploaded build $build_tag."
              return 0
            fi
            target="$(remote_target "$build_tag")"
            assert_missing_or_exact "$build_tag" "$target"
            [ "$target" = "$GITHUB_SHA" ] || {
              echo "::error::Failed to publish exact uploaded build tag $build_tag."
              return 1
            }
            echo "::notice::A concurrent retry already published $build_tag at this build."
          }
          trap clear_git_auth EXIT

          build_target="$(remote_target "$build_tag")"
          fingerprint_target="$(remote_target "$fingerprint_tag")"
          assert_missing_or_exact "$build_tag" "$build_target"
          if [ -n "$fingerprint_target" ]; then
            publish_build_tag
            echo "::notice::Preserved immutable $fingerprint_tag at $fingerprint_target."
          else
            git tag --force "$build_tag" "$GITHUB_SHA"
            git tag --force "$fingerprint_tag" "$GITHUB_SHA"
            if authenticated_push --atomic "$remote" "refs/tags/$build_tag" "refs/tags/$fingerprint_tag"; then
              echo "::notice::Atomically tagged $build_tag and $fingerprint_tag."
            else
              fingerprint_target="$(remote_target "$fingerprint_tag")"
              if [ -z "$fingerprint_target" ]; then
                echo '::error::Atomic tag push failed without publishing the fingerprint gate.'
                exit 1
              fi
              publish_build_tag
              echo "::notice::A concurrent build established $fingerprint_tag; preserved it and published $build_tag."
            fi
          fi
          unset git_auth

      - name: Clean up keychain and credentials
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          rm -f ~/.private_keys/AuthKey_*.p8 2>/dev/null || true
