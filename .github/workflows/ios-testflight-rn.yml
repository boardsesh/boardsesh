name: iOS TestFlight Deploy (React Native)

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - '.github/workflows/ios-testflight-rn.yml'
  workflow_dispatch:
    inputs:
      build_number_offset:
        description: 'Added to GH run_number for CFBundleVersion (raise to clear ASC collisions)'
        required: false
        default: '100000'

concurrency:
  group: ios-testflight-rn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    if: github.ref == 'refs/heads/main'
    # macos-26 = Xcode 26 + iOS 26 SDK, which App Store Connect now requires
    # for all uploads. Expo SDK 56 / RN 0.85 ships a fmt that compiles cleanly
    # under Xcode 26's strict C++20 constexpr evaluator.
    runs-on: macos-26
    timeout-minutes: 60
    # Scopes the job to the Production GitHub Environment so it can read the
    # Production-scoped SENTRY_AUTH_TOKEN secret. Mirrors production-deploy.yml;
    # the Production environment has a branch policy only (no approval gate).
    environment: Production

    env:
      WORKSPACE_PATH: packages/mobile/ios/Boardsesh.xcworkspace
      SCHEME: Boardsesh
      ARCHIVE_PATH: packages/mobile/ios/build/Boardsesh.xcarchive
      EXPORT_PATH: packages/mobile/ios/build/export
      EXPORT_OPTIONS_PLIST: packages/mobile/ExportOptions.plist
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ github.run_id }}
      EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
      EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
      EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      # NOTE: currently inert at runtime — the mobile app has no
      # @sentry/react-native wiring (no Sentry.init, no src/lib/sentry.ts), so this
      # DSN is not read by the running app; client-side errors go to PostHog only
      # (reportError → captureError). Kept so adding Sentry later needs no workflow
      # change. Same DSN/project as web + backend; not secret — already hardcoded
      # in packages/web and packages/backend source.
      EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
      # PostHog product analytics. Intentionally the SAME project token as web
      # (vars.NEXT_PUBLIC_POSTHOG_KEY) so a signed-in user's web + mobile activity
      # resolves to one person. EXPO_PUBLIC_* vars are inlined into the JS bundle at
      # build time; without this, analytics.ts sees no key and isAnalyticsEnabled is
      # false, so every track() silently no-ops (the app shipped zero events before).
      EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      # PostHog source-map upload. The posthog-react-native/expo plugin adds an
      # Xcode build phase that runs @posthog/cli during `xcodebuild archive` to
      # upload the Hermes bundle + source map, so the app's $exception stack traces
      # are readable in PostHog. These are NOT the same as EXPO_PUBLIC_POSTHOG_KEY
      # (that's the public ingest token; this is a personal API key + project id for
      # the CLI). The upload phase is gated in app.config.ts on POSTHOG_CLI_API_KEY:
      # when the secret is unset (forks, or before it's provisioned) the plugin is
      # omitted at prebuild, so the archive has no upload phase and still succeeds.
      # POSTHOG_CLI_HOST omitted (US cloud).
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node.js dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EOF

      - name: Expo prebuild (generate ios/)
        working-directory: packages/mobile
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: packages/mobile/ios/Pods
          key: ${{ runner.os }}-pods-rn-${{ hashFiles('packages/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-rn-

      - name: Install CocoaPods dependencies
        working-directory: packages/mobile/ios
        run: pod install

      - name: Compute build number
        id: build_number
        run: |
          offset=${{ github.event.inputs.build_number_offset || '100000' }}
          bn=$(( offset + ${{ github.run_number }} ))
          echo "value=$bn" >> "$GITHUB_OUTPUT"
          echo "Build number: $bn"

      - name: Resolve mobile app version
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const appConfig = fs.readFileSync('packages/mobile/app.config.ts', 'utf8');
          const versionMatch = appConfig.match(/\bversion:\s*['"]([^'"]+)['"]/);
          if (!versionMatch) {
            throw new Error('Could not find version in packages/mobile/app.config.ts');
          }

          const version = versionMatch[1];
          fs.appendFileSync(process.env.GITHUB_ENV, `BOARDSESH_MOBILE_VERSION=${version}\n`);
          NODE

      - name: Set build number
        working-directory: packages/mobile/ios
        run: |
          agvtool new-version -all ${{ steps.build_number.outputs.value }}

      - name: Import code signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/certificate.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 || secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          install_profile() {
            local secret_name="$1"
            local profile_label="$2"
            local profile_name_env="$3"
            local profile_bundle_id_env="$4"
            local expected_bundle_id="$5"
            local profile_base64="${!secret_name:-}"
            local profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"

            if [ -z "$profile_base64" ]; then
              echo "::error::Missing $secret_name for the $profile_label provisioning profile."
              exit 1
            fi

            mkdir -p "$profiles_dir"

            local profile_file="$RUNNER_TEMP/${profile_label}.mobileprovision"
            local plist_file="$RUNNER_TEMP/${profile_label}.plist"

            printf '%s' "$profile_base64" | base64 --decode > "$profile_file"
            if ! security cms -D -i "$profile_file" > "$plist_file"; then
              echo "::error::$secret_name did not decode to a valid .mobileprovision file."
              exit 1
            fi

            local profile_uuid
            local profile_name
            local application_identifier
            local bundle_id

            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$plist_file")
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$plist_file")
            application_identifier=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$plist_file")
            bundle_id="${application_identifier#*.}"

            if [ "$bundle_id" != "$expected_bundle_id" ]; then
              echo "::error::$profile_label profile is for $bundle_id, expected $expected_bundle_id."
              exit 1
            fi

            cp "$profile_file" "$profiles_dir/$profile_uuid.mobileprovision"
            {
              echo "$profile_name_env=$profile_name"
              echo "$profile_bundle_id_env=$bundle_id"
            } >> "$GITHUB_ENV"

            echo "Installed $profile_label provisioning profile: $profile_name ($bundle_id)"
          }

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          install_profile APP_PROFILE_BASE64 app IOS_APP_PROFILE_NAME IOS_APP_PROFILE_BUNDLE_ID com.boardsesh.app
          install_profile WIDGETS_PROFILE_BASE64 widgets IOS_WIDGETS_PROFILE_NAME IOS_WIDGETS_PROFILE_BUNDLE_ID com.boardsesh.app.widgets
          install_profile SHARE_EXTENSION_PROFILE_BASE64 share-extension IOS_SHARE_EXTENSION_PROFILE_NAME IOS_SHARE_EXTENSION_PROFILE_BUNDLE_ID com.boardsesh.app.share-extension

      - name: Configure per-target code signing
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('packages/mobile/ios/Boardsesh.xcodeproj')

          profiles = {
            'Boardsesh' => ENV.fetch('IOS_APP_PROFILE_NAME'),
            'BoardseshWidgets' => ENV.fetch('IOS_WIDGETS_PROFILE_NAME'),
            'BoardseshBeta' => ENV.fetch('IOS_SHARE_EXTENSION_PROFILE_NAME'),
          }

          configured_targets = []

          project.targets.each do |target|
            next unless profiles.key?(target.name)

            target.build_configurations.each do |config|
              next unless config.name == 'Release'

              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = '9L3HKPZBH3'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profiles[target.name]
            end

            configured_targets << target.name
          end

          missing_targets = profiles.keys - configured_targets
          unless missing_targets.empty?
            raise "Missing expected Xcode targets for signing: #{missing_targets.join(', ')}"
          end

          project.save
          puts 'Per-target code signing configured for: ' + configured_targets.join(', ')
          RUBY

      - name: Write export options
        run: |
          cat > "$EXPORT_OPTIONS_PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9L3HKPZBH3</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$IOS_APP_PROFILE_BUNDLE_ID</key>
                  <string>$IOS_APP_PROFILE_NAME</string>
                  <key>$IOS_WIDGETS_PROFILE_BUNDLE_ID</key>
                  <string>$IOS_WIDGETS_PROFILE_NAME</string>
                  <key>$IOS_SHARE_EXTENSION_PROFILE_BUNDLE_ID</key>
                  <string>$IOS_SHARE_EXTENSION_PROFILE_NAME</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_ID."
            exit 1
          fi

          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_BASE64."
            exit 1
          fi

          mkdir -p ~/.private_keys
          key_path="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"

          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 did not decode to an App Store Connect private key."
            exit 1
          fi

      # The @sentry/react-native build phases upload JS source maps + native
      # dSYMs during `xcodebuild archive`. Without a token the upload errors and
      # fails the archive (sentry-xcode.sh exits non-zero), so gate it: only
      # enable the upload when SENTRY_AUTH_TOKEN is present, otherwise skip it and
      # keep the build green. SENTRY_DISABLE_AUTO_UPLOAD is read by both phases.
      - name: Configure Sentry source map upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_DISABLE_AUTO_UPLOAD=false" >> "$GITHUB_ENV"
            echo "Sentry auth token present — source maps + dSYMs will upload."
          else
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry source map upload."
          fi

      - name: Archive
        env:
          # Consumed by the @sentry/react-native build phases (sentry-cli). The
          # SENTRY_DISABLE_AUTO_UPLOAD gate above (via $GITHUB_ENV) decides whether
          # the upload actually runs.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.value }} \
            DEVELOPMENT_TEAM=9L3HKPZBH3

      - name: Export archive (uploads to TestFlight)
        id: testflight_upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID."
            exit 1
          fi

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-rn-ios-${{ steps.build_number.outputs.value }}
          path: packages/mobile/ios/build/export/*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Notify deployments channel
        if: github.ref == 'refs/heads/main' && steps.testflight_upload.outcome == 'success'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '📱 **iOS RN TestFlight uploaded** on `%s`\n• version: %s\n• build: %s\n<%s>' \
            "${COMMIT_SHA:0:7}" "$BOARDSESH_MOBILE_VERSION" "$BUILD_NUMBER" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Notify deployments channel of failure
        if: github.ref == 'refs/heads/main' && failure()
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '🚨 **iOS RN TestFlight failed** on `%s`\n• version: %s\n• build: %s\n<%s>' \
            "${COMMIT_SHA:0:7}" "$BOARDSESH_MOBILE_VERSION" "$BUILD_NUMBER" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Clean up keychain and credentials
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          rm -f ~/.private_keys/AuthKey_*.p8 2>/dev/null || true
