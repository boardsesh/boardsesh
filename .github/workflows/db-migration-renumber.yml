name: DB Migration Renumber

# Rebases ONE pull request onto the current `main`, moves its Drizzle migration to
# the next free number, proves the result still applies against Postgres, and
# force-pushes. Fanned out by db-migration-renumber-dispatch.yml whenever a
# migration lands on main; also the manual re-run button:
#
#   gh workflow run db-migration-renumber.yml -f pr=3957
#
# ─── SECURITY — READ BEFORE EDITING ─────────────────────────────────────────────
# Dispatch-only, so it always runs the DEFAULT-BRANCH copy of this file and its
# gates cannot be edited from the PR it acts on (the property mobile-ota-preview.yml
# relies on for the same reason). NEVER add `pull_request` or `pull_request_target`.
#
# The `renumber` job runs PR-author code (`vp install` lifecycle scripts,
# `vp run build:db`, drizzle-kit loading the PR's schema, the PR's migrate script), so:
#   * SAME-REPO PRs only. The App is installed on this repo, so it could not push to
#     a fork anyway. The gate enforces it.
#   * It never runs on the default branch. A main run's Actions writes are shared
#     with every branch and PR, so a main run (the dispatcher's fan-out, a manual
#     `gh workflow run`) only vets the PR and hands off: `handoff` re-dispatches this
#     file on a throwaway `ci-sandbox/db-renumber/pr-<n>/<run id>` branch at the same
#     trusted commit (scripts/lib/ci-sandbox.cjs), and `sandbox-cleanup` deletes it.
#   * It holds NO secret. It hands the renumbered commits to `push` as a git bundle;
#     `push` runs on a fresh runner that executes no PR code, and is the only job
#     that mints the App token. `persist-credentials: false` everywhere, so no token
#     ever sits in .git/config.
#
# The App token (not GITHUB_TOKEN) has to do the push: a GITHUB_TOKEN push does not
# re-trigger workflows, so the renumbered commit would land with no CI at all.
# Labels and comments go the other way: the App also holds pull_requests: write, but
# its token stays confined to the push step, so GITHUB_TOKEN does those.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to renumber'
        required: true
      strategy:
        description: 'rebase (default) or merge'
        required: false
        default: rebase

permissions:
  contents: read
  pull-requests: read

concurrency:
  # NOT cancel-in-progress: being killed between the push and the comment would
  # leave a silently-renumbered PR. A queued second run finds no collision and
  # exits in seconds, so serializing is cheap.
  group: db-migration-renumber-${{ github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      handoff: ${{ steps.decide.outputs.handoff }}
      branch: ${{ steps.decide.outputs.branch }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      skip_reason: ${{ steps.decide.outputs.skip_reason }}
    steps:
      # Fail loudly, and before any work. Without this a missing App credential
      # surfaces only after the whole renumber and proof run, at the push, so the
      # dispatch fires, the gate passes, and stranded PRs wait 20 minutes for a
      # failure that was knowable up front. Failing here also stops the `comment` job,
      # which needs a successful gate — otherwise it would post a "renumbering was
      # held" comment blaming the PR for an operator misconfiguration. A red run is
      # the right signal for that.
      - name: Require the push credential
        if: vars.OTA_PUSH_APP_ID == ''
        run: |
          echo "::error::OTA_PUSH_APP_ID is not configured, so the renumbered branch could not be pushed."
          exit 1

      - name: Resolve and vet the PR
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const raw = String(context.payload.inputs.pr);
            // Defense in depth: this value reaches git refs and shell env.
            if (!/^[1-9][0-9]*$/.test(raw)) {
              core.setOutput('run', 'false');
              core.setOutput('skip_reason', 'pr input is not a number');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(raw),
            });
            const repoFull = `${context.repo.owner}/${context.repo.repo}`;
            const defaultBranch = context.payload.repository.default_branch;

            const reasons = [];
            if (pr.state !== 'open') reasons.push('PR is not open');
            if (pr.head.repo?.full_name !== repoFull) reasons.push('fork PR — cannot push to a fork');
            if (pr.base.ref !== defaultBranch) reasons.push(`PR targets ${pr.base.ref}, not ${defaultBranch}`);
            if (pr.head.ref === defaultBranch) reasons.push('head ref is the default branch');
            // The push App bypasses the release-train ruleset, so never point it at a
            // release branch (the release/next merge-back PR) or any ruleset-protected
            // head. An unreadable answer stops the run rather than guessing.
            if (pr.head.ref.startsWith('release/')) reasons.push('head ref is a release branch');
            let headRules;
            try {
              ({ data: headRules } = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                owner: context.repo.owner, repo: context.repo.repo, branch: pr.head.ref,
              }));
            } catch (error) {
              throw new Error(`Could not read the rules for ${pr.head.ref} (${error.status ?? error.message}); not renumbering.`);
            }
            if (!Array.isArray(headRules)) throw new Error(`Unreadable rules for ${pr.head.ref}; not renumbering.`);
            if (headRules.length > 0) reasons.push(`head ref ${pr.head.ref} is protected by a ruleset`);
            if (pr.labels.some((label) => label.name === 'renumber:skip')) reasons.push('opted out via renumber:skip');

            // PR code runs only on this PR's sandbox branch; a default-branch run
            // that vetted the PR hands off instead. Keep the prefix in step with
            // scripts/lib/ci-sandbox.cjs.
            const sandboxPrefix = `refs/heads/ci-sandbox/db-renumber/pr-${raw}/`;
            const onSandbox = context.ref.startsWith(sandboxPrefix) &&
              /^[1-9][0-9]*$/.test(context.ref.slice(sandboxPrefix.length));
            const vetted = reasons.length === 0;
            core.setOutput('run', vetted && onSandbox ? 'true' : 'false');
            core.setOutput('handoff', vetted && !onSandbox ? 'true' : 'false');
            core.setOutput('skip_reason', reasons.join('; '));
            core.setOutput('branch', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            if (reasons.length > 0) core.notice(`Skipping #${raw}: ${reasons.join('; ')}`);

  # ── A default-branch run never executes PR code. Re-dispatch this workflow on a
  # fresh sandbox branch at the same trusted commit; that run does the work.
  handoff:
    needs: gate
    if: needs.gate.outputs.handoff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out the sandbox helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/lib/ci-sandbox.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Hand the renumber to a sandbox branch
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr }}
          STRATEGY: ${{ github.event.inputs.strategy || 'rebase' }}
        with:
          script: |
            const { handOffToSandbox } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/ci-sandbox.cjs`);
            await handOffToSandbox({
              github, context, core,
              workflowKey: 'db-renumber',
              workflowFile: 'db-migration-renumber.yml',
              prNumber: process.env.PR_NUMBER,
              inputs: { pr: process.env.PR_NUMBER, strategy: process.env.STRATEGY },
              sha: context.sha,
            });

  # PR-author code runs here, on the sandbox branch only, with no secret in scope.
  renumber:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      renumber_status: ${{ steps.renumber.outputs.status }}
      comment_b64: ${{ steps.renumber.outputs.comment_b64 }}
      validation_outcome: ${{ steps.validate.outcome }}
      apply_outcome: ${{ steps.apply.outcome }}
      reapply_outcome: ${{ steps.reapply.outcome }}
      result_sha: ${{ steps.bundle.outputs.result_sha }}
    services:
      # The only viable verification target. A from-scratch `drizzle-kit migrate` on
      # a bare Postgres cannot work: 0000_*.sql ALTERs kilter_climbs/tension_climbs,
      # which pgloader creates in setup-development-db.sh before drizzle ever runs.
      # dev-db already has main's migrations applied, so this exercises exactly the
      # real case — apply the pending set on top of main. Same recipe as e2e-tests.yml.
      postgres:
        image: ghcr.io/boardsesh/boardsesh-dev-db@sha256:fa657078da26276b47ccb6f78f7227b6f6d84a1379bca9313cc1c5d9ece26139
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PR_NUMBER: ${{ github.event.inputs.pr }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      DATABASE_URL: postgresql://postgres:password@localhost:5432/main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.branch }}
          fetch-depth: 0
          # See the security note in the header — PR-author code runs in this job.
          persist-credentials: false

      - name: Assert we are on the branch the gate vetted
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA" \
            || { echo "::error::Branch moved between the gate and checkout."; exit 1; }
          test "$BRANCH" != "main"

      # Every PR in today's backlog was opened before this tooling existed, so their
      # branches have no `scripts/db-renumber-migration.ts` and no `db:renumber`
      # task. Run main's copy against the PR's checkout instead — the script imports
      # nothing but Node builtins and its own lib/ sibling, so it needs no install of
      # its own. Kept out of the workspace root would be tidier, but actions/checkout
      # requires a path inside it; the script stages explicitly rather than
      # `git add -A`, so this directory can never end up in the commit.
      - name: Check out the trusted renumber tooling
        uses: actions/checkout@v4
        with:
          # Pin tooling to the immutable commit whose workflow is executing.
          # A moving `main` ref could otherwise change the program mid-run.
          ref: ${{ github.workflow_sha }}
          path: .renumber-tooling
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Renumber onto main
        id: renumber
        run: |
          git config user.name 'boardsesh-repo-bot[bot]'
          git config user.email 'boardsesh-repo-bot[bot]@users.noreply.github.com'
          # `node --import tsx <file>` rather than `vp run db:renumber`: tsx comes from the
          # workspace install above, so main's pinned copy of the script runs without
          # a second install (and without going through this PR's task graph).
          node --import tsx .renumber-tooling/scripts/db-renumber-migration.ts \
            --repo "$GITHUB_WORKSPACE" \
            --strategy "${{ github.event.inputs.strategy || 'rebase' }}"

      - name: Validate the resulting migration folder
        id: validate
        if: steps.renumber.outputs.status == 'renumbered'
        run: |
          node --import tsx .renumber-tooling/scripts/check-db-migrations.ts \
            --repo "$GITHUB_WORKSPACE" --base origin/main

      # The real gate. Nothing in per-PR CI applies migrations today, so this is the
      # only thing between a bad renumber and main. VERIFY_MIGRATION_JOURNAL asserts
      # the journal tail actually landed — which is what catches a migration whose
      # `when` would make it silently skipped forever.
      - name: Bootstrap the isolated deletion cutoff helper
        if: steps.renumber.outputs.status == 'renumbered'
        env:
          SYNC_CUTOFF_ADMIN_DATABASE_URL: postgresql://postgres:password@localhost:5432/main
          SYNC_CUTOFF_DEVELOPMENT_BOOTSTRAP: 'true'
        run: |
          if [[ -f packages/db/scripts/bootstrap-sync-deletions-cutoff-development.ts ]]; then
            vp exec tsx packages/db/scripts/bootstrap-sync-deletions-cutoff-development.ts --apply
          fi
      - name: Verify the migrations apply
        id: apply
        if: steps.renumber.outputs.status == 'renumbered'
        env:
          VERIFY_MIGRATION_JOURNAL: '1'
        run: vp exec pnpm --filter @boardsesh/db run db:migrate

      - name: Verify re-applying is a no-op
        id: reapply
        if: steps.renumber.outputs.status == 'renumbered'
        run: vp exec pnpm --filter @boardsesh/db run db:migrate

      # The new commits sit on top of origin/main (rebase) or merge it with the
      # vetted head (merge); both are excluded so the bundle carries only them.
      - name: Bundle the renumbered branch
        id: bundle
        if: steps.renumber.outputs.status == 'renumbered'
        run: |
          git bundle create "$RUNNER_TEMP/renumbered.bundle" HEAD ^origin/main "^$HEAD_SHA"
          echo "result_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Hand the renumbered commits to the push job
        if: steps.renumber.outputs.status == 'renumbered'
        uses: actions/upload-artifact@v4
        with:
          name: renumbered-branch
          path: ${{ runner.temp }}/renumbered.bundle
          retention-days: 1
          if-no-files-found: error

  # Fresh runner: no PR code has run here, so the App token is minted only where
  # nothing PR-controlled can read it. The bundle and result SHA are PR-influenced
  # data; they can only ever land on the PR's own branch, leased to the vetted head.
  push:
    needs: [gate, renumber]
    if: >-
      needs.gate.outputs.run == 'true' &&
      needs.renumber.result == 'success' &&
      needs.renumber.outputs.renumber_status == 'renumbered'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      recheck_outcome: ${{ steps.recheck.outcome }}
      recheck_ok: ${{ steps.recheck.outputs.ok }}
      recheck_reason: ${{ steps.recheck.outputs.reason }}
      push_outcome: ${{ steps.push.outcome }}
    env:
      PR_NUMBER: ${{ github.event.inputs.pr }}
      BRANCH: ${{ needs.gate.outputs.branch }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      RESULT_SHA: ${{ needs.renumber.outputs.result_sha }}
    steps:
      - name: Check out history for the bundle's prerequisites
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the renumbered commits
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: renumbered-branch
          path: ${{ runner.temp }}/renumbered

      - name: Unbundle and verify the result
        run: |
          printf '%s' "$RESULT_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::The renumber job reported no result SHA."; exit 1; }
          git fetch --no-tags origin "$HEAD_SHA" main
          bundle="$RUNNER_TEMP/renumbered/renumbered.bundle"
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" "HEAD:refs/renumber/result"
          test "$(git rev-parse refs/renumber/result)" = "$RESULT_SHA" \
            || { echo "::error::The bundle does not carry the reported result."; exit 1; }

      # The renumber job ran PR code, so its result is checked against what a plain
      # merge of the vetted head onto the same main commit would give. Only the
      # migration folder may differ, plus files the PR itself changed (the script
      # rewrites references to the old migration tag there, and only there).
      - name: Refuse changes beyond the renumber
        run: |
          set -euo pipefail
          base="$(git merge-base "$RESULT_SHA" origin/main)"
          # Exit 1 means conflicts (usually the journal); the tree is still written, first line.
          merged="$(git merge-tree --write-tree --no-messages "$base" "$HEAD_SHA")" || [ $? -eq 1 ]
          expected="${merged%%$'\n'*}"
          printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::Could not compute the plain merge of $HEAD_SHA onto $base."; exit 1; }
          git diff --name-only "$(git merge-base "$HEAD_SHA" "$base")" "$HEAD_SHA" > "$RUNNER_TEMP/pr-files"
          git diff --name-only "$expected" "$RESULT_SHA" > "$RUNNER_TEMP/changed"
          # grep exits 1 for "nothing left", which is fine; any other failure stops the push.
          { grep -v '^packages/db/drizzle/' "$RUNNER_TEMP/changed" || [ $? -eq 1 ]; } > "$RUNNER_TEMP/outside"
          { grep -vxF -f "$RUNNER_TEMP/pr-files" "$RUNNER_TEMP/outside" || [ $? -eq 1 ]; } > "$RUNNER_TEMP/unexpected"
          if [ -s "$RUNNER_TEMP/unexpected" ]; then
            echo "::error::The renumbered result changes files outside the migration folder that this PR never touched:"
            cat "$RUNNER_TEMP/unexpected"
            exit 1
          fi

      - name: Re-check the PR immediately before pushing
        id: recheck
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const reasons = [];
            if (pr.state !== 'open') reasons.push(`The PR is ${pr.state}.`);
            if (pr.head.sha !== process.env.HEAD_SHA) {
              reasons.push(`The branch moved during the final re-check (head is now ${pr.head.sha}).`);
            }
            if (pr.labels.some((label) => label.name === 'renumber:skip')) {
              reasons.push('The `renumber:skip` label appeared during the final re-check.');
            }
            const ok = reasons.length === 0;
            core.setOutput('ok', String(ok));
            core.setOutput('reason', reasons.join(' '));
            if (!ok) core.warning(`#${process.env.PR_NUMBER}: ${reasons.join(' ')} Not pushing.`);

      - name: Mint the push token
        id: push_token
        if: steps.recheck.outputs.ok == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}

      - name: Force-push the renumbered branch
        id: push
        if: steps.recheck.outputs.ok == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.push_token.outputs.token }}
        run: |
          # Explicit expected-SHA lease. The bare `--force-with-lease` form leases
          # against refs/remotes/origin/<branch>, which any fetch during the run can
          # silently refresh out from under it; naming the SHA cannot be defeated
          # that way, so a contributor pushing mid-run aborts us instead of losing work.
          git push --force-with-lease="$BRANCH:$HEAD_SHA" \
            "https://x-access-token:${GH_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$RESULT_SHA:refs/heads/$BRANCH"

  # PR-controlled install/build/migration code ran in `renumber`. Never load a
  # helper from that writable runner inside a token-bearing action: a postinstall
  # could replace it. This fresh runner checks out only the immutable workflow
  # commit, then renders and upserts the sticky comment with the narrow PR token.
  comment:
    needs: [gate, renumber, push]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.run == 'true' &&
      needs.renumber.outputs.renumber_status != 'no-op'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.inputs.pr }}
    steps:
      - name: Check out trusted comment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/lib/db-renumber-comment.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Comment the outcome
        uses: actions/github-script@v7
        env:
          COMMENT_B64: ${{ needs.renumber.outputs.comment_b64 }}
          RENUMBER_STATUS: ${{ needs.renumber.outputs.renumber_status }}
          VALIDATION_OUTCOME: ${{ needs.renumber.outputs.validation_outcome }}
          APPLY_OUTCOME: ${{ needs.renumber.outputs.apply_outcome }}
          REAPPLY_OUTCOME: ${{ needs.renumber.outputs.reapply_outcome }}
          RECHECK_OUTCOME: ${{ needs.push.outputs.recheck_outcome }}
          RECHECK_OK: ${{ needs.push.outputs.recheck_ok }}
          RECHECK_REASON: ${{ needs.push.outputs.recheck_reason }}
          PUSH_OUTCOME: ${{ needs.push.outputs.push_outcome }}
        with:
          script: |
            // This dependency-free module comes from the immutable workflow
            // commit on a fresh runner that never executed PR-controlled code.
            // Take the sticky marker from it too — a second copy here would drift
            // and turn every upsert into a duplicate comment.
            const { STICKY_MARKER, renderRenumberWorkflowComment } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/lib/db-renumber-comment.cjs`,
            );
            const commentBody = process.env.COMMENT_B64
              ? Buffer.from(process.env.COMMENT_B64, 'base64').toString('utf8')
              : '';
            const body = renderRenumberWorkflowComment({
              renumberStatus: process.env.RENUMBER_STATUS,
              commentBody,
              validationOutcome: process.env.VALIDATION_OUTCOME,
              applyOutcome: process.env.APPLY_OUTCOME,
              reapplyOutcome: process.env.REAPPLY_OUTCOME,
              recheckOutcome: process.env.RECHECK_OUTCOME,
              recheckOk: process.env.RECHECK_OK,
              recheckReason: process.env.RECHECK_REASON,
              pushOutcome: process.env.PUSH_OUTCOME,
              context: {
                serverUrl: context.serverUrl,
                owner: context.repo.owner,
                repo: context.repo.repo,
                runId: context.runId,
              },
            });

            // Paginated: an unpaginated first-100 lookup would miss the marker on a
            // long PR and post a duplicate comment every run instead of updating.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: Number(process.env.PR_NUMBER), per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(STICKY_MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: Number(process.env.PR_NUMBER), body,
              });
            }

  # Remove this run's own sandbox branch. A no-op on any other ref; a sandbox
  # replaced while still pending is pruned by the next handoff for the same PR.
  sandbox-cleanup:
    needs: [gate, renumber, push, comment]
    if: always() && startsWith(github.ref, 'refs/heads/ci-sandbox/db-renumber/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the sandbox helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/lib/ci-sandbox.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Delete this run's sandbox branch
        uses: actions/github-script@v7
        with:
          script: |
            const { deleteOwnSandbox } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/ci-sandbox.cjs`);
            await deleteOwnSandbox({ github, context, core, workflowKey: 'db-renumber' });
