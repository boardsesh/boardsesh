name: iOS Board Placement Data

on:
  push:
    branches-ignore: [main]
    paths:
      - 'packages/board-constants/**'
      - 'mobile/ios/App/App/BoardPlacementData.swift'
      - 'vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ios-board-placement-data.yml'
  pull_request:
    paths:
      - 'packages/board-constants/**'
      - 'mobile/ios/App/App/BoardPlacementData.swift'
      - 'vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ios-board-placement-data.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          node-version: 'lts'
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated Swift board placement data
        run: vp run check:ios-board-placement-data
