name: Monitor release/next acceptance

# Trust is split across jobs: store credentials only run trusted main scripts;
# release commits are fingerprinted without credentials; the repository App token
# is minted only after the exact candidates and PR gates pass.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Evaluate and report without cutting anchors or merging'
        type: boolean
        default: true

concurrency:
  group: release-next-monitor
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_UPDATES_CHANNEL: production
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://boardsesh-board-snapshots.t3.tigrisfiles.io/board-snapshots/v1-gzip
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.target.outputs.active }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      release_sha: ${{ steps.target.outputs.release_sha }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Find the open release PR
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release%2Fnext" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$release_sha" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release/next does not exist; nothing to monitor."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          pr="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main -f "head=${owner}:release/next" \
            --jq '.[0] // empty')"
          pr_number="$(jq -r '.number // empty' <<<"$pr")"
          if [ -z "$pr_number" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release/next has no open PR to main; nothing to monitor."
            exit 0
          fi
          [ "$(jq -r '.base.ref' <<<"$pr")" = main ] && \
            [ "$(jq -r '.head.ref' <<<"$pr")" = release/next ] && \
            [ "$(jq -r '.head.sha' <<<"$pr")" = "$release_sha" ] && \
            [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY" ] && \
            [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY" ] || {
              echo '::error::Release PR is not the exact same-repository release/next → main PR.'
              exit 1
            }
          printf '%s' "$release_sha" | grep -qE '^[0-9a-f]{40}$' || { echo '::error::Invalid release SHA.'; exit 1; }
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main without credentials
        if: steps.target.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate release marketing version
        id: version
        if: steps.target.outputs.active == 'true'
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/release/next:refs/remotes/origin/release/next'
          test "$(git rev-parse origin/release/next)" = "${{ steps.target.outputs.release_sha }}" || {
            echo '::error::release/next moved while discovering the candidate.'
            exit 1
          }
          config="$(git show "origin/release/next:packages/mobile/app.config.ts")"
          version="$(sed -nE "s/.*version:[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" <<<"$config" | head -n 1)"
          printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo '::error::Invalid release marketing version.'; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

  accepted-builds:
    needs: discover
    if: needs.discover.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Native Release
    outputs:
      accepted_builds: ${{ steps.accepted.outputs.accepted_builds }}
      candidates_found: ${{ steps.candidate.outputs.candidates_found }}
      ios_tag: ${{ steps.candidate.outputs.ios_build_tag }}
      ios_sha: ${{ steps.candidate.outputs.ios_build_sha }}
      android_tag: ${{ steps.candidate.outputs.android_build_tag }}
      android_sha: ${{ steps.candidate.outputs.android_build_sha }}
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Query exact accepted store builds
        id: accepted
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bun scripts/mobile-auto-version-bump.ts

      - name: Select latest exact accepted build tags for this version
        id: candidate
        env:
          ACCEPTED_BUILDS: ${{ steps.accepted.outputs.accepted_builds }}
          CHECK_ONLY: 'true'
          CANDIDATE_ONLY: 'true'
          HEAD_VERSION: ${{ needs.discover.outputs.version }}
        run: bun scripts/mobile-cut-release-tags.ts

  compare-native-state:
    needs: [discover, accepted-builds]
    if: needs.accepted-builds.outputs.candidates_found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matches: ${{ steps.compare.outputs.matches }}
    steps:
      - name: Checkout release head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.release_sha }}
          path: release-head
          persist-credentials: false

      - name: Checkout accepted iOS build without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.accepted-builds.outputs.ios_sha }}
          path: ios-build
          persist-credentials: false

      - name: Checkout accepted Android build without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.accepted-builds.outputs.android_sha }}
          path: android-build
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install fingerprint dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          for tree in release-head ios-build android-build; do
            (cd "$tree" && bun install --frozen-lockfile --ignore-scripts)
          done

      - name: Write identical public build environment
        run: |
          set -euo pipefail
          for tree in release-head ios-build android-build; do
            cat > "$tree/packages/mobile/.env" <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF
          done

      - name: Compare native fingerprints with identical placeholder inputs
        id: compare
        env:
          # Equality is the signal; this deliberately is not the production key.
          GOOGLE_MAPS_API_KEY: boardsesh-release-monitor-placeholder
        run: |
          set -euo pipefail
          resolve() {
            local tree="$1"
            local platform="$2"
            local raw
            if [ "$platform" = ios ]; then
              raw="$(cd "$tree/packages/mobile" && env -u GOOGLE_MAPS_API_KEY bunx expo-updates runtimeversion:resolve --platform ios 2>/dev/null || true)"
            else
              raw="$(cd "$tree/packages/mobile" && bunx expo-updates runtimeversion:resolve --platform android 2>/dev/null || true)"
            fi
            jq -r '.runtimeVersion // empty' <<<"$raw"
          }
          compare_platform() {
            local platform="$1"
            local build_tree="$2"
            for attempt in 1 2 3; do
              head_fp="$(resolve release-head "$platform")"
              build_fp="$(resolve "$build_tree" "$platform")"
              if printf '%s' "$head_fp" | grep -qiE '^[0-9a-f]{8,}$' && [ "$head_fp" = "$build_fp" ]; then
                echo "::notice::$platform native state matches on attempt $attempt (${head_fp:0:12})."
                return 0
              fi
            done
            return 1
          }
          matches=true
          compare_platform ios ios-build || matches=false
          compare_platform android android-build || matches=false
          echo "matches=$matches" >> "$GITHUB_OUTPUT"
          if [ "$matches" != true ]; then
            echo "::notice::Accepted builds do not yet match release/next native state."
          fi

  promote:
    needs: [discover, accepted-builds, compare-native-state]
    if: needs.compare-native-state.outputs.matches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Native Release
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Check release PR merge gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.discover.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/next:refs/remotes/origin/release/next'
          if ! git merge-base --is-ancestor origin/main "$EXPECTED_HEAD_SHA"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release/next is not current with main; waiting for branch sync."
            exit 0
          fi
          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){state isDraft headRefName baseRefName headRepository{nameWithOwner} baseRepository{nameWithOwner} headRefOid mergeable reviewDecision commits(last:1){nodes{commit{statusCheckRollup{contexts(first:100){pageInfo{hasNextPage} nodes{__typename ... on CheckRun{status conclusion} ... on StatusContext{state}}}}}}}}}}'
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pr="$(gh api graphql -f query="$query" -f owner="$owner" -f repo="$repo" -F number="$PR_NUMBER")"
          state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr")"
          draft="$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr")"
          head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr")"
          mergeable="$(jq -r '.data.repository.pullRequest.mergeable' <<<"$pr")"
          review="$(jq -r '.data.repository.pullRequest.reviewDecision // ""' <<<"$pr")"
          checks_green="$(jq -r '
            [.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[] |
              if .__typename == "CheckRun" then
                (.status == "COMPLETED" and (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED"))
              else .state == "SUCCESS" end] as $checks |
            (.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.pageInfo.hasNextPage == false and
             ($checks | length) > 0 and ($checks | all))' <<<"$pr")"
          refs_valid="$(jq -r --arg repo "$GITHUB_REPOSITORY" '
            .data.repository.pullRequest |
            (.headRefName == "release/next" and .baseRefName == "main" and
             .headRepository.nameWithOwner == $repo and .baseRepository.nameWithOwner == $repo)' <<<"$pr")"
          if [ "$state" = OPEN ] && [ "$draft" = false ] && [ "$head" = "$EXPECTED_HEAD_SHA" ] && \
             [ "$mergeable" = MERGEABLE ] && [ "$review" = APPROVED ] && [ "$checks_green" = true ] && [ "$refs_valid" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Waiting for PR gates: state=$state draft=$draft head=$head mergeable=$mergeable review=$review checks_green=$checks_green"
          fi

      - name: Mint repository App token
        id: app_token
        if: >-
          steps.gates.outputs.ready == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Cut exact accepted release anchors
        if: steps.app_token.outcome == 'success'
        env:
          ACCEPTED_BUILDS: ${{ needs.accepted-builds.outputs.accepted_builds }}
          GH_APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          DRY_RUN=false bun scripts/mobile-cut-release-tags.ts

      - name: Recheck refs and merge the exact accepted release head
        id: merge
        if: steps.app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.discover.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/next:refs/remotes/origin/release/next'
          test "$(git rev-parse origin/release/next)" = "$EXPECTED_HEAD_SHA" || {
            echo '::error::release/next moved before merge.'
            exit 1
          }
          git merge-base --is-ancestor origin/main "$EXPECTED_HEAD_SHA" || {
            echo '::error::main moved before merge; waiting for the next rebase.'
            exit 1
          }
          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){state isDraft headRefName baseRefName headRepository{nameWithOwner} baseRepository{nameWithOwner} headRefOid mergeable reviewDecision commits(last:1){nodes{commit{statusCheckRollup{contexts(first:100){pageInfo{hasNextPage} nodes{__typename ... on CheckRun{status conclusion} ... on StatusContext{state}}}}}}}}}}'
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pr="$(gh api graphql -f query="$query" -f owner="$owner" -f repo="$repo" -F number="$PR_NUMBER")"
          checks_green="$(jq -r '
            [.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[] |
              if .__typename == "CheckRun" then
                (.status == "COMPLETED" and (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED"))
              else .state == "SUCCESS" end] as $checks |
            (.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.pageInfo.hasNextPage == false and
             ($checks | length) > 0 and ($checks | all))' <<<"$pr")"
          test "$(jq -r '.data.repository.pullRequest.state' <<<"$pr")" = OPEN
          test "$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr")" = false
          test "$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.data.repository.pullRequest.mergeable' <<<"$pr")" = MERGEABLE
          test "$(jq -r '.data.repository.pullRequest.reviewDecision' <<<"$pr")" = APPROVED
          test "$(jq -r --arg repo "$GITHUB_REPOSITORY" '
            .data.repository.pullRequest |
            (.headRefName == "release/next" and .baseRefName == "main" and
             .headRepository.nameWithOwner == $repo and .baseRepository.nameWithOwner == $repo)' <<<"$pr")" = true
          test "$checks_green" = true
          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge -f sha="$EXPECTED_HEAD_SHA")"
          jq -e '.merged == true' <<<"$result" >/dev/null

      - name: Notify deployments channel of release merge
        if: steps.merge.outcome == 'success'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          IOS_TAG: ${{ needs.accepted-builds.outputs.ios_tag }}
          ANDROID_TAG: ${{ needs.accepted-builds.outputs.android_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_DEPLOY_WEBHOOK" ] || exit 0
          content="$(printf '✅ **Native release accepted and merged**\n• PR: #%s\n• iOS: `%s`\n• Android: `%s`\n<%s>' \
            "$PR_NUMBER" "$IOS_TAG" "$ANDROID_TAG" "$RUN_URL")"
          jq -n --arg content "$content" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Notify deployments channel of monitor failure
        if: failure()
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_DEPLOY_WEBHOOK" ] || exit 0
          content="$(printf '🚨 **release/next acceptance monitor failed**\n• PR: #%s\n<%s>' "$PR_NUMBER" "$RUN_URL")"
          jq -n --arg content "$content" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"
