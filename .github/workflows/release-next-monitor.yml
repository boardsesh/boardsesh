name: Monitor release/next acceptance

# Trust is split across jobs: store credentials only run trusted main scripts;
# release commits receive only the Maps key needed to reproduce Android's native
# fingerprint; the repository App token is minted only after the exact candidates
# and PR gates pass.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Evaluate and report without cutting anchors or merging'
        type: boolean
        default: true

concurrency:
  group: release-next-monitor
  cancel-in-progress: false

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_UPDATES_CHANNEL: production
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://boardsesh-board-snapshots.t3.tigrisfiles.io/board-snapshots/v1-gzip
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.target.outputs.active }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      release_sha: ${{ steps.target.outputs.release_sha }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Find the open release PR
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release%2Fnext" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$release_sha" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release/next does not exist; nothing to monitor."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          pr="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main -f "head=${owner}:release/next" \
            --jq '.[0] // empty')"
          pr_number="$(jq -r '.number // empty' <<<"$pr")"
          if [ -z "$pr_number" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release/next has no open PR to main; nothing to monitor."
            exit 0
          fi
          [ "$(jq -r '.base.ref' <<<"$pr")" = main ] && \
            [ "$(jq -r '.head.ref' <<<"$pr")" = release/next ] && \
            [ "$(jq -r '.head.sha' <<<"$pr")" = "$release_sha" ] && \
            [ "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY" ] && \
            [ "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY" ] || {
              echo '::error::Release PR is not the exact same-repository release/next → main PR.'
              exit 1
            }
          printf '%s' "$release_sha" | grep -qE '^[0-9a-f]{40}$' || { echo '::error::Invalid release SHA.'; exit 1; }
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main without credentials
        if: steps.target.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate release marketing version
        id: version
        if: steps.target.outputs.active == 'true'
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/release/next:refs/remotes/origin/release/next'
          test "$(git rev-parse origin/release/next)" = "${{ steps.target.outputs.release_sha }}" || {
            echo '::error::release/next moved while discovering the candidate.'
            exit 1
          }
          config="$(git show "origin/release/next:packages/mobile/app.config.ts")"
          version="$(sed -nE "s/.*version:[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" <<<"$config" | head -n 1)"
          printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo '::error::Invalid release marketing version.'; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

  accepted-builds:
    needs: discover
    if: needs.discover.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Native Release
    outputs:
      accepted_builds: ${{ steps.accepted.outputs.accepted_builds }}
      candidates_found: ${{ steps.candidate.outputs.candidates_found }}
      ios_tag: ${{ steps.candidate.outputs.ios_build_tag }}
      ios_sha: ${{ steps.candidate.outputs.ios_build_sha }}
      android_tag: ${{ steps.candidate.outputs.android_build_tag }}
      android_sha: ${{ steps.candidate.outputs.android_build_sha }}
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install trusted release tooling
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Query exact accepted store builds
        id: accepted
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node --import tsx scripts/mobile-auto-version-bump.ts

      - name: Select latest exact accepted build tags for this version
        id: candidate
        env:
          ACCEPTED_BUILDS: ${{ steps.accepted.outputs.accepted_builds }}
          CHECK_ONLY: 'true'
          CANDIDATE_ONLY: 'true'
          HEAD_VERSION: ${{ needs.discover.outputs.version }}
        run: node --import tsx scripts/mobile-cut-release-tags.ts

  compare-native-state:
    needs: [discover, accepted-builds]
    if: needs.accepted-builds.outputs.candidates_found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Native Release
    outputs:
      matches: ${{ steps.compare.outputs.matches }}
    steps:
      - name: Checkout release head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.release_sha }}
          path: release-head
          persist-credentials: false

      - name: Checkout accepted iOS build without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.accepted-builds.outputs.ios_sha }}
          path: ios-build
          persist-credentials: false

      - name: Checkout accepted Android build without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.accepted-builds.outputs.android_sha }}
          path: android-build
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install fingerprint dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          for tree in release-head ios-build android-build; do
            (cd "$tree" && vp install --frozen-lockfile --ignore-scripts)
          done

      - name: Write identical public build environment
        run: |
          set -euo pipefail
          for tree in release-head ios-build android-build; do
            cat > "$tree/packages/mobile/.env" <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF
          done

      - name: Compare native fingerprints with build-time inputs and immutable tags
        id: compare
        env:
          # This is the only Native Release secret exposed to release-tree code.
          # It is required to reproduce the fingerprint embedded in Android.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          EXPECTED_IOS_TAG: ${{ needs.accepted-builds.outputs.ios_tag }}
          EXPECTED_ANDROID_TAG: ${{ needs.accepted-builds.outputs.android_tag }}
        run: |
          set -euo pipefail
          [ -n "${GOOGLE_MAPS_API_KEY:-}" ] || {
            echo '::error::Missing GOOGLE_MAPS_API_KEY; Android fingerprint verification cannot reproduce the uploaded binary.'
            exit 1
          }
          resolve() {
            local tree="$1"
            local platform="$2"
            local raw
            if [ "$platform" = ios ]; then
              raw="$(cd "$tree/packages/mobile" && env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform ios 2>/dev/null || true)"
            else
              raw="$(cd "$tree/packages/mobile" && vp exec expo-updates runtimeversion:resolve --platform android 2>/dev/null || true)"
            fi
            jq -r '.runtimeVersion // empty' <<<"$raw"
          }
          compare_platform() {
            local platform="$1"
            local build_tree="$2"
            local build_tag="$3"
            local tagged_fp
            local head_fp=''
            local build_fp=''
            tagged_fp="$(sed -nE "s/^build-${platform}-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-([0-9a-f]{12})$/\1/p" <<<"$build_tag")"
            if [ -z "$tagged_fp" ]; then
              echo "::error::Invalid $platform build tag while comparing native state: $build_tag"
              return 1
            fi
            for attempt in 1 2 3; do
              head_fp="$(resolve release-head "$platform" | tr '[:upper:]' '[:lower:]')"
              build_fp="$(resolve "$build_tree" "$platform" | tr '[:upper:]' '[:lower:]')"
              if printf '%s' "$head_fp" | grep -qE '^[0-9a-f]{12,}$' && \
                 printf '%s' "$build_fp" | grep -qE '^[0-9a-f]{12,}$' && \
                 [ "$head_fp" = "$build_fp" ] && \
                 [ "${head_fp:0:12}" = "$tagged_fp" ] && \
                 [ "${build_fp:0:12}" = "$tagged_fp" ]; then
                echo "::notice::$platform native state matches immutable build tag fingerprint $tagged_fp on attempt $attempt."
                return 0
              fi
            done
            printf '%s' "$head_fp" | grep -qE '^[0-9a-f]{12,}$' || head_fp='<unresolved>'
            printf '%s' "$build_fp" | grep -qE '^[0-9a-f]{12,}$' || build_fp='<unresolved>'
            echo "::notice::$platform native state mismatch: release_head=$head_fp accepted_build=$build_fp build_tag_fingerprint=$tagged_fp"
            return 1
          }
          matches=true
          compare_platform ios ios-build "$EXPECTED_IOS_TAG" || matches=false
          compare_platform android android-build "$EXPECTED_ANDROID_TAG" || matches=false
          echo "matches=$matches" >> "$GITHUB_OUTPUT"
          if [ "$matches" != true ]; then
            echo "::notice::Accepted builds do not yet match release/next native state."
          fi

  promote:
    needs: [discover, accepted-builds, compare-native-state]
    if: needs.compare-native-state.outputs.matches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Native Release
    steps:
      - name: Checkout trusted main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install trusted release tooling
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Check release PR merge gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.discover.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/next:refs/remotes/origin/release/next'
          if ! git merge-base --is-ancestor origin/main "$EXPECTED_HEAD_SHA"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::release/next is not current with main; waiting for branch sync."
            exit 0
          fi
          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){state isDraft headRefName baseRefName headRepository{nameWithOwner} baseRepository{nameWithOwner} headRefOid mergeable reviewDecision commits(last:1){nodes{commit{statusCheckRollup{contexts(first:100){pageInfo{hasNextPage} nodes{__typename ... on CheckRun{status conclusion} ... on StatusContext{state}}}}}}}}}}'
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pr="$(gh api graphql -f query="$query" -f owner="$owner" -f repo="$repo" -F number="$PR_NUMBER")"
          state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr")"
          draft="$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr")"
          head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr")"
          mergeable="$(jq -r '.data.repository.pullRequest.mergeable' <<<"$pr")"
          review="$(jq -r '.data.repository.pullRequest.reviewDecision // ""' <<<"$pr")"
          checks_missing="$(jq -r '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup == null' <<<"$pr")"
          checks_green="$(jq -r '
            .data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup as $rollup |
            if $rollup == null then false else
              [$rollup.contexts.nodes[] |
                if .__typename == "CheckRun" then
                  (.status == "COMPLETED" and (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED"))
                else .state == "SUCCESS" end] as $checks |
              ($rollup.contexts.pageInfo.hasNextPage == false and ($checks | length) > 0 and ($checks | all))
            end' <<<"$pr")"
          checks_paginated="$(jq -r '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.pageInfo.hasNextPage // false' <<<"$pr")"
          if [ "$checks_missing" = true ]; then
            echo '::warning::Release PR has no status-check rollup yet; merge readiness fails closed.'
          fi
          if [ "$checks_paginated" = true ]; then
            echo '::warning::Release PR has more than 100 status checks; merge readiness fails closed until pagination is implemented.'
          fi
          refs_valid="$(jq -r --arg repo "$GITHUB_REPOSITORY" '
            .data.repository.pullRequest |
            (.headRefName == "release/next" and .baseRefName == "main" and
             .headRepository.nameWithOwner == $repo and .baseRepository.nameWithOwner == $repo)' <<<"$pr")"
          if [ "$state" = OPEN ] && [ "$draft" = false ] && [ "$head" = "$EXPECTED_HEAD_SHA" ] && \
             [ "$mergeable" = MERGEABLE ] && [ "$review" = APPROVED ] && [ "$checks_green" = true ] && [ "$refs_valid" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Waiting for PR gates: state=$state draft=$draft head=$head mergeable=$mergeable review=$review checks_green=$checks_green"
          fi

      - name: Mint repository App token
        id: app_token
        if: >-
          steps.gates.outputs.ready == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Revalidate, cut recoverable anchors, and merge the exact release head
        id: merge
        if: steps.app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GATE_READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.discover.outputs.release_sha }}
          HEAD_VERSION: ${{ needs.discover.outputs.version }}
          EXPECTED_IOS_TAG: ${{ needs.accepted-builds.outputs.ios_tag }}
          EXPECTED_IOS_SHA: ${{ needs.accepted-builds.outputs.ios_sha }}
          EXPECTED_ANDROID_TAG: ${{ needs.accepted-builds.outputs.android_tag }}
          EXPECTED_ANDROID_SHA: ${{ needs.accepted-builds.outputs.android_sha }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          clear_git_auth() {
            git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
          }
          configure_git_auth() {
            local encoded_auth
            encoded_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            clear_git_auth
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $encoded_auth"
          }
          authenticated_push() {
            local push_status
            configure_git_auth
            set +e
            git push "$@"
            push_status=$?
            set -e
            clear_git_auth
            return "$push_status"
          }
          trap clear_git_auth EXIT

          # Re-query both stores before creating any release anchor. A changed
          # acceptance decision or highest build tag aborts without side effects.
          accepted_result="$RUNNER_TEMP/final-accepted-builds"
          candidate_result="$RUNNER_TEMP/final-release-candidates"
          : > "$accepted_result"
          : > "$candidate_result"
          GITHUB_OUTPUT="$accepted_result" node --import tsx scripts/mobile-auto-version-bump.ts
          accepted_builds="$(sed -n 's/^accepted_builds=//p' "$accepted_result" | tail -n 1)"
          [ -n "$accepted_builds" ] || {
            echo '::error::The final store query returned no accepted-build output.'
            exit 1
          }
          git fetch --force --tags origin
          ACCEPTED_BUILDS="$accepted_builds" CHECK_ONLY=true CANDIDATE_ONLY=true HEAD_VERSION="$HEAD_VERSION" \
            GITHUB_OUTPUT="$candidate_result" node --import tsx scripts/mobile-cut-release-tags.ts
          output_value() {
            sed -n "s/^$1=//p" "$candidate_result" | tail -n 1
          }
          [ "$(output_value candidates_found)" = true ] && \
            [ "$(output_value ios_build_tag)" = "$EXPECTED_IOS_TAG" ] && \
            [ "$(output_value ios_build_sha)" = "$EXPECTED_IOS_SHA" ] && \
            [ "$(output_value android_build_tag)" = "$EXPECTED_ANDROID_TAG" ] && \
            [ "$(output_value android_build_sha)" = "$EXPECTED_ANDROID_SHA" ] || {
              echo '::error::Accepted store builds or their exact build tags moved before merge; waiting for the next monitor run.'
              exit 1
            }

          if [[ "$EXPECTED_IOS_TAG" =~ ^build-ios-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+-([0-9a-f]{12})$ ]] && \
             [ "${BASH_REMATCH[1]}" = "$HEAD_VERSION" ]; then
            ios_short_fp="${BASH_REMATCH[2]}"
          else
            echo '::error::The selected iOS build tag is malformed or has the wrong version.'
            exit 1
          fi
          if [[ "$EXPECTED_ANDROID_TAG" =~ ^build-android-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+-([0-9a-f]{12})$ ]] && \
             [ "${BASH_REMATCH[1]}" = "$HEAD_VERSION" ]; then
            android_short_fp="${BASH_REMATCH[2]}"
          else
            echo '::error::The selected Android build tag is malformed or has the wrong version.'
            exit 1
          fi
          assert_tag_target() {
            local tag="$1"
            local expected="$2"
            local actual
            actual="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$tag points to ${actual:-<missing>}, expected $expected."
              return 1
            fi
          }
          assert_tag_target "$EXPECTED_IOS_TAG" "$EXPECTED_IOS_SHA"
          assert_tag_target "$EXPECTED_ANDROID_TAG" "$EXPECTED_ANDROID_SHA"

          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/next:refs/remotes/origin/release/next'
          test "$(git rev-parse origin/release/next)" = "$EXPECTED_HEAD_SHA" || {
            echo '::error::release/next moved before merge.'
            exit 1
          }
          git merge-base --is-ancestor origin/main "$EXPECTED_HEAD_SHA" || {
            echo '::error::main moved before merge; waiting for the next rebase.'
            exit 1
          }
          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){state isDraft headRefName baseRefName headRepository{nameWithOwner} baseRepository{nameWithOwner} headRefOid mergeable reviewDecision commits(last:1){nodes{commit{statusCheckRollup{contexts(first:100){pageInfo{hasNextPage} nodes{__typename ... on CheckRun{status conclusion} ... on StatusContext{state}}}}}}}}}}'
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pr="$(GH_TOKEN="$GATE_READ_TOKEN" gh api graphql -f query="$query" -f owner="$owner" -f repo="$repo" -F number="$PR_NUMBER")"
          checks_missing="$(jq -r '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup == null' <<<"$pr")"
          checks_green="$(jq -r '
            .data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup as $rollup |
            if $rollup == null then false else
              [$rollup.contexts.nodes[] |
                if .__typename == "CheckRun" then
                  (.status == "COMPLETED" and (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED"))
                else .state == "SUCCESS" end] as $checks |
              ($rollup.contexts.pageInfo.hasNextPage == false and ($checks | length) > 0 and ($checks | all))
            end' <<<"$pr")"
          checks_paginated="$(jq -r '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.pageInfo.hasNextPage // false' <<<"$pr")"
          if [ "$checks_missing" = true ]; then
            echo '::warning::Release PR has no status-check rollup yet; merge readiness fails closed.'
          fi
          if [ "$checks_paginated" = true ]; then
            echo '::warning::Release PR has more than 100 status checks; merge readiness fails closed until pagination is implemented.'
          fi
          test "$(jq -r '.data.repository.pullRequest.state' <<<"$pr")" = OPEN
          test "$(jq -r '.data.repository.pullRequest.isDraft' <<<"$pr")" = false
          test "$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.data.repository.pullRequest.mergeable' <<<"$pr")" = MERGEABLE
          test "$(jq -r '.data.repository.pullRequest.reviewDecision' <<<"$pr")" = APPROVED
          test "$(jq -r --arg repo "$GITHUB_REPOSITORY" '
            .data.repository.pullRequest |
            (.headRefName == "release/next" and .baseRefName == "main" and
             .headRepository.nameWithOwner == $repo and .baseRepository.nameWithOwner == $repo)' <<<"$pr")" = true
          test "$checks_green" = true

          ios_anchor="release/ios-v${HEAD_VERSION}-${ios_short_fp}"
          android_anchor="release/android-v${HEAD_VERSION}-${android_short_fp}"
          remote_tag_target() {
            local tag="$1"
            git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | \
              awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" \
                '$2 == direct { direct_sha = $1 } $2 == peeled { peeled_sha = $1 } END { print peeled_sha ? peeled_sha : direct_sha }'
          }
          assert_remote_tag_target() {
            local tag="$1"
            local expected="$2"
            local actual
            actual="$(remote_tag_target "$tag")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$tag points to ${actual:-<missing>} on the remote, expected $expected."
              return 1
            fi
          }
          ios_anchor_before="$(remote_tag_target "$ios_anchor")"
          android_anchor_before="$(remote_tag_target "$android_anchor")"
          [ -z "$ios_anchor_before" ] || [ "$ios_anchor_before" = "$EXPECTED_IOS_SHA" ] || {
            echo "::error::$ios_anchor already points to $ios_anchor_before, expected $EXPECTED_IOS_SHA."
            exit 1
          }
          [ -z "$android_anchor_before" ] || [ "$android_anchor_before" = "$EXPECTED_ANDROID_SHA" ] || {
            echo "::error::$android_anchor already points to $android_anchor_before, expected $EXPECTED_ANDROID_SHA."
            exit 1
          }
          ios_build_number="$(sed -nE 's/^build-ios-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)-[0-9a-f]{12}$/\1/p' <<<"$EXPECTED_IOS_TAG")"
          android_build_number="$(sed -nE 's/^build-android-v[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)-[0-9a-f]{12}$/\1/p' <<<"$EXPECTED_ANDROID_TAG")"
          selected_accepted_builds="$(jq -ce \
            --arg version "$HEAD_VERSION" \
            --argjson ios_build "$ios_build_number" \
            --argjson android_build "$android_build_number" '
              [
                (.[] | select(.platform == "ios" and .versionString == $version and .buildNumber == $ios_build)),
                (.[] | select(.platform == "android" and .buildNumber == $android_build))
              ] | if length == 2 then . else error("selected exact accepted builds are missing") end
            ' <<<"$accepted_builds")"

          cleanup_new_anchors() {
            local cleanup_failed=false
            cleanup_anchor() {
              local tag="$1"
              local expected="$2"
              local current
              grep -Fxq "created_anchor=$tag" "$anchor_result" || return 0
              if ! current="$(remote_tag_target "$tag")"; then
                echo "::warning::Could not resolve $tag before cleanup."
                return 1
              fi
              [ -n "$current" ] || return 0
              if [ "$current" != "$expected" ]; then
                echo "::warning::Refusing to delete $tag because it moved to $current."
                return 1
              fi
              authenticated_push --force-with-lease="refs/tags/${tag}:${expected}" origin ":refs/tags/${tag}"
            }
            cleanup_anchor "$ios_anchor" "$EXPECTED_IOS_SHA" || cleanup_failed=true
            cleanup_anchor "$android_anchor" "$EXPECTED_ANDROID_SHA" || cleanup_failed=true
            [ "$cleanup_failed" = false ]
          }

          anchor_result="$RUNNER_TEMP/final-anchor-cut"
          : > "$anchor_result"
          configure_git_auth
          set +e
          ACCEPTED_BUILDS="$selected_accepted_builds" GITHUB_OUTPUT="$anchor_result" \
            DRY_RUN=false node --import tsx scripts/mobile-cut-release-tags.ts
          anchor_status=$?
          set -e
          clear_git_auth
          if [ "$anchor_status" -ne 0 ]; then
            cleanup_new_anchors || echo '::warning::Failed to clean up an anchor after anchor creation failed.'
            exit "$anchor_status"
          fi
          if ! assert_remote_tag_target "$ios_anchor" "$EXPECTED_IOS_SHA" || \
             ! assert_remote_tag_target "$android_anchor" "$EXPECTED_ANDROID_SHA"; then
            cleanup_new_anchors || echo '::warning::Failed to clean up an incomplete anchor set.'
            exit 1
          fi

          # The App can bypass main protection, so anchor creation must not leave
          # a stale approval/check snapshot as the final merge gate. Re-fetch and
          # re-query every gate immediately before the REST merge; roll back only
          # anchors created by this run if anything changed.
          final_merge_gates_ready() {
            git fetch origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              '+refs/heads/release/next:refs/remotes/origin/release/next' || return 1
            [ "$(git rev-parse origin/release/next)" = "$EXPECTED_HEAD_SHA" ] || return 1
            git merge-base --is-ancestor origin/main "$EXPECTED_HEAD_SHA" || return 1

            local final_pr
            local final_checks_missing
            local final_checks_green
            local final_checks_paginated
            local final_refs_valid
            final_pr="$(GH_TOKEN="$GATE_READ_TOKEN" gh api graphql -f query="$query" -f owner="$owner" -f repo="$repo" -F number="$PR_NUMBER")" || return 1
            final_checks_missing="$(jq -r '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup == null' <<<"$final_pr")" || return 1
            final_checks_green="$(jq -r '
              .data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup as $rollup |
              if $rollup == null then false else
                [$rollup.contexts.nodes[] |
                  if .__typename == "CheckRun" then
                    (.status == "COMPLETED" and (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED"))
                  else .state == "SUCCESS" end] as $checks |
                ($rollup.contexts.pageInfo.hasNextPage == false and ($checks | length) > 0 and ($checks | all))
              end' <<<"$final_pr")" || return 1
            final_checks_paginated="$(jq -r '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.pageInfo.hasNextPage // false' <<<"$final_pr")" || return 1
            if [ "$final_checks_missing" = true ]; then
              echo '::warning::Release PR has no status-check rollup yet; merge readiness fails closed.'
              return 1
            fi
            if [ "$final_checks_paginated" = true ]; then
              echo '::warning::Release PR has more than 100 status checks; merge readiness fails closed until pagination is implemented.'
              return 1
            fi
            final_refs_valid="$(jq -r --arg repo "$GITHUB_REPOSITORY" '
              .data.repository.pullRequest |
              (.headRefName == "release/next" and .baseRefName == "main" and
               .headRepository.nameWithOwner == $repo and .baseRepository.nameWithOwner == $repo)' <<<"$final_pr")" || return 1
            [ "$(jq -r '.data.repository.pullRequest.state' <<<"$final_pr")" = OPEN ] &&
              [ "$(jq -r '.data.repository.pullRequest.isDraft' <<<"$final_pr")" = false ] &&
              [ "$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$final_pr")" = "$EXPECTED_HEAD_SHA" ] &&
              [ "$(jq -r '.data.repository.pullRequest.mergeable' <<<"$final_pr")" = MERGEABLE ] &&
              [ "$(jq -r '.data.repository.pullRequest.reviewDecision' <<<"$final_pr")" = APPROVED ] &&
              [ "$final_checks_green" = true ] && [ "$final_refs_valid" = true ]
          }
          if ! final_merge_gates_ready; then
            cleanup_new_anchors || echo '::warning::Failed to clean up one or more newly-created release anchors.'
            echo '::error::Release refs, approval, checks, or mergeability changed after anchor creation; merge stopped.'
            exit 1
          fi

          set +e
          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge -f sha="$EXPECTED_HEAD_SHA" 2>"$RUNNER_TEMP/release-merge-error")"
          merge_status=$?
          set -e
          if [ "$merge_status" -eq 0 ] && jq -e '.merged == true' <<<"$result" >/dev/null 2>&1; then
            exit 0
          fi

          # Resolve a failed/ambiguous API response before considering cleanup.
          # If GitHub cannot confirm the PR is still unmerged, retain anchors.
          set +e
          current_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null)"
          current_pr_status=$?
          set -e
          exact_merged=false
          if [ "$current_pr_status" -eq 0 ]; then
            exact_merged="$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_HEAD_SHA" '
              (.merged == true and .head.sha == $sha and .head.ref == "release/next" and .base.ref == "main" and
               .head.repo.full_name == $repo and .base.repo.full_name == $repo)' <<<"$current_pr")"
          fi
          if [ "$exact_merged" = true ]; then
            echo '::notice::The release PR merged despite an ambiguous merge API response.'
            exit 0
          fi
          exact_unmerged=false
          if [ "$current_pr_status" -eq 0 ]; then
            exact_unmerged="$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_HEAD_SHA" '
              (.merged == false and .head.sha == $sha and .head.ref == "release/next" and .base.ref == "main" and
               .head.repo.full_name == $repo and .base.repo.full_name == $repo)' <<<"$current_pr")"
          fi
          if [ "$exact_unmerged" = true ]; then
            if cleanup_new_anchors; then
              echo '::error::The exact release PR remains unmerged; newly-created anchors were cleaned up.'
            else
              echo '::error::The exact release PR remains unmerged, and one or more new anchors could not be cleaned up.'
            fi
          else
            echo '::error::The merge outcome is unknown; release anchors were retained for safety.'
          fi
          exit 1

      - name: Notify deployments channel of release merge
        if: steps.merge.outcome == 'success'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          IOS_TAG: ${{ needs.accepted-builds.outputs.ios_tag }}
          ANDROID_TAG: ${{ needs.accepted-builds.outputs.android_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_DEPLOY_WEBHOOK" ] || exit 0
          content="$(printf '✅ **Native release accepted and merged**\n• PR: #%s\n• iOS: `%s`\n• Android: `%s`\n<%s>' \
            "$PR_NUMBER" "$IOS_TAG" "$ANDROID_TAG" "$RUN_URL")"
          jq -n --arg content "$content" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Notify deployments channel of monitor failure
        if: failure()
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_DEPLOY_WEBHOOK" ] || exit 0
          content="$(printf '🚨 **release/next acceptance monitor failed**\n• PR: #%s\n<%s>' "$PR_NUMBER" "$RUN_URL")"
          jq -n --arg content "$content" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"
