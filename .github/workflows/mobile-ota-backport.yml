name: Mobile OTA Backport (Approved Release)

# Ships a JS-only fix to an already-APPROVED store release over-the-air, without a
# new store build. It checks out that release's frozen anchor
# (release/<platform>-v<version>-<shortfp>, cut by mobile-auto-version-bump.yml on
# approval), cherry-picks the fix onto it, and publishes an OTA under the anchor's
# fingerprint — which is exactly the fingerprint that release's installs request.
#
# The safety rail is the fingerprint check: after the cherry-pick it resolves the
# runtimeVersion and aborts unless its 12-char prefix equals the <shortfp> baked
# into the anchor tag. A drift means the cherry-pick touched native inputs, so the
# OTA would resolve a fingerprint no shipped binary has and silently never land —
# better to fail loudly. See docs/mobile-ota-updates.md.
#
# V2 is GONE (destroyed 2026-08-25): this backport publishes only to the V3 server
# (updates.boardsesh.com) via eoas@3.1.2 (pinned in scripts/lib/eoas.ts, used by
# `vp run mobile:publish`), authenticated with EOO_TOKEN. It therefore reaches only
# V3-fingerprint release anchors. Pre-V3 (old-fleet) binaries point at the deleted
# V2 host, get no OTA at all, and recover only by store-updating to a V3 build.
#
# Manual only. Prepare the fix as normal commits on main (or anywhere fetchable)
# first, then dispatch this with those commit SHAs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved marketing version to patch, e.g. 2.1.0'
        required: true
      platform:
        description: 'Which approved store binary to reach'
        type: choice
        options: [all, ios, android]
        default: all
      fix_commits:
        description: 'JS-only commit SHA(s) to cherry-pick onto the anchor (space/comma separated)'
        required: true
      confirm_android_shipped:
        description: 'Required for an Android backport: the Android anchor is cut on iOS approval, so confirm this version actually shipped on Google Play first.'
        type: boolean
        default: false
      dry_run:
        description: 'Resolve + verify the fingerprint but skip the actual OTA publish'
        type: boolean
        default: true

# Share the production OTA lane so a backport can never publish concurrently with a
# main production OTA (repo-wide group, across workflows). Queued, never cancelled.
concurrency:
  group: mobile-ota-production
  cancel-in-progress: false
  # Keep `queue: max` in lockstep with mobile-ota-production.yml — the two share
  # this group, and a lane that supersedes pending runs on one side would drop the
  # per-platform republishes the other side depends on. See the long note there.
  queue: max

permissions:
  contents: read

# ─── SHARED BUILD ENV (workflow-level) ───────────────────────────────────────
# The shared keys are byte-identical to ios-testflight-rn.yml /
# android-apk-rn.yml / mobile-ota-production.yml —
# scripts/mobile-ci-env-parity.test.ts fails the build if they drift. This
# workflow also preserves EXPO_UPDATES_CHANNEL for release anchors whose older
# app.config.ts still reads it. The fingerprint check below only means anything
# if this resolves under the same env the shipped binary did.
# GOOGLE_MAPS_API_KEY is Android-only and set per-step.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Manifest base for the offline snapshot bootstrap (bundle-only, no fingerprint
  # effect). Public Tigris bucket; keep in sync with SNAPSHOT_PUBLIC_BASE_URL in
  # export-board-snapshots.yml.
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://boardsesh-board-snapshots.t3.tigrisfiles.io/board-snapshots/v1-gzip
  # Compatibility input for frozen V3 release anchors. Their app.config.ts reads
  # this variable to emit expo-channel-name; the current config ignores it and
  # bakes the production header literally.
  EXPO_UPDATES_CHANNEL: production
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  # Pin RN's fetch as the global `fetch` (not expo/fetch), which crashes Hermes by
  # tearing down JSI promises off-thread (Sentry 7595562195). Bundle-only flag — it
  # doesn't enter the resolved config, so it never moves the fingerprint. Kept in
  # lockstep with the other mobile fingerprint workflows. See docs/mobile-ota-updates.md.
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  # Turn the platform choice into a matrix so iOS and Android publish independently
  # (each under its own release anchor / fingerprint).
  setup:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - id: platforms
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            all) echo 'platforms=["ios","android"]' >> "$GITHUB_OUTPUT" ;;
            ios) echo 'platforms=["ios"]' >> "$GITHUB_OUTPUT" ;;
            android) echo 'platforms=["android"]' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown platform '$PLATFORM'"; exit 1 ;;
          esac

  backport:
    needs: setup
    runs-on: ubuntu-latest
    # One platform per matrix job, so this needs a single 34-minute backoff
    # budget rather than production's two. Derived and enforced in
    # mobile-ota-publish-workflow.test.ts from the ladder in
    # scripts/lib/mobile-publish-retry.ts.
    timeout-minutes: 90
    # Gates EOO_TOKEN + GOOGLE_MAPS_API_KEY + the EXPO_UPDATES_URL variable.
    environment: Production
    strategy:
      fail-fast: false
      # Each eoas publish can perform four bounded attempts. Keep the platforms
      # in one lane so a backport cannot create its own upload burst.
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(needs.setup.outputs.platforms) }}
    # EOO_TOKEN (the app-scoped expo-open-ota publish key) is NOT a job-level env:
    # that would expose the publish-capable key to checkout, setup-vp,
    # `vp install`, and the cherry-pick before the publish. It's scoped to the
    # "Publish OTA" step below instead.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags: need the release anchor tag and the fix commits
          # (on main) reachable for the cherry-pick.
          fetch-depth: 0
          fetch-tags: true

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      # The hotfix tree is about to move to an older release anchor, which may
      # predate OTA source-map support. Snapshot the exact trusted workflow commit
      # before that checkout; never take release tooling from a cherry-picked fix.
      - name: Snapshot trusted OTA publish tooling
        run: |
          set -euo pipefail
          tooling_root="$RUNNER_TEMP/ota-publish-tooling"
          mkdir -p "$tooling_root/scripts/lib"
          for source_path in \
            scripts/mobile-publish.ts \
            scripts/lib/eoas.ts \
            scripts/lib/mobile-publish-retry.ts \
            scripts/mobile-upload-sourcemaps.ts
          do
            echo "Snapshotting trusted OTA tooling: $source_path"
            if ! git show "$GITHUB_SHA:$source_path" > "$tooling_root/$source_path"; then
              echo "::error::Could not snapshot trusted OTA tooling file '$source_path' from $GITHUB_SHA."
              exit 1
            fi
          done

      - name: Locate the release anchor and prepare the hotfix tree
        id: anchor
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          FIX_COMMITS: ${{ inputs.fix_commits }}
          CONFIRM_ANDROID_SHIPPED: ${{ inputs.confirm_android_shipped }}
        run: |
          set -euo pipefail
          # Validate the version is x.y.z before using it in a tag glob, so a
          # glob-like input (e.g. '*') can't match unrelated anchors and surface a
          # confusing "Multiple anchors" error instead of a clear bad-input one.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be x.y.z (got '$VERSION')."
            exit 1
          fi
          # The Android anchor is cut on iOS approval (no Google Play query), so it
          # can be premature. Require an explicit confirmation that the version
          # actually shipped on Play before an Android backport can publish.
          if [ "$PLATFORM" = "android" ] && [ "$CONFIRM_ANDROID_SHIPPED" != "true" ]; then
            echo "::error::Android backport requires confirm_android_shipped=true — verify v${VERSION} actually shipped on Google Play first (its anchor is cut on iOS approval)."
            exit 1
          fi
          mapfile -t tags < <(git tag -l "release/${PLATFORM}-v${VERSION}-*")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::No release/${PLATFORM}-v${VERSION}-* anchor tag. Has ${VERSION} been approved and anchored on ${PLATFORM}?"
            exit 1
          fi
          if [ "${#tags[@]}" -gt 1 ]; then
            echo "::error::Multiple ${PLATFORM} anchors for ${VERSION}: ${tags[*]}. Expected exactly one."
            exit 1
          fi
          tag="${tags[0]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "shortfp=${tag##*-}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "hotfix/${PLATFORM}-v${VERSION}-${GITHUB_RUN_ID}" "$tag"

          # Split into an array and reject any token that looks like a git flag, so
          # a malformed "commit" like -n / --abort can't be smuggled in as an option.
          read -r -a commits <<< "$(printf '%s' "$FIX_COMMITS" | tr ',' ' ')"
          if [ "${#commits[@]}" -eq 0 ]; then echo "::error::No fix commits provided."; exit 1; fi
          for commit in "${commits[@]}"; do
            case "$commit" in
              -*) echo "::error::Refusing commit-ish '$commit' that looks like a flag."; exit 1 ;;
            esac
            # Require explicit SHAs (7-40 hex): reject moving refs like main/HEAD or
            # branch names so a backport always cherry-picks a fixed, auditable commit.
            if ! printf '%s' "$commit" | grep -qE '^[0-9a-f]{7,40}$'; then
              echo "::error::'$commit' is not a commit SHA (7-40 hex). Pass explicit SHAs, not refs like main/HEAD."
              exit 1
            fi
          done
          echo "Cherry-picking onto $tag: ${commits[*]}"
          git cherry-pick "${commits[@]}"

      - name: Overlay trusted OTA publish tooling
        run: |
          set -euo pipefail
          tooling_root="$RUNNER_TEMP/ota-publish-tooling"
          mkdir -p scripts/lib
          cp "$tooling_root/scripts/mobile-publish.ts" scripts/mobile-publish.ts
          cp "$tooling_root/scripts/lib/eoas.ts" scripts/lib/eoas.ts
          cp "$tooling_root/scripts/lib/mobile-publish-retry.ts" scripts/lib/mobile-publish-retry.ts
          cp "$tooling_root/scripts/mobile-upload-sourcemaps.ts" scripts/mobile-upload-sourcemaps.ts
          git add scripts/mobile-publish.ts scripts/lib/eoas.ts scripts/lib/mobile-publish-retry.ts scripts/mobile-upload-sourcemaps.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(ota): overlay trusted publish tooling"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Trusted tooling overlay left the hotfix tree dirty; eoas would refuse to publish."
            git status --short
            exit 1
          fi

      # Install AFTER the anchor checkout + cherry-pick so node_modules matches the
      # OLD release's lockfile, not main's. `vp` resolves the packageManager from
      # that checked-out tree, so a frozen pre-pnpm anchor still installs with its
      # pinned Bun version. Resolving the fingerprint against main's deps would
      # diverge from what the shipped binary embedded and cause a spurious mismatch
      # (or, worse, a false match).
      - name: Install Node.js dependencies (workspace root)
        run: vp install --frozen-lockfile

      # The trusted wrapper deliberately invokes the official uploader installed
      # by the anchored app. Reject anchors that do not carry the audited 7.11.0
      # implementation instead of changing dependencies (and the fingerprint).
      - name: Validate anchored Sentry uploader support
        run: |
          set -euo pipefail
          sentry_version="$(jq -r '.dependencies["@sentry/react-native"] // .devDependencies["@sentry/react-native"] // empty' packages/mobile/package.json)"
          if [ "$sentry_version" != "7.11.0" ]; then
            echo "::error::This anchor has @sentry/react-native $sentry_version; OTA source-map backports require exactly 7.11.0. Ship a native update instead."
            exit 1
          fi
          # createRequire anchored at packages/mobile/package.json: under pnpm's
          # isolated linker `require.resolve` must start from the consuming package,
          # not the process CWD, to reach the hoisted .pnpm store path.
          uploader_path="$(cd packages/mobile && node -e 'const path = require("node:path"); const { createRequire } = require("node:module"); const requireFromMobile = createRequire(path.join(process.cwd(), "package.json")); const packageJson = requireFromMobile.resolve("@sentry/react-native/package.json"); console.log(path.join(path.dirname(packageJson), "scripts", "expo-upload-sourcemaps.js"));')"
          if [ ! -f "$uploader_path" ]; then
            echo "::error::The anchored @sentry/react-native install has no official Expo source-map uploader."
            exit 1
          fi
          echo "::notice::Anchored app has the audited @sentry/react-native 7.11.0 Expo uploader."

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF

      - name: Resolve fingerprint and verify it matches the approved anchor
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_SHORTFP: ${{ steps.anchor.outputs.shortfp }}
          # Android's approved fingerprint was resolved WITH the maps key; iOS without.
          GOOGLE_MAPS_API_KEY: ${{ matrix.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: |
          set -uo pipefail
          # Keep stderr visible: if the resolve fails for a reason other than a
          # fingerprint mismatch (missing dep, config/network error), surfacing it
          # beats the bare "Could not resolve" message below with no root cause.
          raw="$(cd packages/mobile && vp exec expo-updates runtimeversion:resolve --platform "$PLATFORM" || true)"
          fp="$(printf '%s' "$raw" | jq -r '.runtimeVersion // empty' 2>/dev/null || true)"
          # Require >= 12 hex chars: we compare the first 12 against the anchor's
          # shortfp, so anything shorter couldn't form a valid comparison anyway.
          if ! printf '%s' "$fp" | grep -qiE '^[0-9a-f]{12,}$'; then
            echo "::error::Could not resolve the $PLATFORM fingerprint for the hotfix tree."
            exit 1
          fi
          # Lowercase before comparing: the anchor's shortfp is always lowercase hex,
          # so a stray uppercase resolve would false-mismatch and wrongly abort.
          short="$(printf '%s' "${fp:0:12}" | tr '[:upper:]' '[:lower:]')"
          if [ "$short" != "$EXPECTED_SHORTFP" ]; then
            echo "::error::Resolved fingerprint $short != approved anchor $EXPECTED_SHORTFP. The cherry-pick changed native inputs, so an OTA published now would resolve a fingerprint no shipped ${{ inputs.version }} binary has and never land. Aborting — ship this fix as a new native build instead."
            exit 1
          fi
          echo "::notice::$PLATFORM fingerprint $short matches the approved anchor — safe to publish."

      - name: Publish OTA to the approved release
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          GOOGLE_MAPS_API_KEY: ${{ matrix.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
          VERSION: ${{ inputs.version }}
          FIX_COMMITS: ${{ inputs.fix_commits }}
        run: |
          vp run mobile:publish -- --channel production --platform "$PLATFORM" --message "Backport to v$VERSION ($FIX_COMMITS)"

      - name: Upload backport OTA source maps to Sentry
        id: upload_sourcemaps
        if: ${{ !inputs.dry_run && steps.publish.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        # The old anchor's vite.config may not define the new task. The trusted,
        # dependency-light helper was overlaid above, so invoke it directly.
        run: node --import tsx scripts/mobile-upload-sourcemaps.ts --platform "$PLATFORM"

      - name: Dry-run note
        if: ${{ inputs.dry_run }}
        run: echo "::notice::dry_run — verified the fingerprint match for ${{ matrix.platform }} but skipped the publish. Re-run with dry_run unchecked to ship."

      - name: Warn that the published backport source maps are missing
        if: ${{ always() && !inputs.dry_run && steps.publish.outcome == 'success' && steps.upload_sourcemaps.outcome != 'success' }}
        run: echo "::warning::The ${{ matrix.platform }} backport OTA is live, but its Sentry source-map upload did not succeed. Recreate the exact export before another eoas publish replaces dist."

      - name: Require the published backport source-map upload
        if: ${{ always() && !inputs.dry_run && steps.publish.outcome == 'success' && steps.upload_sourcemaps.outcome != 'success' }}
        run: |
          echo "::error::The published ${{ matrix.platform }} backport has no accepted Sentry source maps."
          exit 1
