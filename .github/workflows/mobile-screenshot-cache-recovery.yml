name: Mobile Screenshot Cache Recovery

# Rebuild an evicted main-scope cache without rerunning successful capture shards.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character historical main commit used by the capture
        required: true
        type: string
      expected_cache_key:
        description: Exact simulator app cache key reported missing by the capture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-screenshot-cache-recovery
  cancel-in-progress: false

jobs:
  validate-source:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.validate.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate historical main source
        id: validate
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Recovery requires a full lowercase 40-character commit SHA.'
            exit 1
          fi
          git cat-file -e "$REQUESTED_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SOURCE_SHA" origin/main
          printf 'source-sha=%s\n' "$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

  warm-cache:
    needs: validate-source
    # No capture or publication jobs depend on this cache-only producer.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      cache-key: ${{ steps.appkey.outputs.key }}
    env:
      # Reused from ios-rn-ci.yml so the Expo build links the same native config.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build only the validated historical main commit.
          ref: ${{ needs.validate-source.outputs.source-sha }}
          persist-credentials: false

      # Recover the original key: app and cache tooling use the same reviewed commit.
      - name: Checkout cache tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}
          path: .boardsesh/cache-tooling
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ios-screenshot-app-cache.ts
            scripts/select-screenshot-xcode.sh
            .github/actions/ios-screenshot-shard/action.yml
            .github/actions/ios-store-video-tools/action.yml
      - name: Verify application and cache tooling identities
        env:
          APP_SOURCE_SHA: ${{ needs.validate-source.outputs.source-sha }}
          CACHE_TOOLING_SHA: ${{ needs.validate-source.outputs.source-sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$APP_SOURCE_SHA" ] ||
             [ "$(git -C .boardsesh/cache-tooling rev-parse HEAD)" != "$CACHE_TOOLING_SHA" ]; then
            echo "::error::Application or cache tooling checkout does not match its immutable source."
            exit 1
          fi
          printf 'Application source: %s\nCache tooling source: %s\n' "$APP_SOURCE_SHA" "$CACHE_TOOLING_SHA"

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      # Compute the .app cache key ONCE and surface it as a job output so every
      # ios-capture shard restores the exact same bucket.
      - name: Select the screenshot build toolchain
        run: bash .boardsesh/cache-tooling/scripts/select-screenshot-xcode.sh

      - name: Compute app cache key
        id: appkey
        env:
          NATIVE_INPUT_HASH: ${{ hashFiles('packages/mobile/app.config.ts', 'packages/mobile/react-native.config.js', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/locales/**', 'packages/mobile/targets/**', 'packages/mobile/package.json', 'patches/**', 'package.json', 'pnpm-workspace.yaml', 'scripts/mobile-build-sim-app.ts', 'scripts/screenshot-sim.entitlements', '.boardsesh/cache-tooling/scripts/ios-screenshot-app-cache.ts', '.boardsesh/cache-tooling/scripts/select-screenshot-xcode.sh') }}
        run: node --experimental-strip-types .boardsesh/cache-tooling/scripts/ios-screenshot-app-cache.ts key --native-hash "$NATIVE_INPUT_HASH" --minimum-sdk 27.1

      - name: Require the exact requested cache key
        env:
          EXPECTED_CACHE_KEY: ${{ inputs.expected_cache_key }}
          COMPUTED_CACHE_KEY: ${{ steps.appkey.outputs.key }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_CACHE_KEY" ] || [ "$COMPUTED_CACHE_KEY" != "$EXPECTED_CACHE_KEY" ]; then
            echo '::error::Computed simulator cache key differs from the requested recovery key.'
            exit 1
          fi

      # lookup-only: this job only needs to KNOW whether the .app is cached (the
      # shards do the actual restore), so on a hit we skip downloading a .app this
      # job never uses — keeping the common-path critical path to ~1-2 min.
      - name: Check for cached simulator app
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
          lookup-only: true

      # Deps are only needed to build; skipped entirely on a cache hit.
      - name: Install Node.js dependencies
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: vp install --frozen-lockfile

      # Cache miss (a native-input change) → build the .app from scratch with
      # xcodebuild (runs to completion; no `expo run:ios` launch-step hang).
      - name: Build simulator dev-client app
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: vp run mobile:build-sim-app -- --app-out packages/mobile/.app-cache --clean

      # Save for the ios-capture shards (and future runs). Only on a miss — on a
      # hit the entry already exists.
      - name: Verify simulator app identity
        if: steps.app-cache.outputs.cache-hit != 'true'
        env:
          APP_CACHE_KEY: ${{ steps.appkey.outputs.key }}
        run: node --experimental-strip-types .boardsesh/cache-tooling/scripts/ios-screenshot-app-cache.ts validate --key "$APP_CACHE_KEY" --app packages/mobile/.app-cache/Boardsesh.app --minimum-sdk 27.1

      - name: Save simulator app to cache
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
