name: Backend Build and Deploy

on:
  push:
    branches: [main]
    # Backend-affecting paths — keep in sync with detect-changes in branch-deploy.yml
    paths:
      - 'packages/backend/**'
      - 'packages/shared-schema/**'
      - 'packages/db/**'
      - 'packages/crypto/**'
      - 'packages/aurora-sync/**'
      - 'Dockerfile.backend'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: boardsesh-daemon

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # Same digest gets all of these tags. Homelab consumes :staging,
          # Railway consumes :production, humans use :sha-<short> for rollback.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=production,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-main
          cache-to: type=gha,mode=max,scope=backend-main

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-staging-backend:
    needs: build-backend
    runs-on: [self-hosted, homelab, ephemeral]
    steps:
      - name: Pull and restart staging backend
        run: |
          docker pull ghcr.io/boardsesh/boardsesh-daemon:staging
          cd /opt/branch-deploys && docker compose up -d --no-deps staging-backend
          echo "Waiting for staging backend to be healthy..."
          sleep 5
          docker ps --filter "name=staging-backend" --format "table {{.Names}}\t{{.Status}}"

  deploy-production-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Show image being deployed
        run: |
          echo "Image: ${{ needs.build-backend.outputs.image }}:production"
          echo "Digest: ${{ needs.build-backend.outputs.digest }}"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy \
            --service "${{ vars.RAILWAY_BACKEND_SERVICE_ID }}" \
            --yes
