name: Firmware Unit Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'embedded/**'
      - 'packages/board-constants/src/generated/product-sizes-data.ts'
      - 'packages/board-constants/src/generated/led-placements-data.ts'
      - 'packages/board-constants/src/generated/hole-placements/kilter.cjs'
      - 'packages/board-constants/src/generated/hole-placements/tension.cjs'
      - 'packages/shared/board-config/src/board-data.ts'
      - 'packages/shared-schema/src/schema/controller.ts'
      - 'packages/web/public/images/kilter/**'
      - 'packages/web/public/images/tension/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/firmware-build.yml'
      - '.github/workflows/firmware-tests.yml'
  pull_request:
    paths:
      - 'embedded/**'
      - 'packages/board-constants/src/generated/product-sizes-data.ts'
      - 'packages/board-constants/src/generated/led-placements-data.ts'
      - 'packages/board-constants/src/generated/hole-placements/kilter.cjs'
      - 'packages/board-constants/src/generated/hole-placements/tension.cjs'
      - 'packages/shared/board-config/src/board-data.ts'
      - 'packages/shared-schema/src/schema/controller.ts'
      - 'packages/web/public/images/kilter/**'
      - 'packages/web/public/images/tension/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/firmware-build.yml'
      - '.github/workflows/firmware-tests.yml'

concurrency:
  group: firmware-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Only on GitHub-hosted runners. From a self-hosted runner the
          # matching cache SAVE uploads to GitHub's cache service over the
          # open internet, which costs far more than the restore saves.
          # Empty disables caching; setup-python's input is a string, not a
          # boolean, so the gate selects the value.
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}

      - name: Run firmware codegen tests
        run: vp run controller:codegen:test

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Waveshare firmware from clean generated state
        run: vp run controller:build -e waveshare-7inch

      - name: Run native unit tests
        working-directory: embedded/test
        run: pio test -e native -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: embedded/test/.pio/build/native/test/
          retention-days: 7
