name: Mobile OTA Preview (Per-PR Channel)

# Publishes a PR's JS bundle to its own self-hosted OTA channel `pr-<number>` so
# anyone on the store / TestFlight binary can load it via the in-app switcher
# (What's New → Try a preview → pick the PR) — no per-tester build. Companion
# to mobile-ota-production.yml, which owns the `production` channel. The published
# runtimeVersion matches the shipped binary because EXPO_UPDATES_CHANNEL stays
# `production` (it feeds the hashed config); the `pr-<number>` value is only the eoas
# upload branch / switcher target. See docs/mobile-ota-updates.md.
#
# ─── SECURITY — READ BEFORE EDITING ──────────────────────────────────────────────
# EOO_TOKEN is the app-scoped expo-open-ota publish key, so ANY job holding it can
# `eoas publish` to our self-hosted OTA server (including the `production` channel).
# The dashboard admin creds (OTA_ADMIN_EMAIL / OTA_ADMIN_PASSWORD) are far more
# dangerous still: they can remap or delete ANY channel. Those two secret sets live in
# SEPARATE GitHub environments and NEVER meet on the same job:
#
#   * `ota-preview` — holds EOO_TOKEN. The `publish` job declares it and runs
#     PR-AUTHOR code WITH it (app.config.ts calls execSync at config time; workspace
#     postinstall). Its human checkpoint is this environment's REQUIRED REVIEWERS (if
#     configured). The admin creds are NEVER on this job.
#   * `ota-preview-unattended` — holds OTA_ADMIN_EMAIL / OTA_ADMIN_PASSWORD, with NO
#     required reviewers. Only the `map`, `cleanup`, and scheduled sweep jobs declare
#     it, and every one of them checks out the TRUSTED BASE (never PR head) and only
#     ever mutates a hardcoded `^pr-[0-9]+$` channel. PR-author code never runs with
#     the admin creds, so a fork/PR can't exfiltrate them or delete `production`. No
#     reviewers means a PR close or the daily sweep can't hang waiting on approval.
#
# Threat boundary (what actually protects production):
#   * FORKS get NO secrets on `pull_request` (we never use pull_request_target). A
#     fork can't publish, map, or exfiltrate a secret no matter what it edits — the
#     hard boundary that keeps external contributors away from `production`.
#   * The `/ota-preview` COMMENT path runs the DEFAULT-BRANCH (main) copy of this file
#     (issue_comment events always use the default branch), so its maintainer /
#     author_association gate is NOT PR-editable. workflow_dispatch runs the copy on
#     WHICHEVER ref the dispatcher picks — the protection there is that dispatch
#     REQUIRES REPO WRITE ACCESS, not the ref. Either way a FORK is previewed safely: a
#     trusted maintainer triggers it and the publish then waits on the `ota-preview`
#     environment.
#   * SAME-REPO collaborators are trusted: for `pull_request` GitHub runs the PR's
#     OWN copy of this workflow with repo secrets. Any same-repo PR touching the
#     relevant paths auto-publishes; the `environment: ota-preview` reviewer gate
#     (if required reviewers are configured) is the human checkpoint — not a hard
#     wall against a malicious insider, who already holds the repo's secrets via
#     other workflows.
#   * `^pr-[0-9]+$` guards every channel mutation (defense-in-depth, not the control).
#
# Fork PRs are SKIPPED here (no secrets), so the companion workflow_run file
# mobile-ota-preview-prompt.yml posts a "a maintainer can /ota-preview" nudge on the
# PR. That file only COMMENTS (base-context write token, never checks out fork code),
# so it doesn't widen this threat boundary — the publish path is unchanged.
#
# NEVER switch to pull_request_target, and NEVER auto-run `/ota-preview` on fork
# pushes — either hands the production-capable secrets to untrusted code.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - 'package.json' # root patchedDependencies and linker inputs affect the mobile native graph
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/mobile-publish.ts'
      - 'scripts/lib/mobile-publish-retry.ts'
      - 'scripts/lib/eoas.ts'
      - '.github/workflows/mobile-ota-preview.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to build a preview for (works for fork PRs)'
        required: true

# Least-privilege DEFAULT for every job (read-only). The jobs that write —
# announce / cleanup (sticky comment + deployment status) — re-grant the narrow write
# set at the job level. The `publish` job, which runs PR-author code, is capped at
# `contents: read` + `deployments: write` so a compromised PR build can't touch issues
# or PRs with the workflow token.
permissions:
  contents: read

# ─── SHARED FINGERPRINT ENV (workflow-level) ─────────────────────────────────────
# MUST stay byte-identical to mobile-ota-production.yml / ios-testflight-rn.yml /
# android-apk-rn.yml / mobile-ota-check.yml — scripts/mobile-ci-env-parity.test.ts
# fails the build if these drift. EXPO_UPDATES_CHANNEL stays `production` (NOT pr-N):
# it feeds the hashed Expo config, so the published runtimeVersion equals the shipped
# store binary's. The pr-N target is passed as `--channel pr-N` to mobile:publish
# (the eoas upload branch), which is independent of this baked header.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Manifest base for the offline snapshot bootstrap (bundle-only, no fingerprint
  # effect). Public Tigris bucket; keep in sync with SNAPSHOT_PUBLIC_BASE_URL in
  # export-board-snapshots.yml.
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://boardsesh-board-snapshots.t3.tigrisfiles.io/board-snapshots/v1
  EXPO_UPDATES_CHANNEL: production
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  # Pin RN's fetch as the global `fetch` (not expo/fetch), which crashes Hermes by
  # tearing down JSI promises off-thread (Sentry 7595562195). Bundle-only flag — it
  # doesn't enter the resolved config, so it never moves the fingerprint. Kept in
  # lockstep with the other mobile fingerprint workflows. See docs/mobile-ota-updates.md.
  EXPO_PUBLIC_USE_RN_FETCH: '1'
  # Preview-only tag: pr-<number> OTA bundles report `environment: preview` to BOTH
  # Sentry and PostHog, so testers' crashes and product events stay out of the
  # production view. The name is historical (Sentry came first, #3808); it is now read
  # once by resolveAppEnvironment() in packages/mobile/src/lib/app-environment.ts, which
  # both SDKs share (#3814) — renaming it silently untags both.
  # DELIBERATELY diverges from production — do NOT add to SHARED_ENV_KEYS in
  # scripts/mobile-ci-env-parity.test.ts. Bundle-only (EXPO_PUBLIC_*, JS-inlined), so it
  # doesn't move the fingerprint; store/production builds leave it unset → 'production'.
  EXPO_PUBLIC_SENTRY_ENVIRONMENT: preview

jobs:
  # ── Decide what to do, with NO secrets (read-only). Resolves the PR number and
  # whether to publish / clean up, enforcing the trigger gates.
  # NOTE on which copy of this file runs: for `pull_request` GitHub runs the PR's
  # OWN copy (a same-repo author can edit this gate — but same-repo collaborators are
  # already trusted with the repo's secrets, and forks get NO secrets so they can't
  # publish regardless of what they edit). The `/ota-preview` COMMENT path runs the
  # DEFAULT-BRANCH (main) copy (issue_comment always uses the default branch), so its
  # gate is NOT editable from a PR; workflow_dispatch runs the copy on whichever ref the
  # dispatcher selects, gated instead by dispatch REQUIRING REPO WRITE ACCESS — that is
  # what makes the fork / on-demand path safe.
  gate:
    # Skip unrelated comments (issue_comment fires on every comment in the repo).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/ota-preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only: reads PR metadata (incl. the head SHA to pin) and uploads an artifact.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      channel: ${{ steps.decide.outputs.channel }}
      fork_skip: ${{ steps.decide.outputs.fork_skip }}
      # The head SHA captured HERE, in the secret-free gate, is the exact commit the
      # publish job checks out — pinning it closes the TOCTOU where a fork could push
      # after the maintainer gate but before the publish checkout of the moving
      # refs/pull/<n>/head (which runs with EOO_TOKEN).
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - name: Decide action + resolve PR
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const repoFull = `${context.repo.owner}/${context.repo.repo}`;
            let action = 'skip';
            let prNumber = '';
            // Set for a fork PR we deliberately skip — its OWN copy of this job has a
            // read-only token and can't comment, so the companion workflow_run file
            // (mobile-ota-preview-prompt.yml) posts the "a maintainer can /ota-preview"
            // nudge. We only signal it via an artifact; no secrets, no fork code run.
            let forkSkip = false;
            // The exact commit the publish job will check out (pinned at gate time, no
            // secrets in scope). For pull_request we take the triggering commit
            // directly; for comment / dispatch we resolve it via the API below.
            let headSha = '';

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              prNumber = pr.number;
              if (context.payload.action === 'closed') {
                action = 'cleanup';
              } else {
                const isFork = pr.head.repo.full_name !== repoFull;
                // Auto-publish for any same-repo PR touching the relevant paths.
                // Fork PRs can't receive secrets via pull_request — use the
                // /ota-preview comment or workflow_dispatch for those.
                action = !isFork ? 'publish' : 'skip';
                forkSkip = isFork;
                headSha = pr.head.sha;
              }
            } else if (context.eventName === 'issue_comment') {
              const assoc = context.payload.comment.author_association;
              const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc);
              const body = (context.payload.comment.body || '').trim();
              // Accept the bare command or with trailing args (ignored) so a near-miss
              // like "/ota-preview please" doesn't silently resolve to skip.
              const isCommand = body === '/ota-preview' || body.startsWith('/ota-preview ');
              if (isCommand && isMaintainer) {
                prNumber = context.payload.issue.number;
                action = 'publish';
              } else if (isCommand && !isMaintainer) {
                core.notice(`Ignoring /ota-preview from ${assoc} — maintainers only.`);
              }
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pr;
              action = 'publish';
            }

            // Defense-in-depth: the channel must be a numeric PR preview channel.
            if (!/^[0-9]+$/.test(String(prNumber))) {
              action = 'skip';
              prNumber = '';
              forkSkip = false;
              headSha = '';
            }

            // Comment / dispatch publishes only carried a PR number — resolve the head
            // SHA now (still no secrets) so the publish job can PIN to this exact commit
            // instead of re-resolving the moving refs/pull/<n>/head minutes later, after
            // the maintainer gate, with EOO_TOKEN in scope.
            if (action === 'publish' && !headSha) {
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(prNumber),
              });
              headSha = prData.head.sha;
            }

            const channel = prNumber ? `pr-${prNumber}` : '';
            core.info(`event=${context.eventName} action=${action} channel=${channel || '(none)'} head_sha=${headSha || '(none)'} fork_skip=${forkSkip}`);
            core.setOutput('action', action);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('channel', channel);
            core.setOutput('fork_skip', String(forkSkip));
            core.setOutput('head_sha', headSha);

      # Hand the fork PR number to the companion workflow_run file. This job's token
      # is read-only on a fork PR (can't comment), and workflow_run.pull_requests is
      # empty for forks — so an artifact is the only channel. No checkout, no secrets.
      - name: Stage fork-preview prompt
        if: steps.decide.outputs.fork_skip == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fork-prompt"
          printf '%s' "${{ steps.decide.outputs.pr_number }}" > "$RUNNER_TEMP/fork-prompt/pr_number"

      - name: Upload fork-preview prompt
        if: steps.decide.outputs.fork_skip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ota-fork-prompt
          path: ${{ runner.temp }}/fork-prompt/pr_number
          retention-days: 1

  # ── Publish pr-<number> to the self-hosted server. Holds EOO_TOKEN (NOT the admin
  # creds) and runs PR-author code → gated by `environment: ota-preview` (configure
  # required reviewers) on top of the fork / author-association gates enforced in
  # `gate`. Channel↔branch mapping is deferred to the separate trusted-base `map` job
  # so the dashboard admin creds are never in scope while PR-author code runs.
  publish:
    needs: gate
    if: needs.gate.outputs.action == 'publish'
    runs-on: ubuntu-latest
    # Each platform may perform four attempts with 210 seconds of backoff. The
    # job publishes iOS then Android, so leave room for both bounded retry sets.
    timeout-minutes: 60
    # This job runs PR-author code with EOO_TOKEN, so its workflow-token scope is capped
    # at the minimum: read the tree, write the pr-preview deployment. NO issues /
    # pull-requests write — those stay on the trusted announce / cleanup jobs.
    permissions:
      contents: read
      deployments: write
    environment: ota-preview
    concurrency:
      # `needs` isn't reliably available to job-level concurrency, so derive the PR
      # number straight from the event (one of these is set per trigger).
      group: mobile-ota-preview-publish-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
      cancel-in-progress: true
    # EOO_TOKEN is NOT job-level env: this job checks out PR-head and runs PR-author
    # code (`bun install` on the PR tree, app.config execSync) — a job-level secret
    # would be live throughout that. EOO_TOKEN is scoped to the two publish steps. The
    # dashboard admin creds are NOT on this job at all — mapping runs in the separate
    # trusted-base `map` job. This is defense-in-depth on top of the
    # `environment: ota-preview` reviewer gate.
    env:
      CHANNEL: ${{ needs.gate.outputs.channel }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    # Surfaced to the trusted `map` + `announce` jobs so neither has to re-derive them
    # from PR-author context. `published` is 'true' iff ≥1 platform actually shipped —
    # the `map` job gates on it (the branch only exists once a publish landed).
    outputs:
      channel: ${{ needs.gate.outputs.channel }}
      published: ${{ steps.publish_ios.outcome == 'success' || steps.publish_android.outcome == 'success' }}
      # The exact commit this job checked out and published — the gate-captured SHA end
      # to end (not a fresh re-resolution). The announce comment surfaces it.
      head_sha: ${{ needs.gate.outputs.head_sha }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      verdict_ios: ${{ steps.compat.outputs.verdict_ios }}
      verdict_android: ${{ steps.compat.outputs.verdict_android }}
      outcome_ios: ${{ steps.publish_ios.outcome }}
      outcome_android: ${{ steps.publish_android.outcome }}
    steps:
      - name: Assert preview channel name
        run: |
          if ! printf '%s' "$CHANNEL" | grep -Eq '^pr-[0-9]+$'; then
            echo "::error::Refusing to publish to non-preview channel '$CHANNEL' (must match ^pr-[0-9]+\$)."
            exit 1
          fi
          echo "::notice::This job holds EOO_TOKEN and runs PR-author code; its human gate is the 'ota-preview' environment's REQUIRED REVIEWERS. Confirm they're set (Settings → Environments → ota-preview)."

      - name: Start deployment (preview building)
        id: deploy
        uses: actions/github-script@v7
        env:
          CHANNEL: ${{ needs.gate.outputs.channel }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          # The commit the gate pinned — the SAME one the checkout below uses. No fresh
          # github.rest.pulls.get here: re-resolving could pick up a post-gate push.
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            // Deployment is a visibility nicety — never fail the publish over it.
            try {
              const dep = await github.rest.repos.createDeployment({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: headSha,
                environment: 'pr-preview',
                auto_merge: false,
                required_contexts: [],
                transient_environment: true,
                production_environment: false,
                description: `OTA preview ${process.env.CHANNEL}`,
              });
              if (dep.data && dep.data.id) {
                core.setOutput('deployment_id', String(dep.data.id));
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo,
                  deployment_id: dep.data.id, state: 'in_progress',
                  description: `Publishing ${process.env.CHANNEL}…`,
                });
              }
            } catch (error) {
              core.warning(`Could not create deployment: ${error.message}`);
            }

      - name: Checkout PR head (pinned to the gate-captured SHA)
        uses: actions/checkout@v4
        with:
          # Pin to the EXACT commit the secret-free gate captured — NOT the moving
          # refs/pull/<n>/head, which a fork could advance after the maintainer gate but
          # before this checkout (this job holds EOO_TOKEN). The commit is fetchable in
          # the base repo for any PR (fork or not).
          ref: ${{ needs.gate.outputs.head_sha }}
          # This job then runs PR-author code (bun install, app.config execSync). Don't
          # leave a write-capable GITHUB_TOKEN in .git/config for it to reach; the
          # baseline fetch of public origin/main below works unauthenticated.
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: voidzero-dev/setup-vp@v1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (PR tree)
        run: bun install --frozen-lockfile

      # Materialize origin/main as a sibling worktree so the OTA-compat check can diff
      # the PR fingerprint against main (per platform) and skip publishing a platform
      # that is a native change (undeliverable to any shipped binary).
      - name: Materialize origin/main baseline
        run: |
          git fetch origin main --depth=1
          git worktree add "$RUNNER_TEMP/main-baseline" origin/main

      - name: Install dependencies (main baseline)
        working-directory: ${{ runner.temp }}/main-baseline
        run: bun install --frozen-lockfile

      # Writes packages/mobile/.env (the 8 EXPO_PUBLIC_* vars — same as the production
      # publish) into both trees and emits verdict_ios / verdict_android. No maps key
      # here: the diff-vs-main verdict is invariant to it (mirrors mobile-ota-check.yml).
      - name: Resolve OTA compatibility (and write .env)
        id: compat
        run: |
          vp run check:mobile-ota-compat -- --write-env --base-dir "$RUNNER_TEMP/main-baseline"

      # V3 control-plane: `eoas publish` creates the pr-<n> branch. Channel creation
      # and mapping happen in the separate trusted-base `map` job (below). iOS
      # WITHOUT GOOGLE_MAPS_API_KEY (Apple
      # Maps), Android WITH it — the per-platform split that keeps each published
      # fingerprint equal to its shipped binary (matches mobile-ota-production.yml). A
      # native-change platform is skipped.
      - name: Publish iOS OTA
        id: publish_ios
        if: steps.compat.outputs.verdict_ios != 'native-change-required'
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
        run: vp run mobile:publish -- --channel "$CHANNEL" --platform ios

      - name: Publish Android OTA
        id: publish_android
        if: steps.compat.outputs.verdict_android != 'native-change-required'
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: vp run mobile:publish -- --channel "$CHANNEL" --platform android

      # Only the production channel asks mobile:publish to retain external maps
      # in dist. PR previews use pr-N channels, so they neither keep nor upload
      # source maps; never provide SENTRY_AUTH_TOKEN to this PR-author-code job.

  # ── Map pr-<number> → its same-named branch on the self-hosted server. Channel
  # creation/mapping is a dashboard-admin action the eoo_ publish key CANNOT perform — so it
  # logs in with OTA_ADMIN_* (ota-preview-unattended environment, no reviewers). This is
  # a SEPARATE trusted-base job, NOT a publish step: the admin creds must never be in
  # scope while PR-author code runs. It checks out the TRUSTED BASE (never PR head),
  # targets only a hardcoded ^pr-[0-9]+$ channel, and runs only after ≥1 platform
  # actually published (so the branch exists). Idempotent.
  #
  # The `if:` is EXPLICIT (not the implicit success()): `!cancelled()` +
  # needs.publish.result != 'skipped' + the `published` flag. We gate on `!= 'skipped'`
  # rather than `== 'success'` on purpose: if ONE platform's publish step fails the
  # whole publish JOB result flips to `failure`, but the other platform still shipped a
  # branch that needs mapping — a `== 'success'` gate would skip the map and orphan the
  # channel. Job outputs (incl. `published`) are still set on a job failure, so the
  # `published == 'true'` flag remains the real "≥1 platform landed" signal. `map` runs
  # whenever the publish job actually ran (not skipped) and at least one platform landed.
  map:
    needs: [gate, publish]
    if: ${{ !cancelled() && needs.publish.result != 'skipped' && needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only checks out the trusted base and calls the management API — read-only token.
    permissions:
      contents: read
    environment: ota-preview-unattended
    concurrency:
      group: mobile-ota-preview-map-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
      cancel-in-progress: false
    env:
      CHANNEL: ${{ needs.publish.outputs.channel }}
    steps:
      - name: Assert preview channel name
        run: |
          if ! printf '%s' "$CHANNEL" | grep -Eq '^pr-[0-9]+$'; then
            echo "::error::Refusing to map non-preview channel '$CHANNEL' (must match ^pr-[0-9]+\$)."
            exit 1
          fi

      - name: Checkout base (trusted — NOT PR head)
        uses: actions/checkout@v4
        with:
          # Same trusted-base checkout the cleanup job uses: base.sha on a pull_request,
          # the repo default branch on the comment / dispatch paths. NEVER
          # refs/pull/<n>/head — the admin creds are in scope on this job.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2

      # ota-channel-map.ts is dependency-free (node built-ins only), so no `bun install`.
      # It resolves the server base from EXPO_UPDATES_URL and logs in with OTA_ADMIN_*
      # to mint the dashboard JWT the mapping needs. Idempotent.
      - name: Map preview channel → branch
        env:
          EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
          OTA_ADMIN_EMAIL: ${{ vars.OTA_ADMIN_EMAIL }}
          OTA_ADMIN_PASSWORD: ${{ secrets.OTA_ADMIN_PASSWORD }}
        run: bun scripts/ota-channel-map.ts map --channel "$CHANNEL" --branch "$CHANNEL"

  # ── Sticky comment + deployment status. A SEPARATE job (not a publish step) so the
  # headline can reflect the `map` outcome — a preview is only "live / switchable" once
  # its channel is mapped to the branch. Needs only the default GITHUB_TOKEN (no OTA
  # secrets); runs even when nothing shipped (native-only) or the publish failed, so
  # testers always learn what happened.
  announce:
    needs: [gate, publish, map]
    if: ${{ !cancelled() && needs.gate.outputs.action == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Trusted job (no OTA secrets, no PR-author code): keeps the write set to post the
    # sticky comment (pull-requests / issues) and the deployment status.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: write
    steps:
      - name: Announce preview on the PR
        uses: actions/github-script@v7
        env:
          CHANNEL: ${{ needs.publish.outputs.channel }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          DEPLOYMENT_ID: ${{ needs.publish.outputs.deployment_id }}
          VERDICT_IOS: ${{ needs.publish.outputs.verdict_ios }}
          VERDICT_ANDROID: ${{ needs.publish.outputs.verdict_android }}
          OUTCOME_IOS: ${{ needs.publish.outputs.outcome_ios }}
          OUTCOME_ANDROID: ${{ needs.publish.outputs.outcome_android }}
          # 'success' | 'skipped' (nothing published) | 'failure' (mapping errored).
          MAP_RESULT: ${{ needs.map.result }}
        with:
          script: |
            const channel = process.env.CHANNEL;
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = (process.env.HEAD_SHA || '').slice(0, 7);
            const marker = '<!-- mobile-ota-preview -->';

            // success | skipped (native change) | failure | (didn't run)
            const cell = (outcome, verdict) => {
              if (outcome === 'success') return `✅ published \`${sha}\``;
              if (verdict === 'native-change-required') return '⚠️ native change — needs a TestFlight/Play build';
              if (outcome === 'failure') return '❌ publish failed (see the run log)';
              return '—';
            };
            const iosCell = cell(process.env.OUTCOME_IOS, process.env.VERDICT_IOS);
            const androidCell = cell(process.env.OUTCOME_ANDROID, process.env.VERDICT_ANDROID);
            const anyPublished =
              process.env.OUTCOME_IOS === 'success' || process.env.OUTCOME_ANDROID === 'success';
            const anyFailed =
              process.env.OUTCOME_IOS === 'failure' || process.env.OUTCOME_ANDROID === 'failure';
            const nativeSkip =
              process.env.VERDICT_IOS === 'native-change-required' ||
              process.env.VERDICT_ANDROID === 'native-change-required';
            // nativeOnly: nothing shipped, nothing errored — the skip is a legitimate
            // native change, not a failure, so don't flag it red.
            const nativeOnly = !anyPublished && !anyFailed && nativeSkip;
            // A published bundle is only switchable once the channel is mapped to its
            // branch. The `map` job owns that (it runs when a platform published); until
            // it succeeds the switcher resolves "No branch mapping found".
            const mapped = process.env.MAP_RESULT === 'success';

            let headline;
            let deployState;
            let deployDesc;
            let switchable = false;
            if (anyPublished && mapped) {
              switchable = true;
              headline =
                `This PR is live on the OTA channel **\`${channel}\`** from commit \`${sha}\` (the exact SHA the ` +
                `gate pinned). Anyone on a TestFlight / App Store build can load it without a new build:`;
              deployState = 'success';
              deployDesc = `OTA channel ${channel} ready`;
            } else if (anyPublished && !mapped) {
              headline =
                `Published this PR's bundle, but mapping the OTA channel **\`${channel}\`** to its branch didn't ` +
                `complete — so it isn't switchable yet (the switcher would report "No branch mapping found"). ` +
                `Check the \`map\` job in the run log, then re-run it or map it from the dashboard.`;
              deployState = 'error';
              deployDesc = `${channel}: published but unmapped`;
            } else if (nativeOnly) {
              headline =
                `This PR is a **native change**, so it can't ride OTA — ship a TestFlight/Play build to test it. ` +
                `No \`${channel}\` preview was published.`;
              deployState = 'inactive';
              deployDesc = `${channel}: native change — no OTA preview`;
            } else {
              headline = `Couldn't publish an OTA preview for this PR.`;
              deployState = 'failure';
              deployDesc = `OTA preview ${channel} failed`;
            }
            // The one-tap route in. GitHub's markdown sanitiser only renders http/https
            // anchors, so this can't be a com.boardsesh.app:// URL — it points at the web
            // page (packages/web/app/preview/[channel]), which iOS resolves straight into
            // the app via the wildcard AASA and everywhere else offers the scheme link + a QR.
            // Gated on `switchable`, not `anyPublished`: until the map job binds the channel
            // to its branch the link would land testers on "No branch mapping found".
            const howto = switchable
              ? ['',
                 `**[📱 Open this preview in Boardsesh →](https://www.boardsesh.com/preview/${channel})**`,
                 '',
                 '<sub>Tap it on your phone. Reading this on a desktop? Open it there and scan the QR.</sub>',
                 '',
                 'By hand: **What\'s New → Try a preview → pick this PR** → it downloads and reloads. ' +
                   'Reset on the same screen (back to `production`).',
                 '']
              : [''];

            const body = [
              marker,
              `### 📱 OTA preview — \`${channel}\``,
              '',
              headline,
              ...howto,
              '| Platform | Status |',
              '| --- | --- |',
              `| iOS | ${iosCell} |`,
              `| Android | ${androidCell} |`,
              '',
              '<sub>Delivers only to a build whose fingerprint matches this commit (a JS-only change vs ' +
                '`main`). A native change can\'t ride OTA — ship a TestFlight/Play build. Closing the PR ' +
                'removes the channel.</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body,
              });
            }

            const deploymentId = process.env.DEPLOYMENT_ID;
            if (deploymentId) {
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo,
                  deployment_id: Number(deploymentId),
                  state: deployState,
                  description: deployDesc,
                });
              } catch (error) {
                core.warning(`Could not update deployment status: ${error.message}`);
              }
            }

  # ── Tear down pr-<number> when the PR closes. Runs NO PR-author code with a secret
  # (checks out the trusted base commit, deletes a hardcoded ^pr-[0-9]+$ channel via
  # the admin-authed management API). Fork-PR closes get no secrets → the scheduled
  # sweep (mobile-ota-preview-sweep.yml) reclaims those; same-repo closes clean up
  # here immediately.
  cleanup:
    needs: gate
    if: needs.gate.outputs.action == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted job (no PR-author code): keeps the write set to update the sticky comment
    # (pull-requests / issues) and inactivate the pr-preview deployment.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: write
    # Channel/branch teardown is a dashboard-admin action (the eoo_ key can't do it),
    # so this job needs the OTA_ADMIN_* creds — which live in the ota-preview-unattended
    # environment (NO required reviewers, so a PR close can't hang on approval). It runs
    # NO PR-author code (trusted base checkout, hardcoded ^pr-[0-9]+$ target), so the
    # environment is only reached for the secret.
    environment: ota-preview-unattended
    concurrency:
      group: mobile-ota-preview-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      # Presence flag only (a boolean, NOT the secret) so the delete step's `if:` can
      # skip a fork-PR close where secrets are absent. The creds themselves are scoped
      # to that step, off checkout / setup-bun.
      HAS_OTA_ADMIN: ${{ secrets.OTA_ADMIN_PASSWORD != '' }}
      CHANNEL: ${{ needs.gate.outputs.channel }}
    steps:
      - name: Assert preview channel name
        run: |
          if ! printf '%s' "$CHANNEL" | grep -Eq '^pr-[0-9]+$'; then
            echo "::error::Refusing to delete non-preview channel '$CHANNEL'."
            exit 1
          fi

      - name: Checkout base (trusted main — NOT PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: oven-sh/setup-bun@v2

      # No `bun install`: ota-channel-map.ts is dependency-free (node built-ins only).
      # Skipping the workspace install keeps this most-sensitive job (admin creds in
      # scope) from executing any dependency install/postinstall code.
      #
      # Deletes the channel (its mapping first) then the branch on the V3 server, so
      # it stops resolving pr-N and the branch's S3 objects are the primary GC. The
      # bucket's `{appId}/pr-` lifecycle rule is only an orphan backstop. Skipped when
      # the admin creds are absent (fork close) — the scheduled sweep reclaims those.
      - name: Delete preview channel + branch
        id: delete
        if: env.HAS_OTA_ADMIN == 'true'
        env:
          EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
          OTA_ADMIN_EMAIL: ${{ vars.OTA_ADMIN_EMAIL }}
          OTA_ADMIN_PASSWORD: ${{ secrets.OTA_ADMIN_PASSWORD }}
        run: bun scripts/ota-channel-map.ts delete --channel "$CHANNEL" --branch "$CHANNEL"

      - name: Mark preview removed (deployment + comment)
        if: always()
        uses: actions/github-script@v7
        env:
          CHANNEL: ${{ needs.gate.outputs.channel }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # success | failure | skipped (fork close: no admin creds) | '' — drives the
          # wording so we don't claim "Removed" when the delete was skipped or failed.
          DELETE_OUTCOME: ${{ steps.delete.outcome }}
        with:
          script: |
            const channel = process.env.CHANNEL;
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- mobile-ota-preview -->';

            // The delete step is skipped on a fork close (no admin creds) and can fail
            // if the server/creds misbehave — only claim "removed" when it actually ran
            // and succeeded. Otherwise the daily sweep (mobile-ota-preview-sweep.yml) is
            // the backstop that eventually reaps it.
            const deleteOutcome = process.env.DELETE_OUTCOME;
            const removed = deleteOutcome === 'success';
            const removalNote = removed
              ? `Removed — this PR is closed, so the \`${channel}\` channel and its branch were torn down. Testers ` +
                `still pinned to it should reset to \`production\` in the OTA Channel Switcher.`
              : deleteOutcome === 'failure'
                ? `This PR is closed, but tearing down the \`${channel}\` channel failed (see the \`cleanup\` job in ` +
                  `the run log) — the daily sweep will retry it. Testers still pinned to it should reset to ` +
                  `\`production\` in the OTA Channel Switcher.`
                : `This PR is closed. The \`${channel}\` channel couldn't be torn down here (a fork close carries no ` +
                  `admin creds), so the daily sweep will reap it. Testers still pinned to it should reset to ` +
                  `\`production\` in the OTA Channel Switcher.`;
            const deployDesc = removed
              ? `OTA channel ${channel} removed`
              : `OTA channel ${channel} teardown pending (sweep backstop)`;

            // Inactivate any pr-preview deployment for this PR's head commit.
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner, repo: context.repo.repo,
                environment: 'pr-preview', sha: process.env.HEAD_SHA,
              });
              for (const deployment of deployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo,
                  deployment_id: deployment.id, state: 'inactive',
                  description: deployDesc,
                });
              }
            } catch (error) {
              core.warning(`Could not inactivate deployment: ${error.message}`);
            }

            // Update the sticky comment if one exists.
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
              });
              const existing = comments.find((comment) => comment.body?.includes(marker));
              if (existing) {
                const body = [
                  marker,
                  `### 📱 OTA preview — \`${channel}\``,
                  '',
                  removalNote,
                ].join('\n');
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              }
            } catch (error) {
              core.warning(`Could not update sticky comment: ${error.message}`);
            }
