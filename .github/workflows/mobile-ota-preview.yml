name: Mobile OTA Preview (Per-PR Branch)

# Publishes a PR's JS bundle to its own self-hosted OTA branch `pr-<number>` so
# anyone on a compatible store / TestFlight binary can load it through Test a PR
# preview in More or the user drawer. Native config keeps the `production` channel fixed;
# `pr-<number>` is only the eoas upload branch. See docs/mobile-ota-updates.md.
#
# ─── SECURITY — READ BEFORE EDITING ──────────────────────────────────────────────
# EOO_TOKEN is the app-scoped expo-open-ota publish key, so ANY job holding it can
# `eoas publish` to our self-hosted OTA server (including the `production` channel).
# The dashboard admin creds (OTA_ADMIN_EMAIL / OTA_ADMIN_PASSWORD) are far more
# dangerous still: they can delete ANY branch. Those two secret sets live in
# SEPARATE GitHub environments and NEVER meet on the same job:
#
#   * `ota-preview` — holds EOO_TOKEN. The `publish` job declares it and runs
#     PR-AUTHOR code WITH it (app.config.ts calls execSync at config time; workspace
#     postinstall). Fork publishes require a `/ota-preview` comment from a user whose
#     live repository permission is write/maintain/admin. The admin creds are NEVER
#     on this job. Environment reviewers are optional defense-in-depth, not the gate.
#   * `ota-preview-unattended` — holds OTA_ADMIN_EMAIL / OTA_ADMIN_PASSWORD, with NO
#     required reviewers. Only the `cleanup` and scheduled sweep jobs declare
#     it, and every one of them checks out the TRUSTED BASE (never PR head) and only
#     ever mutates a hardcoded `^pr-[1-9][0-9]*$` branch. PR-author code never runs with
#     the admin creds, so a fork/PR can't exfiltrate them or delete `production`. No
#     reviewers means a PR close or the daily sweep can't hang waiting on approval.
#
# Threat boundary (what actually protects production):
#   * FORKS get NO secrets on `pull_request` (we never use pull_request_target). A
#     fork can't publish or exfiltrate a secret no matter what it edits — the
#     hard boundary that keeps external contributors away from `production`.
#   * The `/ota-preview` COMMENT path runs the DEFAULT-BRANCH (main) copy of this file
#     (issue_comment events always use the default branch), so its repository-
#     permission gate is NOT PR-editable. An accepted comment creates a second,
#     trusted default-branch workflow_dispatch run inside the PR lifecycle lane,
#     which hands the publish to a sandbox run in the same lane (below).
#     A manual workflow_dispatch can run the copy on whichever ref the dispatcher
#     picks; dispatch itself requires repository write access. Either way a FORK is
#     previewed safely after a live permission check.
#   * SAME-REPO collaborators are trusted: for `pull_request` GitHub runs the PR's
#     OWN copy of this workflow with repo secrets. Any same-repo PR touching the
#     relevant paths auto-publishes. The environment can add a reviewer checkpoint,
#     but it is not a hard wall against a malicious insider, who already holds the
#     repo's secrets via other workflows.
#   * A DEFAULT-BRANCH run never executes PR code. Comment, refresh and manual
#     dispatches run on `main`, and whatever a main run writes to Actions storage
#     is readable by every branch and PR. So the gate turns their publish into
#     `handoff`, which re-dispatches this file on a throwaway
#     `ci-sandbox/ota-preview/pr-<n>/<run id>` branch at the same trusted commit
#     (scripts/lib/ci-sandbox.cjs). Only that run, or a same-repo PR's own
#     pull_request run, checks out and executes PR code; `sandbox-cleanup` deletes
#     the branch afterwards. scripts/__tests__/untrusted-code-workflow-guard.test.ts
#     fails any default-branch workflow that runs a computed checkout unreviewed.
#   * `^pr-[1-9][0-9]*$` guards every branch mutation (defense-in-depth, not the control).
#
# Fork PRs are SKIPPED here (no secrets). A separate metadata-only
# `pull_request_target` workflow uses the trusted default-branch definition to
# reconcile their old branch and post the maintainer nudge. It never checks out or
# runs fork code and never grants this fork-controlled workflow a write token.
#
# NEVER switch THIS PUBLISHER to pull_request_target, and NEVER auto-run
# `/ota-preview` on fork pushes — either hands the production-capable publish
# secret to untrusted code. The companion target workflow is metadata-only.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to build a preview for (works for fork PRs)'
        required: true

# Least-privilege DEFAULT for every job (read-only). The jobs that write —
# announce / cleanup (sticky comment + deployment status) — re-grant the narrow write
# set at the job level. The `publish` job, which runs PR-author code, is capped at
# `contents: read` + `pull-requests: read` + `deployments: write` so a compromised
# PR build cannot touch issues or mutate PRs with the workflow token.
permissions:
  contents: read

# One lane for trusted PR lifecycle events. Every comment starts in its own run-id
# lane; after the secret-free gate verifies live write permission, it dispatches a
# trusted workflow_dispatch run into this PR lane. That ordering matters because
# Actions replaces an older pending run even when cancel-in-progress is false: an
# untrusted comment must never be able to evict pending reconciliation. Fork
# pull_request runs and unrelated comments also use their unique run id. The
# trusted pull_request_target companion uses this same lane for fork reconciliation.
concurrency:
  group: >-
    mobile-ota-preview-lifecycle-${{
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.number) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pr) ||
      github.run_id }}
  cancel-in-progress: false

# ─── SHARED FINGERPRINT ENV (workflow-level) ─────────────────────────────────────
# MUST stay byte-identical to mobile-ota-production.yml / ios-testflight-rn.yml /
# android-apk-rn.yml / mobile-ota-check.yml — scripts/mobile-ci-env-parity.test.ts
# fails the build if these drift. app.config.ts bakes the production channel and
# empty xprem-branch header; the pr-N target is passed through mobile:publish to
# eoas's `--branch` argument.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Manifest base for the offline snapshot bootstrap (bundle-only, no fingerprint
  # effect). Public R2 host; keep in sync with SNAPSHOT_PUBLIC_BASE_URL in
  # blackheathdc-ansible/inventories/boardsesh_workers.yml (batch defaults).
  # Cutover: docs/board-snapshots.md#batch-worker-owner-export-board-snapshots-family.
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://snapshots.boardsesh.com/board-snapshots/v1-gzip
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  # Pin RN's fetch as the global `fetch` (not expo/fetch), which crashes Hermes by
  # tearing down JSI promises off-thread (Sentry 7595562195). Bundle-only flag — it
  # doesn't enter the resolved config, so it never moves the fingerprint. Kept in
  # lockstep with the other mobile fingerprint workflows. See docs/mobile-ota-updates.md.
  EXPO_PUBLIC_USE_RN_FETCH: '1'
  # Preview-only tag: pr-<number> OTA bundles report `environment: preview` to BOTH
  # Sentry and PostHog, so testers' crashes and product events stay out of the
  # production view. The name is historical (Sentry came first, #3808); it is now read
  # once by resolveAppEnvironment() in packages/mobile/src/lib/app-environment.ts, which
  # both SDKs share (#3814) — renaming it silently untags both.
  # DELIBERATELY diverges from production — do NOT add to SHARED_ENV_KEYS in
  # scripts/mobile-ci-env-parity.test.ts. Bundle-only (EXPO_PUBLIC_*, JS-inlined), so it
  # doesn't move the fingerprint; store/production builds leave it unset → 'production'.
  EXPO_PUBLIC_SENTRY_ENVIRONMENT: preview

jobs:
  # ── Decide what to do, with NO secrets (read-only). Resolves the PR number and
  # whether to publish / clean up, enforcing the trigger gates.
  # NOTE on which copy of this file runs: for `pull_request` GitHub runs the PR's
  # OWN copy (a same-repo author can edit this gate — but same-repo collaborators are
  # already trusted with the repo's secrets, and forks get NO secrets so they can't
  # publish regardless of what they edit). The `/ota-preview` COMMENT path runs the
  # DEFAULT-BRANCH (main) copy (issue_comment always uses the default branch), so its
  # gate is NOT editable from a PR; workflow_dispatch runs the copy on whichever ref the
  # dispatcher selects, gated instead by dispatch REQUIRING REPO WRITE ACCESS — that is
  # what makes the fork / on-demand path safe.
  gate:
    # Skip unrelated comments (issue_comment fires on every comment in the repo).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.body == '/ota-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads PR/deployment metadata and can dispatch this same trusted default-branch
    # workflow after a comment passes the live repository-permission check.
    permissions:
      actions: write
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      branch: ${{ steps.decide.outputs.branch }}
      fork_skip: ${{ steps.decide.outputs.fork_skip }}
      cleanup_reason: ${{ steps.decide.outputs.cleanup_reason }}
      # A new revision, native inputs, changed preview bases, or an incomplete/unverifiable prior
      # deployment can leave stale runtime variants on the mutable preview branch.
      needs_reset: ${{ steps.pin.outputs.needs_reset }}
      # The head SHA captured HERE, in the secret-free gate, is the exact commit the
      # publish job checks out — pinning it closes the TOCTOU where a fork could push
      # after the maintainer gate but before the publish checkout of the moving
      # refs/pull/<n>/head (which runs with EOO_TOKEN).
      head_sha: ${{ steps.decide.outputs.head_sha }}
      source_base_sha: ${{ steps.pin.outputs.source_base_sha }}
      source_base_ref: ${{ steps.pin.outputs.source_base_ref }}
      main_sha: ${{ steps.pin.outputs.main_sha }}
      train_sha: ${{ steps.pin.outputs.train_sha }}
    steps:
      - name: Decide action + resolve PR
        id: decide
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const repoFull = `${context.repo.owner}/${context.repo.repo}`;
            let action = 'skip';
            let prNumber = '';
            let forkSkip = false;
            let cleanupReason = '';
            // Default to the old unconditional reset. Only a resolved file list that
            // provably cannot move the native fingerprint clears it.
            let needsReset = true;
            // The exact commit the publish job will check out (pinned at gate time, no
            // secrets in scope). For pull_request we take the triggering commit
            // directly; for comment / dispatch we resolve it via the API below.
            let headSha = '';

            const affectsMobilePreview = (path) =>
              path.startsWith('packages/mobile/') ||
              path.startsWith('packages/shared/') ||
              path.startsWith('packages/board-constants/') ||
              path.startsWith('packages/shared-schema/') ||
              path.startsWith('patches/') ||
              path === 'package.json' ||
              path === 'pnpm-lock.yaml' ||
              path === 'pnpm-workspace.yaml' ||
              path === 'scripts/mobile-publish.ts' ||
              path === 'scripts/lib/mobile-publish-retry.ts' ||
              path === 'scripts/lib/ota-branch-probe.ts' ||
              path === 'scripts/lib/eoas.ts' ||
              path === 'scripts/mobile-ota-boot-check.ts' ||
              path === 'scripts/mobile-ota-boot-fixture.gradle' ||
              path === 'scripts/mobile-ota-boot-preview.ts' ||
              path === 'scripts/mobile-ota-preview-candidates.ts' ||
              path === 'scripts/mobile-ota-preview-source.ts' ||
              path === 'scripts/lib/mobile-release-policy.ts' ||
              path === 'scripts/lib/ota-boot-check.ts' ||
              path === 'scripts/lib/ota-preview-boot-receipt.ts' ||
              path === 'scripts/lib/ota-publish-protocol.ts' ||
              path === '.github/workflows/mobile-ota-boot-check.yml' ||
              path === '.github/workflows/mobile-ota-preview.yml';

            // Paths that can move the native fingerprint, and therefore turn a
            // platform native-only mid-PR. Mirrors the native-input globs the
            // screenshot app cache is keyed on in mobile-screenshots-ios.yml.
            const affectsNativeFingerprint = (path) =>
              path === 'packages/mobile/app.config.ts' ||
              path === 'packages/mobile/package.json' ||
              // Declares the extra fingerprint sources and the autolinking hook, and
              // hashes itself, so editing it moves runtimeVersion on its own.
              path === 'packages/mobile/fingerprint.config.js' ||
              // Hashed files the app config names (fingerprint:generate --debug).
              path === 'packages/mobile/eas.json' ||
              path === 'packages/mobile/assets/icon.png' ||
              path === 'packages/mobile/assets/splash-icon.png' ||
              path === 'packages/mobile/assets/adaptive-icon.png' ||
              // @bacons/apple-targets Xcode extensions (the widget) — native by
              // definition, and prebuilt into the iOS project.
              path.startsWith('packages/mobile/targets/') ||
              path.startsWith('packages/mobile/plugins/') ||
              path.startsWith('packages/mobile/modules/') ||
              path.startsWith('packages/mobile/locales/') ||
              path.startsWith('packages/mobile/ios/') ||
              path.startsWith('packages/mobile/android/') ||
              path.startsWith('patches/') ||
              path === 'package.json' ||
              path === 'pnpm-lock.yaml' ||
              path === 'pnpm-workspace.yaml';

            // Native changes can stop a platform from publishing and leave its old
            // update surfable. The pin step combines this conservative PR-file signal
            // with durable deployment context: a new revision, changed bases, or an
            // incomplete previous attempt reset before publishing runtime variants.
            const hasMobileChanges = async (number) => {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(number),
                per_page: 100,
              });
              needsReset = files.some((file) => affectsNativeFingerprint(file.filename));
              return files.some((file) => affectsMobilePreview(file.filename));
            };

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              prNumber = pr.number;
              const isFork = pr.head.repo?.full_name !== repoFull;
              headSha = pr.head.sha;
              if (context.payload.action === 'closed') {
                action = 'cleanup';
                forkSkip = isFork;
                cleanupReason = 'closed';
              } else {
                const mobileChanges = await hasMobileChanges(pr.number);
                // A PR can remove its last mobile change after publishing. Run on
                // every synchronization and reconcile that transition to cleanup
                // instead of leaving the previous revision surfable.
                action = isFork ? 'skip' : mobileChanges ? 'publish' : 'cleanup';
                forkSkip = isFork;
                if (!isFork && !mobileChanges) cleanupReason = 'no-mobile';
              }
            } else if (context.eventName === 'issue_comment') {
              // Exact syntax keeps accidental lookalikes inert. Comment runs use
              // a unique concurrency lane; only the authorized dispatch below
              // enters the PR's lifecycle lane.
              const body = context.payload.comment.body || '';
              const isCommand = body === '/ota-preview';
              let canPublish = false;
              if (isCommand) {
                try {
                  const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: context.payload.comment.user.login,
                  });
                  canPublish = ['admin', 'maintain', 'write'].includes(permission.permission);
                } catch (error) {
                  // GitHub answers 404 for users who are not collaborators. Treat
                  // that as no permission; surface genuine API failures instead.
                  if (error.status !== 404) throw error;
                }
              }
              if (isCommand && canPublish) {
                prNumber = context.payload.issue.number;
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'mobile-ota-preview.yml',
                  ref: context.payload.repository.default_branch,
                  inputs: { pr: String(prNumber) },
                });
                core.notice(`Authorized /ota-preview for PR #${prNumber}; queued trusted dispatch.`);
                // This comment run never enters the branch-mutation DAG. The
                // trusted dispatch above re-resolves current PR state inside the
                // shared lifecycle lane.
                action = 'skip';
              } else if (isCommand) {
                core.notice('Ignoring /ota-preview — repository write permission is required.');
              }
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pr;
              action = 'publish';
            }

            // Defense-in-depth: the branch must be a numeric PR preview branch.
            if (!/^[0-9]+$/.test(String(prNumber))) {
              action = 'skip';
              prNumber = '';
              forkSkip = false;
              headSha = '';
            }

            // Dispatch publishes only carried a PR number. Reconcile closed PRs
            // and open PRs with no remaining mobile changes to cleanup,
            // and pin the exact current SHA while no secrets are in scope.
            if (action === 'publish' && !headSha) {
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(prNumber),
              });
              if (prData.state !== 'open') {
                core.notice(`Reconciling closed PR #${prNumber} to preview cleanup.`);
                action = 'cleanup';
                cleanupReason = 'closed';
                headSha = prData.head.sha;
              } else if (!(await hasMobileChanges(prNumber))) {
                action = 'cleanup';
                cleanupReason = 'no-mobile';
                headSha = prData.head.sha;
              } else {
                headSha = prData.head.sha;
              }
            }

            // A run on the default branch (comment, refresh and manual dispatches)
            // writes entries every branch and PR reads, so it must never execute PR
            // code. Only a pull_request run (PR-scoped) or a ci-sandbox dispatch
            // publishes; anywhere else the `handoff` job re-dispatches this workflow
            // on a throwaway sandbox branch at the same trusted commit.
            // Keep the prefix in step with scripts/lib/ci-sandbox.cjs.
            const sandboxPrefix = `refs/heads/ci-sandbox/ota-preview/pr-${prNumber}/`;
            const onSandbox = Boolean(prNumber) && context.ref.startsWith(sandboxPrefix) &&
              /^[1-9][0-9]*$/.test(context.ref.slice(sandboxPrefix.length));
            if (action === 'publish' && context.eventName !== 'pull_request' && !onSandbox) action = 'handoff';

            const branch = prNumber ? `pr-${prNumber}` : '';
            core.info(`event=${context.eventName} ref=${context.ref} action=${action} branch=${branch || '(none)'} head_sha=${headSha || '(none)'} fork_skip=${forkSkip} needs_reset=${needsReset}`);
            core.setOutput('action', action);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('branch', branch);
            core.setOutput('fork_skip', String(forkSkip));
            core.setOutput('cleanup_reason', cleanupReason);
            core.setOutput('needs_reset', String(needsReset));
            core.setOutput('head_sha', headSha);

      - name: Pin both preview bases
        id: pin
        if: steps.decide.outputs.action == 'publish'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.decide.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decide.outputs.head_sha }}
          PR_NATIVE_RESET: ${{ steps.decide.outputs.needs_reset }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA) throw new Error('Preview head moved before base pinning.');
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            let trainSha = '';
            try {
              const { data: train } = await github.rest.repos.getBranch({ ...context.repo, branch: 'release/next' });
              trainSha = train.commit.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            const bases = {
              version: 1,
              mainSha: main.commit.sha,
              trainSha,
              sourceBaseRef: pr.base.ref,
              sourceBaseSha: pr.base.sha,
            };
            const task = `ota-preview-pr-${process.env.PR_NUMBER}`;
            // Inspect every publish, including coalesced PR events. Refresh dispatch
            // flags are not durable and cannot prove which runtimes remain surfable.
            const { data: deployments } = await github.rest.repos.listDeployments({
              ...context.repo, environment: 'pr-preview', task, per_page: 1,
            });
            if (!Array.isArray(deployments)) throw new Error('Preview deployment history is unreadable.');
            const previous = deployments[0];
            let previousStatus = '';
            if (previous && Number.isSafeInteger(previous.id) && previous.id > 0) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: previous.id, per_page: 1,
              });
              if (!Array.isArray(statuses)) throw new Error('Preview deployment status is unreadable.');
              previousStatus = statuses[0]?.state ?? '';
            }
            let previousPayload = previous?.payload;
            if (typeof previousPayload === 'string') {
              try { previousPayload = JSON.parse(previousPayload); } catch { previousPayload = null; }
            }
            const previousBases = previousPayload && typeof previousPayload === 'object' && !Array.isArray(previousPayload)
              ? previousPayload.otaPreviewBases : null;
            const baseKeys = ['version', 'mainSha', 'trainSha', 'sourceBaseRef', 'sourceBaseSha'];
            const validBases = previousBases && typeof previousBases === 'object' && !Array.isArray(previousBases) &&
              Object.keys(previousBases).length === baseKeys.length &&
              baseKeys.every((key) => Object.hasOwn(previousBases, key)) &&
              previousBases.version === 1 &&
              typeof previousBases.mainSha === 'string' && /^[0-9a-f]{40}$/.test(previousBases.mainSha) &&
              typeof previousBases.trainSha === 'string' && /^(?:[0-9a-f]{40})?$/.test(previousBases.trainSha) &&
              typeof previousBases.sourceBaseRef === 'string' && previousBases.sourceBaseRef.length > 0 &&
              typeof previousBases.sourceBaseSha === 'string' && /^[0-9a-f]{40}$/.test(previousBases.sourceBaseSha);
            const sameBases = validBases && baseKeys.every((key) => previousBases[key] === bases[key]);
            const sameDeployment = previous?.environment === 'pr-preview' && previous.task === task &&
              previous.description === `OTA preview pr-${process.env.PR_NUMBER}` &&
              previous.transient_environment === true && previous.production_environment === false;
            // Even JS-only revisions can conflict on one base or fail one upload.
            // Clear every older revision first so omitted variants cannot stay surfable.
            const sameRevision = previous?.sha === pr.head.sha;
            const nativeReset = process.env.PR_NATIVE_RESET !== 'false';
            const needsReset = nativeReset || !sameDeployment || !sameRevision || !sameBases || previousStatus !== 'success';
            core.info(`needs_reset=${needsReset} native_reset=${nativeReset} same_deployment=${sameDeployment} same_revision=${sameRevision} same_bases=${Boolean(sameBases)} previous_status=${previousStatus || '(none)'}`);
            core.setOutput('needs_reset', String(needsReset));
            core.setOutput('source_base_sha', bases.sourceBaseSha);
            core.setOutput('source_base_ref', bases.sourceBaseRef);
            core.setOutput('main_sha', bases.mainSha);
            core.setOutput('train_sha', bases.trainSha);

  # ── Default-branch runs never execute PR code. Re-dispatch this workflow on a
  # fresh `ci-sandbox/ota-preview/pr-<n>/<run id>` branch at the same trusted commit;
  # that run publishes, and everything it writes stays scoped to the throwaway ref.
  # Trusted job: no OTA secrets, and only the immutable workflow commit's helper.
  handoff:
    needs: gate
    if: needs.gate.outputs.action == 'handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out the sandbox helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/lib/ci-sandbox.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Hand the publish to a sandbox branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        with:
          script: |
            const { handOffToSandbox } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/ci-sandbox.cjs`);
            await handOffToSandbox({
              github, context, core,
              workflowKey: 'ota-preview',
              workflowFile: 'mobile-ota-preview.yml',
              prNumber: process.env.PR_NUMBER,
              inputs: { pr: process.env.PR_NUMBER },
              sha: context.sha,
            });

  # ── Say so BEFORE the branch disappears. A reset takes the preview offline for the
  # length of both builds (usually 20–30 min); without notice that reads as "the preview is gone",
  # and the usual reaction — re-dispatching the workflow by hand — only opens a second
  # hole. Trusted job: no OTA secrets, no checkout, no PR-author code. It writes the
  # same sticky marker `announce` owns, so the final result overwrites this notice.
  notify:
    needs: gate
    if: needs.gate.outputs.action == 'publish' && needs.gate.outputs.needs_reset == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Note that the preview branch is rebuilding
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = (process.env.HEAD_SHA || '').slice(0, 7);
            const marker = '<!-- mobile-ota-preview -->';

            // Only speak up where a preview already exists to lose. A first publish has
            // no comment yet, and inventing one would promise a preview before the
            // compatibility check has had its say.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            const isActionsComment = (comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.user?.type === 'Bot';
            const existing = comments.find(
              (comment) => isActionsComment(comment) && comment.body?.includes(marker),
            );
            if (!existing) {
              core.info('No preview comment to update — nothing is being taken offline.');
              return;
            }

            const body = [
              marker,
              `### 📱 OTA preview — \`${branch}\``,
              '',
              `🔄 Rebuilding **\`${branch}\`** from commit \`${sha}\`. The PR revision, native inputs, preview bases, or previous ` +
                `build state need a fresh compatibility check, so the branch is reset once before all runtime variants ` +
                `and is **unavailable while both bases build (usually 20–30 minutes)**.`,
              '',
              `It comes back on its own — don't re-run this workflow, which would start the wait over. ` +
                `This comment is replaced with the result.`,
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
            });

  # ── Reconcile the mutable pr-N branch before publishing this revision. The
  # management delete runs without a checkout, install, or PR-authored code and
  # completes before the token-bearing publisher starts. This removes stale
  # runtime variants before a new revision or changed native inputs/bases publish.
  #
  # A retry keeps the branch only when the latest successful deployment records
  # exactly the same PR revision and base context. Missing, changed, malformed, or incomplete
  # deployment evidence resets conservatively, including after partial publication.
  reset:
    needs: gate
    if: needs.gate.outputs.action == 'publish' && needs.gate.outputs.needs_reset == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mobile-ota-preview-mutation-${{ needs.gate.outputs.pr_number }}
      # Every request queues behind an in-flight mutation. The outer lifecycle
      # lane also queues so a remote publish is never interrupted mid-request.
      cancel-in-progress: false
    # deployments: write only marks the previous record stale; no PR code runs here.
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    environment: ota-preview-unattended
    steps:
      # The delete below wipes what the latest deployment says is live. If this run
      # then dies before `publish` creates a new deployment, that old `success`
      # would tell the base-push refresh the preview is intact. Mark it first; a
      # failure here stops before the delete, so record and branch never disagree.
      - name: Mark the previous preview record stale
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        with:
          script: |
            const task = `ota-preview-pr-${process.env.PR_NUMBER}`;
            const { data: deployments } = await github.rest.repos.listDeployments({
              ...context.repo, environment: 'pr-preview', task, per_page: 1,
            });
            if (!Array.isArray(deployments)) throw new Error('Preview deployment history is unreadable.');
            const latest = deployments[0];
            if (!latest) return core.info('No previous preview record to mark.');
            await github.rest.repos.createDeploymentStatus({ ...context.repo,
              deployment_id: latest.id, state: 'error', description: 'Reset, republish pending',
            });

      - name: Reset preview branch before publish
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
          OTA_ADMIN_EMAIL: ${{ vars.OTA_ADMIN_EMAIL }}
          OTA_ADMIN_PASSWORD: ${{ secrets.OTA_ADMIN_PASSWORD }}
          OTA_APP_ID: '007e6fd7-f200-448c-9449-8d48ba5d51fc'
        with:
          script: |
            const branch = process.env.BRANCH;
            if (!/^pr-[1-9][0-9]*$/.test(branch || '')) {
              core.setFailed(`Refusing to reset non-preview branch '${branch || ''}'.`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA) {
              core.setFailed('Preview request is stale: the PR closed or its head commit changed after the gate.');
              return;
            }
            const configuredUrl = process.env.EXPO_UPDATES_URL;
            const email = process.env.OTA_ADMIN_EMAIL;
            const password = process.env.OTA_ADMIN_PASSWORD;
            if (!configuredUrl || !email || !password) {
              core.setFailed('Preview reset needs EXPO_UPDATES_URL and OTA_ADMIN_EMAIL / OTA_ADMIN_PASSWORD.');
              return;
            }
            const baseUrl = configuredUrl.replace(/\/manifest\/?$/, '').replace(/\/+$/, '');
            const login = await fetch(`${baseUrl}/auth/login`, {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ email, password }).toString(),
            });
            if (!login.ok) {
              core.setFailed(`Preview reset login failed (HTTP ${login.status}).`);
              return;
            }
            const payload = await login.json();
            if (!payload?.token) {
              core.setFailed('Preview reset login returned no token.');
              return;
            }
            const encoded = encodeURIComponent(branch);
            const appId = process.env.OTA_APP_ID;
            for (const [kind, path] of [
              ['legacy channel', `/api/apps/${appId}/channels/${encoded}`],
              ['branch', `/api/apps/${appId}/branches/${encoded}`],
            ]) {
              const response = await fetch(`${baseUrl}${path}`, {
                method: 'DELETE',
                headers: { authorization: `Bearer ${payload.token}` },
              });
              if (!response.ok && response.status !== 404) {
                core.setFailed(`Could not reset ${kind} '${branch}' (HTTP ${response.status}).`);
                return;
              }
              core.info(`${kind} '${branch}' ${response.status === 404 ? 'was already absent' : 'was deleted'}.`);
            }

  # ── Publish pr-<number> to the self-hosted server. Holds EOO_TOKEN (NOT the admin
  # creds) and runs PR-author code. Forks reach it only after the default-branch
  # permission gate accepts a write/maintain/admin `/ota-preview` comment; same-repo
  # collaborators are trusted. Branch surfing removes the old per-PR mapping, so dashboard
  # admin credentials are never in scope while PR-author code runs.
  publish:
    needs: [gate, reset]
    # `reset` is skipped for a same-revision retry with matching successful deployment
    # context, and a skipped `needs` job would otherwise skip this one too. Keep the edge (publish must still queue behind an
    # in-flight reset via the shared mutation lane) but accept 'skipped' alongside
    # 'success'. A reset that FAILED still blocks: the branch state is then unknown.
    if: >-
      !cancelled() && needs.gate.outputs.action == 'publish' &&
      needs.reset.result != 'failure'
    runs-on: ubuntu-latest
    # Each platform may perform six attempts with 34 minutes of backoff. The job
    # publishes iOS then Android, so leave room for both bounded retry sets — a
    # job killed mid-backoff dies by timeout instead of reporting `s3-slowdown`.
    # Derived and enforced in mobile-ota-publish-workflow.test.ts from the ladder
    # in scripts/lib/mobile-publish-retry.ts.
    timeout-minutes: 330
    concurrency:
      group: mobile-ota-preview-mutation-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: false
    # This job runs PR-author code with EOO_TOKEN, so its workflow-token scope is capped
    # at the minimum: read the tree/current PR and write the pr-preview deployment.
    # NO issues / pull-requests write — those stay on trusted announce / cleanup.
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    environment: ota-preview
    # EOO_TOKEN is NOT job-level env: this job checks out PR-head and runs PR-author
    # code (`vp install` on the PR tree, app.config execSync) — a job-level secret
    # would be live throughout that. EOO_TOKEN is scoped to the two publish steps. The
    # dashboard admin creds are NOT on this job at all. This is defense-in-depth on top
    # of the explicit fork permission gate and optional environment protections.
    env:
      BRANCH: ${{ needs.gate.outputs.branch }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    # Surfaced to the trusted `announce` job so it does not have to re-derive them
    # from PR-author context. `published` is 'true' iff ≥1 platform actually shipped.
    outputs:
      branch: ${{ needs.gate.outputs.branch }}
      published: ${{ steps.candidates.outputs.published }}
      # The exact commit this job checked out and published — the gate-captured SHA end
      # to end (not a fresh re-resolution). The announce comment surfaces it.
      head_sha: ${{ needs.gate.outputs.head_sha }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      summary: ${{ steps.candidates.outputs.summary }}
      failed: ${{ steps.candidates.outputs.failed }}
    steps:
      # A manual request can wait behind another branch mutation. Re-check the
      # gate's pinned SHA before any deployment or PR-code execution so a queued
      # stale request cannot republish an older commit.
      - name: Reject a stale queued publish
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA) {
              core.setFailed('Queued preview publish is stale: the PR closed or its head commit changed.');
            }

      - name: Assert preview branch name
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^pr-[1-9][0-9]*$'; then
            echo "::error::Refusing to publish to non-preview branch '$BRANCH' (must match ^pr-[1-9][0-9]*\$)."
            exit 1
          fi
          echo "::notice::This job holds EOO_TOKEN and runs PR-author code. Fork publishes require a /ota-preview comment from a repository write/maintain/admin user."

      - name: Start deployment (preview building)
        id: deploy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          # The commit the gate pinned — the SAME one the checkout below uses. No fresh
          # github.rest.pulls.get here: re-resolving could pick up a post-gate push.
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          MAIN_SHA: ${{ needs.gate.outputs.main_sha }}
          TRAIN_SHA: ${{ needs.gate.outputs.train_sha }}
          SOURCE_BASE_REF: ${{ needs.gate.outputs.source_base_ref }}
          SOURCE_BASE_SHA: ${{ needs.gate.outputs.source_base_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: headSha,
              environment: 'pr-preview',
              task: `ota-preview-pr-${process.env.PR_NUMBER}`,
              payload: {
                otaPreviewBases: {
                  version: 1,
                  mainSha: process.env.MAIN_SHA,
                  trainSha: process.env.TRAIN_SHA,
                  sourceBaseRef: process.env.SOURCE_BASE_REF,
                  sourceBaseSha: process.env.SOURCE_BASE_SHA,
                },
              },
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `OTA preview ${process.env.BRANCH}`,
            });
            if (!dep.data || !dep.data.id) {
              core.setFailed('GitHub did not return the authoritative preview deployment id.');
              return;
            }
            core.setOutput('deployment_id', String(dep.data.id));
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: dep.data.id, state: 'in_progress',
              description: `Publishing ${process.env.BRANCH}…`,
            });

      - name: Check out trusted preview tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same-repository PRs already run author code with the publish key;
          # their pinned tooling also lets changes to this pipeline test themselves.
          # Fork/manual dispatch tooling stays on trusted default-branch code.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.gate.outputs.head_sha || github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Checkout PR head (pinned to the gate-captured SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: true
          working-directory: tooling
          run-install: false

      # Neither the publisher key nor maps key exists while dependencies or
      # app.config execute in the candidate and corresponding baseline trees.
      - name: Rebase and compare both pinned preview candidates
        env:
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          SOURCE_BASE_SHA: ${{ needs.gate.outputs.source_base_sha }}
          SOURCE_BASE_REF: ${{ needs.gate.outputs.source_base_ref }}
          MAIN_SHA: ${{ needs.gate.outputs.main_sha }}
          TRAIN_SHA: ${{ needs.gate.outputs.train_sha }}
        run: |
          git -C source fetch origin "$SOURCE_BASE_SHA" "$MAIN_SHA"
          if [ -n "$TRAIN_SHA" ]; then git -C source fetch origin "$TRAIN_SHA"; fi
          node --experimental-strip-types tooling/scripts/mobile-ota-preview-candidates.ts prepare \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/preview-candidates" "$RUNNER_TEMP/preview-artifacts"

      - name: Reject a stale prepared publish
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        with:
          script: |
            const { data: currentPr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            if (currentPr.state !== 'open' || currentPr.head.sha !== process.env.HEAD_SHA) {
              core.setFailed('Prepared preview is stale: the PR closed or its head changed while candidates built.');
            }

      - name: Publish compatible preview runtime variants
        id: candidates
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          SOURCE_BASE_SHA: ${{ needs.gate.outputs.source_base_sha }}
          SOURCE_BASE_REF: ${{ needs.gate.outputs.source_base_ref }}
          MAIN_SHA: ${{ needs.gate.outputs.main_sha }}
          TRAIN_SHA: ${{ needs.gate.outputs.train_sha }}
        run: |
          node --experimental-strip-types tooling/scripts/mobile-ota-preview-candidates.ts publish \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/preview-candidates" "$RUNNER_TEMP/preview-artifacts"

      - name: Archive the frozen preview receipt
        if: always() && steps.candidates.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-ota-preview-receipt
          path: ${{ runner.temp }}/preview-artifacts/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Archive generated preview source
        if: always() && steps.candidates.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-ota-preview-source
          path: ${{ runner.temp }}/preview-artifacts/*.bundle
          retention-days: 7
          if-no-files-found: error

      - name: Finalize authoritative deployment state
        if: always() && steps.deploy.outputs.deployment_id != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          PUBLISHED: ${{ steps.candidates.outputs.published }}
          FAILED: ${{ steps.candidates.outputs.failed }}
          CANDIDATE_OUTCOME: ${{ steps.candidates.outcome }}
        with:
          script: |
            const failed = process.env.FAILED === 'true' || process.env.CANDIDATE_OUTCOME !== 'success';
            const state = failed ? 'failure' : process.env.PUBLISHED === 'true' ? 'success' : 'inactive';
            await github.rest.repos.createDeploymentStatus({ ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID), state,
              description: failed ? 'OTA preview failed' : state === 'success' ? 'OTA runtime variants ready' : 'No compatible preview candidate',
            });

      # Source bundles contain committed files only, without generated .env,
      # exports or source maps. SENTRY_AUTH_TOKEN never reaches PR execution.

  # ── Sticky comment + deployment status. Needs only the default GITHUB_TOKEN (no OTA
  # secrets); runs even when nothing shipped (native-only) or the publish failed, so
  # testers always learn what happened.
  announce:
    needs: [gate, reset, publish]
    if: ${{ !cancelled() && needs.gate.outputs.action == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: mobile-ota-preview-mutation-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: false
    # Trusted job (no OTA secrets, no PR-author code): keeps the write set to post the
    # sticky comment (pull-requests / issues) and the deployment status.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: write
    steps:
      - name: Announce preview on the PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRANCH: ${{ needs.publish.outputs.branch }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          DEPLOYMENT_ID: ${{ needs.publish.outputs.deployment_id }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
          SUMMARY: ${{ needs.publish.outputs.summary }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          NEEDS_RESET: ${{ needs.gate.outputs.needs_reset }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = (process.env.HEAD_SHA || '').slice(0, 7);
            const marker = '<!-- mobile-ota-preview -->';

            const { data: currentPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (currentPr.state !== 'open' || currentPr.head.sha !== process.env.HEAD_SHA) {
              core.info('Skipping stale preview announcement for a closed or superseded PR head.');
              return;
            }

            let candidates = [];
            try { candidates = JSON.parse(process.env.SUMMARY || '[]'); } catch { /* failed before result collection */ }
            const rows = candidates.flatMap((candidate) => ['ios', 'android'].map((platform) => {
              const result = candidate.platforms[platform];
              const state = candidate.status === 'conflict' ? 'rebase conflict' : candidate.status === 'failed' ? 'preparation failed' : result?.status || 'not published';
              const runtime = result?.receipt?.runtimeVersion || result?.fingerprint;
              return `| ${candidate.targetRef} | ${platform} | ${state} | ${runtime ? `\`${runtime}\`` : '—'} |`;
            }));
            const headline = process.env.PUBLISHED === 'true'
              ? `Preview of \`${sha}\` is ready on **\`${branch}\`**. Each variant includes the latest pinned base plus this PR's commits.`
              : `No preview of \`${sha}\` was published. ${process.env.NEEDS_RESET === 'true' ? 'The previous branch was cleared before building.' : 'The branch retains only variants already published for this same revision and base context.'}`;
            const body = [marker, `### 📱 OTA preview — \`${branch}\``, '', headline,
              ...(process.env.PUBLISH_RESULT !== 'success' ? ['Some candidates failed; see the Actions run for details.'] : []),
              ...(process.env.NEEDS_RESET === 'false' ? ['Skipped or omitted runtimes may retain variants already published for this same revision and base context; published rows below attest this attempt.'] : []),
              '', 'Open **More → Previews → Test a PR preview**, then choose the PR. Your installed runtime selects the matching variant.', '',
              '| Base | Platform | Status | Runtime |', '| --- | --- | --- | --- |', ...rows, '',
              'Conflicting rebases and native changes skip that target. When bases share a runtime, the PR’s actual target wins.',
              'Closing the PR removes every runtime variant.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            // Fork follow-up uses a pending marker before a maintainer publish.
            // Reuse that same sticky comment so a successful publish never leaves
            // contradictory "available on request" instructions behind. Only
            // Actions-authored markers are ours; contributors can copy the text
            // but cannot make this workflow edit their comments.
            const promptMarker = '<!-- mobile-ota-preview-prompt -->';
            const isActionsComment = (comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.user?.type === 'Bot';
            const existing =
              comments.find((comment) => isActionsComment(comment) && comment.body?.includes(marker)) ??
              comments.find((comment) => isActionsComment(comment) && comment.body?.includes(promptMarker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body,
              });
            }

  # ── Tear down pr-<number> when the PR closes. Runs NO PR-author code with a secret
  # (checks out the trusted base commit, deletes a hardcoded ^pr-[1-9][0-9]*$ branch via
  # the admin-authed management API). Fork-PR closes/no-mobile transitions are handled
  # by the trusted pull_request_target companion; the scheduled sweep remains the backstop.
  cleanup:
    needs: gate
    if: needs.gate.outputs.action == 'cleanup' && needs.gate.outputs.fork_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mobile-ota-preview-mutation-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: false
    # Trusted job (no PR-author code): keeps the write set to update the sticky comment
    # (pull-requests / issues) and inactivate the pr-preview deployment.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: write
    # Branch teardown is a dashboard-admin action (the eoo_ key can't do it),
    # so this job needs the OTA_ADMIN_* creds — which live in the ota-preview-unattended
    # environment (NO required reviewers, so a PR close can't hang on approval). It runs
    # NO PR-author code (trusted base checkout, hardcoded ^pr-[1-9][0-9]*$ target), so the
    # environment is only reached for the secret.
    environment: ota-preview-unattended
    env:
      # Presence flag only (a boolean, NOT the secret) so an incompletely configured
      # environment does not expose the credential to checkout / setup-vp.
      HAS_OTA_ADMIN: ${{ secrets.OTA_ADMIN_PASSWORD != '' }}
      BRANCH: ${{ needs.gate.outputs.branch }}
    steps:
      - name: Reject a stale cleanup decision
        id: fresh
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          CLEANUP_REASON: ${{ needs.gate.outputs.cleanup_reason }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const staleClosed = process.env.CLEANUP_REASON === 'closed' && pr.state !== 'closed';
            const staleDiff = process.env.CLEANUP_REASON === 'no-mobile' && pr.head.sha !== process.env.HEAD_SHA;
            if (staleClosed || staleDiff) {
              core.setFailed('Cleanup decision is stale: the PR reopened or its head commit changed after the gate.');
            }

      - name: Assert preview branch name
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^pr-[1-9][0-9]*$'; then
            echo "::error::Refusing to delete non-preview branch '$BRANCH'."
            exit 1
          fi

      - name: Checkout base (trusted main — NOT PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: true

      # No `vp install`: ota-preview-cleanup.ts is dependency-free (node built-ins only).
      # Skipping the workspace install keeps this most-sensitive job (admin creds in
      # scope) from executing any dependency install/postinstall code.
      #
      # Deletes a same-named legacy channel first when present, then the branch. The
      # branch's S3 objects are the primary GC. The
      # bucket's `{appId}/pr-` lifecycle rule is only an orphan backstop. The daily
      # sweep retries when this environment is temporarily missing its admin secret.
      - name: Delete preview branch
        id: delete
        if: env.HAS_OTA_ADMIN == 'true'
        env:
          EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
          OTA_ADMIN_EMAIL: ${{ vars.OTA_ADMIN_EMAIL }}
          OTA_ADMIN_PASSWORD: ${{ secrets.OTA_ADMIN_PASSWORD }}
        run: node --experimental-strip-types scripts/ota-preview-cleanup.ts delete --branch "$BRANCH"

      - name: Mark preview removed (deployment + comment)
        if: always() && steps.fresh.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          CLEANUP_REASON: ${{ needs.gate.outputs.cleanup_reason }}
          # success | failure | skipped (admin creds absent) | '' — drives the
          # wording so we don't claim "Removed" when the delete was skipped or failed.
          DELETE_OUTCOME: ${{ steps.delete.outcome }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- mobile-ota-preview -->';

            // The delete step can skip when admin creds are absent or fail when the
            // server/creds misbehave — only claim "removed" when it actually ran
            // and succeeded. Otherwise the daily sweep (mobile-ota-preview-sweep.yml) is
            // the backstop that eventually reaps it.
            const deleteOutcome = process.env.DELETE_OUTCOME;
            const removed = deleteOutcome === 'success';
            const reason = process.env.CLEANUP_REASON;
            const reasonText = reason === 'closed' ? 'this PR is closed' : 'this PR no longer changes mobile';
            const removalNote = removed
              ? `Removed — ${reasonText}, so the \`${branch}\` preview branch was torn down. Testers ` +
                `still surfing it should reset from the xprem branch picker.`
              : deleteOutcome === 'failure'
                ? `The \`${branch}\` branch should be removed because ${reasonText}, but teardown failed (see the ` +
                  `\`cleanup\` job in ` +
                  `the run log) — the daily sweep will retry it.`
                : `The \`${branch}\` branch should be removed because ${reasonText}, but admin credentials were ` +
                  `unavailable. The daily sweep will retry it.`;
            const deployDesc = removed
              ? `OTA branch ${branch} removed`
              : `OTA branch ${branch} teardown pending (sweep backstop)`;

            // The current head can differ from the SHA that created the active
            // deployment (notably when a PR removes its final mobile change).
            // Match the branch-bearing description instead of the newest SHA.
            try {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner: context.repo.owner, repo: context.repo.repo,
                environment: 'pr-preview', per_page: 100,
              });
              for (const deployment of deployments.filter(
                (candidate) => candidate.description === `OTA preview ${branch}`,
              )) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner, repo: context.repo.repo,
                  deployment_id: deployment.id, state: 'inactive',
                  description: deployDesc,
                });
              }
            } catch (error) {
              core.warning(`Could not inactivate deployment: ${error.message}`);
            }

            // Update the sticky comment if one exists.
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
              });
              const promptMarker = '<!-- mobile-ota-preview-prompt -->';
              const isActionsComment = (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.user?.type === 'Bot';
              const existing =
                comments.find((comment) => isActionsComment(comment) && comment.body?.includes(marker)) ??
                comments.find((comment) => isActionsComment(comment) && comment.body?.includes(promptMarker));
              if (existing) {
                const body = [
                  marker,
                  `### 📱 OTA preview — \`${branch}\``,
                  '',
                  removalNote,
                ].join('\n');
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              }
            } catch (error) {
              core.warning(`Could not update sticky comment: ${error.message}`);
            }

  # ── Remove this run's own sandbox branch once every job above has finished. A
  # no-op on any other ref. A sandbox replaced while still pending never reaches
  # this job; the next handoff for the same PR prunes it.
  sandbox-cleanup:
    needs: [gate, notify, reset, publish, announce, cleanup]
    if: always() && startsWith(github.ref, 'refs/heads/ci-sandbox/ota-preview/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the sandbox helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/lib/ci-sandbox.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Delete this run's sandbox branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { deleteOwnSandbox } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/ci-sandbox.cjs`);
            await deleteOwnSandbox({ github, context, core, workflowKey: 'ota-preview' });
