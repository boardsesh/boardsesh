name: Android Dev-Client APK (React Native)

# Builds a debug / dev-client Android APK for the React Native app
# (packages/mobile/) and attaches it to a prerelease GitHub Release. Unlike the
# production sideload build (.github/workflows/android-apk-rn.yml, which runs
# `./gradlew assembleRelease`), the debug variant embeds expo-dev-client's
# launcher, so the APK shows the "Development servers" screen and lets a tester
# point it at any Metro dev server (and switch between worktrees from the dev
# menu) instead of bundling JS.
#
# It installs SIDE-BY-SIDE with production: app.config.ts switches to the
# "Boardsesh Dev" name, the com.boardsesh.app.dev package, and the reddish
# hue-shifted icons (packages/mobile/dev-assets/) when BOARDSESH_APP_VARIANT=dev.
# Debug builds self-sign with the deterministic Expo template debug.keystore, so
# no signing secrets are needed and the dev app upgrades in place run-to-run.
# See docs/android-sideload-build.md.

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - '.github/workflows/android-apk-dev-client.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-dev-client-${{ github.ref }}
  # A dev build carries no release/tag-asset coupling, so cancelling a
  # superseded run is safe (unlike the production APK workflow).
  cancel-in-progress: true

permissions:
  contents: write # required for softprops/action-gh-release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Embedded fallback only — debug builds load JS from Metro at runtime, so
      # these are read with the developer's own .env from whichever bundler the
      # app is pointed at. Kept identical to the production workflow for parity.
      EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
      EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
      EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
      # PostHog product analytics — same project token as web/prod-Android so a
      # signed-in user's activity resolves to one person. Repo-level variable, so
      # no Production environment scoping is needed.
      EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      # Switches app.config.ts to the "Boardsesh Dev" identity + reddish icons.
      BOARDSESH_APP_VARIANT: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node.js dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Separate key prefix from the release workflow so the debug build's
          # cache never collides with the signed release cache.
          key: ${{ runner.os }}-gradle-rn-dev-${{ hashFiles('packages/mobile/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-dev-

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EOF

      - name: Expo prebuild (generate android/)
        working-directory: packages/mobile
        run: bunx expo prebuild --platform android --clean --no-install

      # Bump versionCode off the GH run number so a newer dev APK upgrades an
      # existing com.boardsesh.app.dev install in place (the template debug
      # keystore gives a stable signature run-to-run). versionName comes from
      # app.config.ts. Same sed the production workflow uses.
      - name: Set version code
        run: |
          set -euo pipefail
          code=${{ github.run_number }}
          sed -Ei "s/^([[:space:]]*)versionCode .*/\\1versionCode ${code}/" packages/mobile/android/app/build.gradle
          echo "versionCode set to ${code}"

      - name: Resolve mobile app version
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const appConfig = fs.readFileSync('packages/mobile/app.config.ts', 'utf8');
          const versionMatch = appConfig.match(/\bversion:\s*['"]([^'"]+)['"]/);
          if (!versionMatch) {
            throw new Error('Could not find version in packages/mobile/app.config.ts');
          }

          const version = versionMatch[1];
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `BOARDSESH_MOBILE_VERSION=${version}`,
              `BOARDSESH_ANDROID_DEV_TAG=rn-android-dev-${process.env.GITHUB_RUN_NUMBER}`,
            ].join('\n') + '\n',
          );
          NODE

      - name: Build debug (dev-client) APK
        working-directory: packages/mobile/android
        env:
          # Sentry's Gradle upload task is incompatible with the Expo-generated
          # Gradle version; keep runtime Sentry (via the DSN) but never let the
          # upload task fail the build. Mirrors the production workflow.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        # Universal (arm64-v8a + x86_64): runs on physical arm64 devices, Apple-Silicon
        # emulators, AND x86_64 emulators (the fast KVM path on Linux/Intel, used by the
        # local screenshot flow — see docs/android-emulator-screenshots.md). Both props
        # must list both ABIs: -PreactNativeArchitectures governs the RN/Hermes core libs,
        # -PboardseshAbiFilters the board-renderer CMake module.
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 -PboardseshAbiFilters=arm64-v8a,x86_64 --no-daemon --console=plain --stacktrace

      - name: Stage APK asset
        run: |
          set -euo pipefail
          debug_dir=packages/mobile/android/app/build/outputs/apk/debug
          apk="${debug_dir}/app-debug.apk"
          [ -f "$apk" ] || { echo "::error::Expected debug APK at $apk"; ls -la "$debug_dir" || true; exit 1; }
          cp -f "$apk" "${debug_dir}/boardsesh-dev-android.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-dev-android-${{ github.run_number }}
          path: packages/mobile/android/app/build/outputs/apk/debug/boardsesh-dev-android.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.BOARDSESH_ANDROID_DEV_TAG }}
          name: Boardsesh Dev (Android dev-client, build ${{ github.run_number }})
          body: |
            **Dev-client** Android build from commit ${{ github.sha }} — for testing, not the Play Store.

            **Package:** `com.boardsesh.app.dev` — installs **side-by-side** with the production app (shows as "Boardsesh Dev" with a red icon).
            **APK architecture:** universal (`arm64-v8a` + `x86_64`) — runs on physical arm64 devices, Apple-Silicon emulators, and x86_64 emulators (Linux/Intel + KVM).

            This APK has no bundled JS: it opens expo-dev-client's launcher and loads
            JavaScript from a Metro dev server. Start Metro (`vp run dev:mobile`),
            then enter its URL in the launcher (or switch servers from the dev menu).
            Debug-signed, so it upgrades a previous `com.boardsesh.app.dev` install in place.
          files: |
            packages/mobile/android/app/build/outputs/apk/debug/boardsesh-dev-android.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
