name: Main Native Release

# Native source changes are versioned once here before either signing workflow
# starts. Each run coalesces current main changes; never wait here for builds.
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - iOS TestFlight Deploy (React Native)
      - Android Play Internal Deploy (React Native)
    types: [completed]
    branches: [main]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Plan, coordinate, bootstrap the baseline, or restore a mistaken version bump'
        type: choice
        options: [plan, coordinate, baseline, restore-version]
        default: plan
      source_sha:
        description: 'Pre-cutover main SHA for baseline only'
        type: string
        required: false
      apply:
        description: 'Apply a baseline or version restoration; false only plans'
        type: boolean
        default: false
      target_version:
        description: 'Exact unreleased version to restore (restore-version only)'
        type: string
        required: false
      expected_stamp_sha:
        description: 'Exact latest mistaken version-bump SHA to supersede (restore-version only)'
        type: string
        required: false

concurrency:
  group: mobile-native-release
  cancel-in-progress: false
  queue: max # preserve manual baseline/recovery requests between automatic events

permissions:
  contents: read
  actions: write # recover missing newest-stamp tester builds, never public review

# Canonical native/OTA environment. The Maps key is passed only to Android
# fingerprint resolution, never the iOS resolve or dependency installation.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://snapshots.boardsesh.com/board-snapshots/v1-gzip
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  coordinate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - name: Checkout trusted main release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: false
      - name: Install trusted tooling
        run: vp install --frozen-lockfile
      - name: Test native release guards
        run: vp test run scripts/mobile-native-release.test.ts --reporter=agent
      - name: Mint repository App token for version stamps and protected baseline
        id: push_token
        if: inputs.action != 'plan' && (inputs.action != 'restore-version' || inputs.apply)
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Plan, stamp, or recover native tester builds
        env:
          ACTION: ${{ inputs.action || 'coordinate' }}
          BASELINE_SHA: ${{ inputs.source_sha }}
          APPLY_BASELINE: ${{ inputs.apply || 'false' }}
          TARGET_VERSION: ${{ inputs.target_version }}
          EXPECTED_STAMP_SHA: ${{ inputs.expected_stamp_sha }}
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.push_token.outputs.token }}
          NATIVE_ANDROID_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            plan) args=(coordinate --dry-run) ;;
            coordinate) args=(coordinate) ;;
            baseline)
              args=(baseline --source-sha "$BASELINE_SHA")
              if [ "$APPLY_BASELINE" = true ]; then args+=(--apply); fi
              ;;
            restore-version)
              args=(restore-version --target-version "$TARGET_VERSION" --expected-stamp-sha "$EXPECTED_STAMP_SHA")
              if [ "$APPLY_BASELINE" = true ]; then args+=(--apply); fi
              ;;
            *) echo '::error::Unknown native release action.'; exit 1 ;;
          esac
          node --experimental-strip-types scripts/mobile-native-release.ts "${args[@]}"
