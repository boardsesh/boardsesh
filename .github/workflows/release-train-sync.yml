name: Release Train Sync

# Brings every change on `main` into `release/next` (the native release train) and
# keeps a marketing version on the train that no store has released yet. All the
# logic lives in scripts/release-train-sync.ts; this file only supplies triggers,
# credentials and a checkout. See docs/mobile-store-release.md.
#
# How the train follows main (hybrid sync):
#   * release/next missing, with nothing of its own, or still at the head of the
#     last merged-back PR (a squash merge-back) → it moves to main.
#   * only `Release-Train: version-bump` commits on it that change nothing but the
#     `version:` line (bot's or a human's) → dropped, and the bump is recreated on
#     top of main. A trailer commit that changes anything else is never dropped.
#   * native work on it → main is merged in (`Release-Train: sync` merge commit).
#     A conflict confined to the `version:` line resolves to the higher version; any
#     other conflict fails the run and opens one `release-train` issue for a human.
#   Never a rebase: scripts/generate-changelog.ts keeps a PR only when its merge
#   commit is an ancestor of HEAD, so rewriting the train's history would drop the
#   release notes of every native PR on it.
#
# Version rule: a version is taken once it was merged back (the version at the last
# merged-back PR's merge commit) or Apple accepted it (a release/ios-v<version>-*
# anchor, which also spends every lower version: App Store Connect only takes versions
# above the last approved one). A taken version moves to the next free patch. The version release/next
# already carries is a lower bound until it is taken, so the train never goes
# backwards; vars.RELEASE_TRAIN_MIN_VERSION raises the floor for a new minor or
# major. The bump commit's push is what starts the TestFlight and Play tester builds.
#
# Deterministic commits: fixed bot identity and message, dates taken from the
# parents. A run with nothing new computes the SHA already on the branch and pushes
# nothing, which is why it is safe to run hourly.
#
# Pushes use the repository App token, never persisted credentials: a GITHUB_TOKEN
# push would not start the train's native build workflows. The push leases on the
# exact release/next SHA the plan was computed against. The `release/next` ruleset
# blocks deletion and force-pushes for everyone but this App, which needs the bypass
# to recreate the bump. GITHUB_TOKEN (below) only reads PRs and runs, dispatches the
# native workflows, and manages the conflict issue.
#
# Before pushing, the script waits (up to 30 min) for an in-progress store draft for
# release/next: that workflow pins the branch SHA and refuses to draft once it moves.

on:
  push:
    branches: [main]
  workflow_run:
    # Bot pushes to main carry [skip ci], which suppresses the push trigger above.
    # These two finish after such pushes (and the anchor marks a version as taken),
    # so they catch what the push trigger misses. Names must match exactly;
    # scripts/release-train-sync.test.ts pins them.
    workflows:
      - Mobile Release Anchor
      - Production Deploy
    types: [completed]
    branches: [main]
  schedule:
    # Hourly safety net: retries builds the gates deferred, and catches anything the
    # other triggers missed. A run with nothing to do pushes nothing.
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan (mode, version, target SHA, dispatches) without pushing, dispatching or touching issues'
        type: boolean
        default: false

concurrency:
  # Live runs serialize and never cancel each other: GitHub keeps one pending run and
  # replaces older pending ones, which is safe because every run reconciles from
  # scratch. A dry run gets its own group so it can never replace a live sync.
  group: ${{ inputs.dry_run == true && format('release-train-sync-dry-run-{0}', github.run_id) || 'release-train-sync' }}
  cancel-in-progress: false

permissions:
  contents: read # pushes go through the App token, not GITHUB_TOKEN
  pull-requests: read # gh pr list: the last merged-back PR
  issues: write # the release-train conflict issue and its label
  actions: write # gh run list + dispatching the native build workflows

jobs:
  sync:
    runs-on: ubuntu-latest
    # Up to 30 min waiting for a store draft, plus the sync itself.
    timeout-minutes: 45
    # No environment: the App key is repository-scoped, and the job needs no store
    # or signing credentials.
    steps:
      - name: Require the push credential
        env:
          OTA_PUSH_APP_ID: ${{ vars.OTA_PUSH_APP_ID }}
          OTA_PUSH_APP_PRIVATE_KEY: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "$OTA_PUSH_APP_ID" ]; then
            echo "::error::OTA_PUSH_APP_ID is not configured."
            missing=1
          fi
          if [ -z "$OTA_PUSH_APP_PRIVATE_KEY" ]; then
            echo "::error::OTA_PUSH_APP_PRIVATE_KEY is not configured."
            missing=1
          fi
          exit "$missing"

      # No credentials persisted: the App token is minted after install and handed
      # to the script's push only, never stored in .git/config.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Minted last, right before the only step that uses it, so no install script
      # ever runs while it exists. `workflows: write` because a sync that carries
      # main's edits under .github/workflows/ is refused for an App token without it.
      - name: Mint the push token
        id: push_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Sync release/next
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.push_token.outputs.token }}
          RELEASE_TRAIN_MIN_VERSION: ${{ vars.RELEASE_TRAIN_MIN_VERSION }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          args=()
          if [ "$DRY_RUN" = 'true' ]; then
            args+=(--dry-run)
          fi
          node --import tsx scripts/release-train-sync.ts "${args[@]}"
