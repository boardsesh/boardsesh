name: Mobile Store Audit

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact App Store marketing version to inspect'
        type: string
        required: true
        default: '2.6.0'
      ios_build:
        description: 'Expected attached iOS build number'
        type: string
        required: true
        default: '17'

permissions:
  contents: read

# Serializing with draft preparation keeps the attached build stable while read.
concurrency:
  group: mobile-store-draft
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane
      - name: Test readback and identity guards
        run: vp exec ruby fastlane/tests/store_audit_test.rb
      - name: Inspect App Store Connect
        working-directory: fastlane
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IOS_BUILD_NUMBER: ${{ inputs.ios_build }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          STORE_AUDIT_OUTPUT: ${{ runner.temp }}/store-audit-ios.json
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY_BASE64" ] || { echo '::error::Missing ASC credentials'; exit 1; }
          ASC_KEY_PATH=$(mktemp "$RUNNER_TEMP/boardsesh-audit-key.XXXXXX.p8")
          export ASC_KEY_PATH
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          chmod 600 "$ASC_KEY_PATH"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          bundle exec fastlane ios audit
      - name: Retain independent store readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-audit-ios
          path: ${{ runner.temp }}/store-audit-ios.json
          if-no-files-found: warn
          retention-days: 14
