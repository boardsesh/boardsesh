name: Refresh Mobile OTA Previews

# Metadata only: a base push re-publishes a same-repository mobile PR's preview
# only when the push changed the runtime that preview serves (native inputs of
# main or an active release/next), flipped the release train on or off, or the
# PR's last preview record is missing, unreadable or failed. An unrelated base
# commit leaves the preview offered to the same installed binaries; the PR's
# next push picks it up. Rules: scripts/mobile-ota-preview-refresh.ts and
# docs/mobile-ota-updates.md ("When an open preview is republished").
#
# `plan` reads PR, deployment and git-object metadata with a read-only token. It
# checks out this workflow's own trusted commit (main or release/next, never a PR
# head), installs nothing and runs one dependency-free script. `dispatch` holds
# the only write scope and runs no checked-out code. Dispatched runs use the
# default-branch publisher; forks still require a fresh maintainer authorization.
#
# A red run on a push (most release/next pushes are the sync bot's, so nobody is
# watching) posts to the Discord deploy channel from `notify`, and so does a
# green run that dispatched more than 10 PRs for a missing, unreadable, failed or
# stuck record: previews are then not landing at all (CONSERVATIVE_ALERT_THRESHOLD). The webhook is a
# Production environment secret, so `notify` declares that environment, holds no
# token scope and runs no checked-out code. Concurrency sits on `plan` rather
# than the workflow: a `notify` parked at the environment gate must not hold the
# refresh lane (docs/production-deploy.md, "The failure mode").
on:
  push:
    branches: [main, release/next]
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.ref_type == 'branch' && github.event.ref == 'release/next')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mobile-ota-preview-base-refresh
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      dispatch: ${{ steps.plan.outputs.dispatch }}
      conservative: ${{ steps.plan.outputs.conservative }}
    steps:
      - name: Check out trusted refresh tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Set up Node for the refresh planner
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Find previews whose base runtime changed
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/mobile-ota-preview-refresh.ts

  dispatch:
    needs: plan
    if: needs.plan.outputs.dispatch != '' && needs.plan.outputs.dispatch != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue latest-base previews
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISPATCH: ${{ needs.plan.outputs.dispatch }}
        with:
          script: |
            const numbers = JSON.parse(process.env.DISPATCH || '[]');
            if (!Array.isArray(numbers) || !numbers.every((number) => Number.isSafeInteger(number) && number > 0))
              throw new Error('Refresh plan must be a list of PR numbers.');
            for (const number of numbers) {
              await github.rest.actions.createWorkflowDispatch({ ...context.repo,
                workflow_id: 'mobile-ota-preview.yml', ref: context.payload.repository.default_branch,
                inputs: { pr: String(number) },
              });
              core.info(`Queued latest-base previews for PR #${number}.`);
            }

  notify:
    needs: [plan, dispatch]
    if: >-
      ${{ github.event_name == 'push' &&
      (failure() || fromJSON(needs.plan.outputs.conservative || '0') > 10) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment: Production
    steps:
      - name: Tell Discord the preview refresh needs attention
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
          CONSERVATIVE: ${{ needs.plan.outputs.conservative }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_DEPLOY_WEBHOOK:-}" ]; then
            echo "::warning::The preview refresh failed but DISCORD_DEPLOY_WEBHOOK is not readable here."
            exit 0
          fi
          if [ "$PLAN_RESULT" = "failure" ] || [ "$DISPATCH_RESULT" = "failure" ]; then
            content=$(printf '⚠️ **PR preview refresh failed** on `%s` at `%s` (plan: %s, dispatch: %s). Open PR previews may not follow this base until the next push.\n<%s>' \
              "$BRANCH" "${COMMIT_SHA:0:7}" "$PLAN_RESULT" "$DISPATCH_RESULT" "$RUN_URL")
          else
            content=$(printf '⚠️ **PR previews are not landing**: the refresh on `%s` at `%s` re-dispatched %s PRs whose last preview record is missing, unreadable, failed or stuck. Check the latest preview runs (reset credentials, the OTA server).\n<%s>' \
              "$BRANCH" "${COMMIT_SHA:0:7}" "$CONSERVATIVE" "$RUN_URL")
          fi
          jq -n --arg content "$content" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post the Discord notification (see status above)"
