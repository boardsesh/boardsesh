name: Mobile EAS Update (Branch Preview)

on:
  push:
    branches-ignore: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared-schema/**'
      - 'packages/board-constants/**'
      - 'packages/board-config/**'
      - 'packages/ble-protocol/**'
      - 'packages/queue/**'
      - '.github/workflows/mobile-eas-update.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch name (defaults to git branch)'
        required: false
      platform:
        description: 'Platform to publish (ios, android, all)'
        required: false
        default: 'all'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mobile-eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      INPUT_BRANCH: ${{ github.event.inputs.branch }}
      INPUT_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
      # Build-time env inlined into the OTA JS bundle, matching the native build
      # workflows (ios-testflight-rn.yml / android-apk-rn.yml). Without these, an OTA
      # update ships a bundle that re-resolves EXPO_PUBLIC_* to its in-code fallbacks
      # (and undefined for keys that have none) — which is why preview channels never
      # produced PostHog analytics or Sentry events.
      EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
      EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
      EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
      EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      # @posthog/cli reads these to upload OTA source maps so mobile $exception
      # stack traces are readable in PostHog. The native build workflows do this
      # via the Xcode/Gradle build phases; OTA updates aren't covered by those, so
      # the upload step below runs the CLI explicitly. Absent (forks / missing
      # secret) the upload step skips and the OTA still ships. POSTHOG_CLI_HOST is
      # omitted — this project is on PostHog US (the CLI defaults to US).
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine branch name
        id: branch
        run: |
          if [ -n "$INPUT_BRANCH" ]; then
            sanitized=$(printf '%s' "$INPUT_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          else
            sanitized=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          echo "name=$sanitized" >> "$GITHUB_OUTPUT"

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EOF

      - name: Publish EAS Update
        working-directory: packages/mobile
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format='%s' | tr -d "'\"\`" | cut -c1-80)
          UPDATE_MSG="${COMMIT_HASH} ${COMMIT_MSG}"

          echo "Publishing update to branch: $BRANCH_NAME"
          echo "Message: ${UPDATE_MSG}"
          echo "Platform: $INPUT_PLATFORM"

          bunx eas-cli@16 update \
            --branch "$BRANCH_NAME" \
            --message "$UPDATE_MSG" \
            --platform "$INPUT_PLATFORM" \
            --non-interactive
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}

      - name: Upload source maps to PostHog
        # OTA updates aren't covered by the native (Xcode/Gradle) upload, so do it
        # here. Re-export with the same .env written above: the debug IDs injected
        # by getPostHogExpoConfig are content-derived, so this dist carries the same
        # IDs as the bundle `eas update` just shipped, and PostHog can match traces.
        # Gated on BOTH CLI credentials (matching mobile-publish.ts): if only one
        # is set the step cleanly skips instead of running and failing silently
        # under continue-on-error. Fork PRs / missing-secret runs still publish OTA.
        # continue-on-error: the OTA already shipped in the step above, so a flaky
        # upload must neither fail the run nor skip the PR-comment step below.
        if: env.POSTHOG_CLI_API_KEY != '' && env.POSTHOG_CLI_PROJECT_ID != ''
        continue-on-error: true
        working-directory: packages/mobile
        run: |
          bunx expo export --dump-sourcemap --platform "$INPUT_PLATFORM"
          bunx posthog-cli hermes upload --directory dist

      - name: Post update link to PR
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          UPDATE_PLATFORM: ${{ env.INPUT_PLATFORM }}
        with:
          script: |
            const branch = process.env.BRANCH_NAME;
            const platform = process.env.UPDATE_PLATFORM;
            const sha = context.sha.slice(0, 7);

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });

            if (prs.length === 0) return;

            const pr = prs[0];
            const marker = '<!-- mobile-eas-update -->';
            const body = [
              marker,
              `### 📱 Mobile Preview Update`,
              '',
              `**Branch:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              `**Platform:** ${platform}`,
              '',
              'Testers with the **preview** build installed will receive this update automatically',
              'if their channel points to this branch.',
              '',
              '```bash',
              `# Point the preview channel at this branch:`,
              `bunx eas-cli@16 channel:edit preview --branch "${branch}"`,
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
