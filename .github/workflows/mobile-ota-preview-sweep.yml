name: Mobile OTA Preview Sweep

# Backstop cleanup for per-PR OTA preview channels (mobile-ota-preview.yml). The
# on-close cleanup handles same-repo PRs, but misses fork-PR closes (no secrets) and
# any close that raced a failing run. This daily sweep deletes every `pr-<number>`
# channel/branch on the self-hosted V3 server whose PR is no longer open. The
# server-side delete is the primary GC; the bucket's `{appId}/pr-` lifecycle rule is
# only an orphan backstop — see docs/mobile-ota-updates.md.
#
# Trusted, scheduled job: it checks out main (no PR-author code) and only ever
# touches channels matching ^pr-[0-9]+$, so it can never delete `production`.

on:
  schedule:
    - cron: '0 4 * * *' # daily, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-ota-preview-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Channel/branch deletion is a dashboard-admin action (the eoo_ key can't do it),
    # so the OTA_ADMIN_* creds — which live in the ota-preview-unattended environment —
    # are required. The read-only channel LIST uses the app-scoped EOO_TOKEN. That
    # environment carries NO required reviewers by design; declaring one WITH reviewers
    # would hang this scheduled run forever waiting on approval.
    environment: ota-preview-unattended
    # EOO_TOKEN / OTA_ADMIN_* / GH_TOKEN are NOT job-level env: that would expose them
    # to checkout, setup-bun, and `bun install`. Each is scoped to the step that uses
    # it — the gate + delete steps.
    steps:
      - name: Skip if OTA isn't wired
        id: gate
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          OTA_ADMIN_PASSWORD: ${{ secrets.OTA_ADMIN_PASSWORD }}
        run: |
          # The LIST call needs EOO_TOKEN + EXPO_UPDATES_URL, but the whole point of the
          # sweep is the DELETE — which needs the dashboard admin creds. Skip (not just
          # warn) when OTA_ADMIN_PASSWORD is absent so we don't list, find stale
          # channels, and then fail every delete for lack of a login.
          if [ -z "$EOO_TOKEN" ] || [ -z "${{ vars.EXPO_UPDATES_URL }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Self-hosted OTA not wired (EOO_TOKEN / EXPO_UPDATES_URL) — skipping sweep."
          elif [ -z "$OTA_ADMIN_PASSWORD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OTA_ADMIN_PASSWORD missing (ota-preview-unattended environment) — the delete can't authenticate, so skipping the sweep. Add it to reap stale preview channels."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'

      # Lists channels via the V3 read API, keeps only ^pr-[0-9]+$ whose PR is closed,
      # and deletes each via scripts/ota-channel-map.ts (channel mapping first, then
      # the branch). The helper is dependency-free (only node built-ins), so no
      # `bun install` is needed here.
      - name: Delete preview channels for non-open PRs
        if: steps.gate.outputs.run == 'true'
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          OTA_ADMIN_EMAIL: ${{ vars.OTA_ADMIN_EMAIL }}
          OTA_ADMIN_PASSWORD: ${{ secrets.OTA_ADMIN_PASSWORD }}
          EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The app id the V3 server routes on — matches DEFAULT_APP_ID in
          # scripts/ota-channel-map.ts. Threaded so the LIST call below and the
          # helper's delete resolve the same app.
          OTA_APP_ID: '007e6fd7-f200-448c-9449-8d48ba5d51fc'
        run: |
          set -uo pipefail

          # Fail CLOSED: if we can't list open PRs, skip — otherwise OPEN_PRS is empty
          # and EVERY pr-<number> channel reads as "not open" and gets mass-deleted.
          if ! OPEN_PRS="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[].number' | sort -u)"; then
            echo "::warning::Could not list open PRs — skipping sweep this run."
            exit 0
          fi
          echo "Open PRs: ${OPEN_PRS:-none}"

          # Base URL = EXPO_UPDATES_URL sans a trailing /manifest OR /manifest/ (matches
          # scripts/ota-channel-map.ts:52 `replace(/\/manifest\/?$/, '')`). Strip a
          # single trailing slash FIRST so a `.../manifest/` form collapses to
          # `.../manifest` before the /manifest strip, then trim any leftover slash.
          BASE_URL="${EXPO_UPDATES_URL%/}"
          BASE_URL="${BASE_URL%/manifest}"
          BASE_URL="${BASE_URL%/}"

          # List channels via the V3 read API. The app-scoped eoo_ key is accepted on
          # the GET routes when the request carries `Use-Cli-Auth: true`.
          if ! CHANNELS_JSON="$(curl -fsS \
            -H "Authorization: Bearer $EOO_TOKEN" \
            -H 'Use-Cli-Auth: true' \
            "$BASE_URL/api/apps/$OTA_APP_ID/channels")"; then
            echo "::warning::Could not list channels from the V3 server — skipping sweep this run."
            exit 0
          fi
          # Keep only pr-<number> channels; production and any non-preview name drop out.
          PREVIEW_CHANNELS="$(printf '%s' "$CHANNELS_JSON" | jq -r '.[].releaseChannelName' 2>/dev/null | grep -E '^pr-[0-9]+$' | sort -u || true)"
          echo "Preview channels: ${PREVIEW_CHANNELS:-none}"

          # Pipe (not an indented heredoc) so no leading whitespace sneaks onto the
          # first channel and trips the safety grep. The loop runs in a subshell — fine,
          # nothing after it reads a variable set inside.
          printf '%s\n' "$PREVIEW_CHANNELS" | while IFS= read -r channel; do
            [ -z "$channel" ] && continue
            # SAFETY: never touch anything that isn't a pr-<number> preview channel.
            if ! printf '%s' "$channel" | grep -Eq '^pr-[0-9]+$'; then
              echo "Skipping unexpected channel '$channel'"
              continue
            fi
            pr_num="${channel#pr-}"
            if echo "$OPEN_PRS" | grep -qx "$pr_num"; then
              echo "Keeping $channel (PR #$pr_num is open)"
            else
              echo "Deleting $channel (PR #$pr_num is not open)"
              bun scripts/ota-channel-map.ts delete --channel "$channel" --branch "$channel" \
                || echo "  (non-zero exit — fine if it's already gone)"
            fi
          done

          echo "Sweep complete."
