name: Android Play Internal Deploy (React Native)

# Builds signed APK/AAB artifacts for the React Native app, uploads the AAB to
# the Google Play internal and open-testing (beta) tracks, and publishes the exact APK as a GitHub
# prerelease named "Boardsesh Android Beta".
# packages/mobile/
# is a managed Expo project with no committed android/ — it's generated by `expo
# prebuild`. Android builds fine on a free Linux runner, so no macOS needed (cf.
# the iOS RN workflow ios-testflight-rn.yml, which mirrors this prebuild flow).

on:
  push:
    # Only the release train builds on push. release-train-sync.yml keeps it level
    # with main and bumps its version once a version is released, so a native
    # change or a new version on main reaches Play through the train. main keeps
    # manual dispatch for hotfix builds. JS-only pushes skip the native build.
    branches: [release/next]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - 'package.json' # root patchedDependencies and linker inputs affect the mobile native graph
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**' # pnpm patches to mobile deps live in root patches/, not under packages/mobile/**
      - '.github/workflows/android-apk-rn.yml'
  workflow_dispatch:
    inputs:
      version_code_offset:
        description: 'Added to GH run_number for versionCode (raise to clear collisions / stay above the retired Capacitor app version codes)'
        required: false
        default: '2000000'
      # The canonical "ship an urgent JS-only fix to binaries that can no longer
      # receive an OTA" lever (issue #3098). A JS fix merged to main is delivered
      # OTA-only and skips the native build when its fingerprint already shipped —
      # but a binary whose fingerprint has since drifted is orphaned from the OTA.
      # Dispatching this workflow with force_native on rebuilds the native app so
      # those installs get the fix via a store update. Defaults on, so a manual
      # dispatch keeps building as before; uncheck to honour the same gate as a
      # push. release-train-sync.yml dispatches it unchecked to retry a version
      # that has no build yet (for example one deferred by a Play review).
      force_native:
        description: 'Force a native build even if this fingerprint and version already shipped (push an urgent JS-only fix to orphaned binaries). Uncheck to honour the gate.'
        type: boolean
        required: false
        default: true

concurrency:
  # Platform-global so Play versionCode reads/uploads cannot race across refs.
  # mobile-store-android-beta.yml and mobile-store-android-production.yml share it.
  group: android-apk-rn
  # Don't cancel an in-flight run while its store upload is in progress.
  cancel-in-progress: false
  # QUEUE, never supersede. cancel-in-progress governs only the RUNNING run; by
  # default GitHub still replaces a *pending* run when a newer one queues. With
  # release-train-sync.yml pushing the train after every main merge, that would
  # silently drop whatever was waiting in this shared group behind the next train
  # push: a main hotfix dispatch, a beta or production promotion, or the sync
  # bot's retry for a version that has no build yet. Queued push runs cost
  # little: the gate skips one whose commit a later push has superseded.
  queue: max

permissions:
  contents: read # protected release tags are pushed with the repository App token

# ─── SHARED BUILD ENV (workflow-level) ───────────────────────────────────────
# Declared at the workflow level so the cheap `gate` job (fingerprint resolve)
# and the `build-and-release` job (expo prebuild) resolve a byte-identical config
# and can't drift. MUST stay identical to ios-testflight-rn.yml /
# mobile-ota-production.yml — scripts/mobile-ci-env-parity.test.ts fails the
# build if they do. Config-affecting vars (EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID,
# GOOGLE_MAPS_API_KEY, EXPO_UPDATES_URL) move the
# fingerprint runtimeVersion directly; the rest reach it via the hashed .env file
# the jobs write. Don't add other fingerprint-affecting vars here (EAS_BUILD,
# EAS_BUILD_PROFILE, BOARDSESH_APP_VARIANT, …) — they're unset in the build too.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  # Self-hosted OTA (expo-open-ota). EXPO_UPDATES_URL is the server's manifest
  # endpoint (e.g. https://updates.boardsesh.com/manifest), set as a repo variable
  # so the domain isn't hardcoded; until it's set, app.config.ts falls back to
  # the EAS URL and OTA stays inert (harmless). The production + xprem headers
  # are literals in app.config.ts. See docs/mobile-ota-updates.md.
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  # Read at runtime by src/lib/sentry.ts (Sentry.init) — Sentry is the mobile
  # error + native-crash sink (PostHog is product analytics only). Same DSN/
  # project as web + backend; not secret — already hardcoded in packages/web and
  # packages/backend source. JS source-map upload stays disabled below (Gradle
  # incompat); native crashes are still captured and reported.
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  # PostHog product analytics. Intentionally the SAME project token as web
  # (vars.NEXT_PUBLIC_POSTHOG_KEY) so a signed-in user's web + mobile activity
  # resolves to one person. EXPO_PUBLIC_* vars are inlined into the JS bundle at
  # build time; without this, analytics.ts sees no key and isAnalyticsEnabled is
  # false, so every track() silently no-ops (the app shipped zero events before).
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Manifest base for the offline snapshot bootstrap (bundle-only, no fingerprint
  # effect). Public R2 host; keep in sync with SNAPSHOT_PUBLIC_BASE_URL in
  # blackheathdc-ansible/inventories/boardsesh_workers.yml (batch defaults).
  # Cutover: docs/board-snapshots.md#batch-worker-owner-export-board-snapshots-family.
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://snapshots.boardsesh.com/board-snapshots/v1-gzip
  # Pin RN's fetch as the global `fetch` (not expo/fetch), which crashes Hermes by
  # tearing down JSI promises off-thread (Sentry 7595562195). Bundle-only flag — it
  # doesn't enter the resolved config, so it never moves the fingerprint. Kept in
  # lockstep with the other mobile fingerprint workflows. See docs/mobile-ota-updates.md.
  EXPO_PUBLIC_USE_RN_FETCH: '1'
  # Android Google Maps key, baked into the resolved android.config at prebuild
  # time when present (the build succeeds without it; the board-search map just
  # stays blank). It changes the Android fingerprint, so both the gate's resolve
  # and the build's prebuild read it from here. iOS never sets it (Apple Maps),
  # which is why the per-platform fingerprints differ.
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  # Fingerprint gate: resolve the Android runtimeVersion fingerprint and skip the
  # native build when a binary with that fingerprint AND this marketing version
  # already shipped (a fingerprint-android-<hash> tag and a
  # build-android-v<version>-* tag both exist). The OTA publish
  # (mobile-ota-production.yml) still delivers the JS to matching binaries. This
  # gate is the ONE canonical resolution: the build embeds this exact value in the
  # binary via EXPO_UPDATES_FINGERPRINT_OVERRIDE and tags it, so binary-rv == tag
  # == the OTA-published rv by construction. See docs/mobile-ota-updates.md.
  gate:
    # Only main and release/next may use Production signing credentials.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/next'
    # The maps key affects the fingerprint, so both gate and build use the same
    # Production environment.
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.fp.outputs.should_build }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Play upload credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] || {
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; a release-train build must reach Play internal before it can be tagged."
            exit 1
          }

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies (workspace root)
        run: vp install --frozen-lockfile

      # The .env is hashed into the fingerprint, so it must be byte-identical to
      # the build job's (same heredoc + same workflow env) or the gate would
      # resolve a different fingerprint than the build bakes.
      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF

      - name: Resolve fingerprint and check for an existing native build
        id: fp
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Empty on a push; a dispatch carries the checkbox.
          FORCE_NATIVE: ${{ inputs.force_native }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }
          build() { echo "should_build=true" >> "$GITHUB_OUTPUT"; echo "::notice::$1"; exit 0; }
          skip() { echo "should_build=false" >> "$GITHUB_OUTPUT"; echo "::notice::$1"; exit 0; }

          # GOOGLE_MAPS_API_KEY is inherited from the workflow env (it changes the
          # Android fingerprint, so the resolve must match the build's prebuild).
          raw="$(cd packages/mobile && vp exec expo-updates runtimeversion:resolve --platform android 2>/dev/null || true)"
          fp="$(printf '%s' "$raw" | jq -r '.runtimeVersion // empty' 2>/dev/null || true)"
          if printf '%s' "$fp" | grep -qiE '^[0-9a-f]{8,}$'; then
            echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          else
            fp=''
          fi

          # The marketing version, read with the regex the build job's "Resolve
          # mobile app version" step uses, so the gate decides for the version the
          # binary will carry.
          # (Through a file: a heredoc inside $(...) trips older bash parsers.)
          version_file="$(mktemp)"
          node > "$version_file" <<'NODE'
          const appConfig = require('node:fs').readFileSync('packages/mobile/app.config.ts', 'utf8');
          const versionMatch = appConfig.match(/\bversion:\s*['"]([^'"]+)['"]/);
          if (versionMatch) process.stdout.write(versionMatch[1]);
          NODE
          version="$(cat "$version_file")"
          printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || fail "Could not read a MAJOR.MINOR.PATCH version from packages/mobile/app.config.ts (got \"$version\")."

          # Runs queue behind a running build (queue: max), so the branch may have
          # moved on by now. Skip only when a later push changed this workflow's
          # paths: that push has its own run, which decides for the newer commit.
          # A tip that moved only outside those paths starts no run, so this one
          # must still decide.
          if [ "$EVENT_NAME" = push ]; then
            superseded="$(node --experimental-strip-types scripts/push-run-superseded.ts --workflow .github/workflows/android-apk-rn.yml)" \
              || fail "Could not tell whether $GITHUB_SHA is still the newest Android build input on ${GITHUB_REF#refs/heads/}."
            if [ "$superseded" = true ]; then
              skip "Superseded: ${GITHUB_REF#refs/heads/} has moved past $GITHUB_SHA; the run for the newer commit decides."
            fi
          fi

          # A manual dispatch with force_native on (the default) builds regardless
          # of the fingerprint — the escape hatch for shipping an urgent JS-only
          # fix to OTA-orphaned binaries (issue #3098). With force_native off it
          # falls through to the same checks as a push, so a dispatch can also be
          # a no-op when this fingerprint and version already shipped.
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FORCE_NATIVE" = true ]; then
            build "Manual dispatch with force_native — building Android $version regardless of fingerprint ${fp:-<unresolved>}."
          fi

          if [ -z "$fp" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not resolve the Android fingerprint — building Android $version to be safe."
            exit 0
          fi

          fingerprint_tag="fingerprint-android-$fp"
          fingerprint_tags="$(git ls-remote --tags origin "refs/tags/$fingerprint_tag")" \
            || fail "Could not look up $fingerprint_tag on origin."
          if [ -z "$fingerprint_tags" ]; then
            build "Android fingerprint $fp is new — running the native build."
          fi

          # The marketing version and build numbers are not part of the fingerprint
          # (fingerprint.config.js sourceSkips), so a push that only bumps
          # `version` keeps an already-built fingerprint. The versionCode tag is
          # what records that a version reached Play, so a version without one
          # still builds: this is how release-train-sync.yml's version bump
          # becomes a Play build.
          version_builds="$(git ls-remote --tags origin "refs/tags/build-android-v${version}-*")" \
            || fail "Could not list Android $version builds on origin."
          if [ -z "$version_builds" ]; then
            build "Android fingerprint $fp already built (tag $fingerprint_tag), but no build of version $version exists yet (no build-android-v${version}-* tag) — building so Play gets $version."
          fi

          skip "Android fingerprint $fp and version $version both already built (tag $fingerprint_tag and a build-android-v${version}-* tag) — skipping the native build; the OTA delivers the JS."

  # Play's review lock is package-wide, and `fastlane android upload_beta` commits
  # with ERROR_IF_IN_REVIEW, so while any production or open-testing release waits
  # for review the ~30-minute build below would end in an upload Play refuses.
  # Without this check every train push in that window would burn one. GET-only,
  # and it fails open (the upload keeps its own guard). A deferred version still
  # has no build-android-v<version>-* tag, so release-train-sync.yml's hourly
  # retry dispatches this workflow again once the review clears.
  #
  # The second check holds a train build of the next version while the last
  # merge-back's Android build has not reached Play production yet. This build's
  # upload replaces Play internal, and the merge-back submission
  # (mobile-store-submit.yml) can only release what internal still serves
  # (scripts/mobile-store-android-merge-back-hold.ts). Same deferral, same retry,
  # same fail-open policy.
  play-review:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    # Fail open at the job level too. The script never fails, but checkout or
    # install can, and a red pre-check must not red the run: the store-draft and
    # screenshot workflows only follow a run that concluded success. A failed
    # check leaves `pending` empty, so the build below still runs.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    permissions:
      contents: read
      pull-requests: read # gh pr list: the last merge-back
    outputs:
      # Either check holds the build. Each fails open: one that errored leaves its
      # output empty or false, which never holds.
      pending: ${{ steps.review.outputs.pending == 'true' && 'true' || steps.merge_back.outputs.pending }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies (workspace root)
        run: vp install --frozen-lockfile

      - name: Check whether a Play review is pending
        id: review
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: vp exec node --import tsx scripts/mobile-store-android-review-pending.ts

      - name: Defer the build while Play reviews another release
        if: steps.review.outputs.pending == 'true'
        run: |
          echo "::notice::Android build deferred: Play is reviewing another release, and the upload cannot commit until that review finishes. release-train-sync.yml's hourly retry dispatches this workflow again once the review clears, or dispatch it by hand with force_native off."

      - name: Check whether the last merge-back still needs Play internal
        id: merge_back
        if: steps.review.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          STORE_AUTO_SUBMIT: ${{ vars.STORE_AUTO_SUBMIT }}
        run: vp exec node --import tsx scripts/mobile-store-android-merge-back-hold.ts

      - name: Defer the build while the last merge-back waits for Play production
        if: steps.merge_back.outputs.pending == 'true'
        run: |
          echo "::notice::Android build deferred: the last merge-back's Android build has not reached Play production yet, and this upload would replace it on Play internal, which the merge-back submission releases from. release-train-sync.yml's hourly retry dispatches this workflow again once production carries it, or dispatch it by hand with force_native off."

  build-and-release:
    needs: [gate, play-review]
    # Fails open on the review check: only an explicit `pending=true` holds the
    # build, so a review check that errored still builds.
    if: >-
      !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.should_build == 'true'
      && needs.play-review.outputs.pending != 'true'
    runs-on: ubuntu-latest
    # 60, not 45: R8 now runs inside both assembleRelease and bundleRelease.
    # A timeout that cancels mid-bundleRelease wastes the whole run after the APK
    # was already built and verified; the headroom costs nothing when unused.
    timeout-minutes: 60
    environment: Production
    outputs:
      candidate_ready: ${{ steps.candidate_metadata.outputs.ready }}
      apk_sha256: ${{ steps.candidate_metadata.outputs.apk_sha256 }}
      apk_size: ${{ steps.candidate_metadata.outputs.apk_size }}
      build_tag: ${{ steps.candidate_metadata.outputs.build_tag }}
      fingerprint: ${{ steps.candidate_metadata.outputs.fingerprint }}
      mobile_version: ${{ steps.candidate_metadata.outputs.mobile_version }}
      version_code: ${{ steps.candidate_metadata.outputs.version_code }}
    # Shared EXPO_PUBLIC_* / EXPO_UPDATES_* / GOOGLE_MAPS_API_KEY env lives at the
    # workflow level (above) so the gate and build jobs resolve a byte-identical
    # fingerprint.
    env:
      # Pin the binary's runtimeVersion to the gate's canonical fingerprint.
      # app.config.ts emits this as a LITERAL runtimeVersion, so `expo prebuild`
      # bakes this exact value into the binary and the build never resolves its
      # own. Android gate+build are both Linux, so this is belt-and-suspenders —
      # but it keeps the invariant identical to iOS: binary-rv == the
      # fingerprint-android-<hash> tag == the OTA-published rv by construction.
      # See docs/mobile-ota-updates.md.
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.gate.outputs.fingerprint }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies (workspace root)
        run: vp install --frozen-lockfile

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        # `packages: ''` is REQUIRED, not tidiness. setup-android@v3's default is
        # `tools platform-tools`, and Google removed the obsolete `tools` package from
        # the SDK repository, so the default now dies on `Warning: Failed to find
        # package 'tools'` before any SDK component is installed. The next step
        # installs what the build actually needs.
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: ''

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rn-${{ hashFiles('packages/mobile/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF

      # @sentry/react-native's Gradle-embedded upload task (sentry.gradle,
      # applied by the @sentry/react-native/expo config plugin) previously
      # called a Gradle API incompatible with Expo-prebuild-generated Gradle
      # (`Could not find method exec()`) — fixed upstream in @sentry/react-native
      # 7.3.0 (we're pinned to 7.11.0, past the fix). Left disabled anyway: a
      # main is the trusted release lane, and if it's still broken it fails
      # assembleRelease/bundleRelease outright,
      # taking down the whole Android release (APK + AAB + Play upload), not
      # just symbolication — too large a blast radius to gamble on a P1 fix's
      # first real test being a store upload. A decoupled, continue-on-error
      # step below ("Upload Sentry source maps") uploads the same JS
      # bundle/sourcemap Gradle already generates, explicitly, so a failure
      # there can never block shipping the release. Runtime Sentry
      # (EXPO_PUBLIC_SENTRY_DSN) is unaffected either way. See #4101.
      - name: Disable Sentry Gradle-embedded source map upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_UPLOAD_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SENTRY_UPLOAD_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry source map upload."
          fi

      # The binary embeds the gate's canonical fingerprint via
      # EXPO_UPDATES_FINGERPRINT_OVERRIDE (job env above), so the build no longer
      # re-resolves. Record the gate value so the tag step (final) tags exactly
      # what the binary embeds: tag == binary-rv == OTA-published rv.
      - name: Record fingerprint for tagging
        run: |
          set -uo pipefail
          fp="${{ needs.gate.outputs.fingerprint }}"
          if printf '%s' "$fp" | grep -qiE '^[0-9a-f]{8,}$'; then
            echo "FINGERPRINT_ANDROID=$fp" >> "$GITHUB_ENV"
            echo "::notice::Android binary embeds gate fingerprint $fp (EXPO_UPDATES_FINGERPRINT_OVERRIDE); tagging that value on a successful release."
          else
            echo "::warning::Gate produced no usable fingerprint; the binary self-resolves and no fingerprint-android tag is pushed (next push rebuilds)."
          fi

      # Minted here, before prebuild, so the exact value baked into the manifest
      # (io.sentry.proguard-uuid, via plugins/with-android-sentry-proguard-uuid.js)
      # is the exact value the mapping is later uploaded under. Env only: it never
      # enters the resolved Expo config, so it cannot move the fingerprint the
      # gate pinned above.
      - name: Mint the Sentry ProGuard mapping UUID
        run: echo "BOARDSESH_SENTRY_PROGUARD_UUID=$(uuidgen)" >> "$GITHUB_ENV"

      - name: Expo prebuild (generate android/)
        working-directory: packages/mobile
        # GOOGLE_MAPS_API_KEY is inherited from the workflow env (baked into the
        # resolved android.config at prebuild time when present).
        run: vp exec expo prebuild --platform android --clean --no-install

      # versionCode = max(sideload floor, Play track ceiling + 1), resolved by
      # `fastlane android next_version_code`. The sideload floor is the
      # deterministic offset + run_number line below (VERSION_CODE_FALLBACK) — it
      # is the versionCode every GitHub Release sideload APK has shipped, so it's
      # the LIVE ceiling of the channel users sideload (~2_000_2xx). The Play
      # internal track sits in the low hundreds, so it can only RAISE the number,
      # never lower it: deriving from Play alone regressed the shared versionCode
      # from 2_000_285 (build 285) to 190 (build 289), which Android rejects as
      # INSTALL_FAILED_VERSION_DOWNGRADE on every sideload upgrade. See
      # docs/android-sideload-build.md.
      # NOTE: github.run_number resets to 1 if this workflow file is renamed or
      # recreated — if you do that, bump version_code_offset past the current
      # production ceiling via the workflow_dispatch input first, or the floor
      # drops below installed builds and new APKs become un-installable.
      - name: Compute version code
        id: version_code
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          offset=${{ github.event.inputs.version_code_offset || '2000000' }}
          export VERSION_CODE_FALLBACK=$(( offset + ${{ github.run_number }} ))
          bundle exec fastlane android next_version_code
          echo "versionCode: $(grep '^value=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

      - name: Set version code
        run: |
          set -euo pipefail
          code=${{ steps.version_code.outputs.value }}
          [ -n "${code}" ] || { echo "::error::Computed version code is empty"; exit 1; }
          sed -Ei "s/^([[:space:]]*)versionCode .*/\\1versionCode ${code}/" packages/mobile/android/app/build.gradle
          echo "versionCode set to ${code} (versionName comes from app.config.ts)"

      - name: Resolve mobile app version
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const appConfig = fs.readFileSync('packages/mobile/app.config.ts', 'utf8');
          const versionMatch = appConfig.match(/\bversion:\s*['"]([^'"]+)['"]/);
          if (!versionMatch) {
            throw new Error('Could not find version in packages/mobile/app.config.ts');
          }

          const version = versionMatch[1];
          fs.appendFileSync(process.env.GITHUB_ENV, `BOARDSESH_MOBILE_VERSION=${version}\n`);
          NODE

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > packages/mobile/android/app/release.keystore

      - name: Build signed arm64 release APK
        working-directory: packages/mobile/android
        env:
          # Read by the release signingConfig injected via the
          # with-android-release-signing config plugin. The ANDROID_KEYSTORE_*
          # secret names are shared across Android builds, so they line up 1:1.
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/packages/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Keep the Gradle-embedded source-map upload disabled even if the
          # Production environment has a Sentry token — see "Disable Sentry
          # Gradle-embedded source map upload" above for why. Runtime Sentry
          # remains enabled via the DSN above; the explicit "Upload Sentry
          # source maps" step below handles symbolication instead.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PboardseshAbiFilters=arm64-v8a --no-daemon --console=plain --stacktrace

      # Gradle just wrote app.manifest into the release assets, and its commitTime
      # decides whether an OTA can ever reach this binary: expo-updates launches
      # whichever update has the newest one. patches/expo-updates@57.0.19.patch
      # makes that HEAD's committer date instead of build time (#5021), but its
      # resolver falls back to build time whenever git is unreadable — a silent
      # return of the exact bug. Assert the artifact, not the intent.
      #
      # Here rather than after the AAB: same manifest, and a mismatch reds before
      # the longer bundle build. Before the Play upload and the fingerprint tag, so
      # a failure ships nothing and the next push simply builds again.
      - name: Check embedded commitTime
        run: vp run check:mobile-embedded-commit-time -- --search-root packages/mobile/android/app/build

      # Postcondition for the minified build, in the same spirit as the commitTime
      # check above: assert R8's own mapping rather than the gradle property that
      # asked for it. Runs well before the Play upload — past that the binary is
      # in the store and the fingerprint tag makes the next push skip the build.
      - name: Check Android obfuscation (R8 mapping)
        run: |
          vp run check:mobile-android-obfuscation -- \
            --mapping packages/mobile/android/app/build/outputs/mapping/release/mapping.txt \
            --min-renamed-fraction 0.40 \
            --summary

      # Guard against shipping an unsigned / debug-signed APK as if it were the
      # release build: assert the artifact verifies and log its signer cert so
      # the signing key is auditable in the run log.
      - name: Verify APK signature
        run: |
          release_dir=packages/mobile/android/app/build/outputs/apk/release
          release_asset="${release_dir}/boardsesh-android-beta-arm64-v8a.apk"
          mapfile -t apks < <(find "$release_dir" -maxdepth 1 -type f -name '*.apk' ! -name 'boardsesh-android-beta-arm64-v8a.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Gradle-produced release APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)"
          echo "Verifying $apk with $apksigner"
          "$apksigner" verify --print-certs "$apk"
          cp -f "$apk" "$release_asset"

      # Decoupled from the Gradle build (see "Disable Sentry Gradle-embedded
      # source map upload" above for why): replicates sentry.gradle's own
      # sequence by hand — copy the debug ID from Metro's intermediate
      # ("packager") source map into the final Hermes-composed one (Hermes's
      # compose-source-maps step doesn't propagate it on its own), then upload
      # via sentry-cli with the same release/dist convention sentry.gradle uses
      # (`<applicationId>@<versionName>+<versionCode>` / versionCode), so it
      # matches what the native Sentry SDK auto-detects at runtime
      # (src/lib/sentry.ts leaves release/dist unset for exactly this reason).
      # continue-on-error: a Sentry-side failure (outage, bad token) must never
      # block shipping the APK/AAB — it already built and verified above.
      - name: Upload Sentry source maps
        id: sentry_sourcemaps
        if: env.SENTRY_UPLOAD_ENABLED == 'true'
        continue-on-error: true
        working-directory: packages/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Non-flavor-aware config (see android/sentry.properties, written by
          # the @sentry/react-native/expo config plugin at prebuild time):
          # org/project/url come from this file, not CLI flags.
          SENTRY_PROPERTIES: android/sentry.properties
          VERSION_CODE: ${{ steps.version_code.outputs.value }}
        run: |
          set -euo pipefail
          bundle_dir=android/app/build/generated/assets/react/release
          sourcemap_dir=android/app/build/generated/sourcemaps/react/release
          packager_sourcemap_dir=android/app/build/intermediates/sourcemaps/react/release
          bundle_path="$bundle_dir/index.android.bundle"
          sourcemap_path="$sourcemap_dir/index.android.bundle.map"
          packager_sourcemap_path="$packager_sourcemap_dir/index.android.bundle.packager.map"

          for path in "$bundle_path" "$sourcemap_path" "$packager_sourcemap_path"; do
            if [ ! -f "$path" ]; then
              echo "::error::Expected Gradle-generated file missing: $path"
              exit 1
            fi
          done

          node node_modules/@sentry/react-native/scripts/copy-debugid.js "$packager_sourcemap_path" "$sourcemap_path"

          # com.boardsesh.app is hardcoded here (as it is elsewhere in this
          # workflow) rather than parsed
          # from a generated file: it must track the production
          # `androidPackage` in packages/mobile/app.config.ts. sentry.gradle
          # instead derives it from the Gradle variant, so if android.package
          # ever changes, update this literal to match or symbolication will
          # silently break.
          ./node_modules/.bin/sentry-cli react-native gradle \
            --bundle "$bundle_path" \
            --sourcemap "$sourcemap_path" \
            --release "com.boardsesh.app@${BOARDSESH_MOBILE_VERSION}+${VERSION_CODE}" \
            --dist "${VERSION_CODE}"

      # Same decoupled, continue-on-error contract as the source-map upload above,
      # and for the same reason: a Sentry-side failure must never take down a
      # release that already built and verified. The Gradle-embedded upload stays
      # off (SENTRY_DISABLE_AUTO_UPLOAD) — this is not it. The Sentry Android
      # Gradle Plugin, which would normally inject the proguard-uuid and upload
      # the mapping, has never been applied here; instead the UUID is minted
      # before prebuild, baked into the manifest by
      # plugins/with-android-sentry-proguard-uuid.js, and forced onto the upload
      # with --uuid. Play is unaffected either way: AGP embeds the mapping in the
      # AAB, so a failure here costs Sentry deobfuscation only, never Play's.
      - name: Upload Sentry ProGuard mapping
        id: sentry_mapping
        if: env.SENTRY_UPLOAD_ENABLED == 'true'
        continue-on-error: true
        working-directory: packages/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # org/project come from this file, not CLI flags — same as the
          # source-map step above.
          SENTRY_PROPERTIES: android/sentry.properties
        run: |
          set -euo pipefail
          mapping=android/app/build/outputs/mapping/release/mapping.txt
          if [ ! -f "$mapping" ]; then
            echo "::error::No R8 mapping at $mapping — nothing to symbolicate against."
            exit 1
          fi
          if [ -z "${BOARDSESH_SENTRY_PROGUARD_UUID:-}" ]; then
            echo "::error::BOARDSESH_SENTRY_PROGUARD_UUID is unset, so the binary carries no proguard-uuid and an uploaded mapping could never be matched to it."
            exit 1
          fi
          # --require-one: without it a moved output path exits 0 having uploaded
          # nothing, which is the failure this whole step exists to prevent.
          ./node_modules/.bin/sentry-cli upload-proguard \
            --uuid "$BOARDSESH_SENTRY_PROGUARD_UUID" \
            --require-one \
            "$mapping"

      - name: Warn when the Sentry ProGuard mapping upload fails
        if: steps.sentry_mapping.outcome == 'failure'
        run: |
          echo "::warning::Sentry ProGuard mapping upload failed after the signed APK was built and verified. The release is unaffected, and Google Play still deobfuscates (the mapping ships inside the AAB). Android Java/Kotlin frames in Sentry will read as obfuscated symbols for this build until the mapping is uploaded by hand under UUID ${BOARDSESH_SENTRY_PROGUARD_UUID}."

      - name: Warn when Sentry source map upload fails
        if: steps.sentry_sourcemaps.outcome == 'failure'
        run: |
          echo "::warning::Sentry source map upload failed after the signed APK was built and verified. The release is unaffected; Android JS errors for this build will report unsymbolicated frames until this is investigated. Re-run 'node node_modules/@sentry/react-native/scripts/copy-debugid.js ...' + 'sentry-cli react-native gradle ...' manually from packages/mobile against the retained APK artifact's build outputs if needed."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-rn-android-${{ github.run_number }}
          path: packages/mobile/android/app/build/outputs/apk/release/boardsesh-android-beta-arm64-v8a.apk
          retention-days: 30
          if-no-files-found: error

      # The Play Store distributes app bundles, not APKs. Build the AAB from the
      # SAME prebuild + same env-conditional signingConfig + same versionCode as
      # the APK above (the `release` build type is shared), so the two channels
      # can never diverge. The arm64 APK remains a private diagnostic artifact;
      # this AAB is the Play channel (uploaded below, or by hand for the first
      # internal-track build).
      # SENTRY_DISABLE_AUTO_UPLOAD is forced true here for the same reason as
      # the APK build above.
      - name: Build signed release AAB
        id: build_aab
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/packages/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew bundleRelease --no-daemon --console=plain --stacktrace

      # Block the Play upload if any bundled native lib isn't 16 KB
      # page aligned (Android 15+ / API 35+ requirement). Covers both the sideload
      # APK and the Play AAB, so it checks the board-renderer JNI wrapper + prebuilt
      # Rust FFI lib, React Native's own libs, and every third-party lib in one pass.
      - name: Verify 16 KB native-library alignment (APK + AAB)
        # `mapfile` is a bash builtin; don't rely on the runner's default shell.
        shell: bash
        run: |
          set -euo pipefail
          # Check every release APK (any ABI split) and the AAB, not a hardcoded
          # name. The guard audits ALL bundled libs — ours plus React Native's and
          # every third-party native module — so a non-16-KB upstream lib will also
          # block the release (intentional: Play rejects the whole upload).
          mapfile -t archives < <(
            find packages/mobile/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk'
            find packages/mobile/android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab'
          )
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No release APK/AAB found to verify."
            exit 1
          fi
          ./scripts/check-16kb-alignment.sh "${archives[@]}"

      # Play deobfuscates from the mapping AGP embeds in the AAB, while Sentry
      # deobfuscates from the mapping.txt uploaded above. Assert they are the same
      # bytes: if they diverge, the two systems are symbolicating different builds
      # and neither failure is visible until someone reads a stack trace.
      - name: Verify the AAB carries the same R8 mapping
        run: |
          vp run check:mobile-android-obfuscation -- \
            --mapping packages/mobile/android/app/build/outputs/mapping/release/mapping.txt \
            --min-renamed-fraction 0.40 \
            --aab packages/mobile/android/app/build/outputs/bundle/release

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-rn-android-aab-${{ github.run_number }}
          path: packages/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn

      # Fastlane owns tester tracks, localized notes, and strict review behavior.
      # One edit assigns both tracks; candidate tags follow only after commit.
      - name: Upload AAB to Play internal and open beta tracks
        id: play_upload
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_VERSION_CODE: ${{ steps.version_code.outputs.value }}
          ANDROID_AAB_PATH: ${{ github.workspace }}/packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
        run: bundle exec fastlane android upload_beta

      # The public APK is the exact signed sibling of the AAB Play accepted. Its
      # immutable build-* tag keeps the release asset tied to one commit,
      # versionCode and native fingerprint; the newest prerelease naturally
      # appears first on the repository Releases page.
      - name: Prepare Android candidate metadata
        id: candidate_metadata
        if: steps.play_upload.outcome == 'success' && steps.build_aab.outcome == 'success' && env.FINGERPRINT_ANDROID != '' && steps.version_code.outputs.value != '' && env.BOARDSESH_MOBILE_VERSION != ''
        env:
          VERSION_CODE: ${{ steps.version_code.outputs.value }}
        run: |
          set -euo pipefail
          apk_path='packages/mobile/android/app/build/outputs/apk/release/boardsesh-android-beta-arm64-v8a.apk'
          [ -f "$apk_path" ] || {
            echo "::error::Signed APK is missing at $apk_path."
            exit 1
          }

          shortfp="$(printf '%s' "${FINGERPRINT_ANDROID:0:12}" | tr '[:upper:]' '[:lower:]')"
          build_tag="build-android-v${BOARDSESH_MOBILE_VERSION}-${VERSION_CODE}-${shortfp}"
          existing_target="$(
            git ls-remote --tags origin "refs/tags/$build_tag" "refs/tags/$build_tag^{}" | \
              awk -v direct="refs/tags/$build_tag" -v peeled="refs/tags/$build_tag^{}" \
                '$2 == direct { direct_sha = $1 } $2 == peeled { peeled_sha = $1 } END { print peeled_sha ? peeled_sha : direct_sha }'
          )"
          if [ -n "$existing_target" ] && [ "$existing_target" != "$GITHUB_SHA" ]; then
            echo "::error::$build_tag already points to $existing_target, expected $GITHUB_SHA."
            exit 1
          fi

          apk_sha256="$(sha256sum "$apk_path" | awk '{ print $1 }')"
          apk_size="$(stat --format='%s' "$apk_path")"
          echo "ANDROID_BUILD_TAG=$build_tag" >> "$GITHUB_ENV"
          echo "ANDROID_APK_SHA256=$apk_sha256" >> "$GITHUB_ENV"
          echo "ANDROID_APK_SIZE=$apk_size" >> "$GITHUB_ENV"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$apk_size" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT_ANDROID" >> "$GITHUB_OUTPUT"
          echo "mobile_version=$BOARDSESH_MOBILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Notify deployments channel
        if: steps.play_upload.outcome == 'success'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION_CODE: ${{ steps.version_code.outputs.value }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '📱 **Android release candidate submitted to Play internal + open beta** on `%s`\n• version: %s\n• versionCode: %s\n• Open beta availability depends on Google review and publishing.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$BOARDSESH_MOBILE_VERSION" "$VERSION_CODE" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Notify deployments channel of failure
        if: failure()
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '🚨 **Android release-candidate Play upload failed** on `%s`\n<%s>' \
            "${COMMIT_SHA:0:7}" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      - name: Clean up keystore
        if: always()
        run: rm -f packages/mobile/android/app/release.keystore

  record-candidate:
    needs: build-and-release
    # `!cancelled()` replaces the implicit success(), which also looks at
    # build-and-release's own needs: a failed play-review pre-check (which the
    # build deliberately ignores) would otherwise skip this job after the upload
    # to Play succeeded, leaving the upload without its build and fingerprint
    # tags, the OTA republish and the APK prerelease. Only the build's own
    # result decides here.
    if: ${{ !cancelled() && needs.build-and-release.result == 'success' && needs.build-and-release.outputs.candidate_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    permissions:
      contents: read
      # Dispatches the OTA republish below. `workflow_dispatch` is the documented
      # exception to "events triggered by GITHUB_TOKEN don't create a workflow run",
      # so the default token is enough — same as db-migration-renumber-dispatch.yml.
      # Deliberately NOT folded into the release-tag App token: that would hand
      # Actions:write to every token minted from that App.
      actions: write
    env:
      ANDROID_APK_SHA256: ${{ needs.build-and-release.outputs.apk_sha256 }}
      ANDROID_APK_SIZE: ${{ needs.build-and-release.outputs.apk_size }}
      ANDROID_BUILD_TAG: ${{ needs.build-and-release.outputs.build_tag }}
      BOARDSESH_MOBILE_VERSION: ${{ needs.build-and-release.outputs.mobile_version }}
      FINGERPRINT_ANDROID: ${{ needs.build-and-release.outputs.fingerprint }}
      VERSION_CODE: ${{ needs.build-and-release.outputs.version_code }}

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download signed APK from the Play-upload job
        uses: actions/download-artifact@v4
        with:
          name: boardsesh-rn-android-${{ github.run_number }}
          path: candidate-apk

      - name: Verify retained APK provenance
        run: |
          set -euo pipefail
          apk_path='candidate-apk/boardsesh-android-beta-arm64-v8a.apk'
          [ -f "$apk_path" ] || {
            echo "::error::Retained signed APK is missing at $apk_path."
            exit 1
          }
          actual_sha256="$(sha256sum "$apk_path" | awk '{ print $1 }')"
          actual_size="$(stat --format='%s' "$apk_path")"
          [ "$actual_sha256" = "$ANDROID_APK_SHA256" ] || {
            echo "::error::Retained APK SHA-256 $actual_sha256 does not match build output $ANDROID_APK_SHA256."
            exit 1
          }
          [ "$actual_size" = "$ANDROID_APK_SIZE" ] || {
            echo "::error::Retained APK size $actual_size does not match build output $ANDROID_APK_SIZE."
            exit 1
          }

      - name: Mint repository App token for protected release tags
        id: tag_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
          permission-contents: write

      # Publish the exact versionCode lookup and fingerprint gate. A new
      # fingerprint publishes both atomically; a forced rebuild preserves the
      # existing fingerprint tag and adds only its new build-number tag.
      - name: Tag the uploaded Android build and fingerprint
        env:
          GH_APP_TOKEN: ${{ steps.tag_token.outputs.token }}
        run: |
          set -euo pipefail
          git_auth="$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 | tr -d '\n')"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          shortfp="$(printf '%s' "${FINGERPRINT_ANDROID:0:12}" | tr '[:upper:]' '[:lower:]')"
          expected_build_tag="build-android-v${BOARDSESH_MOBILE_VERSION}-${VERSION_CODE}-${shortfp}"
          if [ "$ANDROID_BUILD_TAG" != "$expected_build_tag" ]; then
            echo "::error::Prepared build tag $ANDROID_BUILD_TAG does not match $expected_build_tag."
            exit 1
          fi
          build_tag="$ANDROID_BUILD_TAG"
          fingerprint_tag="fingerprint-android-${FINGERPRINT_ANDROID}"
          remote_target() {
            local tag="$1"
            git ls-remote --tags "$remote" "refs/tags/$tag" "refs/tags/$tag^{}" | \
              awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" \
                '$2 == direct { direct_sha = $1 } $2 == peeled { peeled_sha = $1 } END { print peeled_sha ? peeled_sha : direct_sha }'
          }
          assert_missing_or_exact() {
            local tag="$1"
            local target="$2"
            if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points to $target, expected $GITHUB_SHA."
              exit 1
            fi
          }
          clear_git_auth() {
            git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
          }
          authenticated_push() {
            local push_status
            clear_git_auth
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $git_auth"
            set +e
            git push "$@"
            push_status=$?
            set -e
            clear_git_auth
            return "$push_status"
          }
          publish_build_tag() {
            local target
            target="$(remote_target "$build_tag")"
            assert_missing_or_exact "$build_tag" "$target"
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "::notice::$build_tag already points to this build."
              return 0
            fi
            git tag --force "$build_tag" "$GITHUB_SHA"
            if authenticated_push "$remote" "refs/tags/$build_tag"; then
              echo "::notice::Tagged exact uploaded build $build_tag."
              return 0
            fi
            target="$(remote_target "$build_tag")"
            assert_missing_or_exact "$build_tag" "$target"
            [ "$target" = "$GITHUB_SHA" ] || {
              echo "::error::Failed to publish exact uploaded build tag $build_tag."
              return 1
            }
            echo "::notice::A concurrent retry already published $build_tag at this build."
          }
          trap clear_git_auth EXIT

          build_target="$(remote_target "$build_tag")"
          fingerprint_target="$(remote_target "$fingerprint_tag")"
          assert_missing_or_exact "$build_tag" "$build_target"
          if [ -n "$fingerprint_target" ]; then
            publish_build_tag
            echo "::notice::Preserved immutable $fingerprint_tag at $fingerprint_target."
          else
            git tag --force "$build_tag" "$GITHUB_SHA"
            git tag --force "$fingerprint_tag" "$GITHUB_SHA"
            if authenticated_push --atomic "$remote" "refs/tags/$build_tag" "refs/tags/$fingerprint_tag"; then
              echo "::notice::Atomically tagged $build_tag and $fingerprint_tag."
            else
              fingerprint_target="$(remote_target "$fingerprint_tag")"
              if [ -z "$fingerprint_target" ]; then
                echo '::error::Atomic tag push failed without publishing the fingerprint gate.'
                exit 1
              fi
              publish_build_tag
              echo "::notice::A concurrent build established $fingerprint_tag; preserved it and published $build_tag."
            fi
          fi
          unset git_auth

      # Un-strand the binary we just uploaded — see the matching step in
      # ios-testflight-rn.yml for the full reasoning. Short version: expo-updates
      # launches whichever update has the newest commitTime, and this binary stamped
      # its embedded bundle at build time, so an OTA published from a later commit
      # while we were building is already older than it and would never apply.
      # Dispatched per-platform: iOS and Android resolve different fingerprints, so
      # one republish cannot cover the other. Non-blocking — the Play upload has
      # already succeeded. Dispatched against the branch that BUILT
      # (github.ref_name): a train binary's fingerprint only exists on
      # release/next, so a `--ref main` dispatch could never reach it.
      - name: Republish the production OTA so it outranks this build
        if: env.FINGERPRINT_ANDROID != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mobile-ota-production.yml \
            --ref "${{ github.ref_name }}" \
            -f platform=android \
            -f expect_fingerprint="$FINGERPRINT_ANDROID"
          echo "::notice::Dispatched a production OTA republish for Android fingerprint $FINGERPRINT_ANDROID."

      - name: Check whether this build can publish the Android beta
        id: prerelease_eligibility
        env:
          GH_TOKEN: ${{ steps.tag_token.outputs.token }}
        run: |
          set -euo pipefail
          # Both trusted release branches publish the exact accepted beta APK.
          if [ "$GITHUB_REF" != 'refs/heads/main' ] && \
             [ "$GITHUB_REF" != 'refs/heads/release/next' ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Only main and release/next builds publish the Android beta prerelease.'
            exit 0
          fi

          build_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ANDROID_BUILD_TAG" --jq '.object.sha')"
          [ "$build_target" = "$GITHUB_SHA" ] || {
            echo "::error::$ANDROID_BUILD_TAG points to $build_target, expected $GITHUB_SHA."
            exit 1
          }
          fingerprint_tag="fingerprint-android-${FINGERPRINT_ANDROID}"
          fingerprint_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$fingerprint_tag" --jq '.object.sha')"
          [ -n "$fingerprint_target" ] || {
            echo "::error::$fingerprint_tag was not published."
            exit 1
          }
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      # Keep the release hidden until its downloaded asset matches the exact
      # APK retained from the Play-upload job. An interrupted retry therefore
      # cannot expose new metadata with a missing or stale file.
      - name: Stage Android APK GitHub prerelease
        id: github_release
        if: steps.prerelease_eligibility.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ steps.tag_token.outputs.token }}
          tag_name: ${{ env.ANDROID_BUILD_TAG }}
          target_commitish: ${{ github.sha }}
          name: Boardsesh Android Beta v${{ env.BOARDSESH_MOBILE_VERSION }} (${{ env.VERSION_CODE }})
          body: |
            Signed Android beta from `${{ github.ref_name }}` at commit `${{ github.sha }}`.

            - Package: `com.boardsesh.app`
            - Architecture: arm64-v8a (modern physical Android devices)
            - Version: `${{ env.BOARDSESH_MOBILE_VERSION }}`
            - versionCode: `${{ env.VERSION_CODE }}`
            - APK SHA-256: `${{ env.ANDROID_APK_SHA256 }}`
            - APK bytes: `${{ env.ANDROID_APK_SIZE }}`
            - Native fingerprint: `${{ env.FINGERPRINT_ANDROID }}`
            - Workflow: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

            This is the same signed build that accompanied the AAB uploaded to Play internal.

            **Play Store users:** do not install this APK over a Play-installed copy. Google
            re-signs Play downloads with a different key, so Android rejects cross-channel
            upgrades. Use the Play internal-testing track instead.
          files: candidate-apk/boardsesh-android-beta-arm64-v8a.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: true
          prerelease: true
          make_latest: false

      - name: Verify staged GitHub release APK
        if: steps.prerelease_eligibility.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.tag_token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published-apk"
          gh release download "$ANDROID_BUILD_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'boardsesh-android-beta-arm64-v8a.apk' \
            --dir "$RUNNER_TEMP/published-apk"
          published_apk="$RUNNER_TEMP/published-apk/boardsesh-android-beta-arm64-v8a.apk"
          published_sha256="$(sha256sum "$published_apk" | awk '{ print $1 }')"
          published_size="$(stat --format='%s' "$published_apk")"
          [ "$published_sha256" = "$ANDROID_APK_SHA256" ] || {
            echo "::error::Staged release APK SHA-256 $published_sha256 does not match $ANDROID_APK_SHA256."
            exit 1
          }
          [ "$published_size" = "$ANDROID_APK_SIZE" ] || {
            echo "::error::Staged release APK size $published_size does not match $ANDROID_APK_SIZE."
            exit 1
          }

      - name: Publish verified Android APK prerelease
        if: steps.prerelease_eligibility.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.tag_token.outputs.token }}
        run: |
          set -euo pipefail
          gh release edit "$ANDROID_BUILD_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
          echo "::notice::Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${ANDROID_BUILD_TAG}"

      - name: Notify deployments channel of candidate-publication failure
        if: failure()
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          content="$(printf '🚨 **Android beta publication failed** on `%s`\n• Play upload already succeeded; rerun failed jobs to repair tags or the APK prerelease.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$RUN_URL")"
          jq -n --arg content "$content" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"
