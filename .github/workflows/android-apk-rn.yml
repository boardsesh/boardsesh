name: Android APK Build (React Native)

# Builds a signed, sideloadable arm64 release APK for the React Native rewrite
# (packages/mobile/) and attaches it to a GitHub Release, plus a signed AAB
# (same versionCode / signing) for the Google Play internal track. Unlike the
# Capacitor app (.github/workflows/android-release.yml), packages/mobile/ is a
# managed Expo project with no committed android/ — it's generated by `expo
# prebuild`. Android builds fine on a free Linux runner, so no macOS needed (cf.
# the iOS RN workflow ios-testflight-rn.yml, which mirrors this prebuild flow).

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - '.github/workflows/android-apk-rn.yml'
  workflow_dispatch:
    inputs:
      version_code_offset:
        description: 'Added to GH run_number for versionCode (raise to clear collisions / always supersede the Capacitor app)'
        required: false
        default: '2000000'

concurrency:
  group: android-apk-rn-${{ github.ref }}
  # Don't cancel an in-flight run: it may be between `assembleRelease` and the
  # GitHub Release publish, where a cancel could leave a tag with no asset.
  cancel-in-progress: false

permissions:
  contents: write # required for softprops/action-gh-release

# ─── SHARED BUILD ENV (workflow-level) ───────────────────────────────────────
# Declared at the workflow level so the cheap `gate` job (fingerprint resolve)
# and the `build-and-release` job (expo prebuild) resolve a byte-identical config
# and can't drift. MUST stay identical to ios-testflight-rn.yml /
# mobile-ota-production.yml — scripts/mobile-ci-env-parity.test.ts fails the
# build if they do. Config-affecting vars (EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID,
# GOOGLE_MAPS_API_KEY, EXPO_UPDATES_URL, EXPO_UPDATES_CHANNEL) move the
# fingerprint runtimeVersion directly; the rest reach it via the hashed .env file
# the jobs write. Don't add other fingerprint-affecting vars here (EAS_BUILD,
# EAS_BUILD_PROFILE, BOARDSESH_APP_VARIANT, …) — they're unset in the build too.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  # Self-hosted OTA (expo-open-ota). EXPO_UPDATES_URL is the server's manifest
  # endpoint (e.g. https://ota.boardsesh.com/manifest), set as a repo variable
  # so the domain isn't hardcoded; until it's set, app.config.ts falls back to
  # the EAS URL and OTA stays inert (harmless). The channel is baked into the
  # binary via AndroidManifest by `expo prebuild`. See docs/mobile-ota-updates.md.
  EXPO_UPDATES_CHANNEL: production
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  # NOTE: currently inert at runtime — the mobile app has no
  # @sentry/react-native wiring (no Sentry.init, no src/lib/sentry.ts), so this
  # DSN is not read by the running app; client-side errors go to PostHog only
  # (reportError → captureError). Kept so adding Sentry later needs no workflow
  # change. Same DSN/project as web + backend; not secret — already hardcoded
  # in packages/web and packages/backend source.
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  # PostHog product analytics. Intentionally the SAME project token as web
  # (vars.NEXT_PUBLIC_POSTHOG_KEY) so a signed-in user's web + mobile activity
  # resolves to one person. EXPO_PUBLIC_* vars are inlined into the JS bundle at
  # build time; without this, analytics.ts sees no key and isAnalyticsEnabled is
  # false, so every track() silently no-ops (the app shipped zero events before).
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Android Google Maps key, baked into the resolved android.config at prebuild
  # time when present (the build succeeds without it; the board-search map just
  # stays blank). It changes the Android fingerprint, so both the gate's resolve
  # and the build's prebuild read it from here. iOS never sets it (Apple Maps),
  # which is why the per-platform fingerprints differ.
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  # Fingerprint gate: resolve the Android runtimeVersion fingerprint and skip the
  # native build when a binary with that fingerprint already shipped (a
  # fingerprint-android-<hash> tag exists). The OTA publish
  # (mobile-ota-production.yml) still delivers the JS to matching binaries. The
  # build job re-resolves and tags THAT value on success. Gate + build both run
  # on Linux, so the fingerprints match exactly. See docs/mobile-ota-updates.md.
  gate:
    # Push is always on main; a manual dispatch (any branch) always builds, so
    # `workflow_dispatch` keeps producing an APK artifact off a feature branch.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # GOOGLE_MAPS_API_KEY is a Production-environment secret, and it changes the
    # resolved android.config — hence the fingerprint. Without `environment:
    # Production` the gate reads an EMPTY key and resolves a map-less hash that
    # never matches the with-maps binary, so Android would always rebuild. Scope
    # to Production on main only: the env is main-only by branch policy, and a
    # non-main dispatch always builds anyway (it never reaches the tag check, so
    # it doesn't need the key).
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.fp.outputs.should_build }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node.js dependencies (workspace root)
        run: bun install --frozen-lockfile

      # The .env is hashed into the fingerprint, so it must be byte-identical to
      # the build job's (same heredoc + same workflow env) or the gate would
      # resolve a different fingerprint than the build bakes.
      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EOF

      - name: Resolve fingerprint and check for an existing native build
        id: fp
        run: |
          set -uo pipefail
          # GOOGLE_MAPS_API_KEY is inherited from the workflow env (it changes the
          # Android fingerprint, so the resolve must match the build's prebuild).
          raw="$(cd packages/mobile && bunx expo-updates runtimeversion:resolve --platform android 2>/dev/null || true)"
          fp="$(printf '%s' "$raw" | jq -r '.runtimeVersion // empty' 2>/dev/null || true)"
          if ! printf '%s' "$fp" | grep -qiE '^[0-9a-f]{8,}$'; then
            echo "::warning::Could not resolve the Android fingerprint — building to be safe."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual dispatch — building Android regardless of fingerprint $fp."
            exit 0
          fi
          tag="fingerprint-android-$fp"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android fingerprint $fp already built (tag $tag) — skipping the native build; the OTA delivers the JS."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Android fingerprint $fp is new — running the native build."
          fi

  build-and-release:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scopes the job to the Production GitHub Environment so it can read the
    # signing and deployment-notification secrets.
    environment: Production
    # Shared EXPO_PUBLIC_* / EXPO_UPDATES_* / GOOGLE_MAPS_API_KEY env lives at the
    # workflow level (above) so the gate and build jobs resolve a byte-identical
    # fingerprint.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node.js dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rn-${{ hashFiles('packages/mobile/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EOF

      # @sentry/react-native's Gradle upload task currently calls an API that is
      # incompatible with the Gradle version generated by Expo prebuild
      # (`Could not find method exec()` on the upload task). Keep runtime Sentry
      # enabled through EXPO_PUBLIC_SENTRY_DSN, but do not let source-map upload
      # block the Android release build.
      - name: Disable Sentry source map upload
        run: |
          echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          echo "::warning::Sentry source-map upload is disabled for Android release builds until the Gradle upload task is compatible with the generated Gradle version."

      # Re-resolve the fingerprint (Linux, same runner class as the gate) before
      # prebuild, and tag this value on a successful release (final tag step).
      # GOOGLE_MAPS_API_KEY is inherited from the workflow env.
      - name: Resolve fingerprint for tagging
        run: |
          set -uo pipefail
          raw="$(cd packages/mobile && bunx expo-updates runtimeversion:resolve --platform android 2>/dev/null || true)"
          fp="$(printf '%s' "$raw" | jq -r '.runtimeVersion // empty' 2>/dev/null || true)"
          if ! printf '%s' "$fp" | grep -qiE '^[0-9a-f]{8,}$'; then
            echo "::warning::Could not resolve the Android fingerprint on the build runner — the fingerprint tag will be skipped (the next push rebuilds)."
          else
            echo "FINGERPRINT_ANDROID=$fp" >> "$GITHUB_ENV"
            if [ "$fp" != "${{ needs.gate.outputs.fingerprint }}" ]; then
              echo "::warning::Android fingerprint differs between the gate (${{ needs.gate.outputs.fingerprint }}) and this build ($fp) — both run on Linux, so this is unexpected; investigate."
            fi
          fi

      - name: Expo prebuild (generate android/)
        working-directory: packages/mobile
        # GOOGLE_MAPS_API_KEY is inherited from the workflow env (baked into the
        # resolved android.config at prebuild time when present).
        run: bunx expo prebuild --platform android --clean --no-install

      # versionCode = max(sideload floor, Play track ceiling + 1), resolved by
      # `fastlane android next_version_code`. The sideload floor is the
      # deterministic offset + run_number line below (VERSION_CODE_FALLBACK) — it
      # is the versionCode every GitHub Release sideload APK has shipped, so it's
      # the LIVE ceiling of the channel users sideload (~2_000_2xx). The Play
      # internal track sits in the low hundreds, so it can only RAISE the number,
      # never lower it: deriving from Play alone regressed the shared versionCode
      # from 2_000_285 (build 285) to 190 (build 289), which Android rejects as
      # INSTALL_FAILED_VERSION_DOWNGRADE on every sideload upgrade. See
      # docs/android-sideload-build.md.
      # NOTE: github.run_number resets to 1 if this workflow file is renamed or
      # recreated — if you do that, bump version_code_offset past the current
      # production ceiling via the workflow_dispatch input first, or the floor
      # drops below installed builds and new APKs become un-installable.
      - name: Compute version code
        id: version_code
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          offset=${{ github.event.inputs.version_code_offset || '2000000' }}
          export VERSION_CODE_FALLBACK=$(( offset + ${{ github.run_number }} ))
          bundle exec fastlane android next_version_code
          echo "versionCode: $(grep '^value=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

      - name: Set version code
        run: |
          set -euo pipefail
          code=${{ steps.version_code.outputs.value }}
          [ -n "${code}" ] || { echo "::error::Computed version code is empty"; exit 1; }
          sed -Ei "s/^([[:space:]]*)versionCode .*/\\1versionCode ${code}/" packages/mobile/android/app/build.gradle
          echo "versionCode set to ${code} (versionName comes from app.config.ts)"

      - name: Resolve mobile app version
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const appConfig = fs.readFileSync('packages/mobile/app.config.ts', 'utf8');
          const versionMatch = appConfig.match(/\bversion:\s*['"]([^'"]+)['"]/);
          if (!versionMatch) {
            throw new Error('Could not find version in packages/mobile/app.config.ts');
          }

          const version = versionMatch[1];
          const [major, minor] = version.split('.');
          if (!major || !minor) {
            throw new Error(`Expected semver-like app version, got: ${version}`);
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `BOARDSESH_MOBILE_VERSION=${version}`,
              `BOARDSESH_ANDROID_RELEASE_TAG=rn-android-${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`,
            ].join('\n') + '\n',
          );
          NODE

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > packages/mobile/android/app/release.keystore

      - name: Build signed arm64 release APK
        working-directory: packages/mobile/android
        env:
          # Read by the release signingConfig injected via the
          # with-android-release-signing config plugin (same env-var names as the
          # Capacitor app's build.gradle, so the secrets line up 1:1).
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/packages/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Keep source-map upload disabled even if the Production environment
          # has a Sentry token. Runtime Sentry remains enabled via the DSN above.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PboardseshAbiFilters=arm64-v8a --no-daemon --console=plain --stacktrace

      # Guard against shipping an unsigned / debug-signed APK as if it were the
      # release build: assert the artifact verifies and log its signer cert so
      # the signing key is auditable in the run log.
      - name: Verify APK signature
        run: |
          release_dir=packages/mobile/android/app/build/outputs/apk/release
          release_asset="${release_dir}/boardsesh-rn-android-arm64-v8a.apk"
          mapfile -t apks < <(find "$release_dir" -maxdepth 1 -type f -name '*.apk' ! -name 'boardsesh-rn-android-arm64-v8a.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Gradle-produced release APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)"
          echo "Verifying $apk with $apksigner"
          "$apksigner" verify --print-certs "$apk"
          cp -f "$apk" "$release_asset"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-rn-android-${{ github.run_number }}
          path: packages/mobile/android/app/build/outputs/apk/release/boardsesh-rn-android-arm64-v8a.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        id: github_release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.BOARDSESH_ANDROID_RELEASE_TAG }}
          name: Boardsesh RN Android ${{ env.BOARDSESH_MOBILE_VERSION }} (build ${{ github.run_number }})
          body: |
            React Native rewrite — Android sideload build from commit ${{ github.sha }}.

            **Package:** `com.boardsesh.app` (version ${{ env.BOARDSESH_MOBILE_VERSION }})
            **Minimum Android version:** 7.0 (API 24)
            **APK architecture:** arm64-v8a

            Sideload `boardsesh-rn-android-arm64-v8a.apk`. It's signed with the
            same key as the current app, so it upgrades an existing
            `com.boardsesh.app` install in place — no need to uninstall first.
          files: |
            packages/mobile/android/app/build/outputs/apk/release/boardsesh-rn-android-arm64-v8a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify deployments channel
        if: github.ref == 'refs/heads/main' && steps.github_release.outcome == 'success'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.BOARDSESH_ANDROID_RELEASE_TAG }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          MOBILE_VERSION: ${{ env.BOARDSESH_MOBILE_VERSION }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '📱 **Android RN release published** on `%s`\n• release: <%s>\n• version: %s\n• APK: arm64-v8a\n<%s>' \
            "${COMMIT_SHA:0:7}" "$RELEASE_URL" "$MOBILE_VERSION" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      # The Play Store distributes app bundles, not APKs. Build the AAB from the
      # SAME prebuild + same env-conditional signingConfig + same versionCode as
      # the APK above (the `release` build type is shared), so the two channels
      # can never diverge. The arm64 APK stays the sideload channel (GitHub
      # Release above); this AAB is the Play channel (uploaded in a later phase /
      # by hand for the first internal-track build).
      # SENTRY_DISABLE_AUTO_UPLOAD is forced true here for the same reason as the
      # APK build: the Sentry Gradle upload task is currently incompatible with
      # the generated Gradle version.
      - name: Build signed release AAB
        id: build_aab
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/packages/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew bundleRelease --no-daemon --console=plain --stacktrace

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-rn-android-aab-${{ github.run_number }}
          path: packages/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn

      # Gate the Play upload on the service-account secret so the build stays
      # green before the one-time Play Console bootstrap (create the app + hand-
      # upload the first AAB + link the service account — the Play API cannot do
      # the initial upload). See docs/android-sideload-build.md. Mirrors the
      # Sentry gate above.
      - name: Configure Play upload
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_UPLOAD_ENABLED=true" >> "$GITHUB_ENV"
            echo "Play service account present — will upload the AAB to the internal track."
          else
            echo "PLAY_UPLOAD_ENABLED=false" >> "$GITHUB_ENV"
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload (first upload is manual; see docs/android-sideload-build.md)."
          fi

      # Play "What's new" for this release, from the source-controlled changelog
      # (fastlane/metadata/android/en-US/changelogs/default.txt). r0adkll expects
      # <dir>/whatsnew-<locale>; Play caps the note at 500 characters.
      - name: Stage Play release notes
        if: github.ref == 'refs/heads/main' && env.PLAY_UPLOAD_ENABLED == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/play-whatsnew"
          cp fastlane/metadata/android/en-US/changelogs/default.txt "${RUNNER_TEMP}/play-whatsnew/whatsnew-en-US"

      - name: Upload AAB to Play internal track
        id: play_upload
        if: github.ref == 'refs/heads/main' && env.PLAY_UPLOAD_ENABLED == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.boardsesh.app
          releaseFiles: packages/mobile/android/app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/play-whatsnew

      - name: Warn when Play upload fails
        if: github.ref == 'refs/heads/main' && env.PLAY_UPLOAD_ENABLED == 'true' && steps.play_upload.outcome == 'failure'
        run: |
          echo "::warning::Play upload failed after the signed APK/AAB were built and the GitHub Release was published. If Play reports 'You must let us know whether your app uses any Foreground Service permissions', complete Play Console > App content > Foreground services for FOREGROUND_SERVICE_CONNECTED_DEVICE, then rerun the workflow or upload the AAB artifact manually."

      # Record that a binary with this fingerprint shipped, so future JS-only
      # pushes with the same fingerprint skip this build (the gate checks for the
      # tag). Gated on the reliable, always-on signals that a native binary with
      # this fingerprint exists and is distributed:
      #   - github_release succeeded → the sideload APK shipped;
      #   - build_aab succeeded → a failed AAB build must NOT tag (else the next
      #     push wrongly skips before any AAB exists).
      # NOT gated on the Play upload: it's best-effort (continue-on-error) and can
      # fail for Console-policy reasons (e.g. the Foreground-services declaration)
      # that have nothing to do with the binary. Coupling the fingerprint tag to
      # Play would let a persistent Play-Console issue permanently disable Android
      # gating (rebuild forever). The Play channel keeps its own failure warning +
      # manual-retry path; a missed Play upload is recovered by re-uploading the
      # retained AAB artifact, not by rebuilding identical native binaries.
      # Idempotent for concurrent runs.
      - name: Tag the shipped Android fingerprint
        if: github.ref == 'refs/heads/main' && steps.github_release.outcome == 'success' && steps.build_aab.outcome == 'success' && env.FINGERPRINT_ANDROID != ''
        run: |
          set -uo pipefail
          tag="fingerprint-android-${FINGERPRINT_ANDROID}"
          git tag "$tag" "$GITHUB_SHA" 2>/dev/null || true
          if git push origin "refs/tags/$tag"; then
            echo "::notice::Tagged $tag — future JS-only pushes with this fingerprint skip the Android native build."
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists (concurrent run) — nothing to do."
          else
            echo "::error::Failed to push $tag."
            exit 1
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f packages/mobile/android/app/release.keystore
