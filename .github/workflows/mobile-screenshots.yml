name: Mobile Screenshots (Native)

# Captures native App Store / Play Store / onboarding screenshots from the RN app
# via Maestro (scripts/mobile-screenshots.ts) and uploads them as artifacts.
# Manual + nightly only — never gates PRs.
#
# The screenshot app is a Debug dev-client that loads its JS from Metro, so the
# native .app is reusable: it's cached (actions/cache) keyed on native inputs and
# only rebuilt when those change. A JS-only run is a cache hit → install + Metro +
# Maestro (~5 min) instead of a ~30-min from-scratch native compile.
#
# All runs capture against PROD signed in as the test user (the canonical store
# recipe), so there's no local backend / Colima — the build just talks to the
# production backend.
#
# On a manual dispatch with `upload = true`, it also uploads the freshly captured
# screenshots via fastlane (fastlane/Fastfile, screenshots ONLY — no binary or
# text metadata). The nightly cron never uploads (it only captures); uploading
# mutates live store listing assets, so it's opt-in per dispatch.

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'Maestro flow to run'
        type: choice
        default: app-store
        options:
          - app-store
          - onboarding
      device:
        description: 'iOS simulator device name'
        type: string
        default: 'iPhone 16 Pro Max'
      android_device:
        description: 'Android emulator device label used for screenshot output'
        type: string
        default: 'Pixel 2'
      upload:
        description: 'Upload captured screenshots to App Store Connect and Google Play. Never runs on the nightly cron.'
        type: boolean
        default: false
  schedule:
    # 06:00 UTC nightly — regenerate the artifact off the latest main.
    - cron: '0 6 * * *'

concurrency:
  group: mobile-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90

    env:
      # Marks an upload dispatch — gates the App Store Connect upload steps so the
      # nightly cron and capture-only runs never touch ASC.
      UPLOAD_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
      # Reused from ios-rn-ci.yml so the Expo build links the same native config.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # The prod test/demo account the Maestro flow signs in with. Override via
      # repo secrets if a different account is ever needed.
      SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL || 'test@boardsesh.com' }}
      SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD || 'test' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Install Node.js dependencies
        run: bun install --frozen-lockfile

      # Restore the prebuilt simulator dev-client .app. It's a dev-client shell
      # that loads its JS from Metro, so the native binary only changes when
      # NATIVE inputs change — the key hashes exactly those (Expo/RN/native-module
      # versions in packages/mobile/package.json, native config in app.config.ts,
      # the config plugins + native modules, patch-package patches, and the root
      # @expo/cli / react-native-screens pins). JS/TS-only and web-only changes
      # (incl. bun.lock churn) do NOT bust it, so the common path is a cache hit
      # and skips the ~30-min native build. Bump `-v1-` to force a rebuild.
      # runner.arch is in the key because a simulator .app is arch-specific.
      - name: Restore prebuilt simulator app
        id: app-cache
        uses: actions/cache@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ runner.os }}-${{ runner.arch }}-screenshot-sim-app-v1-${{ hashFiles('packages/mobile/app.config.ts', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/package.json', 'patches/**', 'package.json') }}

      # Cache miss (a native-input change) → build the .app from scratch with
      # xcodebuild (runs to completion; no `expo run:ios` launch-step hang).
      # actions/cache saves packages/mobile/.app-cache at job end for the next run.
      - name: Build simulator dev-client app
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: vp run mobile:build-sim-app -- --app-out packages/mobile/.app-cache --clean

      - name: Install Maestro
        # Pinned to a specific GitHub Releases asset and verified against a
        # checksum committed in this repo — NOT `curl … get.maestro.mobile.dev | bash`,
        # whose redirect target isn't pinned and would run arbitrary code on the
        # runner if compromised. Because MAESTRO_SHA256 lives in version control,
        # a swapped release asset fails the checksum gate here. Bump the version +
        # hash together (from the release's checksums_sha256.txt) after
        # re-validating the flow locally.
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
        run: |
          set -euo pipefail
          url="https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL "$url" -o maestro.zip
          echo "${MAESTRO_SHA256}  maestro.zip" | shasum -a 256 -c -
          unzip -q maestro.zip -d "$HOME/.maestro-dist"
          echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"

      - name: Capture screenshots
        # Installs the prebuilt .app, starts Metro with the screenshot env, and
        # runs Maestro — no native build on this path. Always against prod (signed
        # in as the test user); no EXPO_PUBLIC_BACKEND_URL override, so the bundle
        # uses the app's production backend defaults.
        run: |
          set -euo pipefail
          vp run mobile:screenshots -- \
            --platform ios \
            --flow "${{ inputs.flow || 'app-store' }}" \
            --backend prod \
            --device "${{ inputs.device || 'iPhone 16 Pro Max' }}" \
            --app-path packages/mobile/.app-cache/Boardsesh.app

      # On a capture failure, save Maestro's debug output (the failure screenshot +
      # view hierarchy) and the simulator's Boardsesh logs, so we can see what was
      # on screen and whether the dev-client/JS loaded. Best-effort — never fails
      # the job. The Maestro tests dir is under $HOME (actions/upload-artifact
      # doesn't expand ~), so copy it into the workspace first.
      - name: Collect capture debug artifacts
        if: failure()
        run: |
          mkdir -p capture-debug
          cp -R "$HOME/.maestro/tests" capture-debug/maestro-tests 2>/dev/null || echo "no maestro tests dir"
          xcrun simctl spawn booted log show --last 10m --predicate 'process == "Boardsesh"' \
            > capture-debug/device-boardsesh.log 2>&1 || echo "device log capture skipped"

      - name: Upload capture debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-debug
          path: capture-debug/**
          if-no-files-found: warn
          retention-days: 14

      # Fail loudly if any capture isn't an App Store-accepted size for its slot,
      # so deliver can't get silently rejected by Apple (or route to the wrong
      # slot). Runs on every capture, including nightly — an early warning if a
      # future simulator/Xcode bump changes the capture resolution.
      - name: Assert screenshot dimensions
        run: vp run check:screenshot-dimensions -- --platform ios

      # --- Upload to App Store Connect (manual dispatch only; never on cron) ---
      # Screenshots ONLY — no binary, no metadata, no review submission. Gated
      # behind the `upload` input, which is unset on the schedule cron. The
      # `success() &&` prefix is required: a custom `if:` overrides the default
      # success() status check, so without it these would run even if capture failed.
      - name: Set up Ruby + fastlane
        if: success() && env.UPLOAD_RUN == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Decode App Store Connect API key
        if: success() && env.UPLOAD_RUN == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_ID."; exit 1; }
          [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_BASE64."; exit 1; }
          mkdir -p "$HOME/.private_keys"
          key_path="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || { echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 did not decode to an App Store Connect private key."; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Upload screenshots to App Store Connect
        if: success() && env.UPLOAD_RUN == 'true'
        working-directory: fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
          # The Fastfile uses deliver's `sync_screenshots: true`, which is still a
          # beta feature; without this acknowledgement flag deliver hard-errors
          # ("Please set a value to FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS").
          FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS: 'true'
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID."; exit 1; }
          bundle exec fastlane ios screenshots

      - name: Clean up App Store Connect key
        if: always()
        run: rm -f "$HOME/.private_keys/AuthKey_"*.p8 2>/dev/null || true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots-ios
          path: app-stores/apple/screenshots/**
          if-no-files-found: warn
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      UPLOAD_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
      EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
      EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
      EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_SCREENSHOT_MODE: '1'
      EXPO_PUBLIC_SCREENSHOT_THEME: dark
      EXPO_PUBLIC_SCREENSHOT_WORKOUT: volume
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL || 'test@boardsesh.com' }}
      SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD || 'test' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Install Node.js dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rn-screenshots-${{ hashFiles('packages/mobile/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-screenshots-

      - name: Write .env for screenshot bundle
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SCREENSHOT_MODE=$EXPO_PUBLIC_SCREENSHOT_MODE
          EXPO_PUBLIC_SCREENSHOT_THEME=$EXPO_PUBLIC_SCREENSHOT_THEME
          EXPO_PUBLIC_SCREENSHOT_WORKOUT=$EXPO_PUBLIC_SCREENSHOT_WORKOUT
          EXPO_PUBLIC_SCREENSHOT_USER_EMAIL=$SCREENSHOT_USER_EMAIL
          EXPO_PUBLIC_SCREENSHOT_USER_PASSWORD=$SCREENSHOT_USER_PASSWORD
          EOF

      - name: Expo prebuild (generate android/)
        working-directory: packages/mobile
        env:
          TAILSCALE_HOSTS: ''
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Build x86_64 screenshot APK
        working-directory: packages/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -PboardseshAbiFilters=x86_64 --no-daemon --console=plain --stacktrace

      - name: Normalize screenshot APK path
        run: |
          set -euo pipefail
          release_dir=packages/mobile/android/app/build/outputs/apk/release
          mapfile -t apks < <(find "$release_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one screenshot APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          cp -f "${apks[0]}" /tmp/boardsesh-screenshot.apk

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
        run: |
          set -euo pipefail
          url="https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL "$url" -o maestro.zip
          echo "${MAESTRO_SHA256}  maestro.zip" | shasum -a 256 -c -
          unzip -q maestro.zip -d "$HOME/.maestro-dist"
          echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"

      - name: Capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb shell wm size 1080x1920
            adb shell wm density 420
            vp run mobile:screenshots -- \
              --platform android \
              --flow "${{ inputs.flow || 'app-store' }}" \
              --backend prod \
              --device "${{ inputs.android_device || 'Pixel 2' }}" \
              --app-path /tmp/boardsesh-screenshot.apk

      - name: Assert screenshot dimensions
        run: vp run check:screenshot-dimensions -- --platform android

      - name: Set up Ruby + fastlane
        if: success() && env.UPLOAD_RUN == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Upload screenshots to Google Play
        if: success() && env.UPLOAD_RUN == 'true'
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."; exit 1; }
          bundle exec fastlane android screenshots

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots-android
          path: app-stores/google/screenshots/**
          if-no-files-found: warn
          retention-days: 14
