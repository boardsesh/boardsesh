name: Garmin CI

# Compile gate for the Connect IQ watch app in garmin/. Runs only when that
# directory changes -- the app has no JS, no package.json, and is not a pnpm
# workspace member, so ci.yml never sees it. Same shape as firmware-tests.yml,
# which guards the other non-vp toolchain (embedded/).
#
# Deliberately NOT a job inside ci.yml: that workflow's `changes` job hardcodes
# every filter output to 'true' on push, so a Garmin job there would compile on
# every single push to main.

on:
  # Both events, matching firmware-tests.yml. The "Require CI on main" ruleset
  # carries only required_status_checks -- no pull-request requirement -- so a
  # direct push, revert or force-push to main is possible, and without the push
  # trigger those would publish a release that never went through this gate.
  push:
    branches: [main]
    paths:
      - 'garmin/**'
      - '!garmin/README.md'
      - '.github/workflows/garmin-ci.yml'
      # The main release workflow waits for this exact-source gate. Changing
      # that workflow must therefore compile on the same main commit too.
      - '.github/workflows/garmin-release.yml'
      - '.github/actions/connectiq-sdk/action.yml'
      - 'scripts/garmin-gate.sh'
  pull_request:
    paths:
      - 'garmin/**'
      # Prose changes compile to the same bytes; skip the SDK download for them,
      # matching garmin-release.yml.
      - '!garmin/README.md'
      - '.github/workflows/garmin-ci.yml'
      - '.github/workflows/garmin-release.yml'
      # The gate's SDK setup lives in the shared composite action, so a change
      # there (a token-handling fix, an SDK bump) has to rerun this gate too.
      - '.github/actions/connectiq-sdk/action.yml'
      - 'scripts/garmin-gate.sh'

concurrency:
  group: garmin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # One device is enough for a PR: the Monkey C sources are shared across all
  # products and a per-device break is almost always a resource/layout issue,
  # which garmin-release.yml catches across the published set within minutes of
  # merge. fenix7 is the oldest API surface in the manifest, so it is the
  # strictest single choice.
  CIQ_DEVICE: fenix7
  # `monkeyc -w` emits this many WARNING lines on fenix7 today (24 as of
  # 2026-09-23), including the known 60x60 launcher-icon placeholder and the
  # empty FitUnitNone string. The gate fails only if the count GOES UP, so
  # fixing the icon needs no edit here. If you legitimately add one, update this
  # number in the same PR and say why.
  CIQ_WARNING_BASELINE: '24'

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds GARMIN_USERNAME / GARMIN_PASSWORD. The signing key lives here too
    # but this workflow never reads it -- PR builds are signed with a throwaway
    # key (see below).
    environment: Garmin
    # Fork PRs cannot read secrets, so they cannot download the SDK, so this job
    # cannot run for them. Skipping is honest; failing would be noise. A
    # maintainer who wants the gate on a fork contribution pushes the branch to
    # this repo and reopens the PR. The event check matters: on a push,
    # github.event.pull_request is null and the comparison alone would skip the
    # job on main -- exactly the case the push trigger above exists to cover.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v6

      - name: Validate the published device list
        # garmin-release.yml refuses to build an id that is not in the manifest,
        # but by then it is on main. The spec that cross-checks these two files
        # lives in scripts/, which ci.yml only runs for a diff matching its
        # `anyJs` filter -- and release-devices.txt is not a .ts file, so a
        # one-line typo here would reach main entirely unchecked. Needs no SDK,
        # so it runs before the download.
        run: |
          set -Eeuo pipefail
          while read -r device; do
            case "$device" in ''|'#'*) continue ;; esac
            grep -q "iq:product id=\"$device\"" garmin/manifest.xml || {
              echo "::error file=garmin/release-devices.txt::$device is not an <iq:product> in garmin/manifest.xml"
              exit 1
            }
          done < garmin/release-devices.txt
          echo "device list OK"

      - name: Set up Java
        # monkeyc and monkeydo are JVM wrappers -- bin/monkeydo is literally
        # `java -classpath monkeybrains.jar ...`.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Connect IQ SDK
        uses: ./.github/actions/connectiq-sdk
        with:
          sdk-version: ${{ vars.CIQ_SDK_VERSION }}
          sdk-manager-version: ${{ vars.CIQ_SDK_MANAGER_VERSION }}
          agreement-hash: ${{ vars.CIQ_AGREEMENT_HASH }}
          devices: ${{ env.CIQ_DEVICE }}
          garmin-username: ${{ secrets.GARMIN_USERNAME }}
          garmin-password: ${{ secrets.GARMIN_PASSWORD }}

      - name: Mint a throwaway signing key
        # monkeyc -y wants a key for every build, but nothing compiled on a PR is
        # ever installed or distributed, so the real developer_key has no reason
        # to be here. It is irreplaceable -- the Connect IQ Store rejects an
        # update signed with a different key -- so the fewer jobs that touch it,
        # the better. $RUNNER_TEMP, never the workspace, so no artifact glob can
        # pick it up.
        run: |
          set -Eeuo pipefail
          umask 077
          openssl genrsa -out "$RUNNER_TEMP/dev.pem" 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in "$RUNNER_TEMP/dev.pem" -out "$RUNNER_TEMP/developer_key"
          rm -f "$RUNNER_TEMP/dev.pem"

      - name: Compile and qualify release inputs
        # Shared with the release gate's source contract tests. A failure in the
        # warning baseline, staging flavour, or unit-test target fails this job.
        run: bash scripts/garmin-gate.sh compile

      - name: Destroy the throwaway key
        if: always()
        run: shred -u "$RUNNER_TEMP/developer_key" 2>/dev/null || true
