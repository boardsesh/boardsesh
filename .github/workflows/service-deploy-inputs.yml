name: Service Deployment Inputs

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.backend'
      - 'Dockerfile.web'
      - 'Dockerfile.sync'
      - '.dockerignore'
      - 'railway.toml'
      - 'railway.web.toml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'scripts/check-service-deploy-inputs.mjs'
      - 'scripts/check-service-deploy-inputs.test.mjs'
      - 'scripts/create-service-docker-context.mjs'
      - 'scripts/production-backend-smoke.mjs'
      - 'scripts/production-backend-smoke.test.mjs'
      - 'scripts/production-deploy-changes.mjs'
      - 'scripts/production-deploy-changes.test.mjs'
      - 'scripts/production-deploy-watchdog.mjs'
      - 'scripts/production-deploy-watchdog.test.mjs'
      - 'scripts/production-web-deploy-targets.mjs'
      - 'scripts/production-web-deploy-targets.test.mjs'
      - 'scripts/railway-deployment-status.mjs'
      - 'scripts/railway-deployment-status.test.mjs'
      - '.github/actions/railway-redeploy/**'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-deploy-watchdog.yml'
      - '.github/workflows/branch-deploy.yml'
      - '.github/workflows/e2e-tests.yml'
      - '.github/workflows/service-deploy-inputs.yml'
      - '.github/workflows/sync-deploy.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'Dockerfile.backend'
      - 'Dockerfile.web'
      - 'Dockerfile.sync'
      - '.dockerignore'
      - 'railway.toml'
      - 'railway.web.toml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'scripts/check-service-deploy-inputs.mjs'
      - 'scripts/check-service-deploy-inputs.test.mjs'
      - 'scripts/create-service-docker-context.mjs'
      - 'scripts/production-backend-smoke.mjs'
      - 'scripts/production-backend-smoke.test.mjs'
      - 'scripts/production-deploy-changes.mjs'
      - 'scripts/production-deploy-changes.test.mjs'
      - 'scripts/production-deploy-watchdog.mjs'
      - 'scripts/production-deploy-watchdog.test.mjs'
      - 'scripts/production-web-deploy-targets.mjs'
      - 'scripts/production-web-deploy-targets.test.mjs'
      - 'scripts/railway-deployment-status.mjs'
      - 'scripts/railway-deployment-status.test.mjs'
      - '.github/actions/railway-redeploy/**'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-deploy-watchdog.yml'
      - '.github/workflows/branch-deploy.yml'
      - '.github/workflows/e2e-tests.yml'
      - '.github/workflows/service-deploy-inputs.yml'
      - '.github/workflows/sync-deploy.yml'

concurrency:
  group: service-deploy-inputs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check service deployment inputs
        run: vp run check:service-deploy-inputs
