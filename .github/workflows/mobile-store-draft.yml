name: Mobile Store Draft Submission

# Best-effort preparation of a DRAFT store submission for the current marketing
# version, so a human only has to review and hit Submit — we never auto-submit for
# review. Each platform is pinned to the exact highest uploaded build tag for the
# validated version and must fingerprint-match the pinned release/next commit. No
# binary upload, no screenshots,
# no metadata (those are owned by mobile-store-metadata.yml / the screenshot
# workflows), no review submission, no rollout.
#
# ALWAYS ON: there is no enable flag. What protects the stores is that this only
# ever prepares DRAFTS (submit_for_review: false, release_status: draft), and
# that release-candidate refuses to draft anything but the exact highest build
# tag for the train's version whose fingerprint matches release/next's head. Runs
# whenever a TestFlight or Play deploy on release/next completes (workflow_run)
# and on demand — no
# schedule, so a draft follows each native build by minutes rather than hours.
# The candidate check tolerates the other platform not being there yet (it exits
# quietly and that platform's own completion re-triggers this), and the iOS lane
# waits for App Store Connect to finish processing the build before attaching
# it. Lives on cheap ubuntu (not the 60-min macOS build) and separate from the
# native builds so that wait never blocks a release. Idempotent — re-running
# updates the existing draft rather than duplicating it.

on:
  workflow_run:
    # Names must match the `name:` of the two deploy workflows exactly;
    # scripts/native-release-workflows.test.ts pins both.
    workflows:
      - iOS TestFlight Deploy (React Native)
      - Android Play Internal Deploy (React Native)
    types: [completed]
    # Native store candidates are built from the release train; main never
    # produces one. See docs/mobile-store-release.md.
    branches: [release/next]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which store(s) to prepare a draft for'
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android

concurrency:
  group: mobile-store-draft
  cancel-in-progress: false

# Only checkout is needed; store uploads authenticate via secrets, not the
# GitHub token. Explicit read-only, consistent with the other new workflows.
permissions:
  contents: read

env:
  # The branch that carries the store candidate. Every ref this workflow pins,
  # rechecks, and dispatches metadata for reads from here — there is one train,
  # and hard-coding `main` in even one of those places would draft a build from
  # the wrong line.
  RELEASE_BRANCH: release/next
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_UPDATES_CHANNEL: production
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://boardsesh-board-snapshots.t3.tigrisfiles.io/board-snapshots/v1-gzip
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  release-candidate:
    # workflow_run fires on every completion; a failed or cancelled deploy has
    # nothing new to draft. Dispatch runs are always allowed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the Maps key is mapped into pinned-train code below. It is required
    # to reproduce Android's immutable build-tag fingerprint.
    environment: Production
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      candidate_ready: ${{ steps.stable.outputs.ready }}
      version: ${{ steps.candidate.outputs.version }}
      ios_build_number: ${{ steps.candidate.outputs.ios_build_number }}
      ios_build_tag: ${{ steps.candidate.outputs.ios_build_tag }}
      ios_build_sha: ${{ steps.candidate.outputs.ios_build_sha }}
      android_version_code: ${{ steps.candidate.outputs.android_version_code }}
      android_build_tag: ${{ steps.candidate.outputs.android_build_tag }}
      android_build_sha: ${{ steps.candidate.outputs.android_build_sha }}
    steps:
      - name: Resolve the release branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')"
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve $RELEASE_BRANCH; refusing to prepare a store draft."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned release-branch tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install trusted release tooling
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Select exact uploaded builds for the release-branch version
        id: candidate
        env:
          RELEASE_HEAD_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_HEAD_SHA"
          config="$(git show "$RELEASE_HEAD_SHA:packages/mobile/app.config.ts")"
          version="$(sed -nE "s/.*version:[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" <<<"$config" | head -n 1)"
          printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo '::error::Invalid release version.'; exit 1; }
          version_pattern="${version//./\\.}"
          result="$RUNNER_TEMP/uploaded-candidates"
          : > "$result"
          CHECK_ONLY=true CANDIDATE_ONLY=true UPLOADED_ONLY=true HEAD_VERSION="$version" \
            GITHUB_OUTPUT="$result" node --import tsx scripts/mobile-cut-release-tags.ts
          cat "$result" >> "$GITHUB_OUTPUT"
          found="$(sed -n 's/^candidates_found=//p' "$result" | tail -n 1)"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          [ "$found" = true ] || exit 0

          ios_tag="$(sed -n 's/^ios_build_tag=//p' "$result" | tail -n 1)"
          android_tag="$(sed -n 's/^android_build_tag=//p' "$result" | tail -n 1)"
          if [[ "$ios_tag" =~ ^build-ios-v${version_pattern}-([0-9]+)-[0-9a-f]{12}$ ]]; then
            ios_build_number="${BASH_REMATCH[1]}"
          else
            echo "::error::Cutter returned an invalid iOS build tag: $ios_tag"
            exit 1
          fi
          if [[ "$android_tag" =~ ^build-android-v${version_pattern}-([0-9]+)-[0-9a-f]{12}$ ]]; then
            android_version_code="${BASH_REMATCH[1]}"
          else
            echo "::error::Cutter returned an invalid Android build tag: $android_tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ios_build_number=$ios_build_number" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned release branch without credentials
        if: steps.candidate.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          path: release-head
          persist-credentials: false

      - name: Checkout tagged iOS build without credentials
        if: steps.candidate.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.ios_build_sha }}
          path: ios-build
          persist-credentials: false

      - name: Checkout tagged Android build without credentials
        if: steps.candidate.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.android_build_sha }}
          path: android-build
          persist-credentials: false

      - name: Install fingerprint dependencies without lifecycle scripts
        if: steps.candidate.outputs.found == 'true'
        run: |
          set -euo pipefail
          for tree in release-head ios-build android-build; do
            (cd "$tree" && vp install --frozen-lockfile --ignore-scripts)
          done

      - name: Write identical public build environment
        if: steps.candidate.outputs.found == 'true'
        run: |
          set -euo pipefail
          for tree in release-head ios-build android-build; do
            cat > "$tree/packages/mobile/.env" <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF
          done

      - name: Verify tagged builds match the release branch's native state
        id: compare
        if: steps.candidate.outputs.found == 'true'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          EXPECTED_IOS_TAG: ${{ steps.candidate.outputs.ios_build_tag }}
          EXPECTED_ANDROID_TAG: ${{ steps.candidate.outputs.android_build_tag }}
        run: |
          set -euo pipefail
          [ -n "${GOOGLE_MAPS_API_KEY:-}" ] || {
            echo '::error::Missing GOOGLE_MAPS_API_KEY; Android fingerprint verification cannot reproduce the uploaded binary.'
            exit 1
          }
          resolve() {
            local tree="$1"
            local platform="$2"
            local raw
            if [ "$platform" = ios ]; then
              raw="$(cd "$tree/packages/mobile" && env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform ios 2>/dev/null || true)"
            else
              raw="$(cd "$tree/packages/mobile" && vp exec expo-updates runtimeversion:resolve --platform android 2>/dev/null || true)"
            fi
            jq -r '.runtimeVersion // empty' <<<"$raw"
          }
          compare_platform() {
            local platform="$1"
            local build_tree="$2"
            local build_tag="$3"
            local tagged_fp
            local head_fp=''
            local build_fp=''
            tagged_fp="$(sed -nE "s/^build-${platform}-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-([0-9a-f]{12})$/\1/p" <<<"$build_tag")"
            if [ -z "$tagged_fp" ]; then
              echo "::error::Invalid $platform build tag while comparing native state: $build_tag"
              return 1
            fi
            for attempt in 1 2 3; do
              head_fp="$(resolve release-head "$platform" | tr '[:upper:]' '[:lower:]')"
              build_fp="$(resolve "$build_tree" "$platform" | tr '[:upper:]' '[:lower:]')"
              if printf '%s' "$head_fp" | grep -qE '^[0-9a-f]{12,}$' && \
                 printf '%s' "$build_fp" | grep -qE '^[0-9a-f]{12,}$' && \
                 [ "$head_fp" = "$build_fp" ] && \
                 [ "${head_fp:0:12}" = "$tagged_fp" ] && \
                 [ "${build_fp:0:12}" = "$tagged_fp" ]; then
                return 0
              fi
            done
            printf '%s' "$head_fp" | grep -qE '^[0-9a-f]{12,}$' || head_fp='<unresolved>'
            printf '%s' "$build_fp" | grep -qE '^[0-9a-f]{12,}$' || build_fp='<unresolved>'
            echo "::notice::$platform native state mismatch: release_head=$head_fp uploaded_build=$build_fp build_tag_fingerprint=$tagged_fp"
            return 1
          }
          matches=true
          compare_platform ios ios-build "$EXPECTED_IOS_TAG" || matches=false
          compare_platform android android-build "$EXPECTED_ANDROID_TAG" || matches=false
          echo "matches=$matches" >> "$GITHUB_OUTPUT"

      - name: Recheck the release branch after fingerprint comparison
        id: stable
        if: steps.compare.outputs.matches == 'true'
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.ref.outputs.sha }}
          HEAD_VERSION: ${{ steps.candidate.outputs.version }}
          EXPECTED_IOS_TAG: ${{ steps.candidate.outputs.ios_build_tag }}
          EXPECTED_IOS_SHA: ${{ steps.candidate.outputs.ios_build_sha }}
          EXPECTED_ANDROID_TAG: ${{ steps.candidate.outputs.android_build_tag }}
          EXPECTED_ANDROID_SHA: ${{ steps.candidate.outputs.android_build_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if [ "$(git rev-parse "origin/${RELEASE_BRANCH}")" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$RELEASE_BRANCH moved during fingerprint comparison; waiting for the next run."
            exit 0
          fi
          result="$RUNNER_TEMP/rechecked-uploaded-candidates"
          : > "$result"
          CHECK_ONLY=true CANDIDATE_ONLY=true UPLOADED_ONLY=true HEAD_VERSION="$HEAD_VERSION" \
            GITHUB_OUTPUT="$result" node --import tsx scripts/mobile-cut-release-tags.ts
          found="$(sed -n 's/^candidates_found=//p' "$result" | tail -n 1)"
          ios_tag="$(sed -n 's/^ios_build_tag=//p' "$result" | tail -n 1)"
          ios_sha="$(sed -n 's/^ios_build_sha=//p' "$result" | tail -n 1)"
          android_tag="$(sed -n 's/^android_build_tag=//p' "$result" | tail -n 1)"
          android_sha="$(sed -n 's/^android_build_sha=//p' "$result" | tail -n 1)"
          if [ "$found" != true ] || [ "$ios_tag" != "$EXPECTED_IOS_TAG" ] || \
             [ "$ios_sha" != "$EXPECTED_IOS_SHA" ] || [ "$android_tag" != "$EXPECTED_ANDROID_TAG" ] || \
             [ "$android_sha" != "$EXPECTED_ANDROID_SHA" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer or ambiguous build tag appeared during fingerprint comparison; the selected builds are no longer the unique highest tags for $HEAD_VERSION."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  ios:
    needs: release-candidate
    if: >-
      needs.release-candidate.outputs.candidate_ready == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')
    runs-on: ubuntu-latest
    # The lane waits up to 45 min for App Store Connect to finish processing the
    # tagged build before attaching it; keep this above that bound.
    timeout-minutes: 60
    environment: Production
    # actions: write lets the last step dispatch mobile-store-metadata.yml.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-candidate.outputs.sha }}

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_ID."; exit 1; }
          [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_BASE64."; exit 1; }
          mkdir -p "$HOME/.private_keys"
          key_path="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || { echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 did not decode to an App Store Connect private key."; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Recheck the pinned release branch and uploaded builds
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ needs.release-candidate.outputs.sha }}
          EXPECTED_IOS_TAG: ${{ needs.release-candidate.outputs.ios_build_tag }}
          EXPECTED_IOS_SHA: ${{ needs.release-candidate.outputs.ios_build_sha }}
          EXPECTED_ANDROID_TAG: ${{ needs.release-candidate.outputs.android_build_tag }}
          EXPECTED_ANDROID_SHA: ${{ needs.release-candidate.outputs.android_build_sha }}
        run: |
          set -euo pipefail
          assert_ref() {
            local ref_path="$1"
            local expected_sha="$2"
            local actual_sha
            actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::$ref_path moved from $expected_sha to $actual_sha; refusing to prepare a store draft."
              exit 1
            fi
          }
          assert_ref "heads/${RELEASE_BRANCH}" "$EXPECTED_RELEASE_SHA"
          assert_ref "tags/$EXPECTED_IOS_TAG" "$EXPECTED_IOS_SHA"
          assert_ref "tags/$EXPECTED_ANDROID_TAG" "$EXPECTED_ANDROID_SHA"

      - name: Prepare App Store draft submission
        id: draft
        continue-on-error: true
        working-directory: fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
          RELEASE_VERSION: ${{ needs.release-candidate.outputs.version }}
          IOS_BUILD_NUMBER: ${{ needs.release-candidate.outputs.ios_build_number }}
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID."; exit 1; }
          bundle exec fastlane ios draft_submission

      # Surface a best-effort failure loudly (continue-on-error keeps the job
      # green otherwise, which would hide a broken draft submission).
      # deliver can only write listing text onto an EDITABLE App Store version,
      # so the Mobile Store Metadata run that fired when the copy landed on the
      # release branch
      # was a no-op whenever no version existed yet — the normal case, since the
      # notes are written before the native change (runbook §1). The draft step
      # above just created (or confirmed) that version, so push the text and
      # What's New onto it now. A workflow_dispatch made with GITHUB_TOKEN does
      # start a run; only push/pull_request events from the token are suppressed.
      # Android needs nothing here: its What's New rides the AAB and its listing
      # text is not version-bound.
      # Dispatched against the train, not main: the metadata lane reads `version`
      # from app.config.ts on whatever ref it checks out, and the draft it must write
      # onto carries the train's version.
      - name: Push listing text and What's New onto the drafted version
        if: steps.draft.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-store-metadata.yml --ref "${RELEASE_BRANCH}" -f platform=ios

      - name: Warn if the App Store draft step failed
        if: steps.draft.outcome == 'failure'
        run: echo "::warning::App Store draft submission failed (see the step above). Best-effort — re-run after resolving, or prepare the draft manually in App Store Connect."

      - name: Clean up App Store Connect key
        if: always()
        run: rm -f "$HOME/.private_keys/AuthKey_"*.p8 2>/dev/null || true

  android:
    needs: release-candidate
    if: >-
      needs.release-candidate.outputs.candidate_ready == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-candidate.outputs.sha }}

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Recheck the pinned release branch and uploaded builds
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ needs.release-candidate.outputs.sha }}
          EXPECTED_IOS_TAG: ${{ needs.release-candidate.outputs.ios_build_tag }}
          EXPECTED_IOS_SHA: ${{ needs.release-candidate.outputs.ios_build_sha }}
          EXPECTED_ANDROID_TAG: ${{ needs.release-candidate.outputs.android_build_tag }}
          EXPECTED_ANDROID_SHA: ${{ needs.release-candidate.outputs.android_build_sha }}
        run: |
          set -euo pipefail
          assert_ref() {
            local ref_path="$1"
            local expected_sha="$2"
            local actual_sha
            actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}" --jq '.object.sha')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::$ref_path moved from $expected_sha to $actual_sha; refusing to prepare a store draft."
              exit 1
            fi
          }
          assert_ref "heads/${RELEASE_BRANCH}" "$EXPECTED_RELEASE_SHA"
          assert_ref "tags/$EXPECTED_IOS_TAG" "$EXPECTED_IOS_SHA"
          assert_ref "tags/$EXPECTED_ANDROID_TAG" "$EXPECTED_ANDROID_SHA"

      - name: Prepare Play Store draft release
        id: draft
        continue-on-error: true
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
          RELEASE_VERSION: ${{ needs.release-candidate.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.release-candidate.outputs.android_version_code }}
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."; exit 1; }
          bundle exec fastlane android draft_submission

      - name: Warn if the Play draft step failed
        if: steps.draft.outcome == 'failure'
        run: echo "::warning::Play draft release failed (see the step above). Best-effort — re-run after resolving, or prepare the draft manually in the Play Console."
