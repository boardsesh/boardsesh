name: Fastlane Release Checks

on:
  pull_request:
    paths:
      - 'fastlane/**'
      - '.github/workflows/android-apk-rn.yml'
      - '.github/workflows/ios-testflight-rn.yml'
      - '.github/workflows/ios-testflight-distribute.yml'
      - '.github/workflows/mobile-store-android-*.yml'
      - '.github/workflows/mobile-store-fastlane-check.yml'
      - '.github/workflows/mobile-store-draft.yml'
      - '.github/workflows/mobile-store-submit*.yml'
      - '.github/workflows/mobile-store-metadata.yml'
      - '.github/workflows/mobile-store-review-submission.yml'
      - '.github/workflows/mobile-store-release-control.yml'
      - '.github/workflows/mobile-store-audit.yml'
      - '.github/workflows/mobile-screenshots-*.yml'
      - 'scripts/mobile-store-android-*.ts'
      - 'scripts/mobile-store-submit-*.ts'
      - 'scripts/__tests__/mobile-store-submit-*.test.ts'
      - 'scripts/__tests__/mobile-screenshots-workflows.test.ts'
      - 'scripts/lib/release-tags.ts'
      - 'scripts/mobile-cut-release-tags.ts'
      - 'scripts/__tests__/mobile-cut-release-tags.test.ts'
      - 'scripts/lib/google-play-tracks.ts'
      - 'scripts/lib/google-play-tracks.test.ts'
      - 'scripts/__tests__/mobile-store-android-*.test.ts'
      - 'scripts/native-release-workflows.test.ts'
      - 'scripts/testflight-build.ts'
      - 'scripts/testflight-notes.ts'
      - 'scripts/lib/testflight-*.ts'
      - 'scripts/__tests__/testflight-*.test.ts'
      - 'scripts/push-run-superseded.ts'
      - 'scripts/__tests__/push-run-superseded.test.ts'
      - '.github/workflows/mobile-ota-production.yml'
      - '.github/workflows/release-train-sync.yml'
      - 'scripts/release-train-sync.ts'
      - 'scripts/release-train-sync.test.ts'
  push:
    branches: [main, release/next]
    paths:
      - 'fastlane/**'
      - '.github/workflows/mobile-store-fastlane-check.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true
      - name: Install workspace dependencies
        run: vp install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane
      - name: Test upload boundaries without store credentials
        working-directory: fastlane
        run: |
          vp exec ruby tests/android_release_test.rb
          vp exec ruby tests/native_upload_lanes_test.rb
          vp exec ruby tests/testflight_distribution_test.rb
          vp exec ruby tests/play_listing_test.rb
          vp exec ruby tests/store_submission_status_test.rb
          vp exec ruby tests/store_review_submission_test.rb
          vp exec ruby tests/store_release_control_test.rb
          vp exec ruby tests/store_audit_test.rb
          vp exec ruby tests/creative_assets_test.rb
          vp exec ruby tests/custom_product_pages_test.rb
          vp exec ruby tests/creative_download_test.rb
          vp exec ruby tests/prepare_creative_manifest_test.rb
      - name: Verify pinned Play API supports review protection
        working-directory: fastlane
        run: |
          bundle exec ruby -e 'require "supply"; require "supply/client"; abort "Missing review guard" unless Google::Apis::AndroidpublisherV3::AndroidPublisherService.instance_method(:commit_edit).parameters.include?([:key, :changes_in_review_behavior])'
      - name: Verify native triggers, exact promotion and the merge-back submission
        run: vp test run scripts/native-release-workflows.test.ts scripts/__tests__/testflight-build.test.ts scripts/__tests__/testflight-notes.test.ts scripts/__tests__/testflight-distribution-workflow.test.ts scripts/__tests__/mobile-store-android-audit.test.ts scripts/__tests__/mobile-store-android-beta.test.ts scripts/__tests__/mobile-store-android-production.test.ts scripts/__tests__/mobile-store-android-draft-guard.test.ts scripts/__tests__/mobile-store-android-draft.test.ts scripts/__tests__/mobile-store-android-merge-back-hold.test.ts scripts/lib/google-play-tracks.test.ts scripts/__tests__/mobile-store-android-review-pending.test.ts scripts/__tests__/push-run-superseded.test.ts scripts/release-train-sync.test.ts scripts/__tests__/mobile-store-submit-target.test.ts scripts/__tests__/mobile-store-submit-android.test.ts scripts/__tests__/mobile-store-submit-workflow.test.ts scripts/__tests__/mobile-screenshots-workflows.test.ts scripts/__tests__/mobile-cut-release-tags.test.ts --reporter=agent
