name: Background Worker Image
on:
  pull_request:
    # Keep in step with the push filter: every path is an input to Dockerfile.worker
    # (root manifests, transitive backend workspaces), so a change there must build here.
    paths:
      - 'packages/backend/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/shared-schema/**'
      - 'packages/*-sync/**'
      - 'packages/sync-runtime/**'
      - 'packages/board-constants/**'
      - 'Dockerfile.worker'
      - 'scripts/create-service-docker-context.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/background-worker-image.yml'
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/shared-schema/**'
      - 'packages/*-sync/**'
      - 'packages/sync-runtime/**'
      - 'packages/board-constants/**'
      - 'Dockerfile.worker'
      - 'scripts/create-service-docker-context.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/background-worker-image.yml'
  workflow_dispatch:
concurrency:
  group: background-worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate worker context
        run: node scripts/create-service-docker-context.mjs worker
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .docker-context/worker
          file: .docker-context/worker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/boardsesh/boardsesh-worker:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/boardsesh/boardsesh-worker:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/boardsesh/boardsesh-worker:buildcache,mode=max' || '' }}
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/boardsesh/boardsesh-worker
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
