name: Refresh Recommendations

# Nightly: recompute setter popularity, mine PostHog "Climb Sent to Board
# Success" into per-climb send stats, and regenerate the public per-board cohort
# playlists. Idempotent — safe to re-run.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily (off-peak)
  workflow_dispatch:

concurrency:
  group: refresh-recommendations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets (DATABASE_URL must be a WRITABLE connection; POSTHOG_PERSONAL_API_KEY
    # optional — without it the send-stats step is skipped and sendBoost stays neutral).
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Connect to the private production database network
        uses: ./.github/actions/connect-production-db
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          forwarder-host: ${{ vars.POSTGRES_FORWARDER_HOST }}
          database-url: ${{ secrets.RECOMMENDATIONS_DATABASE_DIRECT_URL }}
          expected-role: boardsesh_recommendations_refresh

      - name: Refresh recommendations
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.RECOMMENDATIONS_DATABASE_DIRECT_URL }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          # POSTHOG_PROJECT_ID defaults to the (non-secret) project id in the
          # script; override here only if it ever changes. The send-stats step
          # runs whenever POSTHOG_PERSONAL_API_KEY is present.
        run: node --import tsx scripts/refresh-recommendations.ts
