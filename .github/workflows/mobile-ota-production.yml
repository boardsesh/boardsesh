name: Mobile OTA Production (Self-Hosted)

# Publishes train JS immediately when release/next has a different marketing
# version from main. Public store builds, resolved from the stores' exact build
# numbers and immutable tags, own their runtimes: train JS never publishes there.
# Main's staged candidates soak only on the current public store runtimes.
#
# Fingerprint identity is necessary but NOT sufficient: expo-updates launches
# whichever update has the newest commitTime, and a binary stamps its embedded
# bundle at BUILD time. A ~50-minute macOS build started by an earlier commit
# therefore finishes with an embedded commitTime NEWER than an OTA published
# mid-build from a later commit — same fingerprint, but the binary wins forever
# and that OTA's JS never reaches it. So the native workflows dispatch this
# workflow again once their store upload lands, passing `expect_fingerprint`: a
# publish that happens strictly after the build necessarily outranks it. See
# docs/mobile-ota-updates.md.

# Name the run after what it is doing — `gh workflow run` returns no run id, so
# this is the only handle for spotting a dispatched republish in the Actions list.
run-name: >-
  ${{ inputs.stage_for_production_deploy && 'Stage main OTA'
  || github.event.inputs.expect_fingerprint
  && format('Republish {0} after native build ({1})', github.event.inputs.platform, github.event.inputs.expect_fingerprint)
  || 'Production OTA' }}

on:
  push:
    # release/next serves the TestFlight / Play-internal testers running the train's binary. The train's
    # publish is guarded so it can never take over the store fleet's runtimeVersion — see the
    # "Skip platforms whose runtimeVersion the train does not own" step below.
    branches: [release/next]
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message (defaults to the commit subject)'
        required: false
      platform:
        description: 'Platform to publish (ios, android, all)'
        required: false
        default: 'all'
      expect_fingerprint:
        description: >-
          Only publish if the current fingerprint still matches this one. Set by the
          native build workflows when they republish after a store upload; leave
          empty for a normal manual publish.
        required: false
  workflow_call:
    inputs:
      stage_for_production_deploy:
        type: boolean
        required: true

permissions:
  # read only: the push-back to main uses a dedicated GitHub App token (it must
  # bypass main's "require a pull request" rule — the default GITHUB_TOKEN can't),
  # so the workflow token just needs read for checkout/fetch.
  contents: read
  # scripts/mobile-ota-server-ready.mjs lists this commit's Railway Config runs.
  actions: read

# No workflow-level concurrency: the publish lane is taken by the `publish` job
# alone (see the note there), so a job before or after it can never hold it.

# ─── SHARED BUILD ENV (workflow-level) ───────────────────────────────────────
# MUST stay byte-identical to ios-testflight-rn.yml / android-apk-rn.yml, for two
# distinct reasons (both at the workflow level there too, so the gate + build +
# this publish all resolve the same fingerprint):
#   1. Fingerprint parity. The fingerprint runtimeVersion hashes the *resolved
#      Expo config* + the written .env (NOT the JS bundle). The vars that feed
#      that config must match the native build or the published fingerprint won't
#      match the shipped binary and the OTA silently never lands:
#      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID (→ google-signin iosUrlScheme, a native
#      CFBundleURLScheme), GOOGLE_MAPS_API_KEY (→ android.config; set per-platform
#      on the Android publish step below), and — once the committed cert activates
#      the self-hosted updates block — EXPO_UPDATES_URL.
#   2. Bundle correctness. The remaining EXPO_PUBLIC_* are inlined into the JS
#      bundle (and hashed via .env); drift there ships an OTA pointing at the
#      wrong backend/analytics. Both classes are enforced by
#      scripts/mobile-ci-env-parity.test.ts. Keep this free of other
#      fingerprint-affecting vars (EAS_BUILD, EAS_BUILD_PROFILE,
#      BOARDSESH_APP_VARIANT, …) — they're unset in the native builds too.
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Manifest base for the offline snapshot bootstrap (bundle-only, no fingerprint
  # effect). Public R2 host; keep in sync with SNAPSHOT_PUBLIC_BASE_URL in
  # blackheathdc-ansible/inventories/boardsesh_workers.yml (batch defaults).
  # Cutover: docs/board-snapshots.md#batch-worker-owner-export-board-snapshots-family.
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://snapshots.boardsesh.com/board-snapshots/v1-gzip
  EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
  # Pin React Native's fetch as the global `fetch` instead of expo/fetch. Expo 57's
  # WinterCG runtime installs expo/fetch as the global unless this is '1'; expo/fetch's
  # NativeResponse tears down JSI promise objects on a background queue, crashing Hermes
  # (EXC_BAD_ACCESS, Sentry 7595562195). Bundle-only flag — it never enters the resolved
  # Expo config, so it doesn't move the fingerprint (verified) and rides OTA to shipped
  # binaries. See docs/mobile-ota-updates.md.
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  # Runs outside the publish lane, so its evidence can be old by the time
  # `publish` gets the lane. It stays a separate job on purpose: it holds the
  # App Store Connect and Play credentials under `environment: Production` and
  # runs only main's code with no install, while `publish` runs train code and
  # `vp install`. Instead, `publish` refuses evidence older than two hours
  # (TRAIN_LIVE_STORE_MAX_AGE_MS in scripts/lib/mobile-release-policy.ts).
  live-store-runtimes:
    if: github.ref == 'refs/heads/release/next'
    uses: ./.github/workflows/mobile-live-store-runtimes.yml
    secrets: inherit

  # Resolve native inputs with Production's build environment, without admin
  # credentials. The next job only consumes validated fingerprints and built-ins.
  resolve-staging-runtimes:
    if: inputs.stage_for_production_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    outputs:
      ios_runtime: ${{ steps.runtimes.outputs.ios_runtime }}
      android_runtime: ${{ steps.runtimes.outputs.android_runtime }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true
      - name: Install Node.js dependencies (workspace root)
        run: vp install --frozen-lockfile
      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF

      - name: Resolve staged native runtimes
        id: runtimes
        env:
          ANDROID_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          for platform in ios android; do
            if [ "$platform" = ios ]; then
              runtime="$(cd packages/mobile && env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform ios | jq -r '.runtimeVersion // empty')"
            else
              runtime="$(cd packages/mobile && GOOGLE_MAPS_API_KEY="$ANDROID_MAPS_KEY" vp exec expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion // empty')"
            fi
            if ! printf '%s' "$runtime" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Could not resolve the full $platform staged runtime."
              exit 1
            fi
            echo "${platform}_runtime=$runtime" >> "$GITHUB_OUTPUT"
          done

  # Trusted main only. No install, lifecycle hooks or publish token can see the
  # admin login. Production remains strict; beta may be empty only when the
  # authenticated control plane confirms the exact target has no updates.
  capture-staging-baselines:
    needs: resolve-staging-runtimes
    if: inputs.stage_for_production_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ota-stable-release
    outputs:
      production_baseline: ${{ steps.capture.outputs.production_baseline }}
      early_baseline: ${{ steps.capture.outputs.early_baseline }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Capture production baseline
        env:
          IOS_RUNTIME: ${{ needs.resolve-staging-runtimes.outputs.ios_runtime }}
          ANDROID_RUNTIME: ${{ needs.resolve-staging-runtimes.outputs.android_runtime }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/mobile-ota-promote.ts --capture-baseline \
            --ios-runtime "$IOS_RUNTIME" --android-runtime "$ANDROID_RUNTIME" \
            --app-id 007e6fd7-f200-448c-9449-8d48ba5d51fc --out production-baseline.json
      - name: Capture authenticated early baseline
        id: capture
        env:
          IOS_RUNTIME: ${{ needs.resolve-staging-runtimes.outputs.ios_runtime }}
          ANDROID_RUNTIME: ${{ needs.resolve-staging-runtimes.outputs.android_runtime }}
          OTA_ADMIN_EMAIL: ${{ secrets.OTA_ADMIN_EMAIL }}
          OTA_ADMIN_PASSWORD: ${{ secrets.OTA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${OTA_ADMIN_EMAIL:-}" ]; then echo "::add-mask::$OTA_ADMIN_EMAIL"; fi
          node --experimental-strip-types scripts/mobile-ota-promote.ts --capture-baseline --branch pr-beta --verify-empty-target \
            --ios-runtime "$IOS_RUNTIME" --android-runtime "$ANDROID_RUNTIME" \
            --app-id 007e6fd7-f200-448c-9449-8d48ba5d51fc --out early-baseline.json
          echo "production_baseline=$(jq -c . production-baseline.json)" >> "$GITHUB_OUTPUT"
          echo "early_baseline=$(jq -c . early-baseline.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [resolve-staging-runtimes, capture-staging-baselines, live-store-runtimes]
    # Skipped staging prerequisites must not suppress direct/train/manual runs.
    if: >-
      always() && !cancelled()
      && (github.ref != 'refs/heads/release/next' || needs.live-store-runtimes.result == 'success')
      && (!inputs.stage_for_production_deploy || (needs.resolve-staging-runtimes.result == 'success' && needs.capture-staging-baselines.result == 'success'))
    outputs:
      ios_outcome: ${{ steps.publish_ios.outcome }}
      android_outcome: ${{ steps.publish_android.outcome }}
      ios_runtime: ${{ steps.train_guard.outputs.ios_runtime_version }}
      android_runtime: ${{ steps.train_guard.outputs.android_runtime_version }}
      train_version: ${{ steps.train_baselines.outputs.train_version }}
    # Only this publisher needs dispatch permission. No admin login is exposed.
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    # Direct production publishes share one lane with native republishes,
    # backports, staged promotions and the stable tick. Staging has its own lane
    # so it can overlap production publishes and the web/backend builds;
    # promotion later takes the production lane.
    #
    # The lane sits on THIS job, not the workflow. A group held at workflow level
    # is held by every job in the run, and on 2026-10-24 run 40105607795 published
    # in ten minutes, then its notify job never got a runner and held the lane for
    # 27 hours: 25 train pushes, two native republishes and the hourly stable tick
    # queued behind a job that was only going to post to Discord. Job timeouts
    # never fire on a job that never starts. production-deploy-watchdog.yml's
    # mobile-ota-production lane breaks a run parked at a gate.
    #
    # The staging-only jobs above (resolve-staging-runtimes,
    # capture-staging-baselines) run outside the staging lane. That is safe:
    # staging runs only come from production-deploy.yml's workflow_call, and
    # that workflow is serialised by its own `production-deploy` group, so two
    # staging runs never overlap. Both jobs only read.
    #
    # QUEUE, never supersede. cancel-in-progress governs only the RUNNING job —
    # by default GitHub still cancels an existing *pending* one when a new one
    # queues. That used to be harmless (the winner republished the latest state
    # anyway), but the native workflows now dispatch a per-PLATFORM republish to
    # un-strand a binary they just uploaded, and those don't cover for each other:
    # an iOS republish running + an Android republish pending + any push to main
    # would drop the Android one, leaving Android installs frozen on their embedded
    # bundle until the next Android native build. The cost is that pushes during a
    # long publish queue instead of coalescing; a superseded train push skips its
    # publish (first step below), so a backlog drains at about a minute per push.
    # Never silently dropping a republish is the whole point. Must stay in
    # lockstep with mobile-ota-backport.yml, which shares this group.
    concurrency:
      group: ${{ inputs.stage_for_production_deploy && 'mobile-ota-staging' || 'mobile-ota-production' }}
      cancel-in-progress: false
      queue: max
    # Six attempts per platform can spend 34 minutes in backoff alone, and iOS
    # and Android each get that budget sequentially — a fully throttled run is
    # ~98 minutes of publishing plus setup, changelog, source maps and the health
    # check. This ceiling must stay above the retry budget: if the job is killed
    # mid-backoff the run dies by timeout instead of reporting `s3-slowdown`,
    # losing both the diagnosis and the failure notification. Derived and
    # enforced in mobile-ota-publish-workflow.test.ts from the ladder in
    # scripts/lib/mobile-publish-retry.ts — raise both together or not at all.
    # Costs nothing on a healthy publish, which finishes in well under 10 minutes.
    # On top of that budget: up to 85 minutes waiting for a Railway Config run on the
    # same commit (scripts/mobile-ota-server-ready.mjs), which only happens on the
    # rare push that also rolls the OTA server. Direct publishes also reserve
    # 25 minutes for the trusted main-only unlock; staging has no such wait.
    timeout-minutes: 240
    # Gates EOO_TOKEN + GOOGLE_MAPS_API_KEY + the EXPO_UPDATES_URL variable.
    environment: Production

    # EOO_TOKEN (the app-scoped expo-open-ota publish key) is NOT a job-level env:
    # that would expose the publish-capable key to checkout, setup-vp,
    # `vp install`, and the changelog commit/push before the publish. It's scoped to
    # the two publish steps below. INPUT_* stay here — they're plain inputs
    # referenced in the publish steps' `if:` expressions.
    env:
      INPUT_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
      INPUT_MESSAGE: ${{ github.event.inputs.message }}
      OTA_BRANCH: ${{ inputs.stage_for_production_deploy && 'pr-staging' || 'production' }}

    steps:
      # Mint the GitHub App token FIRST so checkout persists ITS credentials for
      # the push-back. actions/checkout writes an http.extraheader for whatever
      # token it's given, and that overrides any token in the remote URL — so the
      # push must inherit the app token here, not swap it in later. The default
      # GITHUB_TOKEN (github-actions[bot]) isn't in main's PR-bypass list and is
      # rejected; the app is. Skips cleanly when the app isn't configured.
      - name: Mint push token
        id: push_token
        if: vars.OTA_PUSH_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the changelog push-back can rebase onto the latest main.
          fetch-depth: 0
          # The changelog generator reads the `fingerprint-<platform>-<hash>` tags
          # (pushed by the native build workflows) to weave native-release markers
          # into the changelog. fetch-depth: 0 already pulls tags, but be explicit
          # so a future shallow tweak can't silently drop them.
          fetch-tags: true
          # Persist the app token (when configured) so the push-back authenticates
          # as the app and bypasses the branch's PR rule. Falls back to the default
          # token (read-only checkout) when the app isn't set up.
          token: ${{ steps.push_token.outputs.token || github.token }}

      # The first thing a train push does once it holds the lane. Every push to
      # release/next starts a run (no paths filter), and runs queue behind each
      # other, so when the branch has already moved on, the run for the newer
      # tip is queued behind this one and publishes newer JS. Skipping here,
      # before setup and install, makes a backlog of N pushes cost about N
      # minutes instead of N full publishes. Skipping the gate below skips every
      # later publish step, so the outputs read "nothing published", not a
      # failure. Native republishes (workflow_dispatch) and staging
      # (workflow_call) never skip here. If ls-remote fails this falls through
      # to publishing; the push-run-superseded check in the train baseline step
      # still decides.
      - name: Skip a train push a newer push has superseded
        id: superseded
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/next'
        run: |
          set -uo pipefail
          tip="$(git ls-remote origin refs/heads/release/next | cut -f1)" || tip=''
          if printf '%s' "$tip" | grep -Eq '^[0-9a-f]{40}$' && [ "$tip" != "$GITHUB_SHA" ]; then
            echo 'superseded=true' >> "$GITHUB_OUTPUT"
            echo "superseded by $tip" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::release/next moved to $tip; the run queued for it publishes newer JS."
          else
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require live backend schema before direct main publish
        if: github.ref == 'refs/heads/main' && !inputs.stage_for_production_deploy
        run: node scripts/mobile-ota-schema-ready.mjs

      - uses: voidzero-dev/setup-vp@v1
        if: steps.superseded.outputs.superseded != 'true'
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies (workspace root)
        if: steps.superseded.outputs.superseded != 'true'
        run: vp install --frozen-lockfile

      # eoas and the xprem server must speak the same upload protocol (3.2.0 broke
      # it both ways). When this commit also rolls the server image, Railway Config
      # runs alongside this job; wait for it rather than publish against the old
      # server. Returns at once for the ordinary push with no Railway change.
      - name: Wait for the OTA server rollout on this commit
        if: steps.superseded.outputs.superseded != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mobile-ota-server-ready.mjs

      # Skipped for a superseded push, which leaves `configured` empty and so
      # skips every step gated on it.
      - name: Check OTA infra is wired
        id: gate
        if: steps.superseded.outputs.superseded != 'true'
        env:
          STAGING: ${{ inputs.stage_for_production_deploy }}
        run: |
          # Until the server URL is configured AND the signing cert is committed,
          # app.config falls back to the EAS URL and the fingerprint cannot match
          # a self-hosted binary. A main deploy must fail staging; direct release
          # and manual publishes keep their existing green no-op behavior.
          if [ -z "$EXPO_UPDATES_URL" ] || [ ! -f packages/mobile/certs/certificate.pem ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$STAGING" = true ]; then
              echo '::error::Main OTA cannot stage without EXPO_UPDATES_URL and the signing certificate.'
              exit 1
            fi
            echo "::notice::Self-hosted OTA not wired yet (EXPO_UPDATES_URL unset or certs/certificate.pem missing) — skipping production OTA publish. See docs/mobile-ota-updates.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env for Expo build-time inlining
        if: steps.gate.outputs.configured == 'true'
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_POSTHOG_KEY=$EXPO_PUBLIC_POSTHOG_KEY
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          EOF

      # Static version reads pin both branch heads without running their config.
      # Preserve the superseded-push guard before resolving native fingerprints.
      - name: Resolve active release train against pinned origin/main
        id: train_baselines
        if: steps.gate.outputs.configured == 'true' && github.ref == 'refs/heads/release/next'
        run: |
          set -euo pipefail
          echo 'superseded=true' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            superseded="$(node --experimental-strip-types scripts/push-run-superseded.ts --workflow .github/workflows/mobile-ota-production.yml)"
            if [ "$superseded" != false ]; then
              echo "::notice::release/next advanced; the newer run decides what to publish."
              exit 0
            fi
          fi
          git fetch origin main release/next
          main_sha="$(git rev-parse origin/main)"
          train_sha="$(git rev-parse origin/release/next)"
          if [ "$(git rev-parse HEAD)" != "$train_sha" ]; then
            echo '::notice::The current train moved past this source commit.'
            exit 0
          fi
          node --experimental-strip-types scripts/mobile-release-train-policy.ts \
            --main-sha "$main_sha" --train-sha "$train_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "train_sha=$train_sha" >> "$GITHUB_OUTPUT"
          echo 'superseded=false' >> "$GITHUB_OUTPUT"

      # The store evidence arrives as an artifact, never a job output. GitHub drops
      # a job output that contains any masked value, and the resolve job's
      # multi-line Play service-account secret registers its bare `{` line as one.
      - name: Download public store runtimes
        if: steps.gate.outputs.configured == 'true' && github.ref == 'refs/heads/release/next'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: live-store-runtimes
          path: ${{ runner.temp }}/live-store-runtimes

      - name: Read public store runtimes
        id: live_store
        if: steps.gate.outputs.configured == 'true' && github.ref == 'refs/heads/release/next'
        run: |
          set -euo pipefail
          live_runtimes="$(jq -c . "$RUNNER_TEMP/live-store-runtimes/live-store-runtimes.json")"
          echo "live_runtimes=$live_runtimes" >> "$GITHUB_OUTPUT"

      # Refuses evidence older than TRAIN_LIVE_STORE_MAX_AGE_MS (two hours): the
      # job that resolved it ran before this one waited for the lane. A separate
      # step on purpose: production-deploy-watchdog.mjs matches this step NAME to
      # tell a stale-evidence failure from any other, and dispatches a stranded
      # native republish again once. Rename both together. Only an active,
      # current train reads the evidence, so only that case is checked.
      - name: Refuse stale public store evidence
        if: steps.gate.outputs.configured == 'true' && github.ref == 'refs/heads/release/next' && steps.train_baselines.outputs.superseded == 'false' && steps.train_baselines.outputs.train_active == 'true'
        env:
          LIVE_STORE_RUNTIMES: ${{ steps.live_store.outputs.live_runtimes }}
        run: node --experimental-strip-types scripts/mobile-release-train-policy.ts --check-evidence

      # The live stores are the source of truth. main can already carry native
      # code awaiting review while production still runs the previous runtime.
      - name: Skip platforms whose runtimeVersion the train does not own
        id: train_guard
        if: steps.gate.outputs.configured == 'true' && github.ref == 'refs/heads/release/next'
        env:
          ANDROID_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TRAIN_SUPERSEDED: ${{ steps.train_baselines.outputs.superseded }}
          TRAIN_ACTIVE: ${{ steps.train_baselines.outputs.train_active }}
          TRAIN_MAIN_SHA: ${{ steps.train_baselines.outputs.main_sha }}
          LIVE_STORE_RUNTIMES: ${{ steps.live_store.outputs.live_runtimes }}
        run: |
          set -euo pipefail
          {
            echo 'publish_ios=false'
            echo 'publish_android=false'
          } >> "$GITHUB_OUTPUT"
          if [ "$TRAIN_SUPERSEDED" != false ] || [ "$TRAIN_ACTIVE" != true ]; then
            echo '::notice::No active current release train; publishing nothing.'
            exit 0
          fi
          case "$INPUT_PLATFORM" in
            ios|android|all) ;;
            *) echo '::error::Unknown publish platform.'; exit 1 ;;
          esac
          resolve_train_runtime() {
            if [ "$1" = ios ]; then
              (cd packages/mobile && env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform ios | jq -r '.runtimeVersion // empty')
            else
              (cd packages/mobile && GOOGLE_MAPS_API_KEY="$ANDROID_MAPS_KEY" vp exec expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion // empty')
            fi
          }
          for platform in ios android; do
            if [ "$INPUT_PLATFORM" != all ] && [ "$INPUT_PLATFORM" != "$platform" ]; then continue; fi
            runtime="$(resolve_train_runtime "$platform")"
            if ! printf '%s' "$runtime" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::No full $platform train fingerprint; publishing nothing."
              exit 1
            fi
            confirmed="$(resolve_train_runtime "$platform")"
            if [ "$runtime" != "$confirmed" ]; then
              echo "::error::Unstable $platform train fingerprint; publishing nothing."
              exit 1
            fi
            node --experimental-strip-types scripts/mobile-release-train-policy.ts \
              --platform "$platform" --runtime "$runtime" --main-sha "$TRAIN_MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo "${platform}_runtime_version=$runtime" >> "$GITHUB_OUTPUT"
          done

      # Only for a republish dispatched by a native build. That build shipped a
      # binary with a known fingerprint and wants an OTA stamped after it, but by
      # the time this run gets a runner `main` may already carry a NEW native
      # change. Publishing then would resolve the new fingerprint and ship JS that
      # assumes native code the uploaded binary doesn't have — so skip instead. The
      # binary stays on its embedded bundle until its own store release, and
      # mobile-ota-backport.yml is the escape hatch if that cohort needs a JS fix.
      #
      # Runs AFTER the .env write: the .env is hashed into the fingerprint, so
      # resolving before it exists would produce a different (wrong) value. The
      # comparison itself is a unit-tested pure function rather than inline shell —
      # an inverted `!=` here would silently disable the guard while every
      # workflow-text assertion stayed green.
      - name: Verify the fingerprint still matches the build that asked for this
        id: expect
        if: steps.gate.outputs.configured == 'true' && github.event.inputs.expect_fingerprint != ''
        env:
          EXPECT_FINGERPRINT: ${{ github.event.inputs.expect_fingerprint }}
          PLATFORM: ${{ github.event.inputs.platform }}
          # Android's fingerprint is resolved WITH the maps key, iOS without —
          # the key enters the resolved config and moves BOTH platforms' hashes.
          # Mirrors the per-platform split on the publish steps below.
          GOOGLE_MAPS_API_KEY: ${{ github.event.inputs.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: |
          set -uo pipefail
          # A republish is always for ONE platform: the fingerprints differ per
          # platform, so a single expect_fingerprint can't validate both.
          if [ "$PLATFORM" != "ios" ] && [ "$PLATFORM" != "android" ]; then
            echo "::error::expect_fingerprint requires platform=ios or platform=android (got \"$PLATFORM\")."
            exit 1
          fi
          # Keep stderr visible: a resolve that fails for a reason other than drift
          # (missing dep, config error) should surface its own cause.
          raw="$(cd packages/mobile && vp exec expo-updates runtimeversion:resolve --platform "$PLATFORM" || true)"
          fp="$(printf '%s' "$raw" | jq -r '.runtimeVersion // empty' 2>/dev/null || true)"
          verdict="$(node --experimental-strip-types scripts/mobile-fingerprint-match.ts \
            --resolved "$fp" --expected "$EXPECT_FINGERPRINT")"
          echo "$verdict" >> "$GITHUB_OUTPUT"
          # Second-precision, no fractional part: the postcondition below compares
          # this against the server's createdAt as plain strings, and a mixed
          # `…48.000Z` / `…48Z` pair doesn't order correctly.
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "mismatch=true" ]; then
            echo "::warning::main now resolves $PLATFORM fingerprint \"${fp:-<unresolved>}\", not $EXPECT_FINGERPRINT. Skipping the republish: the binary that asked for it can only ever run its embedded bundle now, and a new native build is already on the way. Use mobile-ota-backport.yml if that cohort needs a JS fix."
          else
            echo "::notice::$PLATFORM fingerprint still matches $EXPECT_FINGERPRINT — republishing so the new binary has an update newer than its embedded bundle."
          fi

      # Resolve every platform this direct publish can upload before unlocking.
      # Staging never touches the production canary. The caller retains the
      # production lane while the separate main-only unlock run reverts it.
      - name: Resolve runtime versions before direct production publish
        id: unlock_runtimes
        if: ${{ !inputs.stage_for_production_deploy && steps.gate.outputs.configured == 'true' && steps.expect.outputs.mismatch != 'true' }}
        env:
          ANDROID_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TRAIN_PUBLISH_IOS: ${{ steps.train_guard.outputs.publish_ios }}
          TRAIN_PUBLISH_ANDROID: ${{ steps.train_guard.outputs.publish_android }}
          TRAIN_IOS_RUNTIME: ${{ steps.train_guard.outputs.ios_runtime_version }}
          TRAIN_ANDROID_RUNTIME: ${{ steps.train_guard.outputs.android_runtime_version }}
        run: |
          set -euo pipefail
          case "$INPUT_PLATFORM" in
            ios|android|all) ;;
            *) echo "::error::Unknown publish platform."; exit 1 ;;
          esac
          for platform in ios android; do
            if [ "$INPUT_PLATFORM" != all ] && [ "$INPUT_PLATFORM" != "$platform" ]; then continue; fi
            if [ "$platform" = ios ] && [ "$TRAIN_PUBLISH_IOS" = false ]; then continue; fi
            if [ "$platform" = android ] && [ "$TRAIN_PUBLISH_ANDROID" = false ]; then continue; fi
            if [ "$platform" = ios ]; then
              runtime="$(cd packages/mobile && env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform ios | jq -r '.runtimeVersion // empty')"
            else
              runtime="$(cd packages/mobile && GOOGLE_MAPS_API_KEY="$ANDROID_MAPS_KEY" vp exec expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion // empty')"
            fi
            if ! printf '%s' "$runtime" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Could not resolve the full $platform runtime before unlocking."
              exit 1
            fi
            expected_train_runtime="$TRAIN_IOS_RUNTIME"
            if [ "$platform" = android ]; then expected_train_runtime="$TRAIN_ANDROID_RUNTIME"; fi
            if [ -n "$expected_train_runtime" ] && [ "$runtime" != "$expected_train_runtime" ]; then
              echo '::error::Train runtime changed after authorization; refusing direct publish.'
              exit 1
            fi
            echo "${platform}_runtime_version=$runtime" >> "$GITHUB_OUTPUT"
          done

      - name: Await trusted main unlock before direct production publish
        id: unlock
        if: ${{ !inputs.stage_for_production_deploy && steps.unlock_runtimes.outcome == 'success' && (steps.unlock_runtimes.outputs.ios_runtime_version != '' || steps.unlock_runtimes.outputs.android_runtime_version != '') }}
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IOS_RUNTIME_VERSION: ${{ steps.unlock_runtimes.outputs.ios_runtime_version }}
          ANDROID_RUNTIME_VERSION: ${{ steps.unlock_runtimes.outputs.android_runtime_version }}
        run: node scripts/mobile-ota-unlock-wait.mjs

      # This workflow is the SOLE OWNER of packages/mobile/src/data/changelog.generated.json.
      # It regenerates the "What's New" changelog from merged-PR Release Notes and
      # pushes it back to main so the committed copy is the single source of truth
      # (native builds bundle it; the next OTA diffs against it). Nothing else writes
      # this file: a CI guard blocks PRs from editing it, and the native-build /
      # refresh workflows only read it.
      #
      # It is deliberately NOT committed here. It used to be, purely because `eoas
      # publish` aborts on a dirty tree — but that made HEAD a throwaway
      # `chore(changelog)` commit at publish time, and eoas records BOTH the update
      # message and its commitHash from HEAD (`git rev-parse HEAD` / `git log -1`).
      # Every row on the OTA server was therefore stamped with a sha that the push
      # step below never even pushed (it resets to origin/main and commits afresh),
      # which made the dashboard's Message and Commit columns useless for finding an
      # update. Publishing from an uncommitted tree instead keeps HEAD on the real
      # triggering commit; scripts/mobile-publish.ts passes --disableRepositoryCheck
      # (CI only) to allow it, and the step after this one asserts the tree is dirty
      # in exactly these two files — the integrity check eoas' guard was incidentally
      # providing.
      #
      # `expo export` reads the working tree, so the regenerated file still ships in
      # the bundle. The push step below commits it to main after every platform
      # succeeds, carrying [skip ci] so it can't re-trigger this workflow.
      # Rebase-and-retry guards a non-OTA push landing on main since checkout (OTA
      # runs are serialized on main, so two of these never race). Degrades
      # gracefully: a gh/network failure leaves the file unchanged (no diff → no
      # push) and exits 0. The default GITHUB_TOKEN reads public PRs. The file is
      # JS-only, so it never affects the fingerprint. `changed` tells the push step
      # whether there's anything to push.
      - name: Generate changelog
        id: generate
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Snapshot the changelog as it stood BEFORE this run so the Discord notify
          # step can diff prev→next and announce only what this OTA newly adds. Must
          # be captured before `generate:changelog` overwrites the working copy. A
          # first-run/missing file degrades to an empty entry list (full new list).
          git show HEAD:packages/mobile/src/data/changelog.generated.json \
            > "$RUNNER_TEMP/changelog.prev.json" 2>/dev/null \
            || echo '{"entries":[]}' > "$RUNNER_TEMP/changelog.prev.json"
          vp run generate:changelog
          # Render the "What's new" block (newly-added entries, grouped by category)
          # for Discord. Written to a file the notify step reads; empty when nothing
          # is new, so that step falls back to the triggering commit subject.
          vp run changelog:discord-summary -- \
            --prev "$RUNNER_TEMP/changelog.prev.json" \
            --next packages/mobile/src/data/changelog.generated.json \
            --out "$RUNNER_TEMP/discord-changelog.md" || true
          # Configured here, not in the push step: that step is the one that
          # commits, and would otherwise author as nobody.
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Both outputs of the generator: the mobile JSON feed and the root
          # human-readable CHANGELOG.md (deterministic from the same entries).
          # Staged, never committed — `git add` is what makes an untracked
          # CHANGELOG.md (bootstrap case) visible to the --cached diff below.
          git add packages/mobile/src/data/changelog.generated.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Changelog unchanged — nothing to push."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The integrity check eoas' clean-tree guard was giving us for free, now that
      # --disableRepositoryCheck turns that guard off: prove the only uncommitted
      # changes are the two files the step above regenerates. Anything else (a dep
      # install that dirtied a tracked file, a stray build artifact) would otherwise
      # be silently bundled into a production OTA.
      - name: Assert only the changelog is uncommitted
        if: steps.gate.outputs.configured == 'true' && steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all | awk '{print $NF}' | sort | paste -sd' ' -)"
          case "$changed" in
            '' | 'CHANGELOG.md packages/mobile/src/data/changelog.generated.json') ;;
            *)
              echo "::error::Unexpected working-tree changes before the OTA publish: $changed"
              exit 1
              ;;
          esac
          echo "Working tree carries only the regenerated changelog (or nothing)."

      - name: Capture production OTA baseline before staging
        id: baseline
        if: inputs.stage_for_production_deploy && steps.generate.outcome == 'success'
        env:
          IOS_RUNTIME: ${{ needs.resolve-staging-runtimes.outputs.ios_runtime }}
          ANDROID_RUNTIME: ${{ needs.resolve-staging-runtimes.outputs.android_runtime }}
          PRODUCTION_BASELINE: ${{ needs.capture-staging-baselines.outputs.production_baseline }}
          EARLY_BASELINE: ${{ needs.capture-staging-baselines.outputs.early_baseline }}
          ANDROID_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          # The publisher independently resolves its identical native inputs.
          # Any environment drift invalidates the authenticated frozen baseline.
          ios_runtime="$(cd packages/mobile && env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform ios | jq -r '.runtimeVersion // empty')"
          android_runtime="$(cd packages/mobile && GOOGLE_MAPS_API_KEY="$ANDROID_MAPS_KEY" vp exec expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion // empty')"
          if [ "$ios_runtime" != "$IOS_RUNTIME" ] || [ "$android_runtime" != "$ANDROID_RUNTIME" ]; then
            echo '::error::Staged fingerprints changed after baseline capture.'
            exit 1
          fi
          mkdir -p ota-stage
          printf '%s' "$IOS_RUNTIME" > ota-stage/ios-runtime
          printf '%s' "$ANDROID_RUNTIME" > ota-stage/android-runtime
          printf '%s' "$PRODUCTION_BASELINE" > ota-stage/baseline.json
          printf '%s' "$EARLY_BASELINE" > ota-stage/early-baseline.json

      - name: Validate Sentry uploader support before publishing
        id: sentry_uploader
        if: steps.gate.outputs.configured == 'true' && steps.generate.outcome == 'success' && (!inputs.stage_for_production_deploy || steps.baseline.outcome == 'success') && (inputs.stage_for_production_deploy || steps.unlock.outcome == 'success') && steps.expect.outputs.mismatch != 'true' && ((steps.train_guard.outputs.publish_ios != 'false' && (env.INPUT_PLATFORM == 'all' || env.INPUT_PLATFORM == 'ios')) || (steps.train_guard.outputs.publish_android != 'false' && (env.INPUT_PLATFORM == 'all' || env.INPUT_PLATFORM == 'android')))
        run: |
          vp exec node --import tsx --input-type=module --eval 'import * as sourceMapTools from "./scripts/mobile-upload-sourcemaps.ts"; console.log((sourceMapTools.default ?? sourceMapTools).resolveInstalledSentryUploader("packages/mobile"));'

      # iOS and Android are published in SEPARATE steps with platform-specific env.
      # GOOGLE_MAPS_API_KEY is set only on the Android native prebuild (iOS uses
      # Apple Maps), and it changes the resolved config — hence the fingerprint —
      # for BOTH platforms. So the iOS publish must run WITHOUT the key (to match the
      # iOS binary) and the Android publish WITH it (to match the Android binary). A
      # single `--platform all` publish with one env could only ever match one side.
      - name: Publish iOS OTA
        id: publish_ios
        if: steps.gate.outputs.configured == 'true' && steps.generate.outcome == 'success' && steps.sentry_uploader.outcome == 'success' && (!inputs.stage_for_production_deploy || steps.baseline.outcome == 'success') && (inputs.stage_for_production_deploy || steps.unlock.outcome == 'success') && steps.expect.outputs.mismatch != 'true' && steps.train_guard.outputs.publish_ios != 'false' && (env.INPUT_PLATFORM == 'all' || env.INPUT_PLATFORM == 'ios')
        continue-on-error: true
        env:
          # V3 control-plane rejects Expo tokens; eoas publish authenticates with the
          # app-scoped EOO_TOKEN. The production channel→branch mapping is a one-time
          # dashboard step, so no admin creds are needed here.
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          OTA_EXPECT_RUNTIME_VERSION: ${{ steps.train_guard.outputs.ios_runtime_version }}
          OTA_EXPECT_MAIN_SHA: ${{ steps.train_baselines.outputs.main_sha }}
          OTA_EXPECT_TRAIN_SHA: ${{ steps.train_baselines.outputs.train_sha }}
          OTA_LIVE_STORE_RUNTIMES: ${{ steps.live_store.outputs.live_runtimes }}
        # The publisher independently confirms a train guard's exact runtime,
        # then freezes it through export/retries. Other publishes resolve the
        # current commit's fingerprint directly. That matches the shipped binary — which embeds the same Linux gate
        # fingerprint (set at build time, ios-testflight-rn.yml) — for a JS-only
        # commit, and on a native change it resolves the NEW fingerprint, so old
        # binaries (still on the old one) never receive JS that needs the new native
        # code. Pinning to the last tag instead would do exactly that — a crash.
        run: |
          args=(--channel "$OTA_BRANCH" --platform ios)
          if [ -n "$INPUT_MESSAGE" ]; then args+=(--message "$INPUT_MESSAGE"); fi
          vp run mobile:publish -- "${args[@]}"

      # eoas leaves this platform's export in packages/mobile/dist. Upload it
      # before the Android publish, which cleans/replaces dist. Keep this
      # non-blocking here so Android, changelog, publish notification, and health
      # reporting still complete; the explicit terminal gate below turns the run
      # red after those operational steps.
      - name: Upload iOS OTA source maps to Sentry
        id: upload_sourcemaps_ios
        if: steps.publish_ios.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: vp run mobile:upload-sourcemaps -- --platform ios

      - name: Archive staged iOS export
        if: inputs.stage_for_production_deploy && steps.publish_ios.outcome == 'success'
        run: |
          mkdir -p ota-stage
          cp -a packages/mobile/dist ota-stage/ios

      - name: Publish Android OTA
        id: publish_android
        if: always() && steps.gate.outputs.configured == 'true' && steps.generate.outcome == 'success' && steps.sentry_uploader.outcome == 'success' && (!inputs.stage_for_production_deploy || steps.baseline.outcome == 'success') && (inputs.stage_for_production_deploy || steps.unlock.outcome == 'success') && steps.expect.outputs.mismatch != 'true' && steps.train_guard.outputs.publish_android != 'false' && (env.INPUT_PLATFORM == 'all' || env.INPUT_PLATFORM == 'android')
        continue-on-error: true
        env:
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
          OTA_EXPECT_RUNTIME_VERSION: ${{ steps.train_guard.outputs.android_runtime_version }}
          OTA_EXPECT_MAIN_SHA: ${{ steps.train_baselines.outputs.main_sha }}
          OTA_EXPECT_TRAIN_SHA: ${{ steps.train_baselines.outputs.train_sha }}
          OTA_LIVE_STORE_RUNTIMES: ${{ steps.live_store.outputs.live_runtimes }}
          # Must match the Android native prebuild (android-apk-rn.yml) so the
          # resolved android.config.googleMaps block — and the freshly-resolved
          # fingerprint — agree with the binary. (No fingerprint override: see the
          # iOS publish step; the publish resolves the current commit's fingerprint.)
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          args=(--channel "$OTA_BRANCH" --platform android)
          if [ -n "$INPUT_MESSAGE" ]; then args+=(--message "$INPUT_MESSAGE"); fi
          vp run mobile:publish -- "${args[@]}"

      - name: Upload Android OTA source maps to Sentry
        id: upload_sourcemaps_android
        if: steps.publish_android.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: vp run mobile:upload-sourcemaps -- --platform android

      - name: Archive staged Android export
        if: inputs.stage_for_production_deploy && steps.publish_android.outcome == 'success'
        run: cp -a packages/mobile/dist ota-stage/android

      - name: Record staged export fingerprints and hashes
        if: inputs.stage_for_production_deploy && steps.publish_ios.outcome == 'success' && steps.publish_android.outcome == 'success'
        run: |
          set -euo pipefail
          ios_runtime="$(cat ota-stage/ios-runtime)"
          android_runtime="$(cat ota-stage/android-runtime)"
          test -n "$ios_runtime" && test -n "$android_runtime"
          ios_bundle="$(jq -r '.fileMetadata.ios.bundle' ota-stage/ios/metadata.json)"
          android_bundle="$(jq -r '.fileMetadata.android.bundle' ota-stage/android/metadata.json)"
          ios_hash="$(sha256sum "ota-stage/ios/$ios_bundle" | cut -d' ' -f1)"
          android_hash="$(sha256sum "ota-stage/android/$android_bundle" | cut -d' ' -f1)"
          update_message="$INPUT_MESSAGE"
          if [ -z "$update_message" ]; then update_message="$(git log -1 --format=%s "$GITHUB_SHA")"; fi
          jq -n --slurpfile baseline ota-stage/baseline.json --slurpfile early_baseline ota-stage/early-baseline.json --arg sha "$GITHUB_SHA" --arg message "$update_message" \
            --arg ios_runtime "$ios_runtime" --arg android_runtime "$android_runtime" \
            --arg ios_hash "$ios_hash" --arg android_hash "$android_hash" \
            '{commitHash:$sha,message:$message,baselineProductionUpdateIds:$baseline[0],baselineEarlyUpdateIds:$early_baseline[0],platforms:{ios:{runtimeVersion:$ios_runtime,bundleSha256:$ios_hash},android:{runtimeVersion:$android_runtime,bundleSha256:$android_hash}}}' \
            > ota-stage/receipt.json
          cp packages/mobile/src/data/changelog.generated.json ota-stage/changelog.generated.json
          cp CHANGELOG.md ota-stage/CHANGELOG.md
          if [ -f "$RUNNER_TEMP/discord-changelog.md" ]; then
            cp "$RUNNER_TEMP/discord-changelog.md" ota-stage/discord-changelog.md
          else
            : > ota-stage/discord-changelog.md
          fi

      - name: Verify both staged updates appear in the picker
        if: inputs.stage_for_production_deploy && steps.publish_ios.outcome == 'success' && steps.publish_android.outcome == 'success'
        run: vp exec tsx scripts/mobile-ota-stage-verify.ts ota-stage/receipt.json

      - name: Upload staged OTA export
        if: inputs.stage_for_production_deploy && steps.publish_ios.outcome == 'success' && steps.publish_android.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ota-stage
          path: ota-stage/
          retention-days: 7
          if-no-files-found: error

      # Publish both requested platforms before deciding the job result. This
      # makes a partial release explicit without trying to roll back the platform
      # that already succeeded (eoas has no safe cross-platform transaction).
      - name: Summarize platform publish results
        id: publish_summary
        if: always() && steps.gate.outputs.configured == 'true' && steps.generate.outcome == 'success'
        env:
          IOS_OUTCOME: ${{ steps.publish_ios.outcome }}
          ANDROID_OUTCOME: ${{ steps.publish_android.outcome }}
          # Empty on a main run (the guard step is skipped there); 'false' only
          # when the train guard deliberately withheld that platform.
          TRAIN_PUBLISH_IOS: ${{ steps.train_guard.outputs.publish_ios }}
          TRAIN_PUBLISH_ANDROID: ${{ steps.train_guard.outputs.publish_android }}
        run: |
          set -euo pipefail
          ios_requested=false
          android_requested=false
          case "$INPUT_PLATFORM" in
            all) ios_requested=true; android_requested=true ;;
            ios) ios_requested=true ;;
            android) android_requested=true ;;
            *) echo "::error::Unknown platform '$INPUT_PLATFORM'"; exit 1 ;;
          esac

          # A platform the train guard withheld was never attempted, so its
          # `skipped` outcome is the intended result, not a failure. Without this
          # every train push before the first native change — and every
          # main→release/next sync — would red the run, and a change that moves
          # only one platform's fingerprint would red a run whose other publish
          # succeeded.
          # A warning, not a notice: a dispatched single-platform republish that
          # ends here published nothing at all, and the native build that asked
          # for it is waiting on an update its binary will never receive. Green is
          # the right result — nothing failed — but it must not look like a
          # successful publish in the run list.
          if [ "$TRAIN_PUBLISH_IOS" = false ]; then
            ios_requested=false
            echo "::warning::iOS published nothing: the train's fingerprint guard withheld it (no native change of the train's own, or a newer train commit decides). Not counted toward this run's result."
          fi
          if [ "$TRAIN_PUBLISH_ANDROID" = false ]; then
            android_requested=false
            echo "::warning::Android published nothing: the train's fingerprint guard withheld it (no native change of the train's own, or a newer train commit decides). Not counted toward this run's result."
          fi

          # Every requested platform was withheld: nothing was published, so both
          # outputs must be FALSE and the step must stop here. `all_success=true`
          # would be a vacuous claim that every platform shipped, and the steps
          # that consume it act on that claim — the served-manifest verify would
          # go looking for an update that was never published and fail the run.
          # Falling through instead would compute all_success=true for the same
          # reason (no requested platform left to contradict it), which is exactly
          # what this branch exists to prevent.
          if [ "$ios_requested" = false ] && [ "$android_requested" = false ]; then
            echo "all_success=false" >> "$GITHUB_OUTPUT"
            echo "any_success=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The train owns none of the requested runtimeVersion(s) — nothing to publish from it."
            exit 0
          fi

          all_success=true
          any_success=false
          if [ "$ios_requested" = true ]; then
            [ "$IOS_OUTCOME" = success ] && any_success=true || all_success=false
          fi
          if [ "$android_requested" = true ]; then
            [ "$ANDROID_OUTCOME" = success ] && any_success=true || all_success=false
          fi
          # Keep these outputs before the failure exit below: downstream steps
          # use them to distinguish full success from a partial publish.
          echo "all_success=$all_success" >> "$GITHUB_OUTPUT"
          echo "any_success=$any_success" >> "$GITHUB_OUTPUT"
          {
            echo '### Production OTA platform results'
            echo
            echo "- iOS: $IOS_OUTCOME"
            echo "- Android: $ANDROID_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$all_success" != true ]; then
            echo "::error::At least one requested platform failed. Successful platforms remain published; no automatic rollback was attempted."
            exit 1
          fi

      # The postcondition of a republish, checked against the server rather than
      # inferred from a green publish step: ask the manifest endpoint exactly what
      # the app asks, and require an update that (a) is for the fingerprint the
      # binary embeds and (b) was created after this run started, i.e. after the
      # build that dispatched us finished bundling. "The publish command exited 0"
      # is a proxy; this is the actual thing — the 2026-09-01 stranding had a green
      # publish too. The health check can't cover this: an install running its own
      # embedded bundle is not an emergency launch, so the fleet reads as healthy.
      - name: Verify the republished update is the one the fleet will see
        if: ${{ !inputs.stage_for_production_deploy && steps.gate.outputs.configured == 'true' && github.event.inputs.expect_fingerprint != '' && steps.expect.outputs.mismatch != 'true' && steps.publish_summary.outputs.all_success == 'true' }}
        env:
          EXPECT_FINGERPRINT: ${{ github.event.inputs.expect_fingerprint }}
          PLATFORM: ${{ github.event.inputs.platform }}
          STARTED_AT: ${{ steps.expect.outputs.started_at }}
        run: |
          set -euo pipefail
          body="$(curl -sS --fail-with-body --max-time 60 \
            -H "expo-platform: $PLATFORM" \
            -H "expo-runtime-version: $EXPECT_FINGERPRINT" \
            -H 'expo-channel-name: production' \
            -H 'expo-app-id: 007e6fd7-f200-448c-9449-8d48ba5d51fc' \
            -H 'xprem-branch: ' \
            -H 'expo-protocol-version: 1' \
            -H 'accept: multipart/mixed' \
            "$EXPO_UPDATES_URL")"
          # A `directive` part (noUpdateAvailable / rollBackToEmbedded) means the
          # server has nothing for this fingerprint — the opposite of what we set
          # out to guarantee.
          served_rv="$(printf '%s' "$body" | grep -o '"runtimeVersion":"[0-9a-f]*"' | head -1 | cut -d'"' -f4)"
          created_at="$(printf '%s' "$body" | grep -o '"createdAt":"[^"]*"' | head -1 | cut -d'"' -f4)"
          if [ -z "$served_rv" ] || [ -z "$created_at" ]; then
            echo "::error::No manifest served for $PLATFORM runtimeVersion $EXPECT_FINGERPRINT — the binary that asked for this republish has no update at all."
            exit 1
          fi
          if [ "$served_rv" != "$EXPECT_FINGERPRINT" ]; then
            echo "::error::Server is serving runtimeVersion $served_rv, not $EXPECT_FINGERPRINT."
            exit 1
          fi
          # Both sides trimmed to whole seconds so a fractional `…48.000Z` and a
          # bare `…48Z` still order correctly as strings.
          if [ "${created_at:0:19}" \< "$STARTED_AT" ]; then
            echo "::error::Served update was created at $created_at, before this run started ($STARTED_AT). The republish did not become the newest update, so the new binary will keep launching its embedded bundle."
            exit 1
          fi
          echo "::notice::$PLATFORM is served an update for $EXPECT_FINGERPRINT created at $created_at — newer than the binary that asked for it."

      # Push the refreshed changelog to main so the committed copy is the single
      # source of truth (native builds bundle it; the next OTA diffs against it).
      # Runs AFTER publish, so the rebase here can't change what was just bundled.
      # The commit carries [skip ci], so this push can't re-trigger the workflow.
      # Rebase-and-retry guards a non-OTA push landing on main since checkout (OTA
      # runs are serialized on main, so two of these never race; only this workflow
      # writes the file, so the rebase can't conflict). This step is where the
      # changelog is committed at all — the generate step only regenerates it, so
      # that the publish above keeps HEAD on the real triggering commit. When any
      # requested platform fails the regenerated files stay unpushed; the next
      # successful run regenerates them from merged PRs and pushes them.
      # Auth is the app token that checkout persisted (the app is in main's
      # PR-bypass list; github-actions[bot] is not, so it would 403). Skips when the
      # app isn't configured — checkout then holds only the default token, the OTA
      # already shipped, and main's committed copy is just left unchanged.
      - name: Push changelog to main
        if: github.ref == 'refs/heads/main' && !inputs.stage_for_production_deploy && steps.publish_summary.outputs.all_success == 'true' && steps.generate.outputs.changed == 'true' && vars.OTA_PUSH_APP_ID != ''
        run: |
          set -euo pipefail
          cp packages/mobile/src/data/changelog.generated.json "$RUNNER_TEMP/changelog.json"
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"
          for attempt in 1 2 3; do
            git fetch origin main
            # Idempotent: skip only when main already carries BOTH the same JSON
            # entries (ignoring the generatedAt timestamp) AND the same CHANGELOG.md.
            # Checking the markdown too covers the bootstrap case where main has the
            # entries but not yet the (newly added) CHANGELOG.md.
            main_entries="$(git show origin/main:packages/mobile/src/data/changelog.generated.json 2>/dev/null | jq -cS '.entries' 2>/dev/null || echo 'missing-json')"
            our_entries="$(jq -cS '.entries' "$RUNNER_TEMP/changelog.json")"
            main_md="$(git show origin/main:CHANGELOG.md 2>/dev/null || echo 'missing-md')"
            our_md="$(cat "$RUNNER_TEMP/CHANGELOG.md")"
            if [ "$main_entries" = "$our_entries" ] && [ "$main_md" = "$our_md" ]; then
              echo "main already has the current changelog (json + CHANGELOG.md) — nothing to push."
              exit 0
            fi
            # Land ONLY the two changelog files on top of the latest main: hard-reset
            # to main (so we never revert files changed since our checkout), then
            # re-apply our generated files. No rebase — a full-file regen can't
            # auto-merge a different generatedAt.
            git reset --hard origin/main
            cp "$RUNNER_TEMP/changelog.json" packages/mobile/src/data/changelog.generated.json
            cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
            git add packages/mobile/src/data/changelog.generated.json CHANGELOG.md
            if git diff --cached --quiet; then
              echo "Changelog matches main (timestamp aside) — nothing to push."
              exit 0
            fi
            git commit -m "chore(changelog): refresh from merged PRs [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed refreshed changelog to main."
              exit 0
            fi
            echo "Push rejected (main advanced); retry ${attempt}/3…"
          done
          echo "::error::Could not push the changelog to main after 3 attempts."
          exit 1

      # Announce the publish to the Discord deploy channel (same webhook + pattern
      # as ios-testflight-rn.yml / android-apk-rn.yml). Only announce success when
      # every requested platform succeeded. A `--platform ios` run reports just
      # "iOS" (the Android step is skipped, not success).
      - name: Notify deployments channel
        if: github.ref == 'refs/heads/main' && !inputs.stage_for_production_deploy && steps.publish_summary.outputs.all_success == 'true'
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          EXPECT_FINGERPRINT: ${{ github.event.inputs.expect_fingerprint }}
          IOS_OUTCOME: ${{ steps.publish_ios.outcome }}
          ANDROID_OUTCOME: ${{ steps.publish_android.outcome }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          platforms=""
          [ "$IOS_OUTCOME" = "success" ] && platforms="iOS"
          [ "$ANDROID_OUTCOME" = "success" ] && platforms="${platforms:+$platforms, }Android"
          # Prefer the "What's new" block the generate step rendered from the
          # changelog diff (the entries this OTA newly added). It's empty when
          # nothing new shipped (changelog unchanged) — then fall back to the
          # triggering commit's subject. Read the subject from $COMMIT_SHA rather
          # than a bare `git log -1`: HEAD is the triggering commit on a push, but
          # not on a workflow_dispatch, and $COMMIT_SHA is right either way. It is
          # also the subject the OTA itself now carries, so a Discord line and a row
          # on the update server name one and the same commit.
          SUMMARY_FILE="$RUNNER_TEMP/discord-changelog.md"
          if [ -s "$SUMMARY_FILE" ]; then
            # Build the header and the block in ONE printf so the newline between
            # them survives — `$(printf '…\n')$(cat …)` would strip the trailing
            # newline and glue the header onto the first category label.
            BODY="$(printf '**What'\''s new**\n%s' "$(cat "$SUMMARY_FILE")")"
          else
            BODY="message: ${INPUT_MESSAGE:-$(git log -1 --pretty=%s "$COMMIT_SHA")}"
          fi
          # A republish dispatched by a native build re-ships JS that is usually
          # identical to the last push's OTA, so say what it is — otherwise it reads
          # as a second release of the same commit minutes later.
          if [ -n "$EXPECT_FINGERPRINT" ]; then
            HEADER=$(printf '♻️ **Production OTA republished** on `%s` — so the new %s build can receive it' \
              "${COMMIT_SHA:0:7}" "$platforms")
          else
            HEADER=$(printf '🚀 **Production OTA published** on `%s`' "${COMMIT_SHA:0:7}")
          fi
          CONTENT=$(printf '%s\n• platforms: %s\n• channel: production\n\n%s\n<%s>' \
            "$HEADER" "$platforms" "$BODY" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      # Post-publish OTA health gate — NON-BLOCKING. Production OTAs publish to our
      # self-hosted server (not EAS), so `eas update:insights` can't see them.
      # Instead we read the app's own launch telemetry from PostHog
      # (OtaUpdateTracker → "OTA Update Status") and flag a spike in emergency
      # launches — downloaded JS that failed to boot and fell back to the embedded
      # bundle. continue-on-error keeps a tripped gate from ever failing the
      # publish; the script itself exits 0 unless the emergency-launch rate clears
      # the threshold AND the sample size is sufficient, so the low-volume minutes
      # right after a publish can't false-trip it. This is a best-effort EARLY
      # signal (the fleet relaunches over hours); the authoritative read is a
      # manual/scheduled re-run later: `vp run mobile:ota-health-check`. Activates
      # only once the POSTHOG_PERSONAL_API_KEY secret exists — the script skips
      # (exit 0) without it, since secrets can't be referenced in a step `if:`.
      # POSTHOG_PROJECT_ID / POSTHOG_HOST are left to the script defaults
      # (project 412845, us.posthog.com), matching scripts/refresh-recommendations.ts.
      # See docs/mobile-ota-updates.md ("Health monitoring & rollback").
      - name: OTA health check (non-blocking)
        id: health
        if: always() && github.ref == 'refs/heads/main' && !inputs.stage_for_production_deploy && steps.gate.outputs.configured == 'true' && (steps.publish_ios.outcome == 'success' || steps.publish_android.outcome == 'success')
        continue-on-error: true
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          # Short settle so a few early relaunches land for the adoption line. The
          # GATE doesn't depend on it: it reads the fleet-wide emergency-launch rate
          # over the whole --hours 6 window, which already carries plenty of samples
          # from launches before this publish — a still-crashing prior OTA trips it
          # immediately, while the just-published bundle's own telemetry trickles in
          # over hours (re-run `vp run mobile:ota-health-check` later for that).
          sleep 30
          vp run mobile:ota-health-check -- --hours 6 --out "$RUNNER_TEMP/ota-health.md"

      # Surface the health verdict on the same Discord deploy channel as the
      # publish announcement. Posts only when the check produced a summary (it
      # writes nothing when skipped for a missing PostHog key). steps.health.outcome
      # is 'failure' only when the gate tripped (continue-on-error turned the
      # non-zero exit into a step failure without failing the job).
      - name: Notify OTA health to Discord
        if: always() && github.ref == 'refs/heads/main' && !inputs.stage_for_production_deploy && steps.gate.outputs.configured == 'true' && (steps.publish_ios.outcome == 'success' || steps.publish_android.outcome == 'success')
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/ota-health.md"
          if [ ! -s "$SUMMARY_FILE" ]; then
            echo "No OTA health summary (check skipped or produced no output) — nothing to post."
            exit 0
          fi
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          HEADER='🩺 **Production OTA health**'
          [ "$HEALTH_OUTCOME" = "failure" ] && HEADER='🚨 **Production OTA health — emergency-launch spike**'
          CONTENT=$(printf '%s\n%s\n<%s>' "$HEADER" "$(cat "$SUMMARY_FILE")" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

      # Source-map upload is deliberately non-atomic with OTA publish: by the time
      # Sentry accepts the Debug ID, the update is already live. Surface that exact
      # degraded state in the Actions log before the terminal gate turns the run
      # red. The one Discord failure notification below includes both publish and
      # source-map outcomes, avoiding a second alert for this same failure.
      - name: Warn that published OTA source maps are missing
        if: always() && ((steps.publish_ios.outcome == 'success' && steps.upload_sourcemaps_ios.outcome != 'success') || (steps.publish_android.outcome == 'success' && steps.upload_sourcemaps_android.outcome != 'success'))
        env:
          IOS_PUBLISH_OUTCOME: ${{ steps.publish_ios.outcome }}
          ANDROID_PUBLISH_OUTCOME: ${{ steps.publish_android.outcome }}
          IOS_MAP_OUTCOME: ${{ steps.upload_sourcemaps_ios.outcome }}
          ANDROID_MAP_OUTCOME: ${{ steps.upload_sourcemaps_android.outcome }}
        run: |
          platforms=""
          [ "$IOS_PUBLISH_OUTCOME" = "success" ] && [ "$IOS_MAP_OUTCOME" != "success" ] && platforms="iOS"
          [ "$ANDROID_PUBLISH_OUTCOME" = "success" ] && [ "$ANDROID_MAP_OUTCOME" != "success" ] && platforms="${platforms:+$platforms, }Android"
          echo "::warning::The $platforms OTA is live, but its Sentry source-map upload did not succeed. Recreate the exact platform export before another eoas publish replaces dist."

      - name: Require every published OTA source-map upload
        if: always() && ((steps.publish_ios.outcome == 'success' && steps.upload_sourcemaps_ios.outcome != 'success') || (steps.publish_android.outcome == 'success' && steps.upload_sourcemaps_android.outcome != 'success'))
        run: |
          echo "::error::At least one published OTA has no accepted Sentry source maps."
          exit 1

      - name: Notify deployments channel of failure
        if: always() && github.ref == 'refs/heads/main' && failure()
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          IOS_OUTCOME: ${{ steps.publish_ios.outcome }}
          ANDROID_OUTCOME: ${{ steps.publish_android.outcome }}
          IOS_MAP_OUTCOME: ${{ steps.upload_sourcemaps_ios.outcome }}
          ANDROID_MAP_OUTCOME: ${{ steps.upload_sourcemaps_android.outcome }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          CONTENT=$(printf '🚨 **Production OTA workflow failed** on `%s`\n• iOS publish: %s · source maps: %s\n• Android publish: %s · source maps: %s\n• Any successful platform remains published; no automatic rollback was attempted.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$IOS_OUTCOME" "$IOS_MAP_OUTCOME" "$ANDROID_OUTCOME" "$ANDROID_MAP_OUTCOME" "$RUN_URL")
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  notify-train-deployment:
    needs: [publish, live-store-runtimes]
    if: always() && !cancelled() && github.ref == 'refs/heads/release/next'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    # Deliberately no `environment: Production`: its only secret,
    # DISCORD_DEPLOY_WEBHOOK, is repository-level, and an environment is one
    # more thing a job can wait on before it starts. In run 40105607795 this job
    # never started and sat for 27 hours. It is outside the publish lane now, so
    # a repeat would hold nothing up.
    steps:
      # Outputs carry only publication results; webhook delivery runs main code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Record confirmed train publications and failures
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          TRAIN_VERSION: ${{ needs.publish.outputs.train_version }}
          IOS_OUTCOME: ${{ needs.publish.outputs.ios_outcome }}
          ANDROID_OUTCOME: ${{ needs.publish.outputs.android_outcome }}
          IOS_RUNTIME: ${{ needs.publish.outputs.ios_runtime }}
          ANDROID_RUNTIME: ${{ needs.publish.outputs.android_runtime }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          STORE_RESULT: ${{ needs.live-store-runtimes.result }}
        run: |
          set -euo pipefail
          for platform in ios android; do
            outcome="$IOS_OUTCOME"
            runtime="$IOS_RUNTIME"
            if [ "$platform" = android ]; then outcome="$ANDROID_OUTCOME"; runtime="$ANDROID_RUNTIME"; fi
            if [ "$outcome" != success ]; then continue; fi
            args=(record --events train-deployment-events.json --kind train-published
              --branch production --commit "$SOURCE_COMMIT" --platform "$platform"
              --runtime "$runtime" --percentage 100 --reason 'release/next published immediately')
            if [ -n "$TRAIN_VERSION" ]; then args+=(--version "$TRAIN_VERSION"); fi
            node --experimental-strip-types scripts/mobile-ota-notify.ts "${args[@]}"
          done
          if [ "$PUBLISH_RESULT" = failure ] || [ "$STORE_RESULT" = failure ]; then
            node --experimental-strip-types scripts/mobile-ota-notify.ts record \
              --events train-deployment-events.json --kind failed --branch production \
              --commit "$SOURCE_COMMIT" --reason "Train OTA: publish=$PUBLISH_RESULT, public-store evidence=$STORE_RESULT. Successful platforms remain published."
          fi
      - name: Deliver train deployment events
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          if [ -f train-deployment-events.json ]; then
            node --experimental-strip-types scripts/mobile-ota-notify.ts deliver --events train-deployment-events.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: train-deployment-events
          path: train-deployment-events.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Surface train notification failure
        if: failure()
        run: |
          echo '::warning::Train Discord delivery failed; successful OTA publications remain valid.'
          echo 'Train Discord delivery failed. Pending events remain in the retained artifact.' >> "$GITHUB_STEP_SUMMARY"
