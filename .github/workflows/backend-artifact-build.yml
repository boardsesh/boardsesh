name: Build backend artifact

# Build a daemon while production publishers are paused. A separate manual
# promotion can move only its production tag; neither mode deploys a service.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build an isolated artifact, or promote a previously accepted digest
        type: choice
        options: [build, promote]
        default: build
      artifact_digest:
        description: Promote only this accepted sha256 digest (empty for build)
        type: string
        default: ''
      artifact_source_sha:
        description: Exact accepted artifact source revision (empty for build)
        type: string
        default: ''
      expected_current_digest:
        description: Freshly inspected daemon production digest (empty for build)
        type: string
        default: ''

permissions: {}

concurrency:
  group: backend-artifact-build
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'boardsesh/boardsesh' && github.ref == 'refs/heads/main' && inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/boardsesh/boardsesh-daemon
      # A rerun gets a new tag rather than replacing an earlier artifact.
      IMAGE_TAG: r2-scheduler-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Generate backend Docker context
        run: node scripts/create-service-docker-context.mjs backend

      - name: Build and push the isolated backend artifact
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .docker-context/backend
          file: .docker-context/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BOARDSESH_BUILD_RELEASE=${{ github.sha }}
          # Read the normal backend cache without updating any shared tag.
          cache-from: type=registry,ref=ghcr.io/boardsesh/boardsesh-daemon:buildcache-main

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record the artifact identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The artifact digest or source revision is invalid.'
            exit 1
          fi
          {
            printf 'Source revision: `%s`\n\n' "$SOURCE_SHA"
            printf 'Artifact tag: `%s:%s`\n\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf 'Immutable image: `%s@%s`\n\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
            printf 'No production tag was promoted and no service was deployed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: github.repository == 'boardsesh/boardsesh' && github.ref == 'refs/heads/main' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Share the normal deploy lock, without enabling the disabled workflow.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Verify and promote only the accepted daemon digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_SOURCE_SHA: ${{ inputs.artifact_source_sha }}
          EXPECTED_CURRENT_DIGEST: ${{ inputs.expected_current_digest }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';

          const image = 'ghcr.io/boardsesh/boardsesh-daemon';
          const digestPattern = /^sha256:[0-9a-f]{64}$/;
          const shaPattern = /^[0-9a-f]{40}$/;
          const artifactDigest = process.env.ARTIFACT_DIGEST;
          const sourceSha = process.env.ARTIFACT_SOURCE_SHA;
          const baselineDigest = process.env.EXPECTED_CURRENT_DIGEST;
          const publishers = [
            'production-deploy.yml',
            'mobile-ota-production.yml',
            'mobile-ota-backport.yml',
            'mobile-ota-preview.yml',
            'mobile-ota-preview-prompt.yml',
            'mobile-ota-preview-sweep.yml',
          ];
          const statuses = ['requested', 'waiting', 'pending', 'queued', 'in_progress'];

          function run(command, args) {
            const result = spawnSync(command, args, { encoding: 'utf8', timeout: 60_000, maxBuffer: 2 * 1024 * 1024 });
            if (result.error || result.status !== 0) throw new Error(`${command} operation failed; reconcile the production digest before retrying.`);
            return result.stdout.trim();
          }
          function api(path) {
            return JSON.parse(run('gh', ['api', path]));
          }
          function inspect(reference) {
            const digest = run('docker', ['buildx', 'imagetools', 'inspect', reference, '--format', '{{.Manifest.Digest}}']);
            if (!digestPattern.test(digest)) throw new Error('Registry inspection returned an invalid digest.');
            return digest;
          }

          try {
            if (process.env.MODE !== 'promote' || process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || process.env.GITHUB_REPOSITORY !== 'boardsesh/boardsesh' || process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('Promotion is restricted to a manual main build in boardsesh/boardsesh.');
            if (!digestPattern.test(artifactDigest ?? '') || !digestPattern.test(baselineDigest ?? '') || !shaPattern.test(sourceSha ?? '') || !shaPattern.test(process.env.GITHUB_SHA ?? '')) throw new Error('Exact SHA256 image digests and a full source revision are required.');
            if (run('git', ['rev-parse', 'HEAD']) !== process.env.GITHUB_SHA) throw new Error('Checkout does not match the dispatched main revision.');
            run('git', ['merge-base', '--is-ancestor', sourceSha, process.env.GITHUB_SHA]);
            run('gh', [
              'attestation', 'verify', `oci://${image}@${artifactDigest}`,
              '--repo', 'boardsesh/boardsesh',
              '--signer-workflow', 'boardsesh/boardsesh/.github/workflows/backend-artifact-build.yml',
              '--source-ref', 'refs/heads/main',
              '--source-digest', sourceSha,
              '--deny-self-hosted-runners',
            ]);
            for (const publisher of publishers) {
              const workflowPath = `repos/boardsesh/boardsesh/actions/workflows/${publisher}`;
              if (api(workflowPath).state !== 'disabled_manually') throw new Error(`Publisher is not disabled: ${publisher}`);
              for (const status of statuses) {
                const runs = api(`${workflowPath}/runs?status=${status}&per_page=1`);
                if (runs.total_count !== 0 || !Array.isArray(runs.workflow_runs) || runs.workflow_runs.length !== 0) throw new Error(`Publisher is not drained: ${publisher} (${status})`);
              }
            }
            if (inspect(`${image}@${artifactDigest}`) !== artifactDigest) throw new Error('Registry artifact does not match the accepted digest.');
            if (inspect(`${image}:production`) !== baselineDigest) throw new Error('The production digest changed since the recorded baseline; no tag was moved.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Previous production: ${image}@${baselineDigest}\n\nAccepted artifact: ${image}@${artifactDigest}\n\nSource revision: ${sourceSha}\n\n`);
            // Registry tag writes have no compare-and-swap. All publishers must
            // remain frozen and the operator must exclude manual tag writers.
            run('docker', ['buildx', 'imagetools', 'create', '--prefer-index=false', '--tag', `${image}:production`, `${image}@${artifactDigest}`]);
            if (inspect(`${image}:production`) !== artifactDigest) throw new Error('Promotion did not preserve the accepted digest; reconcile before deploying.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Production tag verified. No Railway deployment or OTA publication was started.\n');
          } catch (error) {
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          }
          NODE
