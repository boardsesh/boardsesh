name: Android CI

on:
  push:
    branches-ignore: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          node-version: 'lts'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Read SDK versions from project config
        id: sdk-versions
        working-directory: mobile/android
        run: |
          COMPILE_SDK=$(grep 'compileSdkVersion' variables.gradle | grep -oP '\d+')
          echo "compile-sdk=$COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "Using compileSdkVersion=$COMPILE_SDK from variables.gradle"

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses 2>&1 | tail -5
          sdkmanager "platforms;android-${{ steps.sdk-versions.outputs.compile-sdk }}"

      - name: Install Node.js dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: bunx cap sync android

      - name: Build debug APK (compiler check)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: mobile/android
        run: ./gradlew test --stacktrace
