name: iOS CI (React Native)

on:
  pull_request:
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'scripts/prepare-rn-ios-tests.mjs'
      - 'scripts/mobile-framework-abi-check.ts'
      - 'scripts/__tests__/mobile-framework-abi-check.test.ts'
      - '.github/workflows/ios-rn-ci.yml'
      - '.github/actions/mobile-native-gate/**'
  workflow_dispatch:

concurrency:
  # One lane per PR branch; workflow_dispatch falls back to its selected ref.
  group: ios-rn-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Workflow-level so the ubuntu gate's fingerprint resolve and the macOS build
  # read an identical EXPO_PUBLIC_* set (hashed into the fingerprint via .env).
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com

jobs:
  gate:
    # Cheap ubuntu gate deciding whether the (expensive, macOS) build-and-test
    # job runs. Skips it on a JS-only PR — no native-input change, or an Expo
    # fingerprint unchanged vs main — mirroring main's native-skip for JS-only
    # merges. Runs on ubuntu: the fingerprint resolve is
    # file-hash based and needs no Xcode, so this spends no macOS minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: gate
        uses: ./.github/actions/mobile-native-gate
        with:
          platform: ios

  build-and-test:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    # macos-26 is GA on GitHub-hosted runners and matches the RN TestFlight
    # workflow's Xcode line; the PR workflow has passed on this label.
    runs-on: macos-26
    # 90, not 60: this job now compiles the app scheme (every Pod) on top of the
    # Swift test target, and there's no DerivedData cache — only the Pods sources
    # are cached. Native-input PRs only; the gate skips JS-only ones entirely.
    timeout-minutes: 90

    env:
      WORKSPACE_PATH: packages/mobile/ios/Boardsesh.xcworkspace
      SCHEME: BoardseshTests
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies
        run: vp install --frozen-lockfile

      - name: Check widget Swift duplicate drift
        run: vp test run packages/mobile/src/lib/live-activity/__tests__/widget-target-drift.test.ts --reporter=agent

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EOF

      - name: Expo prebuild (generate ios/)
        working-directory: packages/mobile
        run: vp exec expo prebuild --platform ios --clean --no-install

      # Key on the native inputs that decide the Pods, NOT ios/Podfile.lock: there
      # is no committed ios/ (CNG — `expo prebuild` generates it), and this step
      # runs BEFORE `pod install`, so hashFiles('packages/mobile/ios/Podfile.lock')
      # matched nothing and the key collapsed to a constant that froze the cache at
      # its first save. The native deps + plugins + patches are what move the Pods,
      # so hash those (mirrors ios-testflight-rn.yml).
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: packages/mobile/ios/Pods
          # No restore-keys. A prefix fallback restores the PREVIOUS Pods tree on
          # exactly the runs where the deps moved, and the second entry reached
          # into ios-testflight-rn.yml's bucket, so a PR could build against a
          # release build's Pods. A key miss must mean a clean `pod install`.
          key: ${{ runner.os }}-pods-rn-ci-${{ hashFiles('packages/mobile/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/app.config.ts', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/locales/**', 'packages/mobile/eas.json', 'packages/mobile/assets/icon.png', 'packages/mobile/assets/adaptive-icon.png', 'packages/mobile/assets/splash-icon.png', 'packages/mobile/targets/**', 'patches/**') }}

      - name: Install CocoaPods dependencies
        working-directory: packages/mobile/ios
        run: pod install

      # The BoardseshTests scheme below is a STANDALONE Swift target built from
      # copied sources — it never links the app and never compiles a single Pod.
      # So until this step existed, a workflow whose path filter and native gate
      # both key on `patches/**` compiled exactly zero lines of the native module
      # code those patches change: a run over an unreviewed Objective-C++ patch
      # went green with no `CompileC` anywhere in its log (caught on #4198).
      #
      # Building the app scheme is what actually compiles the Pods — RNScreens,
      # Reanimated, the BLE stack, our own modules under packages/mobile/modules.
      # Runs before the test target is grafted on, so it builds the project exactly
      # as `expo prebuild` produced it. Signing is off: this is a compile gate, not
      # something we install (contrast scripts/mobile-build-sim-app.ts, which
      # ad-hoc signs because that app has to actually run).
      # -derivedDataPath is pinned here (and on both test steps below, so they keep
      # sharing these build products instead of rebuilding into the default
      # DerivedData) to give the ABI check a deterministic path to the .app.
      - name: Build the app (compiles Pods + patched native modules)
        run: |
          set -o pipefail
          build() {
            xcodebuild build \
              -workspace "$WORKSPACE_PATH" \
              -scheme Boardsesh \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath packages/mobile/ios/build \
              ARCHS=arm64 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee "$1"
          }
          # New Architecture codegen ("Generate Specs") races the compile on a cold
          # build — "Build input file cannot be found: .../ReactCodegen/*-generated.mm".
          # Every run of this job is that scenario: a fresh runner with empty
          # DerivedData. scripts/mobile-build-sim-app.ts retries once for exactly
          # this reason; a real compile error still fails the retry.
          build build.log || { echo "::warning::retrying after probable codegen race"; build build.log; }

      # A green build is not proof the patch compiled. Expo's precompiled modules
      # are ON by default (the generated Podfile sets EXPO_USE_PRECOMPILED_MODULES
      # ||= 1) and swap a pod's source for a prebuilt xcframework the moment a
      # tarball resolves. RNScreens has no prebuild today — hence the log line
      # "prebuilt xcframework unavailable; building from source" — but if that ever
      # changes, this gate goes green having compiled none of the patch, and the
      # TestFlight build links the prebuilt too, shipping without it. So assert on
      # a file the patch actually touches. `buildFromSource` in
      # packages/mobile/package.json is the belt to this braces.
      - name: Assert the patched native module really compiled
        run: |
          if ! grep -q 'RNSScrollViewFinder' build.log; then
            echo "::error::No RNScreens source compiled — the patch was not exercised." \
                 "Check whether a prebuilt xcframework replaced the pod."
            exit 1
          fi
          echo "RNScreens compiled from source — patch exercised."

      # Same species as the assertion above: a green build is not proof of a
      # correct binary. Expo's precompiled modules mean ExpoModulesCore ships as
      # a prebuilt xcframework whose undefined symbols the linker never
      # re-validates, so a version skew against a locally-compiled sibling
      # (ExpoModulesJSI) survives compilation and aborts in dyld at launch. This
      # catches it on the PR, an hour and one branch upstream of the TestFlight
      # archive. Debug vs Release is irrelevant — the frameworks are prebuilt
      # either way.
      - name: Check embedded framework ABI
        run: vp run mobile:abi-check -- --app packages/mobile/ios/build/Build/Products/Debug-iphonesimulator/Boardsesh.app

      - name: Add RN Swift test target
        run: node scripts/prepare-rn-ios-tests.mjs

      - name: Resolve simulator destination
        id: simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in data['devices'][runtime]:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['name'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "device=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE_NAME"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest' \
            -configuration Debug \
            -derivedDataPath packages/mobile/ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Swift unit tests
        run: |
          xcodebuild test-without-building \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest' \
            -derivedDataPath packages/mobile/ios/build
