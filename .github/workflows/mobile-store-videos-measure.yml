name: Mobile Store Videos (Measure)

# Dispatch-only capture and measurement. No R2 or store writes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Measurement, capture, or finite session-input observation, or cached app export
        type: choice
        options:
          [
            measure,
            diagnose-profile-filter,
            record-profile,
            record-english,
            record-crew,
            observe-session-input,
            export-session-input-app,
          ]
        default: measure

permissions:
  contents: read
  actions: read

concurrency:
  # Crew uses the normal pipeline's account lock, including across feature refs.
  group: ${{ (inputs.mode == 'record-crew' || inputs.mode == 'observe-session-input') && 'store-videos-crew' || format('store-videos-measure-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'record-crew' && inputs.mode != 'observe-session-input' }}

jobs:
  record:
    if: inputs.mode != 'export-session-input-app'
    runs-on: macos-26
    # Three locale children already measured 91 minutes; four plus setup can
    # exceed two hours. Diagnostic/single-take modes get 45 minutes; English gets 60.
    timeout-minutes: ${{ inputs.mode == 'observe-session-input' && 30 || inputs.mode == 'record-english' && 60 || (inputs.mode == 'diagnose-profile-filter' || inputs.mode == 'record-profile' || inputs.mode == 'record-crew') && 45 || 180 }}
    env:
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_USE_RN_FETCH: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Compute screenshot app cache key
        id: appkey
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-screenshot-sim-app-v1-${{ hashFiles('packages/mobile/app.config.ts', 'packages/mobile/react-native.config.js', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/locales/**', 'packages/mobile/package.json', 'patches/**', 'package.json', 'pnpm-workspace.yaml', 'scripts/mobile-build-sim-app.ts', 'scripts/screenshot-sim.entitlements') }}" >> "$GITHUB_OUTPUT"
      - name: Restore screenshot dev-client
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
      - name: Require the exact cached app for finite observation
        if: inputs.mode == 'observe-session-input'
        env:
          CACHE_HIT: ${{ steps.app-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.appkey.outputs.key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true || { echo 'Observation requires cache hit; no build permitted.'; exit 1; }
          test "$CACHE_KEY" = macOS-ARM64-screenshot-sim-app-v1-9dd78a74eb71965f2e0876a147045ef8207d824eb936ee349170ddcd54a8082a
      - name: Record exact cache metadata for finite observation
        if: inputs.mode == 'observe-session-input'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.appkey.outputs.key }}
        run: |
          set -euo pipefail
          mkdir -p .boardsesh/session-input-observation/public
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$CACHE_KEY" --jq '.actions_caches | map({id, key, ref, size_in_bytes, created_at, last_accessed_at})' > .boardsesh/session-input-observation/public/cache-metadata.json
          jq -e 'length > 0 and all(.[]; .key == env.CACHE_KEY)' .boardsesh/session-input-observation/public/cache-metadata.json > /dev/null
      - name: Build dev-client on cache miss
        if: inputs.mode != 'observe-session-input' && steps.app-cache.outputs.cache-hit != 'true'
        run: vp exec tsx scripts/store-video-measure.ts build metrics/build.json -- vp run mobile:build-sim-app -- --app-out packages/mobile/.app-cache --clean
      - name: Save screenshot dev-client
        if: inputs.mode != 'observe-session-input' && steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Maestro and ffmpeg
        env:
          MAESTRO_VERSION: 2.6.1
          OBSERVATION_MODE: ${{ inputs.mode }}
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"
          if [ "$OBSERVATION_MODE" != observe-session-input ]; then
            brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          fi
      - name: Observe one session visibility input without starting a session
        if: inputs.mode == 'observe-session-input'
        env:
          SESSION_INPUT_OBSERVATION: '1'
          OBSERVATION_CACHE_HIT: ${{ steps.app-cache.outputs.cache-hit }}
          OBSERVATION_CACHE_KEY: ${{ steps.appkey.outputs.key }}
        run: vp exec tsx scripts/observe-session-input.ts
      - name: Retain only redacted finite-observation evidence
        if: always() && inputs.mode == 'observe-session-input'
        uses: actions/upload-artifact@v4
        with:
          name: session-input-observation-redacted
          path: .boardsesh/session-input-observation/public/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Record MoonBoard in four locales
        if: inputs.mode == 'measure'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts record metrics/record.json -- vp run video:record -- --kind moonboard --locales all --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Diagnose one English profile-filter tap
        if: inputs.mode == 'diagnose-profile-filter'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts diagnose-profile-filter metrics/diagnose-profile-filter.json -- vp run video:record -- --kind moonboard --locale en-US --diagnose-profile-filter --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Record one English profile progress take
        if: inputs.mode == 'record-profile'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts record-profile metrics/record-profile.json -- vp run video:record -- --kind moonboard --locale en-US --only log --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Record the English MoonBoard sequence
        if: inputs.mode == 'record-english'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts record-english metrics/record-english.json -- vp run video:record -- --kind moonboard --locale en-US --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Record one English crew take without publishing
        if: inputs.mode == 'record-crew'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
          SHOWCASE_SECONDARY_EMAIL: ${{ secrets.SHOWCASE_SECONDARY_EMAIL }}
          SHOWCASE_SECONDARY_PASSWORD: ${{ secrets.SHOWCASE_SECONDARY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p metrics
          git rev-parse HEAD > metrics/crew-source-sha.txt
          vp exec tsx scripts/store-video-measure.ts crew-check metrics/crew-check.json -- vp run video:record -- --kind default --locale en-US --only crew --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Retain the crew capture for one day
        if: inputs.mode == 'record-crew'
        uses: actions/upload-artifact@v4
        with:
          name: store-video-frames-crew-check
          path: .boardsesh/showcase-video/work/boards/default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Hand off frames for one day
        if: inputs.mode != 'diagnose-profile-filter' && inputs.mode != 'record-crew' && inputs.mode != 'observe-session-input'
        uses: actions/upload-artifact@v4
        with:
          name: store-video-frames-moonboard
          path: .boardsesh/showcase-video/work/boards/moonboard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain measurement and debug logs
        if: always() && inputs.mode != 'observe-session-input'
        uses: actions/upload-artifact@v4
        with:
          name: store-video-record-metrics
          path: |
            metrics/
            .boardsesh/showcase-video/work/logs/
          include-hidden-files: true
          retention-days: 7

  render:
    needs: record
    if: inputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install Chromium and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          vp exec playwright install --with-deps chromium
        working-directory: packages/web
      - uses: actions/download-artifact@v4
        with:
          name: store-video-frames-moonboard
          path: .boardsesh/showcase-video/work/boards/moonboard
      - name: Render and validate four Apple search videos
        run: |
          set -euo pipefail
          for locale in en-US es fr de; do
            vp exec tsx scripts/store-video-measure.ts "render-$locale" "metrics/render-$locale.json" -- vp run video:render -- --target store-search --variant moonboard --locale "$locale"
          done
          test "$(find .boardsesh/app-store-creatives/moonboard -name search-results.mp4 | wc -l)" -eq 4
      - name: Retain four validated videos, posters and provenance
        uses: actions/upload-artifact@v4
        with:
          name: store-videos-moonboard
          path: .boardsesh/app-store-creatives/moonboard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain render measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-video-render-metrics
          path: metrics/
          retention-days: 7

  timings:
    if: always() && inputs.mode != 'observe-session-input' && inputs.mode != 'export-session-input-app'
    needs: [record, render]
    runs-on: ubuntu-latest
    steps:
      - name: Collect per-step minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > steps.json
          jq -r '["| Job | Step | Minutes | Result |", "| --- | --- | ---: | --- |"], (.[] .jobs[] | .name as $job | .steps[] | select(.started_at != null and .completed_at != null) | ["| \($job) | \(.name) | \((((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 * 100 | round) / 100) | \(.conclusion) |"] ) | .[]' steps.json | tee timings.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: store-video-step-timings
          path: |
            timings.md
            steps.json
          retention-days: 14

  # Temporary diagnostic handoff: restore and inspect the original CI build product only.
  # No dependency install, build, simulator, app launch, Metro, account, or capture path.
  export-app:
    if: inputs.mode == 'export-session-input-app'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore only the exact failed-run dev-client
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile/.app-cache
          key: macOS-ARM64-screenshot-sim-app-v1-9dd78a74eb71965f2e0876a147045ef8207d824eb936ee349170ddcd54a8082a
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Record cache inventory metadata without exporting cache contents
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: macOS-ARM64-screenshot-sim-app-v1-9dd78a74eb71965f2e0876a147045ef8207d824eb936ee349170ddcd54a8082a
        run: |
          set -euo pipefail
          mkdir -p .boardsesh/session-input-app-export/metadata
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$CACHE_KEY" --jq '.actions_caches | map({id, key, ref, size_in_bytes, created_at, last_accessed_at})' > .boardsesh/session-input-app-export/metadata/cache-metadata.json
          jq -e 'length > 0 and all(.[]; .key == env.CACHE_KEY)' .boardsesh/session-input-app-export/metadata/cache-metadata.json > /dev/null
      - name: Inspect the restored build product and archive unchanged native bytes
        id: inspect
        env:
          SESSION_INPUT_APP_EXPORT: '1'
          OBSERVATION_CACHE_HIT: ${{ steps.app-cache.outputs.cache-hit }}
          OBSERVATION_CACHE_KEY: macOS-ARM64-screenshot-sim-app-v1-9dd78a74eb71965f2e0876a147045ef8207d824eb936ee349170ddcd54a8082a
        run: node --experimental-strip-types scripts/export-session-input-app.ts
      - name: Retain sanitized inventory even when binary export is rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-input-app-inventory
          path: .boardsesh/session-input-app-export/metadata/
          if-no-files-found: warn
          retention-days: 1
      - name: Retain only the inspected cached dev-client for local diagnosis
        if: steps.inspect.outputs.safe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: session-input-cached-app-sdk26_5
          path: .boardsesh/session-input-app-export/binary/Boardsesh-ci-sdk26_5.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
