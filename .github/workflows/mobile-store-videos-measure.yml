name: Mobile Store Videos (Measure)

# Dispatch-only capture and measurement. No R2 or store writes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Four-locale measurement, filter diagnostic, progress take, English sequence, or crew capture
        type: choice
        options: [measure, diagnose-profile-filter, record-profile, record-english, record-crew]
        default: measure

permissions:
  contents: read
  actions: read

concurrency:
  # Crew uses the normal pipeline's account lock, including across feature refs.
  group: ${{ inputs.mode == 'record-crew' && 'store-videos-crew' || format('store-videos-measure-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'record-crew' }}

jobs:
  crew-app:
    # Artifact-only cross-build experiment; ordinary modes and production pipeline stay unchanged.
    if: inputs.mode == 'record-crew'
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      archive-sha: ${{ steps.pack.outputs.archive-sha }}
      manifest-sha: ${{ steps.pack.outputs.manifest-sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_USE_RN_FETCH: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout workflow-owned crew cross-build tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .boardsesh/video-arch-tools
          sparse-checkout: |
            scripts/lib/ios-simulator-architecture.mjs
            scripts/lib/ios-crew-cross-artifact.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exact stable toolchain and Intel simulator SDK support
        run: node .boardsesh/video-arch-tools/scripts/lib/ios-crew-cross-artifact.mjs preflight . metrics/crew-toolchain.json
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: false
      - name: Install cross-build dependencies
        run: vp install --frozen-lockfile
      - name: Build the original Intel simulator product once on ARM
        run: vp exec tsx scripts/store-video-measure.ts build metrics/crew-cross-build.json -- vp run mobile:build-sim-app -- --clean --crew-cross-build-receipt metrics/crew-toolchain.json
      - name: Archive the untouched original app with exact provenance
        id: pack
        run: node .boardsesh/video-arch-tools/scripts/lib/ios-crew-cross-artifact.mjs pack . packages/mobile/ios/build/Build/Products/Debug-iphonesimulator/Boardsesh.app metrics/crew-toolchain.json .boardsesh/crew-cross-export
      - name: Hand off only this run's verified app and manifest for one day
        uses: actions/upload-artifact@v4
        with:
          name: crew-cross-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .boardsesh/crew-cross-export/app.tar
            .boardsesh/crew-cross-export/manifest.json
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
      - name: Retain bounded cross-build metadata and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-cross-build-metrics
          path: |
            metrics/crew-toolchain.json
            metrics/crew-cross-build.json
          retention-days: 7

  record:
    needs: crew-app
    if: ${{ !cancelled() && (inputs.mode != 'record-crew' || needs['crew-app'].result == 'success') }}
    runs-on: macos-26-intel
    # Three locale children already measured 91 minutes; four plus setup can
    # exceed two hours. Crew cold build has its separate 60-minute producer; this
    # consumer allows 45 minutes capture + 15 minutes dependency/artifact/tool setup.
    # Other diagnostics get 45 minutes; English gets 60. Inner UI/take deadlines stay fixed.
    timeout-minutes: ${{ inputs.mode == 'record-crew' && 60 || inputs.mode == 'record-english' && 60 || (inputs.mode == 'diagnose-profile-filter' || inputs.mode == 'record-profile') && 45 || 180 }}
    env:
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_USE_RN_FETCH: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout workflow-owned simulator architecture guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .boardsesh/video-arch-tools
          sparse-checkout: |
            scripts/lib/ios-simulator-architecture.mjs
            scripts/lib/ios-crew-cross-artifact.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Reject recording sources without the reviewed host-native builder
        run: node .boardsesh/video-arch-tools/scripts/lib/ios-simulator-architecture.mjs source .
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Compute screenshot app cache key
        if: inputs.mode != 'record-crew'
        id: appkey
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-screenshot-sim-app-v1-${{ hashFiles('packages/mobile/app.config.ts', 'packages/mobile/react-native.config.js', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/locales/**', 'packages/mobile/package.json', 'patches/**', 'package.json', 'pnpm-workspace.yaml', 'scripts/mobile-build-sim-app.ts', 'scripts/lib/ios-simulator-architecture.mjs', 'scripts/screenshot-sim.entitlements') }}" >> "$GITHUB_OUTPUT"
      - name: Restore screenshot dev-client
        if: inputs.mode != 'record-crew'
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
      - name: Build dev-client on cache miss
        if: inputs.mode != 'record-crew' && steps.app-cache.outputs.cache-hit != 'true'
        run: vp exec tsx scripts/store-video-measure.ts build metrics/build.json -- vp run mobile:build-sim-app -- --app-out packages/mobile/.app-cache --clean
      - name: Validate actual simulator app slices before use
        if: inputs.mode != 'record-crew'
        env:
          VIDEO_APP_CACHE_KEY: ${{ steps.appkey.outputs.key }}
        run: node .boardsesh/video-arch-tools/scripts/lib/ios-simulator-architecture.mjs app packages/mobile/.app-cache/Boardsesh.app "$VIDEO_APP_CACHE_KEY"
      - name: Save screenshot dev-client
        if: inputs.mode != 'record-crew' && steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
      - name: Download only this run's crew native artifact
        if: inputs.mode == 'record-crew'
        uses: actions/download-artifact@v4
        with:
          name: crew-cross-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: .boardsesh/crew-cross-received
      - name: Verify exact artifact and Intel runtime before any installation
        if: inputs.mode == 'record-crew'
        env:
          CREW_ARCHIVE_SHA: ${{ needs.crew-app.outputs.archive-sha }}
          CREW_MANIFEST_SHA: ${{ needs.crew-app.outputs.manifest-sha }}
        run: node .boardsesh/video-arch-tools/scripts/lib/ios-crew-cross-artifact.mjs verify . .boardsesh/crew-cross-received packages/mobile/.app-cache/Boardsesh.app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Maestro and ffmpeg
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Record MoonBoard in four locales
        if: inputs.mode == 'measure'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts record metrics/record.json -- vp run video:record -- --kind moonboard --locales all --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Diagnose one English profile-filter tap
        if: inputs.mode == 'diagnose-profile-filter'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts diagnose-profile-filter metrics/diagnose-profile-filter.json -- vp run video:record -- --kind moonboard --locale en-US --diagnose-profile-filter --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Record one English profile progress take
        if: inputs.mode == 'record-profile'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts record-profile metrics/record-profile.json -- vp run video:record -- --kind moonboard --locale en-US --only log --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Record the English MoonBoard sequence
        if: inputs.mode == 'record-english'
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts record-english metrics/record-english.json -- vp run video:record -- --kind moonboard --locale en-US --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Record one English crew take without publishing
        if: inputs.mode == 'record-crew'
        env:
          BOARDSESH_CREW_EXPECT_IOS_RUNTIME: '26.5'
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
          SHOWCASE_SECONDARY_EMAIL: ${{ secrets.SHOWCASE_SECONDARY_EMAIL }}
          SHOWCASE_SECONDARY_PASSWORD: ${{ secrets.SHOWCASE_SECONDARY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p metrics
          git rev-parse HEAD > metrics/crew-source-sha.txt
          vp exec tsx scripts/store-video-measure.ts crew-check metrics/crew-check.json -- vp run video:record -- --kind default --locale en-US --only crew --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Retain the crew capture for one day
        if: inputs.mode == 'record-crew'
        uses: actions/upload-artifact@v4
        with:
          name: store-video-frames-crew-check
          path: .boardsesh/showcase-video/work/boards/default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Hand off frames for one day
        if: inputs.mode != 'diagnose-profile-filter' && inputs.mode != 'record-crew'
        uses: actions/upload-artifact@v4
        with:
          name: store-video-frames-moonboard
          path: .boardsesh/showcase-video/work/boards/moonboard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain measurement and debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-video-record-metrics
          path: |
            metrics/
            .boardsesh/showcase-video/work/logs/
          include-hidden-files: true
          retention-days: 7

  render:
    needs: record
    if: inputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install Chromium and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          vp exec playwright install --with-deps chromium
        working-directory: packages/web
      - uses: actions/download-artifact@v4
        with:
          name: store-video-frames-moonboard
          path: .boardsesh/showcase-video/work/boards/moonboard
      - name: Render and validate four Apple search videos
        run: |
          set -euo pipefail
          for locale in en-US es fr de; do
            vp exec tsx scripts/store-video-measure.ts "render-$locale" "metrics/render-$locale.json" -- vp run video:render -- --target store-search --variant moonboard --locale "$locale"
          done
          test "$(find .boardsesh/app-store-creatives/moonboard -name search-results.mp4 | wc -l)" -eq 4
      - name: Retain four validated videos, posters and provenance
        uses: actions/upload-artifact@v4
        with:
          name: store-videos-moonboard
          path: .boardsesh/app-store-creatives/moonboard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain render measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-video-render-metrics
          path: metrics/
          retention-days: 7

  timings:
    if: always()
    needs: [record, render]
    runs-on: ubuntu-latest
    steps:
      - name: Collect per-step minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > steps.json
          jq -r '["| Job | Step | Minutes | Result |", "| --- | --- | ---: | --- |"], (.[] .jobs[] | .name as $job | .steps[] | select(.started_at != null and .completed_at != null) | ["| \($job) | \(.name) | \((((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 * 100 | round) / 100) | \(.conclusion) |"] ) | .[]' steps.json | tee timings.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: store-video-step-timings
          path: |
            timings.md
            steps.json
          retention-days: 14
