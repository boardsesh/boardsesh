name: Refresh Content Model

# Weekly (offline): train the Climb2Vec hold-geometry model and score content_prior
# + embeddings for every climb+angle into board_climb_embeddings. This is the ONE
# workflow that runs Python — training genuinely needs a framework — and it only
# WRITES board_climb_embeddings; the nightly grade + similarity jobs (pure TS) read
# from it. Weekly cadence mirrors the grade-model coefficient refit.
on:
  schedule:
    - cron: '30 5 * * 0' # 05:30 UTC Sundays (before the daily grade/recs jobs)
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to train/score (default kilter)'
        required: false
        default: 'kilter'
      epochs:
        description: 'Training epochs'
        required: false
        default: '30'

concurrency:
  group: refresh-content-model
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      BOARD: ${{ github.event.inputs.board || 'kilter' }}
      EPOCHS: ${{ github.event.inputs.epochs || '30' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Python deps (offline training only)
        run: |
          python -m pip install --quiet -r ml/climb2vec/requirements.txt
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Extract training + score matrices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --import tsx packages/db/scripts/extract-training-matrix.ts --board="$BOARD" --out=ml/climb2vec/data/${BOARD}-train.jsonl
          node --import tsx packages/db/scripts/extract-training-matrix.ts --board="$BOARD" --score --out=ml/climb2vec/data/${BOARD}-score.jsonl

      - name: Train + score
        working-directory: ml/climb2vec
        run: |
          python train_export.py --train data/${BOARD}-train.jsonl --score data/${BOARD}-score.jsonl --out data/${BOARD}-content.jsonl --epochs "$EPOCHS"

      - name: Load into board_climb_embeddings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --import tsx packages/db/scripts/load-content-model.ts --board="$BOARD" --model=climb2vec-v1 --in=ml/climb2vec/data/${BOARD}-content.jsonl

      - name: Build + load similarity neighbours
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          (cd ml/climb2vec && python similarity_export.py --content data/${BOARD}-content.jsonl --out data/${BOARD}-similar.jsonl)
          node --import tsx packages/db/scripts/load-similarity.ts --board="$BOARD" --model=climb2vec-v1 --in=ml/climb2vec/data/${BOARD}-similar.jsonl
