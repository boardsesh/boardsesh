name: Refresh Hold Features

# Nightly: regenerate the per-hold feature substrate (board_hold_features) for the
# Climb2Vec content model — geometry features + a de-confounded behavioral
# difficulty per placement — and shadow-write user_hold_classifications under a
# system user. Idempotent (every write is an upsert). Runs at 06:15 UTC, between
# the recommendations refresh (06:00) and the grade refresh (06:30) that will
# eventually consume the content_prior these features feed.
on:
  schedule:
    - cron: '15 6 * * *' # 06:15 UTC daily (off-peak)
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to refresh (default kilter)'
        type: choice
        required: false
        default: 'kilter'
        options:
          - kilter
          - tension
          - moonboard
          - decoy
          - touchstone
          - grasshopper
          - soill
          - woods
      dry_run:
        description: 'Compute + log only, write nothing'
        type: boolean
        required: false
        default: false

concurrency:
  group: refresh-hold-features
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DATABASE_URL must be a WRITABLE connection.
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Connect to the private production database network
        uses: ./.github/actions/connect-production-db
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          forwarder-host: ${{ vars.POSTGRES_FORWARDER_HOST }}
          database-url: ${{ secrets.HOLD_FEATURES_DATABASE_DIRECT_URL }}
          expected-role: boardsesh_hold_features_refresh

      - name: Refresh hold features
        working-directory: packages/db
        env:
          BOARD: ${{ inputs.board || 'kilter' }}
          DATABASE_URL: ${{ secrets.HOLD_FEATURES_DATABASE_DIRECT_URL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail

          case "$BOARD" in
            kilter|tension|moonboard|decoy|touchstone|grasshopper|soill|woods) ;;
            *)
              echo "::error::Unsupported board input"
              exit 1
              ;;
          esac

          if [[ "$DRY_RUN" == 'true' ]]; then
            node --import tsx scripts/refresh-hold-features.ts --board="$BOARD" --dry-run
          else
            node --import tsx scripts/refresh-hold-features.ts --board="$BOARD"
          fi
