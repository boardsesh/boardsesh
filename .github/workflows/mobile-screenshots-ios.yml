name: Mobile Screenshots (iOS)

# Captures native App Store / onboarding screenshots from the RN app via Maestro
# (scripts/mobile-screenshots.ts) and uploads them as a build artifact. Manual
# dispatch only for now — never gates PRs. (An automatic trigger after each
# native build lands in a later PR.)
#
# Split out from the old combined mobile-screenshots.yml so iOS and Android run
# independently. The Android half lives in mobile-screenshots-android.yml.
#
# The screenshot app is a Debug dev-client that loads its JS from Metro, so the
# native .app is reusable: it's cached (actions/cache) keyed on native inputs and
# only rebuilt when those change. A JS-only run is a cache hit → install + Metro +
# Maestro instead of a ~30-min from-scratch native compile.
#
# The run is SELF-GATING. macOS minutes are the scarce resource (free on a public
# repo, but capped at 5 concurrent), and most runs change no pixels at all, so a
# `gate: probe` dispatch shoots ONE shard and only pays for the other eleven when
# that shard actually moved:
#   setup        — resolve the locale list, the capture matrix and the gate.
#   ios-build    — build/restore the cached .app ONCE (no per-shard cold build).
#   probe        — gate=probe only. Captures en-US × iPhone 16 Pro Max, fetches the
#                  matching shard from the `screenshots-baseline` prerelease and
#                  compares them pixel-wise (scripts/compare-screenshots.ts).
#                  Unchanged → ios-capture is skipped and the run ends in ~15 min.
#                  This one shard is blind to a change confined to another locale
#                  (es/fr/de strings) or to an iPad-only layout — it would always
#                  read as "unchanged". scripts/screenshot-probe-scope.ts closes
#                  that gap: it diffs the changed paths between the baseline's
#                  commit and this run's commit and forces the fan-out (`force_full`)
#                  whenever one falls in a documented blind spot, regardless of what
#                  the pixel comparison found. See docs/mobile-store-release.md.
#   ios-capture  — matrix of locale (en-US, es, fr, de) × device (the 6.9" iPhone 16
#                  Pro Max — Apple scales it down to all other iPhones — plus the
#                  iPad Pro 13-inch and 11-inch, a separate slot that doesn't
#                  auto-scale) = 12 shards, each its own runner: one Metro, one
#                  simulator, one capture. When the probe ran, its own shard is
#                  excluded from the matrix (the probe already uploaded it), so a
#                  changed probe fans out to the remaining 11.
#   ios-finalize — merge the per-shard artifacts into one tree, run the dimension
#                  gate (it needs all five App Store locales at once), and upload.
#                  Publishing the baseline needs `publish_baseline: true` on this
#                  dispatch (gate=full, or gate=probe when no baseline exists yet)
#                  until the `workflow_run` trigger (next PR in this series) does
#                  it automatically after each green full capture.
#
# The shard body itself lives in .github/actions/ios-screenshot-shard so probe and
# ios-capture capture BYTE-IDENTICALLY — a probe that captured differently from
# the fan-out would compare against a baseline it could never match.
#
# All runs capture against PROD signed in as the test user (the canonical store
# recipe), so there's no local backend.
#
# On a manual dispatch with `upload = true`, ios-finalize also uploads the freshly
# captured screenshots via fastlane (screenshots ONLY — no binary or text
# metadata). A plain capture-only dispatch never uploads.
#
# NOTE ON `inputs`: this workflow runs on `workflow_dispatch` only for now (a
# later PR in this series adds a `workflow_run` trigger, where the whole
# `inputs` context is null). Every reference below is still written
# `inputs.x || 'default'` or guarded with an explicit `== null`, so that future
# non-dispatch trigger won't resolve an input to the empty string by accident.

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'Maestro flow to run'
        type: choice
        default: app-store
        options:
          - app-store
          - onboarding
      gate:
        description: 'full = capture all 12 shards. probe = shoot en-US × iPhone 16 Pro Max first, compare it with the stored baseline, and fan out to the other 11 shards only when it changed.'
        type: choice
        default: full
        options:
          - full
          - probe
      locales:
        description: 'iOS locales to capture (comma-separated, e.g. "en-US" or "en-US,es,fr"). Empty = the full en-US,es,fr,de set. A narrowed set (or the onboarding flow) skips the App Store dimension gate, which needs all five store locales at once.'
        type: string
        default: ''
      render_mode:
        description: 'Board drawing to shoot. Empty = the app default (Aura), which is what the store set is meant to show. "classic" shoots the old look for a comparison set.'
        type: choice
        default: ''
        options:
          - ''
          - aura
          - classic
      boards:
        description: 'Which walls the board-backed shots sit on, "|"-separated, in slot order (slot 0 = every board-backed shot, slot 1 = the second board-view). Empty = the app default. Each entry matches a board name or a layout name.'
        type: string
        default: ''
      upload:
        description: 'Upload captured screenshots to App Store Connect. Requires the full App Store set (app-store flow, empty locales).'
        type: boolean
        default: false
      publish_baseline:
        description: 'After a green FULL capture, publish the set as the `screenshots-baseline` prerelease that the probe gate compares against. The `workflow_run` trigger (next PR in this series) will do this automatically after each green full capture; until then, dispatch with this flag set (gate=full, or gate=probe when no baseline exists yet).'
        type: boolean
        default: false

concurrency:
  group: mobile-screenshots-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Resolve the locale list, the capture matrix and the gate once, on a cheap
  # ubuntu runner, so every macOS job downstream just reads an output. Empty
  # `locales` = the full en-US,es,fr,de store set (a no-arg dispatch); a value
  # narrows it (e.g. a single locale).
  setup:
    runs-on: ubuntu-latest
    outputs:
      ios_locales: ${{ steps.compute.outputs.ios_locales }}
      ios_matrix: ${{ steps.compute.outputs.ios_matrix }}
      gate: ${{ steps.compute.outputs.gate }}
      source_sha: ${{ steps.compute.outputs.source_sha }}
    steps:
      - name: Compute locales, matrix and gate
        id: compute
        env:
          # The commit the captured pixels belong to. Today that is always this
          # run's own SHA; PR6 switches it to the commit that triggered the run.
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          locales="${{ inputs.locales || '' }}"
          flow="${{ inputs.flow || 'app-store' }}"
          upload="${{ inputs.upload || 'false' }}"
          gate="${{ inputs.gate || 'full' }}"
          # Empty locales = the full store set; otherwise split "en-US,es" into a
          # JSON array for the capture matrix. `|| true` keeps a no-match grep
          # (all-blank input) from aborting the step under pipefail; the empty
          # result is then caught explicitly below with a clear error.
          if [ -z "$locales" ]; then
            ios_locales='["en-US","es","fr","de"]'
          else
            ios_locales=$(printf '%s' "$locales" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -cs . || true)
            if [ -z "$ios_locales" ] || [ "$ios_locales" = "[]" ]; then
              echo "::error::locales='$locales' resolved to no valid entries."
              exit 1
            fi
          fi
          # Uploading mutates the live App Store listing and needs the full store
          # set, so refuse a contradictory narrowed/onboarding upload up front (on
          # this cheap ubuntu job) instead of failing ~40 min later inside fastlane.
          if [ "$upload" = "true" ] && { [ -n "$locales" ] || [ "$flow" = "onboarding" ]; }; then
            echo "::error::upload=true requires the full App Store set: flow=app-store and empty locales. Narrowed / onboarding runs are capture-only."
            exit 1
          fi
          # Same reasoning for the probe gate: an upload must carry the whole set,
          # and the probe deliberately captures one shard and may stop there.
          if [ "$upload" = "true" ] && [ "$gate" = "probe" ]; then
            echo "::error::upload=true cannot be combined with gate=probe — an upload needs all 12 shards, and the probe stops after one when nothing changed."
            exit 1
          fi
          # A narrowed / onboarding / uploading run has no meaningful baseline to
          # compare against (the baseline is the full app-store set), so those
          # always capture everything they were asked for.
          if [ -n "$locales" ] || [ "$flow" = "onboarding" ] || [ "$upload" = "true" ]; then
            gate=full
          fi
          # The probe already captures en-US × iPhone 16 Pro Max and uploads it as
          # a shard artifact, so exclude that pair from the fan-out instead of
          # shooting it twice.
          devices='[{"name":"iPhone 16 Pro Max","slug":"iphone-16-pro-max"},{"name":"iPad Pro 13-inch (M5)","slug":"ipad-pro-13-inch-m5"},{"name":"iPad Pro 11-inch (M5)","slug":"ipad-pro-11-inch-m5"}]'
          # devices[0] must stay the iPhone 16 Pro Max entry: the probe shard is
          # always en-US × devices[0], and the exclude below is derived from that
          # same element, so a reordered $devices array would otherwise silently
          # probe (and exclude) the wrong device.
          if [ "$(printf '%s' "$devices" | jq -r '.[0].slug')" != "iphone-16-pro-max" ]; then
            echo "::error::devices[0] must be the iPhone 16 Pro Max entry (the probe shard assumption)."
            exit 1
          fi
          if [ "$gate" = "probe" ]; then
            # Derive the excluded (locale, device) pair from devices[0] instead of
            # hand-copying the literal, so it can never drift from the device the
            # probe actually shoots.
            exclude=$(printf '%s' "$devices" | jq -c '[{locale:"en-US", device: .[0]}]')
          else
            exclude='[]'
          fi
          ios_matrix=$(jq -cn \
            --argjson locale "$ios_locales" \
            --argjson device "$devices" \
            --argjson exclude "$exclude" \
            '{locale: $locale, device: $device, exclude: $exclude}')
          {
            echo "ios_locales=$ios_locales"
            echo "ios_matrix=$ios_matrix"
            echo "gate=$gate"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: gate=$gate ios_locales=$ios_locales upload=$upload flow=$flow source_sha=$SOURCE_SHA"

  # Build (or restore) the prebuilt simulator dev-client .app ONCE, so the three
  # ios-capture shards don't each cold-build it on a cache miss (the thundering
  # herd). It's a dev-client shell that loads its JS from Metro, so the native
  # binary only changes when NATIVE inputs change — the key hashes exactly those
  # (Expo/RN/native-module versions in packages/mobile/package.json, native config
  # in app.config.ts, the config plugins + native modules, pnpm's patch/override
  # policy, and the root @expo/cli pin). JS/TS-only and web-only
  # changes (incl. pnpm-lock.yaml churn) do NOT bust it, so the common path is a cache
  # hit and skips the ~30-min native build. Bump `-v1-` to force a rebuild.
  # runner.arch is in the key because a simulator .app is arch-specific.
  ios-build:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      cache-key: ${{ steps.appkey.outputs.key }}
    env:
      # Reused from ios-rn-ci.yml so the Expo build links the same native config.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      # Compute the .app cache key ONCE and surface it as a job output so every
      # ios-capture shard restores the exact same bucket.
      - name: Compute app cache key
        id: appkey
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-screenshot-sim-app-v1-${{ hashFiles('packages/mobile/app.config.ts', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/locales/**', 'packages/mobile/package.json', 'patches/**', 'package.json', 'pnpm-workspace.yaml', 'scripts/mobile-build-sim-app.ts', 'scripts/screenshot-sim.entitlements') }}" >> "$GITHUB_OUTPUT"

      # lookup-only: this job only needs to KNOW whether the .app is cached (the
      # shards do the actual restore), so on a hit we skip downloading a .app this
      # job never uses — keeping the common-path critical path to ~1-2 min.
      - name: Check for cached simulator app
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
          lookup-only: true

      # Deps are only needed to build; skipped entirely on a cache hit.
      - name: Install Node.js dependencies
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: vp install --frozen-lockfile

      # Cache miss (a native-input change) → build the .app from scratch with
      # xcodebuild (runs to completion; no `expo run:ios` launch-step hang).
      - name: Build simulator dev-client app
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: vp run mobile:build-sim-app -- --app-out packages/mobile/.app-cache --clean

      # Save for the ios-capture shards (and future runs). Only on a miss — on a
      # hit the entry already exists.
      - name: Save simulator app to cache
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}

  # The gate. One shard, one runner: capture en-US × iPhone 16 Pro Max, pull the
  # matching zip out of the `screenshots-baseline` prerelease and diff it pixel by
  # pixel. `changed=false` skips the whole fan-out below; `changed=true` (or no
  # baseline yet) runs it. The probe's own capture is uploaded as a normal shard
  # artifact, so ios-finalize gets it either way.
  probe:
    needs: [setup, ios-build]
    if: needs.setup.outputs.gate == 'probe'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      changed_files: ${{ steps.compare.outputs.changed_files }}
      baseline_commit: ${{ steps.baseline.outputs.commit }}
      # See scripts/screenshot-probe-scope.ts: true when a changed path falls
      # outside what this one shard can see (a non-en-US locale, an iPad-only
      # layout, ...) or the baseline commit could not be diffed at all.
      force_full: ${{ steps.scope.outputs.force_full }}
      force_full_reason: ${{ steps.scope.outputs.reason }}

    env:
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      # Pin RN's fetch as the global `fetch` (not expo/fetch, which crashes Hermes by
      # tearing down JSI promises off-thread — Sentry 7595562195). The capture shard's
      # Metro bundle inlines this, so screenshots exercise the same fetch as production.
      EXPO_PUBLIC_USE_RN_FETCH: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # The prod test/demo account the Maestro flow signs in with. Override via
      # repo secrets if a different account is ever needed.
      SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL || 'test@boardsesh.com' }}
      SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD || 'test' }}
      # Belt-and-suspenders ceiling for Maestro's XCTest driver startup. With
      # --shutdown there's only one booted sim per shard so the default should
      # pass; this is free on the happy path (a timeout cap, not a fixed wait) and
      # guards against a slow cold runner ("iOS driver not ready in time").
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'

    steps:
      # fetch-depth: 0 — the scope step below needs to diff against the
      # baseline's commit, which may sit further back than a shallow clone
      # would reach.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture the probe shard
        uses: ./.github/actions/ios-screenshot-shard
        with:
          locale: en-US
          device-name: iPhone 16 Pro Max
          device-slug: iphone-16-pro-max
          flow: ${{ inputs.flow || 'app-store' }}
          render-mode: ${{ inputs.render_mode || '' }}
          boards: ${{ inputs.boards || '' }}
          app-cache-key: ${{ needs.ios-build.outputs.cache-key }}

      # No baseline yet (first run, pruned asset) exits 0 with found=false, and the
      # compare below then reports `no-baseline` → a full fan-out. That is the
      # correct bootstrap: capture everything, publish it, gate on it next time.
      - name: Fetch baseline shard
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vp run screenshot:baseline -- fetch \
            --platform ios \
            --asset ios-en-US-iphone-16-pro-max.zip \
            --out "$RUNNER_TEMP/baseline"

      # Closes the probe's blind spot (see scripts/screenshot-probe-scope.ts):
      # this shard only ever shoots en-US x iPhone 16 Pro Max, so a change
      # confined to another locale or an iPad-only layout would otherwise
      # always compare as "unchanged". Diff the paths that changed between the
      # baseline's own commit and this run's source commit and force the
      # fan-out when one falls in a documented blind spot. A baseline commit
      # that can't be fetched or isn't a real commit (no baseline published
      # yet, or one that fell out of history) is treated the same way — force
      # a full capture rather than guess.
      - name: Decide whether the probe can see this change
        id: scope
        env:
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE_COMMIT" ]; then
            vp run screenshot:probe-scope -- --unreachable-baseline "no baseline commit recorded (first run, or none published yet)"
          elif ! git fetch origin "$BASELINE_COMMIT"; then
            echo "::warning::baseline commit $BASELINE_COMMIT could not be fetched from origin."
            vp run screenshot:probe-scope -- --unreachable-baseline "could not fetch $BASELINE_COMMIT from origin"
          elif ! git cat-file -e "${BASELINE_COMMIT}^{commit}" 2>/dev/null; then
            echo "::warning::baseline commit $BASELINE_COMMIT is not a reachable commit after fetching."
            vp run screenshot:probe-scope -- --unreachable-baseline "$BASELINE_COMMIT is not a reachable commit"
          else
            git diff --name-only "$BASELINE_COMMIT" "$SOURCE_SHA" > "$RUNNER_TEMP/probe-diff.txt"
            vp run screenshot:probe-scope -- --changed-files-file "$RUNNER_TEMP/probe-diff.txt"
          fi

      - name: Compare against baseline
        id: compare
        run: |
          vp run screenshot:compare -- \
            --baseline "$RUNNER_TEMP/baseline" \
            --candidate app-stores/apple/screenshots/en-US/iphone-16-pro-max \
            --summary probe-compare/summary.json \
            --diff-out probe-compare/diffs

      # The summary JSON plus a red-mask diff per changed shot — the artifact a
      # human opens to see WHAT moved before trusting the fan-out.
      - name: Upload probe comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-compare
          path: probe-compare/**
          if-no-files-found: warn
          retention-days: 14

  ios-capture:
    needs: [setup, ios-build, probe]
    # `probe` is skipped on a full run and must not skip the fan-out with it, so
    # this is written on `result` rather than the default all-needs-succeeded
    # gate. `!cancelled()` keeps a cancelled run from starting 11 macOS shards.
    # `force_full` (scripts/screenshot-probe-scope.ts) fans out exactly like a
    # pixel-wise `changed` would — it covers a locale-only or iPad-only change
    # the single probe shard never captures pixels for.
    if: >-
      !cancelled() && needs.setup.result == 'success' && needs.ios-build.result == 'success' &&
      (needs.probe.result == 'skipped' ||
       (needs.probe.result == 'success' &&
        (needs.probe.outputs.changed == 'true' || needs.probe.outputs.force_full == 'true')))
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      # One shard failing shouldn't abandon the rest — let them all finish so
      # ios-finalize can report exactly which (locale, device) is short.
      fail-fast: false
      # A public repo gets 5 concurrent macOS runners; the sixth queues anyway.
      # Capping at 4 leaves a slot for the other macOS workflows (ios-rn-ci, the
      # TestFlight deploy) instead of starving them behind a 12-shard sweep.
      max-parallel: 4
      # Devices: the 6.9" iPhone 16 Pro Max (App Store Connect auto-scales it down to
      # every smaller iPhone, so no smaller iPhone is worth a shard) plus the iPad Pro
      # 13-inch and 11-inch, a separate App Store slot that doesn't auto-scale from
      # iPhone. Locale is the other axis, a full sweep. Matrix = 4 locales × 3 devices
      # = 12 shards, one simulator per shard — minus the probe's own pair when the
      # probe ran. Built by the setup job (locales, devices and the exclude list).
      matrix: ${{ fromJSON(needs.setup.outputs.ios_matrix) }}

    env:
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      # Pin RN's fetch as the global `fetch` (not expo/fetch, which crashes Hermes by
      # tearing down JSI promises off-thread — Sentry 7595562195). The capture shard's
      # Metro bundle inlines this, so screenshots exercise the same fetch as production.
      EXPO_PUBLIC_USE_RN_FETCH: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # The prod test/demo account the Maestro flow signs in with. Override via
      # repo secrets if a different account is ever needed.
      SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL || 'test@boardsesh.com' }}
      SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD || 'test' }}
      # Belt-and-suspenders ceiling for Maestro's XCTest driver startup. With
      # --shutdown there's only one booted sim per shard so the default should
      # pass; this is free on the happy path (a timeout cap, not a fixed wait) and
      # guards against a slow cold runner ("iOS driver not ready in time").
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture shard
        uses: ./.github/actions/ios-screenshot-shard
        with:
          locale: ${{ matrix.locale }}
          device-name: ${{ matrix.device.name }}
          device-slug: ${{ matrix.device.slug }}
          flow: ${{ inputs.flow || 'app-store' }}
          render-mode: ${{ inputs.render_mode || '' }}
          boards: ${{ inputs.boards || '' }}
          app-cache-key: ${{ needs.ios-build.outputs.cache-key }}

  ios-finalize:
    needs: [setup, ios-build, probe, ios-capture]
    # Run even if a capture shard failed, so the dimension gate still reports the
    # gap (a missing locale fails it loudly rather than uploading a partial set),
    # and run on the unchanged path where ios-capture never started at all. A
    # failed `setup` has nothing to finalize.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    # Gate the App Store Connect secrets behind the Production environment — its
    # main-only branch policy fences them off from anyone who can push a branch and
    # workflow_dispatch it. The APP_STORE_CONNECT_* secrets are only referenced in
    # the upload steps below, so every other run resolves to '' (no environment)
    # and never waits on a future required reviewer — see the conditional-vs-bare
    # note at android-apk-rn.yml (gate job). The workflow_run arm matches the
    # automatic trigger a later PR in this series adds; it is deliberately narrowed
    # to a run that actually captured, so an unchanged probe needs no environment.
    environment: >-
      ${{ ((github.event_name == 'workflow_dispatch' && inputs.upload) ||
           (github.event_name == 'workflow_run' && needs.ios-capture.result == 'success'))
          && 'Production' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job writes: refreshing the `screenshots-baseline` prerelease needs
    # contents:write, and nothing else in the workflow does.
    permissions:
      contents: write

    env:
      # Marks an upload dispatch — gates the App Store Connect upload steps so a
      # capture-only dispatch never touches ASC.
      UPLOAD_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && inputs.flow == 'app-store' }}
      # The probe ran and found nothing moved: there is one shard artifact, no
      # full tree, and nothing to gate, upload or republish. force_full overrides
      # this — a locale-only or iPad-only change the probe's own pixels can't see
      # still needs the full tree, even though the probe shard itself matched.
      UNCHANGED: >-
        ${{ needs.probe.result == 'success' && needs.probe.outputs.changed == 'false' &&
            needs.probe.outputs.force_full != 'true' }}
      # A complete, trustworthy App Store tree landed in this run: the fan-out
      # succeeded, the probe (if any) succeeded, and neither the flow nor the
      # locale list was narrowed. Only such a run may refresh the baseline or push
      # to App Store Connect.
      FULL_SET_CAPTURED: >-
        ${{ needs.ios-capture.result == 'success' &&
            (needs.probe.result == 'skipped' || needs.probe.result == 'success') &&
            (inputs.flow == null || inputs.flow == 'app-store') &&
            (inputs.locales == null || inputs.locales == '') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Node.js dependencies
        run: vp install --frozen-lockfile

      # Merge every per-locale artifact back into ONE app-stores/apple/screenshots
      # tree. merge-multiple flattens all matching artifacts into the single path,
      # preserving each one's <locale>/<device>/NN-name.png layout — so the gate
      # and fastlane see the full five-locale tree. On the unchanged path the
      # probe's single shard is the only match, which merge-multiple handles the
      # same way (it is a merge of one).
      #
      # continue-on-error because download-artifact hard-errors when NOTHING
      # matches the pattern, which is now reachable: a probe that dies before it
      # writes a PNG leaves the run with zero shard artifacts. The dimension gate
      # below then reports the actual gap ("missing App Store locale directory")
      # instead of an opaque "unable to find any artifacts", and it is not
      # continue-on-error — so a short tree still reds the job and still blocks
      # every upload and the baseline refresh.
      - name: Download locale screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ios-screenshots-*
          path: app-stores/apple/screenshots
          merge-multiple: true

      # Fail loudly if any capture isn't an App Store-accepted size for its slot,
      # or if a locale/device folder is missing — so deliver can't get silently
      # rejected by Apple (or upload a partial set). Requires all five App Store
      # locales at once, which is why it runs here after the merge, not per-shard.
      - name: Assert screenshot dimensions
        # The gate needs the full App Store set (all five store locales, app-store
        # flow). Skip it for the onboarding flow, a narrowed `locales` run, or an
        # unchanged probe — those are capture-only and hold one shard at most; the
        # per-shard artifacts are still produced + uploaded. `success() &&` is
        # mandatory here too (see the note above the fastlane step below): a
        # custom `if:` overrides the default success() status check, so without
        # it this would still run after a failed merge.
        if: ${{ success() && env.UNCHANGED != 'true' && inputs.flow != 'onboarding' && (inputs.locales == '' || inputs.locales == null) }}
        run: vp run check:screenshot-dimensions -- --platform ios

      # --- Upload to App Store Connect ---
      # Screenshots ONLY — no binary, no metadata, no review submission. Gated
      # behind the `upload` input on a dispatch, and behind a complete capture on
      # the automatic workflow_run trigger (added by a later PR in this series).
      # The `success() &&` prefix is required: a custom `if:` overrides the
      # default success() status check, so without it these would run even if a
      # prior step failed. fastlane's screenshots lane is a pure network upload
      # (no Xcode), so it runs fine on ubuntu.
      - name: Set up Ruby + fastlane
        if: ${{ success() && (env.UPLOAD_RUN == 'true' || (github.event_name == 'workflow_run' && env.FULL_SET_CAPTURED == 'true')) }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Decode App Store Connect API key
        if: ${{ success() && (env.UPLOAD_RUN == 'true' || (github.event_name == 'workflow_run' && env.FULL_SET_CAPTURED == 'true')) }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_ID."; exit 1; }
          [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_BASE64."; exit 1; }
          mkdir -p "$HOME/.private_keys"
          key_path="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || { echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 did not decode to an App Store Connect private key."; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Upload screenshots to App Store Connect
        if: ${{ success() && (env.UPLOAD_RUN == 'true' || (github.event_name == 'workflow_run' && env.FULL_SET_CAPTURED == 'true')) }}
        working-directory: fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
          # The Fastfile uses deliver's `sync_screenshots: true`, which is still a
          # beta feature; without this acknowledgement flag deliver hard-errors
          # ("Please set a value to FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS").
          FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS: 'true'
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID."; exit 1; }
          bundle exec fastlane ios screenshots

      - name: Clean up App Store Connect key
        if: always()
        run: rm -f "$HOME/.private_keys/AuthKey_"*.p8 2>/dev/null || true

      # Refresh what the next probe compares against. Only from a complete,
      # dimension-gated set, and only from a run that owns the baseline: the
      # automatic trigger, or a dispatch that explicitly asked for it. A dispatch
      # that retargeted the render mode or the boards should NOT silently redefine
      # "unchanged" for everyone else, which is why publish_baseline is opt-in.
      - name: Publish screenshot baseline
        if: ${{ success() && env.FULL_SET_CAPTURED == 'true' && (github.event_name == 'workflow_run' || inputs.publish_baseline == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vp run screenshot:baseline -- publish \
            --platform ios \
            --tree app-stores/apple/screenshots \
            --commit "${{ needs.setup.outputs.source_sha }}" \
            --run-id "${{ github.run_id }}"

      - name: Summarize the screenshot gate
        if: always()
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
          PROBE_CHANGED: ${{ needs.probe.outputs.changed }}
          PROBE_CHANGED_FILES: ${{ needs.probe.outputs.changed_files }}
          BASELINE_COMMIT: ${{ needs.probe.outputs.baseline_commit }}
          PROBE_FORCE_FULL: ${{ needs.probe.outputs.force_full }}
          PROBE_FORCE_FULL_REASON: ${{ needs.probe.outputs.force_full_reason }}
        run: |
          set -euo pipefail
          if [ "$PROBE_RESULT" = "skipped" ]; then
            echo "**Full capture** — every requested shard was shot; the probe gate was not used." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PROBE_CHANGED" = "false" ] && [ "$PROBE_FORCE_FULL" = "true" ]; then
            echo "**Forced full capture vs baseline ${BASELINE_COMMIT:-(none)}** — the probe shard matched pixel-for-pixel, but ${PROBE_FORCE_FULL_REASON:-a change outside the probe shard} forced the fan-out anyway (see scripts/screenshot-probe-scope.ts)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PROBE_CHANGED" = "false" ]; then
            echo "**Unchanged vs baseline ${BASELINE_COMMIT:-(none)}** — the probe shard matched, so the other 11 shards were skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Changed vs baseline ${BASELINE_COMMIT:-(none)}**: ${PROBE_CHANGED_FILES:-(no baseline yet)}. Fanned out to the remaining shards; the baseline is refreshed when this run publishes one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots-ios
          path: app-stores/apple/screenshots/**
          if-no-files-found: warn
          retention-days: 14
