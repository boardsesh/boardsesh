name: Benchmark Next Static Assets

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable boardsesh-web digest whose Next assets are already published
        type: string
        required: true
        default: sha256:219779e7fe57254d12b8ba84ab1818e68e8bc4c00d8b4f647b6ecafa8f52d614

permissions:
  contents: read
  packages: read

concurrency:
  group: benchmark-next-static-assets
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'boardsesh/boardsesh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - name: Validate the immutable image digest
        env:
          BENCHMARK_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if ! [[ "$BENCHMARK_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::image_digest must be a lowercase sha256 digest.' >&2
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Log in to GHCR for image reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Next assets without starting the image
        env:
          BENCHMARK_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/boardsesh/boardsesh-web@$BENCHMARK_IMAGE_DIGEST"
          docker pull "$image"
          asset_container=$(docker create "$image")
          trap 'docker rm "$asset_container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/next-static"
          docker cp "$asset_container:/app/packages/web/.next/static/." "$RUNNER_TEMP/next-static"

      - name: Benchmark existing assets with the production publisher
        env:
          BENCHMARK_IMAGE_DIGEST: ${{ inputs.image_digest }}
          STATIC_ASSETS_S3_BUCKET_NAME: ${{ secrets.STATIC_ASSETS_S3_BUCKET_NAME }}
          STATIC_ASSETS_AWS_ACCESS_KEY_ID: ${{ secrets.STATIC_ASSETS_AWS_ACCESS_KEY_ID }}
          STATIC_ASSETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.STATIC_ASSETS_AWS_SECRET_ACCESS_KEY }}
          STATIC_ASSETS_AWS_ENDPOINT_URL: ${{ secrets.STATIC_ASSETS_AWS_ENDPOINT_URL }}
          STATIC_ASSETS_AWS_REGION: ${{ secrets.STATIC_ASSETS_AWS_REGION }}
        run: |
          vp exec tsx scripts/benchmark-next-static-assets.ts \
            --directory "$RUNNER_TEMP/next-static" \
            --output "$RUNNER_TEMP/next-static-benchmark.json"

      - name: Retain benchmark measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-static-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/next-static-benchmark.json
          if-no-files-found: ignore
          retention-days: 14
