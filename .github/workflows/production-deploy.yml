name: Production Deploy

# Single source of truth for production deploys.
#
# Builds the web (Vercel prebuilt) and backend (GHCR image) artifacts in
# parallel, then gates the release in one serialized graph: every attempted
# build must pass, migrations run, Railway deploys and verifies, Vercel and
# app.boardsesh.com deploy, and only then can the exact same SHA publish a mobile
# OTA. A failed/cancelled required job or an active rollback skips OTA/changelog,
# so mobile JS can never announce server code that has not reached production.
#
# Vercel native git auto-deploy is disabled (packages/web/vercel.json
# git.deploymentEnabled=false) so this workflow is the only production deployer.
#
# check-rollback detects whether a Vercel Instant Rollback is currently pinning
# production to an older deployment. If so, server artifacts still build but the
# run does NOT promote: Next web ships with --skip-domain, the backend image is
# pushed to GHCR without a Railway redeploy, and app.boardsesh.com plus native
# OTA stay pinned. That way an incident mitigation isn't silently overwritten,
# the server release is staged for later promotion, and Discord is notified.
# Migrations must stay backward-compatible because Instant Rollback reverts only
# the web deployment, never the DB.

on:
  push:
    branches: [main]
    # No paths filter — detect-changes decides per-side. Web deploys on
    # essentially any app change; backend only on backend-affecting paths.
  workflow_dispatch:
    inputs:
      message:
        description: 'OTA message (defaults to the selected commit hash + subject)'
        required: false
        type: string
      platform:
        description: 'OTA platform to publish'
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android
      changelog_base_sha:
        description: 'Optional changelog range base (defaults to the selected commit parent)'
        required: false
        type: string

concurrency:
  # One non-cancelling production lane covers server/web deploys, downstream OTA
  # and manual backports. There is intentionally no durable "last deployed SHA"
  # marker; each run pins and reports its own exact SHA + validated changelog base.
  group: production-deploy
  queue: max
  cancel-in-progress: false # never cancel an in-flight production deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: boardsesh-daemon

  # --- Expo web export (deploy-app-web) -------------------------------------
  # These are read only by the `expo export` in deploy-app-web, but they live at
  # workflow level on purpose: scripts/mobile-ci-env-parity.test.ts extracts
  # workflow-level `env:` (2-space indent) and would not see a job-level block.
  # They are all public client values — `EXPO_PUBLIC_*` is inlined into the JS
  # bundle at build time, so none of this is a secret.
  #
  # EXPO_PUBLIC_WEB_URL is the AUTH origin and is deliberately www.boardsesh.com,
  # NOT app.boardsesh.com: the SPA does credentialed cross-origin auth against
  # www. See docs/expo-web-deployment.md.
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  # Same DSN and project as every other mobile workflow, so app.boardsesh.com
  # reports alongside the native fleet. Until this landed the subdomain shipped
  # with no client telemetry at all: both SDKs gate on these vars being present
  # at BUILD time (sentry.ts `isSentryEnabled`, posthog-client.ts
  # `isAnalyticsEnabled`), and deploy-app-web set neither.
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Separates browser-app events from the native fleet in both SDKs. `environment`
  # is init-only, so this build-time var is the only place it can be set
  # (src/lib/app-environment.ts `resolveAppEnvironment`).
  EXPO_PUBLIC_SENTRY_ENVIRONMENT: production-web

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      web_changed: ${{ steps.changes.outputs.web }}
      backend_changed: ${{ steps.changes.outputs.backend }}
      app_changed: ${{ steps.changes.outputs.app }}
      ota_changed: ${{ steps.changes.outputs.ota }}
      migration_required: ${{ steps.changes.outputs.migration_required }}
      superseded: ${{ steps.changes.outputs.superseded }}
      deploy_sha: ${{ steps.changes.outputs.deploy_sha }}
      component_base_sha: ${{ steps.changes.outputs.component_base_sha }}
      changelog_base_sha: ${{ steps.changes.outputs.changelog_base_sha }}
      changelog_snapshot_sha: ${{ steps.changes.outputs.changelog_snapshot_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          INPUT_CHANGELOG_BASE_SHA: ${{ inputs.changelog_base_sha }}
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZERO_SHA=0000000000000000000000000000000000000000
          DEPLOY_SHA=$(git rev-parse --verify "${TARGET_SHA}^{commit}")
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

          # Keep two separate boundaries. The immediate event before-SHA is the
          # changelog snapshot base. Component detection uses only the last proven
          # promoted Production Deploy commit, selected below from Actions history.
          # Manual releases may supply an explicit changelog base; otherwise the
          # selected commit's first parent is the deterministic default.
          FORCE_COMPONENTS=false
          COMPONENT_BASE_SHA=$ZERO_SHA
          SUPERSEDED=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$INPUT_CHANGELOG_BASE_SHA" ]; then
              if ! git cat-file -e "${INPUT_CHANGELOG_BASE_SHA}^{commit}" 2>/dev/null; then
                echo "::error::Manual changelog base is not a commit: $INPUT_CHANGELOG_BASE_SHA"
                exit 1
              fi
              CHANGELOG_BASE_SHA=$(git rev-parse --verify "${INPUT_CHANGELOG_BASE_SHA}^{commit}")
              if ! git merge-base --is-ancestor "$CHANGELOG_BASE_SHA" "$DEPLOY_SHA"; then
                echo "::error::Manual changelog base $CHANGELOG_BASE_SHA is not an ancestor of $DEPLOY_SHA"
                exit 1
              fi
            else
              CHANGELOG_BASE_SHA=$(git rev-parse --verify "${DEPLOY_SHA}^" 2>/dev/null || echo "$ZERO_SHA")
            fi
          else
            CHANGELOG_BASE_SHA=${EVENT_BEFORE_SHA:-$ZERO_SHA}
            if [ "$CHANGELOG_BASE_SHA" != "$ZERO_SHA" ] && git cat-file -e "${CHANGELOG_BASE_SHA}^{commit}" 2>/dev/null; then
              CHANGELOG_BASE_SHA=$(git rev-parse --verify "${CHANGELOG_BASE_SHA}^{commit}")
              if ! git merge-base --is-ancestor "$CHANGELOG_BASE_SHA" "$DEPLOY_SHA"; then
                CHANGELOG_BASE_SHA=$ZERO_SHA
                FORCE_COMPONENTS=true
              fi
            else
              CHANGELOG_BASE_SHA=$ZERO_SHA
              FORCE_COMPONENTS=true
            fi
          fi
          echo "changelog_base_sha=$CHANGELOG_BASE_SHA" >> "$GITHUB_OUTPUT"
          CHANGELOG_SNAPSHOT_SHA=$CHANGELOG_BASE_SHA

          # queue:max processes waiters FIFO by the time they started waiting,
          # but an intermediate target can still have newer source above it on
          # main by the time its turn begins. Fetch current main before any build
          # and supersede that stale target so the later queued run releases the
          # newer SHA. A workflow-owned changelog commit alone is safe. For a
          # current target, the same helper proves the component baseline from
          # the preceding completed deployment and fails closed for every
          # ambiguous or partially promoted predecessor.
          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            CURRENT_MAIN_SHA=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
            BASELINE_JSON=$(DEPLOY_SHA="$DEPLOY_SHA" CHANGELOG_BASE_SHA="$CHANGELOG_BASE_SHA" \
              CURRENT_MAIN_SHA="$CURRENT_MAIN_SHA" node scripts/production-deploy-baseline.mjs)
            SUPERSEDED=$(jq -r '.superseded' <<< "$BASELINE_JSON")
            if [ "$FORCE_COMPONENTS" != true ]; then
              FORCE_COMPONENTS=$(jq -r '.forceComponents' <<< "$BASELINE_JSON")
            fi
            COMPONENT_BASE_SHA=$(jq -r '.componentBaseSha // empty' <<< "$BASELINE_JSON")
            VERIFIED_SNAPSHOT_SHA=$(jq -r '.changelogSnapshotSha // empty' <<< "$BASELINE_JSON")
            if [ -n "$VERIFIED_SNAPSHOT_SHA" ]; then
              CHANGELOG_SNAPSHOT_SHA=$VERIFIED_SNAPSHOT_SHA
            fi
            BASELINE_REASON=$(jq -r '.reason' <<< "$BASELINE_JSON")
            echo "Component baseline: ${COMPONENT_BASE_SHA:-none} ($BASELINE_REASON)"
            if [ "$SUPERSEDED" = true ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              echo "component_base_sha=$COMPONENT_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "changelog_snapshot_sha=$CHANGELOG_SNAPSHOT_SHA" >> "$GITHUB_OUTPUT"
              echo "web=false" >> "$GITHUB_OUTPUT"
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "app=false" >> "$GITHUB_OUTPUT"
              echo "ota=false" >> "$GITHUB_OUTPUT"
              echo "migration_required=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping superseded production target $DEPLOY_SHA: $BASELINE_REASON"
              exit 0
            fi
            if [ "$FORCE_COMPONENTS" = true ]; then
              echo "::warning::Production baseline is not proven; forcing the full release graph."
            fi
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "component_base_sha=$COMPONENT_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "changelog_snapshot_sha=$CHANGELOG_SNAPSHOT_SHA" >> "$GITHUB_OUTPUT"

          # Manual runs deliberately exercise the same graph but force every
          # component, including OTA, for the selected exact SHA.
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$FORCE_COMPONENTS" = true ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "ota=true" >> "$GITHUB_OUTPUT"
            echo "migration_required=true" >> "$GITHUB_OUTPUT"
            echo "Full release: web + backend + app + OTA at $DEPLOY_SHA"
            exit 0
          fi

          if [ -z "$COMPONENT_BASE_SHA" ] || [ "$COMPONENT_BASE_SHA" = "$ZERO_SHA" ]; then
            echo "::error::Narrow release has no proven component baseline."
            exit 1
          fi
          CHANGED_FILES=$(git diff --name-only "$COMPONENT_BASE_SHA" "$DEPLOY_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Production excludes packages/mobile from the broad monorepo backend
          # rule: a mobile-only commit can safely proceed with backend/web skipped.
          # Other workspace packages remain backend-affecting because they may be
          # transitive service dependencies.
          BACKEND_CHANGED=false
          # Next web deploys broadly, except docs and OTA/mobile-only plumbing.
          WEB_CHANGED=false
          # app.boardsesh.com (standalone Expo web export) — deploys on the mobile
          # app, its shared deps, the export script, or the two CF Pages host
          # config files. Those two are named individually rather than globbed as
          # `deploy/app-subdomain/*`: `case` wildcards span `/`, so the glob also
          # caught the directory's README and its CI tests, and editing a comment
          # in a test kicked off a production deploy.
          APP_CHANGED=false
          OTA_CHANGED=false
          for file in $CHANGED_FILES; do
            case "$file" in
              packages/mobile/*)
                ;;
              packages/*|Dockerfile.backend|scripts/create-service-docker-context.mjs|scripts/railway-deployment-status.mjs|railway.toml|bun.lock|package.json|.github/workflows/production-deploy.yml)
                BACKEND_CHANGED=true
                ;;
            esac
            # Docs, the mobile app, and the release plumbing itself never reach
            # the Next bundle. That plumbing includes the OTA publisher and its
            # source-map uploader, the changelog generator, the deploy-baseline
            # helper, and the workflow tests that pin all of them — editing a CI
            # helper must not run a web build, migrate, and Vercel promotion.
            # Patterns continue across lines with a trailing backslash.
            case "$file" in
              mobile/*|packages/mobile/*|docs/*|*.md|\
              scripts/mobile-publish.ts|scripts/mobile-upload-sourcemaps.ts|scripts/lib/mobile-publish-retry.ts|scripts/lib/eoas.ts|\
              scripts/generate-changelog.ts|scripts/changelog-discord-summary.ts|scripts/lib/changelog-transform.ts|scripts/lib/changelog-discord-summary.ts|\
              scripts/production-deploy-baseline.mjs|scripts/__tests__/changelog-transform.test.ts|\
              scripts/production-deploy-baseline.test.ts|scripts/production-deploy-workflow.test.ts|scripts/mobile-ota-publish-workflow.test.ts|\
              .github/workflows/mobile-ota-production.yml)
                ;;
              *)
                WEB_CHANGED=true
                ;;
            esac
            case "$file" in
              packages/mobile/src/data/changelog.generated.json)
                ;;
              packages/mobile/*|packages/shared/*|packages/board-constants/*|packages/shared-schema/*|patches/*|scripts/build-expo-web-export.sh|deploy/app-subdomain/_headers|deploy/app-subdomain/_redirects)
                APP_CHANGED=true
                ;;
            esac
            case "$file" in
              packages/mobile/src/data/changelog.generated.json)
                ;;
              # Root linker and patch inputs change the resolved Expo config or
              # native dependency graph, so the matching OTA must be published
              # through this unified release path too.
              packages/mobile/*|packages/shared/*|packages/board-constants/*|packages/shared-schema/*|package.json|bun.lock|patches/*|\
              scripts/mobile-publish.ts|scripts/mobile-upload-sourcemaps.ts|scripts/lib/mobile-publish-retry.ts|scripts/lib/eoas.ts|\
              scripts/generate-changelog.ts|scripts/changelog-discord-summary.ts|scripts/lib/changelog-transform.ts|scripts/lib/changelog-discord-summary.ts|\
              .github/workflows/mobile-ota-production.yml|.github/workflows/production-deploy.yml)
                OTA_CHANGED=true
                ;;
            esac
          done

          MIGRATION_REQUIRED=false
          if [ "$WEB_CHANGED" = true ] || [ "$BACKEND_CHANGED" = true ]; then
            MIGRATION_REQUIRED=true
          fi
          echo "backend=${BACKEND_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "app=${APP_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "ota=${OTA_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "migration_required=${MIGRATION_REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "Backend: ${BACKEND_CHANGED}; Web: ${WEB_CHANGED}; App: ${APP_CHANGED}; OTA: ${OTA_CHANGED}"

  # Detects whether a Vercel Instant Rollback is pinning production. Outputs
  # active=true/false; the deploy jobs read it to decide promote vs. stage-only.
  # Fails closed (blocks the run) only if it can't read rollback state at all.
  check-rollback:
    needs: detect-changes
    if: needs.detect-changes.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Detect active Vercel instant rollback
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          # Team projects need ?teamId=; personal (user_*) ids must not pass it.
          TEAM_QS=""
          case "$VERCEL_ORG_ID" in
            team_*) TEAM_QS="?teamId=$VERCEL_ORG_ID" ;;
          esac

          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}${TEAM_QS}")

          # Fail closed: if we can't read rollback state, don't risk promoting over one.
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Vercel project API returned HTTP $HTTP_CODE — cannot confirm rollback state, blocking deploy."
            cat response.json || true
            exit 1
          fi

          # Two signals — fire on either:
          #   autoAssignCustomDomains=false: durable. Vercel flips this off when a
          #     rollback is pinned and back on when the rollback is undone (or a
          #     deployment is manually promoted). This is what we rely on.
          #   lastRollbackTarget non-null: transient (only populated mid-transition
          #     in our experience). Kept as a secondary OR'd signal in case Vercel
          #     starts persisting it again.
          AUTO_ASSIGN=$(jq -r '.autoAssignCustomDomains' response.json)
          ROLLBACK_TARGET=$(jq -r '.lastRollbackTarget // empty' response.json)

          # Guard against Vercel changing the project payload shape — silently
          # treating a missing flag as "no rollback" is how we promoted over one.
          case "$AUTO_ASSIGN" in
            true|false) ;;
            *)
              echo "::error::autoAssignCustomDomains is '$AUTO_ASSIGN' (expected true/false) — cannot confirm rollback state, blocking deploy."
              cat response.json
              exit 1
              ;;
          esac

          if [ "$AUTO_ASSIGN" = "false" ] || [ -n "$ROLLBACK_TARGET" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A Vercel Instant Rollback is active — this run will deploy but NOT promote (production stays pinned)."
            echo "Signals: autoAssignCustomDomains=$AUTO_ASSIGN, lastRollbackTarget present=$([ -n "$ROLLBACK_TARGET" ] && echo yes || echo no)"
            if [ -n "$ROLLBACK_TARGET" ]; then
              jq '.lastRollbackTarget' response.json
            fi
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No rollback signal detected (autoAssignCustomDomains=true, lastRollbackTarget=null) — deploy will promote to production."
          fi

  build-web:
    needs: [detect-changes, check-rollback]
    if: needs.detect-changes.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        # The CLI reads VERCEL_TOKEN from the env — don't pass --token as a flag
        # (it would show up in the runner's process list).
        run: vercel pull --yes --environment=production

      - name: Build with Vercel (prebuilt output)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Next's "Collecting page data" phase evaluates route modules (e.g.
          # /api/auth/[...nextauth]), which instantiate the db client and throw
          # if DATABASE_URL is unset. Native Vercel builds got this from the
          # project env; in Actions we pass it explicitly (process.env wins over
          # any .env file in Next). Same Production-environment secret the
          # migrate job uses.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NEXT_PUBLIC_* must exist at build time — Next inlines it into the
          # client bundle. Native Vercel builds got this from the project env;
          # the CI prebuilt build does not, so pass it explicitly (same gap as
          # DATABASE_URL). Without it, getPosthog() short-circuits and ALL
          # client-side PostHog analytics goes dark — which is exactly what
          # happened when prod web moved to CI `vercel build`. Public client key
          # (phc_…), not a secret, so it's a GitHub Actions variable.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          # Keep the production client fallback pointed at the backend service.
          # Without this, Next can inline the tracked local .env.local value
          # (ws://localhost:8080/graphql) during CI builds. Runtime host
          # derivation now protects boardsesh.com, but this keeps every caller
          # that still reads the baked env on the right backend.
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'wss://ws.boardsesh.com/graphql' }}
        run: vercel build --prod

      - name: Package prebuilt output
        # vercel deploy --prebuilt needs .vercel/output AND the build-generated
        # files its Build Output API symlinks point at that aren't in git: the
        # Next build dir (packages/web/.next) and packages/web/public/openapi.json
        # (written by scripts/generate-openapi.ts; the rest of public/ is committed
        # and restored by the deploy-web checkout). actions/upload-artifact
        # dereferences symlinks, so we tar with symlinks preserved. Allowlist only
        # these paths — never .vercel itself, which holds the pulled
        # .env.production.local secrets.
        run: tar -czf vercel-output.tar.gz .vercel/output .vercel/project.json packages/web/.next packages/web/public/openapi.json

      - name: Upload prebuilt output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: vercel-output.tar.gz
          retention-days: 1

  build-backend:
    needs: [detect-changes, check-rollback]
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # Same digest gets all of these tags. Homelab consumes :staging,
          # Railway consumes :production, humans use :sha-<short> for rollback.
          # Manual releases may intentionally select a non-main ref, so the
          # production tag is enabled for dispatches as well as main pushes.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=production,enable=${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate backend Docker context
        run: vp run docker-context:backend

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .docker-context/backend
          file: .docker-context/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-main
          cache-to: type=gha,mode=max,scope=backend-main

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The GATE. Runs migrations only once every attempted build has passed. A
  # build that ran and FAILED is 'failure' (not 'skipped') and fails this check,
  # which in turn skips both production deploy jobs below.
  migrate:
    needs: [detect-changes, build-web, build-backend]
    if: >-
      always()
      && (needs.build-web.result == 'success' || needs.build-web.result == 'skipped')
      && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
      && !(needs.build-web.result == 'skipped' && needs.build-backend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERIFY_MIGRATION_JOURNAL: '1'
        run: bun run --filter=@boardsesh/db db:migrate

  deploy-web:
    needs: [detect-changes, check-rollback, build-web, migrate, deploy-production-backend]
    if: >-
      always()
      && needs.detect-changes.outputs.web_changed == 'true'
      && needs.build-web.result == 'success'
      && needs.migrate.result == 'success'
      && (needs.detect-changes.outputs.backend_changed != 'true' || needs.deploy-production-backend.result == 'success')
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # vercel deploy --prebuilt validates the prebuilt output's file traces
        # against the filesystem; those traces reference the hoisted
        # node_modules/.bun tree, so the workspace must be installed even though
        # the build itself is already baked into .vercel/output.
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download prebuilt output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .

      - name: Extract prebuilt output
        # Restores .vercel/output, .vercel/project.json, packages/web/.next and
        # packages/web/public/openapi.json with symlinks intact (over the
        # checked-out tree, which already has the committed public/ assets).
        run: tar -xzf vercel-output.tar.gz && rm vercel-output.tar.gz

      - name: Deploy prebuilt output to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          ROLLBACK_ACTIVE: ${{ needs.check-rollback.outputs.active }}
        run: |
          # vercel deploy --prebuilt still resolves the project's Root Directory
          # (packages/web), so the repo must be checked out even though the build
          # is already baked into the downloaded .vercel/output.
          # When a rollback is pinned, --skip-domain builds + uploads the
          # production deployment without assigning it to the production domain,
          # so the pinned (rolled-back) deployment keeps serving traffic.
          # The CLI reads VERCEL_TOKEN from the env (set above) — no --token flag.
          if [ "$ROLLBACK_ACTIVE" = "true" ]; then
            echo "Instant Rollback active — deploying WITHOUT promoting (--skip-domain)."
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --skip-domain)
          else
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod)
          fi
          echo "$DEPLOY_OUTPUT"
          # Extract the deployment URL token rather than the last line, so a
          # trailing warning on the final stdout line can't corrupt the URL we
          # report to Discord. Empty is fine — the notify step handles it.
          URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+' | tail -n1 || true)
          echo "Deployment URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  deploy-production-backend:
    needs: [detect-changes, check-rollback, build-backend, migrate]
    if: always() && needs.detect-changes.outputs.backend_changed == 'true' && needs.build-backend.result == 'success' && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - name: Show image being deployed
        run: |
          echo "Image: ${{ needs.build-backend.outputs.image }}:production"
          echo "Digest: ${{ needs.build-backend.outputs.digest }}"

      # Railway has no "deploy without promoting", so during a rollback we just
      # don't redeploy: the image is already pushed to GHCR (:production, :sha-)
      # and is ready to redeploy once the rollback is cleared.
      - name: Skip Railway redeploy (instant rollback active)
        if: needs.check-rollback.outputs.active == 'true'
        run: |
          echo "Instant Rollback active — backend image pushed to GHCR but NOT redeployed to Railway."
          echo "Promote by redeploying ${{ needs.build-backend.outputs.image }}:production once the rollback is cleared."

      - name: Install Railway CLI
        if: needs.check-rollback.outputs.active != 'true'
        # Pinned: @railway/cli 4.66.1 added a VolumeInstance.deletedAt field to its
        # GraphQL queries (railwayapp/cli#928) that Railway's API rejects, breaking
        # `railway deployment list --json` ("Cannot query field deletedAt on type
        # VolumeInstance"). 4.66.0 is the last version without it. Bump deliberately.
        run: npm install -g @railway/cli@4.66.0

      # The Railway service Source is the moving GHCR tag :production, which this
      # run just repointed to the freshly built digest. `railway redeploy`
      # re-pulls the service's image source, so it picks up the new digest rather
      # than serving a cached layer.
      - name: Trigger Railway redeploy
        id: railway-deploy
        if: needs.check-rollback.outputs.active != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
        run: |
          set -euo pipefail

          railway deployment list \
            --service "$RAILWAY_BACKEND_SERVICE_ID" \
            --limit 10 \
            --json > railway-before.json

          node scripts/railway-deployment-status.mjs capture-previous railway-before.json > railway-before.env
          . ./railway-before.env

          railway redeploy \
            --service "$RAILWAY_BACKEND_SERVICE_ID" \
            --yes

          echo "previous_deployment_id=${PREVIOUS_DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "previous_deployment_created_at=${PREVIOUS_DEPLOYMENT_CREATED_AT}" >> "$GITHUB_OUTPUT"

      - name: Wait for Railway deployment
        if: needs.check-rollback.outputs.active != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.railway-deploy.outputs.previous_deployment_id }}
          PREVIOUS_DEPLOYMENT_CREATED_AT: ${{ steps.railway-deploy.outputs.previous_deployment_created_at }}
        run: |
          set -euo pipefail

          rollback_previous_deployment() {
            if [ -z "${PREVIOUS_DEPLOYMENT_ID:-}" ]; then
              echo "No previous Railway deployment ID captured; skipping rollback."
              return 0
            fi

            echo "Attempting Railway rollback to ${PREVIOUS_DEPLOYMENT_ID}..."
            node -e 'process.stdout.write(JSON.stringify({ query: "mutation deploymentRollback($id: String!) { deploymentRollback(id: $id) }", variables: { id: process.env.PREVIOUS_DEPLOYMENT_ID } }))' > railway-rollback-payload.json

            curl -fsS https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @railway-rollback-payload.json || echo "Railway rollback request failed; check Railway manually."
          }

          for attempt in $(seq 1 90); do
            railway deployment list \
              --service "$RAILWAY_BACKEND_SERVICE_ID" \
              --limit 10 \
              --json > railway-deployments.json

            node scripts/railway-deployment-status.mjs find-new railway-deployments.json > railway-current.env

            . ./railway-current.env
            echo "Attempt ${attempt}: deployment=${CURRENT_ID:-unknown} status=${CURRENT_STATUS:-unknown}"

            case "$CURRENT_STATUS" in
              SUCCESS)
                exit 0
                ;;
              FAILED|CRASHED|REMOVED)
                rollback_previous_deployment
                railway logs --service "$RAILWAY_BACKEND_SERVICE_ID" --latest --lines 100 || true
                exit 1
                ;;
            esac

            sleep 10
          done

          rollback_previous_deployment
          railway logs --service "$RAILWAY_BACKEND_SERVICE_ID" --latest --lines 100 || true
          echo "Railway deployment did not reach SUCCESS in time"
          exit 1

  # Deploys app.boardsesh.com — the STANDALONE Expo web export (baseUrl `/`)
  # served at the root of its own subdomain via Cloudflare Pages (project
  # `boardsesh-app`, direct upload). This is the `--subdomain` artifact, distinct
  # from the `/app` export the web Docker image bakes. See
  # docs/expo-web-deployment.md.
  #
  # The export itself is self-contained, but promotion waits for any changed
  # backend to be verified and for any required migration to finish. That keeps
  # the browser app behind the same server compatibility gate as native OTA.
  # Manual deploy freeze for app.boardsesh.com, the Cloudflare Pages analogue of
  # check-rollback. deploy-web and deploy-production-backend both honour a pinned
  # Vercel Instant Rollback; Pages has no equivalent signal here, so without this
  # a dashboard rollback of the subdomain is silently clobbered by the next merge
  # touching packages/mobile, packages/shared, packages/shared-schema, the export
  # script, or deploy/app-subdomain. Set the repo variable APP_WEB_DEPLOY_HOLD to
  # any non-empty value to hold the subdomain where it is; clear it to resume.
  deploy-app-web:
    needs: [detect-changes, check-rollback, build-web, build-backend, migrate, deploy-production-backend]
    if: >-
      always()
      && needs.detect-changes.outputs.app_changed == 'true'
      && needs.check-rollback.result == 'success'
      && needs.check-rollback.outputs.active != 'true'
      && vars.APP_WEB_DEPLOY_HOLD == ''
      && (needs.detect-changes.outputs.migration_required != 'true' || needs.migrate.result == 'success')
      && (needs.detect-changes.outputs.backend_changed != 'true' || needs.deploy-production-backend.result == 'success')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone Expo web export (production env baked in)
        # The EXPO_PUBLIC_* values come from the workflow-level `env:` block
        # (see the header) so mobile-ci-env-parity can read them; the export
        # inherits them, no per-step re-declaration needed.
        #
        # BOARDSESH_EXPORT_EXPECT_URLS is inert until sibling PR #3797 lands the
        # `--clear` + env-assertion support; once it does, it becomes the
        # in-export stale-env detector. The independent grep step below covers us
        # regardless of merge order.
        run: |
          BOARDSESH_EXPORT_EXPECT_URLS="https://ws.boardsesh.com https://www.boardsesh.com" \
          bash scripts/build-expo-web-export.sh --subdomain "$RUNNER_TEMP/app-standalone"

      - name: Verify production origins and telemetry keys are baked into the bundles
        # Belt-and-braces stale-env guard, independent of #3797's
        # BOARDSESH_EXPORT_EXPECT_URLS. `expo export` reuses Metro's transform
        # cache even when EXPO_PUBLIC_* change, so an old env can silently ship;
        # grep the emitted JS bundles for each expected value and fail otherwise.
        #
        # The telemetry keys are checked here for the same reason the origins
        # are: EXPO_PUBLIC_* are inlined at build time, so "the workflow set it"
        # and "the bundle contains it" are different claims. This step asserts
        # the second. It does NOT prove either SDK initialises under
        # react-native-web — that needs the preview check in the PR body.
        env:
          POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
        run: |
          set -euo pipefail
          js_glob="$RUNNER_TEMP/app-standalone/_expo/static/js/web"
          for origin in ws.boardsesh.com www.boardsesh.com; do
            if ! grep -rql "$origin" "$js_glob"/*.js; then
              echo "::error::Expected origin '$origin' not found in $js_glob/*.js — stale env baked into the export?" >&2
              exit 1
            fi
            echo "ok: found '$origin' in the emitted bundles"
          done

          # Sentry: match the DSN's ingest host, not the whole DSN, so the log
          # never echoes the key portion.
          if ! grep -rql "o4510644927660032.ingest.us.sentry.io" "$js_glob"/*.js; then
            echo "::error::Sentry DSN not baked into the export — app.boardsesh.com would ship with no crash reporting." >&2
            exit 1
          fi
          echo "ok: found the Sentry ingest host in the emitted bundles"

          if [ -z "${POSTHOG_KEY:-}" ]; then
            echo "::error::vars.NEXT_PUBLIC_POSTHOG_KEY is unset — the export would ship with analytics disabled." >&2
            exit 1
          fi
          if ! grep -rql "$POSTHOG_KEY" "$js_glob"/*.js; then
            echo "::error::PostHog key not baked into the export — app.boardsesh.com would ship with no analytics." >&2
            exit 1
          fi
          echo "ok: found the PostHog key in the emitted bundles"

          if ! grep -rql "production-web" "$js_glob"/*.js; then
            echo "::error::EXPO_PUBLIC_SENTRY_ENVIRONMENT not baked in — app events would be indistinguishable from the native fleet." >&2
            exit 1
          fi
          echo "ok: found the production-web environment tag in the emitted bundles"

      - name: Add Cloudflare Pages host config to the export
        # _redirects (SPA fallback) + _headers (noindex/caching/no-CSP) are host
        # config, not part of the export. Copy them into the publish dir.
        run: |
          set -euo pipefail
          cp deploy/app-subdomain/_redirects "$RUNNER_TEMP/app-standalone/_redirects"
          cp deploy/app-subdomain/_headers   "$RUNNER_TEMP/app-standalone/_headers"

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4 pages deploy "$RUNNER_TEMP/app-standalone" \
            --project-name=boardsesh-app \
            --branch=main

      - name: Post-deploy smoke against app.boardsesh.com
        # Cloudflare's edge can lag a few seconds behind a fresh deploy, so each
        # check retries a short propagation loop. Verifies: root serves the HTML
        # shell, a deep route SPA-falls back to the shell, a content-hashed asset
        # is immutable-cached, index.html is NOT immutable, noindex is present,
        # and the WASM binary serves with a wasm/octet content type.
        run: |
          set -uo pipefail
          base=https://app.boardsesh.com

          # Retry a curl assertion for up to ~60s of edge propagation.
          retry() {
            local desc="$1"; shift
            for attempt in $(seq 1 12); do
              if "$@"; then
                echo "ok: $desc"
                return 0
              fi
              echo "  ($desc) attempt $attempt failed; retrying in 5s..."
              sleep 5
            done
            echo "::error::post-deploy smoke failed: $desc" >&2
            return 1
          }

          check_root() {
            local out; out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$base/")
            echo "$out" | grep -q '^200 ' && echo "$out" | grep -qi 'text/html'
          }

          check_deep_route() {
            # SPA fallback: a route with no real file must still 200 the shell.
            local code; code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/climbs")
            [ "$code" = "200" ]
          }

          check_noindex() {
            curl -sSI "$base/" | grep -qi '^x-robots-tag:.*noindex'
          }

          check_wasm() {
            local out; out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' \
              "$base/wasm/board_renderer_wasm_bg.wasm")
            echo "$out" | grep -q '^200 ' \
              && echo "$out" | grep -qiE 'application/(wasm|octet-stream)'
          }

          check_index_not_immutable() {
            # index.html must revalidate — no immutable cache directive.
            local cc; cc=$(curl -sSI "$base/index.html" | tr -d '\r' \
              | grep -i '^cache-control:' || true)
            ! echo "$cc" | grep -qi 'immutable'
          }

          # A real content-hashed asset URL, parsed out of the served index.html,
          # must come back immutable-cached.
          check_hashed_asset_immutable() {
            local asset_path
            asset_path=$(curl -sS "$base/" \
              | grep -oE '/_expo/static/[^"'"'"']+\.js' | head -n1)
            [ -n "$asset_path" ] || { echo "  no /_expo asset found in index.html"; return 1; }
            local cc; cc=$(curl -sSI "$base$asset_path" | tr -d '\r' \
              | grep -i '^cache-control:' || true)
            echo "$cc" | grep -qi 'immutable'
          }

          retry "root / → 200 text/html"                 check_root
          retry "deep route /climbs → 200 (SPA shell)"    check_deep_route
          retry "X-Robots-Tag: noindex on /"              check_noindex
          retry "wasm binary → 200 wasm/octet-stream"     check_wasm
          retry "index.html is NOT immutable-cached"      check_index_not_immutable
          retry "hashed _expo asset is immutable-cached"  check_hashed_asset_immutable

  # The reusable workflow has no trigger or concurrency lane of its own. This
  # call is the only production OTA entrypoint, after every changed dependency
  # proved its required outcome. A skipped unchanged job is valid; a skipped
  # changed job is not. An app-web hold is the one deliberate exception and does
  # not block native OTA after the backend/Next gates pass.
  publish-mobile-ota:
    needs:
      [
        detect-changes,
        check-rollback,
        build-web,
        build-backend,
        migrate,
        deploy-production-backend,
        deploy-web,
        deploy-app-web,
      ]
    if: >-
      always()
      && needs.detect-changes.result == 'success'
      && needs.detect-changes.outputs.ota_changed == 'true'
      && needs.check-rollback.result == 'success'
      && needs.check-rollback.outputs.active != 'true'
      && ((needs.detect-changes.outputs.web_changed == 'true' && needs.build-web.result == 'success')
      || (needs.detect-changes.outputs.web_changed != 'true' && needs.build-web.result == 'skipped'))
      && ((needs.detect-changes.outputs.backend_changed == 'true' && needs.build-backend.result == 'success')
      || (needs.detect-changes.outputs.backend_changed != 'true' && needs.build-backend.result == 'skipped'))
      && ((needs.detect-changes.outputs.migration_required == 'true' && needs.migrate.result == 'success')
      || (needs.detect-changes.outputs.migration_required != 'true' && needs.migrate.result == 'skipped'))
      && ((needs.detect-changes.outputs.backend_changed == 'true' && needs.deploy-production-backend.result == 'success')
      || (needs.detect-changes.outputs.backend_changed != 'true' && needs.deploy-production-backend.result == 'skipped'))
      && ((needs.detect-changes.outputs.web_changed == 'true' && needs.deploy-web.result == 'success')
      || (needs.detect-changes.outputs.web_changed != 'true' && needs.deploy-web.result == 'skipped'))
      && ((needs.detect-changes.outputs.app_changed != 'true' && needs.deploy-app-web.result == 'skipped')
      || (needs.detect-changes.outputs.app_changed == 'true' && vars.APP_WEB_DEPLOY_HOLD != '' && needs.deploy-app-web.result == 'skipped')
      || (needs.detect-changes.outputs.app_changed == 'true' && vars.APP_WEB_DEPLOY_HOLD == '' && needs.deploy-app-web.result == 'success'))
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/mobile-ota-production.yml
    with:
      commit_sha: ${{ needs.detect-changes.outputs.deploy_sha }}
      changelog_base_sha: ${{ needs.detect-changes.outputs.changelog_base_sha }}
      changelog_snapshot_sha: ${{ needs.detect-changes.outputs.changelog_snapshot_sha }}
      message: ${{ github.event_name == 'workflow_dispatch' && inputs.message || '' }}
      platform: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
    # Reusable workflows do not inherit repository secrets, so forward exactly
    # the two repository-scoped credentials. GOOGLE_MAPS_API_KEY resolves from
    # the called job's Production environment. PostHog health intentionally
    # waits for its current environment variable to be migrated to a masked
    # environment secret; the workflow never exposes a personal key via `vars`.
    secrets:
      EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
      OTA_PUSH_APP_PRIVATE_KEY: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}

  # Executable truth table for the release. This catches an unexpected skip as a
  # failure instead of letting a later successful component masquerade as a full
  # deploy. It also proves rollback and app-web-hold exceptions explicitly.
  release-gate:
    needs:
      [
        detect-changes,
        check-rollback,
        build-web,
        build-backend,
        migrate,
        deploy-web,
        deploy-production-backend,
        deploy-app-web,
        publish-mobile-ota,
      ]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.validate.outputs.state }}
    steps:
      - name: Validate changed and skipped component outcomes
        id: validate
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          SUPERSEDED: ${{ needs.detect-changes.outputs.superseded }}
          ROLLBACK_CHECK_RESULT: ${{ needs.check-rollback.result }}
          ROLLBACK_ACTIVE: ${{ needs.check-rollback.outputs.active }}
          WEB_CHANGED: ${{ needs.detect-changes.outputs.web_changed }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          APP_CHANGED: ${{ needs.detect-changes.outputs.app_changed }}
          OTA_CHANGED: ${{ needs.detect-changes.outputs.ota_changed }}
          MIGRATION_REQUIRED: ${{ needs.detect-changes.outputs.migration_required }}
          APP_WEB_HELD: ${{ vars.APP_WEB_DEPLOY_HOLD != '' }}
          BUILD_WEB_RESULT: ${{ needs.build-web.result }}
          BUILD_BACKEND_RESULT: ${{ needs.build-backend.result }}
          MIGRATE_RESULT: ${{ needs.migrate.result }}
          DEPLOY_WEB_RESULT: ${{ needs.deploy-web.result }}
          DEPLOY_BACKEND_RESULT: ${{ needs.deploy-production-backend.result }}
          DEPLOY_APP_WEB_RESULT: ${{ needs.deploy-app-web.result }}
          OTA_RESULT: ${{ needs.publish-mobile-ota.result }}
          OTA_CONFIGURED: ${{ needs.publish-mobile-ota.outputs.configured }}
          OTA_ALL_SUCCESS: ${{ needs.publish-mobile-ota.outputs.all_success }}
          OTA_ANY_SUCCESS: ${{ needs.publish-mobile-ota.outputs.any_success }}
          OTA_CHANGELOG_SYNCED: ${{ needs.publish-mobile-ota.outputs.changelog_synced }}
          OTA_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          set -euo pipefail
          failures=0

          require_result() {
            local changed=$1
            local actual=$2
            local label=$3
            if [ "$changed" = true ]; then
              if [ "$actual" != success ]; then
                echo "::error::$label changed but result was $actual (expected success)"
                failures=$((failures + 1))
              fi
            elif [ "$actual" != skipped ]; then
              echo "::error::$label unchanged component unexpectedly ran: $actual"
              failures=$((failures + 1))
            fi
          }

          require_skipped() {
            local actual=$1
            local label=$2
            if [ "$actual" != skipped ]; then
              echo "::error::$label result was $actual (expected skipped)"
              failures=$((failures + 1))
            fi
          }

          if [ "$DETECT_RESULT" != success ]; then
            echo "::error::change detection result was $DETECT_RESULT"
            failures=$((failures + 1))
          fi

          # A queued target that already has newer source above it is a successful
          # no-mutation terminal state only when every downstream job, including
          # rollback detection, was skipped.
          if [ "$SUPERSEDED" = true ]; then
            require_skipped "$ROLLBACK_CHECK_RESULT" check-rollback
            require_skipped "$BUILD_WEB_RESULT" build-web
            require_skipped "$BUILD_BACKEND_RESULT" build-backend
            require_skipped "$MIGRATE_RESULT" migrate
            require_skipped "$DEPLOY_WEB_RESULT" deploy-web
            require_skipped "$DEPLOY_BACKEND_RESULT" deploy-production-backend
            require_skipped "$DEPLOY_APP_WEB_RESULT" deploy-app-web
            require_skipped "$OTA_RESULT" publish-mobile-ota
            echo "state=superseded" >> "$GITHUB_OUTPUT"
            if [ "$failures" -ne 0 ]; then
              echo "::error::Superseded release unexpectedly mutated production."
              exit 1
            fi
            exit 0
          fi

          if [ "$ROLLBACK_CHECK_RESULT" != success ]; then
            echo "::error::rollback check result was $ROLLBACK_CHECK_RESULT"
            failures=$((failures + 1))
          fi

          require_result "$WEB_CHANGED" "$BUILD_WEB_RESULT" build-web
          require_result "$BACKEND_CHANGED" "$BUILD_BACKEND_RESULT" build-backend
          require_result "$MIGRATION_REQUIRED" "$MIGRATE_RESULT" migrate
          require_result "$WEB_CHANGED" "$DEPLOY_WEB_RESULT" deploy-web
          require_result "$BACKEND_CHANGED" "$DEPLOY_BACKEND_RESULT" deploy-production-backend

          app_release_held=false
          if [ "$ROLLBACK_ACTIVE" = true ]; then
            require_skipped "$DEPLOY_APP_WEB_RESULT" deploy-app-web
          elif [ "$APP_CHANGED" = true ] && [ "$APP_WEB_HELD" = true ]; then
            app_release_held=true
            require_skipped "$DEPLOY_APP_WEB_RESULT" deploy-app-web
          else
            require_result "$APP_CHANGED" "$DEPLOY_APP_WEB_RESULT" deploy-app-web
          fi

          ota_release_held=false
          if [ "$ROLLBACK_ACTIVE" = true ]; then
            require_skipped "$OTA_RESULT" publish-mobile-ota
          elif [ "$OTA_CHANGED" = true ]; then
            if [ "$OTA_RESULT" != success ]; then
              echo "::error::publish-mobile-ota changed but result was $OTA_RESULT (expected success)"
              failures=$((failures + 1))
            elif [ "$OTA_CONFIGURED" != true ]; then
              ota_release_held=true
              if [ "$OTA_ANY_SUCCESS" = true ]; then
                echo "::error::unconfigured OTA unexpectedly reported a published platform"
                failures=$((failures + 1))
              fi
            elif [ "$OTA_ALL_SUCCESS" != true ] || [ "$OTA_ANY_SUCCESS" != true ]; then
              echo "::error::configured OTA did not prove every requested platform succeeded"
              failures=$((failures + 1))
            else
              if [ "$OTA_PLATFORM" != all ]; then
                # A deliberate one-platform manual publish is useful, but it is not
                # a global production baseline for subsequent component diffs.
                ota_release_held=true
              fi
              if [ "$OTA_CHANGELOG_SYNCED" != true ]; then
                # Non-main manual releases and installations without the
                # main-bypass app may publish successfully, but changed generated
                # files remain local. Do not let that run become the component
                # baseline until a main release synchronizes the changelog.
                ota_release_held=true
                echo "::warning::OTA published, but the generated changelog was not synchronized to main."
              fi
            fi
          else
            require_skipped "$OTA_RESULT" publish-mobile-ota
          fi

          # Rollback outranks noop: even a docs-only run cannot become a trusted
          # baseline while production is pinned behind it.
          state=promoted
          if [ "$ROLLBACK_ACTIVE" = true ]; then
            state=rollback-active
          elif [ "$WEB_CHANGED" != true ] && [ "$BACKEND_CHANGED" != true ] && \
            [ "$APP_CHANGED" != true ] && [ "$OTA_CHANGED" != true ]; then
            state=noop
          elif [ "$app_release_held" = true ] && [ "$WEB_CHANGED" != true ] && \
            [ "$BACKEND_CHANGED" != true ] && [ "$OTA_CHANGED" != true ]; then
            state=app-web-held-only
          elif [ "$app_release_held" = true ] || [ "$ota_release_held" = true ]; then
            state=release-held
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

          if [ "$failures" -ne 0 ]; then
            echo "::error::Production release truth table rejected $failures outcome(s)."
            exit 1
          fi

  # Positive evidence consumed by the next run's baseline selector. Success here
  # means every changed surface was reflected globally, or a trusted narrow diff
  # proved there were no changed surfaces. No rollback, app hold, unconfigured
  # OTA, or one-platform manual publish can emit this marker.
  mark-production-promoted:
    needs: release-gate
    if: >-
      always()
      && needs.release-gate.result == 'success'
      && (needs.release-gate.outputs.state == 'promoted'
      || needs.release-gate.outputs.state == 'noop')
    runs-on: ubuntu-latest
    steps:
      - name: Record global promotion
        run: echo "All changed production surfaces are promoted."

  # Homelab staging-backend deploy is currently broken — re-enable once the
  # self-hosted runner is healthy. It deploys the same :staging image and is
  # intentionally independent of the web build / prod migrate gate (it targets
  # the staging DB, not prod), so it only needs build-backend to succeed.
  #
  # deploy-staging-backend:
  #   needs: [detect-changes, build-backend]
  #   if: always() && needs.detect-changes.outputs.backend_changed == 'true' && needs.build-backend.result == 'success'
  #   runs-on: [self-hosted, homelab, ephemeral]
  #   steps:
  #     - name: Pull and restart staging backend
  #       run: |
  #         docker pull ghcr.io/boardsesh/boardsesh-daemon:staging
  #         cd /opt/branch-deploys && docker compose up -d --no-deps staging-backend
  #         echo "Waiting for staging backend to be healthy..."
  #         sleep 5
  #         docker ps --filter "name=staging-backend" --format "table {{.Names}}\t{{.Status}}"

  # Terminal notification for the one successful release state with no promoted
  # component to report: an app-web-only change skipped by the deploy hold. The
  # release-gate state makes this mutually exclusive with promoted, rollback, and
  # failure notifications (including app+OTA changes, which use notify-success).
  notify-app-web-held:
    needs: [detect-changes, release-gate]
    if: >-
      always()
      && needs.release-gate.result == 'success'
      && needs.release-gate.outputs.state == 'app-web-held-only'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Notify Discord (app.boardsesh.com deploy held)
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          # URL wrapped in <…> so Discord suppresses the inline preview embed.
          CONTENT=$(printf '🧊 **app.boardsesh.com deploy held** on `%s`\nAPP_WEB_DEPLOY_HOLD is set, so this commit did NOT ship to the browser app. The subdomain stays on its current deployment.\nClear the `APP_WEB_DEPLOY_HOLD` repo variable and re-run to resume.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$RUN_URL")
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings.
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  # Pings Discord once after a rollback-gated release settles. Web may be staged
  # and the backend image may be built, but app web and native OTA/changelog do
  # not publish while production is pinned.
  notify-no-promote:
    needs:
      [
        detect-changes,
        check-rollback,
        build-backend,
        deploy-web,
        deploy-production-backend,
        deploy-app-web,
        publish-mobile-ota,
        release-gate,
      ]
    if: >-
      always()
      && needs.release-gate.result == 'success'
      && needs.release-gate.outputs.state == 'rollback-active'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Notify Discord (deployed, not promoted)
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          WEB_URL: ${{ needs.deploy-web.outputs.url }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          BACKEND_RESULT: ${{ needs.deploy-production-backend.result }}
          APP_WEB_RESULT: ${{ needs.deploy-app-web.result }}
          APP_CHANGED: ${{ needs.detect-changes.outputs.app_changed }}
          OTA_CHANGED: ${{ needs.detect-changes.outputs.ota_changed }}
          IMAGE: ${{ needs.build-backend.outputs.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          WEB_LINE="not built this run"
          if [ "$WEB_RESULT" = "success" ]; then
            WEB_LINE="staged, not on the production domain: ${WEB_URL:-see run log}"
          fi
          BACKEND_LINE="not built this run"
          if [ "$BACKEND_RESULT" = "success" ]; then
            BACKEND_LINE="image at ${IMAGE}:production in GHCR, Railway NOT redeployed"
          fi
          APP_WEB_LINE="unchanged"
          if [ "$APP_CHANGED" = true ]; then
            APP_WEB_LINE="not deployed (rollback active)"
          fi
          OTA_LINE="unchanged"
          if [ "$OTA_CHANGED" = true ]; then
            OTA_LINE="not published (rollback active; changelog unchanged)"
          fi
          # URL is wrapped in <…> so Discord suppresses the inline preview embed
          # (otherwise the workflow link dominates the message).
          CONTENT=$(printf '⚠️ **Production release held by rollback** on `%s`\nA Vercel Instant Rollback is active, so server/web production stays pinned and native OTA is blocked.\n• web: %s\n• backend: %s\n• app.boardsesh.com: %s\n• mobile OTA: %s\nClear the rollback, then re-run this unified production deploy.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$WEB_LINE" "$BACKEND_LINE" "$APP_WEB_LINE" "$OTA_LINE" "$RUN_URL")
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings from
          # any text we splice in (commit messages, PR titles, etc.).
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  # Pings the Discord deploy channel when any job fails OR is cancelled. The
  # contains(needs.*.result, ...) form covers every job in `needs` automatically
  # — including check-rollback and detect-changes — so a silent no-op (e.g.
  # detect-changes erroring, or a cancelled mid-deploy) still alerts. No-ops if
  # the DISCORD_DEPLOY_WEBHOOK secret is unset.
  notify-failure:
    needs:
      [
        detect-changes,
        check-rollback,
        build-web,
        build-backend,
        migrate,
        deploy-web,
        deploy-production-backend,
        deploy-app-web,
        publish-mobile-ota,
        release-gate,
        mark-production-promoted,
      ]
    if: >-
      always()
      && (needs.release-gate.result == 'failure'
      || needs.mark-production-promoted.result == 'failure'
      || ((needs.release-gate.outputs.state == 'promoted'
      || needs.release-gate.outputs.state == 'noop')
      && needs.mark-production-promoted.result != 'success')
      || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Notify Discord
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          CHECK_ROLLBACK: ${{ needs.check-rollback.result }}
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          BUILD_WEB: ${{ needs.build-web.result }}
          BUILD_BACKEND: ${{ needs.build-backend.result }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY_WEB: ${{ needs.deploy-web.result }}
          DEPLOY_BACKEND: ${{ needs.deploy-production-backend.result }}
          DEPLOY_APP_WEB: ${{ needs.deploy-app-web.result }}
          OTA_RESULT: ${{ needs.publish-mobile-ota.result }}
          OTA_IOS_OUTCOME: ${{ needs.publish-mobile-ota.outputs.ios_outcome }}
          OTA_ANDROID_OUTCOME: ${{ needs.publish-mobile-ota.outputs.android_outcome }}
          OTA_HEALTH_STATUS: ${{ needs.publish-mobile-ota.outputs.health_status }}
          # A live bundle whose Sentry source maps never landed fails the reusable
          # workflow, so this is the notification that has to name it. Without the
          # status the reader cannot tell "nothing published" from "published but
          # unsymbolicated", which need opposite responses.
          OTA_SOURCEMAPS_STATUS: ${{ needs.publish-mobile-ota.outputs.sourcemaps_status }}
          RELEASE_GATE: ${{ needs.release-gate.result }}
          PROMOTION_MARKER: ${{ needs.mark-production-promoted.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ needs.detect-changes.outputs.deploy_sha || github.sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          # URL wrapped in <…> so Discord suppresses the inline preview embed.
          CONTENT=$(printf '🚨 **Production release failed** on `%s`\n• detect-changes: %s\n• check-rollback: %s\n• build-web: %s\n• build-backend: %s\n• migrate: %s\n• deploy-web: %s\n• deploy-production-backend: %s\n• deploy-app-web: %s\n• mobile OTA: %s (iOS: %s, Android: %s; health: %s; source maps: %s)\n• release-gate: %s\n• promotion marker: %s\nAny successful OTA platform remains published; no automatic rollback was attempted.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$DETECT_CHANGES" "$CHECK_ROLLBACK" "$BUILD_WEB" "$BUILD_BACKEND" "$MIGRATE" "$DEPLOY_WEB" "$DEPLOY_BACKEND" "$DEPLOY_APP_WEB" "$OTA_RESULT" "${OTA_IOS_OUTCOME:-skipped}" "${OTA_ANDROID_OUTCOME:-skipped}" "${OTA_HEALTH_STATUS:-not-run}" "${OTA_SOURCEMAPS_STATUS:-not-run}" "$RELEASE_GATE" "$PROMOTION_MARKER" "$RUN_URL")
          # --fail-with-body surfaces Discord's status + error body (e.g. 429,
          # rotated webhook) in the log instead of failing silently. Don't let a
          # webhook hiccup fail the job — the alert is best-effort.
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings.
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  # The single completion notification after a fully promoted or deliberately
  # held mixed release settles, including OTA health. It uses the validated
  # base→exact-deploy range rather than event fields from this late job.
  notify-success:
    needs:
      [
        check-rollback,
        detect-changes,
        build-web,
        build-backend,
        migrate,
        deploy-web,
        deploy-production-backend,
        deploy-app-web,
        publish-mobile-ota,
        release-gate,
        mark-production-promoted,
      ]
    if: >-
      always()
      && needs.release-gate.result == 'success'
      && (needs.release-gate.outputs.state == 'release-held'
      || (needs.release-gate.outputs.state == 'promoted'
      && needs.mark-production-promoted.result == 'success'))
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      # Need contents:read to fetch full history and pull-requests:read so
      # `gh api repos/.../pulls/N` can read titles. Default GITHUB_TOKEN on
      # push events already includes these, but pinning the job to the
      # minimum scope keeps it least-privileged.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-changes.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Notify Discord (release settled)
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ needs.release-gate.outputs.state }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          BACKEND_RESULT: ${{ needs.deploy-production-backend.result }}
          APP_WEB_RESULT: ${{ needs.deploy-app-web.result }}
          APP_CHANGED: ${{ needs.detect-changes.outputs.app_changed }}
          APP_WEB_HELD: ${{ vars.APP_WEB_DEPLOY_HOLD != '' }}
          OTA_CHANGED: ${{ needs.detect-changes.outputs.ota_changed }}
          OTA_RESULT: ${{ needs.publish-mobile-ota.result }}
          OTA_CONFIGURED: ${{ needs.publish-mobile-ota.outputs.configured }}
          OTA_ANY_SUCCESS: ${{ needs.publish-mobile-ota.outputs.any_success }}
          OTA_IOS_OUTCOME: ${{ needs.publish-mobile-ota.outputs.ios_outcome }}
          OTA_ANDROID_OUTCOME: ${{ needs.publish-mobile-ota.outputs.android_outcome }}
          OTA_HEALTH_STATUS: ${{ needs.publish-mobile-ota.outputs.health_status }}
          OTA_CHANGELOG_SUMMARY_BASE64: ${{ needs.publish-mobile-ota.outputs.changelog_summary_base64 }}
          OTA_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ needs.detect-changes.outputs.deploy_sha }}
          BEFORE_SHA: ${{ needs.detect-changes.outputs.changelog_base_sha }}
          PR_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/pull
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi

          WEB_LINE="unchanged"
          if [ "$WEB_RESULT" = "success" ]; then WEB_LINE="deployed"; fi
          BACKEND_LINE="unchanged"
          if [ "$BACKEND_RESULT" = "success" ]; then BACKEND_LINE="deployed"; fi
          APP_WEB_LINE="unchanged"
          if [ "$APP_CHANGED" = true ] && [ "$APP_WEB_HELD" = true ]; then
            APP_WEB_LINE="held by APP_WEB_DEPLOY_HOLD"
          elif [ "$APP_WEB_RESULT" = "success" ]; then
            APP_WEB_LINE="deployed"
          fi

          OTA_LINE="unchanged"
          OTA_HEALTH_LINE="not run"
          if [ "$OTA_CHANGED" = true ] && [ "$OTA_CONFIGURED" != true ]; then
            OTA_LINE="skipped (self-hosted OTA is not configured)"
          elif [ "$OTA_CHANGED" = true ] && [ "$OTA_ANY_SUCCESS" = true ]; then
            OTA_LINE="published (iOS: ${OTA_IOS_OUTCOME:-skipped}, Android: ${OTA_ANDROID_OUTCOME:-skipped})"
            OTA_HEALTH_LINE=${OTA_HEALTH_STATUS:-unavailable}
          elif [ "$OTA_CHANGED" = true ]; then
            OTA_LINE="not published (job: ${OTA_RESULT:-unknown})"
          fi

          # Pull PR numbers from merge commits and squash-merge subjects in the
          # validated range. Skip the section for a zero base rather than guessing.
          PR_LIST=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            PR_NUMS=$(git log --format='%s' "${BEFORE_SHA}..${COMMIT_SHA}" \
              | sed -nE -e 's/.*Merge pull request #([0-9]+).*/\1/p' -e 's/.*\(#([0-9]+)\)$/\1/p' \
              | sort -un || true)
            while IFS= read -r PR; do
              # `|| continue` form is safe under `set -e`; `&& continue` can trip it.
              [ -n "$PR" ] || continue
              TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.title' 2>/dev/null || true)
              PR_URL="${PR_BASE_URL}/${PR}"
              if [ -n "$TITLE" ]; then
                LINE="• #${PR} — ${TITLE} <${PR_URL}>"
              else
                LINE="• #${PR} <${PR_URL}>"
              fi
              if [ -z "$PR_LIST" ]; then
                PR_LIST="$LINE"
              else
                PR_LIST="${PR_LIST}"$'\n'"${LINE}"
              fi
            done <<< "$PR_NUMS"
          fi

          SHIPPED_SECTION=""
          if [ -n "$PR_LIST" ]; then
            SHIPPED_SECTION=$(printf '\nShipped:\n%s' "$PR_LIST")
          fi

          WHATS_NEW_SECTION=""
          if [ -n "$OTA_CHANGELOG_SUMMARY_BASE64" ]; then
            OTA_CHANGELOG_SUMMARY=$(printf '%s' "$OTA_CHANGELOG_SUMMARY_BASE64" | base64 --decode)
            WHATS_NEW_SECTION=$(printf '\n\n**What'\''s new**\n%s' "$OTA_CHANGELOG_SUMMARY")
          elif [ "$OTA_ANY_SUCCESS" = true ]; then
            OTA_FALLBACK_MESSAGE=${OTA_MESSAGE:-$(git log -1 --pretty=%s "$COMMIT_SHA")}
            WHATS_NEW_SECTION=$(printf '\n\n**What'\''s new**\n%s' "$OTA_FALLBACK_MESSAGE")
          fi

          HEADER='✅ **Production release completed**'
          if [ "$RELEASE_STATE" = release-held ]; then
            HEADER='⚠️ **Production release completed with held surfaces**'
          elif [ "$OTA_HEALTH_LINE" = alert ]; then
            HEADER='⚠️ **Production release completed — OTA health alert**'
          fi

          # RUN_URL wrapped in <…> so Discord suppresses the inline preview embed.
          CONTENT=$(printf '%s on `%s`\n• web: %s\n• backend: %s\n• app.boardsesh.com: %s\n• mobile OTA: %s\n• OTA health: %s%s%s\n<%s>' \
            "$HEADER" "${COMMIT_SHA:0:7}" "$WEB_LINE" "$BACKEND_LINE" "$APP_WEB_LINE" "$OTA_LINE" "$OTA_HEALTH_LINE" "$SHIPPED_SECTION" "$WHATS_NEW_SECTION" "$RUN_URL")
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings —
          # critical here because PR titles flow straight into $content.
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"
