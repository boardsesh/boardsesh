name: Production Deploy

# Single source of truth for production deploys.
#
# build-web produces TWO web artifacts from one job: the Vercel prebuilt output
# and the GHCR image (ghcr.io/boardsesh/boardsesh-web). build-backend produces
# the backend image. Then the gate: the production deploys only run once EVERY
# build that was attempted has passed. A failed build skips every prod deploy,
# so we never ship a half-deployed release. db:migrate runs in its own gated job
# after both builds pass (it used to run inside the Vercel build).
#
# Web has two possible deploy targets, selected by the Production-environment
# variable WEB_DEPLOY_TARGETS and resolved by the resolve-web-targets job:
#
#   unset / ''       → vercel        (today's behaviour)
#   'vercel'         → vercel
#   'railway'        → railway       (needs RAILWAY_WEB_SERVICE_ID)
#   'vercel,railway' → both, in parallel
#   'none'           → neither; the web hold, announced by notify-web-held
#
# Anything else fails resolve-web-targets, which skips every web deploy. The
# GHCR image is built and pushed on every run regardless of the setting — the
# image is the artifact, publishing it is free, and only the redeploys are
# gated. See docs/production-deploy.md.
#
# Both Railway services (backend, web) deploy the same way: this run repoints
# the moving `:production` GHCR tag at the fresh digest, then `railway redeploy`
# re-pulls it. Both go through .github/actions/railway-redeploy.
#
# Vercel native git auto-deploy is disabled (packages/web/vercel.json
# git.deploymentEnabled=false) so this workflow is the only production deployer.
#
# check-rollback detects whether a Vercel Instant Rollback is currently pinning
# production to an older deployment. If so, this run still builds and deploys,
# but does NOT promote: web ships with --skip-domain (staged, not assigned to
# the production domain) and both images are pushed to GHCR without a Railway
# redeploy. That way an incident mitigation isn't silently overwritten, the
# release is staged and ready to promote once the rollback is cleared, and
# Discord is notified. (Migrations must stay backward-compatible — see docs —
# because Instant Rollback reverts only the web deployment, never the DB.) The
# probe is only meaningful while Vercel is a web deploy target; once it is not,
# it short-circuits to active=false inside the job.

on:
  push:
    branches: [main]
    # No paths filter — detect-changes decides per-side. Web deploys on
    # essentially any app change; backend only on backend-affecting paths.
  workflow_dispatch:
    inputs:
      cloudflare_allow_zone_ssl:
        description: >-
          One-off: let cf:apply set the ZONE-WIDE SSL/TLS mode. Off by default and
          deliberately not wired to push, because the setting affects every hostname
          on boardsesh.com (ws, app, www), not just the one being deployed.
        type: boolean
        default: false

concurrency:
  group: production-deploy
  # GitHub still keeps only one pending run and replaces an older pending run
  # with the newest push. detect-changes therefore uses the last successful run
  # as its baseline, so the surviving run absorbs every canceled middle push.
  cancel-in-progress: false # never cancel the run that is already executing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: boardsesh-daemon
  WEB_IMAGE_NAME: boardsesh-web

  # --- Expo web export (deploy-app-web) -------------------------------------
  # These are read only by the `expo export` in deploy-app-web, but they live at
  # workflow level on purpose: scripts/mobile-ci-env-parity.test.ts extracts
  # workflow-level `env:` (2-space indent) and would not see a job-level block.
  # They are all public client values — `EXPO_PUBLIC_*` is inlined into the JS
  # bundle at build time, so none of this is a secret.
  #
  # EXPO_PUBLIC_WEB_URL is the AUTH origin and is deliberately www.boardsesh.com,
  # NOT app.boardsesh.com: the SPA does credentialed cross-origin auth against
  # www. See docs/expo-web-deployment.md.
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  # Same DSN and project as every other mobile workflow, so app.boardsesh.com
  # reports alongside the native fleet. Until this landed the subdomain shipped
  # with no client telemetry at all: both SDKs gate on these vars being present
  # at BUILD time (sentry.ts `isSentryEnabled`, posthog-client.ts
  # `isAnalyticsEnabled`), and deploy-app-web set neither.
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  # Separates browser-app events from the native fleet in both SDKs. `environment`
  # is init-only, so this build-time var is the only place it can be set
  # (src/lib/app-environment.ts `resolveAppEnvironment`).
  EXPO_PUBLIC_SENTRY_ENVIRONMENT: production-web
  EXPO_PUBLIC_STATIC_ASSET_BASE_URL: https://assets.boardsesh.com

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      web_changed: ${{ steps.changes.outputs.web }}
      backend_changed: ${{ steps.changes.outputs.backend }}
      app_changed: ${{ steps.changes.outputs.app }}
      deployment_base_sha: ${{ steps.changes.outputs.deployment_base_sha }}
      cloudflare_changed: ${{ steps.changes.outputs.cloudflare }}
      static_assets_changed: ${{ steps.changes.outputs.static_assets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read the latest successful production deploy
        id: deploy-history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs_json="$RUNNER_TEMP/production-deploy-runs.json"
          if ! gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?branch=main&status=success&per_page=20" \
            > "$runs_json"; then
            echo "::warning::Could not read prior production runs; falling back to a full deploy."
            printf '{"workflow_runs":[]}\n' > "$runs_json"
          fi
          echo "runs_json=$runs_json" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: changes
        env:
          RUNS_JSON: ${{ steps.deploy-history.outputs.runs_json }}
        run: node scripts/production-deploy-changes.mjs --runs-json "$RUNS_JSON"

  # Resolves which deployers www is allowed to use on this run, and hands the
  # answer downstream as job outputs.
  #
  # This is a JOB rather than `if: vars.WEB_DEPLOY_TARGETS == ...` on each deploy
  # job, and that is not a style choice. A job-level `if:` is evaluated before any
  # environment is attached, so `vars.` there resolves REPOSITORY variables only —
  # never Production-environment ones. The same trap is documented on APP_WEB_HELD
  # in notify-success below, where re-reading vars.APP_WEB_DEPLOY_HOLD from a job
  # that DOES declare the environment would report "held" for a deploy that
  # actually shipped. WEB_DEPLOY_TARGETS lives in the Production environment
  # (alongside RAILWAY_WEB_SERVICE_ID), so it has to be read from inside a job
  # that declares `environment: Production` and published as an output.
  #
  # Failing this job is the fail-closed path for a malformed setting: every
  # downstream web job gates on `needs.check-rollback.result == 'success'` or on
  # these outputs, so a bad value skips the deploys and fires notify-failure
  # rather than guessing at what was meant.
  resolve-web-targets:
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      web_vercel: ${{ steps.resolve.outputs.web_vercel }}
      web_railway: ${{ steps.resolve.outputs.web_railway }}
      web_targets: ${{ steps.resolve.outputs.web_targets }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve web deploy targets
        id: resolve
        env:
          WEB_DEPLOY_TARGETS: ${{ vars.WEB_DEPLOY_TARGETS }}
          RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
        run: node scripts/production-web-deploy-targets.mjs

  # Detects whether a Vercel Instant Rollback is pinning production. Outputs
  # active=true/false; the deploy jobs read it to decide promote vs. stage-only.
  # Fails closed (blocks the run) only if it can't read rollback state at all.
  check-rollback:
    needs: [resolve-web-targets]
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Detect active Vercel instant rollback
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          WEB_VERCEL: ${{ needs.resolve-web-targets.outputs.web_vercel }}
        run: |
          # Short-circuit at STEP level, not with a job-level `if:`. build-backend
          # has no `always()` in its own gate, so skipping this whole job would
          # cascade into skipping the backend build and every deploy behind it —
          # a Vercel setting silently switching off the backend release. Writing
          # active=false and exiting 0 keeps the job `success` and the graph
          # intact; there is simply no Vercel deployment to protect.
          if [ "$WEB_VERCEL" != "true" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel is not a web deploy target (WEB_DEPLOY_TARGETS) — Instant Rollback probe skipped."
            exit 0
          fi

          # Team projects need ?teamId=; personal (user_*) ids must not pass it.
          TEAM_QS=""
          case "$VERCEL_ORG_ID" in
            team_*) TEAM_QS="?teamId=$VERCEL_ORG_ID" ;;
          esac

          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}${TEAM_QS}")

          # Fail closed: if we can't read rollback state, don't risk promoting over one.
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Vercel project API returned HTTP $HTTP_CODE — cannot confirm rollback state, blocking deploy."
            cat response.json || true
            exit 1
          fi

          # Two signals — fire on either:
          #   autoAssignCustomDomains=false: durable. Vercel flips this off when a
          #     rollback is pinned and back on when the rollback is undone (or a
          #     deployment is manually promoted). This is what we rely on.
          #   lastRollbackTarget non-null: transient (only populated mid-transition
          #     in our experience). Kept as a secondary OR'd signal in case Vercel
          #     starts persisting it again.
          AUTO_ASSIGN=$(jq -r '.autoAssignCustomDomains' response.json)
          ROLLBACK_TARGET=$(jq -r '.lastRollbackTarget // empty' response.json)

          # Guard against Vercel changing the project payload shape — silently
          # treating a missing flag as "no rollback" is how we promoted over one.
          case "$AUTO_ASSIGN" in
            true|false) ;;
            *)
              echo "::error::autoAssignCustomDomains is '$AUTO_ASSIGN' (expected true/false) — cannot confirm rollback state, blocking deploy."
              cat response.json
              exit 1
              ;;
          esac

          if [ "$AUTO_ASSIGN" = "false" ] || [ -n "$ROLLBACK_TARGET" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A Vercel Instant Rollback is active — this run will deploy but NOT promote (production stays pinned)."
            echo "Signals: autoAssignCustomDomains=$AUTO_ASSIGN, lastRollbackTarget present=$([ -n "$ROLLBACK_TARGET" ] && echo yes || echo no)"
            if [ -n "$ROLLBACK_TARGET" ]; then
              jq '.lastRollbackTarget' response.json
            fi
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No rollback signal detected (autoAssignCustomDomains=true, lastRollbackTarget=null) — deploy will promote to production."
          fi

  # Publish immutable images before any build that can reference their hashed
  # URLs. The uploader lists the dedicated bucket and PUTs only missing hashes;
  # it never deletes or overwrites objects needed by an older deployment.
  sync-static-assets:
    needs: [detect-changes, deploy-cloudflare]
    if: >-
      always()
      && needs.detect-changes.outputs.static_assets_changed == 'true'
    runs-on: ubuntu-latest
    # A stuck S3/CDN socket must release the serialized production-deploy
    # concurrency group. A healthy full-catalog validation takes about three
    # minutes, leaving ample headroom for bounded propagation retries.
    timeout-minutes: 10
    environment: Production
    steps:
      # Run this job even when its Cloudflare dependency failed, then fail it
      # explicitly. Otherwise GitHub reports the dependency-blocked job as
      # "skipped", which downstream build gates legitimately accept when no
      # static assets changed.
      - name: Require successful Cloudflare prerequisite
        env:
          CLOUDFLARE_DEPLOY_RESULT: ${{ needs.deploy-cloudflare.result }}
        run: |
          case "$CLOUDFLARE_DEPLOY_RESULT" in
            success|skipped) ;;
            *)
              echo "::error::Cloudflare prerequisite finished with result: $CLOUDFLARE_DEPLOY_RESULT"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Upload missing immutable static assets
        env:
          STATIC_ASSETS_S3_BUCKET_NAME: ${{ secrets.STATIC_ASSETS_S3_BUCKET_NAME }}
          STATIC_ASSETS_AWS_ACCESS_KEY_ID: ${{ secrets.STATIC_ASSETS_AWS_ACCESS_KEY_ID }}
          STATIC_ASSETS_AWS_SECRET_ACCESS_KEY: ${{ secrets.STATIC_ASSETS_AWS_SECRET_ACCESS_KEY }}
          STATIC_ASSETS_AWS_ENDPOINT_URL: ${{ secrets.STATIC_ASSETS_AWS_ENDPOINT_URL }}
          STATIC_ASSETS_AWS_REGION: ${{ secrets.STATIC_ASSETS_AWS_REGION }}
        run: vp run upload:static-assets

  # One job builds BOTH web artifacts on purpose. The GHCR image steps could be a
  # sibling job, but `migrate` gates on `!(build-web skipped && build-backend
  # skipped)`, and a third build job would change what that gate means — so the
  # image build lives inside the job already named build-web and the gate stays
  # untouched. The Vercel half is deleted in the scrub PR once www is off Vercel;
  # the image half is what survives.
  build-web:
    needs: [detect-changes, resolve-web-targets, check-rollback, sync-static-assets]
    if: >-
      always()
      && needs.detect-changes.outputs.web_changed == 'true'
      && needs.check-rollback.result == 'success'
      && (needs.sync-static-assets.result == 'success' || needs.sync-static-assets.result == 'skipped')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WEB_IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install Vercel CLI
        if: needs.resolve-web-targets.outputs.web_vercel == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        if: needs.resolve-web-targets.outputs.web_vercel == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        # The CLI reads VERCEL_TOKEN from the env — don't pass --token as a flag
        # (it would show up in the runner's process list).
        run: vercel pull --yes --environment=production

      - name: Build with Vercel (prebuilt output)
        if: needs.resolve-web-targets.outputs.web_vercel == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Next's "Collecting page data" phase evaluates route modules (e.g.
          # /api/auth/[...nextauth]), which instantiate the db client and throw
          # if DATABASE_URL is unset. Native Vercel builds got this from the
          # project env; in Actions we pass it explicitly (process.env wins over
          # any .env file in Next). Same Production-environment secret the
          # migrate job uses.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NEXT_PUBLIC_* must exist at build time — Next inlines it into the
          # client bundle. Native Vercel builds got this from the project env;
          # the CI prebuilt build does not, so pass it explicitly (same gap as
          # DATABASE_URL). Without it, getPosthog() short-circuits and ALL
          # client-side PostHog analytics goes dark — which is exactly what
          # happened when prod web moved to CI `vercel build`. Public client key
          # (phc_…), not a secret, so it's a GitHub Actions variable.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          # Keep the production client fallback pointed at the backend service.
          # Without this, Next can inline the tracked local .env.local value
          # (ws://localhost:8080/graphql) during CI builds. Runtime host
          # derivation now protects boardsesh.com, but this keeps every caller
          # that still reads the baked env on the right backend.
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'wss://ws.boardsesh.com/graphql' }}
          NEXT_PUBLIC_STATIC_ASSET_BASE_URL: https://assets.boardsesh.com
        run: vercel build --prod

      - name: Package prebuilt output
        if: needs.resolve-web-targets.outputs.web_vercel == 'true'
        # vercel deploy --prebuilt needs .vercel/output AND the build-generated
        # files its Build Output API symlinks point at that aren't in git: the
        # Next build dir (packages/web/.next) and packages/web/public/openapi.json
        # (written by scripts/generate-openapi.ts; the rest of public/ is committed
        # and restored by the deploy-web checkout). actions/upload-artifact
        # dereferences symlinks, so we tar with symlinks preserved. Allowlist only
        # these paths — never .vercel itself, which holds the pulled
        # .env.production.local secrets.
        run: tar -czf vercel-output.tar.gz .vercel/output .vercel/project.json packages/web/.next packages/web/public/openapi.json

      - name: Upload prebuilt output
        if: needs.resolve-web-targets.outputs.web_vercel == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: vercel-output.tar.gz
          retention-days: 1

      # --- The GHCR web image -------------------------------------------------
      # Deliberately UNGATED by WEB_DEPLOY_TARGETS. The image is the artifact:
      # publishing it costs nothing, is reversible, and is what makes a later
      # `railway redeploy` possible without a rebuild. Only the deploy jobs are
      # gated. That is also what makes merging this PR a no-op for production —
      # the only new behaviour on the default setting is this push.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract web image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WEB_IMAGE_NAME }}
          # No `:staging` — unlike the backend, nothing in homelab consumes a
          # staging web image. Railway pulls the moving `:production` tag;
          # `:sha-<short>` is the immutable handle for a manual rollback.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=production,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate web Docker context
        run: vp run docker-context:web

      - name: Build and push web image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .docker-context/web
          file: .docker-context/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Every NEXT_PUBLIC_* here is inlined into the client bundle at build
          # time, so this list IS the production client config. Each key must
          # have a matching `ARG` in Dockerfile.web's builder stage — Docker
          # silently ignores a build-arg the Dockerfile never declares, which is
          # how client analytics went dark once already. Pinned by
          # scripts/__tests__/production-deploy-web-targets.test.ts.
          build-args: |
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://ws.boardsesh.com/graphql' }}
            BASE_URL=https://www.boardsesh.com
            BOARDSESH_WEB=1
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_STATIC_ASSET_BASE_URL=https://assets.boardsesh.com
            SENTRY_RELEASE=${{ github.sha }}
          # A secret mount, never a build-arg: an ARG's value is recorded in the
          # image history, so `docker history` on the published image would hand
          # out the token. withSentryConfig uploads source maps only when this is
          # present in the build env.
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web-main
          # THERE IS NO `cache-to`, ON PURPOSE — do not add one back. Writing this
          # scope costs 2.72 GB against a repo cache measured at 9.15 GB of
          # GitHub's 10 GB ceiling (2026-08-25), so the write evicts other scopes
          # by LRU — the gradle and vp toolchain caches among them, which serve
          # mobile PRs, the dominant PR shape here. It would save ~90 s on a job
          # that runs once per merge. If a writable cache is ever genuinely
          # needed, the registry-backed option (type=registry on GHCR) is
          # quota-free and this job already has push credentials.

      - name: Generate web artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WEB_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-backend:
    needs: [detect-changes, check-rollback]
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # Same digest gets all of these tags. Homelab consumes :staging,
          # Railway consumes :production, humans use :sha-<short> for rollback.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=production,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate backend Docker context
        run: vp run docker-context:backend

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .docker-context/backend
          file: .docker-context/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-main
          cache-to: type=gha,mode=max,scope=backend-main

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The GATE. Runs migrations only once every attempted build has passed. A
  # build that ran and FAILED is 'failure' (not 'skipped') and fails this check,
  # which in turn skips both production deploy jobs below.
  migrate:
    needs: [detect-changes, build-web, build-backend, sync-static-assets]
    if: >-
      always()
      && (needs.build-web.result == 'success' || needs.build-web.result == 'skipped')
      && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
      && (needs.sync-static-assets.result == 'success' || needs.sync-static-assets.result == 'skipped')
      && !(needs.build-web.result == 'skipped' && needs.build-backend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERIFY_MIGRATION_JOURNAL: '1'
        run: vp exec pnpm --filter @boardsesh/db run db:migrate

  deploy-web:
    needs:
      [
        detect-changes,
        resolve-web-targets,
        check-rollback,
        build-web,
        migrate,
        deploy-production-backend,
        deploy-cloudflare,
      ]
    if: >-
      always()
      && needs.detect-changes.outputs.web_changed == 'true'
      && needs.resolve-web-targets.outputs.web_vercel == 'true'
      && needs.build-web.result == 'success'
      && needs.migrate.result == 'success'
      && (needs.detect-changes.outputs.backend_changed != 'true' || needs.deploy-production-backend.result == 'success')
      && (needs.detect-changes.outputs.cloudflare_changed != 'true' || needs.deploy-cloudflare.result == 'success')
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        # vercel deploy --prebuilt validates the prebuilt output's file traces
        # against the filesystem; those traces reference the pnpm-linked
        # node_modules tree, so the workspace must be installed even though
        # the build itself is already baked into .vercel/output.
        run: vp install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download prebuilt output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .

      - name: Extract prebuilt output
        # Restores .vercel/output, .vercel/project.json, packages/web/.next and
        # packages/web/public/openapi.json with symlinks intact (over the
        # checked-out tree, which already has the committed public/ assets).
        run: tar -xzf vercel-output.tar.gz && rm vercel-output.tar.gz

      - name: Deploy prebuilt output to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          ROLLBACK_ACTIVE: ${{ needs.check-rollback.outputs.active }}
        run: |
          # vercel deploy --prebuilt still resolves the project's Root Directory
          # (packages/web), so the repo must be checked out even though the build
          # is already baked into the downloaded .vercel/output.
          # When a rollback is pinned, --skip-domain builds + uploads the
          # production deployment without assigning it to the production domain,
          # so the pinned (rolled-back) deployment keeps serving traffic.
          # The CLI reads VERCEL_TOKEN from the env (set above) — no --token flag.
          if [ "$ROLLBACK_ACTIVE" = "true" ]; then
            echo "Instant Rollback active — deploying WITHOUT promoting (--skip-domain)."
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --skip-domain)
          else
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod)
          fi
          echo "$DEPLOY_OUTPUT"
          # Extract the deployment URL token rather than the last line, so a
          # trailing warning on the final stdout line can't corrupt the URL we
          # report to Discord. Empty is fine — the notify step handles it.
          URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+' | tail -n1 || true)
          echo "Deployment URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # - name: Post-deploy smoke against www.boardsesh.com
      #   # Skipped when a rollback is pinned: `--skip-domain` means this deploy
      #   # is uploaded but NOT serving, so www is still the rolled-back build.
      #   # Smoking it would report on a deployment this job did not promote.
      #   #
      #   # This runs AFTER the deploy, so it is a detector, not a gate — it can
      #   # turn the job red (and fire notify-failure) but can never block a
      #   # deploy from going out. That asymmetry is deliberate: a fail-closed
      #   # deploy gate stopped production deploys for two days once already.
      #   if: needs.check-rollback.outputs.active != 'true'
      #   env:
      #     SMOKE_KIOSK_GYM_SLUG: ${{ vars.SMOKE_KIOSK_GYM_SLUG }}
      #     SMOKE_EMBED_BOARD_UUID: ${{ vars.SMOKE_EMBED_BOARD_UUID }}
      #   # Plain `node` executes the TypeScript directly (type stripping). The
      #   # script imports only node: builtins, so no workspace install is needed.
      #   run: node scripts/production-smoke.ts

  deploy-production-backend:
    needs: [detect-changes, check-rollback, build-backend, migrate]
    if: always() && needs.detect-changes.outputs.backend_changed == 'true' && needs.build-backend.result == 'success' && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - name: Show image being deployed
        run: |
          echo "Image: ${{ needs.build-backend.outputs.image }}:production"
          echo "Digest: ${{ needs.build-backend.outputs.digest }}"

      # Railway has no "deploy without promoting", so during a rollback we just
      # don't redeploy: the image is already pushed to GHCR (:production, :sha-)
      # and is ready to redeploy once the rollback is cleared.
      - name: Skip Railway redeploy (instant rollback active)
        if: needs.check-rollback.outputs.active == 'true'
        run: |
          echo "Instant Rollback active — backend image pushed to GHCR but NOT redeployed to Railway."
          echo "Promote by redeploying ${{ needs.build-backend.outputs.image }}:production once the rollback is cleared."

      # Capture / redeploy / poll / roll-back, shared verbatim with the web
      # service so the two cannot drift. The action shells out to
      # scripts/railway-deployment-status.mjs, hence the checkout above.
      - name: Redeploy the Railway backend service
        if: needs.check-rollback.outputs.active != 'true'
        uses: ./.github/actions/railway-redeploy
        with:
          service-id: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          service-label: backend

      - name: Verify the live API and board renderer
        if: needs.check-rollback.outputs.active != 'true'
        # Railway can report SUCCESS just before the public edge reaches the new
        # instance. The bounded retry proves both the API shape mobile already
        # ships and the image endpoint www is about to reference, turning a
        # stale image/schema into notify-failure instead of silence.
        run: node scripts/production-backend-smoke.mjs

  # www on Railway. Sibling of deploy-web (Vercel), selected by
  # WEB_DEPLOY_TARGETS: both can run on the same commit while traffic is being
  # moved, and either can be the only one. Same gates as deploy-web, because the
  # two ship the same commit to the same audience.
  deploy-web-railway:
    needs:
      [
        detect-changes,
        resolve-web-targets,
        check-rollback,
        build-web,
        migrate,
        deploy-production-backend,
        deploy-cloudflare,
      ]
    if: >-
      always()
      && needs.detect-changes.outputs.web_changed == 'true'
      && needs.resolve-web-targets.outputs.web_railway == 'true'
      && needs.build-web.result == 'success'
      && needs.migrate.result == 'success'
      && (needs.detect-changes.outputs.backend_changed != 'true' || needs.deploy-production-backend.result == 'success')
      && (needs.detect-changes.outputs.cloudflare_changed != 'true' || needs.deploy-cloudflare.result == 'success')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      # The smoke below is a .ts file run by plain `node` (type stripping), so
      # this job needs the pinned Node 22.x that setup-vp installs — and the
      # composite action's poll runs a repo script from the checkout above.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Show image being deployed
        run: |
          echo "Image: ${{ needs.build-web.outputs.image }}:production"
          echo "Digest: ${{ needs.build-web.outputs.digest }}"

      # Railway has no "deploy without promoting", so during a rollback we just
      # don't redeploy: the image is already pushed to GHCR (:production, :sha-)
      # and is ready to redeploy once the rollback is cleared.
      - name: Skip Railway redeploy (instant rollback active)
        if: needs.check-rollback.outputs.active == 'true'
        run: |
          echo "Instant Rollback active — web image pushed to GHCR but NOT redeployed to Railway."
          echo "Promote by redeploying ${{ needs.build-web.outputs.image }}:production once the rollback is cleared."

      - name: Redeploy the Railway web service
        if: needs.check-rollback.outputs.active != 'true'
        uses: ./.github/actions/railway-redeploy
        with:
          service-id: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          service-label: web

      - name: Post-deploy smoke against the Railway web origin
        # Runs AFTER the deploy, so it is a detector, not a gate — it can turn
        # the job red (and fire notify-failure) but can never block a deploy from
        # going out. A fail-closed deploy gate stopped production deploys for two
        # days once already (#3977).
        #
        # `continue-on-error` while Vercel is ALSO a target: www is still served
        # by Vercel then, so a red Railway smoke is information about a container
        # nobody is browsing and must not fail the release. The moment Railway is
        # the sole target it becomes a hard gate on the origin actually serving
        # users — the expression flips on its own, no edit needed.
        if: needs.check-rollback.outputs.active != 'true' && vars.RAILWAY_WEB_ORIGIN != ''
        continue-on-error: ${{ needs.resolve-web-targets.outputs.web_vercel == 'true' }}
        env:
          RAILWAY_WEB_ORIGIN: ${{ vars.RAILWAY_WEB_ORIGIN }}
          SMOKE_KIOSK_GYM_SLUG: ${{ vars.SMOKE_KIOSK_GYM_SLUG }}
          SMOKE_EMBED_BOARD_UUID: ${{ vars.SMOKE_EMBED_BOARD_UUID }}
        # Plain `node` executes the TypeScript directly (type stripping). The
        # script imports only node: builtins, so no workspace install is needed.
        run: node scripts/production-smoke.ts --base "$RAILWAY_WEB_ORIGIN"

      - name: Note the missing smoke origin
        # A skipped step is grey in the run summary and reads exactly like a
        # skipped rollback guard. Say which variable is missing instead.
        if: needs.check-rollback.outputs.active != 'true' && vars.RAILWAY_WEB_ORIGIN == ''
        run: |
          echo "::notice::RAILWAY_WEB_ORIGIN is unset — the Railway web service was redeployed but not smoked. Set it in the Production environment."

  # Deploys app.boardsesh.com — the STANDALONE Expo web export (baseUrl `/`)
  # served at the root of its own subdomain via Cloudflare Pages (project
  # `boardsesh-app`, direct upload). This is the `--subdomain` artifact, distinct
  # from the `/app` export the web Docker image bakes. See
  # docs/expo-web-deployment.md.
  #
  # Independent of the web/backend build+migrate gate: it's a self-contained
  # static export + upload with no DB or image dependency, so it only needs
  # detect-changes. No inline Playwright smoke gate — a per-deploy expo-web boot
  # is too heavy here (this file has no such gate for web/backend either); the
  # expo-web-smoke suite stays the dispatch-only gate in e2e-tests.yml.
  # Converges the Cloudflare zone config (infra/cloudflare) on main. Runs only
  # when the desired state or apply tooling changes (or on manual dispatch).
  # Static-asset publication waits for this job when both targets change, so it
  # cannot validate the public hostname before its DNS record is converged. Web
  # promotion waits independently for both this apply and the live backend smoke.
  # A non-zero exit = unapplied drift (e.g. a blocked zone-SSL change) and should
  # be investigated, not retried blindly.
  # www is a Railway container deployed by `deploy-web-railway`; Cloudflare only
  # fronts DNS/cache for it (docs/production-deploy.md). This job converges the
  # zone and nothing else — it does not build or serve the app.
  deploy-cloudflare:
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.cloudflare_changed == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      # setup-vp puts `vp` on PATH. Without this step the apply step dies on
      # `vp: command not found` AFTER the Production environment has already
      # handed it the Cloudflare token, which reads as a credentials problem
      # and is not. Every other `vp run` step in this workflow pairs with it.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Apply Cloudflare config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only a manual dispatch can carry this; a push always resolves to ''.
          # That is the point: an SSL drift should be a decision someone makes,
          # not something a routine merge applies zone-wide on their behalf.
          ALLOW_ZONE_SSL: ${{ inputs.cloudflare_allow_zone_ssl && '--allow-zone-ssl' || '' }}
        run: vp run cf:apply -- --apply $ALLOW_ZONE_SSL

  # Manual deploy freeze for app.boardsesh.com, the Cloudflare Pages analogue of
  # check-rollback. deploy-web and deploy-production-backend both honour a pinned
  # Vercel Instant Rollback; Pages has no equivalent signal here, so without this
  # a dashboard rollback of the subdomain is silently clobbered by the next merge
  # touching packages/mobile, packages/shared, packages/shared-schema, the export
  # script, or deploy/app-subdomain. Set the repo variable APP_WEB_DEPLOY_HOLD to
  # any non-empty value to hold the subdomain where it is; clear it to resume.
  deploy-app-web:
    needs: [detect-changes, sync-static-assets]
    if: always() && needs.detect-changes.outputs.app_changed == 'true' && (needs.sync-static-assets.result == 'success' || needs.sync-static-assets.result == 'skipped') && vars.APP_WEB_DEPLOY_HOLD == ''
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build standalone Expo web export (production env baked in)
        # The EXPO_PUBLIC_* values come from the workflow-level `env:` block
        # (see the header) so mobile-ci-env-parity can read them; the export
        # inherits them, no per-step re-declaration needed.
        #
        # BOARDSESH_EXPORT_EXPECT_URLS is inert until sibling PR #3797 lands the
        # `--clear` + env-assertion support; once it does, it becomes the
        # in-export stale-env detector. The independent grep step below covers us
        # regardless of merge order.
        run: |
          BOARDSESH_EXPORT_EXPECT_URLS="https://ws.boardsesh.com https://www.boardsesh.com" \
          bash scripts/build-expo-web-export.sh --subdomain "$RUNNER_TEMP/app-standalone"

      - name: Verify production origins and telemetry keys are baked into the bundles
        # Belt-and-braces stale-env guard, independent of #3797's
        # BOARDSESH_EXPORT_EXPECT_URLS. `expo export` reuses Metro's transform
        # cache even when EXPO_PUBLIC_* change, so an old env can silently ship;
        # grep the emitted JS bundles for each expected value and fail otherwise.
        #
        # The telemetry keys are checked here for the same reason the origins
        # are: EXPO_PUBLIC_* are inlined at build time, so "the workflow set it"
        # and "the bundle contains it" are different claims. This step asserts
        # the second. It does NOT prove either SDK initialises under
        # react-native-web — that needs the preview check in the PR body.
        env:
          POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
        run: |
          set -euo pipefail
          js_glob="$RUNNER_TEMP/app-standalone/_expo/static/js/web"
          for origin in ws.boardsesh.com www.boardsesh.com; do
            if ! grep -rql "$origin" "$js_glob"/*.js; then
              echo "::error::Expected origin '$origin' not found in $js_glob/*.js — stale env baked into the export?" >&2
              exit 1
            fi
            echo "ok: found '$origin' in the emitted bundles"
          done

          # Sentry: match the DSN's ingest host, not the whole DSN, so the log
          # never echoes the key portion.
          if ! grep -rql "o4510644927660032.ingest.us.sentry.io" "$js_glob"/*.js; then
            echo "::error::Sentry DSN not baked into the export — app.boardsesh.com would ship with no crash reporting." >&2
            exit 1
          fi
          echo "ok: found the Sentry ingest host in the emitted bundles"

          if [ -z "${POSTHOG_KEY:-}" ]; then
            echo "::error::vars.NEXT_PUBLIC_POSTHOG_KEY is unset — the export would ship with analytics disabled." >&2
            exit 1
          fi
          if ! grep -rql "$POSTHOG_KEY" "$js_glob"/*.js; then
            echo "::error::PostHog key not baked into the export — app.boardsesh.com would ship with no analytics." >&2
            exit 1
          fi
          echo "ok: found the PostHog key in the emitted bundles"

          if ! grep -rql "production-web" "$js_glob"/*.js; then
            echo "::error::EXPO_PUBLIC_SENTRY_ENVIRONMENT not baked in — app events would be indistinguishable from the native fleet." >&2
            exit 1
          fi
          echo "ok: found the production-web environment tag in the emitted bundles"

      - name: Add Cloudflare Pages host config to the export
        # _redirects (SPA fallback) + _headers (noindex/caching/no-CSP) are host
        # config, not part of the export. Copy them into the publish dir.
        run: |
          set -euo pipefail
          cp deploy/app-subdomain/_redirects   "$RUNNER_TEMP/app-standalone/_redirects"
          cp deploy/app-subdomain/_headers     "$RUNNER_TEMP/app-standalone/_headers"
          # _routes.json scopes the Function below to the three asset prefixes,
          # so the shell and every SPA route stay pure static assets.
          cp deploy/app-subdomain/_routes.json "$RUNNER_TEMP/app-standalone/_routes.json"
          # Pages discovers `functions/` relative to wrangler's cwd and requires
          # it to sit OUTSIDE the static root — put it beside the export, and
          # publish with `--cwd "$RUNNER_TEMP"` so wrangler finds it there.
          cp -R deploy/app-subdomain/functions "$RUNNER_TEMP/functions"

      # Needs Account.Cloudflare Pages Edit on the shared Production-environment
      # token. It is the same secret deploy-cloudflare uses for the zone, so a
      # rotation that grants only the zone scopes lands here as
      # `Authentication error [code: 10000]` while `wrangler whoami` still works.
      # See the token section of docs/cloudflare.md.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          vp dlx wrangler@4 pages deploy "$RUNNER_TEMP/app-standalone" \
            --cwd "$RUNNER_TEMP" \
            --project-name=boardsesh-app \
            --branch=main

      - name: Post-deploy smoke against app.boardsesh.com
        # Cloudflare's edge can lag a few seconds behind a fresh deploy, so each
        # check retries a short propagation loop. Verifies: root serves the HTML
        # shell, a deep route SPA-falls back to the shell, a content-hashed asset
        # is immutable-cached, index.html is NOT immutable, noindex is present,
        # and the WASM binary serves with a wasm/octet content type.
        run: |
          set -uo pipefail
          base=https://app.boardsesh.com

          # Retry a curl assertion for up to ~60s of edge propagation.
          retry() {
            local desc="$1"; shift
            for attempt in $(seq 1 12); do
              if "$@"; then
                echo "ok: $desc"
                return 0
              fi
              echo "  ($desc) attempt $attempt failed; retrying in 5s..."
              sleep 5
            done
            echo "::error::post-deploy smoke failed: $desc" >&2
            return 1
          }

          check_root() {
            local out; out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$base/")
            echo "$out" | grep -q '^200 ' && echo "$out" | grep -qi 'text/html'
          }

          check_deep_route() {
            # SPA fallback: a route with no real file must still 200 the shell.
            local code; code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/climbs")
            [ "$code" = "200" ]
          }

          check_noindex() {
            curl -sSI "$base/" | grep -qi '^x-robots-tag:.*noindex'
          }

          check_wasm() {
            local out; out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' \
              "$base/wasm/board_renderer_wasm_bg.wasm")
            echo "$out" | grep -q '^200 ' \
              && echo "$out" | grep -qiE 'application/(wasm|octet-stream)'
          }

          check_index_not_immutable() {
            # index.html must revalidate — no immutable cache directive.
            local cc; cc=$(curl -sSI "$base/index.html" | tr -d '\r' \
              | grep -i '^cache-control:' || true)
            ! echo "$cc" | grep -qi 'immutable'
          }

          # The entry chunk named by the served index.html must come back as real
          # JavaScript, immutable-cached.
          #
          # The content-type and body checks are the point, not decoration. This
          # used to assert only `immutable` off a HEAD, which cannot fail: when a
          # chunk is missing, `_redirects`' `/* /index.html 200` answers the .js
          # URL with the HTML shell, and `_headers`' `/_expo/*` rule stamps
          # `immutable` on it by path — so a chunk that does not exist passed this
          # check. The browser is stricter than the smoke was: `nosniff` + a
          # `text/html` script means Chrome refuses to execute it, React never
          # mounts, and #root stays empty with no console error to explain it.
          # That is the exact silent failure this now catches, one step earlier
          # and with a message that says which part was wrong.
          check_entry_chunk_is_js() {
            local asset_path
            asset_path=$(curl -sS --max-time 20 "$base/" \
              | grep -oE '/_expo/static/[^"'"'"']+\.js' | head -n1)
            [ -n "$asset_path" ] || { echo "  no /_expo asset found in index.html"; return 1; }

            local head; head=$(curl -sSI --max-time 20 "$base$asset_path" | tr -d '\r')
            echo "$head" | grep -qiE '^content-type:.*javascript' || {
              echo "  $asset_path"
              echo "    status:       $(echo "$head" | head -n1 || echo '(none)')"
              echo "    content-type: $(echo "$head" | grep -i '^content-type:' || echo '(none)')"
              echo "  the entry chunk index.html names is not being served as JavaScript."
              echo "  404 → the chunk is missing from the deployment (or has not propagated yet)."
              echo "  text/html → the SPA fallback answered it, which also means the asset-404"
              echo "    Function is not in the path; see deploy/app-subdomain/functions/_middleware.ts."
              return 1
            }
            echo "$head" | grep -qi '^cache-control:.*immutable' || {
              echo "  $asset_path is not immutable-cached: $(echo "$head" | grep -i '^cache-control:' || echo '(none)')"
              return 1
            }

            # Read the start of the body too. Content-type can be right while the
            # body is the shell if a future header rule ever sets the type by
            # path as well.
            #
            # `head -c` closes the pipe once it has enough, so curl stops early
            # and this never pulls the whole ~10MB chunk. Curl then reports a
            # write failure, which is expected here and is why stderr is
            # dropped; a fetch that genuinely failed still arrives as an empty
            # `first` and is caught on the next line. Deliberately not a range
            # request: asset paths are served through a Pages Function now
            # (deploy/app-subdomain/functions/_middleware.ts), which does not
            # answer 206, so `-r` would silently read the whole body anyway.
            local first
            first=$(curl -sS --max-time 60 "$base$asset_path" 2>/dev/null | head -c 64) || true
            [ -n "$first" ] || { echo "  $asset_path body is empty"; return 1; }
            case "$first" in
              '<!doctype'*|'<!DOCTYPE'*|'<html'*)
                echo "  $asset_path served the HTML shell, not JavaScript"; return 1 ;;
            esac
          }

          check_manifest_link() {
            # The bug this guards (W-24, #4438): index.html asked for
            # /app/manifest.json, _redirects' `/* /index.html 200` answered it
            # with the SPA shell, and the browser silently got HTML where a
            # manifest belongs — no install prompt, console error every load,
            # HTTP 200 the whole way. scripts/lib/patch-expo-web-pwa-manifest.mjs
            # rewrites the href from the export's baseUrl; this is the
            # end-to-end proof it landed on the real deploy.
            # --max-time so an unreachable edge fails this attempt and lets the
            # retry loop above do its job, instead of hanging the release. The
            # sibling checks predate this and are left alone here on purpose.
            local href
            href=$(curl -sS --max-time 20 "$base/" \
              | grep -oE '<link[^>]*rel="manifest"[^>]*>' \
              | grep -oE 'href="[^"]+"' | head -n1 | cut -d'"' -f2)
            [ "$href" = "/manifest.json" ] || { echo "  manifest href is '$href', expected /manifest.json"; return 1; }
            local out; out=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{content_type}' "$base$href")
            echo "$out" | grep -q '^200 ' || { echo "  manifest fetch: $out"; return 1; }
            echo "$out" | grep -qi 'application/json' || { echo "  manifest content-type: $out"; return 1; }
            # Read the body too. The href and content-type can both be right
            # while start_url sits outside scope — a manifest that parses
            # cleanly and still never offers the install prompt.
            # Fetch and check the body separately, so a timed-out or empty
            # response reports as a fetch failure rather than a JSON parse
            # error from node — the retry loop handles both, but only one of
            # them tells you what actually went wrong.
            local body
            body=$(curl -sS --max-time 20 "$base$href") || { echo "  manifest body fetch failed"; return 1; }
            [ -n "$body" ] || { echo "  manifest body is empty"; return 1; }
            echo "$body" | node -e '
              const manifest = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              if (manifest.start_url !== "/" || manifest.scope !== "/") {
                console.error(`  manifest start_url is "${manifest.start_url}" and scope is "${manifest.scope}"; expected "/" for both`);
                process.exit(1);
              }
            '
          }

          retry "root / → 200 text/html"                 check_root
          retry "deep route /climbs → 200 (SPA shell)"    check_deep_route
          retry "X-Robots-Tag: noindex on /"              check_noindex
          retry "wasm binary → 200 wasm/octet-stream"     check_wasm
          retry "index.html is NOT immutable-cached"      check_index_not_immutable
          retry "entry chunk serves as immutable JavaScript"  check_entry_chunk_is_js
          retry "PWA manifest → JSON with start_url/scope /"  check_manifest_link

      - name: Install Playwright chromium
        run: cd packages/web && vp exec playwright install --with-deps chromium

      - name: Browser boot check against app.boardsesh.com
        # The curl smoke above proves the transport layer; it cannot prove the
        # bundle evaluates. A JS chunk can serve with perfect headers and still
        # throw on boot, and `_redirects`' `/* /index.html 200` means a missing
        # route answers 200 too. Both look healthy to curl and blank to a user.
        # This puts a real browser in front of the deploy and confirms React
        # mounted into #root. Read-only — it never signs in, and it runs under
        # playwright.production.config.ts, which declares no globalSetup.
        #
        # No rollback guard here, unlike the www smoke. Pages has no instant-
        # rollback signal to read; the subdomain's equivalent is the job-level
        # APP_WEB_DEPLOY_HOLD `if:` above, which skips this whole job — this
        # step included — so there is nothing left to guard at step level.
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://app.boardsesh.com
        run: cd packages/web && vp exec playwright test --config=playwright.production.config.ts

      # The config already writes a trace on retry and a screenshot on failure,
      # but nothing collected them, so a failed boot check left only the console
      # output to work from — which for a blank #root says "element(s) not found"
      # and nothing else. Keep them; this is the deploy that will need them.
      - name: Upload boot-check artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-boot-check-failure
          path: |
            packages/web/test-results/
            packages/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Homelab staging-backend deploy is currently broken — re-enable once the
  # self-hosted runner is healthy. It deploys the same :staging image and is
  # intentionally independent of the web build / prod migrate gate (it targets
  # the staging DB, not prod), so it only needs build-backend to succeed.
  #
  # deploy-staging-backend:
  #   needs: [detect-changes, build-backend]
  #   if: always() && needs.detect-changes.outputs.backend_changed == 'true' && needs.build-backend.result == 'success'
  #   runs-on: [self-hosted, homelab, ephemeral]
  #   steps:
  #     - name: Pull and restart staging backend
  #       run: |
  #         docker pull ghcr.io/boardsesh/boardsesh-daemon:staging
  #         cd /opt/branch-deploys && docker compose up -d --no-deps staging-backend
  #         echo "Waiting for staging backend to be healthy..."
  #         sleep 5
  #         docker ps --filter "name=staging-backend" --format "table {{.Names}}\t{{.Status}}"

  # Pings Discord when an app.boardsesh.com deploy was skipped by the freeze.
  # Without this the hold is invisible: a skipped job just shows grey in the run
  # summary, so a forgotten APP_WEB_DEPLOY_HOLD would quietly strand the
  # subdomain on an old bundle. No-ops if DISCORD_DEPLOY_WEBHOOK is unset.
  notify-app-web-held:
    needs: [detect-changes, sync-static-assets]
    if: always() && needs.detect-changes.outputs.app_changed == 'true' && (needs.sync-static-assets.result == 'success' || needs.sync-static-assets.result == 'skipped') && vars.APP_WEB_DEPLOY_HOLD != ''
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Notify Discord (app.boardsesh.com deploy held)
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          # URL wrapped in <…> so Discord suppresses the inline preview embed.
          CONTENT=$(printf '🧊 **app.boardsesh.com deploy held** on `%s`\nAPP_WEB_DEPLOY_HOLD is set, so this commit did NOT ship to the browser app. The subdomain stays on its current deployment.\nClear the `APP_WEB_DEPLOY_HOLD` repo variable and re-run to resume.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$RUN_URL")
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings.
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  # The www analogue of notify-app-web-held. WEB_DEPLOY_TARGETS=none builds and
  # pushes the image but deploys nowhere, and a skipped job is just grey in the
  # run summary — so a forgotten hold would silently strand www on an old build
  # while every merge looked fine. No-ops if DISCORD_DEPLOY_WEBHOOK is unset.
  notify-web-held:
    needs: [detect-changes, resolve-web-targets, build-web]
    if: >-
      always()
      && needs.detect-changes.outputs.web_changed == 'true'
      && needs.resolve-web-targets.outputs.web_targets == 'none'
      && needs.build-web.result == 'success'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Notify Discord (www deploy held)
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          IMAGE: ${{ needs.build-web.outputs.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          # URL wrapped in <…> so Discord suppresses the inline preview embed.
          CONTENT=$(printf '🧊 **www deploy held** on `%s` — WEB_DEPLOY_TARGETS=none; image %s:production pushed to GHCR, neither Vercel nor Railway deployed.\nSet WEB_DEPLOY_TARGETS back and re-run.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$IMAGE" "$RUN_URL")
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings.
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  # Pings Discord when a deploy ran during an active rollback: the release was
  # built and staged but NOT promoted, so production is still on the pinned
  # (rolled-back) deployment. No-ops if DISCORD_DEPLOY_WEBHOOK is unset.
  notify-no-promote:
    needs: [check-rollback, build-web, build-backend, deploy-web, deploy-production-backend, deploy-web-railway]
    if: >-
      always()
      && needs.check-rollback.outputs.active == 'true'
      && (needs.deploy-web.result == 'success' || needs.deploy-production-backend.result == 'success' ||
      needs.deploy-web-railway.result == 'success')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Notify Discord (deployed, not promoted)
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          WEB_URL: ${{ needs.deploy-web.outputs.url }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          WEB_RAILWAY_RESULT: ${{ needs.deploy-web-railway.result }}
          BACKEND_RESULT: ${{ needs.deploy-production-backend.result }}
          IMAGE: ${{ needs.build-backend.outputs.image }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          WEB_LINE="not built this run"
          if [ "$WEB_RESULT" = "success" ]; then
            WEB_LINE="staged, not on the production domain: ${WEB_URL:-see run log}"
          fi
          WEB_RAILWAY_SECTION=""
          if [ "$WEB_RAILWAY_RESULT" = "success" ]; then
            WEB_RAILWAY_SECTION=$(printf '\n• web (Railway): image %s:production in GHCR, Railway NOT redeployed' "$WEB_IMAGE")
          fi
          BACKEND_LINE="not built this run"
          if [ "$BACKEND_RESULT" = "success" ]; then
            BACKEND_LINE="image at ${IMAGE}:production in GHCR, Railway NOT redeployed"
          fi
          # URL is wrapped in <…> so Discord suppresses the inline preview embed
          # (otherwise the workflow link dominates the message).
          CONTENT=$(printf '⚠️ **Deployed but NOT promoted** on `%s`\nA Vercel Instant Rollback is active, so production stays pinned to the rolled-back deployment.\n• web: %s%s\n• backend: %s\nClear the rollback (revert the offending commit and re-promote), then promote the staged web deployment and redeploy the backend.\n<%s>' \
            "${COMMIT_SHA:0:7}" "$WEB_LINE" "$WEB_RAILWAY_SECTION" "$BACKEND_LINE" "$RUN_URL")
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings from
          # any text we splice in (commit messages, PR titles, etc.).
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  # Pings the Discord deploy channel when any job fails OR is cancelled. The
  # contains(needs.*.result, ...) form covers every job in `needs` automatically
  # — including check-rollback and detect-changes — so a silent no-op (e.g.
  # detect-changes erroring, or a cancelled mid-deploy) still alerts. No-ops if
  # the DISCORD_DEPLOY_WEBHOOK secret is unset.
  notify-failure:
    needs:
      [
        detect-changes,
        resolve-web-targets,
        check-rollback,
        sync-static-assets,
        build-web,
        build-backend,
        migrate,
        deploy-web,
        deploy-web-railway,
        deploy-production-backend,
        deploy-cloudflare,
        deploy-app-web,
      ]
    if: >-
      always()
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Notify Discord
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RESOLVE_WEB_TARGETS: ${{ needs.resolve-web-targets.result }}
          CHECK_ROLLBACK: ${{ needs.check-rollback.result }}
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          SYNC_STATIC_ASSETS: ${{ needs.sync-static-assets.result }}
          BUILD_WEB: ${{ needs.build-web.result }}
          BUILD_BACKEND: ${{ needs.build-backend.result }}
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY_WEB: ${{ needs.deploy-web.result }}
          DEPLOY_WEB_RAILWAY: ${{ needs.deploy-web-railway.result }}
          DEPLOY_BACKEND: ${{ needs.deploy-production-backend.result }}
          DEPLOY_CLOUDFLARE: ${{ needs.deploy-cloudflare.result }}
          DEPLOY_APP_WEB: ${{ needs.deploy-app-web.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi
          # URL wrapped in <…> so Discord suppresses the inline preview embed.
          CONTENT=$(printf '🚨 **Production deploy failed** on \`%s\`\n• detect-changes: %s\n• resolve-web-targets: %s\n• check-rollback: %s\n• sync-static-assets: %s\n• build-web: %s\n• build-backend: %s\n• migrate: %s\n• deploy-web: %s\n• deploy-web-railway: %s\n• deploy-production-backend: %s\n• deploy-cloudflare: %s\n• deploy-app-web: %s\n<%s>' \
            "${COMMIT_SHA:0:7}" "$DETECT_CHANGES" "$RESOLVE_WEB_TARGETS" "$CHECK_ROLLBACK" "$SYNC_STATIC_ASSETS" "$BUILD_WEB" "$BUILD_BACKEND" "$MIGRATE" "$DEPLOY_WEB" "$DEPLOY_WEB_RAILWAY" "$DEPLOY_BACKEND" "$DEPLOY_CLOUDFLARE" "$DEPLOY_APP_WEB" "$RUN_URL")
          # --fail-with-body surfaces Discord's status + error body (e.g. 429,
          # rotated webhook) in the log instead of failing silently. Don't let a
          # webhook hiccup fail the job — the alert is best-effort.
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings.
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"

  # Pings the Discord deploy channel after a successful, PROMOTED production
  # deploy. Lists the PRs that just shipped (parsed from merge-commit subjects
  # between the cumulative deployment baseline and github.sha). Fires only when no rollback
  # is pinning prod, nothing failed or got cancelled, and at least one
  # component actually deployed. No-ops if DISCORD_DEPLOY_WEBHOOK is unset.
  notify-success:
    needs:
      [
        check-rollback,
        detect-changes,
        resolve-web-targets,
        sync-static-assets,
        build-web,
        build-backend,
        migrate,
        deploy-web,
        deploy-web-railway,
        deploy-production-backend,
        deploy-cloudflare,
        deploy-app-web,
      ]
    # deploy-app-web is both a dependency and a success trigger: a mobile-only
    # push deploys app.boardsesh.com while deploy-web/backend skip, and without
    # it in the trigger list that deploy would ship with no Discord message at
    # all. Listing it in needs also stops the success ping racing ahead of an
    # app deploy that is still uploading.
    if: >-
      always()
      && needs.check-rollback.outputs.active != 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.deploy-web.result == 'success' || needs.deploy-web-railway.result == 'success' ||
      needs.deploy-production-backend.result == 'success' || needs.deploy-cloudflare.result == 'success' ||
      needs.deploy-app-web.result == 'success')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      # Need contents:read to fetch full history and pull-requests:read so
      # `gh api repos/.../pulls/N` can read titles. Default GITHUB_TOKEN on
      # push events already includes these, but pinning the job to the
      # minimum scope keeps it least-privileged.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The cumulative baseline may predate many canceled pending runs.
          # Full history guarantees the shipped-PR range is available.
          fetch-depth: 0

      - name: Notify Discord (deployed + promoted)
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          WEB_RAILWAY_RESULT: ${{ needs.deploy-web-railway.result }}
          # Which deployers this run was allowed to use, for the held line below.
          WEB_TARGETS: ${{ needs.resolve-web-targets.outputs.web_targets }}
          # Same read-off-what-ran rule as APP_WEB_HELD: both web deploy jobs
          # skipped while web_changed was true is the hold, and nothing else
          # produces that combination once a failure or cancellation has already
          # short-circuited this job.
          WEB_HELD: ${{ needs.deploy-web.result == 'skipped' && needs.deploy-web-railway.result == 'skipped' && needs.detect-changes.outputs.web_changed == 'true' }}
          BACKEND_RESULT: ${{ needs.deploy-production-backend.result }}
          CLOUDFLARE_RESULT: ${{ needs.deploy-cloudflare.result }}
          APP_WEB_RESULT: ${{ needs.deploy-app-web.result }}
          # A held deploy is a skip, which would otherwise print as "unchanged" —
          # the exact invisibility notify-app-web-held exists to prevent.
          #
          # Read off what deploy-app-web actually did, NOT by re-reading
          # vars.APP_WEB_DEPLOY_HOLD here. This job declares
          # `environment: Production`, so a step-level `vars.` lookup resolves
          # Production environment variables as well as repository ones, while
          # the gate on deploy-app-web is a job-level `if:` that only ever sees
          # repository variables. Re-reading would print "held" for a deploy that
          # actually shipped whenever an operator scoped the variable to the
          # environment — the worst-direction lie to hand an incident responder.
          # The hold is the only reason deploy-app-web skips while app_changed is
          # 'true'; a cancellation short-circuits this job via its own
          # `!contains(needs.*.result, 'cancelled')`. With no hold set the
          # expression renders "false" and the message is byte-identical to
          # before.
          APP_WEB_HELD: ${{ needs.deploy-app-web.result == 'skipped' && needs.detect-changes.outputs.app_changed == 'true' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ needs.detect-changes.outputs.deployment_base_sha }}
          PR_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/pull
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"
            exit 0
          fi

          # Names the deployer, because "deployed" means something different
          # depending on WEB_DEPLOY_TARGETS and an incident responder needs to
          # know which origin just changed. elif, not a second `if`: a hold must
          # never win over a deploy that demonstrably shipped.
          WEB_LINE="unchanged"
          if [ "$WEB_RESULT" = "success" ] && [ "$WEB_RAILWAY_RESULT" = "success" ]; then
            WEB_LINE="deployed (Vercel + Railway)"
          elif [ "$WEB_RESULT" = "success" ]; then
            WEB_LINE="deployed (Vercel)"
          elif [ "$WEB_RAILWAY_RESULT" = "success" ]; then
            WEB_LINE="deployed (Railway)"
          elif [ "$WEB_HELD" = "true" ]; then
            WEB_LINE="held (WEB_DEPLOY_TARGETS=${WEB_TARGETS:-none})"
          fi
          BACKEND_LINE="unchanged"
          if [ "$BACKEND_RESULT" = "success" ]; then BACKEND_LINE="deployed"; fi
          CLOUDFLARE_LINE="unchanged"
          if [ "$CLOUDFLARE_RESULT" = "success" ]; then CLOUDFLARE_LINE="applied"; fi
          # elif, not a second `if`: an override would let "held" win over a
          # deploy that demonstrably shipped, which is the inversion this line
          # exists to prevent.
          APP_WEB_LINE="unchanged"
          if [ "$APP_WEB_RESULT" = "success" ]; then
            APP_WEB_LINE="deployed"
          elif [ "$APP_WEB_HELD" = "true" ]; then
            APP_WEB_LINE="held (APP_WEB_DEPLOY_HOLD set)"
          fi

          # Pull PR numbers from merge-commit subjects in the exact cumulative
          # range used by change detection. Skip when a safe baseline was not
          # available (manual/full fallback) rather than guessing.
          PR_LIST=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            PR_NUMS=$(git log --format='%s' "${BEFORE_SHA}..${COMMIT_SHA}" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' | sort -un || true)
            while IFS= read -r PR; do
              # `|| continue` form is safe under `set -e`; `&& continue` can trip it.
              [ -n "$PR" ] || continue
              TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.title' 2>/dev/null || true)
              PR_URL="${PR_BASE_URL}/${PR}"
              if [ -n "$TITLE" ]; then
                LINE="• #${PR} — ${TITLE} <${PR_URL}>"
              else
                LINE="• #${PR} <${PR_URL}>"
              fi
              if [ -z "$PR_LIST" ]; then
                PR_LIST="$LINE"
              else
                PR_LIST="${PR_LIST}"$'\n'"${LINE}"
              fi
            done <<< "$PR_NUMS"
          fi

          SHIPPED_SECTION=""
          if [ -n "$PR_LIST" ]; then
            SHIPPED_SECTION=$(printf '\nShipped:\n%s' "$PR_LIST")
          fi

          # RUN_URL wrapped in <…> so Discord suppresses the inline preview embed.
          CONTENT=$(printf '✅ **Production deployed** on `%s`\n• web: %s\n• backend: %s\n• Cloudflare: %s\n• app.boardsesh.com: %s%s\n<%s>' \
            "${COMMIT_SHA:0:7}" "$WEB_LINE" "$BACKEND_LINE" "$CLOUDFLARE_LINE" "$APP_WEB_LINE" "$SHIPPED_SECTION" "$RUN_URL")
          # allowed_mentions.parse=[] blocks @everyone/@here/role/user pings —
          # critical here because PR titles flow straight into $content.
          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @- "$DISCORD_DEPLOY_WEBHOOK" || \
              echo "::warning::Failed to post Discord notification (see status above)"
