name: Validate Dev Database Docker Images

on:
  push:
    branches: [main]
    paths: &database_image_paths
      - 'packages/db/docker/**'
      # Only these scripts execute while constructing the seeded image. A
      # migration/admin utility elsewhere in packages/db/scripts must not spend
      # two runners rebuilding PostgreSQL images it cannot affect.
      - 'packages/db/scripts/create-test-user.ts'
      - 'packages/db/scripts/db-connection.ts'
      - 'packages/db/scripts/fixtures/**'
      - 'packages/db/scripts/load-board-snapshots.ts'
      - 'packages/db/scripts/migration-owner-role.integration.test.ts'
      - 'packages/db/scripts/migration-owner-role.test.ts'
      - 'packages/db/scripts/migration-owner-role.ts'
      - 'packages/db/scripts/migration-runtime-acl.ts'
      - 'packages/db/scripts/seed-playlist-climbs.ts'
      - 'packages/db/scripts/seed-social.ts'
      - 'packages/db/src/catalog-snapshot.ts'
      - 'packages/db/src/schema/**'
      - 'packages/db/drizzle/**'
      - 'packages/db/package.json'
      - 'packages/sync-runtime/**'
      - 'packages/shared-schema/**'
      - 'packages/board-constants/**'
      - '.github/workflows/dev-db-docker.yml'
      - '.github/workflows/postgres-image-publisher.yml'
      - 'scripts/dev-db-image-smoke.sh'
      - 'scripts/dev-db-up.sh'
      - 'scripts/lib/postgres-credentials.sh'
      - 'scripts/neon-to-railway-replication.sh'
      - 'scripts/neon-to-railway-replication.test.sh'
      - 'scripts/postgres-credentials.test.sh'
      - 'scripts/postgres18-architecture-smoke.sh'
      - 'scripts/postgres18-contract.sh'
      - 'scripts/postgres18-spatial-rehearsal.sh'
      - 'scripts/postgres18-spatial-surface.test.sh'
      - 'scripts/postgres16-role-transition-smoke.sh'
      - 'scripts/postgres18-image-smoke.sh'
      - 'scripts/postgres18-production-role-transition.sh'
      - 'scripts/postgres18-workflow-contract.test.sh'
      - 'scripts/postgres-migration-audit.sh'
      - 'scripts/postgres-migration-verify-data.sh'
      - 'scripts/postgres-owned-sequence-setvals.sql'
      - 'scripts/postgres-table-digests.sql'
  pull_request:
    paths: *database_image_paths

# Feature-branch code is deliberately limited to read-only validation. Image
# publication is defined by postgres-image-publisher.yml loaded from main.
permissions:
  contents: read

concurrency:
  group: dev-db-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-postgres-postgis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'

      - name: Validate PostgreSQL 18 migration and image contracts
        run: vp run test:postgres18-contract

      - name: Rehearse the restricted-role transition on PostgreSQL 16
        run: vp run test:postgres16-role-transition

      - name: Smoke-test native PostgreSQL 18 image
        run: vp run test:postgres18-image

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build ARM64 portable candidate locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: ./packages/db/docker
          file: ./packages/db/docker/Dockerfile.postgres
          platforms: linux/arm64
          load: true
          tags: boardsesh-postgres-postgis:arm64-smoke
          cache-from: type=gha,scope=postgres-postgis

      - name: Boot-test ARM64 PostgreSQL and extensions
        run: vp run test:postgres18-architecture-image boardsesh-postgres-postgis:arm64-smoke linux/arm64

  test-dev-db:
    needs: test-postgres-postgis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build seeded candidate locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: .
          file: ./packages/db/docker/Dockerfile.dev-db
          platforms: linux/amd64
          load: true
          tags: boardsesh-dev-db:candidate-smoke
          cache-from: type=gha,scope=dev-db

      - name: Smoke-test final seeded candidate
        run: vp run test:postgres18-dev-db-image boardsesh-dev-db:candidate-smoke
