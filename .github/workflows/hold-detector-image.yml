name: Hold Detector Image
on:
  pull_request:
    paths:
      - 'packages/hold-detector/**'
      - 'Dockerfile.hold-detector'
      - '.github/workflows/hold-detector-image.yml'
  push:
    branches: [main]
    paths:
      - 'packages/hold-detector/**'
      - 'packages/shared/hold-detection/**'
      - 'packages/shared/board-art-geometry/**'
      - 'packages/shared-schema/**'
      - 'packages/db/**'
      - 'Dockerfile.hold-detector'
      - 'scripts/create-service-docker-context.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/hold-detector-image.yml'
  workflow_dispatch:
concurrency:
  group: hold-detector-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate worker context
        run: node scripts/create-service-docker-context.mjs hold-detector
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .docker-context/hold-detector
          file: .docker-context/hold-detector/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/boardsesh/hold-detector:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/boardsesh/hold-detector:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/boardsesh/hold-detector:buildcache,mode=max' || '' }}
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/boardsesh/hold-detector
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
