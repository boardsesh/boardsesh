name: Android Production Release

# Releases one exact build already on the Play internal track to production.
# The default is a GET-only plan. With `apply` it writes the production track
# and commits it for review; Play review and managed publishing still decide
# when the build reaches phones. See docs/mobile-store-release.md.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Exact published internal versionCode to release to production'
        required: true
        type: string
      rollout_percent:
        description: 'Share of production users, 1-100 (100 completes the release)'
        required: true
        type: string
        default: '100'
      apply:
        description: 'Submit the production release for review; otherwise inspect the plan only'
        type: boolean
        default: false

permissions:
  contents: read

# Serialize with native uploads and beta promotion across both release branches.
concurrency:
  group: android-apk-rn
  cancel-in-progress: false
  # Queue behind release-train builds instead of being replaced by the next
  # one; android-apk-rn.yml explains why the shared group queues.
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    # Shared with the store-draft workflow's Android job, the merge-back submission
    # (mobile-store-submit.yml) and the Play listing push. Without it, a draft run
    # can read the build as "still a draft" just before this job releases it, then
    # write a second production draft over the top (#6524, 2026-10-18). Queued, so
    # a pending release is never replaced by another member's run.
    concurrency:
      group: play-production-track
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Test production release guards
        run: vp test run scripts/__tests__/mobile-store-android-production.test.ts --reporter=agent
      - name: Require the production build to have merged into main
        if: inputs.apply
        env:
          SUBMISSION_PLATFORM: android
          SUBMISSION_BUILD_NUMBER: ${{ inputs.version_code }}
        run: |
          git fetch --no-tags origin main
          node --experimental-strip-types scripts/mobile-store-submission-guard.ts
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: fastlane
      - name: Install fastlane gems
        working-directory: fastlane
        run: |
          bundle config set --local path "$PWD/vendor/bundle"
          bundle config set --local deployment true
          bundle install --jobs 4
      - name: Plan or submit the exact production build
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ inputs.version_code }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          APPLY: ${{ inputs.apply }}
        run: >-
          bundle exec fastlane android production
          version_code:"$VERSION_CODE" rollout:"$ROLLOUT_PERCENT" apply:"$APPLY"
