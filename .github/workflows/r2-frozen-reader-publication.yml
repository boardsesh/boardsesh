name: R2 Frozen Reader Publication
run-name: R2 frozen ${{ inputs.platform }} reader (${{ inputs.dry_run && 'dry run' || 'production' }})

# One immutable, already deployed production source. Never publish current native code under
# an old fingerprint. Retire only after issue #5912 acceptance and retention.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Shipped platform to validate or publish
        type: choice
        options: [ios, android]
        required: true
      dry_run:
        description: Validate the cold export without publishing
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: mobile-ota-production
  cancel-in-progress: false
  queue: max
env:
  EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
  EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
  EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
  EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
  EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
  EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://snapshots.boardsesh.com/board-snapshots/v1-gzip
  EXPO_UPDATES_URL: https://updates.boardsesh.com/manifest
  EXPO_PUBLIC_USE_RN_FETCH: '1'

jobs:
  reject_non_main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the reviewed default branch
        run: |
          echo '::error::Dispatch this guarded workflow from main.'
          exit 1
  reader:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed guard tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout immutable deployed production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 6cab8437bb7875e3a84ea228365c344428a6ca3c
          path: frozen
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: true
      - name: Install guard dependencies
        run: vp install --frozen-lockfile
      - name: Install shipped dependencies
        working-directory: frozen
        run: vp install --frozen-lockfile
      - name: Prepare public bundle environment and isolated cache
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/r2-reader-cache" "$RUNNER_TEMP/r2-reader-proof"
          echo "TMPDIR=$RUNNER_TEMP/r2-reader-cache" >> "$GITHUB_ENV"
          echo "R2_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # Only original public fields are written; no publishing credential.
          public_keys=(EXPO_PUBLIC_BACKEND_URL EXPO_PUBLIC_WS_URL EXPO_PUBLIC_WEB_URL
            EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_POSTHOG_KEY EXPO_PUBLIC_SNAPSHOT_BASE_URL EXPO_PUBLIC_USE_RN_FETCH)
          for public_key in "${public_keys[@]}"; do
            printf '%s=%s\n' "$public_key" "${!public_key}"
          done > frozen/packages/mobile/.env
          test "$PLATFORM" = ios || test "$PLATFORM" = android
      - name: Resolve both shipped fingerprints twice on Linux
        working-directory: frozen/packages/mobile
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            ios_runtime="$(env -u GOOGLE_MAPS_API_KEY vp exec expo-updates runtimeversion:resolve --platform ios | jq -er '.runtimeVersion')"
            android_runtime="$(vp exec expo-updates runtimeversion:resolve --platform android | jq -er '.runtimeVersion')"
            test "$ios_runtime" = c2643067d9b4f56009900f1954305ca73ea799d1
            test "$android_runtime" = 04b545294d879a2a9d1fb2ac46a807d3175b39d6
          done
      - name: Check installed Sentry uploader before credentials
        working-directory: frozen
        run: vp exec node --import tsx --input-type=module --eval 'import * as tools from "./scripts/mobile-upload-sourcemaps.ts"; (tools.default ?? tools).resolveInstalledSentryUploader("packages/mobile");'
      - name: Cold export the selected reader without publish credentials
        working-directory: frozen/packages/mobile
        env:
          PLATFORM: ${{ inputs.platform }}
          GOOGLE_MAPS_API_KEY: ${{ inputs.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: vp exec expo export --platform "$PLATFORM" --clear --dump-sourcemap --output-dir dist
      - name: Require compiled R2 reader and unchanged deployed production source
        env:
          PLATFORM: ${{ inputs.platform }}
          GOOGLE_MAPS_API_KEY: ${{ inputs.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: vp exec tsx scripts/r2-frozen-reader.ts export frozen "$PLATFORM" frozen/packages/mobile/dist "$RUNNER_TEMP/r2-reader-proof/cold-export.json"
      - name: Resolve selected fingerprint again after cold export
        working-directory: frozen/packages/mobile
        env:
          PLATFORM: ${{ inputs.platform }}
          GOOGLE_MAPS_API_KEY: ${{ inputs.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: |
          set -euo pipefail
          runtime="$(vp exec expo-updates runtimeversion:resolve --platform "$PLATFORM" | jq -er '.runtimeVersion')"
          case "$PLATFORM" in
            ios) test "$runtime" = c2643067d9b4f56009900f1954305ca73ea799d1 ;;
            android) test "$runtime" = 04b545294d879a2a9d1fb2ac46a807d3175b39d6 ;;
          esac
      - name: Publish the validated shipped reader
        if: ${{ !inputs.dry_run }}
        working-directory: frozen
        env:
          PLATFORM: ${{ inputs.platform }}
          GOOGLE_MAPS_API_KEY: ${{ inputs.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
          EOO_TOKEN: ${{ secrets.EOO_TOKEN }}
        run: vp run mobile:publish -- --channel production --platform "$PLATFORM" --message 'R2 snapshot reader for shipped 2.6 cohort'
      - name: Require actual publisher export to contain R2
        if: ${{ !inputs.dry_run }}
        env:
          PLATFORM: ${{ inputs.platform }}
          GOOGLE_MAPS_API_KEY: ${{ inputs.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: vp exec tsx scripts/r2-frozen-reader.ts export frozen "$PLATFORM" frozen/packages/mobile/dist "$RUNNER_TEMP/r2-reader-proof/published-export.json"
      - name: Upload the actual published source maps
        if: ${{ !inputs.dry_run }}
        working-directory: frozen
        env:
          PLATFORM: ${{ inputs.platform }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: vp run mobile:upload-sourcemaps -- --platform "$PLATFORM"
      - name: Verify new signed production update and every private R2 asset
        if: ${{ !inputs.dry_run }}
        env:
          PLATFORM: ${{ inputs.platform }}
          GOOGLE_MAPS_API_KEY: ${{ inputs.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: vp exec tsx scripts/r2-frozen-reader.ts delivery frozen "$PLATFORM" frozen/packages/mobile/dist "$RUNNER_TEMP/r2-reader-proof/production-delivery.json" "$R2_STARTED_AT"
      - name: Preserve public acceptance receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2-frozen-reader-${{ inputs.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/r2-reader-proof/*.json
          retention-days: 7
          if-no-files-found: error
