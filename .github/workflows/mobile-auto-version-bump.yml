name: Mobile Release Anchor

# Runs on a schedule (and on demand) to react to exact App Store Connect and
# Google Play production approvals. It cuts one release/<platform>-v<version>-<shortfp>
# anchor at the build-* tag for each accepted binary. Because an accepted store
# binary is frozen forever, the anchor permanently records the fingerprint an OTA
# must resolve to reach that release. See docs/mobile-ota-updates.md and
# scripts/mobile-cut-release-tags.ts.
#
# NO automatic marketing-version bump. We tried auto-bumping the patch on main the
# moment App Store Connect reported a version accepted, on the theory that anchoring
# only APPROVED (immutable) fingerprints made the resulting fingerprint churn safe.
# That was wrong: bumping the version on main busts the fingerprint of the binary
# ALREADY in the field, and "accepted" is not "adopted" — the vast majority of installs
# are still on the previous store binary until they update. So the bump stranded every
# current install's OTA (production publishes resolved a fingerprint no shipped binary
# embeds). Version bumps are a manual decision, made alongside the native build that
# ships them. This workflow only anchors; it never writes to app.config or pushes to main.

on:
  schedule:
    # Every 6h so an approval is anchored without waiting for a manual run.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log which release anchor tags would be cut, without tagging or pushing'
        type: boolean
        default: true

concurrency:
  group: mobile-release-anchor
  cancel-in-progress: false

jobs:
  anchor-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Release anchoring and native builds share Production so they query the
    # stores with the same credential set.
    environment: Production
    permissions:
      contents: read # release/* tags are pushed only with the repository App token
    steps:
      # Mint a token for the GitHub App that is in main's tag-push allowlist.
      # The checkout action persists this in git's credential store so the
      # anchor step's tag push authenticates as the app.
      - name: Mint push token
        id: push_token
        if: vars.OTA_PUSH_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OTA_PUSH_APP_ID }}
          private-key: ${{ secrets.OTA_PUSH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history + tags: the anchor step reads the build-<platform>-* tags
          # and resolves the commits they point at.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.push_token.outputs.token || github.token }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true

      # mobile-cut-release-tags.ts imports an extensionless local module, so use
      # the installed tsx loader instead of Node's dependency-free type stripping.
      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Query exact accepted store builds
        id: accepted
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node --import tsx scripts/mobile-auto-version-bump.ts

      # Cut release/<platform>-v<version>-<shortfp> anchors for every exact
      # accepted build (independent of whether the CURRENT version is accepted —
      # an older accepted build may still be unanchored). Idempotent across re-runs.
      # Uses the checkout's persisted token to push the tags. dry_run gates the push.
      #
      # continue-on-error: a transient tag-push failure for an old release must not
      # fail the run — accepted builds are re-anchored on the next scheduled run.
      # Skipped when there are no accepted builds (accepted_builds is '[]' or unset),
      # so it doesn't run for nothing.
      - name: Cut release anchor tags for accepted builds
        id: anchor
        if: steps.accepted.outputs.accepted_builds != '' && steps.accepted.outputs.accepted_builds != '[]'
        continue-on-error: true
        env:
          ACCEPTED_BUILDS: ${{ steps.accepted.outputs.accepted_builds }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          git config user.name "boardsesh-repo-bot[bot]"
          git config user.email "boardsesh-repo-bot[bot]@users.noreply.github.com"
          node --import tsx scripts/mobile-cut-release-tags.ts

      # Surface an anchor-cut failure loudly. continue-on-error keeps it from
      # blocking the run, but a persistent failure (e.g. a tag-push permission
      # error) would otherwise be easy to miss — accepted builds are re-anchored
      # next run, so this is a signal to investigate, not a hard failure.
      - name: Warn if anchoring failed
        if: steps.anchor.outcome == 'failure'
        run: echo "::warning::Cutting release anchor tags failed (see the step above). Accepted builds are re-anchored on the next scheduled run; investigate if this persists."
