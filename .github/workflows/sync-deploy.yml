name: Sync Daemons Deploy

# Builds the combined sync image (kilter + aurora + moonboard CLIs) and publishes
# it to GHCR on push to main. Independent of production-deploy: this image is
# pulled by whatever runs the sync daemons (the homelab boardsesh-sync host), and
# the daemon/CLI to run is chosen by the container `command:`, not baked in.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.sync'
      - 'scripts/create-service-docker-context.mjs'
      - 'vite.config.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/sync-deploy.yml'
  workflow_dispatch:

concurrency:
  group: sync-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: boardsesh-sync

jobs:
  build-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v6

      # No setup-vp. This job's only `vp` use was `vp run docker-context:sync`,
      # and that task is literally the node command below — a script importing
      # node: builtins only. Restoring the vp toolchain cost ~35s for nothing.

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # Same digest gets all of these tags. The homelab compose pins :production;
          # :sha-<short> is for pinning/rollback.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=production,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate sync Docker context
        run: node scripts/create-service-docker-context.mjs sync

      - name: Build and push sync image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .docker-context/sync
          file: .docker-context/sync/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache on GHCR, not `type=gha` — same reasoning as
          # production-deploy.yml's build-backend, and the same image shape
          # (a ~843 MB dependency layer in a single-stage image). `sync-main`
          # was one of only two buildkit scopes ever written; between them they
          # held 5.91 GB of a repo cache measured at 36.45 GB against GitHub's
          # 10 GB ceiling, so it missed almost every build while evicting the
          # mobile caches. The ref is a tag on the same image repository so a
          # cached layer that is also an image layer is not uploaded twice.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
