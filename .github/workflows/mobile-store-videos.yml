name: Mobile Store Videos

# Phase 0: dispatch-only MoonBoard measurement. No R2 or store writes.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: store-videos-measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_USE_RN_FETCH: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Compute screenshot app cache key
        id: appkey
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-screenshot-sim-app-v1-${{ hashFiles('packages/mobile/app.config.ts', 'packages/mobile/react-native.config.js', 'packages/mobile/plugins/**', 'packages/mobile/modules/**', 'packages/mobile/locales/**', 'packages/mobile/package.json', 'patches/**', 'package.json', 'pnpm-workspace.yaml', 'scripts/mobile-build-sim-app.ts', 'scripts/screenshot-sim.entitlements') }}" >> "$GITHUB_OUTPUT"
      - name: Restore screenshot dev-client
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
      - name: Build dev-client on cache miss
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: vp exec tsx scripts/store-video-measure.ts build metrics/build.json -- vp run mobile:build-sim-app -- --app-out packages/mobile/.app-cache --clean
      - name: Save screenshot dev-client
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/mobile/.app-cache
          key: ${{ steps.appkey.outputs.key }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Maestro and ffmpeg
        env:
          MAESTRO_VERSION: 2.6.1
          MAESTRO_SHA256: 3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "$HOME/.maestro-dist/maestro/bin" >> "$GITHUB_PATH"
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Record MoonBoard in four locales
        env:
          SCREENSHOT_USER_EMAIL: ${{ secrets.SCREENSHOT_USER_EMAIL }}
          SCREENSHOT_USER_PASSWORD: ${{ secrets.SCREENSHOT_USER_PASSWORD }}
        run: |
          set -euo pipefail
          vp exec tsx scripts/store-video-measure.ts record metrics/record.json -- vp run video:record -- --kind moonboard --locales all --app-path packages/mobile/.app-cache/Boardsesh.app
      - name: Hand off frames for one day
        uses: actions/upload-artifact@v4
        with:
          name: store-video-frames-moonboard
          path: .boardsesh/showcase-video/work/boards/moonboard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain measurement and debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-video-record-metrics
          path: |
            metrics/
            .boardsesh/showcase-video/work/logs/
          include-hidden-files: true
          retention-days: 7

  render:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install Chromium and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          vp exec playwright install --with-deps chromium
        working-directory: packages/web
      - uses: actions/download-artifact@v4
        with:
          name: store-video-frames-moonboard
          path: .boardsesh/showcase-video/work/boards/moonboard
      - name: Render and validate four Apple search videos
        run: |
          set -euo pipefail
          for locale in en-US es fr de; do
            vp exec tsx scripts/store-video-measure.ts "render-$locale" "metrics/render-$locale.json" -- vp run video:render -- --target store-search --variant moonboard --locale "$locale"
          done
          test "$(find .boardsesh/app-store-creatives/moonboard -name search-results.mp4 | wc -l)" -eq 4
      - name: Retain four validated videos, posters and provenance
        uses: actions/upload-artifact@v4
        with:
          name: store-videos-moonboard
          path: .boardsesh/app-store-creatives/moonboard
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain render measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-video-render-metrics
          path: metrics/
          retention-days: 7

  timings:
    if: always()
    needs: [record, render]
    runs-on: ubuntu-latest
    steps:
      - name: Collect per-step minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > steps.json
          jq -r '["| Job | Step | Minutes | Result |", "| --- | --- | ---: | --- |"], (.[] .jobs[] | .name as $job | .steps[] | select(.started_at != null and .completed_at != null) | ["| \($job) | \(.name) | \((((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 * 100 | round) / 100) | \(.conclusion) |"] ) | .[]' steps.json | tee timings.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: store-video-step-timings
          path: |
            timings.md
            steps.json
          retention-days: 14
