name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab. Every workflow this one
  # replaced (test.yml, backend-*, mobile-*, moonboard-ocr-*) had
  # workflow_dispatch; preserve that on-demand capability.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs (we don't care about results for an older
  # commit on the same branch). On main, never cancel — every commit needs
  # its own CI record so regressions can be bisected.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      anyJs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.anyJs }}
      web: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.web }}
      backend: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.backend }}
      mobile: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.mobile }}
      ocr: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ocr }}
      sharedDeps: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.sharedDeps }}
      sharedSchema: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.sharedSchema }}
      i18nCatalogs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.i18nCatalogs }}
      rootCi: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rootCi }}
      # PR-only guard signal: did this PR edit the OTA-owned changelog data file?
      # Defaults false off PRs (the OTA bot legitimately rewrites it on push).
      changelogData: ${{ github.event_name == 'pull_request' && steps.filter.outputs.changelogData || 'false' }}
      # True if any downstream job's gate would fire. setup gates on this so
      # docs-only / firmware-only PRs skip the bun-install + build:db pass
      # nothing downstream would consume. Must mirror the union of every
      # downstream `if:` — sharedDeps/sharedSchema in particular cover
      # non-JS files (SQL migrations under packages/db, .graphql under
      # shared-schema) that wouldn't trigger anyJs but still need setup so
      # test-backend / mobile-bundle / codegen-drift can run.
      runAny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.anyJs == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.i18nCatalogs == 'true' || steps.filter.outputs.sharedSchema == 'true' || steps.filter.outputs.sharedDeps == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.ocr == 'true' || steps.filter.outputs.rootCi == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            anyJs:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '!packages/board-controller/**'
              - '!embedded/**'
            web:
              - 'packages/web/**'
            backend:
              - 'packages/backend/**'
            mobile:
              - 'packages/mobile/**'
            ocr:
              - 'packages/moonboard-ocr/**'
            sharedDeps:
              # packages/shared/** gates test-backend (and mobile-bundle). The
              # backend test project includes the queue-client integration suite
              # (packages/backend/src/__tests__/queue-client-session.test.ts),
              # which drives the real @boardsesh/queue, queue-react, queue-runtime
              # and graphql-client code against a live server. A change to any of
              # those must run the backend suite — keep this glob at
              # packages/shared/**; if you narrow it, re-home that coverage onto
              # an explicit per-package gate for test-backend.
              - 'packages/shared/**'
              - 'packages/shared-schema/**'
              - 'packages/db/**'
              - 'packages/board-constants/**'
              - 'packages/crypto/**'
              - 'packages/aurora-sync/**'
              - 'packages/kilter-sync/**'
              - 'packages/location-sync/**'
              - 'packages/moonboard-sync/**'
              - 'packages/sync-runtime/**'
            sharedSchema:
              - 'packages/shared-schema/**'
              - 'packages/shared/graphql/**'
            i18nCatalogs:
              - 'packages/web/i18n/locales/**'
            rootCi:
              - '.github/workflows/ci.yml'
              - 'vite.config.ts'
              - 'package.json'
              - 'bun.lock'
            changelogData:
              - 'packages/mobile/src/data/changelog.generated.json'
              - 'CHANGELOG.md'

  setup:
    needs: [changes]
    if: needs.changes.outputs.runAny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build shared packages
        run: vp run build:db
      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: |
            packages/shared-schema/dist
            packages/db/dist
          retention-days: 1

  lint:
    needs: [changes, setup]
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      - name: Lint changed files (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Match the staged-hook scope in root vite.config.ts: TS/JS files,
          # excluding generated/, board-controller, and embedded firmware sources.
          # xargs -r ensures no-op on empty input.
          git diff --name-only --diff-filter=ACMR \
            "origin/$BASE_REF...HEAD" \
            -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' \
            | grep -vE '(/node_modules/|/generated/|^packages/board-controller/|^embedded/)' \
            > changed-lintable.txt || true
          if [ -s changed-lintable.txt ]; then
            xargs -r vp check < changed-lintable.txt
          else
            echo "No lintable files changed."
          fi
      - name: Lint full repo (main)
        if: github.event_name != 'pull_request'
        # vp/Vite+ panics with "failed printing to stdout: Resource temporarily
        # unavailable (os error 11)" when it flushes the full-repo warning list to the
        # runner's non-blocking stdout. Write to a regular file (never EAGAIN), then
        # echo it back, preserving vp's real exit code so errors still fail the job.
        run: |
          vp check > vp-check.log 2>&1 && status=0 || status=$?
          cat vp-check.log || true
          exit $status

  large-files:
    # Guards against committed binary churn (screenshots, build outputs, vendored
    # binaries) re-bloating the pack after the 2026 history cleanup. Runs on every
    # PR regardless of which file types changed — a binary-only PR is exactly the
    # case to catch — so it is deliberately not gated on the `changes` filter.
    # Dependency-free (bare node), so no bun install / build artifacts needed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Unit-test the guard
        run: node --test scripts/check-large-files.test.mjs
      - name: Check for oversized new files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-large-files.mjs
          else
            node scripts/check-large-files.mjs --all
          fi

  typecheck:
    needs: [changes, setup]
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      # `vp run typecheck` walks the dependsOn graph defined in root
      # vite.config.ts and uses vp's task cache — unchanged packages skip via
      # cache hits, so this is fast on small PRs even though it expresses the
      # full set.
      - name: Typecheck (cache-driven affected)
        run: vp run typecheck

  codegen-drift:
    needs: [changes, setup]
    # codegen.ts pulls GraphQL documents from packages/web/app/**/*.{ts,tsx}
    # in addition to the schema + shared/graphql, so a web-only PR that edits
    # a gql tag can drift the generated client. Include `web` in the gate.
    if: needs.changes.outputs.sharedSchema == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      - name: Regenerate GraphQL types
        run: vp run codegen
      - name: Verify committed output matches
        run: |
          if ! git diff --exit-code -- \
              packages/shared-schema/src/generated \
              packages/shared/graphql/src/generated \
              packages/web/app/lib/graphql/generated; then
            echo "::error::Generated GraphQL files are out of date. Run 'vp run codegen' locally and commit the result."
            exit 1
          fi

  i18n:
    needs: [changes, setup]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.i18nCatalogs == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      - name: Check hardcoded user-facing strings
        run: vp run check:i18n
      - name: Check orphaned i18n keys
        run: vp run check:i18n:orphans

  test-default:
    needs: [changes, setup]
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      # Run every project EXCEPT the two with dedicated infra-bearing jobs
      # (`backend`: postgres+redis; `moonboard-ocr`: canvas libs) as an explicit
      # POSITIVE `--project` list. Negation (`--project '!backend'`) does NOT
      # hold up under `--changed`: Vitest collects test files from the diff and
      # that spec set drives project init / globalSetup BEFORE the negation
      # applies, so a diff touching anything `backend` imports pulls its
      # Postgres-connecting tests into this infra-less job and they fail. A
      # project absent from a positive list is never loaded. The list is derived
      # from root vite.config.ts's `test.projects` (see the script) so new
      # packages are picked up automatically and can't be silently skipped.
      - name: Run tests
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p test-results
          # $PROJECTS is intentionally UNQUOTED in the two `vp test run` calls
          # below so the shell word-splits it into separate `--project=<name>`
          # flags. Do NOT quote it. (Safe: project names are bare identifiers.)
          PROJECTS="$(node --import tsx scripts/ci-test-default-projects.ts)"
          echo "test-default projects: $PROJECTS"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            vp test run --changed "origin/$BASE_REF" $PROJECTS \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./test-results/junit-default.xml
          else
            vp test run $PROJECTS \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./test-results/junit-default.xml
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-default
          path: test-results/junit-default.xml
          retention-days: 7

  test-backend:
    needs: [changes, setup]
    # Gated on `sharedDeps` (packages/shared/**) as well as `backend`: the backend
    # test project drives the queue-client integration suite against the real
    # @boardsesh/queue* packages, so a change to those must run it. See the
    # sharedDeps filter note in the `changes` job before narrowing that gate.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.sharedDeps == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # On main, split into 2 shards; on PR, run as a single shard (the
      # affected subset is usually small enough that sharding adds overhead).
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"shard":1,"total":2},{"shard":2,"total":2}]' || '[{"shard":1,"total":1}]') }}
    services:
      postgres:
        image: ghcr.io/boardsesh/boardsesh-postgres-postgis:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boardsesh_backend_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      # Warn (don't fail) when shared Drizzle schema changed without a matching
      # edit to the hand-maintained test DDL. Mirrors backend-tests.yml.
      - name: Check for test schema drift
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_SHA" || true
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          if echo "$changed" | grep -qE '^packages/db/src/schema/'; then
            if ! echo "$changed" | grep -qE '^packages/backend/src/__tests__/schema-sql\.ts$'; then
              echo "::warning title=Test schema may be stale::packages/db/src/schema/ changed but packages/backend/src/__tests__/schema-sql.ts was not. If your change added/removed columns the backend tests care about, mirror it there too."
            fi
          fi
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      - name: Run backend tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/boardsesh_backend_test
          REDIS_URL: redis://localhost:6380
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p packages/backend/test-results
          if [ "$EVENT_NAME" = "pull_request" ]; then
            vp test run --project backend --changed "origin/$BASE_REF" \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/backend/test-results/junit-backend-${{ matrix.shard }}.xml
          else
            vp test run --project backend \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/backend/test-results/junit-backend-${{ matrix.shard }}.xml
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend-${{ matrix.shard }}
          path: packages/backend/test-results/junit-backend-${{ matrix.shard }}.xml
          retention-days: 7

  test-ocr:
    needs: [changes, setup]
    # Include sharedDeps so OCR tests rerun when a shared package they
    # depend on changes (e.g. shared-schema, board-constants). Mirrors how
    # test-backend and mobile-bundle already gate on sharedDeps.
    if: needs.changes.outputs.ocr == 'true' || needs.changes.outputs.sharedDeps == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - name: Install canvas system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      - name: Run OCR tests
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p packages/moonboard-ocr/test-results
          if [ "$EVENT_NAME" = "pull_request" ]; then
            vp test run --project moonboard-ocr --changed "origin/$BASE_REF" \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/moonboard-ocr/test-results/junit-ocr.xml
          else
            vp test run --project moonboard-ocr \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/moonboard-ocr/test-results/junit-ocr.xml
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ocr
          path: packages/moonboard-ocr/test-results/junit-ocr.xml
          retention-days: 7

  mobile-bundle:
    needs: [changes, setup]
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.sharedDeps == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check mobile board art stays bundled
        run: vp run check:mobile-board-art-network
      # Catches iOS bundle-phase dep-resolution breaks (e.g. a transitive-only
      # @sentry/cli unresolvable from packages/mobile under Bun's isolated
      # linker) here on Linux, instead of in the macOS TestFlight archive on
      # push-to-main. Runs before the heavier Metro bundle so it fails fast.
      - name: Check native build-phase deps resolve
        run: vp run check:mobile-native-deps
      # A Bun patch is keyed by an exact version, so an Expo/RN bump can silently
      # drop it: install only warns, and typecheck + the Metro bundle stay green
      # while a native-only behavior (e.g. the iOS 26 tab-bar minimize tracking
      # the climbs FlashList) regresses all the way into TestFlight. Assert the
      # patched source is actually present on this cheap Linux runner.
      - name: Check native patches are applied
        run: vp run check:mobile-patches
      # Cheap source guard: no raw theme-variant magic-string compares regrew in
      # mobile components (they must route through the variant primitives/tokens —
      # see packages/mobile/src/theme/variants/README.md).
      - name: Check mobile variant usage
        run: vp run check:mobile-variants
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages
      - name: Metro bundle check
        run: vp run check:mobile-bundle

  commit-lint:
    needs: [changes]
    # Conventional Commit gate. The PR TITLE is the authoritative hard check — it's
    # the merge/squash subject and the source of the changelog category. The
    # per-commit range check is ADVISORY (continue-on-error): the repo uses merge
    # commits, so intermediate WIP/fixup commits land on main verbatim and much of
    # the existing history is non-conventional — blocking on it would red most PRs.
    # The local commit-msg hook nudges new commits toward the convention.
    # Also gate on mobile/sharedDeps so the PR-title check runs whenever the
    # release-notes job does — a non-JS mobile/shared change still produces a
    # changelog entry whose category comes from the (conventional) PR title.
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.sharedDeps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint PR title (hard gate)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The PR title is the merge/squash subject and the source of the changelog
          # category, so it must be conventional. This is the blocking check.
          vp run check:commit-message -- --pr-title "$PR_TITLE"
      - name: Lint PR commit subjects (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Surface non-conventional commits without blocking the merge (see job note).
          vp run check:commit-message -- --range "origin/$BASE_REF..HEAD"
      - name: Lint commit subjects (push, advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # On a normal push, github.event.before is the previous tip; validate the
          # newly pushed commits. On a branch's first push it can be all-zeros — fall
          # back to just the head commit to avoid an unbounded range.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            vp run check:commit-message -- --range "$HEAD_SHA~1..$HEAD_SHA"
          else
            vp run check:commit-message -- --range "$BEFORE_SHA..$HEAD_SHA"
          fi

  release-notes:
    needs: [changes]
    # PR-only. Gated on the mobile/shared filter: those PRs ship via OTA, so they
    # must carry user-facing Release Notes (escape hatch: the skip-changelog
    # label, or `none` under the heading).
    if: github.event_name == 'pull_request' && (needs.changes.outputs.mobile == 'true' || needs.changes.outputs.sharedDeps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check PR has Release Notes
        env:
          # Write the body to a file (via env, not interpolated into the script) so
          # a markdown body with backticks/quotes can't break the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.txt
          vp run check:release-notes -- --body-file pr-body.txt

  changelog-owned:
    needs: [changes]
    # The Mobile OTA Production workflow is the SOLE writer of
    # changelog.generated.json — it regenerates and pushes it on every publish. A
    # PR must never hand-edit it (that would fight the OTA bot and could revert
    # shipped entries). Fail if a PR touches the file.
    if: github.event_name == 'pull_request' && needs.changes.outputs.changelogData == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject manual changelog edits
        run: |
          echo "::error::The changelog files (packages/mobile/src/data/changelog.generated.json and CHANGELOG.md) are owned by the Mobile OTA Production workflow (it regenerates and pushes them on every OTA). Revert your change — they're generated from PR Release Notes, never edited in a PR."
          exit 1

  test-report:
    needs: [test-default, test-backend, test-ocr]
    # Only post a report when at least one test job actually ran. If all three
    # were skipped (e.g. an i18n-catalog-only PR), there's nothing to
    # download — actions/download-artifact errors on missing artifacts, so we
    # skip the whole job instead of swallowing the failure.
    if: |
      always() && github.event_name == 'pull_request' && (
        needs.test-default.result != 'skipped' ||
        needs.test-backend.result != 'skipped' ||
        needs.test-ocr.result != 'skipped'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
      - name: Publish test report
        uses: turing85/publish-report@v2
        with:
          comment-header: ci-tests
          comment-enabled: 'true'
          report-name: CI Tests
          report-path: 'test-results/**/*.xml'
          report-reporter: java-junit
          report-fail-on-error: false

  ci-status:
    needs:
      - changes
      - setup
      - lint
      - typecheck
      - codegen-drift
      - i18n
      - test-default
      - test-backend
      - test-ocr
      - mobile-bundle
      - commit-lint
      - release-notes
      - changelog-owned
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Pass when every needed job is either `success` or `skipped` (skipped
          # means a gated job correctly opted out for this change set). Fail on
          # `failure` or `cancelled`.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$bad" ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$bad"
            exit 1
          fi
          echo "All required jobs passed (or were correctly skipped)."
