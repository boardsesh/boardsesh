name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab. Every workflow this one
  # replaced (test.yml, backend-*, mobile-*, moonboard-ocr-*) had
  # workflow_dispatch; preserve that on-demand capability.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs (we don't care about results for an older
  # commit on the same branch). On main, never cancel — every commit needs
  # its own CI record so regressions can be bisected.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      anyJs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.anyJs }}
      web: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.web }}
      backend: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.backend }}
      mobile: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.mobile }}
      mobileDeps: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.mobileDeps }}
      ocr: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.ocr }}
      locationSync: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.locationSync }}
      sharedDeps: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.sharedDeps }}
      sharedSchema: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.sharedSchema }}
      i18nCatalogs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.i18nCatalogs }}
      rootCi: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rootCi }}
      # Files that decide what ships to app.boardsesh.com (Cloudflare Pages
      # config + the export/build/deploy pipeline that produces it). None of
      # these match any other filter above, so without this a PR touching only
      # deploy/app-subdomain/_headers ran zero jobs and ci-status passed on
      # `skipped`. Gates the `deploy-config` job (see below).
      deployConfig: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.deployConfig }}
      # Store listing copy (fastlane/metadata/**/*.txt) and mobile InfoPlist
      # locale files (packages/mobile/locales/*.json). Both are validated by
      # filesystem-reading tests in scripts/ that Vitest's `--changed`
      # module-graph analysis can never relate to a diff of these files, and
      # neither path matches anyJs/rootCi/i18nCatalogs — so a PR touching only
      # them would run zero validators and fail post-merge on main. Gates the
      # `listing-guards` job (see below).
      storeMetadata: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.storeMetadata }}
      mobileLocales: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.mobileLocales }}
      # The two REST-surface oracles walk packages/web/app/api/** and
      # packages/web/vercel.json with readdirSync/readFileSync at run time, so
      # Vitest's `--changed` module-graph analysis can never relate them to a
      # diff that only adds or deletes a route file — the exact diff shape they
      # exist to catch. Measured on #4663: adding app/api/internal/probe-route/
      # route.ts, and separately deleting app/api/og/setter/route.tsx, each
      # selected ZERO specs under `vp test run --project web --changed`. Gates
      # the `rest-surface` job (see below).
      restSurface: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.restSurface }}
      # PR-only guard signal: did this PR edit the OTA-owned changelog data file?
      # Defaults false off PRs (the OTA bot legitimately rewrites it on push).
      changelogData: ${{ github.event_name == 'pull_request' && steps.filter.outputs.changelogData || 'false' }}
      dbMigrations: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.dbMigrations }}
      staticAssets: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.staticAssets }}
      # docs/postgres-image-digests.json and docs/*.patch are checked-in PG18
      # rollout artifacts that nothing reads at run time, so nothing notices
      # when the tree drifts under them. Their guard reads every input with
      # readFileSync/readdirSync, which `--changed` can never relate to a diff
      # of a workflow pin or of a file the patch's context depends on. No other
      # filter matches docs/** at all. Gates the `pg18-artifacts` job below.
      pg18Artifacts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.pg18Artifacts }}
      # Inputs to the www production image (Dockerfile.web). Gates the
      # `docker-web` job below — the only thing in CI that ever runs
      # `next build` for web. Off PRs this hardcodes `true` like every output
      # above, which is load-bearing here: an unconditional build on every push
      # to main is the backstop for whatever the PR filter misses, and the
      # filter is deliberately narrow (see the `dockerWeb:` block below). #4653.
      dockerWeb: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.dockerWeb }}
      # The board-renderer Rust crate (packages/board-renderer/{core,ffi,wasm}/src,
      # its workspace Cargo.toml/Cargo.lock) — matches neither anyJs (not
      # TS/JS) nor mobile (which only covers the built wasm/pkg/** artifact),
      # so a Rust-only PR would otherwise run zero jobs. Gates the
      # `renderer-rust` job (see below).
      boardRenderer: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.boardRenderer }}
      # True if any downstream job's gate would fire. This used to gate the
      # `setup` job (vp install + build:db + a `built-packages` artifact every
      # heavy job downloaded); that job was deleted because @boardsesh/db and
      # @boardsesh/shared-schema resolve through `src/*.ts` in their exports
      # maps — nothing in the repo ever consumed those dist dirs — and it cost
      # ~69s of serialized latency in front of every gated job. The output is
      # kept (no consumer today) because it is the one place that records the
      # union of every downstream gate, and scripts/__tests__/
      # ci-location-sync-workflow.test.ts asserts on its terms; keep it in sync
      # with the job `if:`s below so a future job can gate on it again.
      runAny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.anyJs == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.i18nCatalogs == 'true' || steps.filter.outputs.sharedSchema == 'true' || steps.filter.outputs.sharedDeps == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.ocr == 'true' || steps.filter.outputs.locationSync == 'true' || steps.filter.outputs.rootCi == 'true' || steps.filter.outputs.staticAssets == 'true' }}
      # NOTE: deployConfig, storeMetadata, mobileLocales, restSurface,
      # pg18Artifacts and boardRenderer are deliberately NOT part of runAny —
      # the deploy-config, listing-guards, rest-surface, pg18-artifacts and
      # renderer-rust jobs below gate on their own filters, so a PR touching
      # only their files runs nothing else.
    steps:
      # No actions/checkout here on purpose: on `pull_request` dorny/paths-filter
      # reads the changed-file list from the REST API (no working tree needed),
      # and on `push` the filter step is skipped outright and every output above
      # hardcodes `true`. The checkout was 8-58s at the very head of the run.
      #
      # The one thing the API costs us is a ceiling: `GET /pulls/{n}/files` tops
      # out at 3000 files, and a truncated list would evaluate a filter to
      # `false` and silently skip a job that should have run — the failure mode
      # this whole `changes` job exists to avoid. Fail closed instead, and say
      # what to do about it. (Needs `pull-requests: read`, subsumed by the
      # workflow-level `pull-requests: write`.)
      - name: Guard against paths-filter API truncation
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files > 2900
        run: echo "::error::PR exceeds the paths-filter API window; re-add actions/checkout to the changes job" && exit 1
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            anyJs:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '!packages/board-controller/**'
              - '!embedded/**'
            web:
              - 'packages/web/**'
            backend:
              - 'packages/backend/**'
            mobile:
              - 'packages/mobile/**'
              - 'packages/board-renderer/wasm/pkg/**'
              # www serves its own copy of the same artifact. The byte-parity
              # gate lives in the mobile-bundle job, so a www-only edit to it
              # must still trigger that job (issue #4495).
              - 'packages/web/public/wasm/**'
              - 'patches/**'
              - 'scripts/mobile-platform-imports-check.sh'
              - 'scripts/mobile-web-bundle-check.sh'
              - 'scripts/sync-mobile-board-renderer-wasm.sh'
              # check:mobile-web-bundle drives the real Expo export, so these two
              # only ever run against a genuinely rendered shell here. A
              # unit-test fixture cannot catch a patcher that breaks on Expo's
              # actual output. W-24 / #4438.
              - 'scripts/build-expo-web-export.sh'
              - 'scripts/lib/patch-expo-web-pwa-manifest.mjs'
              # The live fingerprint gates run in the mobile-bundle job; a PR
              # editing only their logic must still trigger that job.
              - 'scripts/mobile-fingerprint-inputs-check.ts'
              - 'scripts/mobile-patches-check.ts'
            # Renderer-agnostic packages imported by @boardsesh/mobile. Keep
            # this separate from sharedDeps: that backend-facing filter also
            # contains packages/db and every sync service, which made an
            # unrelated database PR spend runners on Metro and OCR.
            mobileDeps:
              - 'packages/shared/**'
              - 'packages/shared-schema/**'
              - 'packages/board-constants/**'
            # The Rust crate itself (packages/board-renderer/{core,ffi,wasm}/src,
            # the workspace Cargo.toml/Cargo.lock) plus every committed native
            # renderer artifact inspected by its integration test. Deliberately
            # separate from `mobile`, which covers built artifacts but does not
            # otherwise run cargo: a source-only OR artifact-only renderer PR
            # must reach the `renderer-rust` job (see below).
            boardRenderer:
              - 'packages/board-renderer/**'
              - 'packages/mobile/modules/board-renderer/ios/BoardRendererNative.xcframework/**'
              - 'packages/mobile/modules/board-renderer/android/src/main/jniLibs/**'
            ocr:
              - 'packages/moonboard-ocr/**'
            locationSync:
              - 'packages/location-sync/**'
              - 'packages/db/**'
              - 'packages/shared/board-config/**'
              - 'packages/board-constants/**'
              - 'packages/shared-schema/**'
              - '.github/workflows/ci.yml'
            sharedDeps:
              # packages/shared/** gates test-backend. The
              # backend test project includes the queue-client integration suite
              # (packages/backend/src/__tests__/queue-client-session.test.ts),
              # which drives the real @boardsesh/queue, queue-react, queue-runtime
              # and graphql-client code against a live server. A change to any of
              # those must run the backend suite — keep this glob at
              # packages/shared/**; if you narrow it, re-home that coverage onto
              # an explicit per-package gate for test-backend.
              - 'packages/shared/**'
              - 'packages/shared-schema/**'
              - 'packages/db/**'
              - 'packages/board-constants/**'
              - 'packages/crypto/**'
              - 'packages/aurora-sync/**'
              - 'packages/kilter-sync/**'
              - 'packages/location-sync/**'
              - 'packages/moonboard-sync/**'
              - 'packages/sync-runtime/**'
            sharedSchema:
              - 'packages/shared-schema/**'
              - 'packages/shared/graphql/**'
            i18nCatalogs:
              - 'packages/shared/i18n/locales/**'
            # Everything that decides what ships to app.boardsesh.com: the
            # Cloudflare Pages config copied into the export at deploy time,
            # the export/build scripts that produce it, and the workflow that
            # deploys it. See deploy/app-subdomain/README.md.
            deployConfig:
              - 'deploy/app-subdomain/**'
              - 'scripts/build-expo-web-export.sh'
              - 'scripts/lib/patch-expo-web-pwa-manifest.mjs'
              - 'Dockerfile.web'
              - 'Dockerfile.backend'
              - 'packages/web/app/api/health/build-release.ts'
              - 'packages/backend/src/build-release.ts'
              - 'scripts/__tests__/docker-build-release-stamp.test.ts'
              - '.github/workflows/production-deploy.yml'
              # The suites added to deploy-config below. They read the workflow
              # with readFileSync, so a change to a SUITE has no other path into
              # CI on a PR either.
              - 'scripts/__tests__/production-deploy-web-targets.test.ts'
              - 'scripts/__tests__/static-asset-deploy-origin.test.ts'
              - 'scripts/cloudflare-apply.test.ts'
              # Reads ci.yml, which reaches this job via rootCi; named here so
              # editing the suite alone also triggers it.
              - 'scripts/__tests__/ci-docker-web-workflow.test.ts'
              # The image build-cache contract, and the workflows it reads.
              - 'scripts/__tests__/service-image-build-cache.test.ts'
              - '.github/workflows/sync-deploy.yml'
              - '.github/workflows/branch-deploy.yml'
            # Everything scripts/store-metadata-limits.test.ts reads via fs at
            # run time, plus the test itself.
            storeMetadata:
              - 'fastlane/metadata/**'
              - 'scripts/store-metadata-limits.test.ts'
            # Everything scripts/mobile-locales-parity.test.ts reads via fs at
            # run time, plus the test itself. Its other inputs (app.config.ts,
            # @boardsesh/i18n config) are static imports, so `--changed` in
            # test-default already relates the test to diffs of those.
            mobileLocales:
              - 'packages/mobile/locales/**'
              - 'scripts/mobile-locales-parity.test.ts'
            # Everything the two REST-surface oracles read via fs at run time,
            # plus the specs themselves and the api-docs module the OpenAPI one
            # statically imports. `packages/web/app/api/**` is the load-bearing
            # glob: a route-file-only diff matches anyJs (so test-default runs)
            # but selects neither spec there, which is why this job exists.
            restSurface:
              - 'packages/web/app/api/**'
              - 'packages/web/vercel.json'
              - 'packages/web/app/lib/api-docs/**'
              - 'packages/web/app/__tests__/rest-surface-inventory.test.ts'
              - 'scripts/__tests__/ci-rest-surface-workflow.test.ts'
            # Everything that decides what the www production image contains.
            # Gates `docker-web` below, which is expensive (a full `next build`
            # plus a three-stage image), so this list is the DERIVED closure
            # rather than a convenient `packages/**`:
            #
            #   * `packages/web/**` — the app itself, next.config.mjs included.
            #   * the 37 workspace packages @boardsesh/web transitively depends
            #     on, taken from the same dependencies/optionalDependencies/
            #     peerDependencies walk create-service-docker-context.mjs runs.
            #     scripts/__tests__/ci-docker-web-workflow.test.ts re-derives
            #     that walk and fails if this list stops covering it, so a new
            #     workspace dep can't open a silent hole.
            #   * the install inputs — Dockerfile.web, pnpm-lock.yaml,
            #     pnpm-workspace.yaml, the root package.json, and patches/**
            #     (pnpm resolves patchedDependencies
            #     before the deps stage can install at all).
            #   * the three repo-root scripts services.web.extraSourceFiles
            #     copies into the context. Only tailscale-hostname.ts is
            #     load-bearing (packages/web/scripts imports it and Next's
            #     production type-check compiles that directory); the other two
            #     are listed because the context copies them and W-26/#4442 will
            #     drop the set together.
            #   * the generator itself. A cheap contract test below verifies
            #     vite.config.ts still maps `docker-context:web` to it, so an
            #     unrelated task edit does not launch this four-minute build.
            #   * `.github/workflows/ci.yml`. Not an image input — it is here so
            #     a diff that narrows this filter, or edits the job, actually
            #     runs the job it changes. ci-docker-web-workflow.test.ts reads
            #     ci.yml with readFileSync, which `--changed` can never relate to
            #     a diff, so without this entry a ci.yml-only PR could quietly
            #     gut the gate and go green. Measured cost: ci.yml took 50 of the
            #     last 4,941 commits (~1%).
            #
            # KNOWN BLIND SPOT, accepted deliberately: packages/mobile/**,
            # packages/shared/offline-sync/** and packages/shared/
            # key-value-storage/** ARE copied into the web context (services.web
            # roots at @boardsesh/mobile too), but nothing in the image builds or
            # runs them — W-24/#4438 deleted the Expo export step from the
            # builder stage and W-26/#4442 drops them from the context. Mobile is
            # by far the highest-churn tree in the repo, so gating a 4-minute
            # build on it would make most PRs pay for bytes the runner never
            # sees. The unconditional main-push build is the backstop.
            dockerWeb:
              - 'packages/web/**'
              - 'packages/aurora-sync/**'
              - 'packages/board-constants/**'
              - 'packages/shared/board-art-geometry/**'
              - 'packages/board-renderer/wasm/**'
              - 'packages/crypto/**'
              - 'packages/db/**'
              - 'packages/location-sync/**'
              - 'packages/moonboard-ocr/**'
              - 'packages/shared-schema/**'
              - 'packages/shared/analytics/**'
              - 'packages/shared/ble-protocol/**'
              - 'packages/shared/board-config/**'
              - 'packages/shared/board-presence/**'
              - 'packages/shared/board-presence-react/**'
              - 'packages/shared/board-react/**'
              - 'packages/shared/board-render/**'
              - 'packages/shared/climb-actions/**'
              - 'packages/shared/climb-filters/**'
              - 'packages/shared/create-climb-react/**'
              - 'packages/shared/email/**'
              - 'packages/shared/graphql/**'
              - 'packages/shared/graphql-client/**'
              - 'packages/shared/gym-claim/**'
              - 'packages/shared/i18n/**'
              - 'packages/shared/kiosk/**'
              - 'packages/shared/logbook/**'
              - 'packages/shared/party-profile/**'
              - 'packages/shared/play-view/**'
              - 'packages/shared/playback-react/**'
              - 'packages/shared/playlist-generator/**'
              - 'packages/shared/playlists-react/**'
              - 'packages/shared/profile-stats/**'
              - 'packages/shared/queue/**'
              - 'packages/shared/queue-react/**'
              - 'packages/shared/queue-runtime/**'
              - 'packages/shared/static-assets/**'
              - 'packages/shared/velvet-tokens/**'
              - 'packages/shared/watch-pairing/**'
              - 'packages/sync-runtime/**'
              - 'Dockerfile.web'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'patches/**'
              - 'scripts/create-service-docker-context.mjs'
              - 'scripts/build-expo-web-export.sh'
              - 'scripts/lib/patch-expo-web-pwa-manifest.mjs'
              - 'scripts/lib/tailscale-hostname.ts'
              - '.github/workflows/ci.yml'
              - 'scripts/__tests__/ci-docker-web-workflow.test.ts'
            rootCi:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            changelogData:
              - 'packages/mobile/src/data/changelog.generated.json'
              - 'CHANGELOG.md'
            # The PG18 digest manifest is checked into the repo and read by
            # nothing at run time, so it drifts silently. This filter names
            # every input the guard spec reads from disk: the manifest, any
            # prepared docs patch (top level or nested), every consumer that
            # pins a published digest (the PINNED_CONSUMERS list in the spec;
            # ci.yml itself reaches the job via rootCi), and the spec file. A
            # future prepared patch must add every file its context touches
            # here, or an edit to one of those files skips this job on the PR
            # and the guard only fires after merge. The rename-patch-era
            # entries (docs, replication scripts, dev-db-docker.yml) were
            # pruned when that patch landed as a real rename.
            pg18Artifacts:
              - 'docs/postgres-image-digests.json'
              - 'docs/*.patch'
              - 'docs/**/*.patch'
              - 'docker-compose.yml'
              - '.github/workflows/e2e-tests.yml'
              - '.github/workflows/db-migration-renumber.yml'
              - 'scripts/__tests__/ci-location-sync-workflow.test.ts'
              - 'scripts/__tests__/pg18-artifact-drift.test.ts'
            dbMigrations:
              - 'packages/db/drizzle/**'
              - 'packages/db/src/schema/**'
              - 'scripts/check-db-migrations.ts'
              - 'scripts/lib/drizzle-migrations.ts'
              # The journal<->ledger verification that gates the production
              # deploy (#2933) and its real-database test.
              - 'scripts/lib/migration-ledger.ts'
              - 'scripts/lib/migration-ledger.test.ts'
              - 'packages/db/scripts/migrate.ts'
              - 'packages/db/scripts/migration-journal.ts'
              - 'packages/db/scripts/verify-migration-journal.ts'
              - 'packages/db/scripts/migration-journal-verification.integration.test.ts'
              # Defines the test:migration-journal script this job's new step
              # invokes, so editing it has to run the job that depends on it.
              - 'packages/db/package.json'
              # Reads packages/db/drizzle/*.sql via readFileSync at run time, so
              # Vitest's --changed module graph in test-default can never relate
              # it to a migration-only diff — the exact diff it guards. Same
              # blind spot deploy-config, listing-guards and pg18-artifacts each
              # document. This job runs it unfiltered instead.
              - 'scripts/__tests__/db-trigger-search-path.test.ts'
            staticAssets:
              - 'packages/web/public/images/**/*.webp'
              - 'packages/web/public/brand/boardsesh-mark.png'
              - 'packages/web/public/icons/*.png'
              - 'packages/web/app/favicon.ico'
              - 'packages/web/app/icon.png'
              - 'packages/shared/static-assets/**'
              - 'scripts/generate-static-assets.ts'
              - 'scripts/lib/static-asset-catalog.ts'
              - 'scripts/lib/static-asset-catalog.test.ts'
              - 'scripts/upload-static-assets.ts'
              - 'scripts/lib/static-asset-upload.ts'
              - 'scripts/lib/static-asset-upload.test.ts'

  lint:
    needs: [changes]
    # Gate is the UNION of lint's own scope and the mobile-bundle scope, because
    # the nine `check:mobile-*` guards live here now (they used to sit in front
    # of Metro in mobile-bundle, costing ~24s on the critical path). mobile /
    # mobile/mobileDeps cover paths that anyJs never matches — patches/**,
    # packages/board-renderer/wasm/pkg/**, scripts/mobile-*.sh — so dropping
    # either term would silently stop running the patch and fingerprint guards
    # on exactly the PR shape they exist for. Only ever widen this.
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.mobileDeps == 'true' || needs.changes.outputs.staticAssets == 'true'
    # Deliberately NOT routed to the self-hosted fleet: this job wants more
    # memory than a slot has.
    #
    # `vp check`'s type-aware pass shells out to tsgolint, which builds ONE
    # TypeScript program over all ~4,900 files. That fit under vite-plus 0.1.24
    # (oxlint-tsgolint 0.23). The 0.3.0 bump to oxlint-tsgolint 7.0.2001 (#5108)
    # pushed the peak past a slot's ~3.4 GB `--memory`, so the kernel SIGKILLs
    # tsgolint mid-run. oxlint can then only say "Linting could not start" and
    # the job shows a bare exit 1 — run 33687293891, job 100437701580, whose
    # container reported `oom_kill 1` in memory.events.
    #
    # Measured by replaying the job inside the CI image under the launcher's own
    # bounds (`--cpuset-cpus`, `--memory`, `--memory-swap`), reading the cgroup's
    # own memory.peak:
    #
    #   cap      2 vCPU  3 vCPU   peak when it passed
    #   3.5 GB   OOM     OOM      --
    #   4.5 GB   --      OOM      --
    #   5.5 GB   --      OOM      --
    #   6.0 GB   pass    pass     4.98-5.63 GB
    #
    # So the bar is ~6 GB for this one job, against 3.4 GB per slot. vCPU count
    # is not the lever: 2 and 3 both die at 3.5 GB, and 16 peaks LOWER (the GC
    # keeps up with allocation). Neither is GOMEMLIMIT, Go's soft heap ceiling:
    # at 1 GiB it passed once and then failed three consecutive runs on the same
    # image, which is worse than a clean routing decision.
    #
    # Re-route it when the launcher can give a single job ~6 GB. Same shape
    # firmware-tests was in — it joins once the fleet can host it. The list it
    # came off is ROUTED_JOBS in scripts/__tests__/ci-runner-routing.test.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Install Expo web lint dependencies
        # Unconditional: the lint step below lints the WHOLE repo, so
        # packages/mobile/src/web-shims/bottom-sheet.tsx is always in scope and
        # its `@gorhom/bottom-sheet` types only resolve through the isolated
        # web-runtime install (packages/mobile/tsconfig.json maps the path
        # there). Gating this on the mobile dependency filters made every
        # main push that touched neither fail with two TS2307s that no PR run
        # could reproduce. ~0.5s to install, so there is nothing to gate on.
        run: vp run mobile:web-runtime:install
      # The nine `check:mobile-*` guards below used to run in mobile-bundle, in
      # front of Metro — ~24s of the critical path (18s of it the fingerprint
      # check) spent on checks that need nothing Metro produces. They live in
      # this cheap job now. Fail-fast is preserved: lint still goes red inside a
      # minute and PR runs cancel-in-progress. The only property given up is
      # that a failing guard no longer short-circuits Metro's work.
      - name: Check mobile board art stays bundled
        run: vp run check:mobile-board-art-network
      - name: Check static asset catalog is current
        run: vp run check:static-assets
      # Catches iOS bundle-phase dep-resolution breaks (e.g. a transitive-only
      # @sentry/cli unresolvable from packages/mobile under pnpm's isolated
      # linker) here on Linux, instead of in the macOS TestFlight archive on
      # push-to-main.
      - name: Check native build-phase deps resolve
        run: vp run check:mobile-native-deps
      # Every @expo/* and expo-* dep must be exact-pinned: they ship a JS+native
      # pair, and a `~`/`^` range lets the JS float ahead of a shipped binary's
      # native layer. With the OTA fingerprint pinned via an override, that
      # drifted JS still lands on the old binary — the ModalBottomSheetView
      # .partialExpand "No handler registered" crash from a `~56.0.18` @expo/ui.
      - name: Check Expo deps are exact-pinned
        run: vp run check:mobile-expo-deps-pinned
      # Deterministic, read-only dep-health check: compares our declared pins
      # against packages/mobile/node_modules/expo/bundledNativeModules.json for
      # the SDK release we actually have installed, and flags installed-version
      # drift from those pins (the caret-drift class behind the 2.0.0 launch
      # crash). It never consults the network or Expo's remote versions API, so
      # it only changes outcome when WE change something (bump expo, edit a
      # pin, lockfile drift) — not when Expo ships an unrelated patch release.
      # Intentional deviations live in expo.install.exclude.
      - name: Mobile dep-health check
        run: vp run check:mobile-deps
      # A pnpm patch is keyed by an exact version, so an Expo/RN bump can silently
      # drop it: install only warns, and typecheck + the Metro bundle stay green
      # while a native-only behavior (e.g. the iOS 26 tab-bar minimize tracking
      # the climbs FlashList) regresses all the way into TestFlight. Assert the
      # patched source is actually present on this cheap Linux runner.
      - name: Check native patches are applied
        run: vp run check:mobile-patches
      # The resolver can return a valid fingerprint even when a source is silently
      # absent/null. Assert the four autolinking configs, every discovered native
      # module dir, the fingerprint config, and root patch bodies all contribute.
      - name: Check mobile fingerprint inputs are complete
        run: vp run check:mobile-fingerprint-inputs
      # Cheap source guard: no raw theme-variant magic-string compares regrew in
      # mobile components (they must route through the variant primitives/tokens —
      # see packages/mobile/src/theme/variants/README.md).
      - name: Check mobile variant usage
        run: vp run check:mobile-variants
      # @expo/ui swift-ui / jetpack-compose imports must stay in their platform
      # file (*.ios.tsx / *.android.tsx) — a misplaced one crashes the other
      # platform at runtime. The .oxlintrc rule isn't enforced by `vp check`, so
      # this grep guard is the real backstop. See docs/expo-ui-components.md.
      - name: Check mobile @expo/ui platform imports
        run: vp run check:mobile-platform-imports
      # The offline-sync engine's drain/scheduler/pull entry points must be
      # imported via src/offline/offline-sync-adapter (binds the connectivity
      # probe + platform triggers). The .oxlintrc rule isn't enforced by
      # `vp check`, so this grep guard is the real backstop.
      - name: Check offline-sync adapter boundary
        run: vp run check:mobile-offline-sync-imports
      # PRs and main lint the SAME thing: the whole repo. This job used to lint
      # only a PR's changed files and reserve the full-repo pass for push-to-main,
      # which meant an error in a file no PR happened to touch could not be caught
      # until it was already on main. 33 of them accumulated that way and broke
      # every main run for days (issue #4488, fixed by #4521) while every PR that
      # introduced them stayed green. Measured cost of closing that gap: ~26s per
      # PR (step timings, job 96193441921), against a 109s job dominated by
      # setup-vp. Scope is now identical on both sides by construction, so the
      # only way to land a lint error is to be the PR that shows it.
      #
      # Effective config is the `lint` block in root vite.config.ts, NOT
      # .oxlintrc.json — see issue #4548 and the comment on that block.
      - name: Lint full repo
        # vp/Vite+ panics with "failed printing to stdout: Resource temporarily
        # unavailable (os error 11)" when it flushes the full-repo warning list to the
        # runner's non-blocking stdout. Write to a regular file (never EAGAIN), then
        # echo it back, preserving vp's real exit code so errors still fail the job.
        run: |
          vp check > vp-check.log 2>&1 && status=0 || status=$?
          cat vp-check.log || true
          # When the OS kills tsgolint for memory, oxlint reports it as "Linting
          # could not start" and the only hard evidence is a `signal: 'SIGKILL'`
          # line buried in a Node stack — the job itself just says "exit code 1".
          # Say what actually happened, and print the runner's real memory
          # ceiling, so the next time this job outgrows its runner nobody has to
          # reconstruct it from a kernel-level symptom.
          if [ "$status" -ne 0 ] && grep -q "signal: 'SIGKILL'" vp-check.log; then
            echo "::error::tsgolint was killed by the OS (SIGKILL): this runner ran out of memory. cgroup memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown). A full-repo type-aware lint of this monorepo peaks at 5.0-5.6 GB, so the runner needs ~6 GB."
          fi
          exit $status

  large-files:
    # Guards against committed binary churn (screenshots, build outputs, vendored
    # binaries) re-bloating the pack after the 2026 history cleanup. Runs on every
    # PR regardless of which file types changed — a binary-only PR is exactly the
    # case to catch — so it is deliberately not gated on the `changes` filter.
    # Dependency-free (bare node), so no vp install / build artifacts needed.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Unit-test the guard
        run: node --test scripts/check-large-files.test.mjs
      - name: Check for oversized new files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-large-files.mjs
          else
            node scripts/check-large-files.mjs --all
          fi

  typecheck:
    needs: [changes]
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      # `vp run typecheck` walks the dependsOn graph defined in root
      # vite.config.ts and uses vp's task cache — unchanged packages skip via
      # cache hits, so this is fast on small PRs even though it expresses the
      # full set.
      - name: Typecheck (cache-driven affected)
        run: vp run typecheck

  db-migrations:
    needs: [changes]
    # Gated on the migration folder and the schema it is checked against, not on
    # the whole sharedDeps blob (which also covers packages/shared, shared-schema,
    # board-constants and the sync packages).
    if: needs.changes.outputs.dbMigrations == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A stock Postgres is enough: the journal<->ledger test builds its own
    # throwaway migrations folder and database, so it needs no board data and
    # never pulls the (large) boardsesh-dev-db image.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Docker runs its FIRST health probe only after --health-interval
        # elapses, so a coarse interval is pure idle: Postgres logs "ready to
        # accept connections" within ~0.1s of container start. Finer grid, same
        # total tolerance (5s x 10 = 50s -> 2s x 25 = 50s). Do not shorten the
        # window itself — that trades latency for flakiness on a slow start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    steps:
      - uses: actions/checkout@v6
        with:
          # Needs origin/main reachable to compare numbering and `when` against it.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate the migration folder
        run: |
          git fetch --no-tags --depth=1 origin main
          vp run check:db-migrations -- --base origin/main
      # Guards the failure mode check:db-migrations cannot see: a migration
      # whose `when` lands below drizzle's created_at high-water mark is skipped
      # forever and silently (#2933). Drives drizzle's real migrate() against a
      # scratch database.
      - name: Verify the migration journal check against a real database
        env:
          MIGRATION_JOURNAL_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: vp run test:db:migration-journal
      # A trigger function with no pinned search_path cannot resolve an
      # unqualified type or table while pg_restore holds search_path at '',
      # which aborts a --data-only restore on the first affected table with zero
      # rows loaded (#4699). Textual, because this job's service is a stock
      # postgres:17 with no PostGIS and it never executes the migration SQL. The
      # catalog counterpart runs in test-dev-db via scripts/dev-db-image-smoke.sh.
      - name: Every trigger function pins search_path
        run: vp test run --project scripts scripts/__tests__/db-trigger-search-path.test.ts

  codegen-drift:
    needs: [changes]
    # codegen.ts pulls GraphQL documents from packages/web/app/**/*.{ts,tsx}
    # in addition to the schema + shared/graphql, so a web-only PR that edits
    # a gql tag can drift the generated client. Include `web` in the gate.
    if: needs.changes.outputs.sharedSchema == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Regenerate GraphQL types
        run: vp run codegen
      - name: Verify committed output matches
        run: |
          if ! git diff --exit-code -- \
              packages/shared-schema/src/generated \
              packages/shared/graphql/src/generated \
              packages/web/app/lib/graphql/generated; then
            echo "::error::Generated GraphQL files are out of date. Run 'vp run codegen' locally and commit the result."
            exit 1
          fi

  # No `if:` path gate and no `needs: [changes]` on purpose. The version is derived
  # from the whole board catalogue plus the compiled renderer and every board photo
  # the catalogue composites — a paths-filter listing those would drift from the
  # generator's real input set, and a guard that silently stops guarding is worse
  # than none (see the `check:db-migrations` / `large-files` precedents). Since it
  # reads no `changes` output, waiting on that job would only add latency.
  board-render-version:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Verify the committed board-render version matches the tree
        run: vp run check:board-render-version

  # Same no-path-gate reasoning as board-render-version above, and the same
  # inputs: the tracer walks the whole board catalogue and every board photo the
  # catalogue composites, so a paths-filter listing those would drift from the
  # generator's real input set. ~2 minutes of sharp + geometry for 49 configs.
  board-art-geometry:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Verify the committed hold silhouettes match the board art
        run: vp run check:board-art-geometry

  i18n:
    needs: [changes]
    # `mobile` is in the filter because check:i18n:orphans scans
    # packages/mobile/{src,app} too. #4416 shipped a raw `playView.resetZoom`
    # label from a mobile-only commit — without this the guard would skip the
    # exact class of PR that introduces the bug.
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.i18nCatalogs == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check hardcoded user-facing strings
        run: vp run check:i18n
      # Two-way: orphaned catalog keys, plus keys referenced from code that exist
      # in no catalog (they ship as raw `playView.resetZoom` strings — #4416) and
      # mobile files reading a namespace Metro never bundles.
      - name: Check i18n keys (orphaned + missing)
        run: vp run check:i18n:orphans

  deploy-config:
    needs: [changes]
    # Deliberately not `--changed`-filtered: the tests read `_headers`/`_redirects`
    # via fs at run time (not a static import), so Vitest's `--changed` module-graph
    # analysis would never mark them as related to a diff that only touches those
    # files. On a PR, a full un-filtered run of this one small project is what makes
    # a CSP or SPA-fallback regression fail CI. (Pushes to main run the project a
    # second time inside test-default, which reads its project list off the root
    # vite.config.ts — harmless, and no substitute for this job on PRs.)
    if: needs.changes.outputs.deployConfig == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate deploy/app-subdomain config (_headers, _redirects, _routes.json, asset-404 Function, no-CSP rule)
        run: vp test run --project deploy-app-subdomain
      # Same fs-reading blind spot, one project over: these suites read the
      # Dockerfiles / build-expo-web-export.sh / create-service-docker-context.mjs
      # with readFileSync, so test-default's `--changed` never relates them to a
      # diff that only touches those files — and a Dockerfile- or .sh-only PR
      # matches no other job's gate at all. Nothing in CI builds Dockerfile.web
      # (branch-deploy.yml is workflow_dispatch-only), so these pins are the only
      # thing standing between #3795 and a restored /app export step. W-24 / #4438.
      - name: Validate container build contracts
        run: >-
          vp test run --project scripts
          scripts/__tests__/dockerfile-web-no-expo-export.test.ts
          scripts/__tests__/build-expo-web-export.test.ts
          scripts/__tests__/docker-build-release-stamp.test.ts

      # Same fs-reading blind spot again, and these three are the suites that
      # actually pin production-deploy.yml's shape: the deploy-target gating and
      # the job graph, the static-asset origin baked into the image, and the
      # Cloudflare/web promotion wiring.
      #
      # They had NO path into PR CI at all. `test-default` is `--changed`-filtered
      # on PRs and these read the workflow with readFileSync, so Vitest's module
      # graph never relates them to a workflow diff; only a push to main ran them,
      # which means a PR that broke one of these guards went green and turned main
      # red after merge. Found the hard way while deleting the Vercel half of the
      # deploy: `cloudflare-apply.test.ts` sliced a job that no longer existed
      # (indexOf -> -1, slice(-1) -> the last character) and every assertion
      # against it passed vacuously.
      - name: Validate the production deploy workflow contracts
        run: >-
          vp test run --project scripts
          scripts/__tests__/production-deploy-web-targets.test.ts
          scripts/__tests__/static-asset-deploy-origin.test.ts
          scripts/cloudflare-apply.test.ts
          scripts/__tests__/ci-docker-web-workflow.test.ts
          scripts/__tests__/service-image-build-cache.test.ts

  listing-guards:
    needs: [changes]
    # Same rationale as deploy-config: these two suites read their inputs
    # (fastlane/metadata/**/*.txt, packages/mobile/locales/*.json) via fs at run
    # time, so Vitest's `--changed` module-graph analysis never selects them for
    # a diff that only touches those files — and no other job's gate fires for
    # them at all. Run both files unfiltered whenever either input set changes,
    # so an over-limit store field or a malformed InfoPlist translation fails
    # the PR instead of the post-merge run on main. (Pushes to main run the
    # scripts project a second time inside test-default — harmless, and no
    # substitute for this job on PRs.)
    if: needs.changes.outputs.storeMetadata == 'true' || needs.changes.outputs.mobileLocales == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate store listing copy and mobile locale parity
        run: vp test run --project scripts scripts/store-metadata-limits.test.ts scripts/mobile-locales-parity.test.ts

  pg18-artifacts:
    needs: [changes]
    # Deliberately not `--changed`-filtered, same rationale as deploy-config and
    # listing-guards: the spec reads docs/postgres-image-digests.json, any
    # prepared patch under docs/, and each pinned consumer with
    # readFileSync/readdirSync at run time, so Vitest's module-graph analysis
    # never relates it to a diff that only edits a workflow pin or a file a
    # patch's context depends on. That is exactly the diff it guards. Note
    # `.github/workflows/ci.yml` reaches it via rootCi rather than the
    # pg18Artifacts list.
    if: needs.changes.outputs.pg18Artifacts == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate published image digest pins and any prepared patches
        run: vp test run --project scripts scripts/__tests__/pg18-artifact-drift.test.ts

  renderer-rust:
    needs: [changes]
    # The board-renderer Rust crate has no `vp` task and isn't part of the pnpm
    # workspace graph, so it gates on its own dedicated `boardRenderer` filter
    # (packages/board-renderer/**) rather than anyJs/sharedDeps.
    if: needs.changes.outputs.boardRenderer == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/board-renderer
    steps:
      - uses: actions/checkout@v6
      # dtolnay/rust-toolchain and Swatinem/rust-cache are third-party, not the
      # first-party GitHub and voidzero-dev actions the rest of this
      # workflow uses — pinned by full commit SHA (see e.g.
      # .github/workflows/dev-db-docker.yml for the repo's established
      # SHA-pin convention for actions like these).
      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/board-renderer -> target
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  rest-surface:
    needs: [changes]
    # Deliberately not `--changed`-filtered, same rationale as deploy-config and
    # listing-guards one job up: both specs reconcile the REST surface against
    # the filesystem at run time (readdirSync over packages/web/app/api/**,
    # readFileSync of vercel.json, existsSync per registered OpenAPI path), so
    # Vitest's module-graph analysis in test-default never selects them for a
    # diff that only adds or deletes a route file. That is precisely the diff
    # each one guards, so inside test-default they were inert on PRs and only
    # ever reddened post-merge on main. Run both unfiltered whenever the API
    # tree, vercel.json, or the specs' own inputs change. Do not fold these into
    # test-default and do not add `--changed` here.
    if: needs.changes.outputs.restSurface == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate the REST surface inventory and the published OpenAPI spec
        run: >-
          vp test run --project web
          packages/web/app/__tests__/rest-surface-inventory.test.ts
          packages/web/app/lib/api-docs/__tests__/openapi-document.test.ts
      # Same fs-reading blind spot one level up: this spec reads ci.yml itself,
      # so nothing in test-default relates it to a diff that narrows this job.
      # It is what stops the gate above from being quietly reverted.
      - name: Validate this job's own gate
        run: vp test run --project scripts scripts/__tests__/ci-rest-surface-workflow.test.ts

  test-default:
    needs: [changes]
    # i18nCatalogs: a catalog-only PR (pure JSON) must still run the
    # catalog-completeness parity test, which lives in this job.
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true' || needs.changes.outputs.i18nCatalogs == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      # Same idiom as test-backend below. fail-fast stays false so a failure in
      # one shard still reports the other's failures — a cancelled sibling costs
      # a round trip (and `cancelled` is neither success nor skipped, so
      # ci-status still fails either way).
      fail-fast: false
      # A PR may enqueue alongside deployment and release automation. Keep its
      # test fan-out bounded so one synchronization cannot claim every runner.
      max-parallel: ${{ github.event_name == 'pull_request' && 2 || 3 }}
      # 3 shards on main (the whole ~1380-spec run, job mean 558s), 2 on PRs
      # (where `--changed` already trims the spec set and a third runner is
      # mostly harness overhead).
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"shard":1,"total":3},{"shard":2,"total":3},{"shard":3,"total":3}]' || '[{"shard":1,"total":2},{"shard":2,"total":2}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      # Run every project EXCEPT the two with dedicated infra-bearing jobs
      # (`backend`: postgres+redis; `moonboard-ocr`: canvas libs) as an explicit
      # POSITIVE `--project` list. Negation (`--project '!backend'`) does NOT
      # hold up under `--changed`: Vitest collects test files from the diff and
      # that spec set drives project init / globalSetup BEFORE the negation
      # applies, so a diff touching anything `backend` imports pulls its
      # Postgres-connecting tests into this infra-less job and they fail. A
      # project absent from a positive list is never loaded. The list is derived
      # from root vite.config.ts's `test.projects` (see the script) so new
      # packages are picked up automatically and can't be silently skipped.
      #
      # No `passWithNoTests` flag anywhere, deliberately: on a PR `--changed` is
      # set, which already implies it inside Vitest and also suppresses Vitest's
      # `shard.count > specs.length` throw, so a one-file diff can't red the
      # build; on push the run selects ~1380 specs, far above 3. Passing the
      # flag would instead turn "this shard collected nothing" into a silent
      # green.
      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p test-results
          # $PROJECTS is intentionally UNQUOTED in the two `vp test run` calls
          # below so the shell word-splits it into separate `--project=<name>`
          # flags. Do NOT quote it. (Safe: project names are bare identifiers.)
          PROJECTS="$(node --import tsx scripts/ci-test-default-projects.ts)"
          echo "test-default projects: $PROJECTS"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            vp test run --changed "origin/$BASE_REF" $PROJECTS \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./test-results/junit-default-${{ matrix.shard }}.xml
          else
            vp test run $PROJECTS \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./test-results/junit-default-${{ matrix.shard }}.xml
          fi
      # Shard-scoped artifact name AND file name: test-report downloads
      # `test-results-*` with merge-multiple, which flattens every artifact into
      # one directory — same-named files would clobber each other and the report
      # would silently lose a shard's worth of results.
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-default-${{ matrix.shard }}
          path: test-results/junit-default-${{ matrix.shard }}.xml
          retention-days: 7

  test-backend:
    needs: [changes]
    # Gated on `sharedDeps` (packages/shared/**) as well as `backend`: the backend
    # test project drives the queue-client integration suite against the real
    # @boardsesh/queue* packages, so a change to those must run it. See the
    # sharedDeps filter note in the `changes` job before narrowing that gate.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.sharedDeps == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 1 || 2 }}
      # On main, split into 2 shards; on PR, run as a single shard (the
      # affected subset is usually small enough that sharding adds overhead).
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"shard":1,"total":2},{"shard":2,"total":2}]' || '[{"shard":1,"total":1}]') }}
    services:
      postgres:
        image: ghcr.io/boardsesh/boardsesh-postgres-postgis@sha256:4ebf346a8407761a86cb21998a81b4848080ed1d2fd72afdcf968eda02b12713
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boardsesh_backend_test
        ports:
          - 5433:5432
        # Finer probe grid, identical tolerance window (10s x 5 = 50s ->
        # 2s x 25 = 50s). Docker's first probe fires only after one interval
        # elapses, so the coarse grid was ~13s of idle in `Initialize
        # containers` while the server was already accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        # Same rescale: 10s x 5 = 50s -> 2s x 25 = 50s.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      # Warn (don't fail) when shared Drizzle schema changed without a matching
      # edit to the hand-maintained test DDL. Mirrors backend-tests.yml.
      - name: Check for test schema drift
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_SHA" || true
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          if echo "$changed" | grep -qE '^packages/db/src/schema/'; then
            if ! echo "$changed" | grep -qE '^packages/backend/src/__tests__/schema-sql\.ts$'; then
              echo "::warning title=Test schema may be stale::packages/db/src/schema/ changed but packages/backend/src/__tests__/schema-sql.ts was not. If your change added/removed columns the backend tests care about, mirror it there too."
            fi
          fi
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Run backend tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/boardsesh_backend_test
          REDIS_URL: redis://localhost:6380
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p packages/backend/test-results
          if [ "$EVENT_NAME" = "pull_request" ]; then
            vp test run --project backend --changed "origin/$BASE_REF" \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/backend/test-results/junit-backend-${{ matrix.shard }}.xml
          else
            vp test run --project backend \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/backend/test-results/junit-backend-${{ matrix.shard }}.xml
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend-${{ matrix.shard }}
          path: packages/backend/test-results/junit-backend-${{ matrix.shard }}.xml
          retention-days: 7

  test-ocr:
    needs: [changes]
    # @boardsesh/moonboard-ocr has no @boardsesh workspace dependencies. Do not
    # start its native image-processing stack for unrelated shared/DB changes.
    if: needs.changes.outputs.ocr == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      # No apt-get for canvas's build deps (~22s): canvas@3.2.3 installs through
      # `prebuild-install -r napi`, and the napi prebuild vendors every graphics
      # library inside the package — ldd on the installed canvas.node resolves
      # libcairo, libpango, librsvg, libjpeg, libgif, libfreetype, libharfbuzz,
      # libpixman and libfontconfig to its own build/Release via RUNPATH $ORIGIN;
      # only libc/libm/libstdc++/libgcc come from the runner. The node-gyp
      # compile fallback is never reached here. If a future bump ever loses the
      # prebuild, parser.canvas.test.ts imports canvas at module scope with no
      # skipIf guard, so this job fails loudly at import time rather than
      # quietly dropping a spec file.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Run OCR tests
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p packages/moonboard-ocr/test-results
          if [ "$EVENT_NAME" = "pull_request" ]; then
            vp test run --project moonboard-ocr --changed "origin/$BASE_REF" \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/moonboard-ocr/test-results/junit-ocr.xml
          else
            vp test run --project moonboard-ocr \
              --reporter=verbose --reporter=github-actions \
              --reporter=junit --outputFile.junit=./packages/moonboard-ocr/test-results/junit-ocr.xml
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ocr
          path: packages/moonboard-ocr/test-results/junit-ocr.xml
          retention-days: 7

  test-location-sync-integration:
    needs: [changes]
    if: needs.changes.outputs.locationSync == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/boardsesh/boardsesh-dev-db@sha256:f776350fa627c626f4d70bbf6bb0451e27ff6b1c8ccf6d02220e0b2d261ee058
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: main
        ports:
          - 5432:5432
        # Finer probe grid, identical tolerance window (10s x 10 = 100s ->
        # 2s x 50 = 100s). The window stays generous on purpose: this is the
        # large pre-seeded dev-db image, which is the slowest container we boot.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Apply the full migration journal
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/main
          VERIFY_MIGRATION_JOURNAL: '1'
        run: vp exec pnpm --filter @boardsesh/db run db:migrate
      - name: Run the required location-sync integration suite
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/main
          REQUIRE_LOCATION_SYNC_INTEGRATION: '1'
        run: |
          mkdir -p packages/location-sync/test-results
          vp test run --project location-sync \
            --reporter=verbose --reporter=github-actions \
            --reporter=junit --outputFile.junit=./packages/location-sync/test-results/junit-location-sync.xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-location-sync
          path: packages/location-sync/test-results/junit-location-sync.xml
          retention-days: 7

  mobile-bundle:
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.mobileDeps == 'true' || needs.changes.outputs.rootCi == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      # The nine cheap `check:mobile-*` guards that used to sit here now run in
      # the `lint` job, whose gate was widened to this job's union so none of
      # them lost coverage. See the block above `Check mobile board art stays
      # bundled` in `lint`.
      #
      # Metro's transform cache. @expo/metro-config hard-codes the store to
      # os.tmpdir()/metro-cache, so TMPDIR is the only supported way to move it
      # — hence a cache dir under runner.temp plus TMPDIR on the bundle step.
      # It must NOT live inside the workspace: packages/mobile/metro.config.js
      # sets watchFolders to the monorepo root, so an in-repo cache directory
      # gets crawled by the file watcher. Measured on identical hardware with
      # only TMPDIR differing: 178s cold vs 90s warm (649 vs 104 CPU-seconds),
      # i.e. ~84% of the babel transform output is reusable, and each reused
      # entry is still validated by Metro's own content hash.
      #
      # The key hashes what decides HOW a module is transformed, not the modules
      # themselves — Metro content-hashes every source file on its own, so a
      # source edit is a per-file miss, never a stale hit. metro.config.js pulls
      # in the two sibling .cjs helpers, so they're keyed too. There is no
      # project babel config today (babel-preset-expo comes in through
      # @expo/metro-config); packages/mobile/babel.config.js stays in the list
      # so the day someone adds one it is keyed from the first run instead of
      # silently reusing transforms built under the old preset chain.
      - name: Prepare the Metro transform cache directory
        run: mkdir -p ${{ runner.temp }}/metro-native
      - name: Restore Metro's native transform cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/metro-native
          # Deliberately NO cross-lockfile restore-key: any dependency bump must
          # fall back to a fully cold Metro rather than reuse transforms built
          # against different sources.
          key: metro-native-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/metro.config.js', 'packages/mobile/metro-web-runtime-resolution.cjs', 'packages/mobile/expo-web-response-headers.cjs', 'packages/mobile/babel.config.js', 'packages/mobile/app.config.ts', 'patches/**') }}-${{ github.sha }}
          restore-keys: |
            metro-native-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/metro.config.js', 'packages/mobile/metro-web-runtime-resolution.cjs', 'packages/mobile/expo-web-response-headers.cjs', 'packages/mobile/babel.config.js', 'packages/mobile/app.config.ts', 'patches/**') }}-
      - name: Metro bundle check
        env:
          TMPDIR: ${{ runner.temp }}/metro-native
        run: vp run check:mobile-bundle
      - name: Save Metro's native transform cache
        uses: actions/cache/save@v4
        # Only main writes the cache. PRs restore from the default-branch
        # lineage but never upload, so a PR can't poison the shared entry and
        # PR runs don't spend ~10s uploading 62 MB each. mobile-bundle runs on
        # every push to main, so the lineage stays fresh on its own.
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/metro-native
          key: metro-native-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/metro.config.js', 'packages/mobile/metro-web-runtime-resolution.cjs', 'packages/mobile/expo-web-response-headers.cjs', 'packages/mobile/babel.config.js', 'packages/mobile/app.config.ts', 'patches/**') }}-${{ github.sha }}
      # Same treatment for the Expo web export, in its own store so the two
      # bundle checks can't invalidate each other's entries.
      # BOARDSESH_EXPORT_KEEP_METRO_CACHE is honoured by
      # scripts/build-expo-web-export.sh: without it the export passes --clear,
      # which rm -rf's all 256 shards of the store (and would delete whatever we
      # just restored). scripts/mobile-web-bundle-check.sh already sets it on
      # its own call, so this is belt-and-braces: it keeps the reason the cache
      # steps exist next to the cache steps. Those two are the ONLY places it
      # may be set — Dockerfile.web and production-deploy.yml must keep --clear
      # plus their BOARDSESH_EXPORT_EXPECT_URLS assertion, because they bake
      # EXPO_PUBLIC_* values into a bundle somebody serves.
      - name: Prepare the Expo web Metro cache directory
        run: mkdir -p ${{ runner.temp }}/metro-web
      - name: Restore Metro's Expo-web transform cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/metro-web
          key: metro-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/web-runtime/pnpm-lock.yaml', 'packages/mobile/web-runtime/pnpm-workspace.yaml', 'packages/mobile/metro.config.js', 'packages/mobile/metro-web-runtime-resolution.cjs', 'packages/mobile/expo-web-response-headers.cjs', 'packages/mobile/babel.config.js', 'packages/mobile/app.config.ts', 'patches/**') }}-${{ github.sha }}
          restore-keys: |
            metro-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/web-runtime/pnpm-lock.yaml', 'packages/mobile/web-runtime/pnpm-workspace.yaml', 'packages/mobile/metro.config.js', 'packages/mobile/metro-web-runtime-resolution.cjs', 'packages/mobile/expo-web-response-headers.cjs', 'packages/mobile/babel.config.js', 'packages/mobile/app.config.ts', 'patches/**') }}-
      - name: Expo web bundle check
        env:
          TMPDIR: ${{ runner.temp }}/metro-web
          BOARDSESH_EXPORT_KEEP_METRO_CACHE: '1'
        run: vp run check:mobile-web-bundle
      - name: Save Metro's Expo-web transform cache
        uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/metro-web
          key: metro-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/mobile/web-runtime/pnpm-lock.yaml', 'packages/mobile/web-runtime/pnpm-workspace.yaml', 'packages/mobile/metro.config.js', 'packages/mobile/metro-web-runtime-resolution.cjs', 'packages/mobile/expo-web-response-headers.cjs', 'packages/mobile/babel.config.js', 'packages/mobile/app.config.ts', 'patches/**') }}-${{ github.sha }}

  # Builds Dockerfile.web — the image #3795 makes the www production artifact.
  # Nothing else in per-PR CI runs `next build` for web (e2e-tests.yml is
  # workflow_dispatch-only), so before this job a source change that broke the
  # production build reached main un-caught. Build only: no registry login, no
  # push, no attestation, no deploy. #4653.
  #
  # There is no `vp install` step on purpose. `vp run docker-context:web` is
  # `node scripts/create-service-docker-context.mjs web`, which imports node
  # builtins only, and every dependency the image needs is installed inside the
  # build. production-deploy.yml's build-backend job runs the same shape.
  docker-web:
    needs: [changes]
    if: needs.changes.outputs.dockerWeb == 'true'
    runs-on: ubuntu-latest
    # Measured on ubuntu-latest with a completely cold cache (`web-main` did not
    # exist yet): 4m09s for the job, of which the image build is 2m53s. The
    # 11m20s figure from branch-deploy.yml run 31797731863 is NOT the number to
    # plan against — that job also pushed ~225 MB of layers to GHCR and wrote a
    # 2.7 GB gha cache, and this one does neither. 30 minutes is deliberate slack
    # for a slow runner or a cold dependency bump, so a hang fails loud instead
    # of burning six hours.
    timeout-minutes: 30
    # Narrower than the workflow default: this job reads the repo and nothing
    # else. No `packages: write` — it never publishes the image it builds.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: docker/setup-buildx-action@v4

      - name: Generate the web Docker context
        run: vp run docker-context:web

      # Pre-build because it is the cheapest of the three checks and the one
      # whose failure mode is silent. next.config.mjs resolves the GraphQL SWC
      # plugin's `artifactDirectory` against the workspace root, not
      # packages/web; if that path is not in the generated context the plugin
      # no-ops and the bundle silently keeps the whole gql.ts Documents map.
      # The path is READ OUT of next.config.mjs rather than pinned here, so an
      # edit to it is checked against reality instead of against a second copy
      # of the same mistake.
      - name: Verify the GraphQL artifactDirectory resolves inside the context
        run: |
          set -euo pipefail
          artifact_directory=$(sed -n "s/.*artifactDirectory: *'\.\/\([^']*\)'.*/\1/p" packages/web/next.config.mjs)
          if [ -z "$artifact_directory" ]; then
            # Two different causes, so say both: the key is gone, or it no longer
            # uses the single-quoted './'-prefixed form this pattern matches.
            echo "::error file=packages/web/next.config.mjs::could not read artifactDirectory from next.config.mjs — either the swcPlugins entry is gone, or its value is no longer a single-quoted './'-prefixed path and this step's sed pattern needs updating"
            exit 1
          fi
          if [ ! -s ".docker-context/web/source/$artifact_directory/gql.ts" ]; then
            echo "::error file=packages/web/next.config.mjs::artifactDirectory '$artifact_directory' does not resolve inside the web Docker context; the GraphQL SWC plugin will silently no-op"
            exit 1
          fi
          echo "artifactDirectory OK: $artifact_directory/gql.ts is in the build context"

      # BASE_URL and NEXT_PUBLIC_WS_URL are baked into the client bundle, so
      # they are passed in production SHAPE to exercise the real code path. This
      # image is never pushed or served — do not treat these as deploy config.
      #
      # THERE IS NO `cache-to`, ON PURPOSE — do not add one back. This job must
      # never publish anything, which is what
      # scripts/__tests__/ci-docker-web-workflow.test.ts guards by asserting no
      # docker/login-action and no `packages: write`.
      #
      # `cache-from` reads the registry cache production-deploy.yml writes.
      # ghcr.io/boardsesh/boardsesh-web is a PUBLIC package, so BuildKit gets a
      # pull token anonymously and this job keeps its no-credentials property
      # (verified 2026-09-02: ghcr.io issues an anonymous bearer token for it and
      # /tags/list answers 200). It previously read `type=gha,scope=web-main` — a
      # scope nothing ever wrote, so a guaranteed miss and a fully cold 2m53s
      # build every run. Unlike the gha cache, this one also works for fork PRs.
      #
      # Expect somewhere between -40s and +10s, not a clear win: the cache hit
      # skips the dependency layer (47s) but pays to pull ~843 MB and unpack it,
      # because `next build` runs on top of that layer. Measure over ten runs
      # before assuming; reverting is one line.
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .docker-context/web
          file: .docker-context/web/Dockerfile
          push: false
          load: true
          tags: boardsesh-web:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_WS_URL=wss://ws.boardsesh.com/graphql
            BASE_URL=https://www.boardsesh.com
            # A constant, NOT github.sha. Dockerfile.web seds this into
            # app/api/health/build-release.ts, so a per-commit value invalidates
            # that layer and everything after it — including the 118s
            # `next build` — on every push. This image is only inspected by the
            # openapi check below and is never served, so it needs no real build
            # identity; it only needs to satisfy the 40-lowercase-hex validation.
            BOARDSESH_BUILD_RELEASE=0000000000000000000000000000000000000000
          cache-from: type=registry,ref=ghcr.io/boardsesh/boardsesh-web:buildcache-main

      # public/openapi.json is gitignored and written by the `generate:openapi`
      # half of packages/web's build script, so its presence in the image is
      # real proof that step ran. Parsing it and counting paths is the
      # assertion: an empty or truncated document passes `test -s`. `node` is in
      # the runner image.
      - name: Verify the generated OpenAPI document shipped in the image
        run: |
          docker run --rm --entrypoint sh boardsesh-web:ci-${{ github.sha }} -c '
            set -eu
            openapi_path=/app/packages/web/public/openapi.json
            test -s "$openapi_path" || { echo "::error::$openapi_path missing from the image"; exit 1; }
            node -e "
              const spec = require(process.argv[1]);
              const routeCount = Object.keys(spec.paths ?? {}).length;
              if (routeCount === 0) throw new Error(\"openapi.json has no paths\");
              console.log(\"openapi OK: \" + routeCount + \" paths\");
            " "$openapi_path"
          '

  commit-lint:
    needs: [changes]
    # Conventional Commit gate. The PR TITLE is the authoritative hard check — it's
    # the merge/squash subject and the source of the changelog category. The
    # per-commit range check is ADVISORY (continue-on-error): the repo uses merge
    # commits, so intermediate WIP/fixup commits land on main verbatim and much of
    # the existing history is non-conventional — blocking on it would red most PRs.
    # The local commit-msg hook nudges new commits toward the convention.
    # Also gate on mobile/mobileDeps so the PR-title check runs whenever the
    # release-notes job does — a non-JS mobile/shared change still produces a
    # changelog entry whose category comes from the (conventional) PR title.
    if: needs.changes.outputs.anyJs == 'true' || needs.changes.outputs.rootCi == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.mobileDeps == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=50 origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Lint PR title (hard gate)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The PR title is the merge/squash subject and the source of the changelog
          # category, so it must be conventional. This is the blocking check.
          vp run check:commit-message -- --pr-title "$PR_TITLE"
      - name: Lint PR commit subjects (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Surface non-conventional commits without blocking the merge (see job note).
          vp run check:commit-message -- --range "origin/$BASE_REF..HEAD"
      - name: Lint commit subjects (push, advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # On a normal push, github.event.before is the previous tip; validate the
          # newly pushed commits. On a branch's first push it can be all-zeros — fall
          # back to just the head commit to avoid an unbounded range.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            vp run check:commit-message -- --range "$HEAD_SHA~1..$HEAD_SHA"
          else
            vp run check:commit-message -- --range "$BEFORE_SHA..$HEAD_SHA"
          fi

  release-notes:
    needs: [changes]
    # PR-only. Gated on the mobile dependency closure: those PRs ship via OTA, so they
    # must carry user-facing Release Notes (escape hatch: the skip-changelog
    # label, or `none` under the heading).
    if: github.event_name == 'pull_request' && (needs.changes.outputs.mobile == 'true' || needs.changes.outputs.mobileDeps == 'true')
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check PR has Release Notes
        env:
          # Write the body to a file (via env, not interpolated into the script) so
          # a markdown body with backticks/quotes can't break the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.txt
          vp run check:release-notes -- --body-file pr-body.txt

  changelog-owned:
    needs: [changes]
    # The Mobile OTA Production workflow is the SOLE writer of
    # changelog.generated.json — it regenerates and pushes it on every publish. A
    # PR must never hand-edit it (that would fight the OTA bot and could revert
    # shipped entries). Fail if a PR touches the file.
    if: github.event_name == 'pull_request' && needs.changes.outputs.changelogData == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 2
    steps:
      - name: Reject manual changelog edits
        run: |
          echo "::error::The changelog files (packages/mobile/src/data/changelog.generated.json and CHANGELOG.md) are owned by the Mobile OTA Production workflow (it regenerates and pushes them on every OTA). Revert your change — they're generated from PR Release Notes, never edited in a PR."
          exit 1

  test-report:
    needs: [test-default, test-backend, test-ocr, test-location-sync-integration]
    # Only post a report when at least one test job actually ran. If all four
    # were skipped (e.g. an i18n-catalog-only PR), there's nothing to
    # download — actions/download-artifact errors on missing artifacts, so we
    # skip the whole job instead of swallowing the failure.
    if: |
      always() && github.event_name == 'pull_request' && (
        needs.test-default.result != 'skipped' ||
        needs.test-backend.result != 'skipped' ||
        needs.test-ocr.result != 'skipped' ||
        needs.test-location-sync-integration.result != 'skipped'
      )
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
      - name: Publish test report
        uses: turing85/publish-report@v2
        with:
          comment-header: ci-tests
          comment-enabled: 'true'
          report-name: CI Tests
          report-path: 'test-results/**/*.xml'
          report-reporter: java-junit
          report-fail-on-error: false

  ci-status:
    needs:
      - changes
      - lint
      - typecheck
      - db-migrations
      - codegen-drift
      - board-render-version
      - board-art-geometry
      - i18n
      - test-default
      - test-backend
      - test-ocr
      - test-location-sync-integration
      - mobile-bundle
      - docker-web
      - commit-lint
      - release-notes
      - changelog-owned
      - deploy-config
      - listing-guards
      - rest-surface
      - pg18-artifacts
      - renderer-rust
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Pass when every needed job is either `success` or `skipped` (skipped
          # means a gated job correctly opted out for this change set). Fail on
          # `failure` or `cancelled`.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$bad" ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$bad"
            exit 1
          fi
          echo "All required jobs passed (or were correctly skipped)."
