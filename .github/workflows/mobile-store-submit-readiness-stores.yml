name: Merge-back Readiness (stores)

# On a merge-back PR (release/next into main), asks both stores, GET-only, whether
# the automatic submission (mobile-store-submit.yml) could go ahead right now:
# no other iOS version waiting for or in App Review, no Play review in progress
# on production or open testing, and an App Store version for the train version
# with its screenshots and locales in place. Its companion,
# mobile-store-submit-readiness.yml, checks the build pair and release notes.
# Marco can make either a required check.
#
# Why pull_request_target. Store credentials live in the Production environment,
# whose branch policy allows main and release/next. A pull_request run's ref is
# refs/pull/<n>/merge, which that policy rejects, and a pull_request run executes
# PR code, which must never see those credentials. pull_request_target runs this
# file and its tooling from main (the base branch), so the environment admits it.
#
# Security rules for this file, all load-bearing:
#   - It never checks out, installs or runs the PR's code. The only checkout is
#     main. The PR head is fetched as git objects and read as data: the version
#     line of app.config.ts (validated as x.y.z), a diff of the release-note
#     paths, and tag names.
#   - It only runs for this repository's own release/next branch. A fork can
#     open a PR from a branch with the same name, and pull_request_target would
#     otherwise hand it these credentials.
#   - Every store call is a GET. The token is read-only.
#   - Nothing from the PR is interpolated into a script: values pass through env.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: merge-back-readiness-stores-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gh pr list: the previous merge-back

jobs:
  stores:
    name: Stores can take the submission
    if: github.event.pull_request.head.ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_DISABLE_ANIMATION: '1'
    steps:
      # main, not the PR: pull_request_target's default checkout is the base branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No workspace install and no node_modules cache: the scripts below import
      # only Node builtins, run through a pinned tsx (the lockfile's version).
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'

      # Caches gems from main's Gemfile.lock only; nothing from the PR is installed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: fastlane
      - name: Install fastlane gems
        working-directory: fastlane
        run: |
          bundle config set --local path "$PWD/vendor/bundle"
          bundle config set --local deployment true
          bundle install --jobs 4

      # Reads the PR head as data: its version line, the release-note diff, and
      # tag names. Nothing from it runs.
      - name: Version, release notes and Android builds of the train
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Unexpected head SHA.'; exit 1; }
          vp dlx tsx@4.23.12 scripts/mobile-store-submit-target.ts --candidate "$HEAD_SHA"

      - name: Ask both stores
        env:
          VERSION: ${{ steps.facts.outputs.version }}
          IOS_BUILD_NUMBER: ${{ steps.facts.outputs.ios_build_number }}
          ANDROID_VERSION_CODES: ${{ steps.facts.outputs.android_version_codes }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY_BASE64" ] || { echo '::error::Missing ASC credentials'; exit 1; }
          ASC_KEY_PATH=$(mktemp "$RUNNER_TEMP/boardsesh-readiness-key.XXXXXX.p8")
          export ASC_KEY_PATH
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          chmod 600 "$ASC_KEY_PATH"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          export RELEASE_VERSION="$VERSION"
          failed=0
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          say "### Can the stores take $VERSION now?"

          # iOS: one app version in review at a time.
          (cd fastlane && STORE_SUBMISSION_STATUS_OUTPUT="$RUNNER_TEMP/ios-status.json" bundle exec fastlane ios submission_status)
          ios_status="$(jq -r '.status' "$RUNNER_TEMP/ios-status.json")"
          ios_reason="$(jq -r '.reason' "$RUNNER_TEMP/ios-status.json")"
          case "$ios_status" in
            pending) say "- ✅ iOS: $ios_reason" ;;
            done|superseded) say "- ⚠️ iOS: $ios_reason" ;;
            *) say "- ❌ iOS: $ios_reason"; failed=1 ;;
          esac

          # The App Store version the submission would plan: locales, screenshot
          # sets, processing. The merge-back's draft attaches the newest build, but
          # it does not attach screenshots, so the version has to have them already.
          if [ "$ios_status" = pending ]; then
            if [ -z "$IOS_BUILD_NUMBER" ]; then
              say "- ❌ iOS: no uploaded build of $VERSION to check against."
              failed=1
            else
              audit_status=0
              (cd fastlane && IOS_BUILD_NUMBER="$IOS_BUILD_NUMBER" STORE_AUDIT_OUTPUT="$RUNNER_TEMP/ios-audit.json" bundle exec fastlane ios audit surfaces:default) || audit_status=$?
              if [ ! -f "$RUNNER_TEMP/ios-audit.json" ]; then
                say "- ❌ iOS: could not read the App Store version (audit exit $audit_status)."
                failed=1
              elif [ "$(jq '.version == null' "$RUNNER_TEMP/ios-audit.json")" = true ]; then
                say "- ❌ iOS: App Store Connect has no $VERSION version, so it has no screenshots either. Run Mobile Store Draft Submission on release/next first."
                failed=1
              else
                jq -r --arg build "$IOS_BUILD_NUMBER" '.identityErrors[] | "- ℹ️ iOS: " + . + " (the merge-back draft attaches build " + $build + ")."' "$RUNNER_TEMP/ios-audit.json" >> "$GITHUB_STEP_SUMMARY"
                issues="$(jq '.readinessIssues | length' "$RUNNER_TEMP/ios-audit.json")"
                if [ "$issues" != 0 ]; then
                  jq -r '.readinessIssues[] | "- ❌ iOS: " + .' "$RUNNER_TEMP/ios-audit.json" >> "$GITHUB_STEP_SUMMARY"
                  failed=1
                else
                  say "- ✅ iOS: $VERSION has every locale and screenshot set in place."
                fi
              fi
            fi
          fi

          # Android: Play's review lock is package-wide.
          STORE_SUBMIT_ANDROID_OUTPUT="$RUNNER_TEMP/android-status.json" vp dlx tsx@4.23.12 scripts/mobile-store-submit-android.ts --status
          android_status="$(jq -r '.status' "$RUNNER_TEMP/android-status.json")"
          android_reason="$(jq -r '.reason' "$RUNNER_TEMP/android-status.json")"
          case "$android_status" in
            pending) say "- ✅ Android: $android_reason" ;;
            done|superseded) say "- ⚠️ Android: $android_reason" ;;
            *) say "- ❌ Android: $android_reason"; failed=1 ;;
          esac

          if [ "$failed" != 0 ]; then
            echo "::error::A store cannot take $VERSION right now; see the run summary. After the merge the submission retries hourly, but fix these first if you can."
            exit 1
          fi
