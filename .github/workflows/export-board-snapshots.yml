name: Export Board Snapshots

# The homelab batch worker owns nightly and live exports. Actions is ONLY an
# isolated, complete R2 rehearsal while that worker still publishes to Tigris.
# This operator gate is not a cross-system lock: before worker R2 cutover, set
# SNAPSHOT_PUBLISHER_STORAGE_TARGET=r2, disable this workflow, and drain its runs.
on:
  workflow_dispatch:
    inputs:
      storage_target:
        description: 'Complete R2 migration rehearsal; the active producer must still use Tigris.'
        type: choice
        options:
          - r2
        default: r2

concurrency:
  group: export-board-snapshots
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      SNAPSHOT_PUBLIC_BASE_URL: https://snapshots.boardsesh.com
      SYNC_STABILITY_WINDOW_SECONDS: ${{ vars.SYNC_STABILITY_WINDOW_SECONDS }}
    steps:
      - name: Validate isolated R2 rehearsal
        env:
          STORAGE_TARGET: ${{ inputs.storage_target }}
          SNAPSHOT_PUBLISHER_STORAGE_TARGET: ${{ vars.SNAPSHOT_PUBLISHER_STORAGE_TARGET }}
          SNAPSHOTS_R2_AWS_ENDPOINT_URL: ${{ secrets.SNAPSHOTS_R2_AWS_ENDPOINT_URL }}
          SNAPSHOTS_R2_AWS_ACCESS_KEY_ID: ${{ secrets.SNAPSHOTS_R2_AWS_ACCESS_KEY_ID }}
          SNAPSHOTS_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOTS_R2_AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ "$STORAGE_TARGET" != 'r2' ] || [ "$SNAPSHOT_PUBLISHER_STORAGE_TARGET" != 'tigris' ]; then
            echo '::error::Rehearsal requires storage_target=r2 and Production variable SNAPSHOT_PUBLISHER_STORAGE_TARGET=tigris. Never run alongside an R2 worker.'
            exit 1
          fi
          for required_name in SNAPSHOTS_R2_AWS_ENDPOINT_URL SNAPSHOTS_R2_AWS_ACCESS_KEY_ID SNAPSHOTS_R2_AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!required_name}" ]; then
              echo "::error::Missing Production secret: $required_name"
              exit 1
            fi
          done
          node -e '
            const raw = process.env.SNAPSHOTS_R2_AWS_ENDPOINT_URL ?? "";
            let endpoint;
            try { endpoint = new URL(raw); } catch { process.exitCode = 1; }
            if (!endpoint || endpoint.protocol !== "https:" || !/^[a-z0-9]+\.r2\.cloudflarestorage\.com$/.test(endpoint.hostname) ||
                endpoint.username || endpoint.password || endpoint.port || endpoint.pathname !== "/" || endpoint.search || endpoint.hash) {
              console.error("::error::SNAPSHOTS_R2_AWS_ENDPOINT_URL must be an HTTPS Cloudflare R2 account endpoint.");
              process.exitCode = 1;
            }
          '

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Capture trusted coverage before export
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 --max-filesize 2097152 \
            'https://boardsesh-board-snapshots.t3.tigrisfiles.io/board-snapshots/v1-gzip/manifest.json' \
            -o "$RUNNER_TEMP/snapshot-expected-manifest.json"
          printf 'SNAPSHOT_VERIFY_BUILT_AFTER=%s\n' "$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_ENV"

      # The database must be the primary: a replica can publish watermarks ahead
      # of rows present in its transaction snapshot. Credentials are step-scoped.
      - name: Export board snapshots (identity → board-snapshots/v1)
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOTS_S3_BUCKET_NAME: boardsesh-board-snapshots
          SNAPSHOTS_AWS_ACCESS_KEY_ID: ${{ secrets.SNAPSHOTS_R2_AWS_ACCESS_KEY_ID }}
          SNAPSHOTS_AWS_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOTS_R2_AWS_SECRET_ACCESS_KEY }}
          SNAPSHOTS_AWS_ENDPOINT_URL: ${{ secrets.SNAPSHOTS_R2_AWS_ENDPOINT_URL }}
          SNAPSHOTS_AWS_REGION: auto
          SNAPSHOTS_PUBLIC_BASE_URL: https://snapshots.boardsesh.com
        run: vp exec tsx src/scripts/export-board-snapshots.ts --no-prune

      - name: Export board snapshots (gzip → board-snapshots/v1-gzip)
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOTS_S3_BUCKET_NAME: boardsesh-board-snapshots
          SNAPSHOTS_AWS_ACCESS_KEY_ID: ${{ secrets.SNAPSHOTS_R2_AWS_ACCESS_KEY_ID }}
          SNAPSHOTS_AWS_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOTS_R2_AWS_SECRET_ACCESS_KEY }}
          SNAPSHOTS_AWS_ENDPOINT_URL: ${{ secrets.SNAPSHOTS_R2_AWS_ENDPOINT_URL }}
          SNAPSHOTS_AWS_REGION: auto
          SNAPSHOTS_PUBLIC_BASE_URL: https://snapshots.boardsesh.com
        run: vp exec tsx src/scripts/export-board-snapshots.ts --gzip --key-prefix board-snapshots/v1-gzip --no-prune

      - name: Export board catalogue (gzip → board-snapshots/v1-catalog)
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOTS_S3_BUCKET_NAME: boardsesh-board-snapshots
          SNAPSHOTS_AWS_ACCESS_KEY_ID: ${{ secrets.SNAPSHOTS_R2_AWS_ACCESS_KEY_ID }}
          SNAPSHOTS_AWS_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOTS_R2_AWS_SECRET_ACCESS_KEY }}
          SNAPSHOTS_AWS_ENDPOINT_URL: ${{ secrets.SNAPSHOTS_R2_AWS_ENDPOINT_URL }}
          SNAPSHOTS_AWS_REGION: auto
          SNAPSHOTS_PUBLIC_BASE_URL: https://snapshots.boardsesh.com
        run: vp exec tsx src/scripts/export-board-catalog.ts --no-prune

      - name: Verify every R2 artifact through the public domain
        timeout-minutes: 30
        env:
          SNAPSHOTS_S3_BUCKET_NAME: boardsesh-board-snapshots
          SNAPSHOTS_AWS_ACCESS_KEY_ID: ${{ secrets.SNAPSHOTS_R2_AWS_ACCESS_KEY_ID }}
          SNAPSHOTS_AWS_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOTS_R2_AWS_SECRET_ACCESS_KEY }}
          SNAPSHOTS_AWS_ENDPOINT_URL: ${{ secrets.SNAPSHOTS_R2_AWS_ENDPOINT_URL }}
          SNAPSHOTS_AWS_REGION: auto
          SNAPSHOTS_PUBLIC_BASE_URL: https://snapshots.boardsesh.com
        run: >-
          vp run storage:verify-snapshots --
          --expected-manifest "$RUNNER_TEMP/snapshot-expected-manifest.json"
          --built-after "$SNAPSHOT_VERIFY_BUILT_AFTER"
