name: Export Board Snapshots

# Before homelab cutover, GitHub remains the primary scheduler. After the
# SNAPSHOT_HOMELAB_EXPORT_ENABLED repository variable is set to `true`, the old
# schedules no-op and GitHub checks the latest successful publisher heartbeats. It
# falls back to Railway only when refresh (>45m) or full (>30h) is stale.
on:
  schedule:
    - cron: '15 7 * * *' # legacy/full schedule; homelab owns this after cutover
    # Leave the 07:00 UTC hour clear for the daily full run. GitHub concurrency
    # retains only one pending run, so a later refresh could otherwise replace
    # a full export waiting behind the 06:52 refresh.
    - cron: '7,22,37,52 0-6,8-23 * * *' # legacy/threshold schedule
    - cron: '12,27,42,57 * * * *' # post-cutover heartbeat watchdog
  workflow_dispatch:
    inputs:
      gzip_only:
        description: 'Skip the identity (v1) pass; only refresh the gzip (v1-gzip) artifacts'
        type: boolean
        default: false
      board:
        description: 'Limit both passes to one board type (e.g. kilter). Blank = all boards.'
        required: false
        default: ''
      layout:
        description: 'Limit both passes to one layout id (needs a board). Blank = all layouts.'
        required: false
        default: ''
      refresh_threshold:
        description: 'Live gzip only: rebuild layouts with at least this many rows after the manifest watermark. Blank = full export.'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

env:
  SNAPSHOT_PUBLIC_BASE_URL: https://boardsesh-board-snapshots.t3.tigrisfiles.io

jobs:
  # Safe rollout path: until the homelab flag flips, preserve the existing
  # source-checkout scheduler. workflow_dispatch always remains available as an
  # explicit operator fallback, including filtered repairs. Once the fence flag
  # is enabled, every run takes the primary session fence. Manual/legacy runs do
  # not publish watchdog heartbeats because they are not the pinned homelab
  # exporter image.
  legacy-or-manual-export:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          vars.SNAPSHOT_HOMELAB_EXPORT_ENABLED != 'true' &&
          github.event_name == 'schedule' &&
          (
            github.event.schedule == '15 7 * * *' ||
            github.event.schedule == '7,22,37,52 0-6,8-23 * * *'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level, not workflow-level: schedule ticks whose feature-gated job is
    # skipped must not consume/replace the one pending mutating export.
    # Actions has no supported FIFO/`queue: max` setting: the newest pending
    # threshold scan intentionally replaces an older one. The refresh-free
    # 07:00 UTC hour prevents that policy from displacing the daily full run.
    # TODO(#4475 review, finding 7): job-level concurrency still lets a newer
    # trigger displace a queued run — the exact warning the deleted `queue: max`
    # comment carried. Revisit the queueing semantics after the homelab cutover.
    concurrency:
      group: export-board-snapshots
      cancel-in-progress: false
    environment: Production
    env:
      SYNC_STABILITY_WINDOW_SECONDS: ${{ vars.SYNC_STABILITY_WINDOW_SECONDS }}
      SNAPSHOT_PRIMARY_FENCE_ENABLED: ${{ vars.SNAPSHOT_PRIMARY_FENCE_ENABLED }}
      SNAPSHOT_HOMELAB_EXPORT_ENABLED: ${{ vars.SNAPSHOT_HOMELAB_EXPORT_ENABLED }}
      # The fenced export refuses to publish once its cutoff ages past this, so
      # the manual/legacy path needs the same tuning knob the watchdog's docker
      # runs get — otherwise the repository variable cannot reach it.
      SNAPSHOT_MAX_CUTOFF_AGE_SECONDS: ${{ vars.SNAPSHOT_MAX_CUTOFF_AGE_SECONDS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export board snapshots (identity → board-snapshots/v1)
        if: >-
          ${{
            (github.event_name == 'schedule' && github.event.schedule == '15 7 * * *') ||
            (github.event_name == 'workflow_dispatch' && inputs.gzip_only != true && inputs.refresh_threshold == '')
          }}
        working-directory: packages/backend
        env:
          BOARD: ${{ inputs.board }}
          LAYOUT: ${{ inputs.layout }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL_S3 || secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION }}
        run: |
          if [ "$SNAPSHOT_HOMELAB_EXPORT_ENABLED" = 'true' ] && [ "$SNAPSHOT_PRIMARY_FENCE_ENABLED" != 'true' ]; then
            echo "Manual export is disabled until SNAPSHOT_PRIMARY_FENCE_ENABLED=true" >&2
            exit 1
          fi
          args=(--source=primary)
          if [ "$SNAPSHOT_PRIMARY_FENCE_ENABLED" = 'true' ]; then args+=(--fence); fi
          if [ -n "$BOARD" ]; then args+=("--board=$BOARD"); fi
          if [ -n "$LAYOUT" ]; then args+=("--layout=$LAYOUT"); fi
          node --import tsx src/scripts/export-board-snapshots.ts "${args[@]}"

      - name: Export board snapshots (gzip → board-snapshots/v1-gzip)
        working-directory: packages/backend
        env:
          BOARD: ${{ inputs.board }}
          LAYOUT: ${{ inputs.layout }}
          REFRESH_THRESHOLD: ${{ github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 0-6,8-23 * * *' && '500' || inputs.refresh_threshold }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL_S3 || secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION }}
        run: |
          if [ "$SNAPSHOT_HOMELAB_EXPORT_ENABLED" = 'true' ] && [ "$SNAPSHOT_PRIMARY_FENCE_ENABLED" != 'true' ]; then
            echo "Manual export is disabled until SNAPSHOT_PRIMARY_FENCE_ENABLED=true" >&2
            exit 1
          fi
          args=(--source=primary --gzip --key-prefix board-snapshots/v1-gzip)
          if [ "$SNAPSHOT_PRIMARY_FENCE_ENABLED" = 'true' ]; then args+=(--fence); fi
          if [ -n "$BOARD" ]; then args+=("--board=$BOARD"); fi
          if [ -n "$LAYOUT" ]; then args+=("--layout=$LAYOUT"); fi
          if [ -n "$REFRESH_THRESHOLD" ]; then args+=("--refresh-threshold=$REFRESH_THRESHOLD"); fi
          node --import tsx src/scripts/export-board-snapshots.ts "${args[@]}"

  # The watchdog uses the exact backend image digest that the homelab timer
  # runs. It never promotes Postgres. A stale/missing/invalid heartbeat only
  # authorizes a bounded primary export, trading temporary Railway egress for
  # snapshot freshness.
  homelab-watchdog:
    if: >-
      ${{
        vars.SNAPSHOT_HOMELAB_EXPORT_ENABLED == 'true' &&
        github.event_name == 'schedule' &&
        github.event.schedule == '12,27,42,57 * * * *'
      }}
    runs-on: ubuntu-latest
    # Both full-fallback passes acquire a fresh fence and refuse to publish once
    # its cutoff exceeds 10 minutes. A 45-minute ceiling leaves overhead for the
    # two bounded passes without letting a wedged job hold shared concurrency for
    # 90 minutes. Rehearse this ceiling if the cutoff-age gate is ever loosened.
    timeout-minutes: 45
    concurrency:
      group: export-board-snapshots
      cancel-in-progress: false
      # The running job is never cancelled. Actions keeps one pending run, so a
      # newer watchdog may replace only that queued run; it checks the same
      # mutable heartbeat objects at a later, more useful point in time.
    environment: Production
    env:
      SNAPSHOT_EXPORTER_IMAGE_DIGEST: ${{ vars.SNAPSHOT_EXPORTER_IMAGE_DIGEST }}
      SNAPSHOT_PRIMARY_FENCE_ENABLED: ${{ vars.SNAPSHOT_PRIMARY_FENCE_ENABLED }}
      SNAPSHOT_MAX_CUTOFF_AGE_SECONDS: ${{ vars.SNAPSHOT_MAX_CUTOFF_AGE_SECONDS }}
      SYNC_STABILITY_WINDOW_SECONDS: ${{ vars.SYNC_STABILITY_WINDOW_SECONDS }}
    steps:
      # TODO(#4475 review, finding 7): all 96 daily ticks pull the full backend
      # image even though the healthy path only reads three public JSON objects.
      - name: Pull immutable exporter image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$SNAPSHOT_PRIMARY_FENCE_ENABLED" != 'true' ]; then
            echo "SNAPSHOT_PRIMARY_FENCE_ENABLED must be true before homelab cutover" >&2
            exit 1
          fi
          if [[ ! "$SNAPSHOT_EXPORTER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "SNAPSHOT_EXPORTER_IMAGE_DIGEST must be an exact sha256 digest" >&2
            exit 1
          fi
          image="ghcr.io/boardsesh/boardsesh-backend@$SNAPSHOT_EXPORTER_IMAGE_DIGEST"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Check snapshot publisher heartbeats
        id: heartbeat
        env:
          EXPORTER_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          decision="$(docker run --rm \
            -e SNAPSHOT_PUBLIC_BASE_URL \
            -e SNAPSHOT_EXPORTER_IMAGE_DIGEST \
            -e SNAPSHOT_MAX_CUTOFF_AGE_SECONDS \
            "$EXPORTER_IMAGE" \
            node --import tsx src/scripts/snapshot-heartbeat-watchdog.ts)"
          echo "$decision" | jq .
          refresh_stale="$(jq -er \
            '.refresh.stale | if type == "boolean" then tostring else error("refresh.stale must be boolean") end' \
            <<<"$decision")"
          full_stale="$(jq -er \
            '.full.stale | if type == "boolean" then tostring else error("full.stale must be boolean") end' \
            <<<"$decision")"
          # Reasons include fetch/parser errors derived from public objects. Keep
          # arbitrary newlines out of GITHUB_OUTPUT by carrying them as base64.
          refresh_reason_b64="$(jq -er \
            '.refresh.reason | if type == "string" then @base64 else error("refresh.reason must be a string") end' \
            <<<"$decision")"
          full_reason_b64="$(jq -er \
            '.full.reason | if type == "string" then @base64 else error("full.reason must be a string") end' \
            <<<"$decision")"
          {
            printf 'refresh_stale=%s\n' "$refresh_stale"
            printf 'full_stale=%s\n' "$full_stale"
            printf 'refresh_reason_b64=%s\n' "$refresh_reason_b64"
            printf 'full_reason_b64=%s\n' "$full_reason_b64"
          } >> "$GITHUB_OUTPUT"

      - name: Fall back to Railway primary
        id: fallback
        if: steps.heartbeat.outputs.refresh_stale == 'true' || steps.heartbeat.outputs.full_stale == 'true'
        env:
          EXPORTER_IMAGE: ${{ steps.image.outputs.image }}
          FULL_STALE: ${{ steps.heartbeat.outputs.full_stale }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL_S3 || secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION }}
        run: |
          common_env=(
            -e DATABASE_URL
            -e DATABASE_DIRECT_URL
            -e AWS_S3_BUCKET_NAME
            -e AWS_ACCESS_KEY_ID
            -e AWS_SECRET_ACCESS_KEY
            -e AWS_ENDPOINT_URL
            -e AWS_DEFAULT_REGION
            -e SNAPSHOT_PUBLIC_BASE_URL
            -e SNAPSHOT_EXPORTER_IMAGE_DIGEST
            -e SNAPSHOT_MAX_CUTOFF_AGE_SECONDS
            -e SYNC_STABILITY_WINDOW_SECONDS
          )

          if [ "$FULL_STALE" = 'true' ]; then
            # Match the homelab full-run contract: identity first, then the live
            # gzip pass which publishes both heartbeats. If gzip fails, no
            # partial-success marker is trusted; retrying identity is harmless
            # and safer than inferring completion from mutable artifacts. The
            # two prefixes are independent publications, so each invocation
            # acquires and proves its own primary fence.
            docker run --rm "${common_env[@]}" "$EXPORTER_IMAGE" \
              node --import tsx src/scripts/export-board-snapshots.ts --source=primary --fence
            docker run --rm "${common_env[@]}" "$EXPORTER_IMAGE" \
              node --import tsx src/scripts/export-board-snapshots.ts \
              --source=primary --fence --gzip --key-prefix board-snapshots/v1-gzip --heartbeat
          else
            docker run --rm "${common_env[@]}" "$EXPORTER_IMAGE" \
              node --import tsx src/scripts/export-board-snapshots.ts \
              --source=primary --fence --gzip --key-prefix board-snapshots/v1-gzip \
              --refresh-threshold=500 --heartbeat
          fi

      - name: Notify snapshot watchdog failure or fallback
        if: >-
          ${{
            always() &&
            (
              steps.image.outcome != 'success' ||
              steps.heartbeat.outcome != 'success' ||
              steps.heartbeat.outputs.refresh_stale == 'true' ||
              steps.heartbeat.outputs.full_stale == 'true'
            )
          }}
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          IMAGE_OUTCOME: ${{ steps.image.outcome || 'not-run' }}
          HEARTBEAT_OUTCOME: ${{ steps.heartbeat.outcome || 'not-run' }}
          REFRESH_STALE: ${{ steps.heartbeat.outputs.refresh_stale || 'not-checked' }}
          FULL_STALE: ${{ steps.heartbeat.outputs.full_stale || 'not-checked' }}
          REFRESH_REASON_B64: ${{ steps.heartbeat.outputs.refresh_reason_b64 }}
          FULL_REASON_B64: ${{ steps.heartbeat.outputs.full_reason_b64 }}
          FALLBACK_OUTCOME: ${{ steps.fallback.outcome || 'not-run' }}
        run: |
          if [ -z "$DISCORD_DEPLOY_WEBHOOK" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK is required so a Railway fallback cannot be silent" >&2
            exit 1
          fi

          decode_reason() {
            local encoded="$1"
            if [ -z "$encoded" ]; then
              printf '%s' 'not checked'
              return
            fi
            local decoded
            if ! decoded="$(printf '%s' "$encoded" | base64 --decode 2>/dev/null)"; then
              printf '%s' 'invalid encoded watchdog reason'
              return
            fi
            printf '%s' "$decoded"
          }

          refresh_reason="$(decode_reason "$REFRESH_REASON_B64")"
          full_reason="$(decode_reason "$FULL_REASON_B64")"
          if [ "$IMAGE_OUTCOME" != 'success' ]; then
            fallback_summary="not attempted (exporter image step: $IMAGE_OUTCOME)"
          elif [ "$HEARTBEAT_OUTCOME" != 'success' ]; then
            fallback_summary="not attempted (heartbeat check: $HEARTBEAT_OUTCOME)"
          elif [ "$REFRESH_STALE" = 'true' ] || [ "$FULL_STALE" = 'true' ]; then
            if [ "$FALLBACK_OUTCOME" = 'not-run' ] || [ "$FALLBACK_OUTCOME" = 'skipped' ]; then
              fallback_summary="not attempted despite a stale decision ($FALLBACK_OUTCOME)"
            else
              fallback_summary="$FALLBACK_OUTCOME"
            fi
          else
            fallback_summary="not required"
          fi

          payload="$(jq -n \
            --arg refresh "$refresh_reason" \
            --arg full "$full_reason" \
            --arg refreshStale "$REFRESH_STALE" \
            --arg fullStale "$FULL_STALE" \
            --arg fallback "$fallback_summary" \
            --arg image "$IMAGE_OUTCOME" \
            --arg heartbeat "$HEARTBEAT_OUTCOME" \
            '{content: ("Board snapshot watchdog needs attention. Railway fallback: " + $fallback + "\nimage: " + $image + "\nheartbeat check: " + $heartbeat + "\nrefresh (stale=" + $refreshStale + "): " + $refresh + "\nfull (stale=" + $fullStale + "): " + $full)}')"
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$DISCORD_DEPLOY_WEBHOOK"
