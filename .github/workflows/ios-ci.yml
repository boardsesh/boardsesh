name: iOS CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/mobile/**'
      - '.github/workflows/ios-ci.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'mobile/**'
      - 'packages/mobile/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    env:
      WORKSPACE_PATH: mobile/ios/App/App.xcworkspace
      SCHEME: App

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          node-version: 'lts'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mobile/ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Node.js dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Sync Capacitor iOS project
        working-directory: mobile
        run: bunx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios/App
        run: pod install

      - name: Resolve simulator destination
        id: simulator
        run: |
          # Pick the first booted iPhone, or boot one from the latest available runtime
          DEVICE_NAME=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in data['devices'][runtime]:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['name'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "device=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE_NAME"

      - name: Build for testing (compiler check)
        run: |
          xcodebuild build-for-testing \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }},OS=latest'
