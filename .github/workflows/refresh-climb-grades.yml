name: Refresh Climb Grades

# Nightly: recompute the Boardsesh v2 grade (empirical-Bayes crowd mean plus
# capped Stage 2 de-herding, rater, behavior, angle, and cross-board evidence)
# into board_climb_grades. Validation gates run first and abort the run — no
# coefficients, gate results, or grades are written on a gate failure.
# Coefficients refit weekly, frozen in between. Idempotent.
# Model spec: docs/boardsesh-grade.md.
on:
  schedule:
    - cron: '30 6 * * *' # 06:30 UTC daily, after the recommendations refresh
  workflow_dispatch:
    inputs:
      refit:
        description: 'Force a coefficient refit'
        type: boolean
        default: false
      dry_run:
        description: 'Gates only, write no coefficients, gate results, or grades'
        type: boolean
        default: false

concurrency:
  group: refresh-climb-grades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DATABASE_URL must be a WRITABLE connection.
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: '22.x'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Connect to the private production database network
        uses: ./.github/actions/connect-production-db
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          forwarder-host: ${{ vars.POSTGRES_FORWARDER_HOST }}
          database-url: ${{ secrets.CLIMB_GRADES_DATABASE_DIRECT_URL }}
          expected-role: boardsesh_climb_grades_refresh

      - name: Refresh climb grades
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.CLIMB_GRADES_DATABASE_DIRECT_URL }}
        run: >-
          node --import tsx scripts/refresh-climb-grades.ts
          ${{ inputs.refit && '--refit-coefficients' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
