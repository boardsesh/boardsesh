name: Railway redeploy
description: >
  Repoint a Railway service at the GHCR tag this run just moved, wait for the
  new deployment to reach SUCCESS, and restore the captured previous deployment
  only while the exact new identity remains safe to fence. Factored out of
  production-deploy.yml when the web service joined the backend on Railway, so
  the two services cannot drift in how they promote, poll, or recover.

# The caller MUST `actions/checkout` before using this action: the poll shells
# out to `node scripts/railway-deployment-status.mjs`, which lives in the repo.
#
# `railway-token` is an input rather than a `secrets.` read because composite
# actions cannot access `secrets` — the caller passes it through.
inputs:
  service-id:
    description: 'Railway service id to redeploy. Empty fails the step rather than redeploying nothing.'
    required: true
  railway-token:
    description: 'Production-environment Railway project token passed by the caller.'
    required: true
  expected-image:
    description: 'Exact configured Railway image source expected before and after redeploy.'
    required: true
  service-label:
    description: 'Human name for this service in log lines ("web", "backend").'
    required: false
    default: service
outputs:
  previous_deployment_id:
    description: 'The deployment that was live before the redeploy; the rollback target.'
    value: ${{ steps.railway-capture.outputs.previous_deployment_id }}
  deployment_id:
    description: 'The deployment this action created and waited on.'
    value: ${{ steps.railway-wait.outputs.deployment_id }}
runs:
  using: composite
  steps:
    - name: Validate Railway redeploy identity
      id: railway-validate
      shell: bash
      env:
        EXPECTED_IMAGE: ${{ inputs.expected-image }}
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
        RAILWAY_SERVICE_ID: ${{ inputs.service-id }}
        SERVICE_LABEL: ${{ inputs.service-label }}
      run: |
        set -euo pipefail
        NORMALIZED_RAILWAY_SERVICE_ID="${RAILWAY_SERVICE_ID,,}"
        if ! [[ "$NORMALIZED_RAILWAY_SERVICE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
          echo "::error::Railway service id must be a UUID."
          exit 1
        fi
        if [ -z "$EXPECTED_IMAGE" ] || [[ "$EXPECTED_IMAGE" =~ [[:space:]] ]]; then
          echo "::error::expected-image must be a non-empty image reference without whitespace."
          exit 1
        fi
        if [ -z "${RAILWAY_TOKEN//[[:space:]]/}" ]; then
          echo "::error::railway-token is required."
          exit 1
        fi
        if ! [[ "$SERVICE_LABEL" =~ ^[A-Za-z0-9._\ -]{1,40}$ ]]; then
          echo "::error::service-label contains unsupported characters."
          exit 1
        fi
        printf 'service_id=%s\n' "$NORMALIZED_RAILWAY_SERVICE_ID" >> "$GITHUB_OUTPUT"

    - name: Install Railway CLI
      shell: bash
      # Pinned: 4.66.1 added a GraphQL field Railway rejects. Install the
      # immutable upstream binary directly: the npm package runs floating
      # postinstall dependencies before it downloads an unchecked binary.
      # Verified in railwayapp/cli's v4.66.0 src/commands/redeploy.rs:
      # `--from-source` is present and that JSON path returns only {"success":true}.
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS:$RUNNER_ARCH" != "Linux:X64" ]; then
          echo "::error::The pinned Railway CLI asset supports only Linux X64 runners."
          exit 1
        fi

        RAILWAY_CLI_DIR=$(mktemp -d "$RUNNER_TEMP/railway-cli.XXXXXX")
        RAILWAY_CLI_ARCHIVE="$RAILWAY_CLI_DIR/railway.tar.gz"
        RAILWAY_CLI_BIN_DIR="$RAILWAY_CLI_DIR/bin"
        RAILWAY_CLI_URL="https://github.com/railwayapp/cli/releases/download/v4.66.0/railway-v4.66.0-x86_64-unknown-linux-gnu.tar.gz"
        RAILWAY_CLI_SHA256="31ca04094bee7cb4eaf7a14e0d856dae3cf4ee6c8b2b8354e652968c5d20abfe"

        curl --fail --silent --show-error --location \
          --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
          --output "$RAILWAY_CLI_ARCHIVE" "$RAILWAY_CLI_URL"
        printf '%s  %s\n' "$RAILWAY_CLI_SHA256" "$RAILWAY_CLI_ARCHIVE" \
          | sha256sum --check --strict
        mkdir -p "$RAILWAY_CLI_BIN_DIR"
        tar --extract --gzip --file "$RAILWAY_CLI_ARCHIVE" \
          --directory "$RAILWAY_CLI_BIN_DIR" --no-same-owner --no-same-permissions
        if [ ! -x "$RAILWAY_CLI_BIN_DIR/railway" ]; then
          echo "::error::Verified Railway CLI archive did not contain an executable."
          exit 1
        fi
        if [ "$("$RAILWAY_CLI_BIN_DIR/railway" --version)" != "railway 4.66.0" ]; then
          echo "::error::Verified Railway CLI binary reported an unexpected version."
          exit 1
        fi
        echo "$RAILWAY_CLI_BIN_DIR" >> "$GITHUB_PATH"

    - name: Capture the last-known-good Railway deployment
      id: railway-capture
      shell: bash
      env:
        EXPECTED_IMAGE: ${{ inputs.expected-image }}
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
        RAILWAY_SERVICE_ID: ${{ steps.railway-validate.outputs.service_id }}
      run: |
        set -euo pipefail
        RAILWAY_STATE_DIR=$(mktemp -d "$RUNNER_TEMP/railway-redeploy.XXXXXX")
        CAPTURE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

        for attempt in 1 2 3; do
          if timeout 30s railway deployment list \
            --service "$RAILWAY_SERVICE_ID" \
            --limit 100 \
            --json > "$RAILWAY_STATE_DIR/before.json" \
            && node scripts/railway-deployment-status.mjs capture-previous \
              "$RAILWAY_STATE_DIR/before.json" > "$RAILWAY_STATE_DIR/before.env"; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::Could not capture and validate the last-known-good Railway deployment."
            exit 1
          fi
          sleep 2
        done

        # shellcheck source=/dev/null
        . "$RAILWAY_STATE_DIR/before.env"
        {
          echo "previous_deployment_id=$PREVIOUS_DEPLOYMENT_ID"
          echo "baseline_deployment_ids=$BASELINE_DEPLOYMENT_IDS"
          echo "capture_started_at=$CAPTURE_STARTED_AT"
          echo "state_dir=$RAILWAY_STATE_DIR"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Railway baseline captured at $CAPTURE_STARTED_AT; previous=$PREVIOUS_DEPLOYMENT_ID; baseline=$BASELINE_DEPLOYMENT_IDS"

    # `--from-source` is load-bearing for image-backed services: without it,
    # Railway redeploys the prior snapshot and never re-resolves the freshly
    # moved :production tag. Do not swallow a timeout or malformed response:
    # Railway may have accepted an ambiguous request, and guessing which later
    # deployment it created could roll back somebody else's manual deploy.
    - name: Trigger Railway redeploy from the configured image source
      id: railway-trigger
      shell: bash
      env:
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
        RAILWAY_SERVICE_ID: ${{ steps.railway-validate.outputs.service_id }}
        RAILWAY_STATE_DIR: ${{ steps.railway-capture.outputs.state_dir }}
      run: |
        set -euo pipefail
        if timeout 60s railway redeploy \
          --service "$RAILWAY_SERVICE_ID" \
          --yes \
          --from-source \
          --json > "$RAILWAY_STATE_DIR/trigger.json"; then
          :
        else
          railway_trigger_status=$?
          echo "::error::Railway redeploy trigger failed or timed out and may have been accepted; no automatic rollback was attempted. Reconcile the service in Railway before retrying."
          exit "$railway_trigger_status"
        fi
        node -e '
          const { readFileSync } = require("node:fs");
          let payload = null;
          try {
            payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
          } catch {}
          if (!payload || payload.success !== true || Object.keys(payload).length !== 1) {
            console.error("::error::Railway redeploy did not return the reviewed success acknowledgement; trigger acceptance is ambiguous and no automatic rollback was attempted. Reconcile the service in Railway before retrying.");
            process.exit(1);
          }
        ' "$RAILWAY_STATE_DIR/trigger.json"

    - name: Lock and verify the exact new Railway deployment
      id: railway-wait
      continue-on-error: true
      shell: bash
      env:
        BASELINE_DEPLOYMENT_IDS: ${{ steps.railway-capture.outputs.baseline_deployment_ids }}
        EXPECTED_IMAGE: ${{ inputs.expected-image }}
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
        RAILWAY_SERVICE_ID: ${{ steps.railway-validate.outputs.service_id }}
        RAILWAY_STATE_DIR: ${{ steps.railway-capture.outputs.state_dir }}
        CAPTURE_STARTED_AT: ${{ steps.railway-capture.outputs.capture_started_at }}
      run: |
        set -euo pipefail
        LOCKED_DEPLOYMENT_ID=""
        OBSERVED_CANCELLED_DEPLOYMENT_ID=""
        CONSECUTIVE_READ_ERRORS=0
        SUCCESS_CONFIRMATIONS=0
        echo "automatic_recovery_safe=false" >> "$GITHUB_OUTPUT"

        for attempt in {1..90}; do
          if ! timeout 30s railway deployment list \
            --service "$RAILWAY_SERVICE_ID" \
            --limit 100 \
            --json > "$RAILWAY_STATE_DIR/current.json"; then
            SUCCESS_CONFIRMATIONS=0
            CONSECUTIVE_READ_ERRORS=$((CONSECUTIVE_READ_ERRORS + 1))
            if [ "$CONSECUTIVE_READ_ERRORS" -ge 3 ]; then
              if [ -n "$LOCKED_DEPLOYMENT_ID" ]; then
                echo "automatic_recovery_safe=true" >> "$GITHUB_OUTPUT"
              fi
              echo "::error::Railway deployment list failed three consecutive times."
              exit 1
            fi
            sleep 10
            continue
          fi

          CURRENT_ID=""
          CURRENT_STATUS=""
          CURRENT_CREATED_AT=""
          CURRENT_IMAGE=""
          CANCELLATION_QUARANTINE_REQUESTED=false
          export LOCKED_DEPLOYMENT_ID OBSERVED_CANCELLED_DEPLOYMENT_ID
          FIND_NEW_FAILED=false
          if ! node scripts/railway-deployment-status.mjs find-new \
            "$RAILWAY_STATE_DIR/current.json" > "$RAILWAY_STATE_DIR/current.env"; then
            FIND_NEW_FAILED=true
          fi

          if [ -s "$RAILWAY_STATE_DIR/current.env" ]; then
            # shellcheck source=/dev/null
            . "$RAILWAY_STATE_DIR/current.env"
          fi
          if [ "$FIND_NEW_FAILED" = true ]; then
            if [ "$CANCELLATION_QUARANTINE_REQUESTED" = true ]; then
              SUCCESS_CONFIRMATIONS=0
              CONSECUTIVE_READ_ERRORS=$((CONSECUTIVE_READ_ERRORS + 1))
              if [ "$CONSECUTIVE_READ_ERRORS" -ge 3 ]; then
                echo "::error::Railway cancellation remained quarantined; reconcile manually."
                exit 1
              fi
              sleep 10
              continue
            fi
            echo "::error::Railway deployment identity validation failed; reconcile manually."
            exit 1
          fi

          if [ -n "$CURRENT_ID" ] && [ -z "$LOCKED_DEPLOYMENT_ID" ]; then
            LOCKED_DEPLOYMENT_ID=$CURRENT_ID
            # Clear any quarantine the earlier polls recorded: find-new resolved
            # a superseded cancellation to its live successor, and the two
            # states cannot coexist on the next call.
            OBSERVED_CANCELLED_DEPLOYMENT_ID=""
            echo "deployment_id=$LOCKED_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          fi

          CONSECUTIVE_READ_ERRORS=0
          echo "Attempt ${attempt}: deployment=${CURRENT_ID:-unknown} status=${CURRENT_STATUS:-unknown}"

          case "$CURRENT_STATUS" in
            SUCCESS)
              SUCCESS_CONFIRMATIONS=$((SUCCESS_CONFIRMATIONS + 1))
              if [ "$SUCCESS_CONFIRMATIONS" -ge 3 ]; then
                exit 0
              fi
              ;;
            INITIALIZING|NEEDS_APPROVAL|QUEUED|BUILDING|DEPLOYING|WAITING|'')
              SUCCESS_CONFIRMATIONS=0
              ;;
            CANCELED|CANCELLED)
              echo "::error::Railway cancelled the locked deployment; automatic rollback is suppressed because a successor may not be visible yet."
              exit 1
              ;;
            FAILED|CRASHED|REMOVED|REMOVING|SKIPPED|SLEEPING)
              echo "automatic_recovery_safe=true" >> "$GITHUB_OUTPUT"
              echo "::error::Railway deployment reached terminal status $CURRENT_STATUS."
              exit 1
              ;;
            *)
              echo "::error::Railway deployment returned an unknown status."
              exit 1
              ;;
          esac

          sleep 10
        done

        echo "::error::Railway deployment did not reach SUCCESS in time."
        if [ -n "$LOCKED_DEPLOYMENT_ID" ]; then
          echo "automatic_recovery_safe=true" >> "$GITHUB_OUTPUT"
        fi
        exit 1

    - name: Restore the captured Railway deployment after redeploy failure
      if: >-
        steps.railway-wait.outcome == 'failure'
        && steps.railway-wait.outputs.deployment_id != ''
        && steps.railway-wait.outputs.automatic_recovery_safe == 'true'
      id: railway-rollback
      uses: ./.github/actions/railway-rollback
      with:
        service-id: ${{ steps.railway-validate.outputs.service_id }}
        railway-token: ${{ inputs.railway-token }}
        service-label: ${{ inputs.service-label }}
        target-deployment-id: ${{ steps.railway-capture.outputs.previous_deployment_id }}
        expected-current-deployment-id: ${{ steps.railway-wait.outputs.deployment_id }}

    - name: Fail after verified Railway recovery
      if: always() && steps.railway-wait.outcome == 'failure'
      shell: bash
      env:
        AUTOMATIC_RECOVERY_SAFE: ${{ steps.railway-wait.outputs.automatic_recovery_safe }}
        ROLLBACK_OUTCOME: ${{ steps.railway-rollback.outcome }}
      run: |
        if [ "$AUTOMATIC_RECOVERY_SAFE" != "true" ]; then
          echo "::error::Railway redeploy identity is ambiguous; no automatic rollback was attempted. Follow the reconciliation runbook."
        elif [ "$ROLLBACK_OUTCOME" = "success" ]; then
          echo "::error::Railway redeploy failed; verified automatic rollback restored the captured last-known-good deployment."
        else
          echo "::error::Railway redeploy failed and automatic recovery was not verified. Follow the reconciliation runbook."
        fi
        exit 1
