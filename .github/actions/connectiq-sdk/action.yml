name: Connect IQ SDK
description: Install the Connect IQ SDK and the requested device profiles, and put monkeyc on PATH.

# Why we download instead of pulling a prebaked image:
#
# The Connect IQ SDK licence (section 3) forbids "rent, lease, lend, upload to
# or host on any website or server, sell, redistribute, or sublicense the SDK
# ... or to enable others to do so". A public GHCR image would breach that
# outright and a private one is not clearly permitted. Garmin also gates every
# device profile behind an account login and offers no scoped API token -- unlike
# App Store Connect -- so CI signs in as a dedicated Garmin account that exists
# only for this. Nothing is redistributed; we fetch our own copy per run.

inputs:
  sdk-version:
    description: Connect IQ SDK version, e.g. 9.2.0
    required: true
  sdk-manager-version:
    description: lindell/connect-iq-sdk-manager-cli release, e.g. 0.8.4
    required: true
  agreement-hash:
    description: SDK agreement acceptance hash from `connect-iq-sdk-manager agreement view`
    required: true
  devices:
    description: Comma-separated product ids to download profiles for
    required: true
  garmin-username:
    description: Garmin account used only to download the SDK
    required: true
  garmin-password:
    description: Password for that account
    required: true

runs:
  using: composite
  steps:
    - name: Check the Garmin environment is configured
      # Without this the first symptom of a missing `Garmin` environment is
      # `gzip: stdin: unexpected end of file` from a 404 on a URL built out of
      # empty version strings -- which says nothing about the actual cause.
      # Name what is missing instead.
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
        SDK_MANAGER_VERSION: ${{ inputs.sdk-manager-version }}
        AGREEMENT_HASH: ${{ inputs.agreement-hash }}
        GARMIN_USERNAME: ${{ inputs.garmin-username }}
        GARMIN_PASSWORD: ${{ inputs.garmin-password }}
      run: |
        set -Eeuo pipefail
        missing=()
        [ -n "$SDK_VERSION" ]         || missing+=('vars.CIQ_SDK_VERSION')
        [ -n "$SDK_MANAGER_VERSION" ] || missing+=('vars.CIQ_SDK_MANAGER_VERSION')
        [ -n "$AGREEMENT_HASH" ]      || missing+=('vars.CIQ_AGREEMENT_HASH')
        [ -n "$GARMIN_USERNAME" ]     || missing+=('secrets.GARMIN_USERNAME')
        [ -n "$GARMIN_PASSWORD" ]     || missing+=('secrets.GARMIN_PASSWORD')
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::The Garmin environment is not configured. Missing: ${missing[*]}. Set them on the 'Garmin' GitHub Environment -- see docs/garmin-sideload-build.md, 'Configuration contract'."
          exit 1
        fi

    - name: Restore the SDK and device profiles
      id: sdk_cache
      uses: actions/cache@v4
      with:
        # Only the SDK and device payloads. The CLI's config file -- which holds
        # a live Garmin session token after `login` -- is deliberately kept in
        # $RUNNER_TEMP instead, because caches are restorable by fork PRs from
        # the base branch and a cached token would hand them our session.
        path: ~/.Garmin/ConnectIQ
        key: ciq-${{ runner.os }}-${{ inputs.sdk-version }}-${{ hashFiles('garmin/manifest.xml') }}-${{ inputs.devices }}

    - name: Download the SDK and device profiles
      if: steps.sdk_cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GARMIN_USERNAME: ${{ inputs.garmin-username }}
        GARMIN_PASSWORD: ${{ inputs.garmin-password }}
        SDK_VERSION: ${{ inputs.sdk-version }}
        SDK_MANAGER_VERSION: ${{ inputs.sdk-manager-version }}
        AGREEMENT_HASH: ${{ inputs.agreement-hash }}
        DEVICES: ${{ inputs.devices }}
      run: |
        set -Eeuo pipefail
        # Asset names are `connect-iq-sdk-manager-cli_<ver>_Linux_x86_64.tar.gz`
        # (note the -cli suffix and the capitalised OS) and the tarball holds the
        # binary as `connect-iq-sdk-manager` at its root.
        curl -fsSL \
          "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${SDK_MANAGER_VERSION}/connect-iq-sdk-manager-cli_${SDK_MANAGER_VERSION}_Linux_x86_64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP" connect-iq-sdk-manager
        ciq_bin="$RUNNER_TEMP/connect-iq-sdk-manager"
        ciq_config="$RUNNER_TEMP/ciq-config.yaml"
        # --config errors out if the file does not already exist ("no such file
        # or directory"), so create it before the first call rather than letting
        # every command fail on it.
        : > "$ciq_config"
        # A function, not a string expanded unquoted: the latter word-splits on
        # anything in the paths and silently mangles arguments.
        ciq() { "$ciq_bin" --config "$ciq_config" "$@"; }

        # Accepting by hash is the non-interactive path. Re-read the agreement and
        # refresh this hash whenever Garmin revises it -- a stale hash fails here
        # rather than silently accepting something nobody read.
        #
        # The flag is --agreement-hash (-H). It is NOT --acceptance-hash, which
        # upstream prose calls it in places and which v0.8.4 rejects outright as
        # an unknown flag.
        ciq agreement accept --agreement-hash="$AGREEMENT_HASH"

        # The CLI reads GARMIN_USERNAME / GARMIN_PASSWORD (its `login --help`
        # documents both), but without usable credentials it falls back to an
        # interactive Garmin SSO flow. Measured against v0.8.4: that flow does
        # NOT exit on EOF -- it was still running after three minutes with stdin
        # closed -- so `timeout` is the part actually doing the work here and
        # </dev/null is only belt and braces. Without it a bad secret would burn
        # the entire job timeout and log nothing useful.
        if ! timeout 180 "$ciq_bin" --config "$ciq_config" login </dev/null; then
          echo "::error::Garmin login failed. Check GARMIN_USERNAME / GARMIN_PASSWORD on the 'Garmin' environment -- the CLI cannot complete its interactive SSO fallback in CI."
          exit 1
        fi

        ciq sdk download "$SDK_VERSION"
        # --device is a pflag string slice, so one comma-separated value is
        # parsed into several devices (verified against v0.8.4: it gets past
        # parsing to the auth check).
        ciq device download --device "$DEVICES"

        # The config holds a live session token. It is outside every cached path,
        # but drop it as soon as the downloads are done anyway.
        shred -u "$RUNNER_TEMP/ciq-config.yaml" 2>/dev/null || rm -f "$RUNNER_TEMP/ciq-config.yaml"

    - name: Put monkeyc on PATH
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        set -Eeuo pipefail
        sdks="$HOME/.Garmin/ConnectIQ/Sdks"
        # Resolved by glob rather than `connect-iq-sdk-manager sdk current-path`,
        # because that reads the config we just destroyed -- and on a cache hit
        # the CLI was never downloaded at all.
        #
        # Matched on the REQUESTED version (directories are named
        # connectiq-sdk-<os>-<version>-<date>-<hash>), so a stale SDK left beside
        # it cannot be picked up by accident. `sort | tail -1` then makes the
        # choice between same-version builds deterministic rather than whatever
        # order find happened to walk.
        sdk_root="$(find "$sdks" -maxdepth 1 -type d -name "connectiq-sdk-*-${SDK_VERSION}-*" 2>/dev/null | sort | tail -1)"
        if [ -z "$sdk_root" ] || [ ! -x "$sdk_root/bin/monkeyc" ]; then
          echo "::error::no Connect IQ SDK $SDK_VERSION under $sdks"
          echo "present: $(ls "$sdks" 2>/dev/null | tr '\n' ' ')"
          exit 1
        fi
        echo "$sdk_root/bin" >> "$GITHUB_PATH"

        # Belt and braces: the directory name says one version, the compiler is
        # the authority. A mismatch would compile silently against the wrong
        # Toybox.
        installed="$("$sdk_root/bin/monkeyc" --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        echo "Connect IQ compiler $installed (requested $SDK_VERSION)"
        if [ "$installed" != "$SDK_VERSION" ]; then
          echo "::error::SDK at $sdk_root reports $installed but $SDK_VERSION was requested"
          exit 1
        fi
